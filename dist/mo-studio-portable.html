                  "</select></label>" +
                  (voices.length
                     ? ""
                     : '<p class="sh-note">Aucune voix chinoise détectée. Installe une voix « Chinois (Chine) » dans ton système pour activer l\'audio.</p>') +
                  "</section>" +
                  '<section class="settings-group" aria-labelledby="settings-data-title">' +
                  '<div class="eyebrow" id="settings-data-title">Données</div>' +
                  '<p class="sh-note settings-group-help">Sauvegarde ou recharge tes mots et packs personnels.</p>' +
                  '<div class="sh-btns settings-data-actions">' +
                  '<button class="btn" id="st-import">Importer</button>' +
                  '<button class="btn" id="st-export">Exporter</button>' +
                  '<button class="btn ghost" id="st-format">Voir le format JSON</button>' +
                  '<button class="btn ghost" id="st-dictionary-sources">Sources du dictionnaire</button>' +
                  "</div>" +
                  (backup
                     ? '<button class="btn wide" id="st-restore">Restaurer la sauvegarde du ' +
                       fmtDate(backup.ts) +
                       "</button>"
                     : "") +
                  "</section>" +
                  '<section class="settings-group settings-danger-zone" aria-labelledby="settings-danger-title">' +
                  '<div class="eyebrow" id="settings-danger-title">Zone dangereuse</div>' +
                  '<p class="sh-note settings-group-help">Supprime tes cartes, packs et progression. Une sauvegarde de secours est créée automatiquement et restera restaurable ici.</p>' +
                  '<button class="btn danger wide" id="st-reset">Tout effacer</button>' +
                  "</section>" +
                  '<button class="btn ghost wide settings-close" id="st-close">Fermer</button>',
            );
            document.querySelectorAll("#st-py .chip").forEach(
               (b) =>
                  (b.onclick = () => {
                     s.pinyin = b.dataset.py;
                     save();
                     document
                        .querySelectorAll("#st-py .chip")
                        .forEach((x) =>
                           x.setAttribute(
                              "aria-pressed",

                        );
                  }),
            );
            $("st-col").onchange = (e) => {
               s.toneColors = e.target.checked;
               save();
            };
            $("st-rate").oninput = (e) => {
               s.rate = +e.target.value;
               $("rate-lab").textContent = s.rate.toFixed(2) + "×";
               save();
            };
            $("st-voice").onchange = (e) => {
               s.voice = e.target.value;
               save();
               speak("你好");
            };
            ["wm-py", "wm-fr", "wm-tr"].forEach((id) => {
               $(id).onchange = () => {
                  const py = $("wm-py").checked,
                     fr = $("wm-fr").checked,
                     tr = $("wm-tr").checked;
                  if (!py && !fr && !tr) {
                     $(id).checked = true;
                     toast("Garde au moins un type d'exercice écrit.");
                     return;
                  }
                  s.writeModes = { pinyin: py, fr: fr, trace: tr };
                  save();
               };
            });
            $("st-export").onclick = exportData;
            $("st-import").onclick = () => $("file-global").click();
            $("st-format").onclick = openFormatSheet;
            $("st-dictionary-sources").onclick = openDictionarySources;
            if ($("st-restore"))
               $("st-restore").onclick = () => {
                  const b = getBackup();
                  if (!b) {
                     toast("Aucune sauvegarde trouvée.");
                     return;
                  }
                  if (
                     !confirm(
                        "Restaurer la sauvegarde du " +
                           fmtDate(b.ts) +
                           " ? Ta collection actuelle sera remplacée.",
                     )
                  )
                     return;
                  db.cards = b.cards
                     .map((c) => normalizeCard(c, true))
                     .filter(Boolean);
                  db.packs = Array.isArray(b.packs) ? b.packs : [];
                  db.categories = Array.isArray(b.categories) ? b.categories : [];
                  db.memberships = Array.isArray(b.memberships) ? b.memberships : [];
                  db.units =
                     b.units && typeof b.units === "object" ? b.units : {};
                  session = { active: false };
                  clearSavedSession();
                  invalidateDictIndex();
                  save();
                  closeSheet();
                  refreshActive();
                  toast("Sauvegarde restaurée.");
               };
            $("st-reset").onclick = () => {
               if (
                  !confirm(
                     "Tout effacer ? Cartes, packs et progression seront supprimés (réglages conservés).\nUne sauvegarde sera gardée, restaurable depuis les réglages.",
                  )
               )
                  return;
               makeBackup();
               db.cards = [];
               db.packs = [];
               db.categories = [];
               db.memberships = [];
               db.units = {};
               hub = {
                  flt: "all",
                  pack: "",
                  cat: "",
                  includeAcquired: false,
                  freeOpen: false,
               };
               session = { active: false };
               clearSavedSession();
               invalidateDictIndex();
               save();
               closeSheet();
               refreshActive();
               toast(
                  "Collection effacée (sauvegarde disponible dans les réglages).",

"use strict";

/* ================= import / export ================= */
         function exportData() {
            const data = {
               app: "mo-studio",
               version: 3,
               exported: new Date().toISOString(),
               units: db.units,
               cards: db.cards,
               packs: db.packs,
               categories: db.categories,
               memberships: db.memberships,
               settings: db.settings,
               courseProgress: courseProgress,
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {
               type: "application/json",
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mo-studio-export.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            toast("Export téléchargé.");
         }
         function openImportSheet(data) {
            if (
               data &&
               typeof data === "object" &&
               (data.pack || (Array.isArray(data.packs) && data.packs.some((pack) => Array.isArray(pack.categories))))
            ) {
               openSheet('<h3 class="sh-t">Analyse de la sauvegarde</h3><p class="sh-p">Préparation d’un aperçu non destructif…</p><div class="import-loading"></div>');
               buildPackImportPreview(data, "json")
                  .then(openPackImportPreview)
                  .catch((error) => toast(error.message));
               return;
            }
            const rawCards = Array.isArray(data)
               ? data
               : Array.isArray(data.cards)
                 ? data.cards
                 : [];
            const incoming = rawCards
               .map((c) => normalizeCard(c, false))
               .filter(Boolean);
            if (!incoming.length) {
               toast(
                  "Aucune carte valide dans ce fichier (hz et fr obligatoires).",
               );
               return;
            }
            const name =
               !Array.isArray(data) && typeof data.name === "string"
                  ? data.name.trim()
                  : "";
            const existing = new Set(db.cards.map(cardKey));
            const fresh = incoming.filter((c) => !existing.has(cardKey(c)));
            const dupN = incoming.length - fresh.length;
            openSheet(
               '<h3 class="sh-t">Importer ' +
                  incoming.length +
                  " carte" +
                  (incoming.length > 1 ? "s" : "") +
                  "</h3>" +
                  '<p class="sh-p">' +
                  fresh.length +
                  " nouvelle" +
                  (fresh.length > 1 ? "s" : "") +
                  " · " +
                  dupN +
                  " déjà présente" +
                  (dupN > 1 ? "s" : "") +
                  " (mêmes 汉字 + pinyin).</p>" +
                  (name
                     ? '<label class="ck"><input type="checkbox" id="im-pack" checked> Créer / compléter le pack « ' +
                       esc(name) +
                       " »</label>"
                     : "") +
                  '<div class="sh-btns">' +
                  '<button class="btn primary" id="im-merge">Fusionner</button>' +
                  '<button class="btn danger" id="im-replace">Remplacer tout</button>' +
                  '<button class="btn ghost" id="im-cancel">Annuler</button>' +
                  "</div>" +
                  '<p class="sh-note">« Fusionner » ajoute seulement les nouvelles cartes. « Remplacer tout » écrase cartes et packs (réglages conservés, sauvegarde automatique avant).</p>',
            );
            $("im-cancel").onclick = closeSheet;
            $("im-merge").onclick = () =>
               doImport(data, incoming, fresh, name, false);
            $("im-replace").onclick = () => {
               if (
                  confirm(
                     "Remplacer toute ta collection ? (une sauvegarde sera gardée)",
                  )
               )
                  doImport(data, incoming, fresh, name, true);
            };
         }
         function doImport(data, incoming, fresh, name, replace) {
            const wantPack = !!(name && $("im-pack") && $("im-pack").checked);
            session = { active: false };
            clearSavedSession();
            hub.pack = "";
            hub.cat = "";
            const inUnits =
               !Array.isArray(data) &&
               data.units &&
               typeof data.units === "object" &&
               !Array.isArray(data.units)
                  ? data.units
                  : null;
            const incomingCourseProgress =
               !Array.isArray(data) && data.courseProgress && typeof data.courseProgress === "object"
                  ? data.courseProgress
                  : null;
            const incomingCompletedLessons =
               incomingCourseProgress &&
               incomingCourseProgress.completedLessons &&
               typeof incomingCourseProgress.completedLessons === "object" &&
               !Array.isArray(incomingCourseProgress.completedLessons)
                  ? incomingCourseProgress.completedLessons
                  : null;
            if (replace) {
               makeBackup();
               const raw = Array.isArray(data)
                  ? incoming
                  : Array.isArray(data.cards)
                    ? data.cards
                    : incoming;
               let cards = raw
                  .map((c) => normalizeCard(c, true))
                  .filter(Boolean);
               const seen = new Set();
               cards = cards.filter((c) => {
                  const k = cardKey(c);
                  if (seen.has(k)) return false;
                  seen.add(k);
                  return true;
               });
               db.cards = cards;
               const ids = new Set(cards.map((c) => c.id));
               db.packs =
                  !Array.isArray(data) && Array.isArray(data.packs)
                     ? data.packs
                          .filter(
                             (p) => p && p.name && Array.isArray(p.cardIds),
                          )
                          .map((p) => ({
                             id: String(p.id || uid()),
                             name: String(p.name),
                             cardIds: p.cardIds.filter((i) => ids.has(i)),
                          }))
                     : [];
               db.categories =
                  !Array.isArray(data) && Array.isArray(data.categories)
                     ? data.categories.filter((category) => category && category.id && category.packId && category.name)
                     : [];
               db.memberships =
                  !Array.isArray(data) && Array.isArray(data.memberships)
                     ? data.memberships.filter((membership) => membership && membership.cardId && membership.categoryId)
                     : [];
               db.units = inUnits || {};
               courseProgress = incomingCompletedLessons
                  ? {
                       version: 2,
                       completedLessons: incomingCompletedLessons,
                       scope: validCourseProgressScope(incomingCourseProgress.scope)
                          ? incomingCourseProgress.scope
                          : emptyCourseProgress().scope,
                    }
                  : emptyCourseProgress();
               saveCourseProgress();
            } else {
               db.cards = db.cards.concat(fresh);
               if (inUnits) db.units = Object.assign({}, db.units, inUnits);
               if (incomingCompletedLessons) {
                  courseProgress.completedLessons = Object.assign(
                     {},
                     courseProgress.completedLessons,
                     incomingCompletedLessons,
                  );
                  saveCourseProgress();
               }
            }
            const added = replace ? db.cards.length : fresh.length;
            if (wantPack) {
               const byKey = new Map(db.cards.map((c) => [cardKey(c), c.id]));
               const idsForPack = incoming
                  .map((c) => byKey.get(cardKey(c)))
                  .filter(Boolean);
               upsertPack(name, idsForPack);
            }
            invalidateDictIndex();
            save();
            closeSheet();
            refreshActive();
            toast(
               replace
                  ? "Collection remplacée (" + added + " cartes)."
                  : added
                    ? added +
                      " carte" +
                      (added > 1 ? "s" : "") +
                      " ajoutée" +
                      (added > 1 ? "s" : "") +
                      "."
                    : "Rien à ajouter — tout existait déjà.",
            );
         }
         const FORMAT_CARD_EXAMPLE =
            '{\n  "chinese": "你好",\n  "pinyin": "nǐ hǎo",\n  "translation": "bonjour"\n}';
         const FORMAT_PACK_EXAMPLE = PACK_JSON_EXAMPLE;

         async function copyFormatExample() {
            try {
               if (!navigator.clipboard || !navigator.clipboard.writeText)
                  throw new Error("Clipboard unavailable");
               await navigator.clipboard.writeText(FORMAT_PACK_EXAMPLE);
               toast("Exemple copié.");
            } catch (error) {
               toast("Copie impossible ici — sélectionne le texte à la main.");
            }
         }

         function openFormatSheet() {
            openSheet(
               '<h3 class="sh-t">Format JSON des packs</h3>' +
                  '<p class="sh-p">Chaque mot demande uniquement <code>chinese</code>. <code>pinyin</code>, <code>translation</code>, <code>notes</code>, <code>favorite</code>, <code>difficult</code> et <code>tags</code> sont optionnels. Les données manquantes sont recherchées dans le dictionnaire sans jamais être inventées.</p>' +
                  '<div class="eyebrow">Exemple minimal valide</div>' +
                  '<pre class="fmt" id="fmt-card-example">' +
                  esc(FORMAT_CARD_EXAMPLE) +
                  "</pre>" +
                  '<p class="sh-p">Un pack contient des <code>categories</code>, chacune avec un tableau <code>words</code>. Le format historique reste accepté depuis Réglages → Données.</p>' +
                  '<div class="eyebrow">Exemple de pack</div>' +
                  '<pre class="fmt" id="fmt-pack-example">' +
                  esc(FORMAT_PACK_EXAMPLE) +
                  "</pre>" +
                  '<div class="sh-btns">' +
                  '<button class="btn" id="fmt-copy">Copier l\'exemple</button>' +
                  '<button class="btn ghost" id="fmt-close" data-sheet-close>Fermer</button>' +
                  "</div>",

"use strict";

/* ================= sheet & toast ================= */
         let sheetReturnFocus = null;
         let sheetAbortController = null;
         let sheetScrollPosition = { x: 0, y: 0 };
         let sheetPreviousBodyOverflow = "";
         function requestSheetClose() {
            if (
               typeof activeView !== "undefined" &&
               activeView === "search" &&
               history.state &&
               history.state.moStudioSearch &&
               history.state.mode === "detail" &&
               typeof closeSearchDictionaryDetail === "function"
            )
               closeSearchDictionaryDetail();
            else closeSheet();
         }
         function openSheet(html) {
            if (typeof destroyStrokeWorkspace === "function") destroyStrokeWorkspace();
            const o = $("sheet");
            const wasOpen = o.classList.contains("open");
            if (!wasOpen) {
               sheetReturnFocus = document.activeElement;
               sheetScrollPosition = { x: window.scrollX, y: window.scrollY };
               sheetPreviousBodyOverflow = document.body.style.overflow;
            }
            if (sheetAbortController) sheetAbortController.abort();
            sheetAbortController = new AbortController();
            const signal = sheetAbortController.signal;
            o.querySelector(".sheet-card").innerHTML = html;
            o.classList.add("open");
            o.setAttribute("aria-hidden", "false");
            o.setAttribute("role", "dialog");
            o.setAttribute("aria-modal", "true");
            o.removeAttribute("aria-label");
            o.removeAttribute("aria-labelledby");
            const heading = o.querySelector("h1, h2, h3, .cd-hz, .dictionary-loading b");
            if (heading) {
               heading.id = heading.id || "mo-sheet-title";
               o.setAttribute("aria-labelledby", heading.id);
            } else {
               o.setAttribute("aria-label", "Dialogue Mò Studio");
            }
            document.querySelectorAll(".top, #view, .nav").forEach((element) => {
               element.inert = true;
            });
            document.body.style.overflow = "hidden";
            o.addEventListener("click", (event) => {
               if (event.target === o || event.target.closest("[data-sheet-close]"))
                  requestSheetClose();
            }, { signal });
            document.addEventListener("keydown", (event) => {
               if (event.key !== "Escape" || !sheetOpen()) return;
               event.preventDefault();
               event.stopImmediatePropagation();
               requestSheetClose();
            }, { signal });
            const focusSheet = () => {
               const focusTarget =
                  o.querySelector("[data-sheet-close]") ||
                  o.querySelector(
                     "button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])",
                  );
               if (focusTarget) focusTarget.focus({ preventScroll: true });
            };
            focusSheet();
            requestAnimationFrame(focusSheet);
         }
         function closeSheet() {
            if (typeof destroyStrokeWorkspace === "function") destroyStrokeWorkspace();
            const o = $("sheet");
            if (!o.classList.contains("open")) return;
            if (sheetAbortController) sheetAbortController.abort();
            sheetAbortController = null;
            o.classList.remove("open");
            o.setAttribute("aria-hidden", "true");
            o.removeAttribute("role");
            o.removeAttribute("aria-modal");
            o.removeAttribute("aria-label");
            o.removeAttribute("aria-labelledby");
              document.querySelectorAll(".top, #view, .nav").forEach((element) => {
                 element.inert = false;
              });
              document.body.style.overflow = sheetPreviousBodyOverflow;
              o.querySelector(".sheet-card").innerHTML = "";
              window.scrollTo(sheetScrollPosition.x, sheetScrollPosition.y);
              if (sheetReturnFocus && sheetReturnFocus.isConnected)
               sheetReturnFocus.focus({ preventScroll: true });
            sheetReturnFocus = null;
         }
         const sheetOpen = () => $("sheet").classList.contains("open");
         let toastTimer = null;
         function toast(msg) {
            const t = $("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
         }

"use strict";

/* ================= initialisation ================= */
         async function init() {
            await personalLibraryInit();
            refreshVoices();
            document
               .querySelectorAll(".nav button")
               .forEach((b) => (b.onclick = () => setView(b.dataset.view)));
            $("btn-settings").onclick = openSettings;
            // audio : tout élément portant data-say est cliquable
            document.addEventListener("click", (e) => {
               const el = e.target.closest("[data-say]");
               if (el) speak(el.getAttribute("data-say"));
            });
            // import de fichier
            $("file-global").addEventListener("change", (e) => {
               const f = e.target.files[0];
               e.target.value = "";
               if (!f) return;
               const r = new FileReader();
               r.onload = () => {
                  try {
                     openImportSheet(JSON.parse(r.result));
                  } catch (err) {
                     toast("Fichier JSON invalide.");
                  }
               };
               r.onerror = () => toast("Impossible de lire le fichier.");
               r.readAsText(f);
            });
            // raccourcis clavier
            document.addEventListener("keydown", (e) => {
               if (sheetOpen()) {
                  const tag = (e.target.tagName || "").toLowerCase();
                  const editing =
                     tag === "input" || tag === "textarea" || tag === "select" ||
                     (e.target && e.target.isContentEditable);
                  if (e.defaultPrevented || editing) return;
                  const characterButton =
                     e.key === "ArrowLeft"
                        ? $("dd-character-prev") || $("card-prev")
                        : e.key === "ArrowRight"
                          ? $("dd-character-next") || $("card-next")
                          : null;
                  if (
                     characterButton &&
                     typeof ddStrokeTab !== "undefined" &&
                     ddStrokeTab === "practice"
                  )
                     return;
                  if (characterButton && !characterButton.disabled) {
                     e.preventDefault();
                     characterButton.click();
                  }
                  return;
               }
               if (seq) {
                  if (typeof ddStrokeTab !== "undefined" && ddStrokeTab === "practice") {
                     if (e.key === "Escape") closeSequence();
                     return;
                  }
                  if (
                     e.defaultPrevented ||
                     (e.target.closest && e.target.closest(".stroke-workspace, .stroke-focus"))
                  ) return;
                  const tag = (e.target.tagName || "").toLowerCase();
                  if (
                     tag === "input" || tag === "textarea" || tag === "select" ||
                     (e.target && e.target.isContentEditable)
                  ) return;
                  if (e.key === "ArrowRight" && $("seq-next"))
                     $("seq-next").click();
                  else if (
                     e.key === "ArrowLeft" &&
                     $("seq-prev") &&
                     !$("seq-prev").disabled
                  )
                     $("seq-prev").click();
                  else if (e.key === "Escape") closeSequence();
                  return;
               }
               if (!session.active || activeView !== "learn") return;
               const tag = (e.target.tagName || "").toLowerCase();
               if (tag === "input" || tag === "textarea" || tag === "select") {
                  if (e.key === "Enter" && $("s-check")) {
                     e.preventDefault();
                     checkWritten();
                  }
                  return;
               }
               const grades = { 1: "again", 2: "hard", 3: "good", 4: "easy" };
               if (grades[e.key]) {
                  const b = document.querySelector(
                     '[data-grade="' + grades[e.key] + '"]',
                  );
                  if (b) {
                     e.preventDefault();
                     b.click();
                     return;
                  }
               }
               if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  if ($("s-flip")) $("s-flip").click();
                  else if ($("s-next")) $("s-next").click();
               } else if (e.key === "ArrowRight" && $("s-next"))
                  $("s-next").click();
               else if (
                  e.key === "ArrowLeft" &&
                  $("s-prev") &&
                  !$("s-prev").disabled
               )
                  $("s-prev").click();
               else if (e.key === "Escape") endSession();
            });
            if (!history.state)
               history.replaceState({ moStudioView: "learn" }, "");
            if (history.state && history.state.moStudioSearch)
               restoreSearchHistory(history.state);
            else
               setView((history.state && history.state.moStudioView) || "learn", {
                  fromHistory: true,
               });
         }
         init();
   </script>
