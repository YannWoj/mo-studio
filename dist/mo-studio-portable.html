         /* -------- programmation manuelle -------- */
         function delayTargets() {
            const t = now();
            const tonight = new Date();
            tonight.setHours(20, 0, 0, 0);
            if (tonight.getTime() <= t) tonight.setDate(tonight.getDate() + 1);
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            return [
               ["10 minutes", t + 10 * 60e3],
               ["1 heure", t + 3600e3],
               ["3 heures", t + 3 * 3600e3],
               ["Ce soir · 20 h", tonight.getTime()],
               ["Demain · 9 h", tomorrow.getTime()],
               ["3 jours", t + 3 * 86400e3],
               ["1 semaine", t + 7 * 86400e3],
            ];
         }
         function openDelaySheet(c, after) {
            const opts = delayTargets()
               .map(
                  (o) =>
                     '<button class="btn" data-d="' +
                     o[1] +
                     '">' +
                     o[0] +
                     "</button>",
               )
               .join("");
            openSheet(
               '<h3 class="sh-t">Revoir « ' +
                  esc(c.hz) +
                  " » dans…</h3>" +
                  (c.due != null
                     ? '<p class="sh-p">Actuellement programmée : ' +
                       fmtDate(c.due) +
                       "</p>"
                     : "") +
                  '<div class="delay-grid">' +
                  opts +
                  "</div>" +
                  '<div class="dl-custom"><input type="datetime-local" id="dl-dt" class="search"><button class="btn" id="dl-ok">OK</button></div>' +
                  (c.due != null
                     ? '<button class="btn ghost wide" id="dl-cancel">Annuler la programmation actuelle</button>'
                     : "") +
                  '<button class="btn ghost wide" id="dl-close">Fermer</button>',
            );
            const setDue = (ts) => {
               c.due = ts;
               c.acquired = false;
               save();
               closeSheet();
               toast("« " + c.hz + " » reviendra le " + fmtDate(ts) + ".");
               if (after) after(true);
            };
            document
               .querySelectorAll("#sheet [data-d]")
               .forEach((b) => (b.onclick = () => setDue(+b.dataset.d)));
            $("dl-ok").onclick = () => {
               const v = $("dl-dt").value;
               if (!v) {
                  toast("Choisis une date et une heure.");
                  return;
               }
               const ts = new Date(v).getTime();
               if (!ts || ts <= now()) {
                  toast("Choisis un moment dans le futur.");
                  return;
               }
               setDue(ts);
            };
            if ($("dl-cancel"))
               $("dl-cancel").onclick = () => {
                  c.due = null;
                  save();
                  closeSheet();
                  toast("Programmation annulée.");
                  if (after) after(false);
               };
            $("dl-close").onclick = closeSheet;
         }

"use strict";

/* ================= « connu raisonnablement bien », pour ce test précis ================= */
// Volontairement plus strict que learningPathSufficientProgress (js/learning-units/
// learning-path-engine.js) : celle-ci débloque du contenu neuf, une erreur n'y coûte
// qu'un délai. Ici, une erreur signifie montrer un caractère peut-être mal maîtrisé
// dans un test à risque d'interférence — donc au moins deux réussites enregistrées,
// pas une seule (une réussite isolée peut être un coup de chance), ou le drapeau
// manuel "Maîtrisée". Prédicat autonome plutôt qu'une réutilisation paramétrée, pour
// ne jamais risquer d'assouplir accidentellement l'usage Parcours.
function wellKnownForConfusablePairs(card) {
   if (!card) return false;
   if (card.acquired === true) return true;
   const successCount = (card.reviewHistory || []).filter(
      (entry) => entry.grade === "good" || entry.grade === "easy",
   ).length;
   return successCount >= 2;
}

// Signal exact de "jamais étudié" : lastReviewed n'est écrit que par applyGrade
// (js/state.js) et n'est jamais réinitialisé ailleurs.
function confusablePairEverStudied(card) {
   return !!card && card.lastReviewed != null;
}

// Règle de sécurité pédagogique non négociable : un caractère jamais étudié —
// carte absente ou jamais notée — ne doit jamais apparaître dans ce test, même si
// l'autre caractère de la paire est parfaitement connu.
function confusablePairCandidate(c) {
   if (!c || !c.hz || typeof reviewHanzi !== "function" || reviewHanzi(c.hz).length !== 1) return null;
   if (!session || !session.active || !session.live || session.live.confusableShown) return null;
   const record = typeof confusablePairsCached === "function" ? confusablePairsCached(c.hz) : undefined;
   if (!record) return null; // pas de partenaire connu, ou pas encore préchargé — jamais deviné
   const activePartners = record.partners.filter((partner) => partner.activeTier);
   if (!activePartners.length) return null;
   const selfWellKnown = wellKnownForConfusablePairs(c);
   for (const partner of activePartners) {
      const twinCard = db.cards.find((card) => card.hz === partner.character);
      if (!confusablePairEverStudied(twinCard)) continue;
      if (!selfWellKnown && !wellKnownForConfusablePairs(twinCard)) continue;
      return { partner, twinCard };
   }
   return null;
}

// Interstitiel mi-séance sur le modèle exact d'openDelaySheet (js/views/review.js) :
// ouvre un sheet lié à la carte courante, et ne reprend la séance que via le
// callback after() une fois l'utilisateur passé à l'écran suivant.
function maybeShowConfusablePairTest(c, after) {
   const candidate = confusablePairCandidate(c);
   if (!candidate) return false;
   session.live.confusableShown = (session.live.confusableShown || 0) + 1;

   const twinCharacter = candidate.partner.character;
   const swapSides = Math.random() < 0.5;
   const leftCharacter = swapSides ? twinCharacter : c.hz;
   const rightCharacter = swapSides ? c.hz : twinCharacter;

   openSheet(confusableTestPromptHtml(c, leftCharacter, rightCharacter));

   const finish = (chosenCharacter) => {
      const correct = chosenCharacter === c.hz;
      // Le test s'ajoute à la notation déjà faite, il ne la remplace pas : pas de
      // changement de c.lvl, pas d'entrée dans c.reviewHistory (réservé aux quatre
      // boutons de note). Seule la programmation change, exactement comme le fait
      // déjà openDelaySheet's setDue pour un ajustement manuel — donc rien
      // d'invisible : un toast explique le changement, comme ailleurs dans l'app.
      if (!correct) {
         c.due = now() + INTERVALS[0];
         if (c.acquired) c.acquired = false;
         save();
         toast("« " + c.hz + " » reprogrammé plus tôt — confusion avec « " + twinCharacter + " ».");
      }
      openSheet(confusableTestVerdictHtml(correct, chosenCharacter, c.hz));
      $("confusable-test-continue").onclick = () => {
         closeSheet();
         after();
      };
   };
   document.querySelectorAll("#sheet [data-confusable-choice]").forEach((button) => {
      button.onclick = () => finish(button.dataset.confusableChoice);
   });
   return true;
}

function dueCount(cards) {
   return cards.filter(isDue).length;
}

function libraryScopeCards() {
   if (lib.level === "category" && lib.categoryId) return cardsForCategory(lib.categoryId);
   if (lib.level === "pack" && lib.packId) return cardsForPack(lib.packId);
   return db.cards.slice();
}

function libraryFilteredCards() {
   let cards = libraryScopeCards();
   const query = lib.q.trim();
   const flat = flatten(query);
   if (query) {
      cards = cards.filter((card) =>
         card.hz.includes(query) ||
         flatten(card.py).includes(flat) ||
         flatten(card.fr).includes(flat) ||
         flatten((card.tags || []).join(" ")).includes(flat),
      );
   }
   if (lib.flt === "fav") cards = cards.filter((card) => card.fav);
   else if (lib.flt === "difficult") cards = cards.filter((card) => card.difficult);
   else if (lib.flt === "new") cards = cards.filter((card) => card.due == null && !card.acquired);
   else if (lib.flt === "mastered") cards = cards.filter((card) => card.acquired);
   else if (lib.flt === "due") cards = cards.filter(isDue);
   return cards.sort((a, b) => b.created - a.created);
}

function wireCardStrokeWorkspace(card, characters, context, initialCharacterIndex) {
   if (!characters.length) return;

   const selectCharacter = (index) => {
      selectedIndex = Math.max(0, Math.min(Number(index) || 0, characters.length - 1));
      const character = characters[selectedIndex];
      updateCharacterNavigation("card", characters, selectedIndex);
      if ($("card-prev"))
         $("card-prev").disabled = selectedIndex === 0 && listIndex === 0;
      if ($("card-next"))
         $("card-next").disabled =
            selectedIndex === characters.length - 1 && listIndex === context.cardIds.length - 1;
      loadDDChar(character, characters, {
         selectionKey: `card:${card.id}:${selectedIndex}:${character}`,
         selectionIndex: selectedIndex,
      });
   };
   if ($("card-prev")) $("card-prev").onclick = () => {
      if (selectedIndex > 0) selectCharacter(selectedIndex - 1);

            ...context,
            initialCharacterIndex: -1,
         });
   };

      if (selectedIndex < characters.length - 1) selectCharacter(selectedIndex + 1);

         openCardDetail(context.cardIds[listIndex + 1], {
            ...context,
            initialCharacterIndex: 0,
         });
   };

      ? characters.length - 1

}

let cardDictionarySearchTimer = null;
let cardDictionarySearchSequence = 0;

function personalCardForDictionarySelection(entry) {
   if (typeof findPersonalCardForEntry === "function")
      return findPersonalCardForEntry(entry);
   if (entry && entry.personalCard)
      return db.cards.find((card) => card.id === entry.personalCard.id) || null;
   const sourceId = entry && (entry.dictionaryEntryId || entry.id);
   return sourceId
      ? db.cards.find((card) => card.dictionaryEntryId === sourceId) || null
      : null;
}

async function dictionaryEntryWithAllFrenchSenses(entry) {
   if (!entry || !entry.id || typeof loadDictionaryEntryById !== "function") return entry;
   try {
      const full = await loadDictionaryEntryById(entry.id);
      return full ? { ...entry, ...full } : entry;
   } catch (error) {
      console.error("Chargement des sens complets impossible", error);
      return entry;
   }
}

function dictionaryEntryCardDraft(entry) {
   const existing = personalCardForDictionarySelection(entry);
   return {
      hz: existing ? existing.hz : entry.simplified,
      py: existing ? existing.py : (entry.pinyin && entry.pinyin[0] ? entry.pinyin[0].marked : ""),
      fr: existing ? existing.fr : dictionaryCompletionTranslation(entry),
      note: existing ? existing.note : "",
      tags: existing ? existing.tags : [],
      senseId: existing ? existing.senseId : "",
      traditional: existing ? existing.traditional : entry.traditional || "",
      dictionaryEntryId: existing && existing.dictionaryEntryId
         ? existing.dictionaryEntryId
         : entry.dictionaryEntryId || entry.id || "",
   };
}

function dictionarySelectionHtml(entry, existing) {

      '</span><small>' + (definition.english ? "EN · " : "") + esc(translation) + "</small></div>" +
      (existing ? '<span class="word-dictionary-existing">Déjà dans Mes mots</span>' : "") +
      '<button class="btn ghost sm" id="word-change-dictionary" type="button">Changer de mot</button></section>'
   );
}

function cardEditorHtml(existingCard, current, initialCategoryIds, creationState) {
   const selectedEntry = creationState && creationState.entry;
   const selectedExisting = selectedEntry && personalCardForDictionarySelection(selectedEntry);
   return (

   );

function openCardDictionarySearch(initialCategoryIds, state) {
   clearTimeout(cardDictionarySearchTimer);
   const searchState = state || { suggestionSearch: null, suggestionIndex: -1, query: "" };
   openSheet(
      '<section class="word-dictionary-search"><h3 class="sh-t">Ajouter un mot</h3><p class="sh-p">Commence par le dictionnaire : pinyin et traduction seront préremplis.</p>' +
      '<label class="f-lab" for="word-dictionary-query">Chercher un mot dans le dictionnaire</label><div class="dictionary-search-input word-dictionary-input"><input class="search" id="word-dictionary-query" value="' + esc(searchState.query || "") + '" placeholder="汉字, pinyin ou français…" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="word-dictionary-suggestions" aria-expanded="false"><button type="button" class="search-clear" id="word-dictionary-clear" aria-label="Effacer"' + (searchState.query ? "" : " hidden") + '>×</button><div class="dictionary-suggestions" id="word-dictionary-suggestions" role="listbox" hidden></div></div>' +
      '<div class="search-live-state" id="word-dictionary-state" role="status" aria-live="polite">Saisis un caractère chinois ou au moins deux lettres.</div>' +
      '<button class="btn ghost wide word-manual-start" id="word-manual-start" type="button">Ce mot n’est pas dans le dictionnaire — le créer à la main</button>' +
      '<div class="sh-btns"><button class="btn ghost" data-sheet-close>Annuler</button></div></section>',
   );
   const input = $("word-dictionary-query");
   const suggestionOptions = {
      target: "word-dictionary-suggestions",
      input,
      state: searchState,
      idPrefix: "word-dictionary-option",
      onSelect: async (entry) => {
         if ($("word-dictionary-state")) $("word-dictionary-state").textContent = "Préparation du mot…";
         let completedEntry = await dictionaryEntryWithAllFrenchSenses(entry);
         try {
            if (typeof dictionaryEntryWithFrenchSibling === "function")
               completedEntry = await dictionaryEntryWithFrenchSibling(completedEntry);
         } catch (error) {
            console.error("Complétion française de la suggestion impossible", error);
         }
         if (!$("word-dictionary-query")) return;
         openCardForm(null, initialCategoryIds, {
            mode: "selected",
            entry: completedEntry,
            draft: dictionaryEntryCardDraft(completedEntry),
            query: input.value,
         });
      },
      isAlreadyPersonal: (entry) => !!personalCardForDictionarySelection(entry),
   };
   const openManual = () => {
      const typed = input.value.trim();
      const isHanzi = typed && Array.from(typed).every((character) => HAN_PATTERN.test(character));
      openCardForm(null, initialCategoryIds, {
         mode: "manual",
         draft: { hz: isHanzi ? typed : "", py: "", fr: "", note: "", tags: [] },
         query: input.value,
      });
   };
   const updateSuggestions = async () => {
      if (!input.isConnected) return;
      const expected = input.value.trim();
      searchState.query = input.value;
      const classified = classifySearchQuery(expected);
      const minimum = classified.type && classified.type.startsWith("hanzi") ? 1 : 2;
      if (!classified.valid || Array.from(expected).length < minimum) {
         closeSearchSuggestions(suggestionOptions);
         $("word-dictionary-state").textContent = "Saisis un caractère chinois ou au moins deux lettres.";
         return;
      }
      const sequence = ++cardDictionarySearchSequence;
      $("word-dictionary-state").textContent = "Recherche dans le dictionnaire…";
      try {
         const response = await searchDictionary(expected, { limit: 6, candidateLimit: 18 });
         if (sequence !== cardDictionarySearchSequence || !$("word-dictionary-query") || input.value.trim() !== expected) return;
         const items = renderSearchSuggestions(response, {
            ...suggestionOptions,
            emptyHtml: '<div class="word-dictionary-empty"><p>Aucun résultat pour <strong>« ' + esc(expected) + ' »</strong>.</p><button class="btn ghost" id="word-manual-empty" type="button">Créer ce mot à la main</button></div>',
         });
         $("word-dictionary-state").textContent = items.length
            ? items.length + " suggestion" + (items.length > 1 ? "s" : "")
            : "Ce mot semble absent du dictionnaire.";
         if ($("word-manual-empty")) $("word-manual-empty").onclick = openManual;
      } catch (error) {
         if (error instanceof StaleDictionarySearchError) return;
         if ($("word-dictionary-state")) $("word-dictionary-state").textContent = "Dictionnaire indisponible. La création manuelle reste possible.";
      }
   };
   input.oninput = () => {
      searchState.query = input.value;
      searchState.suggestionSearch = null;
      searchState.suggestionIndex = -1;
      closeSearchSuggestions(suggestionOptions);
      $("word-dictionary-clear").hidden = !input.value;
      clearTimeout(cardDictionarySearchTimer);
      cardDictionarySearchTimer = setTimeout(updateSuggestions, SEARCH_DEBOUNCE_MS);
   };
   input.onkeydown = (event) => {
      if (event.key === "ArrowDown" && moveSearchSuggestion(1, suggestionOptions)) event.preventDefault();
      else if (event.key === "ArrowUp" && moveSearchSuggestion(-1, suggestionOptions)) event.preventDefault();
      else if (event.key === "Enter" && searchState.suggestionSearch) {
         const index = searchState.suggestionIndex < 0 ? 0 : searchState.suggestionIndex;
         const item = searchState.suggestionSearch.results[index];
         if (item) { event.preventDefault(); suggestionOptions.onSelect(item.entry); }
      } else if (event.key === "Escape" && !$("word-dictionary-suggestions").hidden) {
         event.preventDefault();
         event.stopPropagation();
         closeSearchSuggestions(suggestionOptions);
      }
   };
   $("word-dictionary-clear").onclick = () => {
      input.value = "";
      searchState.query = "";
      $("word-dictionary-clear").hidden = true;
      closeSearchSuggestions(suggestionOptions);
      $("word-dictionary-state").textContent = "Saisis un caractère chinois ou au moins deux lettres.";
      input.focus();
   };
   $("word-manual-start").onclick = openManual;
   if (searchState.query) updateSuggestions();
   else requestAnimationFrame(() => requestAnimationFrame(() => {
      if (input.isConnected) input.focus({ preventScroll: true });
   }));
}

function openCardForm(card, initialCategoryIds, creationState) {
   clearTimeout(cardDictionarySearchTimer);
   const existingCard = card && db.cards.find((item) => item.id === card.id);
   if (!existingCard && !card && !creationState)
      return openCardDictionarySearch((initialCategoryIds || []).slice());
   const current = creationState && creationState.draft ? creationState.draft : card || {};
   openSheet(cardEditorHtml(existingCard, current, initialCategoryIds, creationState));
   const returnToSearch = () => openCardDictionarySearch((initialCategoryIds || []).slice(), {
      suggestionSearch: null,
      suggestionIndex: -1,
      query: creationState && creationState.query ? creationState.query : "",
   });
   if ($("word-change-dictionary")) $("word-change-dictionary").onclick = returnToSearch;
   if ($("word-back-dictionary")) $("word-back-dictionary").onclick = returnToSearch;
   $("word-save").onclick = async () => {
      const chinese = $("word-hz").value.trim();
      if (!chinese) { toast("Les caractères chinois sont obligatoires."); return; }
      let pinyin = $("word-py").value.trim(); let translation = $("word-fr").value.trim();
      let dictionaryEntryId = current.dictionaryEntryId || "";
      if (!pinyin || !translation) { const match = await dictionaryCompletion(chinese, pinyin); if (match) { pinyin ||= match.pinyin; translation ||= match.translation; dictionaryEntryId ||= match.dictionaryId; } }
      const candidate = { hz: chinese, py: pinyin, fr: translation, senseId: current.senseId || "", dictionaryEntryId, traditional: current.traditional || "" };
      const selectedExisting = creationState && creationState.entry
         ? personalCardForDictionarySelection(creationState.entry)
         : null;
      const duplicate = selectedExisting || db.cards.find((item) => item.id !== (existingCard && existingCard.id) && personalCardEquivalent(item, candidate));
      const saved = existingCard || duplicate || normalizeCard(candidate, false);
      saved.hz = chinese; saved.py = pinyin; saved.fr = translation; saved.note = $("word-note").value.trim(); saved.tags = $("word-tags").value.split(",").map((tag) => tag.trim()).filter(Boolean); saved.incomplete = !pinyin || !translation; saved.dictionaryEntryId = dictionaryEntryId || saved.dictionaryEntryId || ""; saved.traditional = current.traditional || saved.traditional || ""; saved.updated = Date.now();
      if (!existingCard && !duplicate) db.cards.push(saved);
      const checked = new Set(Array.from(document.querySelectorAll("[data-card-category]:checked")).map((input) => input.dataset.cardCategory));
      if (existingCard) db.memberships = db.memberships.filter((membership) => membership.cardId !== saved.id || checked.has(membership.categoryId));
      checked.forEach((categoryId) => addCardMembership(saved.id, categoryId));
      syncLegacyPackCardIds(); invalidateDictIndex(); save(); closeSheet(); renderLib(); toast(duplicate ? "Mot existant ajouté aux sous-catégories." : "Mot enregistré.");
   };
}

function readPackImportFile(file, type) {
   if (!file) return;
   const reader = new FileReader();
   reader.onload = () => previewPackImportText(String(reader.result || ""), type);
   reader.onerror = () => toast("Impossible de lire ce fichier.");
   reader.readAsText(file);
}

"use strict";

const DICTIONARY_SCHEMA_VERSION = 1;
const DICTIONARY_CACHE_NAME = "mo-studio-dictionary-v1";
const DICTIONARY_PARSED_CHUNK_LIMIT = 10;
const DICTIONARY_ENTRY_CACHE_LIMIT = 240;
const DICTIONARY_ROOT = (() => {
   if (typeof document === "undefined") {
      const workerBase = typeof self !== "undefined" && self.location
         ? self.location.href
         : "http://localhost/js/search/dictionary-search-worker.js";
      return new URL("../../data/generated/dictionary/", workerBase).href;
   }
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(portable ? "../data/generated/dictionary/" : "data/generated/dictionary/", document.baseURI).href;
})();

const dictionaryDataState = {
   status: "idle",
   manifest: null,
   attribution: null,
   locations: null,
   referenceById: null,
   indexes: new Map(),
   chunks: new Map(),
   previewCatalog: null,
   entries: new Map(),
   error: null,
};

function dictionaryResourceUrl(relativePath) {
   return new URL(relativePath, DICTIONARY_ROOT).href;
}

async function openDictionaryCache() {
   return "caches" in globalThis ? caches.open(DICTIONARY_CACHE_NAME) : null;
}

async function fetchDictionaryResponse(relativePath, reload) {
   const url = dictionaryResourceUrl(relativePath);
   const cache = await openDictionaryCache();
   if (!reload && cache) {
      const cached = await cache.match(url);
      if (cached) return { response: cached, cached: true, cache, url };
   }
   const response = await fetch(url, { cache: reload ? "reload" : "default" });
   if (!response.ok) throw new Error(relativePath + " · HTTP " + response.status);
   if (cache) {
      const write = cache.put(url, response.clone());
      if (reload) await write;
      else write.catch(() => {});
   }
   return { response, cached: false, cache, url };
}

async function fetchDictionaryJson(relativePath, reload) {
   let loaded = await fetchDictionaryResponse(relativePath, !!reload);
   try {
      return await loaded.response.json();
   } catch (error) {
      if (loaded.cached && loaded.cache) {
         await loaded.cache.delete(loaded.url);
         loaded = await fetchDictionaryResponse(relativePath, true);
         try {
            return await loaded.response.json();
         } catch (networkError) {
            throw new Error(relativePath + " · JSON corrompu");
         }
      }
      throw new Error(relativePath + " · JSON corrompu");
   }
}

function validateDictionaryManifest(manifest) {
   if (
      !manifest ||
      manifest.format !== "mo-studio-offline-dictionary" ||
      manifest.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !manifest.indexes ||
      !manifest.entryLocations ||
      !manifest.attribution ||
      !manifest.chunkPathTemplate ||
      !manifest.searchPreviews
   )
      throw new Error("Version d’index absente, corrompue ou incompatible.");
   return manifest;
}

function resetDictionaryMemory() {
   if (typeof clearDictionarySearchCache === "function")
      clearDictionarySearchCache();
   if (typeof resetDictionarySearchWorker === "function")
      resetDictionarySearchWorker();
   dictionaryDataState.manifest = null;
   dictionaryDataState.attribution = null;
   dictionaryDataState.locations = null;
   dictionaryDataState.referenceById = null;
   dictionaryDataState.indexes.clear();
   dictionaryDataState.chunks.clear();
   dictionaryDataState.previewCatalog = null;
   dictionaryDataState.entries.clear();
   dictionaryDataState.error = null;
   dictionaryDataState.status = "idle";
}

async function loadDictionaryManifest(reload) {
   if (dictionaryDataState.manifest && !reload) return dictionaryDataState.manifest;
   dictionaryDataState.status = "loading";
   try {
      const manifest = validateDictionaryManifest(
         await fetchDictionaryJson("manifest.json", !!reload),
      );
      if (
         dictionaryDataState.manifest &&
         dictionaryDataState.manifest.buildId !== manifest.buildId
      ) {
         dictionaryDataState.locations = null;
         dictionaryDataState.referenceById = null;
         dictionaryDataState.indexes.clear();
         dictionaryDataState.chunks.clear();
         dictionaryDataState.previewCatalog = null;
         dictionaryDataState.entries.clear();
      }
      dictionaryDataState.manifest = manifest;
      dictionaryDataState.status = "ready";
      return manifest;
   } catch (error) {
      dictionaryDataState.status = "error";
      dictionaryDataState.error = error;
      throw error;
   }
}

async function loadDictionaryAttribution(reload) {
   const manifest = await loadDictionaryManifest(reload);
   if (dictionaryDataState.attribution && !reload)
      return { manifest, attribution: dictionaryDataState.attribution };
   const attribution = await fetchDictionaryJson(manifest.attribution, !!reload);
   if (!Array.isArray(attribution.sources))
      throw new Error("Attribution du dictionnaire invalide.");
   dictionaryDataState.attribution = attribution;
   return { manifest, attribution };
}

async function loadDictionaryLocations(reload) {
   const manifest = await loadDictionaryManifest(reload);
   if (dictionaryDataState.locations && !reload) return dictionaryDataState.locations;
   const locations = await fetchDictionaryJson(manifest.entryLocations, !!reload);
   if (!Array.isArray(locations) || locations.length !== manifest.counts.entries)
      throw new Error("Table des entrées du dictionnaire invalide.");
   dictionaryDataState.locations = locations;
   dictionaryDataState.referenceById = null;
   return locations;
}

async function loadDictionaryIndex(name, reload) {
   const manifest = await loadDictionaryManifest(reload);
   const path = manifest.indexes[name];
   if (!path) throw new Error("Index inconnu : " + name);
   if (dictionaryDataState.indexes.has(name) && !reload)
      return dictionaryDataState.indexes.get(name);
   const index = await fetchDictionaryJson(path, !!reload);
   if (!index || typeof index !== "object" || Array.isArray(index))
      throw new Error(path + " · contenu invalide");
   dictionaryDataState.indexes.set(name, index);
   return index;
}

function rememberDictionaryEntry(entry) {
   dictionaryDataState.entries.delete(entry.id);
   dictionaryDataState.entries.set(entry.id, entry);
   while (dictionaryDataState.entries.size > DICTIONARY_ENTRY_CACHE_LIMIT) {
      const oldest = dictionaryDataState.entries.keys().next().value;
      dictionaryDataState.entries.delete(oldest);
   }
}

function rememberDictionaryChunk(key, entries) {
   dictionaryDataState.chunks.delete(key);
   dictionaryDataState.chunks.set(key, entries);
   while (dictionaryDataState.chunks.size > DICTIONARY_PARSED_CHUNK_LIMIT) {
      const oldest = dictionaryDataState.chunks.keys().next().value;
      dictionaryDataState.chunks.delete(oldest);
   }
}

async function loadDictionaryChunk(key, reload) {
   if (dictionaryDataState.chunks.has(key) && !reload) {
      const entries = dictionaryDataState.chunks.get(key);
      rememberDictionaryChunk(key, entries);
      return entries;
   }
   const manifest = await loadDictionaryManifest(reload);
   const path = manifest.chunkPathTemplate.replace("{chunk}", key);
   const payload = await fetchDictionaryJson(path, !!reload);
   if (
      !payload ||
      payload.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !Array.isArray(payload.entries)
   )
      throw new Error(path + " · chunk invalide");
   rememberDictionaryChunk(key, payload.entries);
   return payload.entries;
}

function dictionaryPreviewFromArray(value, reference) {
   if (!Array.isArray(value) || value.length !== 11)
      throw new Error("Aperçu de dictionnaire invalide.");
   return {
      id: value[0],
      simplified: value[1],
      traditional: value[2] || value[1],
      entryType: value[3] === "c" ? "character" : "word",
      pinyin: (value[4] || []).map((variant) => ({
         marked: variant[0],
         numbered: variant[1],
         plain: variant[2],
      })),
      definitionsFr: value[5] ? [value[5]] : [],
      definitionsEn: value[6] ? [value[6]] : [],
      sources: value[7] || [],
      hskLegacy: value[8] || [],
      hsk30: value[9] || [],
      frequencyRank: value[10],
      characters: Array.from(value[1]).filter((character) => HAN_PATTERN.test(character)),
      __preview: true,
      __reference: reference,
   };
}

async function loadDictionaryPreviewCatalog() {
   if (dictionaryDataState.previewCatalog) return dictionaryDataState.previewCatalog;
   const manifest = await loadDictionaryManifest(false);
   const payload = await fetchDictionaryJson(manifest.searchPreviews, false);
   if (
      !payload ||
      payload.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !Array.isArray(payload.entries) ||
      payload.entries.length !== manifest.counts.entries
   )
      throw new Error(manifest.searchPreviews + " · aperçus invalides");
   dictionaryDataState.previewCatalog = payload.entries;
   return payload.entries;
}

async function loadDictionaryPreviewsByReferences(references) {
   const locations = await loadDictionaryLocations(false);
   const catalog = await loadDictionaryPreviewCatalog();
   const uniqueReferences = Array.from(new Set(references)).filter(
      (reference) => Number.isInteger(reference) && reference >= 0 && reference < locations.length,
   );
   return uniqueReferences
      .map((reference) => dictionaryPreviewFromArray(catalog[reference], reference))
      .filter(Boolean);
}

async function loadDictionaryEntriesByReferences(references, options) {
   const locations = await loadDictionaryLocations(false);
   const reload = !!(options && options.reload);
   const uniqueReferences = Array.from(new Set(references)).filter(
      (reference) => Number.isInteger(reference) && reference >= 0 && reference < locations.length,
   );
   const output = new Map();
   const byChunk = new Map();

   uniqueReferences.forEach((reference) => {
      const [entryId, chunk] = locations[reference];
      const cached = dictionaryDataState.entries.get(entryId);
      if (cached && !reload) {
         output.set(reference, cached);
         return;
      }
      if (!byChunk.has(chunk)) byChunk.set(chunk, []);
      byChunk.get(chunk).push([reference, entryId]);
   });

   const groups = Array.from(byChunk.entries());
   for (let offset = 0; offset < groups.length; offset += 8) {
      const batch = groups.slice(offset, offset + 8);
      const loaded = await Promise.all(
         batch.map(async ([chunk, wanted]) => [chunk, wanted, await loadDictionaryChunk(chunk, reload)]),
      );
      loaded.forEach(([, wanted, entries]) => {
         const wantedById = new Map(wanted.map(([reference, entryId]) => [entryId, reference]));
         entries.forEach((entry) => {
            const reference = wantedById.get(entry.id);
            if (reference == null) return;
            rememberDictionaryEntry(entry);
            output.set(reference, entry);
         });
      });
   }
   return uniqueReferences.map((reference) => output.get(reference)).filter(Boolean);
}

async function loadDictionaryEntryById(entryId) {
   if (dictionaryDataState.entries.has(entryId))
      return dictionaryDataState.entries.get(entryId);
   const locations = await loadDictionaryLocations(false);
   if (!dictionaryDataState.referenceById) {
      dictionaryDataState.referenceById = new Map(
         locations.map(([id], reference) => [id, reference]),
      );
   }
   const reference = dictionaryDataState.referenceById.get(entryId);
   if (reference == null) return null;
   const [entry] = await loadDictionaryEntriesByReferences([reference]);
   return entry || null;
}

async function loadDictionaryCharacterLinks(character, limit) {
   const index = await loadDictionaryIndex("characters", false);
   const item = index[character];
   if (!item) return { characterEntry: null, words: [] };
   const references = [item.entryRef, ...item.wordRefs.slice(0, limit || 12)];
   const entries = await loadDictionaryPreviewsByReferences(references);
   return {
      characterEntry: entries.find((entry) => entry.entryType === "character") || null,
      words: entries.filter((entry) => entry.entryType === "word"),
   };
}

async function deleteDictionaryCacheOnly() {
   if ("caches" in globalThis) await caches.delete(DICTIONARY_CACHE_NAME);
   if ("indexedDB" in globalThis && indexedDB.databases) {
      const databases = await indexedDB.databases();
      if (databases.some((database) => database.name === DICTIONARY_CACHE_NAME)) {
         await new Promise((resolve, reject) => {
            const request = indexedDB.deleteDatabase(DICTIONARY_CACHE_NAME);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
            request.onblocked = () => reject(new Error("Le cache du dictionnaire est encore ouvert."));
         });
      }
   }
   resetDictionaryMemory();
}

async function rebuildDictionaryIndex(onStatus) {
   const update = (message) => {
      dictionaryDataState.status = "loading";
      if (onStatus) onStatus("loading", message);
   };
   try {
      update("Nettoyage du cache du dictionnaire…");
      await deleteDictionaryCacheOnly();
      const { manifest } = await loadDictionaryAttribution(true);
      const tasks = [
         ["positions", manifest.entryLocations],
         ["previews", manifest.searchPreviews],
         ...Object.entries(manifest.indexes),
      ];
      for (let index = 0; index < tasks.length; index++) {
         update("Préparation hors ligne " + (index + 1) + " / " + tasks.length + "…");
         if (tasks[index][0] === "positions") await loadDictionaryLocations(true);
         else if (tasks[index][0] === "previews") await loadDictionaryPreviewCatalog();
         else await loadDictionaryIndex(tasks[index][0], true);
      }
      const chunks = manifest.chunks || [];
      for (let offset = 0; offset < chunks.length; offset += 8) {
         update(
            "Préparation des fiches hors ligne " +
               Math.min(offset + 8, chunks.length) +
               " / " +
               chunks.length +
               "…",
         );
         await Promise.all(
            chunks
               .slice(offset, offset + 8)
               .map((chunk) => fetchDictionaryResponse(chunk.path, true)),
         );
      }
      dictionaryDataState.status = "ready";
      if (onStatus)
         onStatus(
            "success",
            "Index prêt hors ligne · " + manifest.counts.words.toLocaleString("fr-FR") + " entrées lexicales.",
         );
      return manifest;
   } catch (error) {
      dictionaryDataState.status = "error";
      dictionaryDataState.error = error;
      if (onStatus) onStatus("error", "Échec · " + error.message);
      throw error;
   }
}

"use strict";

/* Scores positifs : plus le score est élevé, plus le résultat est pertinent. */
const SEARCH_WEIGHTS = Object.freeze({
   EXACT_SIMPLIFIED: 16000,
   EXACT_TRADITIONAL: 15000,
   EXACT_CHINESE_WORD: 1800,
   EXACT_CHARACTER: 900,
   EXACT_PINYIN_MARKED: 14800,
   EXACT_PINYIN_NUMBERED: 14600,
   EXACT_PINYIN_PLAIN: 11600,
   PINYIN_PREFIX: 4400,
   HANZI_PREFIX: 6900,
   HANZI_CONTAINS: 3200,
   EXACT_FRENCH_TOKEN: 7800,
   FRENCH_PREFIX_TOKEN: 4200,
   ENGLISH_FALLBACK: 2300,
   PERSONAL_CARD: 1500,
   CHARACTER_TYPE: 0,
   VERIFIED_HSK: 420,
   VERIFIED_FREQUENCY_MAX: 600,
   FRENCH_DEFINITION: 520,
   ENGLISH_DEFINITION: 45,
   SOURCE_COMPLETENESS: 35,
   WORD_LENGTH_PENALTY: 9,
});

function dictionaryVariantStatus(entry) {
   const definitions = [...entryDefinitions(entry, "fr"), ...entryDefinitions(entry, "en")].join(" ");
   if (/\b(?:archaic|ancient|old)\s+(?:variant|form)\b|\bforme\s+ancienne\b/iu.test(definitions))
      return "ancient";
   if (/\bvariant(?:e)?\s+(?:of|de)\b|\bvariant\b/iu.test(definitions)) return "variant";
   if (entry.__scriptVariant) return "script-variant";
   return "modern";
}

function dictionaryExactSortTier(entry, query) {
   const simplified = entry.simplified || entry.hz || "";
   const traditional = entry.traditional || simplified;
   const exact = simplified === query.hanzi || traditional === query.hanzi;
   if (!query.type.startsWith("hanzi") || !exact) return null;
   const entryType = entry.entryType || (Array.from(simplified).length === 1 ? "character" : "word");
   const variant = dictionaryVariantStatus(entry) !== "modern";
   if (entryType === "word" && !variant && entryDefinitions(entry, "fr").length) return 0;
   if (verifiedHskLevel(entry) != null) return 1;
   if (entryType === "character") return 2;
   if (!variant) return 3;
   return 4;
}

function dictionaryPinyinSortTier(entry, query) {
   if (!query.type.startsWith("pinyin")) return null;
   let tier = 4;
   entryPinyinVariants(entry).forEach((variant) => {
      const marked = normalizePinyinMarked(variant.marked || variant.numbered || "");
      const numbered = normalizePinyinNumbered(variant.numbered || variant.marked || "");
      const plain = normalizePinyinPlain(variant.plain || variant.numbered || variant.marked || "");
      if (query.type === "pinyin-marked" && marked === query.marked) tier = Math.min(tier, 0);
      else if (query.type === "pinyin-numbered" && numbered === query.numbered) tier = Math.min(tier, 0);
      else if (plain === query.plain) tier = Math.min(tier, 1);
      else if (marked.startsWith(query.marked) || numbered.startsWith(query.numbered) || plain.startsWith(query.plain))
         tier = Math.min(tier, 3);
   });
   return tier;
}

function entryPinyinVariants(entry) {
   if (Array.isArray(entry.pinyin)) return entry.pinyin;
   if (entry.py) {
      return [
         {
            marked: normalizePinyinMarked(entry.py),
            numbered: normalizePinyinNumbered(entry.py),
            plain: normalizePinyinPlain(entry.py),
         },
      ];
   }
   return [];
}

function entryDefinitions(entry, language) {
   if (language === "fr")
      return Array.isArray(entry.definitionsFr)
         ? entry.definitionsFr
         : entry.fr
           ? [entry.fr]
           : [];
   return Array.isArray(entry.definitionsEn) ? entry.definitionsEn : [];
}

function entryHanziLength(entry) {
   return Array.from(entry.simplified || entry.hz || "").length;
}

function verifiedHskLevel(entry) {
   const levels = [
      ...(Array.isArray(entry.hskVerified)
         ? entry.hskVerified.map((item) => item.firstHskLevel ?? item.level)
         : []),
      ...(Array.isArray(entry.hskLegacy) ? entry.hskLegacy : []),
      ...(Array.isArray(entry.hsk30) ? entry.hsk30 : []),
   ].filter((value) => Number.isFinite(Number(value)));
   return levels.length ? Math.min(...levels.map(Number)) : null;
}

function normalizedDefinitionTokens(entry, language) {
   return entryDefinitions(entry, language).flatMap((definition) =>
      normalizeTranslation(definition).split(" ").filter(Boolean),
   );
}

function rankDictionaryEntry(entry, query, context) {
   const simplified = entry.simplified || entry.hz || "";
   const traditional = entry.traditional || simplified;
   const entryType = entry.entryType || (Array.from(simplified).length === 1 ? "character" : "word");
   const factors = [];
   let score = 0;
   const add = (name, value, explanation) => {
      if (!value) return;
      score += value;
      factors.push({ name, value, explanation });
   };

   if (query.type.startsWith("hanzi")) {
      if (simplified === query.hanzi)
         add("exactSimplified", SEARCH_WEIGHTS.EXACT_SIMPLIFIED, "forme simplifiée exacte");
      else if (traditional === query.hanzi)
         add("exactTraditional", SEARCH_WEIGHTS.EXACT_TRADITIONAL, "forme traditionnelle exacte");
      else if (simplified.startsWith(query.hanzi) || traditional.startsWith(query.hanzi))
         add("hanziPrefix", SEARCH_WEIGHTS.HANZI_PREFIX, "commence par la recherche");
      else if (simplified.includes(query.hanzi) || traditional.includes(query.hanzi))
         add("hanziContains", SEARCH_WEIGHTS.HANZI_CONTAINS, "contient la recherche");

      if ((simplified === query.hanzi || traditional === query.hanzi) && entryType === "character")
         add("exactCharacter", SEARCH_WEIGHTS.EXACT_CHARACTER, "caractère exact");
      if ((simplified === query.hanzi || traditional === query.hanzi) && entryType === "word")
         add("exactWord", SEARCH_WEIGHTS.EXACT_CHINESE_WORD, "mot exact");
   }

   if (query.type.startsWith("pinyin")) {
      let pinyinScore = 0;
      let pinyinExplanation = "";
      entryPinyinVariants(entry).forEach((variant) => {
         const marked = normalizePinyinMarked(variant.marked || variant.numbered || "");
         const numbered = normalizePinyinNumbered(variant.numbered || variant.marked || "");
         const plain = normalizePinyinPlain(variant.plain || variant.numbered || variant.marked || "");
         let candidate = 0;
         let explanation = "";
         if (query.type === "pinyin-marked" && marked === query.marked) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_MARKED;
            explanation = "pinyin accentué exact";
         } else if (query.type === "pinyin-numbered" && numbered === query.numbered) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_NUMBERED;
            explanation = "pinyin numéroté exact";
         } else if (plain === query.plain) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_PLAIN;
            explanation = "pinyin sans ton exact";
         } else if (
            marked.startsWith(query.marked) ||
            numbered.startsWith(query.numbered) ||
            plain.startsWith(query.plain)
         ) {
            candidate = SEARCH_WEIGHTS.PINYIN_PREFIX;
            explanation = "préfixe pinyin";
         }
         if (candidate > pinyinScore) {
            pinyinScore = candidate;
            pinyinExplanation = explanation;
         }
      });
      add("pinyin", pinyinScore, pinyinExplanation);
   }

   if (query.type === "translation") {
      const frenchTokens = normalizedDefinitionTokens(entry, "fr");
      const englishTokens = normalizedDefinitionTokens(entry, "en");
      const tokens = query.tokens || [];
      const exactFrench = tokens.length > 0 && tokens.every((token) => frenchTokens.includes(token));
      const prefixFrench =
         !exactFrench &&
         tokens.length > 0 &&
         tokens.every((token) => frenchTokens.some((word) => word.startsWith(token)));
      if (exactFrench)
         add("exactFrench", SEARCH_WEIGHTS.EXACT_FRENCH_TOKEN, "mot français exact");
      else if (prefixFrench)
         add("frenchPrefix", SEARCH_WEIGHTS.FRENCH_PREFIX_TOKEN, "préfixe français");
      else if (context && context.englishFallback) {
         const exactEnglish = tokens.length > 0 && tokens.every((token) => englishTokens.includes(token));
         if (exactEnglish)
            add("englishFallback", SEARCH_WEIGHTS.ENGLISH_FALLBACK, "repli anglais");
      }
   }

   if (entry.personalCard || entry.src === "card")
      add("personalCard", SEARCH_WEIGHTS.PERSONAL_CARD, "déjà dans Mes mots");
   if (entryType === "character")
      add("characterType", SEARCH_WEIGHTS.CHARACTER_TYPE, "entrée caractère");

   const hskLevel = verifiedHskLevel(entry);
   if (hskLevel != null)
      add("verifiedHsk", Math.max(30, SEARCH_WEIGHTS.VERIFIED_HSK - hskLevel * 35), "niveau HSK vérifié");

   if (Number.isFinite(entry.frequencyRank) && entry.frequencyRank > 0) {
      const frequencyScore = Math.max(
         1,
         Math.round(SEARCH_WEIGHTS.VERIFIED_FREQUENCY_MAX / Math.log2(entry.frequencyRank + 2)),
      );
      add("verifiedFrequency", frequencyScore, "fréquence vérifiée");
   }

   const french = entryDefinitions(entry, "fr");
   const english = entryDefinitions(entry, "en");
   if (french.length) add("frenchDefinition", SEARCH_WEIGHTS.FRENCH_DEFINITION, "définition française disponible");
   if (english.length) add("englishDefinition", SEARCH_WEIGHTS.ENGLISH_DEFINITION, "définition anglaise disponible");
   add(
      "sourceCompleteness",
      Math.min(Array.isArray(entry.sources) ? entry.sources.length : 0, 2) * SEARCH_WEIGHTS.SOURCE_COMPLETENESS,
      "sources concordantes",
   );
   score -= entryHanziLength(entry) * SEARCH_WEIGHTS.WORD_LENGTH_PENALTY;

   const exactTier = dictionaryExactSortTier(entry, query);
   const pinyinTier = dictionaryPinyinSortTier(entry, query);
   const sortTier = exactTier != null
      ? exactTier
      : pinyinTier != null
        ? pinyinTier + (pinyinTier <= 1 && verifiedHskLevel(entry) == null ? 0.5 : 0)
        : query.type.startsWith("hanzi")
          ? simplified.startsWith(query.hanzi) || traditional.startsWith(query.hanzi) ? 5 : 6
          : 0;

   return {
      score,
      sortTier,
      factors,
      explanation: factors.length ? factors[0].explanation : "correspondance indexée",
   };
}

function compareRankedDictionaryEntries(left, right) {
   return (
      (left.rank.sortTier ?? 0) - (right.rank.sortTier ?? 0) ||
      right.rank.score - left.rank.score ||
      Number(!!right.entry.personalCard) - Number(!!left.entry.personalCard) ||
      entryHanziLength(left.entry) - entryHanziLength(right.entry) ||
      Number(entryDefinitions(right.entry, "fr").length > 0) -
         Number(entryDefinitions(left.entry, "fr").length > 0) ||
      String(left.entry.simplified || left.entry.hz).localeCompare(
         String(right.entry.simplified || right.entry.hz),
         "zh",
      ) ||
      String(left.entry.id || left.entry.cardId || "").localeCompare(
         String(right.entry.id || right.entry.cardId || ""),
      )
   );
}

if (typeof module !== "undefined" && module.exports) {
   module.exports = {
      SEARCH_WEIGHTS,
      compareRankedDictionaryEntries,
      dictionaryVariantStatus,
      rankDictionaryEntry,
   };
}

"use strict";

const SEARCH_RESULT_LIMIT = 96;
const SEARCH_PREFIX_KEY_LIMIT = 160;
let dictionarySearchEpoch = 0;
let dictionaryPersonalRevision = 0;
const dictionarySearchCache = new Map();
const dictionaryFrenchSiblingCache = new Map();
const dictionaryPrefixCache = new WeakMap();
const DICTIONARY_SEARCH_CACHE_LIMIT = 24;

class StaleDictionarySearchError extends Error {
   constructor() {
      super("Recherche remplacée par une requête plus récente.");
      this.name = "StaleDictionarySearchError";
   }
}

function invalidateDictIndex() {
   dictionaryPersonalRevision++;
   dictionarySearchCache.clear();
}

function clearDictionarySearchCache() {
   dictionarySearchCache.clear();
   dictionaryFrenchSiblingCache.clear();
}

function cancelDictionarySearches() {
   dictionarySearchEpoch++;
   if (typeof rejectPendingDictionaryWorkerSearches === "function")
      rejectPendingDictionaryWorkerSearches();
}

function ensureCurrentSearch(epoch) {
   if (epoch !== dictionarySearchEpoch) throw new StaleDictionarySearchError();
}

function postingIntersection(postings) {
   if (!postings.length) return [];
   if (postings.length === 1) return postings[0].slice();
   const remaining = postings.slice(1).map((values) => new Set(values));
   return postings[0].filter((reference) =>
      remaining.every((values) => values.has(reference)),
   );
}

function prefixPostings(index, prefix, maximumKeys) {
   let cachedByPrefix = dictionaryPrefixCache.get(index);
   if (!cachedByPrefix) {
      cachedByPrefix = new Map();
      dictionaryPrefixCache.set(index, cachedByPrefix);
   }
   const cacheKey = prefix + "§" + (maximumKeys || SEARCH_PREFIX_KEY_LIMIT);
   if (cachedByPrefix.has(cacheKey)) return cachedByPrefix.get(cacheKey);
   const output = [];
   let matchedKeys = 0;
   for (const key of Object.keys(index)) {
      if (!key.startsWith(prefix) || key === prefix) continue;
      output.push(index[key]);
      matchedKeys++;
      if (matchedKeys >= (maximumKeys || SEARCH_PREFIX_KEY_LIMIT)) break;
   }
   cachedByPrefix.set(cacheKey, output);
   return output;
}

function dictionarySearchCacheKey(query, settings) {
   return JSON.stringify([
      dictionaryPersonalRevision,
      query.type,
      query.hanzi || "",
      query.marked || "",
      query.numbered || "",
      query.plain || "",
      query.translation || "",
      settings.candidateLimit || SEARCH_RESULT_LIMIT,
      settings.limit || SEARCH_RESULT_LIMIT,
   ]);
}

function rememberDictionarySearch(key, response) {
   dictionarySearchCache.delete(key);
   dictionarySearchCache.set(key, response);
   while (dictionarySearchCache.size > DICTIONARY_SEARCH_CACHE_LIMIT) {
      const oldest = dictionarySearchCache.keys().next().value;
      dictionarySearchCache.delete(oldest);
   }
}

function addCandidateReferences(target, references, matchKind, maximum) {
   for (const reference of references || []) {
      if (!target.has(reference)) target.set(reference, matchKind);
      if (target.size >= maximum) return;
   }
}

function personalCardAsDictionaryEntry(card) {
   const marked = normalizePinyinMarked(card.py || "");
   return {
      id: "personal-" + card.id,
      simplified: card.hz,
      traditional: card.hz,
      entryType: Array.from(card.hz).length === 1 ? "character" : "word",
      pinyin: marked
         ? [
              {
                 marked,
                 numbered: normalizePinyinNumbered(marked),
                 plain: normalizePinyinPlain(marked),
              },
           ]
         : [],
      definitionsFr: card.fr ? [card.fr] : [],
      definitionsEn: [],
      sources: [],
      sourceRefs: [],
      hskLegacy: [],
      hsk30: [],
      frequencyRank: null,
      characters: Array.from(card.hz).filter((character) => HAN_PATTERN.test(character)),
      searchAliases: [],
      dictionaryEntryId: card.dictionaryEntryId || "",
      personalCard: card,
      cardId: card.id,
      src: "card",
   };
}

function personalEntryMatches(entry, query) {
   if (query.type.startsWith("hanzi"))
      return entry.simplified.includes(query.hanzi);
   if (query.type.startsWith("pinyin")) {
      return entry.pinyin.some((variant) => {
         if (query.type === "pinyin-marked") return variant.marked === query.marked;
         if (query.type === "pinyin-numbered") return variant.numbered === query.numbered;
         return variant.plain === query.plain || variant.plain.startsWith(query.plain);
      });
   }
   if (query.type === "translation") {
      const words = normalizeTranslation(entry.definitionsFr.join(" ")).split(" ");
      return query.tokens.every((token) =>
         words.some((word) => word === token || word.startsWith(token)),
      );
   }
   return false;
}

function dictionaryEntryIdentity(entry) {
   const pronunciation = entry.pinyin[0]
      ? normalizePinyinNumbered(entry.pinyin[0].numbered || entry.pinyin[0].marked)
      : "";
   return entry.simplified + "§" + pronunciation;
}

function dictionaryEntryPronunciationKeys(entry) {
   return new Set(
      entryPinyinVariants(entry)
         .map((variant) => normalizePinyinNumbered(variant.numbered || variant.marked || ""))
         .filter(Boolean),
   );
}

async function dictionaryEntryWithFrenchSibling(entry) {
   if (!entry || (entry.definitionsFr || []).length || !entry.simplified) return entry;
   const pronunciation = Array.from(dictionaryEntryPronunciationKeys(entry)).sort().join("/");
   const cacheKey = entry.simplified + "§" + pronunciation;
   if (!dictionaryFrenchSiblingCache.has(cacheKey)) {
      dictionaryFrenchSiblingCache.set(cacheKey, (async () => {
         const index = await loadDictionaryIndex("exactHanzi", false);
         const references = index[entry.simplified] || [];
         if (!references.length) return null;
         const exactEntries = (await loadDictionaryEntriesByReferences(references)).filter(
            (candidate) =>
               candidate.simplified === entry.simplified &&
               candidate.id !== entry.id &&
               (candidate.definitionsFr || []).length,
         );
         if (!exactEntries.length) return null;
         const samePronunciation = pronunciation
            ? exactEntries.filter((candidate) => dictionaryEntriesSharePronunciation(entry, candidate))
            : [];
         const sibling = samePronunciation[0] || (!pronunciation ? exactEntries[0] : null);
         if (!sibling) return null;
         return {
            entryId: sibling.id,
            definitionsFr: sibling.definitionsFr.slice(),
         };
      })().catch((error) => {
         dictionaryFrenchSiblingCache.delete(cacheKey);
         throw error;
      }));
   }
   const french = await dictionaryFrenchSiblingCache.get(cacheKey);
   return french
      ? {
           ...entry,
           definitionsFr: french.definitionsFr.slice(),
           __frenchSiblingEntryId: french.entryId,
        }
      : entry;
}

function annotateDictionaryScriptVariants(entries, query) {
   const modern = new Set();
   entries.forEach((entry) => {
      if (entry.entryType !== "word" || entry.simplified !== entry.traditional) return;
      dictionaryEntryPronunciationKeys(entry).forEach((pinyin) => modern.add(entry.simplified + "§" + pinyin));
   });
   entries.forEach((entry) => {
      entry.__scriptVariant = false;
      if (entry.entryType !== "word" || entry.simplified === entry.traditional) return;
      entry.__scriptVariant = Array.from(dictionaryEntryPronunciationKeys(entry)).some((pinyin) =>
         modern.has(entry.simplified + "§" + pinyin),
      );
   });
}

function dictionaryEntriesSharePronunciation(left, right) {
   const leftPinyin = dictionaryEntryPronunciationKeys(left);
   return Array.from(dictionaryEntryPronunciationKeys(right)).some((pinyin) => leftPinyin.has(pinyin));
}

function dictionaryExplicitVariantTargets(entry) {
   if (dictionaryVariantStatus(entry) === "modern") return new Set();
   const definitions = [...(entry.definitionsFr || []), ...(entry.definitionsEn || [])].join(" ");
   if (!/variante?|variant|ancienne?|archaic|old form/iu.test(definitions)) return new Set();
   return new Set((definitions.match(/\p{Script=Han}+/gu) || []).flatMap((value) => Array.from(value)));
}

function isVisualScriptVariantOf(candidate, primary) {
   if (!candidate || !primary || candidate.id === primary.id) return false;
   if (primary.traditional !== primary.simplified) return false;
   const traditionalWord =
      candidate.entryType === "word" && candidate.simplified === primary.simplified &&
      candidate.traditional && candidate.traditional !== candidate.simplified;
   const explicitVariant = dictionaryExplicitVariantTargets(candidate).has(primary.simplified);
   if (!traditionalWord && !explicitVariant) return false;
   return dictionaryEntriesSharePronunciation(candidate, primary);
}

function querySelectsTraditionalEntry(query, entry) {
   return !!(
      query && query.type && query.type.startsWith("hanzi") &&
      query.hanzi === entry.traditional && entry.traditional !== entry.simplified
   );
}

function groupDictionaryScriptVariants(response) {
   if (!response || !Array.isArray(response.results)) return response;
   const hidden = new Set();
   response.results.forEach((result) => {
      const candidate = result.entry;
      if (querySelectsTraditionalEntry(response.query, candidate)) return;
      const primary = response.results.find((item) =>
         !hidden.has(item.entry.id) && isVisualScriptVariantOf(candidate, item.entry),
      );
      if (!primary) return;
      primary.entry.visualVariants = [...(primary.entry.visualVariants || []), candidate];
      hidden.add(candidate.id);
   });
   response.results = response.results.filter((result) => !hidden.has(result.entry.id));
   response.results.forEach((result) => {
      if (!result.entry.visualVariants) return;
      result.entry.visualVariants.sort((left, right) =>
         (left.traditional || left.simplified).localeCompare(right.traditional || right.simplified, "zh"),
      );
   });
   response.visualVariantsGrouped = hidden.size;
   return response;
}

function dictionaryDefinitionKeys(entry) {
   return new Set(
      [...entryDefinitions(entry, "fr"), ...entryDefinitions(entry, "en")]
         .map(normalizeTranslation)
         .filter(Boolean),
   );
}

function visuallyEquivalentDictionaryEntries(left, right) {
   if (left.entryType === right.entryType) return false;
   const word = left.entryType === "word" ? left : right.entryType === "word" ? right : null;
   const character = left.entryType === "character" ? left : right.entryType === "character" ? right : null;
   if (!word || !character) return false;
   const sameModernForm = word.simplified === character.simplified && word.traditional === word.simplified;
   const sameTraditionalForm = word.traditional !== word.simplified && word.traditional === character.simplified;
   if (!sameModernForm && !sameTraditionalForm) return false;
   const leftPinyin = dictionaryEntryPronunciationKeys(left);
   if (!Array.from(dictionaryEntryPronunciationKeys(right)).some((pinyin) => leftPinyin.has(pinyin))) return false;
   const leftDefinitions = dictionaryDefinitionKeys(left);
   return Array.from(dictionaryDefinitionKeys(right)).some((definition) => leftDefinitions.has(definition));
}

function mergeDictionaryResultMetadata(primary, duplicate) {
   const entry = primary.entry;
   const other = duplicate.entry;
   entry.visualGroup = Array.from(new Set([
      ...(entry.visualGroup || [entry.id]),
      ...(other.visualGroup || [other.id]),
   ]));
   entry.visualEntryTypes = Array.from(new Set([
      ...(entry.visualEntryTypes || [entry.entryType]),
      ...(other.visualEntryTypes || [other.entryType]),
   ]));
   entry.sources = Array.from(new Set([...(entry.sources || []), ...(other.sources || [])]));
   entry.hskLegacy = Array.from(new Set([...(entry.hskLegacy || []), ...(other.hskLegacy || [])]));
   entry.hsk30 = Array.from(new Set([...(entry.hsk30 || []), ...(other.hsk30 || [])]));
   entry.hskVerified = [...(entry.hskVerified || []), ...(other.hskVerified || [])].filter(
      (item, index, values) => values.findIndex((candidate) => candidate.hskEntryId === item.hskEntryId) === index,
   );
   if (!entry.definitionsFr?.length && other.definitionsFr?.length) {
      const primaryMeanings = dictionaryDefinitionKeys(entry);
      entry.definitionsFr = other.definitionsFr.filter((definition) =>
         primaryMeanings.has(normalizeTranslation(definition)),
      );
   }
   if (other.personalCard && !entry.personalCard) entry.personalCard = other.personalCard;
   primary.rank.score = Math.max(primary.rank.score, duplicate.rank.score);
   return primary;
}

function mergeDictionaryVisualResults(response) {
   if (!response || !Array.isArray(response.results)) return response;
   if (response.visualPresentationReady) return response;
   const output = [];
   let merged = 0;
   response.results.forEach((result) => {
      const match = output.find((candidate) =>
         visuallyEquivalentDictionaryEntries(candidate.entry, result.entry),
      );
      if (!match) output.push(result);
      else {
         mergeDictionaryResultMetadata(match, result);
         merged++;
      }
   });
   response.results = output.sort(compareRankedDictionaryEntries);
   response.visualDuplicatesMerged = merged;
   groupDictionaryScriptVariants(response);
   response.visualPresentationReady = true;
   return response;
}

async function collectIndexedCandidates(query, epoch, onStatus, maximumCandidates) {
   const candidates = new Map();
   const maximum = maximumCandidates || SEARCH_RESULT_LIMIT;
   let englishFallback = false;
   let sequence = false;
   const status = (message) => onStatus && onStatus(message);

   if (query.type.startsWith("hanzi")) {
      status("Chargement de l’index des caractères…");
      const index = await loadDictionaryIndex("exactHanzi", false);
      ensureCurrentSearch(epoch);
      const exact = index[query.hanzi] || [];
      addCandidateReferences(candidates, exact, "exact-hanzi", maximum);

      if (query.characters.length > 1 && exact.length === 0) {
         sequence = true;
         query.characters.forEach((character) =>
            addCandidateReferences(candidates, index[character], "sequence-character", maximum),
         );
      } else {
         const prefixGroups = prefixPostings(index, query.hanzi, SEARCH_PREFIX_KEY_LIMIT);
         prefixGroups.forEach((references) =>
            addCandidateReferences(candidates, references, "hanzi-prefix", maximum),
         );
         if (candidates.size < maximum && query.hanzi.length <= 3) {
            for (const key of Object.keys(index)) {
               if (key === query.hanzi || key.startsWith(query.hanzi) || !key.includes(query.hanzi)) continue;
               addCandidateReferences(candidates, index[key], "hanzi-contains", maximum);
               if (candidates.size >= maximum) break;
            }
         }
      }
   } else if (query.type.startsWith("pinyin")) {
      status("Chargement de l’index pinyin…");
      const index = await loadDictionaryIndex("pinyin", false);
      ensureCurrentSearch(epoch);
      const strictKey =
         query.type === "pinyin-marked"
            ? query.marked
            : query.type === "pinyin-numbered"
              ? query.numbered
              : query.plain;
      addCandidateReferences(candidates, index[strictKey], "exact-pinyin", maximum);
      prefixPostings(index, strictKey, SEARCH_PREFIX_KEY_LIMIT).forEach((references) =>
         addCandidateReferences(candidates, references, "pinyin-prefix", maximum),
      );
      if (query.type !== "pinyin-plain" && candidates.size < maximum) {
         addCandidateReferences(candidates, index[query.plain], "toneless-fallback", maximum);
      }
   } else if (query.type === "translation") {
      status("Chargement de l’index français…");
      const french = await loadDictionaryIndex("french", false);
      ensureCurrentSearch(epoch);
      const exactGroups = query.tokens.map((token) => french[token] || []);
      const exact = postingIntersection(exactGroups);
      addCandidateReferences(candidates, exact, "exact-french", maximum);
      if (candidates.size < maximum) {
         const perToken = query.tokens.map((token) => {
            const references = new Set(french[token] || []);
            prefixPostings(french, token, 80).forEach((posting) =>
               posting.forEach((reference) => references.add(reference)),
            );
            return Array.from(references);
         });
         addCandidateReferences(
            candidates,
            postingIntersection(perToken),
            "french-prefix",
            maximum,
         );
      }
      if (candidates.size === 0) {
         status("Aucun résultat français · essai du repli anglais…");
         const english = await loadDictionaryIndex("english", false);
         ensureCurrentSearch(epoch);
         const groups = query.tokens.map((token) => english[token] || []);
         addCandidateReferences(
            candidates,
            postingIntersection(groups),
            "english-fallback",
            maximum,
         );
         englishFallback = candidates.size > 0;
      }
   }

   return { candidates, englishFallback, sequence };
}

async function searchDictionaryLocally(rawQuery, options) {
   const settings = options || {};
   const started = performance.now();
   const epoch = ++dictionarySearchEpoch;
   const query = classifySearchQuery(rawQuery);
   if (!query.valid) {
      return {
         query,
         results: [],
         totalCandidates: 0,
         limited: false,
         englishFallback: false,
         sequence: false,
         durationMs: performance.now() - started,
      };
   }

   const cacheKey = dictionarySearchCacheKey(query, settings);
   if (dictionarySearchCache.has(cacheKey)) {
      const cached = dictionarySearchCache.get(cacheKey);
      dictionarySearchCache.delete(cacheKey);
      dictionarySearchCache.set(cacheKey, cached);
      return {
         ...cached,
         cached: true,
         durationMs: performance.now() - started,
      };
   }

   const revision = dictionaryPersonalRevision;
   const candidateLimit = Math.max(1, Math.min(settings.candidateLimit || SEARCH_RESULT_LIMIT, SEARCH_RESULT_LIMIT));
   const indexed = await collectIndexedCandidates(query, epoch, settings.onStatus, candidateLimit);
   ensureCurrentSearch(epoch);
   const references = Array.from(indexed.candidates.keys()).slice(0, candidateLimit);
   if (settings.onStatus) settings.onStatus("Chargement des meilleures fiches…");
   const dictionaryEntries = await loadDictionaryPreviewsByReferences(references);
   ensureCurrentSearch(epoch);

   const personalEntries = db.cards
      .map(personalCardAsDictionaryEntry)
      .filter((entry) => personalEntryMatches(entry, query));
   const personalBySourceId = new Map(
      personalEntries.filter((entry) => entry.dictionaryEntryId).map((entry) => [entry.dictionaryEntryId, entry.personalCard]),
   );
   const legacyPersonalByIdentity = new Map(
      personalEntries.filter((entry) => !entry.dictionaryEntryId).map((entry) => [dictionaryEntryIdentity(entry), entry.personalCard]),
   );
   dictionaryEntries.forEach((entry) => {
      const card = personalBySourceId.get(entry.id) || legacyPersonalByIdentity.get(dictionaryEntryIdentity(entry));
      if (card) entry.personalCard = card;
   });

   const dictionaryIdentities = new Set(dictionaryEntries.map(dictionaryEntryIdentity));
   const dictionaryIds = new Set(dictionaryEntries.map((entry) => entry.id));
   const merged = [
      ...dictionaryEntries,
      ...personalEntries.filter((entry) =>
         entry.dictionaryEntryId
            ? !dictionaryIds.has(entry.dictionaryEntryId)
            : !dictionaryIdentities.has(dictionaryEntryIdentity(entry)),
      ),
   ];
   annotateDictionaryScriptVariants(merged, query);
   const ranked = merged
      .map((entry) => ({
         entry,
         rank: rankDictionaryEntry(entry, query, {
            englishFallback: indexed.englishFallback,
            indexedMatch: indexed.candidates.get(entry.__reference),
         }),
      }))
      .sort(compareRankedDictionaryEntries);

   ensureCurrentSearch(epoch);
   const response = {
      query: indexed.sequence ? { ...query, type: "hanzi-sequence" } : query,
      results: ranked.slice(0, settings.limit || SEARCH_RESULT_LIMIT),
      totalCandidates: indexed.candidates.size + personalEntries.length,
      limited: indexed.candidates.size >= candidateLimit,
      englishFallback: indexed.englishFallback,
      sequence: indexed.sequence,
      personalRevision: revision,
      durationMs: performance.now() - started,
   };
   rememberDictionarySearch(cacheKey, response);
   return response;
}

let dictionarySearchWorker = null;
let dictionarySearchWorkerSequence = 0;
const dictionarySearchWorkerRequests = new Map();

function canUseDictionarySearchWorker() {
   if (typeof window === "undefined" || typeof Worker === "undefined") return false;
   const path = new URL(document.baseURI).pathname;
   return !/\/dist\/[^/]+\.html$/u.test(path) && location.protocol !== "file:";
}

function rejectPendingDictionaryWorkerSearches() {
   dictionarySearchWorkerRequests.forEach(({ reject }) =>
      reject(new StaleDictionarySearchError()),
   );
   dictionarySearchWorkerRequests.clear();
}

function getDictionarySearchWorker() {
   if (dictionarySearchWorker) return dictionarySearchWorker;
   const url = new URL("js/search/dictionary-search-worker.js", document.baseURI);
   dictionarySearchWorker = new Worker(url.href);
   dictionarySearchWorker.addEventListener("message", (event) => {
      const message = event.data || {};
      const request = dictionarySearchWorkerRequests.get(message.id);
      if (!request) return;
      if (message.type === "status") {
         if (request.onStatus) request.onStatus(message.message);
         return;
      }
      dictionarySearchWorkerRequests.delete(message.id);
      if (message.type === "result") request.resolve(message.response);
      else if (message.stale) request.reject(new StaleDictionarySearchError());
      else request.reject(new Error(message.error || "Recherche dictionnaire impossible."));
   });
   dictionarySearchWorker.addEventListener("error", (event) => {
      const error = new Error(event.message || "Le moteur de recherche isolé a échoué.");
      dictionarySearchWorkerRequests.forEach(({ reject }) => reject(error));
      dictionarySearchWorkerRequests.clear();
      dictionarySearchWorker.terminate();
      dictionarySearchWorker = null;
   });
   return dictionarySearchWorker;
}

function resetDictionarySearchWorker() {
   rejectPendingDictionaryWorkerSearches();
   if (!dictionarySearchWorker) return;
   dictionarySearchWorker.postMessage({ type: "reset" });
}

function searchDictionary(rawQuery, options) {
   if (!canUseDictionarySearchWorker()) return searchDictionaryLocally(rawQuery, options);
   rejectPendingDictionaryWorkerSearches();
   const settings = options || {};
   const id = ++dictionarySearchWorkerSequence;
   const worker = getDictionarySearchWorker();
   return new Promise((resolve, reject) => {
      dictionarySearchWorkerRequests.set(id, {
         resolve,
         reject,
         onStatus: settings.onStatus,
      });
      worker.postMessage({
         type: "search",
         id,
         rawQuery,
         settings: {
            candidateLimit: settings.candidateLimit,
            limit: settings.limit,
         },
         personalCards: Array.isArray(db.cards) ? db.cards : [],
         personalRevision: dictionaryPersonalRevision,
      });
   });
}

async function findDictionaryEntryByHanzi(hanzi) {
   const response = await searchDictionary(hanzi, { candidateLimit: 12, limit: 12 });
   return response.results[0] ? response.results[0].entry : null;
}

};

function readRecentSearches() {
   try {
      const value = JSON.parse(localStorage.getItem(SEARCH_RECENT_KEY) || "[]");
      return Array.isArray(value)
         ? value.filter((item) => typeof item === "string" && item.trim()).slice(0, 8)
         : [];
   } catch (error) {
      return [];
   }
}

function rememberRecentSearch(query) {
   const visible = normalizeVisibleWhitespace(query);
   if (!visible) return;
   const recent = readRecentSearches().filter(
      (item) => normalizeVisibleWhitespace(item).toLowerCase() !== visible.toLowerCase(),
   );
   recent.unshift(visible);
   try {
      localStorage.setItem(SEARCH_RECENT_KEY, JSON.stringify(recent.slice(0, 8)));
   } catch (error) {
      /* Le dictionnaire reste utilisable si le stockage privé est indisponible. */
   }
}

function currentUnit() {
   const pool = db.cards.filter((card) => !card.acquired && card.unit != null);
   const fresh = pool.filter((card) => card.due == null).sort(unitSort);
   if (fresh.length) return fresh[0].unit;
   const any = pool.sort(unitSort);
   return any.length ? any[0].unit : null;
}

function continuingCards() {
   const unit = currentUnit();
   const candidates = unit == null ? db.cards : db.cards.filter((card) => card.unit === unit);
   return candidates.slice().sort(unitSort).slice(0, 6);
}

function dictionaryEntryPinyinText(entry) {
   return uniqueDetailValues((entry.pinyin || []).map((variant) => variant.marked).filter(Boolean)).join(" · ");
}

function dictionaryResultDefinition(entry) {
   if (entry.definitionsFr && entry.definitionsFr.length)
      return { text: entry.definitionsFr[0], english: false, unavailable: false };
   if (entry.definitionsEn && entry.definitionsEn.length)
      return { text: "Traduction française indisponible", english: true, englishText: entry.definitionsEn[0], unavailable: true };
   return { text: "Traduction française indisponible", english: false, unavailable: true };
}

function dictionaryEntryDetailedTypeLabels(entry) {
   const definitions = [...(entry.definitionsFr || []), ...(entry.definitionsEn || [])].join(" ");
   const parts = (entry.hskVerified || []).map((item) => item.partOfSpeech || "").join("、");
   const labels = [];
   if (dictionaryVariantStatus(entry) !== "modern") labels.push("variante");
   if (/classifier|classificateur|measure word|\bCL:/iu.test(definitions + " " + parts)) labels.push("classificateur");
   if (/suffix|suffixe/iu.test(definitions + " " + parts)) labels.push("suffixe");
   if (/proper noun|surname|nom propre/iu.test(definitions + " " + parts)) labels.push("nom");
   if (/\bverb\b|verbe|动词|動詞/iu.test(parts)) labels.push("verbe");
   if (/\bnoun\b|\bnom\b|名词|名詞/iu.test(parts)) labels.push("nom");
   const structural = (entry.visualEntryTypes || []).includes("word") || entry.entryType === "word"
      ? "mot"
      : entry.entryType === "character" ? "caractère" : "mot";
   return Array.from(new Set([structural, ...labels]));
}

function dictionaryEntryTypeLabels(entry) {
   if (dictionaryVariantStatus(entry) !== "modern") return ["Variante"];
   if ((entry.visualEntryTypes || []).includes("word") || entry.entryType === "word") return ["Mot"];
   return ["Caractère"];
}

function verifiedResultHskBadge(entry) {
   const verified = verifiedHskLevels(entry);
   if (verified.length)
      return '<i class="b hsk-badge hsk-level-' + verified[0] + '" data-hsk-badge="' +
         esc(verified.join(" ")) + '">HSK ' + verified.map(esc).join(" · ") + "</i>";
   if (entry.hskLegacy && entry.hskLegacy.length)
      return '<i class="b u">HSK ' + esc(entry.hskLegacy[0]) + "</i>";
   if (entry.hsk30 && entry.hsk30.length)
      return '<i class="b u">HSK 3.0 · ' + esc(entry.hsk30[0]) + "</i>";
   return "";
}

function dictionaryResultDisplayHanzi(entry) {
   const query = srch.search && srch.search.query;
   if (
      query && query.type && query.type.startsWith("hanzi") &&
      query.hanzi === entry.traditional && entry.traditional !== entry.simplified
   ) return entry.traditional;
   if (entry.__selectedHanzi) return entry.__selectedHanzi;
   if (dictionaryVariantStatus(entry) !== "modern" && entry.traditional !== entry.simplified)
      return entry.traditional;
   return entry.simplified;
}

function dictionaryResultBadgesHtml(entry) {
   const badges = dictionaryEntryTypeLabels(entry)
      .map((label) => '<i class="b u">' + esc(label) + "</i>");
   const hsk = verifiedResultHskBadge(entry);
   if (hsk) badges.push(hsk);
   if (entry.personalCard) badges.push('<i class="b jade">Mes mots</i>');
   return badges.slice(0, entry.personalCard ? 3 : 2).join("");
}

function dictionaryResultVariantsHtml(entry, resultIndex) {
   const variants = Array.isArray(entry.visualVariants) ? entry.visualVariants : [];
   if (!variants.length) return "";
   const allTraditional = variants.every((variant) => variant.traditional !== variant.simplified);
   const label = variants.length + " variante" + (variants.length > 1 ? "s" : "") +
      (allTraditional ? " traditionnelle" + (variants.length > 1 ? "s" : "") : " graphique" + (variants.length > 1 ? "s" : ""));
   return '<details class="dict-result-variants"><summary>' + esc(label) +
      '</summary><div class="dict-result-variant-list">' +
      variants.map((variant, variantIndex) => {
         const form = variant.traditional || variant.simplified;
         return '<button class="dict-result-variant" type="button" data-result-variant="' +
            resultIndex + ':' + variantIndex + '" aria-label="Ouvrir la fiche exacte de ' + esc(form) +
            '"><b>' + esc(form) + '</b><span>→ ' + esc(variant.simplified) + ' · ' +
            colorPinyin(dictionaryEntryPinyinText(variant)) + '</span></button>';
      }).join("") + "</div></details>";
}

function dictionaryResultHtml(item, index) {
   const entry = item.entry;
   const definition = dictionaryResultDefinition(entry);
   const displayHanzi = dictionaryResultDisplayHanzi(entry);

   return (
      '<article class="dict-result" data-entry-id="' + esc(entry.id) + '"><button class="dict-result-primary" type="button" data-result-index="' + index + '">' +
      '<span class="dict-result-hanzi"><b>' + esc(displayHanzi) + "</b>" +

      '<small class="dict-match">' + esc(item.rank.explanation) +

   );
}
