<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover"
      />
      <meta name="theme-color" content="#DED2BA" />
      <title>墨室 · Mò Studio</title>
      <link
         rel="icon"
         href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%239E2B25'/%3E%3Ctext%20x='50'%20y='70'%20font-size='56'%20text-anchor='middle'%20fill='%23EFE7D3'%20font-family='serif'%3E墨%3C/text%3E%3C/svg%3E"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <style>
/* ============ Mò Studio v4 — encre, papier de riz, laque ============ */
         :root {
            --paper: #ded2ba;
            --paper-2: #e7ddc9;
            --card: #efe7d3;
            --card-2: #f4eddd;
            --ink: #17140f;
            --ink-soft: #4a4132;
            --ink-faint: #7a7061;
            --line: #c9bca0;
            --line-soft: #d8ccb0;
            --lacquer: #9e2b25;
            --seal: #c0392b;
            --gold: #a8873a;
            --jade: #2e6b57;
            --t1: #b0392f;
            --t2: #b5822a;
            --t3: #2e6b57;
            --t4: #2f5480;
            --t5: #7a7061;
            --r: 14px;
            --shadow: 0 10px 30px rgba(23, 20, 15, 0.13);
            --serif: "Noto Serif SC", "Songti SC", serif;
            --disp: "EB Garamond", Georgia, serif;
            --ui: "IBM Plex Sans", system-ui, sans-serif;
         }
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }
         body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--ui);
            font-size: 16px;
            line-height: 1.5;
            min-height: 100dvh;
            padding-bottom: calc(86px + env(safe-area-inset-bottom));
            overflow-x: hidden;
         }
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.55%200%200%200%200%200.48%200%200%200%200%200.36%200%200%200%200.05%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23n)'/%3E%3C/svg%3E");
         }
         button {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
         }
         button:focus-visible,
         a:focus-visible,
         input:focus-visible,
         select:focus-visible,
         textarea:focus-visible,
         summary:focus-visible,
         [tabindex]:focus-visible {
            outline: 3px solid var(--jade);
            outline-offset: 3px;
         }
         input,
         select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
         }
         h2,
         h3 {
            margin: 0;
            font-weight: 600;
         }
         p {
            margin: 0.4em 0;
         }
         [hidden] {
            display: none !important;
         }

         /* ---------- header & layout ---------- */
         .top {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 10px;
            background: linear-gradient(var(--paper) 75%, transparent);
         }
         .brand {
            display: flex;
            align-items: center;
            gap: 10px;
         }
         .brand-seal {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--lacquer);
            color: var(--card);
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 10px rgba(158, 43, 37, 0.35);
         }
         .brand-name {
            font-family: var(--disp);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.02em;
         }
         .seal-btn {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--card);
            border: 1.5px solid var(--lacquer);
            color: var(--lacquer);
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 600;
            transform: rotate(2deg);
            transition: transform 0.15s;
         }
         .seal-btn:active {
            transform: rotate(2deg) scale(0.93);
         }
         .seal-btn.add {
            transform: rotate(-2deg);
         }
         #view {
            max-width: 560px;
            margin: 0 auto;
            padding: 4px 16px 24px;
         }
         .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            position: relative;
         }
         .pad {
            padding: 20px 18px;
            margin-bottom: 16px;
         }
         .v-t {
            font-family: var(--disp);
            font-size: 24px;
            margin-bottom: 6px;
         }
         .eyebrow {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            margin: 16px 0 8px;
            font-weight: 600;
         }
         .muted {
            color: var(--ink-soft);
            font-size: 14.5px;
         }

         /* ---------- hero, CTA, stats ---------- */
         .hero {
            text-align: center;
            padding: 12px 0 4px;
         }
         .hero-hz {
            font-family: var(--serif);
            font-size: 58px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.08em;
         }
         .hero-sub {
            font-family: var(--disp);
            font-style: italic;
            color: var(--ink-soft);
            margin-top: 2px;
         }
         .cta {
            display: block;
            width: 100%;
            text-align: left;
            margin: 14px 0 10px;
            background: var(--lacquer);
            color: #f6efdd;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 8px 22px rgba(158, 43, 37, 0.32);
            transition:
               transform 0.12s,
               opacity 0.15s;
         }
         .cta:active {
            transform: scale(0.98);
         }
         .cta:disabled {
            opacity: 0.6;
            pointer-events: none;
         }
         .cta b {
            display: block;
            font-family: var(--disp);
            font-size: 21px;
            letter-spacing: 0.01em;
         }
         .cta span {
            display: block;
            font-size: 13.5px;
            opacity: 0.92;
            margin-top: 3px;
         }
         .cta .u-line {
            display: block;
            font-size: 12.5px;
            opacity: 0.78;
            margin-top: 7px;
            font-style: italic;
         }
         .resume {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--card);
            border: 1.5px dashed var(--gold);
            border-radius: 13px;
            padding: 11px 14px;
            margin: 12px 0 2px;
         }
         .resume span {
            font-size: 14px;
            color: var(--ink-soft);
         }
         .resume .btn {
            margin: 0;
         }
         .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 4px 8px;
            text-align: center;
            transition: transform 0.1s;
         }
         .stat b {
            display: block;
            font-family: var(--disp);
            font-size: 22px;
            line-height: 1.15;
         }
         .stat span {
            font-size: 11px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
         }
         .stat:active {
            transform: scale(0.97);
         }

         /* ---------- séance libre (repliée) ---------- */
         details.free {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            margin: 12px 0 16px;
         }
         details.free > summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            padding: 15px 16px;
         }
         details.free > summary::-webkit-details-marker {
            display: none;
         }
         details.free > summary::after {
            content: "＋";
            margin-left: auto;
            color: var(--gold);
            font-size: 18px;
         }
         details.free[open] > summary::after {
            content: "－";
         }
         .free-hz {
            font-family: var(--serif);
            font-size: 21px;
            color: var(--lacquer);
         }
         .free-body {
            padding: 0 16px 16px;
         }

         /* ---------- chips, boutons, inputs ---------- */
         .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
         }
         .chip {
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 14px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .hzchip {
            font-family: var(--serif);
            font-size: 19px;
            padding: 6px 11px;
         }
         .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            background: var(--card-2);
            border: 1px solid var(--line);
            color: var(--ink);
            transition: transform 0.1s;
         }
         .btn:active {
            transform: scale(0.97);
         }
         .btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .btn.danger {
            background: none;
            border-color: var(--lacquer);
            color: var(--lacquer);
         }
         .btn.ghost {
            background: none;
            border-color: transparent;
            color: var(--ink-soft);
         }
         .btn.sm {
            padding: 7px 12px;
            font-size: 13.5px;
            border-radius: 10px;
         }
         .btn.wide {
            width: 100%;
            margin-top: 8px;
         }
         .btn.big {
            padding: 14px 22px;
            font-size: 16px;
         }
         .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
         }
         .ck {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 0;
            font-size: 14.5px;
            color: var(--ink-soft);
            cursor: pointer;
         }
         .ck input {
            width: 17px;
            height: 17px;
            accent-color: var(--lacquer);
         }
         .search {
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: var(--card-2);
            outline: none;
            font-size: 15px;
         }
         .search:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(168, 135, 58, 0.18);
         }
         .f-lab {
            display: block;
            font-size: 13px;
            color: var(--ink-faint);
            margin: 10px 0;
         }
         .f-lab .search,
         .f-lab select,
         .f-lab input[type="range"] {
            margin-top: 4px;
         }
         input[type="range"] {
            width: 100%;
            accent-color: var(--lacquer);
         }
         .selects {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .selects .search {
            flex: 1;
            padding: 9px 10px;
            font-size: 14px;
         }
         .modes {
            display: grid;
            gap: 10px;
            margin-top: 6px;
         }
         .mode {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px 15px;
            transition:
               transform 0.1s,
               border-color 0.15s;
         }
         .mode:active {
            transform: scale(0.98);
         }
         .mode:not(:disabled):hover {
            border-color: var(--gold);
         }
         .mode .m-hz {
            font-family: var(--serif);
            font-size: 26px;
            color: var(--lacquer);
            width: 34px;
            text-align: center;
         }
         .mode b {
            display: block;
            font-size: 15.5px;
         }
         .mode span {
            font-size: 13px;
            color: var(--ink-faint);
         }

         /* ---------- tons ---------- */
         .tn.t1 {
            color: var(--t1);
         }
         .tn.t2 {
            color: var(--t2);
         }
         .tn.t3 {
            color: var(--t3);
         }
         .tn.t4 {
            color: var(--t4);
         }
         .tn.t5 {
            color: var(--t5);
         }

/* ---------- séance ---------- */
         body.in-session .nav,
         body.in-session .top,
         body.in-seq .nav,
         body.in-seq .top {
            display: none;
         }
         body.in-session,
         body.in-seq {
            padding-bottom: 28px;
         }
         .dict-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .seq-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
         }
         .seq-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--line);
            transition: all 0.15s;
         }
         .seq-dots .dot.on {
            background: var(--lacquer);
            width: 20px;
            border-radius: 5px;
         }
         .seq-card {
            cursor: grab;
         }
         .speed-lab {
            font-size: 13px;
            color: var(--ink-faint);
         }
         .sess {
            padding-top: 10px;
         }
         .s-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
         }
         .s-x {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-size: 15px;
            flex: none;
         }
         .s-scope {
            flex: 1;
            font-size: 13px;
            color: var(--ink-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
         }
         .s-count {
            font-family: var(--disp);
            font-size: 15px;
            color: var(--ink-soft);
         }
         .s-bar {
            height: 4px;
            border-radius: 99px;
            background: var(--line-soft);
            overflow: hidden;
            margin-bottom: 14px;
         }
         .s-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--lacquer), var(--seal));
            border-radius: 99px;
            transition: width 0.25s;
         }
         .flash {
            padding: 52px 20px 24px;
            text-align: center;
            min-height: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
         }
         .fl-seal {
            position: absolute;
            top: 14px;
            right: 14px;
         }
         .seal {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--seal);
            color: #f6efdd;
            font-family: var(--serif);
            font-size: 21px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 9px rgba(192, 57, 43, 0.4);
            transition: transform 0.12s;
            flex: none;
         }
         .seal:active {
            transform: rotate(-2.5deg) scale(0.9);
         }
         .seal.lg {
            width: 56px;
            height: 56px;
            font-size: 26px;
            border-radius: 13px;
         }
         .hanzi {
            font-family: var(--serif);
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
            font-size: clamp(52px, 18vw, 88px);
            letter-spacing: 0.04em;
         }
         .pinyin {
            font-size: 21px;
            margin-top: 8px;
            letter-spacing: 0.03em;
         }
         .fr {
            font-family: var(--disp);
            font-size: 23px;
            margin-top: 4px;
         }
         .fr-big {
            font-family: var(--disp);
            font-size: 30px;
            line-height: 1.25;
            padding: 8px 4px;
         }
         .hint {
            margin-top: 22px;
            font-size: 12.5px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.12em;
         }
         .sep {
            width: 56px;
            height: 1.5px;
            background: var(--gold);
            opacity: 0.6;
            margin: 16px auto 10px;
         }
         .ex {
            margin-top: 14px;
            padding: 11px 14px;
            border-left: 3px solid var(--gold);
            background: var(--card-2);
            border-radius: 0 10px 10px 0;
            text-align: left;
            cursor: pointer;
            max-width: 100%;
         }
         .ex-hz {
            font-family: var(--serif);
            font-size: 19px;
         }
         .ex-py {
            font-size: 14px;
            margin-top: 2px;
         }
         .ex-fr {
            font-size: 14px;
            color: var(--ink-soft);
            font-style: italic;
            margin-top: 2px;
         }
         .note {
            margin-top: 12px;
            font-size: 13.5px;
            color: var(--ink-soft);
            background: var(--card-2);
            border: 1.5px dashed var(--gold);
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 100%;
            text-align: left;
         }
         .acts {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
         }
         .act {
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 13.5px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .act.on {
            background: var(--lacquer);
            border-color: var(--lacquer);
            color: var(--card);
         }
         .act.on.jade {
            background: var(--jade);
            border-color: var(--jade);
         }
         .verdict {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            padding: 8px 16px;
            border-radius: 999px;
         }
         .verdict.ok {
            background: rgba(46, 107, 87, 0.14);
            color: var(--jade);
         }
         .verdict.ko {
            background: rgba(158, 43, 37, 0.12);
            color: var(--lacquer);
         }
         .verdict span {
            font-weight: 400;
            font-size: 14px;
         }
         .s-foot {
            display: flex;
            gap: 10px;
            margin-top: 14px;
         }
         .s-foot .btn {
            flex: 1;
         }
         .s-foot .btn.ghost {
            flex: 0 0 auto;
         }
         .grades {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 14px;
         }
         .gr {
            border-radius: 12px;
            padding: 10px 4px 8px;
            color: #f6efdd;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s;
         }
         .gr:active {
            transform: scale(0.95);
         }
         .gr small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            opacity: 0.85;
            margin-top: 1px;
         }
         .gr.again {
            background: var(--lacquer);
         }
         .gr.hard {
            background: var(--gold);
         }
         .gr.good {
            background: var(--jade);
         }
         .gr.easy {
            background: var(--ink);
         }
         .g-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
         }
         .w-lab {
            font-size: 12.5px;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--ink-faint);
            margin-bottom: 10px;
            font-weight: 600;
         }
         .w-in {
            width: 100%;
            max-width: 340px;
            margin-top: 18px;
         }
         .w-in .search {
            text-align: center;
            font-size: 18px;
         }
         .w-note {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);
            min-height: 1.2em;
         }
         .t-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
         }
         .review-overview {
            margin: 8px 0 12px;
         }
         .review-heading {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 13px;
         }
         .review-heading .v-t {
            margin: 0;
         }
         .review-mark {
            display: grid;
            flex: 0 0 54px;
            width: 54px;
            height: 54px;
            place-items: center;
            border-radius: 15px;
            background: var(--lacquer);
            color: var(--card-2);
            font: 30px var(--serif);
         }
         .review-queue {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: var(--card);
            box-shadow: 0 5px 18px rgba(23, 20, 15, 0.08);
         }
         .review-queue > div {
            min-width: 0;
            padding: 11px 6px;
            border-right: 1px solid var(--line-soft);
            text-align: center;
         }
         .review-queue > div:last-child {
            border-right: 0;
         }
         .review-queue b,
         .review-queue span {
            display: block;
         }
         .review-queue b {
            font: 600 21px var(--disp);
         }
         .review-queue span {
            color: var(--ink-faint);
            font-size: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
         }
         .review-pack-label {
            display: block;
            margin-top: 10px;
            color: var(--ink-soft);
            font-size: 12px;
            font-weight: 600;
         }
         .review-pack-label .search {
            margin-top: 4px;

         @media (max-width: 430px) {
            .review-heading {
               align-items: flex-start;
            }
            .review-queue span {
               font-size: 9px;

/* ---------- 米字格 ---------- */
         .mizi {
            position: relative;
            width: min(300px, 100%);
            aspect-ratio: 1;
            margin: 14px auto 4px;
            border: 2px solid var(--seal);
            border-radius: 8px;
            overflow: hidden;
            background:
               linear-gradient(
                  45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  -45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  90deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  0deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               var(--card-2);
            box-shadow: inset 0 0 0 1px rgba(158, 43, 37, 0.2);
         }
         .mizi > div,
         .mizi > canvas {
            position: absolute;
            inset: 0;
            margin: auto;
         }
         .mizi > .ghost {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            color: rgba(23, 20, 15, 0.15);
            user-select: none;
            pointer-events: none;
            line-height: 1;
         }
         .mizi canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
         }

/* ---------- atelier des traits ---------- */
.stroke-workspace {
   margin-top: 12px;
}
.stroke-tabs {
   display: grid;
   grid-template-columns: repeat(3, minmax(0, 1fr));
   gap: 4px;
   padding: 4px;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: rgba(205, 191, 161, 0.22);
   user-select: none;
   -webkit-user-select: none;
}
.stroke-tabs [role="tab"] {
   min-height: 44px;

   background: transparent;

}
.stroke-tabs [role="tab"][aria-selected="true"] {

   color: var(--seal);
   box-shadow: 0 2px 8px rgba(23, 20, 15, 0.09);
}
.stroke-tabs [role="tab"]:focus-visible,
.stroke-panel:focus-visible,
.stroke-focus button:focus-visible {
   outline: 3px solid #237a5a;
   outline-offset: 3px;
}
.stroke-tab-panel {
   padding-top: 10px;
}
.stroke-tab-panel[hidden] {
   display: none;
}
.stroke-tab-panel > input[type="range"] {
   width: 100%;
   accent-color: var(--seal);
}
.stroke-tab-panel .w-note {
   min-height: 22px;
   text-align: center;
}
.stroke-gallery-toolbar {
   display: flex;
   align-items: flex-start;
   justify-content: space-between;
   gap: 14px;
   margin: 4px 0 12px;
   color: var(--ink-soft);
   font-size: 13px;
}
.stroke-gallery-settings {
   display: flex;
   flex-wrap: wrap;
   justify-content: flex-end;
   gap: 8px 14px;
}
.stroke-gallery-settings label {
   display: inline-flex;
   align-items: center;
   gap: 6px;
   min-height: 30px;
}
.stroke-gallery-settings input {
   width: 18px;
   height: 18px;
   accent-color: var(--seal);
}
.stroke-gallery {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
   gap: 12px;
}
.stroke-gallery.is-loading {
   opacity: 0.48;
}

.character-swipe-zone {
   touch-action: pan-y;
   -webkit-user-drag: none;
}
.character-swipe-zone:not(:has(input:focus, textarea:focus, select:focus, [contenteditable="true"]:focus)) {
   cursor: grab;
}
.character-swipe-zone.is-pointer-swiping {
   cursor: grabbing;
}
.character-swipe-zone.is-practice-paging-locked {
   cursor: default;
}
.dd-character-interaction .dd-character-study-card,
.dd-character-interaction .stroke-workspace {
   transform: translateX(var(--character-swipe-offset, 0));
   transition: transform 130ms ease-out;
   will-change: transform;
}
.dd-character-interaction.is-pointer-swiping .dd-character-study-card,
.dd-character-interaction.is-pointer-swiping .stroke-workspace {
   transition: none;
}
.dd-character-interaction.is-swipe-committing .dd-character-study-card,
.dd-character-interaction.is-swipe-committing .stroke-workspace {
   opacity: 0.9;
}
.dd-character-study-card,
.dd-character-interaction .stroke-workspace,
.dd-character-interaction > .eyebrow,
.character-nav,
#dd-picker {
   user-select: none;
   -webkit-user-select: none;
}
.dd-character-study-translation,
.dd-related {
   user-select: text;
   -webkit-user-select: text;
}
.character-swipe-zone *,
.character-nav *,
.seq-character-strip *,
#dd-picker * {
   -webkit-user-drag: none;
}
.character-nav,
.character-nav-button,
.stroke-tabs [role="tab"],
.seq-character-strip .hzchip,
#dd-picker .hzchip {
   user-select: none;
   -webkit-user-select: none;
}
.character-nav {
   display: grid;
   grid-template-columns: 48px minmax(92px, auto) 48px;
   align-items: center;
   justify-content: center;
   gap: 12px;
   width: fit-content;
   max-width: 100%;
   margin: 16px auto;
   padding: 6px 9px;
   border: 1px solid var(--line-soft);
   border-radius: 18px;
   background: color-mix(in srgb, var(--card-2) 88%, transparent);
   box-shadow: 0 5px 14px rgba(23, 20, 15, 0.07);
}
.character-nav-button {
   display: inline-grid;
   place-items: center;
   width: 48px;
   height: 48px;
   padding: 0;
   border: 1px solid var(--line);
   border-radius: 14px;
   background: var(--paper-2);
   color: var(--ink-soft);
   box-shadow: 0 3px 9px rgba(23, 20, 15, 0.08);
   cursor: pointer;
   transition: border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.character-nav-button svg {
   width: 22px;
   height: 22px;
   fill: none;
   stroke: currentColor;
   stroke-width: 2;
   stroke-linecap: round;
   stroke-linejoin: round;
}
.character-nav-button:hover,
.character-nav-button:focus-visible {
   border-color: var(--seal);
   color: var(--seal);
   box-shadow: 0 4px 12px rgba(158, 43, 37, 0.14);
}
.character-nav-button:focus-visible {
   outline: 3px solid rgba(35, 122, 90, 0.5);
   outline-offset: 2px;
}
.character-nav-button:active:not(:disabled) {
   color: var(--lacquer);
   transform: scale(0.96);
}
.character-nav-button:disabled {
   border-color: var(--line-soft);
   background: color-mix(in srgb, var(--card-2) 62%, transparent);
   color: var(--ink-faint);
   box-shadow: none;
   cursor: default;
   opacity: 0.42;
   pointer-events: none;
}
.character-nav-position {
   min-width: 92px;
   color: var(--ink);
   font: 600 15px var(--ui);
   text-align: center;
   white-space: nowrap;
}

#dd-character-nav {
   grid-template-columns: 48px minmax(92px, 1fr) 48px;
   width: 100%;
   margin: 8px 0 14px;
   padding: 2px 1px;
   border: 0;
   background: transparent;
   box-shadow: none;
}

#dd-character-nav .character-nav-button {
   width: 44px;
   height: 44px;
   border-color: color-mix(in srgb, var(--seal) 32%, var(--line));
   border-radius: 50%;
   background: color-mix(in srgb, var(--card-2) 86%, transparent);
   box-shadow: 0 4px 12px rgba(23, 20, 15, 0.1);
   backdrop-filter: blur(5px);
}

#dd-character-nav .character-nav-button:last-child {
   justify-self: end;
}

#dd-character-nav .character-nav-position {
   justify-self: center;
   padding: 7px 13px;
   border: 1px solid var(--line-soft);
   border-radius: 999px;
   background: color-mix(in srgb, var(--card-2) 82%, transparent);
}
.stroke-panel {
   position: relative;
   min-width: 0;
   padding: 0;
   overflow: hidden;
   border: 1px solid var(--line);
   border-radius: 11px;
   background: var(--card-2);
   color: var(--ink);
   cursor: zoom-in;
   text-align: left;
}
.stroke-panel:hover {
   border-color: var(--seal);
   box-shadow: 0 7px 18px rgba(23, 20, 15, 0.1);
}
.stroke-panel-number {
   position: absolute;
   z-index: 1;
   top: 8px;
   left: 10px;
   color: var(--seal);
   font: 700 20px var(--ui);
}
.stroke-panel-visual {
   display: block;
   width: 100%;
   aspect-ratio: 1;
}
.stroke-panel-svg {
   display: block;
   width: 100%;
   height: 100%;
}
.stroke-grid-lines > * {
   fill: none;
   stroke: #9f7b39;
   vector-effect: non-scaling-stroke;
}
.stroke-grid-center {
   stroke-width: 0.8;
   stroke-dasharray: 18 15;
   opacity: 0.25;
}
.stroke-grid-diagonal {
   stroke-width: 0.65;
   stroke-dasharray: 14 18;
   opacity: 0.13;
}
.stroke-grid-border {
   stroke-width: 1;
   stroke-dasharray: none;
   opacity: 0.34;
}
.stroke-path {
   stroke: none;
}
.stroke-complete {
   fill: #17140f;
}
.stroke-current {
   fill: #a62520;
}
.stroke-future {
   fill: #d8d5cf;
}
.stroke-ghost {
   fill: #ded8ca;
   opacity: 0.35;
}
.stroke-panel-label {
   display: block;
   padding: 9px 10px 10px;
   border-top: 1px solid var(--line-soft);
   font-size: 12.5px;
   font-weight: 600;
   text-align: center;
}
.stroke-gallery-position {
   display: none;
   padding-top: 9px;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
   text-align: center;
}
.stroke-gallery-error {
   grid-column: 1 / -1;
   padding: 18px;
   border: 1px dashed var(--line);
   border-radius: 10px;
   color: var(--ink-soft);
   text-align: center;
}
.stroke-focus-backdrop {
   position: fixed;
   inset: 0;
   z-index: 120;
   display: grid;
   place-items: center;
   padding: 18px;
   background: rgba(23, 20, 15, 0.68);
}
.stroke-focus {
   width: min(680px, 100%);
   max-height: calc(100dvh - 36px);
   overflow: auto;
   padding: 18px;
   border: 1px solid var(--line);
   border-radius: 18px;
   background: var(--paper-2);
   box-shadow: 0 22px 70px rgba(23, 20, 15, 0.35);
}
.stroke-focus header,
.stroke-focus footer {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 12px;
}
.stroke-focus-title {
   font-family: var(--disp);
   font-size: 21px;
}
.stroke-focus-close {
   width: 44px;
   height: 44px;
   border: 1px solid var(--line);
   border-radius: 50%;
   background: var(--card-2);
   color: var(--ink);
   font-size: 26px;
   cursor: pointer;
}
.stroke-focus-visual {
   width: min(520px, 100%);
   aspect-ratio: 1;
   margin: 12px auto;
   border-radius: 12px;
   overflow: hidden;
   background: var(--card-2);
}
.stroke-focus-position {
   min-width: 64px;
   text-align: center;
   font-weight: 600;
}

@media (min-width: 760px) {
   #sheet:has(.dd-entry) .sheet-card {
      max-width: 1080px;
   }
}

@media (max-width: 599px) {
   .stroke-tabs [role="tab"] {
      padding-inline: 5px;
      font-size: 12px;
   }
   .stroke-gallery-toolbar {
      display: block;
   }
   .stroke-gallery-settings {
      display: grid;
      justify-content: stretch;
      margin-top: 8px;
   }
   .stroke-gallery {
      display: flex;
      gap: 12px;
      margin-inline: -4px;
      padding: 4px 22% 8px 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-inline: contain;
      scrollbar-width: thin;
      touch-action: pan-x pan-y;
   }
   .stroke-panel {
      flex: 0 0 min(82vw, 360px);
      scroll-snap-align: start;
   }
   .stroke-gallery-position {
      display: block;
   }
   .stroke-focus-backdrop {
      padding: 8px;
   }
   .stroke-focus {
      padding: 12px;
   }
   .stroke-focus footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
   }
   .stroke-focus-position {
      grid-column: 1 / -1;
      grid-row: 1;
   }
}

@media (prefers-reduced-motion: reduce) {
   .stroke-gallery {
      scroll-behavior: auto;
   }
   .stroke-panel,
   .stroke-focus-backdrop {
      transition: none !important;
   }
}

.seq-character-strip {
   display: flex;
   gap: 8px;
   margin: 12px 0;
   padding: 4px 2px 8px;
   overflow-x: auto;
   scroll-snap-type: x proximity;
   user-select: none;
   -webkit-user-select: none;
}
.seq-character-strip .hzchip {
   flex: 0 0 46px;
   min-height: 46px;
   scroll-snap-align: center;
   font-size: 22px;
}
.seq-character-strip .hzchip[aria-current="true"] {
   border-color: var(--seal);
   background: var(--seal);
   color: var(--card-2);
}

@media (max-width: 430px) {
   .character-nav {
      grid-template-columns: 48px minmax(82px, auto) 48px;
      gap: 8px;
      padding-inline: 7px;
   }
   .character-nav-position {
      min-width: 82px;
      font-size: 14px;
   }
}

.search-page {

.search-hero .v-t {

}

}
.dictionary-search-input {

}

.path-page {
   padding-top: 10px;
}

.path-header {
   display: flex;
   align-items: center;
   gap: 14px;
   margin: 6px 0 18px;
}

.path-header .v-t,
.path-level-header .v-t {
   margin: 0;
}

.path-mark {
   display: grid;
   flex: 0 0 54px;
   width: 54px;
   height: 54px;
   place-items: center;
   border-radius: 15px;
   background: var(--seal);
   color: var(--card-2);
   font: 30px var(--serif);
}

.path-continue h3 {
   font-family: var(--disp);
   font-size: 20px;
}

.path-continue p,
.path-level-note {
   color: var(--ink-soft);
}

.path-continue p {
   margin-top: 5px;
}

.path-levels {
   display: grid;
   gap: 10px;
}

.path-grammar {
   display: grid;
   grid-template-columns: auto minmax(0, 1fr) auto;
   align-items: center;
   gap: 16px;
   width: 100%;
   margin: 0 0 16px;
   padding: 20px;
   text-align: left;
   border-color: color-mix(in srgb, var(--lacquer) 44%, var(--line));
   background: linear-gradient(135deg, var(--card-2), var(--card));
}

.path-grammar-mark {
   display: grid;
   width: 58px;
   height: 58px;
   place-items: center;
   border-radius: 14px;
   background: var(--lacquer);
   color: var(--card-2);
   font: 600 31px var(--serif);
   box-shadow: 0 5px 14px rgba(158, 43, 37, 0.22);
}

.path-grammar-copy {
   display: flex;
   min-width: 0;
   flex-direction: column;
   gap: 3px;
}

.path-grammar-copy strong {
   font: 600 23px var(--disp);
}

.path-grammar-copy span {
   color: var(--ink-soft);
   font-size: 13.5px;
   line-height: 1.4;
}

.path-grammar-arrow {
   color: var(--lacquer);
   font-size: 24px;
}

.path-level {
   display: flex;
   width: 100%;
   min-height: 88px;
   align-items: center;
   justify-content: space-between;
   gap: 18px;
   padding: 17px 18px;
   text-align: left;
}

.path-level > span:first-child {
   display: flex;
   flex-direction: column;
   min-width: 0;
}

.path-level-title {
   flex: 0 0 auto;
   color: var(--seal);
   font: 600 24px var(--disp);
}

.path-level-order {
   color: var(--ink-faint);
   font-size: 11px;
   letter-spacing: 0.06em;
   text-transform: uppercase;
}

.path-level-note {
   max-width: 290px;
   font-size: 13.5px;
   line-height: 1.35;
   text-align: right;
}

.path-level-note b {
   display: block;
   color: var(--ink);
   font: 600 20px var(--disp);
}

.path-level-header {
   display: flex;
   align-items: center;
   gap: 12px;
   margin: 6px 0 18px;
}

.path-level-header .btn {
   min-height: 44px;
   padding-inline: 8px;
}

.path-loading {
   display: flex;
   min-height: 92px;
   align-items: center;
   justify-content: center;
   gap: 12px;
   color: var(--ink-soft);
}

.path-error {
   padding: 20px;
}

.path-scope-note {
   margin: -8px 0 14px;
   color: var(--ink-faint);
   font-size: 12px;
}

.path-vocabulary {
   overflow: hidden;
}

.path-level-tools {
   display: grid;
   grid-template-columns: minmax(0, 1fr) auto;
   gap: 5px 12px;
   align-items: end;
   padding: 16px;
   border-bottom: 1px solid var(--line-soft);
   background: color-mix(in srgb, var(--card-2) 68%, transparent);
}

.path-level-tools label {
   grid-column: 1 / -1;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
}

.path-filter-count {
   padding-bottom: 10px;
   color: var(--ink-faint);
   font-size: 12px;
   white-space: nowrap;
}

.path-word-list {
   display: grid;
}

.path-word {
   display: grid;
   grid-template-columns: minmax(76px, auto) minmax(0, 1fr) auto;
   gap: 12px;
   align-items: center;
   min-height: 78px;
   padding: 12px 15px;
   border-bottom: 1px solid var(--line-soft);
   text-align: left;
}

.path-word:hover,
.path-word:focus-visible {
   background: var(--card-2);
}

.path-word-hanzi {
   color: var(--ink);
   font: 500 25px var(--serif);
}

.path-word-main {
   display: flex;
   min-width: 0;
   flex-direction: column;
}

.path-word-pinyin {
   font-size: 14px;
}

.path-word-translation {
   overflow-wrap: anywhere;
   color: var(--ink-soft);
   font-size: 13px;
   line-height: 1.35;
}

.path-word-meta {
   margin-top: 3px;
   color: var(--ink-faint);
   font-size: 10.5px;
}

.path-word-badges {
   display: flex;
   max-width: 120px;
   flex-direction: column;
   align-items: flex-end;
   gap: 4px;
}

.hsk-badge,
.path-word-status {
   display: inline-flex;
   align-items: center;
   width: fit-content;
   border: 1px solid color-mix(in srgb, var(--seal) 48%, var(--line));
   border-radius: 999px;
   background: color-mix(in srgb, var(--seal) 9%, var(--card-2));
   color: var(--lacquer);
   font-family: var(--ui);
   font-size: 10.5px;
   font-style: normal;
   font-weight: 600;
   line-height: 1;
   padding: 5px 7px;
   white-space: nowrap;
}

.path-word-status {
   max-width: 120px;
   border-color: var(--line);
   background: var(--card-2);
   color: var(--ink-faint);
   font-size: 9px;
   line-height: 1.15;
   text-align: right;
   white-space: normal;
}

.path-word-status.status-source-only,
.hsk-source-status {
   border-color: color-mix(in srgb, var(--gold) 62%, var(--line));
   color: color-mix(in srgb, var(--gold) 72%, var(--ink));
}

.path-no-results {
   min-height: 180px;
   padding: 36px 20px;
   color: var(--ink-soft);
   text-align: center;
}

.path-more {
   padding: 14px;
   text-align: center;

@media (min-width: 700px) {

   margin: 6px 0 16px;
}

.writing-header .v-t {

}

.writing-mark {

   flex: 0 0 54px;

   color: var(--card-2);

}

.writing-ink-tools {
   flex-wrap: wrap;
   justify-content: space-between;
}

.writing-colors {
   display: flex;
   align-items: center;
   gap: 7px;
}

.writing-color {
   width: 44px;
   height: 44px;
   border: 2px solid var(--card);
   border-radius: 50%;
   background: var(--writing-color);
   box-shadow: 0 0 0 1px var(--line);
}

.writing-color[aria-pressed="true"] {
   box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--lacquer);
}

.writing-color-custom {
   display: grid;
   width: 44px;
   height: 44px;
   overflow: hidden;
   border: 1px solid var(--line);
   border-radius: 50%;
   cursor: pointer;
}

.writing-color-custom span {
   position: absolute;
   width: 1px;
   height: 1px;
   overflow: hidden;
   clip-path: inset(50%);
}

.writing-color-custom input {
   width: 44px;
   height: 44px;
   margin: -6px;
   padding: 0;
   border: 0;
   cursor: pointer;
}

.writing-width {
   display: grid;
   flex: 1 1 150px;
   min-width: 150px;
   grid-template-columns: 1fr auto;
   gap: 0 8px;
   color: var(--ink-soft);
   font-size: 12px;
}

.writing-width input {
   grid-column: 1 / -1;
}

.writing-action-tools {
   flex-wrap: wrap;
   margin-top: 11px;
}

.writing-action-tools .btn {
   min-height: 44px;
}

.writing-tool[aria-pressed="true"] {
   border-color: var(--ink);
   background: var(--ink);
   color: var(--card-2);
}

.writing-fullscreen-button {
   margin-left: auto;
}

.writing-surface {
   --writing-grid-size: 96px;
   position: relative;
   min-height: clamp(390px, 61vh, 590px);
   overflow: hidden;
   background-color: #f5eedf;
   background-position: -1px -1px;
}

.writing-grid-selector {
   padding: 13px;
   border-top: 1px solid var(--line);
   background: linear-gradient(135deg, var(--card), var(--card-2));
}

.writing-grid-selector-head {
   display: flex;
   align-items: baseline;
   justify-content: space-between;
   gap: 10px;
   margin-bottom: 9px;
}

.writing-grid-selector-head h3 {
   font: 600 18px var(--disp);
}

.writing-grid-selector-head span {
   color: var(--ink-faint);
   font-size: 11px;
}

.writing-grid-options {
   display: grid;
   grid-template-columns: repeat(4, minmax(0, 1fr));
   gap: 8px;
}

.writing-grid-option {
   display: grid;
   min-width: 0;
   min-height: 76px;
   grid-template-columns: 48px minmax(0, 1fr);
   align-items: center;
   gap: 8px;
   padding: 8px;
   border: 1px solid var(--line);
   border-radius: 11px;
   background: color-mix(in srgb, var(--card-2) 78%, transparent);
   text-align: left;
   transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.writing-grid-option:hover,
.writing-grid-option:focus-visible,
.writing-grid-option[aria-pressed="true"] {
   border-color: var(--seal);
   box-shadow: 0 3px 11px rgba(158, 43, 37, 0.12);
}

.writing-grid-option:active {
   transform: scale(0.98);
}

.writing-grid-option[aria-pressed="true"] {
   background: color-mix(in srgb, var(--seal) 7%, var(--card-2));
}

.writing-grid-preview {
   display: block;
   width: 48px;
   height: 48px;
   border: 1px solid color-mix(in srgb, var(--seal) 34%, var(--line));
   border-radius: 8px;
   background-color: #f5eedf;
   background-position: -1px -1px;
   box-shadow: inset 0 0 8px rgba(23, 20, 15, 0.04);
}

.writing-grid-preview[data-grid-preview="square"] {
   background-image:
      linear-gradient(to right, rgba(74, 65, 50, 0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74, 65, 50, 0.18) 1px, transparent 1px);
   background-size: 16px 16px;
}

.writing-grid-preview[data-grid-preview="tian"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to right, transparent 49%, rgba(158, 43, 37, 0.16) 49%, rgba(158, 43, 37, 0.16) 51%, transparent 51%),
      linear-gradient(to bottom, transparent 49%, rgba(158, 43, 37, 0.16) 49%, rgba(158, 43, 37, 0.16) 51%, transparent 51%);
   background-size: 48px 48px;
}

.writing-grid-preview[data-grid-preview="mi"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(45deg, transparent 49%, rgba(158, 43, 37, 0.15) 49%, rgba(158, 43, 37, 0.15) 51%, transparent 51%),
      linear-gradient(-45deg, transparent 49%, rgba(158, 43, 37, 0.15) 49%, rgba(158, 43, 37, 0.15) 51%, transparent 51%);
   background-size: 48px 48px;
}

.writing-grid-name {
   min-width: 0;
   color: var(--ink-soft);
   font-size: 12px;
   font-weight: 600;
   line-height: 1.2;
   overflow-wrap: anywhere;
}

.writing-surface[data-grid="blank"] {
   background-image: none;
}

.writing-surface[data-grid="square"] {
   --writing-grid-size: 48px;
   background-image:
      linear-gradient(to right, rgba(74, 65, 50, 0.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74, 65, 50, 0.16) 1px, transparent 1px);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-surface[data-grid="tian"],
.writing-surface[data-grid="mi"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.2) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.2) 1px, transparent 1px),
      linear-gradient(to right, transparent 49.5%, rgba(158, 43, 37, 0.12) 49.5%, rgba(158, 43, 37, 0.12) 50.5%, transparent 50.5%),
      linear-gradient(to bottom, transparent 49.5%, rgba(158, 43, 37, 0.12) 49.5%, rgba(158, 43, 37, 0.12) 50.5%, transparent 50.5%);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-surface[data-grid="mi"]::before {
   content: "";
   position: absolute;
   inset: 0;
   z-index: 0;
   pointer-events: none;
   opacity: 0.5;
   background-image:
      linear-gradient(45deg, transparent 49.5%, rgba(158, 43, 37, 0.14) 49.5%, rgba(158, 43, 37, 0.14) 50.5%, transparent 50.5%),
      linear-gradient(-45deg, transparent 49.5%, rgba(158, 43, 37, 0.14) 49.5%, rgba(158, 43, 37, 0.14) 50.5%, transparent 50.5%);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-model {
   position: absolute;
   inset: 0;
   z-index: 0;
   display: grid;
   place-items: center;
   color: var(--ink);
   font: 500 clamp(220px, 52vw, 430px) / 1 var(--serif);
   pointer-events: none;
   user-select: none;
}

#writing-canvas {
   position: absolute;
   inset: 0;
   z-index: 1;
   display: block;
   width: 100%;
   height: 100%;
   cursor: crosshair;
   touch-action: none;
}

.writing-note {
   margin: 0;
   padding: 9px 13px 11px;
   border-top: 1px solid var(--line-soft);
   background: var(--card);
   color: var(--ink-faint);
   font-size: 11.5px;
}

.writing-workspace:fullscreen,
.writing-workspace.writing-fullscreen-fallback {
   display: flex;
   width: 100vw;
   height: 100dvh;
   max-width: none;
   flex-direction: column;
   border: 0;
   border-radius: 0;
   background: var(--paper);
}

.writing-workspace:fullscreen .writing-surface,
.writing-workspace.writing-fullscreen-fallback .writing-surface {
   min-height: 0;
   flex: 1;
}

.writing-workspace.writing-fullscreen-fallback {
   position: fixed;
   inset: 0;
   z-index: 80;
}

body.writing-fullscreen-open {
   overflow: hidden;
}

@media (max-width: 520px) {
   .writing-header {
      align-items: flex-start;
   }

   .writing-mode {
      gap: 7px;
      padding-inline: 10px;
   }

   .writing-mode b {
      font-size: 12.5px;
   }

   .writing-ink-tools {
      align-items: flex-end;
   }

   .writing-width {
      min-width: 118px;
   }

   .writing-action-tools .btn {
      flex: 1 1 auto;
      padding-inline: 10px;
   }

   .writing-fullscreen-button {
      margin-left: 0;
   }

   .writing-grid-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
   }

   .writing-grid-option {
      min-height: 68px;
   }

   .writing-surface {
      min-height: 410px;
   }

   .writing-model-controls {
      grid-template-columns: 1fr;
   }

   .writing-model-controls #writing-opacity {
      grid-column: 1;
   }
}

@media (min-width: 900px) {
   .writing-surface {
      min-height: 600px;
   }
}

/* ---------- sheet, toast, nav ---------- */
         #sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(23, 20, 15, 0.45);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
         }
         #sheet.open {
            opacity: 1;
            pointer-events: auto;
         }
         .sheet-card {
            width: 100%;
            max-width: 560px;
            max-height: 86dvh;
            overflow: auto;
            background: var(--paper-2);
            border-radius: 20px 20px 0 0;
            border: 1px solid var(--line);
            border-bottom: none;
            padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
            transform: translateY(30px);
            transition: transform 0.22s;
         }
         #sheet.open .sheet-card {
            transform: none;
         }
         .sh-t {
            font-family: var(--disp);
            font-size: 21px;
            margin-bottom: 8px;
         }
         .sh-p {
            font-size: 14.5px;
            color: var(--ink-soft);
         }
         .sh-note {
            font-size: 13px;
            color: var(--ink-faint);
            margin-top: 12px;
         }
         .sh-btns {
            display: flex;
            gap: 9px;
            margin-top: 16px;
            flex-wrap: wrap;
         }
         .sh-btns .btn {
            flex: 1;
         }
         .delay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
         }
         .delay-grid .btn {
            margin: 0;
         }
         .dl-custom {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .dl-custom .search {
            flex: 1;
         }
         .pk-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line-soft);
         }
         .pk-info b {
            display: block;
            font-size: 15px;
         }
         .pk-info span {
            font-size: 12.5px;
            color: var(--ink-faint);
         }
         .pk-btns {
            display: flex;
            gap: 6px;
         }
         .pk-new {
            display: flex;
            gap: 8px;
            margin-top: 14px;
         }
         .pk-new .search {
            flex: 1;
         }
         .cd-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
         }
         .cd-hz {
            font-family: var(--serif);
            font-size: 52px;
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
         }
         .cd-py {
            font-size: 19px;
            margin-top: 2px;
         }
         .cd-fr {
            font-family: var(--disp);
            font-size: 20px;
            margin-top: 4px;
         }
         .cd-cat {
            display: inline-block;
            margin-top: 8px;
            margin-right: 6px;
            font-size: 12.5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--ink-soft);
         }
         .cd-status {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);
         }
         pre.fmt {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 13px;
            font-size: 12.5px;
            overflow: auto;
            line-height: 1.5;
            margin: 10px 0 4px;
         }
         #toast {
            position: fixed;
            left: 50%;
            bottom: calc(96px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(16px);
            background: var(--ink);
            color: var(--card);
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            z-index: 60;
            max-width: 88vw;
            text-align: center;
         }
         #toast.show {
            opacity: 1;
            transform: translateX(-50%);
         }
         .nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            justify-content: space-around;
            background: color-mix(in srgb, var(--card) 92%, transparent);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
         }
         .nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 20%;
            min-width: 0;
            padding: 4px 2px;
            border-radius: 11px;
            color: var(--ink-faint);
         }
         .nav .n-hz {
            font-family: var(--serif);
            font-size: 21px;
            line-height: 1.2;
         }
         .nav .n-lab {
            max-width: 100%;
            overflow: hidden;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.035em;
            text-overflow: ellipsis;
            white-space: nowrap;
         }
         .nav button[aria-pressed="true"] {
            color: var(--lacquer);
         }

         /* ---------- vides, résumé, erreurs ---------- */
         .empty {
            text-align: center;
            padding: 34px 20px;
         }
         .empty-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--line);
            line-height: 1;
         }
         .empty-t {
            font-family: var(--disp);
            font-size: 22px;
            margin-top: 10px;
         }
         .empty-p {
            color: var(--ink-soft);
            font-size: 14.5px;
            max-width: 380px;
            margin: 8px auto 0;
         }
         .empty-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 18px;
            align-items: center;
         }
         .empty-btns .btn {
            width: min(300px, 100%);
         }
         .summary {
            text-align: center;
            padding: 32px 22px;
         }
         .sum-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--lacquer);
            line-height: 1;
         }
         .sum-t {
            font-family: var(--disp);
            font-size: 24px;
            margin: 10px 0 14px;
         }
         .sum-rows {
            max-width: 310px;
            margin: 0 auto 16px;
         }
         .sum-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 15px;
         }
         .sum-row b {
            font-family: var(--disp);
            font-size: 17px;
         }
         .err-list {
            text-align: left;
            max-width: 340px;
            margin: 6px auto 16px;
            max-height: 190px;
            overflow: auto;
            border: 1px solid var(--line-soft);
            border-radius: 11px;
            padding: 4px 12px;
            background: var(--card-2);
         }
         .err-row {
            display: flex;
            gap: 10px;
            padding: 7px 2px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13.5px;
            align-items: baseline;
         }
         .err-row:last-child {
            border-bottom: none;
         }
         .err-row b {
            font-family: var(--serif);
            font-size: 19px;
            font-weight: 600;
            flex: none;
         }
         .err-row span {
            color: var(--ink-soft);
         }
         .sum-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            align-items: center;
         }
         .sum-btns .btn {
            width: min(300px, 100%);
            margin: 0;
         }

/* Packs, sous-catégories et sélection de révision */
.library-page,
.review-page {
   display: grid;
   gap: 16px;
}

.library-page button,
.review-page button {
   min-height: 44px;
}

.library-head,
.pack-detail-title,
.word-list-title,
.review-section-title,
.review-launch {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 16px;
}

.library-head .v-t,
.pack-detail-title h3,
.word-list-title h3,
.review-scope h3,
.review-categories h3 {
   margin: 0;
}

.library-head .eyebrow,
.review-heading .eyebrow {
   margin: 0 0 4px;
}

.lib-import-main {
   min-width: 178px;
}

.library-toolbar,
.tile-actions,
.selection-tools {
   display: flex;
   flex-wrap: wrap;
   gap: 8px;
}

.lib-breadcrumb {
   display: flex;
   min-height: 44px;
   align-items: center;
   gap: 8px;
   overflow: hidden;
   color: var(--ink-soft);
   font-size: 14px;
}

.lib-breadcrumb strong,
.lib-crumb {
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
}

.lib-crumb {
   min-height: 44px;
   color: var(--lacquer);
   text-decoration: underline;
   text-underline-offset: 3px;
}

.pack-grid {
   display: grid;
   gap: 14px;
}

.pack-tile,
.category-tile,
.word-tools,
.review-scope,
.review-categories,
.review-launch {
   border: 1px solid var(--line);
   border-radius: 15px;
   background: var(--card);
   box-shadow: 0 6px 20px rgba(23, 20, 15, 0.06);
}

.pack-tile,
.category-tile {
   padding: 14px;
}

.pack-open,
.category-open {
   display: flex;
   width: 100%;
   min-height: 58px;
   align-items: center;
   gap: 13px;
   text-align: left;
}

.pack-copy,
.category-open > span:first-child {
   display: grid;
   min-width: 0;
   flex: 1;
   gap: 3px;
}

.pack-copy strong,
.category-open strong {
   overflow: hidden;
   font: 600 19px var(--disp);
   text-overflow: ellipsis;
   white-space: nowrap;
}

.pack-copy span,
.category-open small {
   color: var(--ink-faint);
   font-size: 13px;
}

.pack-mark {
   display: grid;
   width: 46px;
   height: 46px;
   flex: 0 0 46px;
   place-items: center;
   border-radius: 12px;
   background: var(--lacquer);
   color: var(--card-2);
   font: 25px var(--serif);
}

.pack-mark.large {
   width: 64px;
   height: 64px;
   margin: 0 auto;
   font-size: 34px;
}

.due-pill {
   flex: none;
   padding: 6px 10px;
   border: 1px solid var(--gold);
   border-radius: 999px;
   color: var(--ink-soft);
   font-size: 12px;
}

.tile-actions {
   justify-content: flex-end;
   margin-top: 10px;
   padding-top: 10px;
   border-top: 1px solid var(--line-soft);
}

.category-list {
   display: grid;
   gap: 10px;
}

.lib-empty {
   padding: 34px 20px;
   text-align: center;
}

.lib-empty h3 {
   margin: 12px 0 5px;
   font-family: var(--disp);
}

.lib-empty p,
.review-section-title p {
   margin: 0;
   color: var(--ink-soft);
   font-size: 14px;
}

.word-tools {
   display: grid;
   gap: 11px;
   padding: 14px;
}

.word-list {
   display: grid;
   gap: 8px;
}

.word-select-row {
   display: grid;
   grid-template-columns: 48px minmax(0, 1fr);
   overflow: hidden;
   border: 1px solid var(--line-soft);
   border-radius: 13px;
   background: var(--card);
}

.word-check {
   display: grid;
   min-width: 48px;
   min-height: 64px;
   place-items: center;
   border-right: 1px solid var(--line-soft);
}

.word-check input,
.review-choice input,
.ck input {
   width: 20px;
   height: 20px;
   accent-color: var(--lacquer);
}

.word-open {
   display: grid;
   min-width: 0;
   min-height: 64px;
   grid-template-columns: minmax(58px, auto) minmax(0, 1fr) auto;
   align-items: center;
   gap: 12px;
   padding: 9px 12px;
   text-align: left;
}

.word-open .row-mid,
.word-open .row-py,
.word-open .row-fr {
   display: block;
   min-width: 0;
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
}

.word-open .row-py em,
.word-open .row-fr em {
   color: var(--lacquer);
   font-style: normal;
}

.word-open .row-badges {
   display: flex;
   max-width: 185px;
   flex-wrap: wrap;
   justify-content: flex-end;
   gap: 4px;
}

.bulk-bar {
   position: sticky;
   z-index: 4;
   top: 70px;
   display: flex;
   min-height: 56px;
   align-items: center;
   gap: 8px;
   padding: 8px 10px;
   border: 1px solid var(--line);
   border-radius: 14px;
   background: color-mix(in srgb, var(--paper-2) 94%, transparent);
   box-shadow: 0 8px 25px rgba(23, 20, 15, 0.13);
   backdrop-filter: blur(10px);
}

.bulk-bar strong {
   flex: 1;
   font-size: 13px;
}

.lib-no-results {
   padding: 28px;
   color: var(--ink-soft);
   text-align: center;
}

.category-check-groups {
   display: grid;
   gap: 10px;
   max-height: 240px;
   overflow: auto;
}

.category-check-groups fieldset,
.import-options {
   display: grid;
   gap: 7px;
   margin: 10px 0 0;
   padding: 12px;
   border: 1px solid var(--line-soft);
   border-radius: 12px;
}

.category-check-groups legend,
.import-options legend {
   padding: 0 5px;
   color: var(--ink-soft);
   font-size: 12px;
   font-weight: 600;
   letter-spacing: .06em;
   text-transform: uppercase;
}

.import-source-grid {
   display: grid;
   grid-template-columns: 1fr 1fr;
   gap: 8px;
   margin: 14px 0;
}

.import-source-grid .btn:last-child {
   grid-column: 1 / -1;
}

.import-paste {
   min-height: 180px;
   resize: vertical;
   font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
   font-size: 12px;
   line-height: 1.45;
}

.import-stats,
.review-live {
   display: grid;
   grid-template-columns: repeat(3, minmax(0, 1fr));
   gap: 1px;
   overflow: hidden;
   margin: 14px 0;
   border: 1px solid var(--line);
   border-radius: 13px;
   background: var(--line);
}

.import-stats > div,
.review-live > div {
   min-width: 0;
   padding: 11px 6px;
   background: var(--card);
   text-align: center;
}

.import-stats b,
.import-stats span,
.review-live b,
.review-live span {
   display: block;
}

.import-stats b,
.review-live b {
   font: 600 20px var(--disp);
}

.import-stats span,
.review-live span {
   color: var(--ink-faint);
   font-size: 10px;
   line-height: 1.2;
   text-transform: uppercase;
}

.import-error {
   margin: 12px 0;
   padding: 12px;
   border: 1px solid var(--lacquer);
   border-radius: 11px;
   background: rgba(158, 43, 37, .07);
   color: var(--lacquer);
   font-size: 13px;
}

.import-error ul {
   margin-bottom: 0;
   padding-left: 18px;
}

.import-loading {
   width: 34px;
   height: 34px;
   margin: 22px auto;
   border: 2px solid var(--line);
   border-top-color: var(--lacquer);
   border-radius: 50%;
   animation: library-spin .8s linear infinite;
}

@keyframes library-spin { to { transform: rotate(360deg); } }

.export-pack-list {
   display: grid;
   max-height: 280px;
   overflow: auto;
   gap: 5px;
   margin: 12px 0;
}

.review-layout {
   display: grid;
   gap: 14px;
}

.review-scope,
.review-categories {
   padding: 16px;
}

.review-choice-grid {
   display: grid;
   gap: 7px;
   margin-top: 12px;
}

.review-choice {
   display: flex;
   min-height: 58px;
   align-items: center;
   gap: 11px;
   padding: 8px 10px;
   border: 1px solid var(--line-soft);
   border-radius: 11px;
   background: var(--card-2);
}

.review-choice:has(input:checked) {
   border-color: var(--lacquer);
   box-shadow: inset 3px 0 var(--lacquer);
}

.review-choice span,
.review-choice strong,
.review-choice small {
   display: block;
}

.review-choice span {
   min-width: 0;
}

.review-choice strong {
   font-size: 14px;
}

.review-choice small {
   margin-top: 2px;
   color: var(--ink-faint);
   font-size: 12px;
}

.review-pack-select {
   margin-top: 12px;
}

.review-tree {
   display: grid;
   gap: 10px;
   margin-top: 12px;
}

.review-tree-pack {
   overflow: hidden;
   border: 1px solid var(--line-soft);
   border-radius: 11px;
}

.review-tree-pack-head {
   display: flex;
   min-height: 50px;
   align-items: center;
   justify-content: space-between;
   gap: 8px;
   padding: 5px 9px;
   background: var(--card-2);
}

.review-category-check {
   display: flex;
   min-height: 46px;
   align-items: center;
   gap: 9px;
   padding: 6px 12px 6px 24px;
   border-top: 1px solid var(--line-soft);
}

.review-category-check span {
   margin-left: auto;
   color: var(--ink-faint);
   font-size: 12px;
}

.review-live {
   grid-template-columns: repeat(4, minmax(0, 1fr));
   margin: 0;
}

.review-launch {
   padding: 12px;
}

.review-launch > div {
   min-width: 150px;
}

.review-launch .f-lab {
   margin: 0;
}

.review-compat {
   position: absolute;
   width: 1px;
   height: 1px;
   overflow: hidden;
   clip-path: inset(50%);
}

.sr-only {
   position: absolute;
   width: 1px;
   height: 1px;
   overflow: hidden;
   clip: rect(0, 0, 0, 0);
   white-space: nowrap;
}

@media (min-width: 900px) {
   .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
   .review-layout { grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); align-items: start; }
   .review-choice-grid { grid-template-columns: 1fr 1fr; }
   .category-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
   .library-head,
   .pack-detail-title,
   .word-list-title,
   .review-launch { align-items: stretch; flex-direction: column; }
   .lib-import-main,
   .review-launch .btn,
   .review-launch > div { width: 100%; }
   .library-toolbar > .btn { flex: 1 1 140px; }
   .pack-open { flex-wrap: wrap; }
   .pack-copy { flex-basis: calc(100% - 64px); }
   .due-pill { margin-left: 59px; }
   .word-open { grid-template-columns: 58px minmax(0, 1fr); }
   .word-open .row-badges { grid-column: 1 / -1; max-width: none; justify-content: flex-start; }
   .bulk-bar { top: 62px; flex-wrap: wrap; }
   .bulk-bar strong { flex-basis: 100%; }
   .import-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
   .review-live { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 380px) {
   .library-page,
   .review-page { gap: 12px; }
   .tile-actions .btn { flex: 1 1 44%; }
   .selection-tools .btn { flex: 1 1 46%; }
   .import-source-grid { grid-template-columns: 1fr; }
   .import-source-grid .btn:last-child { grid-column: auto; }
   .word-select-row { grid-template-columns: 44px minmax(0, 1fr); }
   .word-check { min-width: 44px; }
   .word-open { gap: 7px; padding: 8px; }
}

/* ---------- animations & desktop ---------- */
         @keyframes inkIn {
            from {
               filter: blur(7px);
               opacity: 0;
               transform: scale(1.04);
            }
            to {
               filter: blur(0);
               opacity: 1;
               transform: none;
            }
         }
         .ink-in {
            animation: inkIn 0.45s ease-out both;
         }
         @media (prefers-reduced-motion: reduce) {
            * {
               animation: none !important;
               transition: none !important;
            }
         }
         @media (min-width: 900px) {
            #view {
               max-width: 820px;
            }
            .nav {
               left: 50%;
               right: auto;
               transform: translateX(-50%);
               width: 820px;
               max-width: 96vw;
               border: 1px solid var(--line);
               border-bottom: none;
               border-radius: 16px 16px 0 0;
            }
            #lib-list {
               display: grid;
               grid-template-columns: 1fr 1fr;
               gap: 0 26px;
               align-items: start;
            }
            .flash {
               min-height: 390px;
            }
            .opts {
               grid-template-columns: repeat(4, 1fr);
            }
            #sheet {
               align-items: center;
            }
            .sheet-card {
               border-radius: 20px;
               border-bottom: 1px solid var(--line);
               max-height: 82dvh;
            }
            .hero-hz {
               font-size: 66px;
            }
         }

/* Normalisation commune à l'import historique et au dictionnaire hors ligne. */
const PINYIN_TONE_TABLE = {
   a: "āáǎà",
   e: "ēéěè",
   i: "īíǐì",
   o: "ōóǒò",
   u: "ūúǔù",
   ü: "ǖǘǚǜ",
};

const PINYIN_MARK_TO_NUMBER = (() => {
   const output = {};
   Object.entries(PINYIN_TONE_TABLE).forEach(([plain, marked]) => {
      Array.from(marked).forEach((character, index) => {
         output[character] = { plain, tone: index + 1 };
      });
   });
   return output;
})();

const PINYIN_MARK_PATTERN = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
const HAN_PATTERN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/u;
const HAN_ONLY_PATTERN = /^[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]+$/u;

/* Les syllabes non tonées ci-dessous sont ambiguës avec des mots français. */
const AMBIGUOUS_FRENCH_PINYIN = new Set([
   "ce",
   "de",
   "le",
   "ma",
   "me",
   "ne",
   "si",
   "te",
   "tu",
]);

const PINYIN_INITIALS = [
   "",
   "b",
   "p",
   "m",
   "f",
   "d",
   "t",
   "n",
   "l",
   "g",
   "k",
   "h",
   "j",
   "q",
   "x",
   "zh",
   "ch",
   "sh",
   "r",
   "z",
   "c",
   "s",
   "y",
   "w",
];

const PINYIN_FINALS = [
   "a", "ai", "an", "ang", "ao", "e", "ei", "en", "eng", "er", "o", "ou",
   "i", "ia", "ian", "iang", "iao", "ie", "in", "ing", "iong", "iu",
   "u", "ua", "uai", "uan", "uang", "ui", "un", "uo",
   "ü", "üe", "üan", "ün",
];

const PINYIN_SYLLABLES = (() => {
   const values = new Set();
   PINYIN_INITIALS.forEach((initial) =>
      PINYIN_FINALS.forEach((final) => values.add(initial + final)),
   );

function normalizeUnicode(value) {

}

function normalizeApostrophes(value) {

   return normalizePinyinPlain(value).split(" ").filter(Boolean);
}

function isPinyinSyllable(value) {
   return PINYIN_SYLLABLES.has(String(value || "").toLowerCase());
}

function classifySearchQuery(rawValue) {
   const display = normalizeVisibleWhitespace(rawValue);
   const normalized = normalizeApostrophes(display).toLowerCase();
   const hasHan = HAN_PATTERN.test(normalized);
   const hasLatin = /[a-zà-öø-ÿü]/iu.test(normalized);
   const hasDigits = /\d/u.test(normalized);

   if (!display) return { type: "empty", display, valid: false };
   if (hasHan && (hasLatin || hasDigits))
      return { type: "mixed", display, valid: false };
   if (hasHan) {
      if (!HAN_ONLY_PATTERN.test(normalized))
         return { type: "mixed", display, valid: false };
      const characters = Array.from(normalized);
      return {
         type: characters.length === 1 ? "hanzi-exact" : "hanzi-word",
         display,
         valid: true,
         hanzi: normalized,
         characters,
      };
   }

   if (!hasLatin)
      return { type: "invalid", display, valid: false };
   if (/[^a-zà-öø-ÿüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ0-9:'’‘ʼ＇\s.,;!?·•，；。！？、/\\_-]/iu.test(normalized))
      return { type: "invalid", display, valid: false };

   const marked = PINYIN_MARK_PATTERN.test(normalized);
   const numbered = /[1-5]/u.test(normalized);
   const numberedKey = normalizePinyinNumbered(normalized);
   const markedKey = normalizePinyinMarked(normalized);
   const plainKey = normalizePinyinPlain(normalized);
   const syllables = plainKey.split(" ").filter(Boolean);
   const validPinyin =
      syllables.length > 0 &&
      syllables.every(isPinyinSyllable) &&
      !(!marked && !numbered && syllables.length === 1 && AMBIGUOUS_FRENCH_PINYIN.has(syllables[0]));

   if ((marked || numbered) && !validPinyin)
      return { type: "invalid", display, valid: false };
   if (validPinyin) {
      return {
         type: marked ? "pinyin-marked" : numbered ? "pinyin-numbered" : "pinyin-plain",
         display,
         valid: true,
         marked: markedKey,
         numbered: numberedKey,
         plain: plainKey,
         syllables,
      };
   }

   const translation = normalizeTranslation(normalized);
   if (!translation) return { type: "invalid", display, valid: false };
   return {
      type: "translation",
      display,
      valid: true,
      translation,
      tokens: translation.split(" ").filter(Boolean),
   };
}

function toneOf(syllable) {
   const numbered = normalizePinyinNumbered(syllable);
   const match = numbered.match(/[1-5](?:\s|$)/u);
   return match ? Number(match[0].trim()) : 5;
}

function colorPinyin(pinyin) {
   if (!pinyin) return "";
   if (typeof db !== "undefined" && !db.settings.toneColors) return esc(pinyin);
   return String(pinyin)
      .split(/(\s+)/u)
      .map((part) => {
         if (!/[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/iu.test(part)) return esc(part);
         return '<span class="tn t' + toneOf(part) + '">' + esc(part) + "</span>";
      })
      .join("");
}

/* Compatibilité des anciens appels internes. */
const toneless = normalizePinyinPlain;
const toneKey = normalizePinyinMarked;
const pySyllables = (value) => normalizeVisibleWhitespace(value).split(" ").filter(Boolean);
const classifyQuery = (value) => classifySearchQuery(value).type;

if (typeof module !== "undefined" && module.exports) {

      normalizeApostrophes,
      normalizePinyinMarked,
      normalizePinyinNumbered,
      normalizePinyinPlain,
      normalizeTranslation,
