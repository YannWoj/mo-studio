         /* -------- vérification du mode écrit -------- */
         function pyMatch(target, given) {
            const t = numToAccent(String(target || "")).toLowerCase();
            const g = numToAccent(String(given || "")).toLowerCase();
            const keep = (s) =>
               s
                  .normalize("NFC")
                  .replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "");
            if (keep(t) === keep(g) && keep(g)) return { ok: true, note: "" };
            if (flatten(t) === flatten(g) && flatten(g))
               return {
                  ok: false,
                  note: "Bonnes syllabes, mais vérifie les tons.",
               };
            return { ok: false, note: "" };
         }
         function normFr(s) {
            const base = String(s || "")
               .toLowerCase()
               .replace(/\(.*?\)/g, " ")
               .replace(/[’']/g, " ")
               .normalize("NFD")
               .replace(/[\u0300-\u036f]/g, "");
            const clean = (x) => x.replace(/[^a-z]+/g, "");
            // retire les articles, mais garde le mot si tout disparaît (ex : « un »)
            return (
               clean(
                  base.replace(
                     /\b(le|la|les|l|un|une|des|du|de|d|au|aux)\b/g,
                     " ",
                  ),
               ) || clean(base)
            );
         }
         function frMatch(target, given) {
            const g = normFr(given);
            if (!g) return false;
            const segs = String(target || "")
               .split(/[,;/·]/)
               .map(normFr)
               .filter(Boolean);
            if (segs.includes(g)) return true;
            return segs.some(
               (seg) =>
                  (g.length >= 4 && seg.includes(g)) ||
                  (seg.length >= 4 && g.includes(seg)),
            );
         }
         function checkWritten() {
            if (!session.active) return;
            const c = currentCard();
            const st = getState(session.index);
            if (!c || !st || st.checked || session.mode !== "written") return;
            let ok = false,
               note = "";
            if (st.task === "trace") {
               if (!st.traceOk && !st.traceReady) {
                  toast("Termine ton tracé d'abord (ou « Voir la réponse »).");
                  return;
               }
               ok = !!st.traceOk;
            } else {
               const given = ($("w-input") ? $("w-input").value : "").trim();
               if (!given) {
                  toast("Écris ta réponse d'abord.");
                  return;
               }
               if (st.task === "fr") ok = frMatch(c.fr, given);
               else {
                  const r = pyMatch(c.py, given);
                  ok = r.ok;
                  note = r.note;
               }
            }
            st.checked = true;
            st.ok = ok;
            st.note = note;
            renderSession();
            speak(c.hz);
         }

         /* -------- tracé pendant la séance -------- */
         function setupSessionTrace(c, st) {
            const target = $("s-writer");
            if (!target) return;
            const chars = Array.from(c.hz).filter((ch) =>
               /[\u4e00-\u9fff]/.test(ch),
            );
            if (!chars.length || typeof HanziWriter === "undefined") {
               fallbackTrace(c, st);
               return;
            }
            const size = Math.min(280, target.parentElement.clientWidth || 280);
            target.style.width = size + "px";
            target.style.height = size + "px";
            const note = $("s-tracenote");
            let i = 0;
            st.traceOk = false;
            st.traceReady = false;
            const runOne = () => {
               if (
                  !session.active ||
                  currentCard() !== c ||
                  getState(session.index).checked
               )
                  return;
               target.innerHTML = "";
               if (note)
                  note.textContent =
                     chars.length > 1
                        ? "Caractère " + (i + 1) + " / " + chars.length
                        : "Trace le caractère, trait par trait.";
               const writer = HanziWriter.create(target, chars[i], {
                  width: size,
                  height: size,
                  padding: 10,
                  showCharacter: false,
                  showOutline: true,
                  showHintAfterMisses: 2,
                  strokeColor: "#17140F",
                  outlineColor: "#CDBFA1",
                  drawingColor: "#9E2B25",
                  onLoadCharDataError: () => {
                     if (
                        session.active &&
                        currentCard() === c &&
                        !getState(session.index).checked
                     )
                        fallbackTrace(c, st);
                  },
               });
               writer.quiz({
                  onComplete: () => {
                     i++;
                     if (i < chars.length) setTimeout(runOne, 450);
                     else {
                        st.traceOk = true;
                        st.traceReady = true;
                        if (note)
                           note.textContent =
                              "Tracé terminé — appuie sur Vérifier.";
                     }
                  },
               });
            };
            runOne();
         }
         function fallbackTrace(c, st) {
            // repli si les données de traits ne chargent pas : tracé libre auto-évalué
            const target = $("s-writer"),
               ghost = $("s-ghost"),
               canvas = $("s-canvas"),
               btns = $("t-btns"),
               note = $("s-tracenote");
            if (!target || !ghost || !canvas) return;
            target.hidden = true;
            ghost.hidden = false;
            canvas.hidden = false;
            if (btns) btns.hidden = false;
            if (note)
               note.textContent =
                  "Tracé libre : recopie le modèle, puis évalue-toi.";
            const box = ghost.parentElement;
            const size = Math.min(280, box.clientWidth || 280);
            canvas.width = size;
            canvas.height = size;
            const len = Array.from(c.hz).length;
            ghost.style.fontSize =
               (len >= 3 ? 80 : len === 2 ? 125 : 200) + "px";
            paintPad(canvas);
            st.traceReady = true;
            if ($("t-ok"))
               $("t-ok").onclick = () => {
                  st.traceOk = true;
                  checkWritten();
               };
            if ($("t-no"))
               $("t-no").onclick = () => {
                  st.traceOk = false;
                  checkWritten();
               };
         }
         function paintPad(canvas) {
            const ctx = canvas.getContext("2d");
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "#17140F";
            let drawing = false;
            const pos = (e) => {
               const r = canvas.getBoundingClientRect();
               return [
                  ((e.clientX - r.left) * canvas.width) / r.width,
                  ((e.clientY - r.top) * canvas.height) / r.height,
               ];
            };
            canvas.onpointerdown = (e) => {
               drawing = true;
               canvas.setPointerCapture(e.pointerId);
               const p = pos(e);
               ctx.beginPath();
               ctx.moveTo(p[0], p[1]);
            };
            canvas.onpointermove = (e) => {
               if (!drawing) return;
               const p = pos(e);
               ctx.lineTo(p[0], p[1]);
               ctx.stroke();
            };
            canvas.onpointerup = canvas.onpointercancel = () => {
               drawing = false;
            };
         }

         /* -------- fin de séance -------- */
         function endSession() {
            const sts = session.states.filter(Boolean);
            const seen = sts.filter(
               (s) => s.revealed || s.checked || s.grade,
            ).length;
            const checkedN = sts.filter((s) => s.checked).length;
            const right = sts.filter((s) => s.checked && s.ok === true).length;
            const gCount = (g) => sts.filter((s) => s.grade === g).length;
            const errIds = [];
            session.states.forEach((s, i) => {
               if (!s) return;
               if (s.grade === "again" || (s.checked && s.ok === false)) {
                  const id = session.cards[i] && session.cards[i].id;
                  if (id && !errIds.includes(id)) errIds.push(id);
               }
            });
            session.summary = {
               total: session.cards.length,
               seen,
               right,
               checked: checkedN,
               again: gCount("again"),
               hard: gCount("hard"),
               good: gCount("good"),
               easy: gCount("easy"),
               marked: session.live.marked,
               acquired: session.live.acquired,
               errIds,
               mode: session.mode,
            };
            session.active = false;
            clearSavedSession();
            document.body.classList.remove("in-session");
            renderLearn();
         }
         function renderSummary() {
            const s = session.summary;
            const graded = s.again + s.hard + s.good + s.easy;
            const errCards = s.errIds
               .map((id) => db.cards.find((c) => c.id === id))
               .filter(Boolean);
            const errList = errCards.length
               ? '<div class="eyebrow" style="text-align:center">À retravailler</div><div class="err-list">' +
                 errCards
                    .map(

            $("view").innerHTML =

               '<div class="sum-hz ink-in">完</div>' +
               '<h2 class="sum-t">Séance terminée</h2>' +
               '<div class="sum-rows">' +
               '<div class="sum-row"><span>Cartes vues</span><b>' +
               s.seen +
               " / " +
               s.total +
               "</b></div>" +
               (graded
                  ? '<div class="sum-row"><span>Réussies (Correct + Facile)</span><b>' +
                    (s.good + s.easy) +
                    " / " +

                    "</b></div>"
                  : "") +
               (s.mode === "written"
                  ? '<div class="sum-row"><span>Réponses écrites justes</span><b>' +
                    s.right +
                    " / " +
                    s.checked +
                    "</b></div>"
                  : "") +

                  ? '<div class="sum-row"><span>Ratées (reviennent vite)</span><b>' +
                    s.again +
                    "</b></div>"
                  : "") +
               (s.marked
                  ? '<div class="sum-row"><span>Programmées à la main</span><b>' +
                    s.marked +
                    "</b></div>"
                  : "") +
               (s.acquired
                  ? '<div class="sum-row"><span>Passées en maîtrisées</span><b>' +
                    s.acquired +
                    "</b></div>"
                  : "") +

               errList +

                  ? '<button class="btn primary big" id="btn-redo-err">Revoir mes ' +
                    errCards.length +

                  : "") +
               '<button class="btn' +
               (errCards.length ? " ghost" : " primary big") +
               '" id="btn-back-hub">Retour à l\'atelier</button>' +

               "</section>";
            if ($("btn-redo-err"))

                  const cards = shuffle(errCards);
                  session = { active: false };

         /* -------- programmation manuelle -------- */
         function delayTargets() {
            const t = now();
            const tonight = new Date();
            tonight.setHours(20, 0, 0, 0);
            if (tonight.getTime() <= t) tonight.setDate(tonight.getDate() + 1);
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            return [
               ["10 minutes", t + 10 * 60e3],
               ["1 heure", t + 3600e3],
               ["3 heures", t + 3 * 3600e3],
               ["Ce soir · 20 h", tonight.getTime()],
               ["Demain · 9 h", tomorrow.getTime()],
               ["3 jours", t + 3 * 86400e3],
               ["1 semaine", t + 7 * 86400e3],
            ];
         }
         function openDelaySheet(c, after) {
            const opts = delayTargets()
               .map(
                  (o) =>
                     '<button class="btn" data-d="' +
                     o[1] +
                     '">' +
                     o[0] +
                     "</button>",
               )
               .join("");
            openSheet(
               '<h3 class="sh-t">Revoir « ' +
                  esc(c.hz) +
                  " » dans…</h3>" +
                  (c.due != null
                     ? '<p class="sh-p">Actuellement programmée : ' +
                       fmtDate(c.due) +
                       "</p>"
                     : "") +
                  '<div class="delay-grid">' +
                  opts +
                  "</div>" +
                  '<div class="dl-custom"><input type="datetime-local" id="dl-dt" class="search"><button class="btn" id="dl-ok">OK</button></div>' +
                  (c.due != null
                     ? '<button class="btn ghost wide" id="dl-cancel">Annuler la programmation actuelle</button>'
                     : "") +
                  '<button class="btn ghost wide" id="dl-close">Fermer</button>',
            );
            const setDue = (ts) => {
               c.due = ts;
               c.acquired = false;
               save();
               closeSheet();
               toast("« " + c.hz + " » reviendra le " + fmtDate(ts) + ".");
               if (after) after(true);
            };
            document
               .querySelectorAll("#sheet [data-d]")
               .forEach((b) => (b.onclick = () => setDue(+b.dataset.d)));
            $("dl-ok").onclick = () => {
               const v = $("dl-dt").value;
               if (!v) {
                  toast("Choisis une date et une heure.");
                  return;
               }
               const ts = new Date(v).getTime();
               if (!ts || ts <= now()) {
                  toast("Choisis un moment dans le futur.");
                  return;
               }
               setDue(ts);
            };
            if ($("dl-cancel"))
               $("dl-cancel").onclick = () => {
                  c.due = null;
                  save();
                  closeSheet();
                  toast("Programmation annulée.");
                  if (after) after(false);
               };
            $("dl-close").onclick = closeSheet;
         }

"use strict";

/* ================= Mes mots : packs, catégories et cartes ================= */
let lib = {
   level: "packs",
   packId: "",
   categoryId: "",
   q: "",
   flt: "all",
   selected: new Set(),
};

function dueCount(cards) {
   return cards.filter(isDue).length;
}

function libraryScopeCards() {
   if (lib.level === "category" && lib.categoryId) return cardsForCategory(lib.categoryId);
   if (lib.level === "pack" && lib.packId) return cardsForPack(lib.packId);
   return db.cards.slice();
}

function libraryFilteredCards() {
   let cards = libraryScopeCards();
   const query = lib.q.trim();
   const flat = flatten(query);
   if (query) {
      cards = cards.filter((card) =>
         card.hz.includes(query) ||
         flatten(card.py).includes(flat) ||
         flatten(card.fr).includes(flat) ||
         flatten((card.tags || []).join(" ")).includes(flat),
      );
   }
   if (lib.flt === "fav") cards = cards.filter((card) => card.fav);
   else if (lib.flt === "difficult") cards = cards.filter((card) => card.difficult);
   else if (lib.flt === "new") cards = cards.filter((card) => card.due == null && !card.acquired);
   else if (lib.flt === "mastered") cards = cards.filter((card) => card.acquired);
   else if (lib.flt === "due") cards = cards.filter(isDue);
   return cards.sort((a, b) => b.created - a.created);
}

function libraryBreadcrumb() {
   const pack = db.packs.find((item) => item.id === lib.packId);
   const category = categoryById(lib.categoryId);
   if (lib.level === "category" && pack && category)
      return '<button class="lib-crumb" data-lib-go="packs">Mes mots</button><span>›</span><button class="lib-crumb" data-lib-go="pack">' + esc(pack.name) + '</button><span>›</span><strong>' + esc(category.name) + "</strong>";
   if (lib.level === "pack" && pack)
      return '<button class="lib-crumb" data-lib-go="packs">Mes mots</button><span>›</span><strong>' + esc(pack.name) + "</strong>";
   if (lib.level === "all")
      return '<button class="lib-crumb" data-lib-go="packs">Mes mots</button><span>›</span><strong>Tous les mots</strong>';
   return "";
}

      if (input.checked) lib.selected.add(input.dataset.wordCheck); else lib.selected.delete(input.dataset.wordCheck);

   });
   document.querySelectorAll("[data-word-open]").forEach((button) => button.onclick = () => openCardDetail(button.dataset.wordOpen));
   document.querySelectorAll("[data-select-mode]").forEach((button) => button.onclick = () => {

function wireLibraryCommon() {

function renderLib() {

"use strict";

const DICTIONARY_SCHEMA_VERSION = 1;
const DICTIONARY_CACHE_NAME = "mo-studio-dictionary-v1";
const DICTIONARY_PARSED_CHUNK_LIMIT = 10;
const DICTIONARY_ENTRY_CACHE_LIMIT = 240;
const DICTIONARY_ROOT = (() => {
   if (typeof document === "undefined") {
      const workerBase = typeof self !== "undefined" && self.location
         ? self.location.href
         : "http://localhost/js/search/dictionary-search-worker.js";
      return new URL("../../data/generated/dictionary/", workerBase).href;
   }
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(portable ? "../data/generated/dictionary/" : "data/generated/dictionary/", document.baseURI).href;
})();

const dictionaryDataState = {
   status: "idle",
   manifest: null,
   attribution: null,
   locations: null,
   referenceById: null,
   indexes: new Map(),
   chunks: new Map(),
   previewCatalog: null,
   entries: new Map(),
   error: null,
};

function dictionaryResourceUrl(relativePath) {
   return new URL(relativePath, DICTIONARY_ROOT).href;
}

async function openDictionaryCache() {
   return "caches" in globalThis ? caches.open(DICTIONARY_CACHE_NAME) : null;
}

async function fetchDictionaryResponse(relativePath, reload) {
   const url = dictionaryResourceUrl(relativePath);
   const cache = await openDictionaryCache();
   if (!reload && cache) {
      const cached = await cache.match(url);
      if (cached) return { response: cached, cached: true, cache, url };
   }
   const response = await fetch(url, { cache: reload ? "reload" : "default" });
   if (!response.ok) throw new Error(relativePath + " · HTTP " + response.status);
   if (cache) {
      const write = cache.put(url, response.clone());
      if (reload) await write;
      else write.catch(() => {});
   }
   return { response, cached: false, cache, url };
}

async function fetchDictionaryJson(relativePath, reload) {
   let loaded = await fetchDictionaryResponse(relativePath, !!reload);
   try {
      return await loaded.response.json();
   } catch (error) {
      if (loaded.cached && loaded.cache) {
         await loaded.cache.delete(loaded.url);
         loaded = await fetchDictionaryResponse(relativePath, true);
         try {
            return await loaded.response.json();
         } catch (networkError) {
            throw new Error(relativePath + " · JSON corrompu");
         }
      }
      throw new Error(relativePath + " · JSON corrompu");
   }
}

function validateDictionaryManifest(manifest) {
   if (
      !manifest ||
      manifest.format !== "mo-studio-offline-dictionary" ||
      manifest.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !manifest.indexes ||
      !manifest.entryLocations ||
      !manifest.attribution ||
      !manifest.chunkPathTemplate ||
      !manifest.searchPreviews
   )
      throw new Error("Version d’index absente, corrompue ou incompatible.");
   return manifest;
}

function resetDictionaryMemory() {
   if (typeof clearDictionarySearchCache === "function")
      clearDictionarySearchCache();
   if (typeof resetDictionarySearchWorker === "function")
      resetDictionarySearchWorker();
   dictionaryDataState.manifest = null;
   dictionaryDataState.attribution = null;
   dictionaryDataState.locations = null;
   dictionaryDataState.referenceById = null;
   dictionaryDataState.indexes.clear();
   dictionaryDataState.chunks.clear();
   dictionaryDataState.previewCatalog = null;
   dictionaryDataState.entries.clear();
   dictionaryDataState.error = null;
   dictionaryDataState.status = "idle";
}

async function loadDictionaryManifest(reload) {
   if (dictionaryDataState.manifest && !reload) return dictionaryDataState.manifest;
   dictionaryDataState.status = "loading";
   try {
      const manifest = validateDictionaryManifest(
         await fetchDictionaryJson("manifest.json", !!reload),
      );
      if (
         dictionaryDataState.manifest &&
         dictionaryDataState.manifest.buildId !== manifest.buildId
      ) {
         dictionaryDataState.locations = null;
         dictionaryDataState.referenceById = null;
         dictionaryDataState.indexes.clear();
         dictionaryDataState.chunks.clear();
         dictionaryDataState.previewCatalog = null;
         dictionaryDataState.entries.clear();
      }
      dictionaryDataState.manifest = manifest;
      dictionaryDataState.status = "ready";
      return manifest;
   } catch (error) {
      dictionaryDataState.status = "error";
      dictionaryDataState.error = error;
      throw error;
   }
}

async function loadDictionaryAttribution(reload) {
   const manifest = await loadDictionaryManifest(reload);
   if (dictionaryDataState.attribution && !reload)
      return { manifest, attribution: dictionaryDataState.attribution };
   const attribution = await fetchDictionaryJson(manifest.attribution, !!reload);
   if (!Array.isArray(attribution.sources))
      throw new Error("Attribution du dictionnaire invalide.");
   dictionaryDataState.attribution = attribution;
   return { manifest, attribution };
}

async function loadDictionaryLocations(reload) {
   const manifest = await loadDictionaryManifest(reload);
   if (dictionaryDataState.locations && !reload) return dictionaryDataState.locations;
   const locations = await fetchDictionaryJson(manifest.entryLocations, !!reload);
   if (!Array.isArray(locations) || locations.length !== manifest.counts.entries)
      throw new Error("Table des entrées du dictionnaire invalide.");
   dictionaryDataState.locations = locations;
   dictionaryDataState.referenceById = null;
   return locations;
}

async function loadDictionaryIndex(name, reload) {
   const manifest = await loadDictionaryManifest(reload);
   const path = manifest.indexes[name];
   if (!path) throw new Error("Index inconnu : " + name);
   if (dictionaryDataState.indexes.has(name) && !reload)
      return dictionaryDataState.indexes.get(name);
   const index = await fetchDictionaryJson(path, !!reload);
   if (!index || typeof index !== "object" || Array.isArray(index))
      throw new Error(path + " · contenu invalide");
   dictionaryDataState.indexes.set(name, index);
   return index;
}

function rememberDictionaryEntry(entry) {
   dictionaryDataState.entries.delete(entry.id);
   dictionaryDataState.entries.set(entry.id, entry);
   while (dictionaryDataState.entries.size > DICTIONARY_ENTRY_CACHE_LIMIT) {
      const oldest = dictionaryDataState.entries.keys().next().value;
      dictionaryDataState.entries.delete(oldest);
   }
}

function rememberDictionaryChunk(key, entries) {
   dictionaryDataState.chunks.delete(key);
   dictionaryDataState.chunks.set(key, entries);
   while (dictionaryDataState.chunks.size > DICTIONARY_PARSED_CHUNK_LIMIT) {
      const oldest = dictionaryDataState.chunks.keys().next().value;
      dictionaryDataState.chunks.delete(oldest);
   }
}

async function loadDictionaryChunk(key, reload) {
   if (dictionaryDataState.chunks.has(key) && !reload) {
      const entries = dictionaryDataState.chunks.get(key);
      rememberDictionaryChunk(key, entries);
      return entries;
   }
   const manifest = await loadDictionaryManifest(reload);
   const path = manifest.chunkPathTemplate.replace("{chunk}", key);
   const payload = await fetchDictionaryJson(path, !!reload);
   if (
      !payload ||
      payload.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !Array.isArray(payload.entries)
   )
      throw new Error(path + " · chunk invalide");
   rememberDictionaryChunk(key, payload.entries);
   return payload.entries;
}

function dictionaryPreviewFromArray(value, reference) {
   if (!Array.isArray(value) || value.length !== 11)
      throw new Error("Aperçu de dictionnaire invalide.");
   return {
      id: value[0],
      simplified: value[1],
      traditional: value[2] || value[1],
      entryType: value[3] === "c" ? "character" : "word",
      pinyin: (value[4] || []).map((variant) => ({
         marked: variant[0],
         numbered: variant[1],
         plain: variant[2],
      })),
      definitionsFr: value[5] ? [value[5]] : [],
      definitionsEn: value[6] ? [value[6]] : [],
      sources: value[7] || [],
      hskLegacy: value[8] || [],
      hsk30: value[9] || [],
      frequencyRank: value[10],
      characters: Array.from(value[1]).filter((character) => HAN_PATTERN.test(character)),
      __preview: true,
      __reference: reference,
   };
}

async function loadDictionaryPreviewCatalog() {
   if (dictionaryDataState.previewCatalog) return dictionaryDataState.previewCatalog;
   const manifest = await loadDictionaryManifest(false);
   const payload = await fetchDictionaryJson(manifest.searchPreviews, false);
   if (
      !payload ||
      payload.schemaVersion !== DICTIONARY_SCHEMA_VERSION ||
      !Array.isArray(payload.entries) ||
      payload.entries.length !== manifest.counts.entries
   )
      throw new Error(manifest.searchPreviews + " · aperçus invalides");
   dictionaryDataState.previewCatalog = payload.entries;
   return payload.entries;
}

async function loadDictionaryPreviewsByReferences(references) {
   const locations = await loadDictionaryLocations(false);
   const catalog = await loadDictionaryPreviewCatalog();
   const uniqueReferences = Array.from(new Set(references)).filter(
      (reference) => Number.isInteger(reference) && reference >= 0 && reference < locations.length,
   );
   return uniqueReferences
      .map((reference) => dictionaryPreviewFromArray(catalog[reference], reference))
      .filter(Boolean);
}

async function loadDictionaryEntriesByReferences(references, options) {
   const locations = await loadDictionaryLocations(false);
   const reload = !!(options && options.reload);
   const uniqueReferences = Array.from(new Set(references)).filter(
      (reference) => Number.isInteger(reference) && reference >= 0 && reference < locations.length,
   );
   const output = new Map();
   const byChunk = new Map();

   uniqueReferences.forEach((reference) => {
      const [entryId, chunk] = locations[reference];
      const cached = dictionaryDataState.entries.get(entryId);
      if (cached && !reload) {
         output.set(reference, cached);
         return;
      }
      if (!byChunk.has(chunk)) byChunk.set(chunk, []);
      byChunk.get(chunk).push([reference, entryId]);
   });

   const groups = Array.from(byChunk.entries());
   for (let offset = 0; offset < groups.length; offset += 8) {
      const batch = groups.slice(offset, offset + 8);
      const loaded = await Promise.all(
         batch.map(async ([chunk, wanted]) => [chunk, wanted, await loadDictionaryChunk(chunk, reload)]),
      );
      loaded.forEach(([, wanted, entries]) => {
         const wantedById = new Map(wanted.map(([reference, entryId]) => [entryId, reference]));
         entries.forEach((entry) => {
            const reference = wantedById.get(entry.id);
            if (reference == null) return;
            rememberDictionaryEntry(entry);
            output.set(reference, entry);
         });
      });
   }
   return uniqueReferences.map((reference) => output.get(reference)).filter(Boolean);
}

async function loadDictionaryEntryById(entryId) {
   if (dictionaryDataState.entries.has(entryId))
      return dictionaryDataState.entries.get(entryId);
   const locations = await loadDictionaryLocations(false);
   if (!dictionaryDataState.referenceById) {
      dictionaryDataState.referenceById = new Map(
         locations.map(([id], reference) => [id, reference]),
      );
   }
   const reference = dictionaryDataState.referenceById.get(entryId);
   if (reference == null) return null;
   const [entry] = await loadDictionaryEntriesByReferences([reference]);
   return entry || null;
}

async function loadDictionaryCharacterLinks(character, limit) {
   const index = await loadDictionaryIndex("characters", false);
   const item = index[character];
   if (!item) return { characterEntry: null, words: [] };
   const references = [item.entryRef, ...item.wordRefs.slice(0, limit || 12)];
   const entries = await loadDictionaryPreviewsByReferences(references);
   return {
      characterEntry: entries.find((entry) => entry.entryType === "character") || null,
      words: entries.filter((entry) => entry.entryType === "word"),
   };
}

async function deleteDictionaryCacheOnly() {
   if ("caches" in globalThis) await caches.delete(DICTIONARY_CACHE_NAME);
   if ("indexedDB" in globalThis && indexedDB.databases) {
      const databases = await indexedDB.databases();
      if (databases.some((database) => database.name === DICTIONARY_CACHE_NAME)) {
         await new Promise((resolve, reject) => {
            const request = indexedDB.deleteDatabase(DICTIONARY_CACHE_NAME);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
            request.onblocked = () => reject(new Error("Le cache du dictionnaire est encore ouvert."));
         });
      }
   }
   resetDictionaryMemory();
}

async function rebuildDictionaryIndex(onStatus) {
   const update = (message) => {
      dictionaryDataState.status = "loading";
      if (onStatus) onStatus("loading", message);
   };
   try {
      update("Nettoyage du cache du dictionnaire…");
      await deleteDictionaryCacheOnly();
      const { manifest } = await loadDictionaryAttribution(true);
      const tasks = [
         ["positions", manifest.entryLocations],
         ["previews", manifest.searchPreviews],
         ...Object.entries(manifest.indexes),
      ];
      for (let index = 0; index < tasks.length; index++) {
         update("Préparation hors ligne " + (index + 1) + " / " + tasks.length + "…");
         if (tasks[index][0] === "positions") await loadDictionaryLocations(true);
         else if (tasks[index][0] === "previews") await loadDictionaryPreviewCatalog();
         else await loadDictionaryIndex(tasks[index][0], true);
      }
      const chunks = manifest.chunks || [];
      for (let offset = 0; offset < chunks.length; offset += 8) {
         update(
            "Préparation des fiches hors ligne " +
               Math.min(offset + 8, chunks.length) +
               " / " +
               chunks.length +
               "…",
         );
         await Promise.all(
            chunks
               .slice(offset, offset + 8)
               .map((chunk) => fetchDictionaryResponse(chunk.path, true)),
         );
      }
      dictionaryDataState.status = "ready";
      if (onStatus)
         onStatus(
            "success",
            "Index prêt hors ligne · " + manifest.counts.words.toLocaleString("fr-FR") + " entrées lexicales.",
         );
      return manifest;
   } catch (error) {
      dictionaryDataState.status = "error";
      dictionaryDataState.error = error;
      if (onStatus) onStatus("error", "Échec · " + error.message);
      throw error;
   }
}

"use strict";

/* Scores positifs : plus le score est élevé, plus le résultat est pertinent. */
const SEARCH_WEIGHTS = Object.freeze({
   EXACT_SIMPLIFIED: 12000,
   EXACT_TRADITIONAL: 11800,
   EXACT_CHINESE_WORD: 1100,
   EXACT_CHARACTER: 900,
   EXACT_PINYIN_MARKED: 10800,
   EXACT_PINYIN_NUMBERED: 10400,
   EXACT_PINYIN_PLAIN: 8600,
   PINYIN_PREFIX: 4400,
   HANZI_PREFIX: 6900,
   HANZI_CONTAINS: 3200,
   EXACT_FRENCH_TOKEN: 7800,
   FRENCH_PREFIX_TOKEN: 4200,
   ENGLISH_FALLBACK: 2300,
   PERSONAL_CARD: 1500,
   CHARACTER_TYPE: 260,
   VERIFIED_HSK: 420,
   VERIFIED_FREQUENCY_MAX: 600,
   FRENCH_DEFINITION: 180,
   ENGLISH_DEFINITION: 45,
   SOURCE_COMPLETENESS: 35,
   WORD_LENGTH_PENALTY: 9,
});

function entryPinyinVariants(entry) {
   if (Array.isArray(entry.pinyin)) return entry.pinyin;
   if (entry.py) {
      return [
         {
            marked: normalizePinyinMarked(entry.py),
            numbered: normalizePinyinNumbered(entry.py),
            plain: normalizePinyinPlain(entry.py),
         },
      ];
   }
   return [];
}

function entryDefinitions(entry, language) {
   if (language === "fr")
      return Array.isArray(entry.definitionsFr)
         ? entry.definitionsFr
         : entry.fr
           ? [entry.fr]
           : [];
   return Array.isArray(entry.definitionsEn) ? entry.definitionsEn : [];
}

function entryHanziLength(entry) {
   return Array.from(entry.simplified || entry.hz || "").length;
}

function verifiedHskLevel(entry) {
   const levels = [
      ...(Array.isArray(entry.hskVerified)
         ? entry.hskVerified.map((item) => item.firstHskLevel ?? item.level)
         : []),
      ...(Array.isArray(entry.hskLegacy) ? entry.hskLegacy : []),
      ...(Array.isArray(entry.hsk30) ? entry.hsk30 : []),
   ].filter((value) => Number.isFinite(Number(value)));
   return levels.length ? Math.min(...levels.map(Number)) : null;
}

function normalizedDefinitionTokens(entry, language) {
   return entryDefinitions(entry, language).flatMap((definition) =>
      normalizeTranslation(definition).split(" ").filter(Boolean),
   );
}

function rankDictionaryEntry(entry, query, context) {
   const simplified = entry.simplified || entry.hz || "";
   const traditional = entry.traditional || simplified;
   const entryType = entry.entryType || (Array.from(simplified).length === 1 ? "character" : "word");
   const factors = [];
   let score = 0;
   const add = (name, value, explanation) => {
      if (!value) return;
      score += value;
      factors.push({ name, value, explanation });
   };

   if (query.type.startsWith("hanzi")) {
      if (simplified === query.hanzi)
         add("exactSimplified", SEARCH_WEIGHTS.EXACT_SIMPLIFIED, "forme simplifiée exacte");
      else if (traditional === query.hanzi)
         add("exactTraditional", SEARCH_WEIGHTS.EXACT_TRADITIONAL, "forme traditionnelle exacte");
      else if (simplified.startsWith(query.hanzi) || traditional.startsWith(query.hanzi))
         add("hanziPrefix", SEARCH_WEIGHTS.HANZI_PREFIX, "commence par la recherche");
      else if (simplified.includes(query.hanzi) || traditional.includes(query.hanzi))
         add("hanziContains", SEARCH_WEIGHTS.HANZI_CONTAINS, "contient la recherche");

      if ((simplified === query.hanzi || traditional === query.hanzi) && entryType === "character")
         add("exactCharacter", SEARCH_WEIGHTS.EXACT_CHARACTER, "caractère exact");
      if ((simplified === query.hanzi || traditional === query.hanzi) && entryType === "word")
         add("exactWord", SEARCH_WEIGHTS.EXACT_CHINESE_WORD, "mot exact");
   }

   if (query.type.startsWith("pinyin")) {
      let pinyinScore = 0;
      let pinyinExplanation = "";
      entryPinyinVariants(entry).forEach((variant) => {
         const marked = normalizePinyinMarked(variant.marked || variant.numbered || "");
         const numbered = normalizePinyinNumbered(variant.numbered || variant.marked || "");
         const plain = normalizePinyinPlain(variant.plain || variant.numbered || variant.marked || "");
         let candidate = 0;
         let explanation = "";
         if (query.type === "pinyin-marked" && marked === query.marked) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_MARKED;
            explanation = "pinyin accentué exact";
         } else if (query.type === "pinyin-numbered" && numbered === query.numbered) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_NUMBERED;
            explanation = "pinyin numéroté exact";
         } else if (plain === query.plain) {
            candidate = SEARCH_WEIGHTS.EXACT_PINYIN_PLAIN;
            explanation = "pinyin sans ton exact";
         } else if (
            marked.startsWith(query.marked) ||
            numbered.startsWith(query.numbered) ||
            plain.startsWith(query.plain)
         ) {
            candidate = SEARCH_WEIGHTS.PINYIN_PREFIX;
            explanation = "préfixe pinyin";
         }
         if (candidate > pinyinScore) {
            pinyinScore = candidate;
            pinyinExplanation = explanation;
         }
      });
      add("pinyin", pinyinScore, pinyinExplanation);
   }

   if (query.type === "translation") {
      const frenchTokens = normalizedDefinitionTokens(entry, "fr");
      const englishTokens = normalizedDefinitionTokens(entry, "en");
      const tokens = query.tokens || [];
      const exactFrench = tokens.length > 0 && tokens.every((token) => frenchTokens.includes(token));
      const prefixFrench =
         !exactFrench &&
         tokens.length > 0 &&
         tokens.every((token) => frenchTokens.some((word) => word.startsWith(token)));
      if (exactFrench)
         add("exactFrench", SEARCH_WEIGHTS.EXACT_FRENCH_TOKEN, "mot français exact");
      else if (prefixFrench)
         add("frenchPrefix", SEARCH_WEIGHTS.FRENCH_PREFIX_TOKEN, "préfixe français");
      else if (context && context.englishFallback) {
         const exactEnglish = tokens.length > 0 && tokens.every((token) => englishTokens.includes(token));
         if (exactEnglish)
            add("englishFallback", SEARCH_WEIGHTS.ENGLISH_FALLBACK, "repli anglais");
      }
   }

   if (entry.personalCard || entry.src === "card")
      add("personalCard", SEARCH_WEIGHTS.PERSONAL_CARD, "déjà dans Mes mots");
   if (entryType === "character")
      add("characterType", SEARCH_WEIGHTS.CHARACTER_TYPE, "entrée caractère");

   const hskLevel = verifiedHskLevel(entry);
   if (hskLevel != null)
      add("verifiedHsk", Math.max(30, SEARCH_WEIGHTS.VERIFIED_HSK - hskLevel * 35), "niveau HSK vérifié");

   if (Number.isFinite(entry.frequencyRank) && entry.frequencyRank > 0) {
      const frequencyScore = Math.max(
         1,
         Math.round(SEARCH_WEIGHTS.VERIFIED_FREQUENCY_MAX / Math.log2(entry.frequencyRank + 2)),
      );
      add("verifiedFrequency", frequencyScore, "fréquence vérifiée");
   }

   const french = entryDefinitions(entry, "fr");
   const english = entryDefinitions(entry, "en");
   if (french.length) add("frenchDefinition", SEARCH_WEIGHTS.FRENCH_DEFINITION, "définition française disponible");
   if (english.length) add("englishDefinition", SEARCH_WEIGHTS.ENGLISH_DEFINITION, "définition anglaise disponible");
   add(
      "sourceCompleteness",
      Math.min(Array.isArray(entry.sources) ? entry.sources.length : 0, 2) * SEARCH_WEIGHTS.SOURCE_COMPLETENESS,
      "sources concordantes",
   );
   score -= entryHanziLength(entry) * SEARCH_WEIGHTS.WORD_LENGTH_PENALTY;

   return {
      score,
      factors,
      explanation: factors.length ? factors[0].explanation : "correspondance indexée",
   };
}

function compareRankedDictionaryEntries(left, right) {
   return (
      right.rank.score - left.rank.score ||
      Number(!!right.entry.personalCard) - Number(!!left.entry.personalCard) ||
      entryHanziLength(left.entry) - entryHanziLength(right.entry) ||
      Number(entryDefinitions(right.entry, "fr").length > 0) -
         Number(entryDefinitions(left.entry, "fr").length > 0) ||
      String(left.entry.simplified || left.entry.hz).localeCompare(
         String(right.entry.simplified || right.entry.hz),
         "zh",
      ) ||
      String(left.entry.id || left.entry.cardId || "").localeCompare(
         String(right.entry.id || right.entry.cardId || ""),
      )
   );
}

if (typeof module !== "undefined" && module.exports) {
   module.exports = {
      SEARCH_WEIGHTS,
      compareRankedDictionaryEntries,
      rankDictionaryEntry,
   };
}

"use strict";

const SEARCH_RESULT_LIMIT = 96;
const SEARCH_PREFIX_KEY_LIMIT = 160;
let dictionarySearchEpoch = 0;
let dictionaryPersonalRevision = 0;
const dictionarySearchCache = new Map();
const dictionaryPrefixCache = new WeakMap();
const DICTIONARY_SEARCH_CACHE_LIMIT = 24;

class StaleDictionarySearchError extends Error {
   constructor() {
      super("Recherche remplacée par une requête plus récente.");
      this.name = "StaleDictionarySearchError";
   }
}

function invalidateDictIndex() {
   dictionaryPersonalRevision++;
   dictionarySearchCache.clear();
}

function clearDictionarySearchCache() {
   dictionarySearchCache.clear();
}

function cancelDictionarySearches() {
   dictionarySearchEpoch++;
   if (typeof rejectPendingDictionaryWorkerSearches === "function")
      rejectPendingDictionaryWorkerSearches();
}

function ensureCurrentSearch(epoch) {
   if (epoch !== dictionarySearchEpoch) throw new StaleDictionarySearchError();
}

function postingIntersection(postings) {
   if (!postings.length) return [];
   if (postings.length === 1) return postings[0].slice();
   const remaining = postings.slice(1).map((values) => new Set(values));
   return postings[0].filter((reference) =>
      remaining.every((values) => values.has(reference)),
   );
}

function prefixPostings(index, prefix, maximumKeys) {
   let cachedByPrefix = dictionaryPrefixCache.get(index);
   if (!cachedByPrefix) {
      cachedByPrefix = new Map();
      dictionaryPrefixCache.set(index, cachedByPrefix);
   }
   const cacheKey = prefix + "§" + (maximumKeys || SEARCH_PREFIX_KEY_LIMIT);
   if (cachedByPrefix.has(cacheKey)) return cachedByPrefix.get(cacheKey);
   const output = [];
   let matchedKeys = 0;
   for (const key of Object.keys(index)) {
      if (!key.startsWith(prefix) || key === prefix) continue;
      output.push(index[key]);
      matchedKeys++;
      if (matchedKeys >= (maximumKeys || SEARCH_PREFIX_KEY_LIMIT)) break;
   }
   cachedByPrefix.set(cacheKey, output);
   return output;
}

function dictionarySearchCacheKey(query, settings) {
   return JSON.stringify([
      dictionaryPersonalRevision,
      query.type,
      query.hanzi || "",
      query.marked || "",
      query.numbered || "",
      query.plain || "",
      query.translation || "",
      settings.candidateLimit || SEARCH_RESULT_LIMIT,
      settings.limit || SEARCH_RESULT_LIMIT,
   ]);
}

function rememberDictionarySearch(key, response) {
   dictionarySearchCache.delete(key);
   dictionarySearchCache.set(key, response);
   while (dictionarySearchCache.size > DICTIONARY_SEARCH_CACHE_LIMIT) {
      const oldest = dictionarySearchCache.keys().next().value;
      dictionarySearchCache.delete(oldest);
   }
}

function addCandidateReferences(target, references, matchKind, maximum) {
   for (const reference of references || []) {
      if (!target.has(reference)) target.set(reference, matchKind);
      if (target.size >= maximum) return;
   }
}

function personalCardAsDictionaryEntry(card) {
   const marked = normalizePinyinMarked(card.py || "");
   return {
      id: "personal-" + card.id,
      simplified: card.hz,
      traditional: card.hz,
      entryType: Array.from(card.hz).length === 1 ? "character" : "word",
      pinyin: marked
         ? [
              {
                 marked,
                 numbered: normalizePinyinNumbered(marked),
                 plain: normalizePinyinPlain(marked),
              },
           ]
         : [],
      definitionsFr: card.fr ? [card.fr] : [],
      definitionsEn: [],
      sources: [],
      sourceRefs: [],
      hskLegacy: [],
      hsk30: [],
      frequencyRank: null,
      characters: Array.from(card.hz).filter((character) => HAN_PATTERN.test(character)),
      searchAliases: [],
      personalCard: card,
      cardId: card.id,
      src: "card",
   };
}

function personalEntryMatches(entry, query) {
   if (query.type.startsWith("hanzi"))
      return entry.simplified.includes(query.hanzi);
   if (query.type.startsWith("pinyin")) {
      return entry.pinyin.some((variant) => {
         if (query.type === "pinyin-marked") return variant.marked === query.marked;
         if (query.type === "pinyin-numbered") return variant.numbered === query.numbered;
         return variant.plain === query.plain || variant.plain.startsWith(query.plain);
      });
   }
   if (query.type === "translation") {
      const words = normalizeTranslation(entry.definitionsFr.join(" ")).split(" ");
      return query.tokens.every((token) =>
         words.some((word) => word === token || word.startsWith(token)),
      );
   }
   return false;
}

function dictionaryEntryIdentity(entry) {
   const pronunciation = entry.pinyin[0]
      ? normalizePinyinNumbered(entry.pinyin[0].numbered || entry.pinyin[0].marked)
      : "";
   return entry.simplified + "§" + pronunciation;
}

async function collectIndexedCandidates(query, epoch, onStatus, maximumCandidates) {
   const candidates = new Map();
   const maximum = maximumCandidates || SEARCH_RESULT_LIMIT;
   let englishFallback = false;
   let sequence = false;
   const status = (message) => onStatus && onStatus(message);

   if (query.type.startsWith("hanzi")) {
      status("Chargement de l’index des caractères…");
      const index = await loadDictionaryIndex("exactHanzi", false);
      ensureCurrentSearch(epoch);
      const exact = index[query.hanzi] || [];
      addCandidateReferences(candidates, exact, "exact-hanzi", maximum);

      if (query.characters.length > 1 && exact.length === 0) {
         sequence = true;
         query.characters.forEach((character) =>
            addCandidateReferences(candidates, index[character], "sequence-character", maximum),
         );
      } else {
         const prefixGroups = prefixPostings(index, query.hanzi, SEARCH_PREFIX_KEY_LIMIT);
         prefixGroups.forEach((references) =>
            addCandidateReferences(candidates, references, "hanzi-prefix", maximum),
         );
         if (candidates.size < maximum && query.hanzi.length <= 3) {
            for (const key of Object.keys(index)) {
               if (key === query.hanzi || key.startsWith(query.hanzi) || !key.includes(query.hanzi)) continue;
               addCandidateReferences(candidates, index[key], "hanzi-contains", maximum);
               if (candidates.size >= maximum) break;
            }
         }
      }
   } else if (query.type.startsWith("pinyin")) {
      status("Chargement de l’index pinyin…");
      const index = await loadDictionaryIndex("pinyin", false);
      ensureCurrentSearch(epoch);
      const strictKey =
         query.type === "pinyin-marked"
            ? query.marked
            : query.type === "pinyin-numbered"
              ? query.numbered
              : query.plain;
      addCandidateReferences(candidates, index[strictKey], "exact-pinyin", maximum);
      prefixPostings(index, strictKey, SEARCH_PREFIX_KEY_LIMIT).forEach((references) =>
         addCandidateReferences(candidates, references, "pinyin-prefix", maximum),
      );
      if (query.type !== "pinyin-plain" && candidates.size < maximum) {
         addCandidateReferences(candidates, index[query.plain], "toneless-fallback", maximum);
      }
   } else if (query.type === "translation") {
      status("Chargement de l’index français…");
      const french = await loadDictionaryIndex("french", false);
      ensureCurrentSearch(epoch);
      const exactGroups = query.tokens.map((token) => french[token] || []);
      const exact = postingIntersection(exactGroups);
      addCandidateReferences(candidates, exact, "exact-french", maximum);
      if (candidates.size < maximum) {
         const perToken = query.tokens.map((token) => {
            const references = new Set(french[token] || []);
            prefixPostings(french, token, 80).forEach((posting) =>
               posting.forEach((reference) => references.add(reference)),
            );
            return Array.from(references);
         });
         addCandidateReferences(
            candidates,
            postingIntersection(perToken),
            "french-prefix",
            maximum,
         );
      }
      if (candidates.size === 0) {
         status("Aucun résultat français · essai du repli anglais…");
         const english = await loadDictionaryIndex("english", false);
         ensureCurrentSearch(epoch);
         const groups = query.tokens.map((token) => english[token] || []);
         addCandidateReferences(
            candidates,
            postingIntersection(groups),
            "english-fallback",
            maximum,
         );
         englishFallback = candidates.size > 0;
      }
   }

   return { candidates, englishFallback, sequence };
}

async function searchDictionaryLocally(rawQuery, options) {
   const settings = options || {};
   const started = performance.now();
   const epoch = ++dictionarySearchEpoch;
   const query = classifySearchQuery(rawQuery);
   if (!query.valid) {
      return {
         query,
         results: [],
         totalCandidates: 0,
         limited: false,
         englishFallback: false,
         sequence: false,
         durationMs: performance.now() - started,
      };
   }

   const cacheKey = dictionarySearchCacheKey(query, settings);
   if (dictionarySearchCache.has(cacheKey)) {
      const cached = dictionarySearchCache.get(cacheKey);
      dictionarySearchCache.delete(cacheKey);
      dictionarySearchCache.set(cacheKey, cached);
      return {
         ...cached,
         cached: true,
         durationMs: performance.now() - started,
      };
   }

   const revision = dictionaryPersonalRevision;
   const candidateLimit = Math.max(1, Math.min(settings.candidateLimit || SEARCH_RESULT_LIMIT, SEARCH_RESULT_LIMIT));
   const indexed = await collectIndexedCandidates(query, epoch, settings.onStatus, candidateLimit);
   ensureCurrentSearch(epoch);
   const references = Array.from(indexed.candidates.keys()).slice(0, candidateLimit);
   if (settings.onStatus) settings.onStatus("Chargement des meilleures fiches…");
   const dictionaryEntries = await loadDictionaryPreviewsByReferences(references);
   ensureCurrentSearch(epoch);

   const personalEntries = db.cards
      .map(personalCardAsDictionaryEntry)
      .filter((entry) => personalEntryMatches(entry, query));
   const personalByIdentity = new Map(
      personalEntries.map((entry) => [dictionaryEntryIdentity(entry), entry.personalCard]),
   );
   dictionaryEntries.forEach((entry) => {
      const card = personalByIdentity.get(dictionaryEntryIdentity(entry));
      if (card) entry.personalCard = card;
   });

   const dictionaryIdentities = new Set(dictionaryEntries.map(dictionaryEntryIdentity));
   const merged = [
      ...dictionaryEntries,
      ...personalEntries.filter((entry) => !dictionaryIdentities.has(dictionaryEntryIdentity(entry))),
   ];
   const ranked = merged
      .map((entry) => ({
         entry,
         rank: rankDictionaryEntry(entry, query, {
            englishFallback: indexed.englishFallback,
            indexedMatch: indexed.candidates.get(entry.__reference),
         }),
      }))
      .sort(compareRankedDictionaryEntries);

   ensureCurrentSearch(epoch);
   const response = {
      query: indexed.sequence ? { ...query, type: "hanzi-sequence" } : query,
      results: ranked.slice(0, settings.limit || SEARCH_RESULT_LIMIT),
      totalCandidates: indexed.candidates.size + personalEntries.length,
      limited: indexed.candidates.size >= candidateLimit,
      englishFallback: indexed.englishFallback,
      sequence: indexed.sequence,
      personalRevision: revision,
      durationMs: performance.now() - started,
   };
   rememberDictionarySearch(cacheKey, response);
   return response;
}

let dictionarySearchWorker = null;
let dictionarySearchWorkerSequence = 0;
const dictionarySearchWorkerRequests = new Map();

function canUseDictionarySearchWorker() {
   if (typeof window === "undefined" || typeof Worker === "undefined") return false;
   const path = new URL(document.baseURI).pathname;
   return !/\/dist\/[^/]+\.html$/u.test(path) && location.protocol !== "file:";
}

function rejectPendingDictionaryWorkerSearches() {
   dictionarySearchWorkerRequests.forEach(({ reject }) =>
      reject(new StaleDictionarySearchError()),
   );
   dictionarySearchWorkerRequests.clear();
}

function getDictionarySearchWorker() {
   if (dictionarySearchWorker) return dictionarySearchWorker;
   const url = new URL("js/search/dictionary-search-worker.js", document.baseURI);
   dictionarySearchWorker = new Worker(url.href);
   dictionarySearchWorker.addEventListener("message", (event) => {
      const message = event.data || {};
      const request = dictionarySearchWorkerRequests.get(message.id);
      if (!request) return;
      if (message.type === "status") {
         if (request.onStatus) request.onStatus(message.message);
         return;
      }
      dictionarySearchWorkerRequests.delete(message.id);
      if (message.type === "result") request.resolve(message.response);
      else if (message.stale) request.reject(new StaleDictionarySearchError());
      else request.reject(new Error(message.error || "Recherche dictionnaire impossible."));
   });
   dictionarySearchWorker.addEventListener("error", (event) => {
      const error = new Error(event.message || "Le moteur de recherche isolé a échoué.");
      dictionarySearchWorkerRequests.forEach(({ reject }) => reject(error));
      dictionarySearchWorkerRequests.clear();
      dictionarySearchWorker.terminate();
      dictionarySearchWorker = null;
   });
   return dictionarySearchWorker;
}

function resetDictionarySearchWorker() {
   rejectPendingDictionaryWorkerSearches();
   if (!dictionarySearchWorker) return;
   dictionarySearchWorker.postMessage({ type: "reset" });
}

function searchDictionary(rawQuery, options) {
   if (!canUseDictionarySearchWorker()) return searchDictionaryLocally(rawQuery, options);
   rejectPendingDictionaryWorkerSearches();
   const settings = options || {};
   const id = ++dictionarySearchWorkerSequence;
   const worker = getDictionarySearchWorker();
   return new Promise((resolve, reject) => {
      dictionarySearchWorkerRequests.set(id, {
         resolve,
         reject,
         onStatus: settings.onStatus,
      });
      worker.postMessage({
         type: "search",
         id,
         rawQuery,
         settings: {
            candidateLimit: settings.candidateLimit,
            limit: settings.limit,
         },
         personalCards: Array.isArray(db.cards) ? db.cards : [],
         personalRevision: dictionaryPersonalRevision,
      });
   });
}

async function findDictionaryEntryByHanzi(hanzi) {
   const response = await searchDictionary(hanzi, { candidateLimit: 12, limit: 12 });
   return response.results[0] ? response.results[0].entry : null;
}

   pendingDetailId: null,
};

function readRecentSearches() {
   try {
      const value = JSON.parse(localStorage.getItem(SEARCH_RECENT_KEY) || "[]");
      return Array.isArray(value)
         ? value.filter((item) => typeof item === "string" && item.trim()).slice(0, 8)
         : [];
   } catch (error) {
      return [];
   }
}

function rememberRecentSearch(query) {
   const visible = normalizeVisibleWhitespace(query);
   if (!visible) return;
   const recent = readRecentSearches().filter(
      (item) => normalizeVisibleWhitespace(item).toLowerCase() !== visible.toLowerCase(),
   );
   recent.unshift(visible);
   try {
      localStorage.setItem(SEARCH_RECENT_KEY, JSON.stringify(recent.slice(0, 8)));
   } catch (error) {
      /* Le dictionnaire reste utilisable si le stockage privé est indisponible. */
   }
}

function currentUnit() {
   const pool = db.cards.filter((card) => !card.acquired && card.unit != null);
   const fresh = pool.filter((card) => card.due == null).sort(unitSort);
   if (fresh.length) return fresh[0].unit;
   const any = pool.sort(unitSort);
   return any.length ? any[0].unit : null;
}

function continuingCards() {
   const unit = currentUnit();
   const candidates = unit == null ? db.cards : db.cards.filter((card) => card.unit === unit);
   return candidates.slice().sort(unitSort).slice(0, 6);
}

function renderSearchSuggestions(response) {
   const target = $("dsearch-suggestions");
   const input = $("dq");
   if (!target) return;
   const items = response && response.results ? response.results.slice(0, 6) : [];
   srch.suggestionSearch = response;
   srch.suggestionIndex = -1;
   if (!items.length) {
      target.hidden = true;
      target.innerHTML = "";
      if (input) input.setAttribute("aria-expanded", "false");
      return;
   }
   target.innerHTML = items
      .map((item, index) => {
         const definition = dictionaryResultDefinition(item.entry);
         return (
            '<button id="dsearch-option-' + index + '" role="option" aria-selected="false" data-suggestion-index="' + index + '"><b>' +
            esc(item.entry.simplified) + '</b><span>' + colorPinyin(dictionaryEntryPinyinText(item.entry)) +
            '</span><small>' + (item.entry.entryType === "character" ? "caractère" : "mot") +

         );
      })

   if (input) input.setAttribute("aria-expanded", "true");

      button.onclick = () => {
