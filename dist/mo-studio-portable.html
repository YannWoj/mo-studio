      srch.q = "";
      srch.mode = "landing";
      srch.search = null;
      $("dq-clear").hidden = true;
      closeSearchSuggestions();
      renderDictionaryResults();
      input.focus();
   };
   if (searchOutsideHandler) document.removeEventListener("pointerdown", searchOutsideHandler);
   searchOutsideHandler = (event) => {
      if (!event.target.closest(".dictionary-search-input")) closeSearchSuggestions();
   };
   document.addEventListener("pointerdown", searchOutsideHandler);

   if (["results", "detail"].includes(srch.mode) && srch.search) renderDictionaryResults();
   else if (["results", "detail"].includes(srch.mode) && srch.q)
      launchDictionarySearch(srch.q, { fromHistory: true, scrollY: srch.scrollY });
   else {
      srch.mode = "landing";
      srch.search = null;
      renderDictionaryResults();
   }
}

"use strict";

const STROKE_DATA_VERSION = "2.0.1";
const STROKE_DATA_CACHE_NAME = "mo-studio-strokes-v1";
const STROKE_DATA_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable ? "../data/generated/hanzi-writer/2.0.1/" : "data/generated/hanzi-writer/2.0.1/",
      document.baseURI,
   ).href;
})();
const strokeCharacterCache = new Map();
const strokeCharacterPending = new Map();

class StrokeCharacterDataError extends Error {
   constructor(character, message, cause) {
      super(`${character} · ${message}`);
      this.name = "StrokeCharacterDataError";
      this.character = character;
      this.cause = cause;
   }
}

function validateStrokeCharacter(character) {
   const value = String(character || "").normalize("NFC");
   if (Array.from(value).length !== 1 || !/^\p{Script=Han}$/u.test(value)) {
      throw new StrokeCharacterDataError(value || "?", "caractère Han invalide");
   }
   return value;
}

function normalizeStrokeCharacterData(character, raw) {
   if (!raw || !Array.isArray(raw.strokes) || !raw.strokes.length) {
      throw new StrokeCharacterDataError(character, "aucun tracé réel disponible");
   }
   if (raw.strokes.some((path) => typeof path !== "string" || !path.trim())) {
      throw new StrokeCharacterDataError(character, "tracé SVG invalide");
   }
   const medians = Array.isArray(raw.medians) ? raw.medians : [];
   if (medians.length && medians.length !== raw.strokes.length) {
      throw new StrokeCharacterDataError(character, "nombre de médianes incohérent");
   }
   return Object.freeze({
      character,
      strokes: Object.freeze(raw.strokes.slice()),
      medians: Object.freeze(medians.map((median) => Object.freeze(median.slice()))),
      strokeCount: raw.strokes.length,
      radicalStrokeIndexes: Object.freeze(
         Array.isArray(raw.radStrokes) ? raw.radStrokes.slice() : [],
      ),
      sourcePackage: "hanzi-writer-data",
      sourceVersion: STROKE_DATA_VERSION,
   });
}

function strokeCharacterDataUrl(character) {
   return new URL(`${encodeURIComponent(character)}.json`, STROKE_DATA_ROOT).href;
}

async function fetchStrokeCharacterData(character, reload) {
   const url = strokeCharacterDataUrl(character);
   const cache = "caches" in globalThis
      ? await caches.open(STROKE_DATA_CACHE_NAME)
      : null;
   let response = !reload && cache ? await cache.match(url) : null;
   let fromCache = !!response;
   if (!response) {
      response = await fetch(url, { cache: reload ? "reload" : "default" });
      fromCache = false;
   }
   if (!response.ok) {
      throw new StrokeCharacterDataError(
         character,
         response.status === 404 ? "données de traits indisponibles" : `HTTP ${response.status}`,
      );
   }
   let raw;
   try {
      raw = await response.clone().json();
   } catch (error) {
      if (fromCache && cache) {
         await cache.delete(url);
         return fetchStrokeCharacterData(character, true);
      }
      throw new StrokeCharacterDataError(character, "JSON de traits corrompu", error);
   }
   let normalized;
   try {
      normalized = normalizeStrokeCharacterData(character, raw);
   } catch (error) {
      if (fromCache && cache) {
         await cache.delete(url);
         return fetchStrokeCharacterData(character, true);
      }
      throw error;
   }
   if (cache && !fromCache) await cache.put(url, response.clone());
   return normalized;
}

function loadStrokeCharacterData(character, options) {
   const value = validateStrokeCharacter(character);
   const reload = !!(options && options.reload);
   if (!reload && strokeCharacterCache.has(value)) {
      return Promise.resolve(strokeCharacterCache.get(value));
   }
   if (!reload && strokeCharacterPending.has(value)) {
      return strokeCharacterPending.get(value);
   }
   const request = fetchStrokeCharacterData(value, reload)
      .then((data) => {
         strokeCharacterCache.set(value, data);
         return data;
      })
      .catch((error) => {
         if (error instanceof StrokeCharacterDataError) throw error;
         throw new StrokeCharacterDataError(value, "chargement impossible", error);
      })
      .finally(() => strokeCharacterPending.delete(value));
   strokeCharacterPending.set(value, request);
   return request;
}

function preloadStrokeCharacterData(character) {
   return loadStrokeCharacterData(character).catch(() => null);
}

async function invalidateStrokeCharacterData(character) {
   const cache = "caches" in globalThis
      ? await caches.open(STROKE_DATA_CACHE_NAME)
      : null;
   if (character) {
      const value = validateStrokeCharacter(character);
      strokeCharacterCache.delete(value);
      strokeCharacterPending.delete(value);
      if (cache) await cache.delete(strokeCharacterDataUrl(value));
      return;
   }
   strokeCharacterCache.clear();
   strokeCharacterPending.clear();
   if ("caches" in globalThis) await caches.delete(STROKE_DATA_CACHE_NAME);
}

"use strict";

const STROKE_SVG_VIEWBOX = "0 0 1024 1024";
let strokeGalleryObserver = null;
let strokeFocusState = null;

function strokeGallerySettings() {
   if (!db.settings.strokeGallery || typeof db.settings.strokeGallery !== "object") {
      db.settings.strokeGallery = {
         showFuture: true,
         showGrid: true,
         showGhost: false,
      };
   } else {
      if (typeof db.settings.strokeGallery.showFuture !== "boolean")
         db.settings.strokeGallery.showFuture = true;
      if (typeof db.settings.strokeGallery.showGrid !== "boolean")
         db.settings.strokeGallery.showGrid = true;
      if (typeof db.settings.strokeGallery.showGhost !== "boolean")
         db.settings.strokeGallery.showGhost = false;
   }
   return db.settings.strokeGallery;
}

function strokeGridSvg() {
   return (
      '<g class="stroke-grid-lines" aria-hidden="true">' +
      '<rect class="stroke-grid-border" x="16" y="16" width="992" height="992" rx="24"></rect>' +
      '<path class="stroke-grid-center" d="M16 512H1008 M512 16V1008"></path>' +
      '<path class="stroke-grid-diagonal" d="M16 16L1008 1008 M1008 16L16 1008"></path>' +
      "</g>"
   );
}

function strokePathsSvg(data, activeIndex, settings) {
   const parts = [];
   if (settings.showGhost) {
      data.strokes.forEach((path) => {
         parts.push('<path class="stroke-path stroke-ghost" d="' + esc(path) + '"></path>');
      });
   }
   data.strokes.forEach((path, index) => {
      if (index < activeIndex) {
         parts.push('<path class="stroke-path stroke-complete" data-path-index="' + index + '" d="' + esc(path) + '"></path>');
      } else if (index === activeIndex) {
         parts.push('<path class="stroke-path stroke-current" data-path-index="' + index + '" d="' + esc(path) + '"></path>');
      } else if (settings.showFuture) {
         parts.push('<path class="stroke-path stroke-future" data-path-index="' + index + '" d="' + esc(path) + '"></path>');
      }
   });
   return '<g transform="translate(0 900) scale(1 -1)">' + parts.join("") + "</g>";
}

function strokePanelSvg(data, activeIndex, settings, labelledBy) {
   return (
      '<svg class="stroke-panel-svg" viewBox="' + STROKE_SVG_VIEWBOX + '" role="img" aria-labelledby="' +
      esc(labelledBy) + '">' +
      (settings.showGrid ? strokeGridSvg() : "") +
      strokePathsSvg(data, activeIndex, settings) +
      "</svg>"
   );
}

function materializeStrokePanel(panel, data, settings) {
   if (!panel || panel.dataset.rendered === "true") return;
   const index = Number(panel.dataset.strokeIndex);
   const labelId = panel.querySelector(".stroke-panel-label").id;
   panel.querySelector(".stroke-panel-visual").innerHTML = strokePanelSvg(
      data,
      index,
      settings,
      labelId,
   );
   panel.dataset.rendered = "true";
}

function closeStrokeFocus() {
   if (!strokeFocusState) return;
   const { root, opener, sheetWasInert } = strokeFocusState;
   strokeFocusState = null;
   root.remove();
   $("sheet").inert = sheetWasInert;
   document.body.style.overflow = sheetOpen() || seq ? "hidden" : "";
   if (opener && opener.isConnected) opener.focus();
}

function updateStrokeFocus(index) {
   if (!strokeFocusState) return;
   const state = strokeFocusState;
   state.index = Math.max(0, Math.min(index, state.data.strokeCount - 1));
   const number = state.index + 1;
   const label = `Trait ${number} sur ${state.data.strokeCount}`;
   state.root.querySelector(".stroke-focus-title").textContent =
      `${state.data.character} · ${label}`;
   state.root.querySelector(".stroke-focus-visual").innerHTML = strokePanelSvg(
      state.data,
      state.index,
      state.settings,
      "stroke-focus-title",
   );
   state.root.querySelector(".stroke-focus-position").textContent =
      `${number} / ${state.data.strokeCount}`;
   state.root.querySelector(".stroke-focus-prev").disabled = state.index === 0;
   state.root.querySelector(".stroke-focus-next").disabled =
      state.index === state.data.strokeCount - 1;
}

function openStrokeFocus(data, index, settings, opener) {
   closeStrokeFocus();
   const sheetWasInert = $("sheet").inert;
   $("sheet").inert = true;
   const root = document.createElement("div");
   root.className = "stroke-focus-backdrop";
   root.innerHTML =
      '<section class="stroke-focus" role="dialog" aria-modal="true" aria-labelledby="stroke-focus-title">' +
      '<header><h3 class="stroke-focus-title" id="stroke-focus-title"></h3>' +
      '<button class="stroke-focus-close" type="button" aria-label="Fermer la vue agrandie">×</button></header>' +
      '<div class="stroke-focus-visual"></div>' +
      '<footer><button class="btn ghost stroke-focus-prev" type="button">← Trait précédent</button>' +
      '<span class="stroke-focus-position" aria-live="polite"></span>' +
      '<button class="btn primary stroke-focus-next" type="button">Trait suivant →</button></footer></section>';
   document.body.appendChild(root);
   document.body.style.overflow = "hidden";
   strokeFocusState = { root, data, index, settings, opener, sheetWasInert };
   root.querySelector(".stroke-focus-close").onclick = closeStrokeFocus;
   root.querySelector(".stroke-focus-prev").onclick = () =>
      updateStrokeFocus(strokeFocusState.index - 1);
   root.querySelector(".stroke-focus-next").onclick = () =>
      updateStrokeFocus(strokeFocusState.index + 1);
   root.onclick = (event) => {
      if (event.target === root) closeStrokeFocus();
   };
   updateStrokeFocus(index);
   root.querySelector(".stroke-focus-close").focus();
}

function updateStrokeGalleryPosition(gallery, indicator) {
   if (!gallery || !indicator) return;
   const center = gallery.scrollLeft + gallery.clientWidth / 2;
   let closest = 0;
   let distance = Infinity;
   gallery.querySelectorAll(".stroke-panel").forEach((panel, index) => {
      const panelCenter = panel.offsetLeft + panel.offsetWidth / 2;
      const nextDistance = Math.abs(panelCenter - center);
      if (nextDistance < distance) {
         distance = nextDistance;
         closest = index;
      }
   });
   indicator.textContent = `${closest + 1} / ${gallery.children.length}`;
}

function renderStrokeGallery(data) {
   const gallery = $("dd-gallery");
   const status = $("dd-gallery-status");
   if (!gallery || !status) return;
   if (strokeGalleryObserver) strokeGalleryObserver.disconnect();
   strokeGalleryObserver = null;
   const settings = strokeGallerySettings();
   status.textContent = `${data.character} · ${data.strokeCount} traits réels`;
   gallery.innerHTML = Array.from({ length: data.strokeCount }, (_, index) => {
      const number = index + 1;
      const labelId = `stroke-panel-label-${number}`;
      return (
         '<button class="stroke-panel" type="button" data-stroke-index="' + index +
         '" data-rendered="false" aria-label="Agrandir : Trait ' + number + " sur " + data.strokeCount + '">' +
         '<span class="stroke-panel-number" aria-hidden="true">' + number + "</span>" +
         '<span class="stroke-panel-visual" aria-hidden="true"></span>' +
         '<span class="stroke-panel-label" id="' + labelId + '">Trait ' + number + " sur " + data.strokeCount + "</span>" +
         "</button>"
      );
   }).join("");

   const panels = Array.from(gallery.querySelectorAll(".stroke-panel"));
   panels.forEach((panel, index) => {
      panel.onclick = () => openStrokeFocus(data, index, settings, panel);
      if (index < 8 || !("IntersectionObserver" in window)) {
         materializeStrokePanel(panel, data, settings);
      }
   });
   if ("IntersectionObserver" in window && panels.length > 8) {
      strokeGalleryObserver = new IntersectionObserver(
         (entries) => entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            materializeStrokePanel(entry.target, data, settings);
            strokeGalleryObserver.unobserve(entry.target);
         }),
         { root: gallery, rootMargin: "240px" },
      );
      panels.slice(8).forEach((panel) => strokeGalleryObserver.observe(panel));
   }
   const indicator = $("dd-gallery-position");
   gallery.onscroll = () => updateStrokeGalleryPosition(gallery, indicator);
   updateStrokeGalleryPosition(gallery, indicator);
}

function renderStrokeGalleryError(character, error) {
   const gallery = $("dd-gallery");
   const status = $("dd-gallery-status");
   if (status) status.textContent = `${character} · données de traits indisponibles`;
   if (gallery) {
      gallery.innerHTML =
         '<div class="stroke-gallery-error" role="alert">Aucune galerie inventée : ' +
         esc(error && error.message ? error.message : "données réelles introuvables") +
         ".</div>";
   }
}

document.addEventListener(
   "keydown",
   (event) => {
      if (!strokeFocusState) return;
      if (event.key === "Escape") {
         event.preventDefault();
         event.stopImmediatePropagation();
         closeStrokeFocus();
      } else if (event.key === "ArrowLeft") {
         event.preventDefault();
         event.stopImmediatePropagation();
         updateStrokeFocus(strokeFocusState.index - 1);
      } else if (event.key === "ArrowRight") {
         event.preventDefault();
         event.stopImmediatePropagation();
         updateStrokeFocus(strokeFocusState.index + 1);
      }
   },
   true,
);

"use strict";

let ddWriter = null;
let ddWriterTarget = null;
let ddChar = null;
let ddCharacterData = null;
let ddStrokeTab = "animation";
let ddWriterToken = 0;
let ddCharacterLoadToken = 0;
let ddWorkspaceCharacters = [];
let ddWriterDocumentListeners = [];
let ddAutoplaySelectionKey = null;
let ddAutoplayPending = false;
let ddAutoplayLoadToken = 0;

function resetStrokeAutoplaySelection() {
   ddAutoplaySelectionKey = null;
   ddAutoplayPending = false;
   ddAutoplayLoadToken = 0;
}

function removeDDWriterDocumentListeners() {
   ddWriterDocumentListeners.forEach(({ type, listener, options }) =>
      document.removeEventListener(type, listener, options),
   );
   ddWriterDocumentListeners = [];
}

function createManagedDDWriter(target, character, options) {
   const captured = [];
   const originalAddEventListener = document.addEventListener;
   document.addEventListener = function (type, listener, listenerOptions) {
      if (type === "mouseup" || type === "touchend") {
         captured.push({ type, listener, options: listenerOptions });
      }
      return originalAddEventListener.call(this, type, listener, listenerOptions);
   };
   try {
      const writer = HanziWriter.create(target, character, options);
      ddWriterDocumentListeners = captured;
      return writer;
   } catch (error) {
      captured.forEach(({ type, listener, options: listenerOptions }) =>
         document.removeEventListener(type, listener, listenerOptions),
      );
      throw error;
   } finally {
      document.addEventListener = originalAddEventListener;
   }
}

function normalizedStrokeSpeed(value) {
   const speed = Number(value) || 1;
   return Math.max(0.25, Math.min(2, speed));
}

function speedOpts(speed) {
   const value = normalizedStrokeSpeed(speed);
   return {
      strokeAnimationSpeed: value,
      delayBetweenStrokes: Math.max(60, Math.round(200 / value)),
   };
}

function strokeBoxHtml() {
   const speed = normalizedStrokeSpeed(db.settings.strokeSpeed);
   const gallery = strokeGallerySettings();
   const active = ddStrokeTab;
   return (
      '<section class="stroke-workspace" aria-label="Ordre des traits">' +
      '<div class="stroke-tabs" role="tablist" aria-label="Mode d’apprentissage des traits">' +
      [
         ["animation", "Animation"],
         ["steps", "Étapes"],
         ["practice", "S’entraîner"],
      ].map(([id, label]) =>
         '<button type="button" role="tab" id="stroke-tab-' + id + '" data-stroke-tab="' + id +
         '" aria-controls="stroke-panel-' + id + '" aria-selected="' + String(active === id) +
         '" tabindex="' + (active === id ? "0" : "-1") + '">' + label + "</button>",
      ).join("") +
      "</div>" +
      '<section class="stroke-tab-panel" role="tabpanel" id="stroke-panel-animation" aria-labelledby="stroke-tab-animation"' +
      (active === "animation" ? "" : " hidden") + '>' +
      '<div class="mizi"><div id="dd-target"></div></div>' +
      '<div class="w-note" id="dd-note" role="status" aria-live="polite"></div>' +
      '<label class="f-lab" for="dd-speed">Vitesse de l’animation · <span class="speed-lab" id="dd-speed-lab">' +
      speed.toFixed(2) + '×</span></label>' +
      '<input type="range" id="dd-speed" min="0.25" max="2" step="0.05" value="' + speed + '" aria-label="Vitesse de l’animation">' +
      '<div class="sh-btns"><button class="btn primary" id="dd-anim" type="button">Rejouer</button></div>' +
      "</section>" +
      '<section class="stroke-tab-panel" role="tabpanel" id="stroke-panel-steps" aria-labelledby="stroke-tab-steps"' +
      (active === "steps" ? "" : " hidden") + '>' +
      '<div class="stroke-gallery-toolbar"><span id="dd-gallery-status" role="status" aria-live="polite">Chargement des traits réels…</span>' +
      '<div class="stroke-gallery-settings">' +
      '<label><input type="checkbox" id="dd-show-future"' + (gallery.showFuture ? " checked" : "") + '> Afficher les traits futurs</label>' +
      '<label><input type="checkbox" id="dd-show-grid"' + (gallery.showGrid ? " checked" : "") + '> Afficher la grille</label>' +
      '<label><input type="checkbox" id="dd-show-ghost"' + (gallery.showGhost ? " checked" : "") + '> Afficher le caractère fantôme</label>' +
      "</div></div>" +
      '<div class="stroke-gallery" id="dd-gallery" aria-label="Étapes cumulatives des traits"></div>' +
      '<div class="stroke-gallery-position" id="dd-gallery-position" aria-live="polite"></div>' +
      "</section>" +
      '<section class="stroke-tab-panel" role="tabpanel" id="stroke-panel-practice" aria-labelledby="stroke-tab-practice"' +
      (active === "practice" ? "" : " hidden") + '>' +
      '<div class="mizi"><div id="dd-practice-target"></div><canvas id="dd-canvas" hidden></canvas></div>' +
      '<div class="w-note" id="dd-practice-note" role="status" aria-live="polite">Trace le caractère dans le carré.</div>' +
      '<div class="sh-btns"><button class="btn primary" id="dd-quiz" type="button">Commencer</button>' +
      '<button class="btn ghost" id="dd-clear" type="button">Effacer / recommencer</button></div>' +
      "</section></section>"
   );
}

function destroyDDWriter() {
   ddWriterToken++;
   if (ddWriter && typeof ddWriter.cancelAnimation === "function") {
      try { ddWriter.cancelAnimation(); } catch (error) {}
   }
   if (ddWriter && typeof ddWriter.cancelQuiz === "function") {
      try { ddWriter.cancelQuiz(); } catch (error) {}
   }
   if (ddWriterTarget) ddWriterTarget.innerHTML = "";
   removeDDWriterDocumentListeners();
   ddWriter = null;
   ddWriterTarget = null;
}

function destroyStrokeWorkspace() {
   ddCharacterLoadToken++;
   destroyDDWriter();
   ddChar = null;
   ddCharacterData = null;
   ddWorkspaceCharacters = [];
   if (strokeGalleryObserver) strokeGalleryObserver.disconnect();
   strokeGalleryObserver = null;
   closeStrokeFocus();
}

function setStrokeWorkspaceMessage(id, message) {
   const target = $(id);
   if (target) target.textContent = message;
}

function setupFreehandPractice(message) {
   destroyDDWriter();
   const canvas = $("dd-canvas");
   const target = $("dd-practice-target");
   if (!canvas || !target) return;
   target.hidden = true;
   canvas.hidden = false;
   const size = Math.min(300, canvas.parentElement.clientWidth || 300);
   canvas.width = size;
   canvas.height = size;
   paintPad(canvas);
   setStrokeWorkspaceMessage(
      "dd-practice-note",
      message || "Données réelles indisponibles · entraînement libre sans modèle inventé.",
   );
}

function createDDWriter(mode) {
   if (!ddChar || !ddCharacterData) return;
   destroyDDWriter();
   const target = mode === "practice" ? $("dd-practice-target") : $("dd-target");
   const canvas = $("dd-canvas");
   if (!target) return;
   if (canvas) canvas.hidden = true;
   target.hidden = false;
   target.innerHTML = "";
   const size = Math.min(300, target.parentElement.clientWidth || 300);
   target.style.width = size + "px";
   target.style.height = size + "px";
   if (typeof HanziWriter === "undefined") {
      if (mode === "practice") setupFreehandPractice("Bibliothèque d’écriture indisponible · entraînement libre.");
      else setStrokeWorkspaceMessage("dd-note", "Animation indisponible.");
      return;
   }
   const token = ++ddWriterToken;
   ddWriterTarget = target;
   try {
      ddWriter = createManagedDDWriter(target, ddChar, {
         width: size,
         height: size,
         padding: 12,
         showCharacter: mode === "animation",
         showOutline: true,
         showHintAfterMisses: 2,
         strokeColor: "#17140F",
         outlineColor: "#CDBFA1",
         drawingColor: "#9E2B25",
         charDataLoader: () => ddCharacterData,
         onLoadCharDataError: () => {
            if (token !== ddWriterToken) return;
            if (mode === "practice") setupFreehandPractice();
            else setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
         },
         ...speedOpts(db.settings.strokeSpeed),
      });
   } catch (error) {
      ddWriter = null;
      ddWriterTarget = null;
      if (mode === "practice")
         setupFreehandPractice("Bibliothèque d’écriture indisponible · entraînement libre.");
      else setStrokeWorkspaceMessage("dd-note", "Animation indisponible.");
      return;
   }
   if (mode === "practice") {
      setStrokeWorkspaceMessage("dd-practice-note", "Appuie sur Commencer, puis trace trait par trait.");
   } else {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const shouldAutoplay =
         ddAutoplayPending && ddAutoplayLoadToken === ddCharacterLoadToken;
      if (shouldAutoplay) ddAutoplayPending = false;
      setStrokeWorkspaceMessage(
         "dd-note",
         reduced
            ? "Mouvement réduit activé · aucune lecture automatique."
            : shouldAutoplay
              ? "Lecture automatique des traits dans l’ordre réel."
              : `${ddCharacterData.strokeCount} traits réels.`,
      );
      if (shouldAutoplay && !reduced) {
         const writer = ddWriter;
         const token = ddWriterToken;
         try {
            const animation = writer.animateCharacter();
            if (animation && typeof animation.catch === "function") {
               animation.catch(() => {
                  if (token === ddWriterToken && writer === ddWriter)
                     setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
               });
            }
         } catch (error) {
            if (token === ddWriterToken && writer === ddWriter)
               setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
         }
      }
   }
}

function renderActiveStrokeTab() {
   if (!ddCharacterData) return;
   if (ddStrokeTab === "steps") renderStrokeGallery(ddCharacterData);
   else createDDWriter(ddStrokeTab);
}

function activateStrokeTab(tab, focus) {
   if (!["animation", "steps", "practice"].includes(tab)) return;
   ddStrokeTab = tab;
   document.querySelectorAll("[data-stroke-tab]").forEach((button) => {
      const selected = button.dataset.strokeTab === tab;
      button.setAttribute("aria-selected", String(selected));
      button.tabIndex = selected ? 0 : -1;
      if (selected && focus) button.focus();
   });
   document.querySelectorAll(".stroke-tab-panel").forEach((panel) => {
      panel.hidden = panel.id !== `stroke-panel-${tab}`;
   });
   destroyDDWriter();
   renderActiveStrokeTab();
}

function wireStrokeWorkspace() {
   const tabs = Array.from(document.querySelectorAll("[data-stroke-tab]"));
   tabs.forEach((button, index) => {
      button.onclick = () => activateStrokeTab(button.dataset.strokeTab, false);
      button.onkeydown = (event) => {
         let next = null;
         if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
         else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
         else if (event.key === "Home") next = 0;
         else if (event.key === "End") next = tabs.length - 1;
         if (next == null) return;
         event.preventDefault();
         activateStrokeTab(tabs[next].dataset.strokeTab, true);
      };
   });
   if ($("dd-speed")) {
      $("dd-speed").oninput = (event) => {
         db.settings.strokeSpeed = normalizedStrokeSpeed(event.target.value);
         $("dd-speed-lab").textContent = db.settings.strokeSpeed.toFixed(2) + "×";
         save();
      };
      $("dd-speed").onchange = () => {
         if (ddStrokeTab === "animation") createDDWriter("animation");
      };
   }
   if ($("dd-anim")) $("dd-anim").onclick = () => {
      if (!ddWriter) return toast("Animation indisponible pour ce caractère.");
      ddWriter.showCharacter({ duration: 0 });
      ddWriter.animateCharacter();
      setStrokeWorkspaceMessage("dd-note", "Lecture des traits dans l’ordre réel.");
   };
   if ($("dd-quiz")) $("dd-quiz").onclick = () => {
      if (!ddWriter) return toast("Quiz indisponible pour ce caractère.");
      if (typeof ddWriter.cancelQuiz === "function") ddWriter.cancelQuiz();
      ddWriter.hideCharacter({ duration: 0 });
      setStrokeWorkspaceMessage("dd-practice-note", "À toi : trace de mémoire, trait par trait.");
      ddWriter.quiz({
         onMistake: (strokeData) => setStrokeWorkspaceMessage(
            "dd-practice-note",
            `Essaie encore · trait ${strokeData.strokeNum + 1} sur ${ddCharacterData.strokeCount}.`,
         ),
         onCorrectStroke: (strokeData) => setStrokeWorkspaceMessage(
            "dd-practice-note",
            `Trait ${strokeData.strokeNum + 1} sur ${ddCharacterData.strokeCount} réussi.`,
         ),
         onComplete: () => setStrokeWorkspaceMessage("dd-practice-note", "Caractère réussi ✓"),
      });
   };
   if ($("dd-clear")) $("dd-clear").onclick = () => {
      if (ddCharacterData && typeof HanziWriter !== "undefined") createDDWriter("practice");
      else {
         const canvas = $("dd-canvas");
         if (canvas) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
      }
   };
   const gallerySettings = strokeGallerySettings();
   [
      ["dd-show-future", "showFuture"],
      ["dd-show-grid", "showGrid"],
      ["dd-show-ghost", "showGhost"],
   ].forEach(([id, key]) => {
      if (!$(id)) return;
      $(id).onchange = (event) => {
         gallerySettings[key] = !!event.target.checked;
         save();
         if (ddCharacterData) renderStrokeGallery(ddCharacterData);
      };
   });
}

async function loadDDChar(character, characters, options) {
   const settings = options || {};
   const selectionKey = String(
      settings.selectionKey == null ? character : settings.selectionKey,
   );
   destroyDDWriter();
   const token = ++ddCharacterLoadToken;
   if (selectionKey !== ddAutoplaySelectionKey) {
      ddAutoplaySelectionKey = selectionKey;
      ddAutoplayPending = true;
   }
   ddAutoplayLoadToken = token;
   ddChar = character;
   ddCharacterData = null;
   ddWorkspaceCharacters = Array.isArray(characters) ? characters.slice() : [character];
   document.querySelectorAll("#dd-picker .hzchip, #seq-character-strip .hzchip").forEach((button) => {
      const value = button.dataset.character || ddWorkspaceCharacters[Number(button.dataset.i)];
      button.setAttribute("aria-pressed", String(value === character));
   });
   setStrokeWorkspaceMessage("dd-note", `Chargement des traits réels de ${character}…`);
   setStrokeWorkspaceMessage("dd-practice-note", `Chargement des traits réels de ${character}…`);
   setStrokeWorkspaceMessage("dd-gallery-status", `Chargement des traits réels de ${character}…`);
   if ($("dd-gallery")) $("dd-gallery").innerHTML = '<div class="dictionary-loading"><span class="ink-loader"></span></div>';
   try {
      const data = await loadStrokeCharacterData(character);
      if (
         token !== ddCharacterLoadToken ||
         ddChar !== character ||
         !document.querySelector(".stroke-workspace")
      ) return;
      ddCharacterData = data;
      renderActiveStrokeTab();
   } catch (error) {
      if (token !== ddCharacterLoadToken || ddChar !== character) return;
      ddAutoplayPending = false;
      renderStrokeGalleryError(character, error);
      setStrokeWorkspaceMessage("dd-note", "Animation indisponible · aucune donnée inventée.");
      setupFreehandPractice("Données réelles indisponibles · entraînement libre sans modèle inventé.");
   }
   const index = ddWorkspaceCharacters.indexOf(character);
   if (index >= 0 && ddWorkspaceCharacters[index + 1]) {
      preloadStrokeCharacterData(ddWorkspaceCharacters[index + 1]);
   }
}

"use strict";

let dictionaryDetailToken = 0;

function cardActionsHtml(card) {
   return (
      '<section class="dd-card-actions" aria-label="Carte personnelle"><div class="acts">' +
      '<button class="act' + (card.fav ? " on" : "") + '" id="dd-fav">♥ Favori</button>' +

      "</div>" +
      '<button class="btn ghost wide" id="dd-manage">Modifier ou gérer cette carte</button></section>'
   );
}

function normalizeDetailEntry(value) {
   if (value && value.simplified) return value;
   if (value && value.src === "card" && value.cardId) {
      const card = db.cards.find((item) => item.id === value.cardId);
      if (card) return personalCardAsDictionaryEntry(card);
   }
   const hanzi = value && value.hz ? value.hz : "";
   const marked = value && value.py ? normalizePinyinMarked(value.py) : "";
   return {
      id: "legacy-" + hanzi + "-" + normalizePinyinNumbered(marked),
      simplified: hanzi,
      traditional: hanzi,
      entryType: Array.from(hanzi).length === 1 ? "character" : "word",
      pinyin: marked
         ? [{ marked, numbered: normalizePinyinNumbered(marked), plain: normalizePinyinPlain(marked) }]
         : [],
      definitionsFr: value && value.fr ? [value.fr] : [],
      definitionsEn: [],
      sources: [],
      sourceRefs: [],
      hskLegacy: [],
      hsk30: [],
      frequencyRank: null,
      characters: Array.from(hanzi).filter((character) => HAN_PATTERN.test(character)),
      cardId: value ? value.cardId : null,
      personalCard: value && value.cardId ? db.cards.find((card) => card.id === value.cardId) : null,
   };
}

function detailPinyin(entry, field) {
   return (entry.pinyin || []).map((variant) => variant[field]).filter(Boolean);
}

function uniqueDetailValues(values) {
   return Array.from(new Set(values));
}

function verifiedHskBadges(entry) {
   const output = [];
   verifiedHskLevels(entry).forEach((level) =>
      output.push(
         '<span class="cd-cat hsk-badge hsk-level-' +
            level +
            '" data-hsk-badge="' +
            level +
            '">HSK ' +
            esc(level) +
            "</span>",
      ),
   );
   if (Array.isArray(entry.hskLegacy))
      entry.hskLegacy.forEach((level) => output.push('<span class="cd-cat">HSK historique ' + esc(level) + "</span>"));
   if (Array.isArray(entry.hsk30))
      entry.hsk30.forEach((level) => output.push('<span class="cd-cat">HSK 3.0 ' + esc(level) + "</span>"));
   return output.join("");
}

function dictionaryHskSourceHtml(entry) {
   const values = Array.isArray(entry.hskVerified) ? entry.hskVerified : [];
   if (!values.length) return "";
   return (
      '<section class="dd-hsk-source"><div class="eyebrow">Données HSK source</div>' +
      values
         .map(
            (item) =>
               '<div class="dd-hsk-source-item"><div><b>HSK ' +

                  : "") +

function dictionaryDefinitionsHtml(entry) {
   if (entry.definitionsFr && entry.definitionsFr.length) {
      return (
         '<section class="dd-definitions"><div class="eyebrow">Définitions françaises</div><ul>' +
         entry.definitionsFr.map((definition) => "<li>" + esc(definition) + "</li>").join("") +

function dictionarySourcesHtml(entry) {
   if (!entry.sources || !entry.sources.length) return "";
   return (
      '<details class="dd-sources"><summary>Sources du dictionnaire</summary><span>' +
      entry.sources.map(esc).join(" · ") +

}

function findPersonalCardForEntry(entry) {
   if (entry.personalCard) return db.cards.find((card) => card.id === entry.personalCard.id) || null;
   if (entry.cardId) return db.cards.find((card) => card.id === entry.cardId) || null;
   const identity = dictionaryEntryIdentity(entry);
   return (
      db.cards.find((card) => dictionaryEntryIdentity(personalCardAsDictionaryEntry(card)) === identity) ||
      null
   );
}

async function renderDictionaryRelatedWords(character, token) {
   const target = $("dd-related");
   if (!target) return;
   try {
      const related = await loadDictionaryCharacterLinks(character, 10);
      if (token !== dictionaryDetailToken || !$("dd-related")) return;
      if (!related.words.length) {
         target.innerHTML = '<span class="muted">Aucun mot lié classé par les sources.</span>';
         return;
      }
      target.innerHTML =
         '<div class="eyebrow">Mots liés vérifiés</div><div class="dd-related-list">' +
         related.words
            .map(
               (word, index) =>
                  '<button class="chip hzchip" data-related="' + index + '">' + esc(word.simplified) + "</button>",
            )
            .join("") +
         "</div>";
      target.querySelectorAll("[data-related]").forEach((button) => {
         button.onclick = () => {
            const word = related.words[Number(button.dataset.related)];
            if (typeof openSearchDictionaryDetail === "function" && activeView === "write")
               openSearchDictionaryDetail(word, true);
            else openDictDetail(word);
         };
      });
   } catch (error) {
      if (token === dictionaryDetailToken && $("dd-related"))
         target.innerHTML = '<span class="muted">Mots liés indisponibles.</span>';
   }
}

function wireDictDetail(entry, characters, card, token, options) {
   if (characters.length) wireStrokeWorkspace();
   const selectCharacter = (character) => {
      const selectionKey =
         options && typeof options.strokeSelectionKey === "function"
            ? options.strokeSelectionKey(character)
            : character;
      loadDDChar(character, characters, { selectionKey });
      renderDictionaryRelatedWords(character, token);
   };
   if (characters.length) {
      selectCharacter(characters[0]);
      document.querySelectorAll("#dd-picker .hzchip").forEach((button) => {
         button.onclick = () => selectCharacter(characters[Number(button.dataset.i)]);
      });
   }
   if (card) {
      if ($("dd-fav"))
         $("dd-fav").onclick = () => {
            card.fav = !card.fav;
            save();
            openDictDetail(entry, options);
         };
      if ($("dd-acq"))
         $("dd-acq").onclick = () => {
            card.acquired = !card.acquired;
            if (card.acquired) card.due = null;
            save();
            openDictDetail(entry, options);
            refreshActive();
         };
      if ($("dd-manage")) $("dd-manage").onclick = () => openCardDetail(card.id);
   }
   if ($("dd-addcard"))
      $("dd-addcard").onclick = () => {
         const french = (entry.definitionsFr || []).join(" ; ");
         const draft = {
            hz: entry.simplified,
            py: detailPinyin(entry, "marked").join(" / "),
            fr: french,
            cat: "",
         };
         if (!french) {
            toast("Ajoute une définition française vérifiée avant d’enregistrer.");
            openCardForm(draft);
            return;
         }
         const normalized = normalizeCard(draft, false);
         if (!normalized) return;
         const identity = dictionaryEntryIdentity(entry);
         if (db.cards.some((item) => dictionaryEntryIdentity(personalCardAsDictionaryEntry(item)) === identity))
            return toast("Déjà dans tes cartes.");
         db.cards.push(normalized);
         invalidateDictIndex();
         save();
         entry.personalCard = normalized;
         toast("« " + entry.simplified + " » ajoutée à tes cartes.");
         openDictDetail(entry, options);
      };
   const closeDetail = () => {
         if (options && options.fromSearch && typeof closeSearchDictionaryDetail === "function")
            closeSearchDictionaryDetail();
         else closeSheet();
   };
   if ($("dd-close")) $("dd-close").onclick = closeDetail;
   if ($("dd-close-top")) $("dd-close-top").onclick = closeDetail;
   setTimeout(() => {
      const closeButton = $("dd-close-top");
      if (closeButton && sheetOpen()) closeButton.focus({ preventScroll: true });
   }, 0);
}

"use strict";

let seq = null;

async function seqEntry(character) {
   const personal = db.cards.find((card) => card.hz === character);
   if (personal) return personalCardAsDictionaryEntry(personal);
   const found = await findDictionaryEntryByHanzi(character);
   return found || normalizeDetailEntry({ hz: character });
}

function sequenceHistoryPayload() {
   return {
      moStudioSearch: true,
      mode: "sequence",
      q: srch.q,
      characters: seq ? seq.chars.join("") : "",
      sequenceIndex: seq ? seq.index : 0,
      strokeTab: ddStrokeTab,
   };
}

function openSequence(characters, options) {
   const settings = options || {};
   const list = Array.from(characters || []).filter((character) => /^\p{Script=Han}$/u.test(character));
   if (list.length < 2) return toast("La séquence demande au moins deux caractères Han réels.");
   resetStrokeAutoplaySelection();
   destroyStrokeWorkspace();
   seq = {
      chars: list,
      index: Math.max(0, Math.min(Number(settings.index) || 0, list.length - 1)),
      renderToken: 0,
   };
   if (settings.strokeTab && ["animation", "steps", "practice"].includes(settings.strokeTab)) {
      ddStrokeTab = settings.strokeTab;
   }
   closeSheet();
   document.body.classList.add("in-seq");
   document.body.style.overflow = "";
   if (!settings.fromHistory) history.pushState(sequenceHistoryPayload(), "");
   renderSequence();
   window.scrollTo(0, 0);
}

function teardownSequence() {
   destroyStrokeWorkspace();
   seq = null;
   document.body.classList.remove("in-seq");
   document.body.style.overflow = "";
}

function closeSequence(options) {
   const settings = options || {};
   if (!settings.fromHistory && history.state && history.state.mode === "sequence") {
      history.back();
      return;
   }
   teardownSequence();
   renderSearch();
}

function setSequenceIndex(index, focusStrip) {
   if (!seq) return;
   const next = Math.max(0, Math.min(index, seq.chars.length - 1));
   if (next === seq.index && $("seq-flash")) return;
   seq.index = next;
   history.replaceState(sequenceHistoryPayload(), "");
   renderSequence().then(() => {
      if (focusStrip) {
         const selected = document.querySelector('#seq-character-strip [aria-current="true"]');
         if (selected) selected.focus();
      }
   });
}

function moveSequence(delta) {
   if (!seq) return;
   setSequenceIndex(seq.index + delta);
}

function setupSwipe(element, onLeft, onRight) {
   if (!element) return;
   let x0 = null;
   let y0 = null;
   element.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button, input, select, .stroke-workspace")) {
         x0 = null;
         return;
      }
      x0 = event.clientX;
      y0 = event.clientY;
   });
   element.addEventListener("pointerup", (event) => {
      if (x0 == null) return;
      const dx = event.clientX - x0;
      const dy = event.clientY - y0;
      if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
         if (dx < 0) onLeft();
         else onRight();
      }
      x0 = null;
      y0 = null;
   });
}

async function renderSequence() {
   if (!seq) return;
   destroyStrokeWorkspace();
   const current = seq;
   const token = ++current.renderToken;
   const index = current.index;
   const character = current.chars[index];
   $("view").innerHTML =
      '<section class="sess"><div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de ' +
      esc(character) + "…</b></div></section>";
   const entry = await seqEntry(character).catch(() => normalizeDetailEntry({ hz: character }));
   if (!seq || seq !== current || token !== current.renderToken) return;
   const card = findPersonalCardForEntry(entry);
   const pinyin = dictionaryEntryPinyinText(entry);
   const definition = dictionaryResultDefinition(entry);
   $("view").innerHTML =
      '<section class="sess"><div class="s-top"><button class="s-x" id="seq-exit" aria-label="Quitter la séquence">✕</button>' +
      '<div class="s-scope">Séquence · ' + esc(current.chars.join("")) + '</div><div class="s-count" aria-live="polite">' +
      (index + 1) + " / " + current.chars.length + "</div></div>" +
      '<div class="s-bar"><i style="width:' + (((index + 1) / current.chars.length) * 100).toFixed(1) + '%"></i></div>' +
      '<nav class="seq-character-strip" id="seq-character-strip" aria-label="Caractères de la séquence">' +
      current.chars.map((item, index) =>
         '<button class="chip hzchip" type="button" data-i="' + index + '" data-character="' + esc(item) +
         '" aria-current="' + String(index === current.index) + '" aria-label="Afficher ' + esc(item) +
         ', position ' + (index + 1) + " sur " + current.chars.length + '">' + esc(item) + "</button>",
      ).join("") + "</nav>" +
      '<div class="flash card seq-card" id="seq-flash"><button class="seal fl-seal" data-say="' +
      esc(character) + '" aria-label="Écouter ' + esc(character) + '">听</button><div class="hanzi ink-in" data-say="' + esc(character) + '">' +
      esc(character) + "</div>" +
      (pinyin ? '<div class="pinyin">' + colorPinyin(pinyin) + "</div>" : "") +
      verifiedHskBadges(entry) +
      '<div class="sep"></div><div class="fr">' +
      (definition.english ? '<small class="search-fallback">EN · repli</small>' : "") + esc(definition.text) + "</div>" +
      '<div class="eyebrow">Ordre des traits</div>' + strokeBoxHtml() +
      (card
         ? cardActionsHtml(card)
         : '<div class="sh-btns"><button class="btn primary wide" id="dd-addcard">+ Ajouter à mes cartes</button></div>') +
      '</div><div class="s-foot"><button class="btn ghost" id="seq-prev" type="button"' +
      (index === 0 ? " disabled" : "") + ">← préc.</button>" +
      '<button class="btn primary" id="seq-next" type="button">' +
      (index >= current.chars.length - 1 ? "Terminer 完" : "suivant →") +
      "</button></div></section>";
   wireDictDetail(entry, [character], card, ++dictionaryDetailToken, {
      strokeSelectionKey: () => `sequence:${index}:${character}`,
   });
   $("seq-exit").onclick = () => closeSequence();
   $("seq-prev").onclick = () => moveSequence(-1);
   $("seq-next").onclick = () => {
      if (seq && seq.index < seq.chars.length - 1) moveSequence(1);
      else closeSequence();
   };
   document.querySelectorAll("#seq-character-strip [data-i]").forEach((button) => {
      button.onclick = () => setSequenceIndex(Number(button.dataset.i), true);
   });
   setupSwipe(
      $("seq-flash"),
      () => moveSequence(1),
      () => moveSequence(-1),
   );
   const nextCharacter = current.chars[index + 1];
   if (nextCharacter) {
      preloadStrokeCharacterData(nextCharacter);
      seqEntry(nextCharacter).catch(() => null);
   }

         function newToneRound(play) {
            const grid = $("tone-grid");
            if (!grid) return;
            const set = TONE_SETS[Math.floor(Math.random() * TONE_SETS.length)];
            const tone = 1 + Math.floor(Math.random() * 4);
            toneRound = { set, tone, target: set.items[tone - 1], done: false };
            grid.innerHTML = [1, 2, 3, 4]
               .map(
                  (t) =>
                     '<button class="opt" data-t="' +
                     t +
                     '"><span class="tn t' +
                     t +
                     '">' +
                     numToAccent(set.syl + t) +
                     "</span></button>",
               )
               .join("");

               "Appuie sur le sceau, puis choisis le ton entendu.";
            $("tone-go").hidden = true;
            grid.querySelectorAll(".opt").forEach(
               (b) =>
                  (b.onclick = () => {
                     if (toneRound.done) return;
                     toneRound.done = true;
                     const t = +b.dataset.t;
                     const okBtn = grid.querySelector(
                        '[data-t="' + toneRound.tone + '"]',
                     );
                     if (okBtn) okBtn.classList.add("ok");
                     const tg = toneRound.target;
                     if (t === toneRound.tone)
                        $("tone-note").textContent =
                           "✓ Juste ! C'était " +

                           " — " +

                           "✗ C'était le ton " +

            );
            $("tone-go").onclick = () => newToneRound(true);
            if (play) speak(toneRound.target[0]);
         }
         function pickDistractors(target, pool) {
            // pièges intelligents : syllabes proches, même initiale, même nombre de syllabes
            const sylCount = (s) =>
               String(s || "")
                  .trim()
                  .split(/\s+/)
                  .filter(Boolean).length;
            const tN = sylCount(target.py);
            const tIni = (flatten(target.py) || "")[0] || "";
            const tSyls = new Set(
               String(target.py || "")
                  .toLowerCase()
                  .split(/\s+/)
                  .map((x) => flatten(x))
                  .filter(Boolean),
            );
            return pool
               .filter((c) => c.id !== target.id)
               .map((c) => {
                  let s = Math.random();
                  if (sylCount(c.py) === tN) s += 2;
                  if (((flatten(c.py) || "")[0] || "") === tIni) s += 2;
                  if (
                     String(c.py || "")
                        .toLowerCase()
                        .split(/\s+/)
                        .some((x) => tSyls.has(flatten(x)))
                  )
                     s += 1.5;
                  if (c.cat && c.cat === target.cat) s += 1;
                  return [s, c];
               })
               .sort((a, b) => b[0] - a[0])
               .slice(0, 6)
               .map((x) => x[1])
               .sort(() => Math.random() - 0.5)
               .slice(0, 3);
         }
         function newWordRound(play) {
            const grid = $("word-grid");
            if (!grid || db.cards.length < 4) return;
            const target =
               db.cards[Math.floor(Math.random() * db.cards.length)];
            const opts = shuffle(
               [target].concat(pickDistractors(target, db.cards)),
            );
            wordRound = { target, done: false };
            const lvl = db.settings.listenLevel;
            grid.innerHTML = opts
               .map(
                  (c) =>
                     '<button class="opt" data-id="' +
                     c.id +
                     '">' +
                     (lvl !== 3
                        ? '<span class="o-hz">' + esc(c.hz) + "</span>"
                        : '<span class="o-hz" style="font-size:16px;font-family:var(--ui)">' +
                          esc(c.fr) +
                          "</span>") +
                     (lvl === 1
                        ? '<span class="o-fr">' + esc(c.fr) + "</span>"
                        : "") +
                     "</button>",
               )
               .join("");
            $("word-note").textContent =
               "Appuie sur le sceau, puis choisis le mot entendu.";
            $("word-go").hidden = true;
            grid.querySelectorAll(".opt").forEach(
               (b) =>
                  (b.onclick = () => {
                     if (wordRound.done) return;
                     wordRound.done = true;
                     const okBtn = grid.querySelector(
                        '[data-id="' + wordRound.target.id + '"]',
                     );
                     if (okBtn) okBtn.classList.add("ok");
                     const tg = wordRound.target;
                     if (b.dataset.id === tg.id)
                        $("word-note").textContent =
                           "✓ Juste ! " + tg.hz + " (" + tg.py + ") · " + tg.fr;
                     else {
                        b.classList.add("ko");
                        const picked = db.cards.find(
                           (c) => c.id === b.dataset.id,
                        );
                        $("word-note").textContent =
                           "✗ C'était " +
                           tg.hz +
                           " (" +
                           tg.py +
                           ") · " +
                           tg.fr +
                           (picked
                              ? " — tu as choisi " +
                                picked.hz +
                                " (" +
                                picked.py +
                                ")."
                              : ".");
                     }
                     $("word-go").hidden = false;
                  }),
            );
            $("word-go").onclick = () => newWordRound(true);
            if (play) speak(target.hz);
         }

         function quizHtml(gi) {
            const g = GRAMMAR[gi];
            return (
               '<div class="qz"><div class="qz-t">Mini-quiz</div>' +
               g.quiz
                  .map((qq, qi) => {
                     const opts = shuffle(qq.opts.map((o, i) => [o, i === 0]));
                     return (
                        '<div class="qz-q">' +
                        (qi + 1) +
                        ". " +
                        (qq.hz ? '<span class="qhz">' : "") +
                        esc(qq.q) +
                        (qq.hz ? "</span>" : "") +
                        "</div>" +
                        '<div class="qz-opts" data-g="' +
                        gi +
                        '" data-q="' +
                        qi +
                        '">' +
                        opts
                           .map(
                              (o) =>
                                 '<button class="chip' +
                                 (qq.hz ? " hz" : "") +
                                 '" data-ok="' +
                                 o[1] +
                                 '">' +
                                 esc(o[0]) +
                                 "</button>",
                           )
                           .join("") +
                        "</div>"
                     );
                  })
                  .join("") +
               '<div class="qz-score" id="qz-score-' +
               gi +
               '"></div></div>'
            );
         }
         function renderGrammar() {
            $("view").innerHTML =
               '<section style="padding:6px 2px 10px"><h2 class="v-t" style="margin:0">法 · Les règles du jeu</h2><p class="muted">L\'essentiel de la grammaire HSK 1, en fiches. Touche un exemple pour l\'écouter, puis teste-toi.</p></section>' +
               GRAMMAR.map(
                  (g, i) =>
                     '<details class="gcard"' +
                     (i === 0 ? " open" : "") +
                     '><summary><span class="g-hz">' +
                     g.hz +
                     "</span>" +
                     g.t +
                     '</summary><div class="g-body">' +
                     g.body +
                     quizHtml(i) +
                     "</div></details>",
               ).join("");
            document.querySelectorAll(".qz-opts").forEach((box) => {
               const gi = +box.dataset.g;
               box.querySelectorAll(".chip").forEach(
                  (b) =>
                     (b.onclick = () => {
                        if (box.dataset.done) return;
                        box.dataset.done = "1";
                        const good = box.querySelector('[data-ok="true"]');
                        if (good) good.classList.add("ok");
                        if (b.dataset.ok !== "true") b.classList.add("ko");
                        // score de la fiche
                        const boxes = Array.from(
                           document.querySelectorAll(
                              '.qz-opts[data-g="' + gi + '"]',
                           ),
                        );
                        const done = boxes.filter((x) => x.dataset.done).length;
                        const right = boxes.filter(
                           (x) =>
                              x.dataset.done && !x.querySelector(".chip.ko"),
                        ).length;
                        const sc = $("qz-score-" + gi);
                        if (sc)
                           sc.textContent =
                              done === boxes.length
                                 ? "Score : " +
                                   right +
                                   " / " +
                                   boxes.length +
                                   (right === boxes.length ? " — 漂亮 !" : "")
                                 : "";
                     }),
               );
            });
         }

         function openImportSheet(data) {
            const rawCards = Array.isArray(data)
               ? data
               : Array.isArray(data.cards)
                 ? data.cards
                 : [];
            const incoming = rawCards
               .map((c) => normalizeCard(c, false))
               .filter(Boolean);
            if (!incoming.length) {
               toast(
                  "Aucune carte valide dans ce fichier (hz et fr obligatoires).",
               );
               return;
            }
            const name =
               !Array.isArray(data) && typeof data.name === "string"
                  ? data.name.trim()
                  : "";
            const existing = new Set(db.cards.map(cardKey));
            const fresh = incoming.filter((c) => !existing.has(cardKey(c)));
            const dupN = incoming.length - fresh.length;
            openSheet(
               '<h3 class="sh-t">Importer ' +
                  incoming.length +
                  " carte" +
                  (incoming.length > 1 ? "s" : "") +
                  "</h3>" +
                  '<p class="sh-p">' +
                  fresh.length +
                  " nouvelle" +
                  (fresh.length > 1 ? "s" : "") +
                  " · " +
                  dupN +
                  " déjà présente" +
                  (dupN > 1 ? "s" : "") +
                  " (mêmes 汉字 + pinyin).</p>" +
                  (name
                     ? '<label class="ck"><input type="checkbox" id="im-pack" checked> Créer / compléter le pack « ' +
                       esc(name) +
                       " »</label>"
                     : "") +
                  '<div class="sh-btns">' +
                  '<button class="btn primary" id="im-merge">Fusionner</button>' +
                  '<button class="btn danger" id="im-replace">Remplacer tout</button>' +
                  '<button class="btn ghost" id="im-cancel">Annuler</button>' +
                  "</div>" +
                  '<p class="sh-note">« Fusionner » ajoute seulement les nouvelles cartes. « Remplacer tout » écrase cartes et packs (réglages conservés, sauvegarde automatique avant).</p>',
            );
            $("im-cancel").onclick = closeSheet;
            $("im-merge").onclick = () =>
               doImport(data, incoming, fresh, name, false);
            $("im-replace").onclick = () => {
               if (
                  confirm(
                     "Remplacer toute ta collection ? (une sauvegarde sera gardée)",
                  )
               )
                  doImport(data, incoming, fresh, name, true);
            };
         }
         function doImport(data, incoming, fresh, name, replace) {
            const wantPack = !!(name && $("im-pack") && $("im-pack").checked);
            session = { active: false };
            clearSavedSession();
            hub.pack = "";
            hub.cat = "";
            const inUnits =
               !Array.isArray(data) &&
               data.units &&
               typeof data.units === "object" &&
               !Array.isArray(data.units)
                  ? data.units
                  : null;
            if (replace) {
               makeBackup();
               const raw = Array.isArray(data)
                  ? incoming
                  : Array.isArray(data.cards)
                    ? data.cards
                    : incoming;
               let cards = raw
                  .map((c) => normalizeCard(c, true))
                  .filter(Boolean);
               const seen = new Set();
               cards = cards.filter((c) => {
                  const k = cardKey(c);
                  if (seen.has(k)) return false;
                  seen.add(k);
                  return true;
               });
               db.cards = cards;
               const ids = new Set(cards.map((c) => c.id));
               db.packs =
                  !Array.isArray(data) && Array.isArray(data.packs)
                     ? data.packs
                          .filter(
                             (p) => p && p.name && Array.isArray(p.cardIds),
                          )
                          .map((p) => ({
                             id: String(p.id || uid()),
                             name: String(p.name),
                             cardIds: p.cardIds.filter((i) => ids.has(i)),
                          }))
                     : [];
               db.units = inUnits || {};
            } else {
               db.cards = db.cards.concat(fresh);
               if (inUnits) db.units = Object.assign({}, db.units, inUnits);
            }
            const added = replace ? db.cards.length : fresh.length;
            if (wantPack) {
               const byKey = new Map(db.cards.map((c) => [cardKey(c), c.id]));
               const idsForPack = incoming
                  .map((c) => byKey.get(cardKey(c)))
                  .filter(Boolean);
               upsertPack(name, idsForPack);
            }
            invalidateDictIndex();
            save();
            closeSheet();
            refreshActive();
            toast(
               replace
                  ? "Collection remplacée (" + added + " cartes)."
                  : added
                    ? added +
                      " carte" +
                      (added > 1 ? "s" : "") +
                      " ajoutée" +
                      (added > 1 ? "s" : "") +
                      "."
                    : "Rien à ajouter — tout existait déjà.",
            );
         }

         function closeSheet() {
            if (typeof destroyStrokeWorkspace === "function") destroyStrokeWorkspace();

/* ================= initialisation ================= */
         function init() {
            refreshVoices();
            document
               .querySelectorAll(".nav button")
               .forEach((b) => (b.onclick = () => setView(b.dataset.view)));
            $("btn-settings").onclick = openSettings;
            $("sheet").addEventListener("click", (e) => {
               if (e.target.id !== "sheet") return;
               if (
                  activeView === "write" &&
                  history.state &&
                  history.state.moStudioSearch &&
                  history.state.mode === "detail"
               )
                  closeSearchDictionaryDetail();
               else closeSheet();
            });
            // audio : tout élément portant data-say est cliquable
            document.addEventListener("click", (e) => {
               const el = e.target.closest("[data-say]");
               if (el) speak(el.getAttribute("data-say"));
            });
            // import de fichier
            $("file-global").addEventListener("change", (e) => {
               const f = e.target.files[0];
               e.target.value = "";
               if (!f) return;
               const r = new FileReader();
               r.onload = () => {
                  try {
                     openImportSheet(JSON.parse(r.result));
                  } catch (err) {
                     toast("Fichier JSON invalide.");
                  }
               };
               r.onerror = () => toast("Impossible de lire le fichier.");
               r.readAsText(f);
            });
            // raccourcis clavier
            document.addEventListener("keydown", (e) => {
               if (sheetOpen()) {
                  if (e.key === "Escape") {
                     if (
                        activeView === "write" &&
                        history.state &&
                        history.state.moStudioSearch &&
                        history.state.mode === "detail"
                     )
                        closeSearchDictionaryDetail();
                     else closeSheet();
                  }
                  return;
               }
               if (seq) {
                  if (
                     e.defaultPrevented ||
                     (e.target.closest && e.target.closest(".stroke-workspace, .stroke-focus"))
                  ) return;
                  const tag = (e.target.tagName || "").toLowerCase();
                  if (tag === "input") return;
                  if (e.key === "ArrowRight" && $("seq-next"))
                     $("seq-next").click();
                  else if (
                     e.key === "ArrowLeft" &&
                     $("seq-prev") &&
                     !$("seq-prev").disabled
                  )
                     $("seq-prev").click();
                  else if (e.key === "Escape") closeSequence();
                  return;
               }
               if (!session.active || activeView !== "learn") return;
               const tag = (e.target.tagName || "").toLowerCase();
               if (tag === "input" || tag === "textarea" || tag === "select") {
                  if (e.key === "Enter" && $("s-check")) {
                     e.preventDefault();
                     checkWritten();
                  }
                  return;
               }
               const grades = { 1: "again", 2: "hard", 3: "good", 4: "easy" };
               if (grades[e.key]) {
                  const b = document.querySelector(
                     '[data-grade="' + grades[e.key] + '"]',
                  );
                  if (b) {
                     e.preventDefault();
                     b.click();
                     return;
                  }
               }
               if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  if ($("s-flip")) $("s-flip").click();
                  else if ($("s-next")) $("s-next").click();
               } else if (e.key === "ArrowRight" && $("s-next"))
                  $("s-next").click();
               else if (
                  e.key === "ArrowLeft" &&
                  $("s-prev") &&
                  !$("s-prev").disabled
               )
                  $("s-prev").click();
               else if (e.key === "Escape") endSession();
            });
            if (!history.state)
               history.replaceState({ moStudioView: "learn" }, "");
            if (history.state && history.state.moStudioSearch)
               restoreSearchHistory(history.state);
            else
               setView((history.state && history.state.moStudioView) || "learn", {
                  fromHistory: true,
               });
         }
         init();
   </script>
</body>
</html>
