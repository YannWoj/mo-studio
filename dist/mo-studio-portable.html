<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover"
      />
      <meta name="theme-color" content="#DED2BA" />
      <title>墨室 · Mò Studio</title>
      <link
         rel="icon"
         href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%239E2B25'/%3E%3Ctext%20x='50'%20y='70'%20font-size='56'%20text-anchor='middle'%20fill='%23EFE7D3'%20font-family='serif'%3E墨%3C/text%3E%3C/svg%3E"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <style>
/* ============ Mò Studio v4 — encre, papier de riz, laque ============ */
         :root {
            --paper: #ded2ba;
            --paper-2: #e7ddc9;
            --card: #efe7d3;
            --card-2: #f4eddd;
            --ink: #17140f;
            --ink-soft: #4a4132;
            --ink-faint: #7a7061;
            --line: #c9bca0;
            --line-soft: #d8ccb0;
            --lacquer: #9e2b25;
            --seal: #c0392b;
            --gold: #a8873a;
            --jade: #2e6b57;
            --t1: #b0392f;
            --t2: #b5822a;
            --t3: #2e6b57;
            --t4: #2f5480;
            --t5: #7a7061;
            --r: 14px;
            --shadow: 0 10px 30px rgba(23, 20, 15, 0.13);
            --serif: "Noto Serif SC", "Songti SC", serif;
            --disp: "EB Garamond", Georgia, serif;
            --ui: "IBM Plex Sans", system-ui, sans-serif;
         }
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }
         body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--ui);
            font-size: 16px;
            line-height: 1.5;
            min-height: 100dvh;
            padding-bottom: calc(86px + env(safe-area-inset-bottom));
         }
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.55%200%200%200%200%200.48%200%200%200%200%200.36%200%200%200%200.05%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23n)'/%3E%3C/svg%3E");
         }
         button {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
         }
         button:focus-visible,
         a:focus-visible,
         input:focus-visible,
         select:focus-visible,
         textarea:focus-visible,
         summary:focus-visible,
         [tabindex]:focus-visible {
            outline: 3px solid var(--jade);
            outline-offset: 3px;
         }
         input,
         select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
         }
         h2,
         h3 {
            margin: 0;
            font-weight: 600;
         }
         p {
            margin: 0.4em 0;
         }
         [hidden] {
            display: none !important;
         }

         /* ---------- header & layout ---------- */
         .top {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 10px;
            background: linear-gradient(var(--paper) 75%, transparent);
         }
         .brand {
            display: flex;
            align-items: center;
            gap: 10px;
         }
         .brand-seal {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--lacquer);
            color: var(--card);
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 10px rgba(158, 43, 37, 0.35);
         }
         .brand-name {
            font-family: var(--disp);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.02em;
         }
         .seal-btn {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--card);
            border: 1.5px solid var(--lacquer);
            color: var(--lacquer);
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 600;
            transform: rotate(2deg);
            transition: transform 0.15s;
         }
         .seal-btn:active {
            transform: rotate(2deg) scale(0.93);
         }
         .seal-btn.add {
            transform: rotate(-2deg);
         }
         #view {
            max-width: 560px;
            margin: 0 auto;
            padding: 4px 16px 24px;
         }
         .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            position: relative;
         }
         .pad {
            padding: 20px 18px;
            margin-bottom: 16px;
         }
         .v-t {
            font-family: var(--disp);
            font-size: 24px;
            margin-bottom: 6px;
         }
         .eyebrow {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            margin: 16px 0 8px;
            font-weight: 600;
         }
         .muted {
            color: var(--ink-soft);
            font-size: 14.5px;
         }

         /* ---------- hero, CTA, stats ---------- */
         .hero {
            text-align: center;
            padding: 12px 0 4px;
         }
         .hero-hz {
            font-family: var(--serif);
            font-size: 58px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.08em;
         }
         .hero-sub {
            font-family: var(--disp);
            font-style: italic;
            color: var(--ink-soft);
            margin-top: 2px;
         }
         .cta {
            display: block;
            width: 100%;
            text-align: left;
            margin: 14px 0 10px;
            background: var(--lacquer);
            color: #f6efdd;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 8px 22px rgba(158, 43, 37, 0.32);
            transition:
               transform 0.12s,
               opacity 0.15s;
         }
         .cta:active {
            transform: scale(0.98);
         }
         .cta:disabled {
            opacity: 0.6;
            pointer-events: none;
         }
         .cta b {
            display: block;
            font-family: var(--disp);
            font-size: 21px;
            letter-spacing: 0.01em;
         }
         .cta span {
            display: block;
            font-size: 13.5px;
            opacity: 0.92;
            margin-top: 3px;
         }
         .cta .u-line {
            display: block;
            font-size: 12.5px;
            opacity: 0.78;
            margin-top: 7px;
            font-style: italic;
         }
         .resume {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--card);
            border: 1.5px dashed var(--gold);
            border-radius: 13px;
            padding: 11px 14px;
            margin: 12px 0 2px;
         }
         .resume span {
            font-size: 14px;
            color: var(--ink-soft);
         }
         .resume .btn {
            margin: 0;
         }
         .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 4px 8px;
            text-align: center;
            transition: transform 0.1s;
         }
         .stat b {
            display: block;
            font-family: var(--disp);
            font-size: 22px;
            line-height: 1.15;
         }
         .stat span {
            font-size: 11px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
         }
         .stat:active {
            transform: scale(0.97);
         }

         /* ---------- séance libre (repliée) ---------- */
         details.free {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            margin: 12px 0 16px;
         }
         details.free > summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            padding: 15px 16px;
         }
         details.free > summary::-webkit-details-marker {
            display: none;
         }
         details.free > summary::after {
            content: "＋";
            margin-left: auto;
            color: var(--gold);
            font-size: 18px;
         }
         details.free[open] > summary::after {
            content: "－";
         }
         .free-hz {
            font-family: var(--serif);
            font-size: 21px;
            color: var(--lacquer);
         }
         .free-body {
            padding: 0 16px 16px;
         }

         /* ---------- chips, boutons, inputs ---------- */
         .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
         }
         .chip {
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 14px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .hzchip {
            font-family: var(--serif);
            font-size: 19px;
            padding: 6px 11px;
         }
         .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            background: var(--card-2);
            border: 1px solid var(--line);
            color: var(--ink);
            transition: transform 0.1s;
         }
         .btn:active {
            transform: scale(0.97);
         }
         .btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .btn.danger {
            background: none;
            border-color: var(--lacquer);
            color: var(--lacquer);
         }
         .btn.ghost {
            background: none;
            border-color: transparent;
            color: var(--ink-soft);
         }
         .btn.sm {
            padding: 7px 12px;
            font-size: 13.5px;
            border-radius: 10px;
         }
         .btn.wide {
            width: 100%;
            margin-top: 8px;
         }
         .btn.big {
            padding: 14px 22px;
            font-size: 16px;
         }
         .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
         }
         .ck {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 0;
            font-size: 14.5px;
            color: var(--ink-soft);
            cursor: pointer;
         }
         .ck input {
            width: 17px;
            height: 17px;
            accent-color: var(--lacquer);
         }
         .search {
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: var(--card-2);
            outline: none;
            font-size: 15px;
         }
         .search:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(168, 135, 58, 0.18);
         }
         .f-lab {
            display: block;
            font-size: 13px;
            color: var(--ink-faint);
            margin: 10px 0;
         }
         .f-lab .search,
         .f-lab select,
         .f-lab input[type="range"] {
            margin-top: 4px;
         }
         input[type="range"] {
            width: 100%;
            accent-color: var(--lacquer);
         }
         .selects {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .selects .search {
            flex: 1;
            padding: 9px 10px;
            font-size: 14px;
         }
         .modes {
            display: grid;
            gap: 10px;
            margin-top: 6px;
         }
         .mode {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px 15px;
            transition:
               transform 0.1s,
               border-color 0.15s;
         }
         .mode:active {
            transform: scale(0.98);
         }
         .mode:not(:disabled):hover {
            border-color: var(--gold);
         }
         .mode .m-hz {
            font-family: var(--serif);
            font-size: 26px;
            color: var(--lacquer);
            width: 34px;
            text-align: center;
         }
         .mode b {
            display: block;
            font-size: 15.5px;
         }
         .mode span {
            font-size: 13px;
            color: var(--ink-faint);
         }

         /* ---------- tons ---------- */
         .tn.t1 {
            color: var(--t1);
         }
         .tn.t2 {
            color: var(--t2);
         }
         .tn.t3 {
            color: var(--t3);
         }
         .tn.t4 {
            color: var(--t4);
         }
         .tn.t5 {
            color: var(--t5);
         }

/* ---------- séance ---------- */
         body.in-session .nav,
         body.in-session .top,
         body.in-seq .nav,
         body.in-seq .top {
            display: none;
         }
         body.in-session,
         body.in-seq {
            padding-bottom: 28px;
         }
         .dict-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .seq-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
         }
         .seq-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--line);
            transition: all 0.15s;
         }
         .seq-dots .dot.on {
            background: var(--lacquer);
            width: 20px;
            border-radius: 5px;
         }
         .seq-card {
            cursor: grab;
         }
         .speed-lab {
            font-size: 13px;
            color: var(--ink-faint);
         }
         .sess {
            padding-top: 10px;
         }
         .s-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
         }
         .s-x {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-size: 15px;
            flex: none;
         }
         .s-scope {
            flex: 1;
            font-size: 13px;
            color: var(--ink-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
         }
         .s-count {
            font-family: var(--disp);
            font-size: 15px;
            color: var(--ink-soft);
         }
         .s-bar {
            height: 4px;
            border-radius: 99px;
            background: var(--line-soft);
            overflow: hidden;
            margin-bottom: 14px;
         }
         .s-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--lacquer), var(--seal));
            border-radius: 99px;
            transition: width 0.25s;
         }
         .flash {
            padding: 52px 20px 24px;
            text-align: center;
            min-height: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
         }
         .fl-seal {
            position: absolute;
            top: 14px;
            right: 14px;
         }
         .seal {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--seal);
            color: #f6efdd;
            font-family: var(--serif);
            font-size: 21px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 9px rgba(192, 57, 43, 0.4);
            transition: transform 0.12s;
            flex: none;
         }
         .seal:active {
            transform: rotate(-2.5deg) scale(0.9);
         }
         .seal.lg {
            width: 56px;
            height: 56px;
            font-size: 26px;
            border-radius: 13px;
         }
         .hanzi {
            font-family: var(--serif);
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
            font-size: clamp(52px, 18vw, 88px);
            letter-spacing: 0.04em;
         }
         .pinyin {
            font-size: 21px;
            margin-top: 8px;
            letter-spacing: 0.03em;
         }
         .fr {
            font-family: var(--disp);
            font-size: 23px;
            margin-top: 4px;
         }
         .fr-big {
            font-family: var(--disp);
            font-size: 30px;
            line-height: 1.25;
            padding: 8px 4px;
         }
         .hint {
            margin-top: 22px;
            font-size: 12.5px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.12em;
         }
         .sep {
            width: 56px;
            height: 1.5px;
            background: var(--gold);
            opacity: 0.6;
            margin: 16px auto 10px;
         }
         .ex {
            margin-top: 14px;
            padding: 11px 14px;
            border-left: 3px solid var(--gold);
            background: var(--card-2);
            border-radius: 0 10px 10px 0;
            text-align: left;
            cursor: pointer;
            max-width: 100%;
         }
         .ex-hz {
            font-family: var(--serif);
            font-size: 19px;
         }
         .ex-py {
            font-size: 14px;
            margin-top: 2px;
         }
         .ex-fr {
            font-size: 14px;
            color: var(--ink-soft);
            font-style: italic;
            margin-top: 2px;
         }
         .note {
            margin-top: 12px;
            font-size: 13.5px;
            color: var(--ink-soft);
            background: var(--card-2);
            border: 1.5px dashed var(--gold);
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 100%;
            text-align: left;
         }
         .acts {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
         }
         .act {
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 13.5px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .act.on {
            background: var(--lacquer);
            border-color: var(--lacquer);
            color: var(--card);
         }
         .act.on.jade {
            background: var(--jade);
            border-color: var(--jade);
         }
         .verdict {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            padding: 8px 16px;
            border-radius: 999px;
         }
         .verdict.ok {
            background: rgba(46, 107, 87, 0.14);
            color: var(--jade);
         }
         .verdict.ko {
            background: rgba(158, 43, 37, 0.12);
            color: var(--lacquer);
         }
         .verdict span {
            font-weight: 400;
            font-size: 14px;
         }
         .s-foot {
            display: flex;
            gap: 10px;
            margin-top: 14px;
         }
         .s-foot .btn {
            flex: 1;
         }
         .s-foot .btn.ghost {
            flex: 0 0 auto;
         }
         .grades {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 14px;
         }
         .gr {
            border-radius: 12px;
            padding: 10px 4px 8px;
            color: #f6efdd;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s;
         }
         .gr:active {
            transform: scale(0.95);
         }
         .gr small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            opacity: 0.85;
            margin-top: 1px;
         }
         .gr.again {
            background: var(--lacquer);
         }
         .gr.hard {
            background: var(--gold);
         }
         .gr.good {
            background: var(--jade);
         }
         .gr.easy {
            background: var(--ink);
         }
         .g-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
         }
         .w-lab {
            font-size: 12.5px;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--ink-faint);
            margin-bottom: 10px;
            font-weight: 600;
         }
         .w-in {
            width: 100%;
            max-width: 340px;
            margin-top: 18px;
         }
         .w-in .search {
            text-align: center;
            font-size: 18px;
         }
         .w-note {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);
            min-height: 1.2em;
         }
         .t-btns {
            display: flex;
            gap: 10px;
            margin-top: 12px;
         }

/* ---------- 米字格 ---------- */
         .mizi {
            position: relative;
            width: min(300px, 100%);
            aspect-ratio: 1;
            margin: 14px auto 4px;
            border: 2px solid var(--seal);
            border-radius: 8px;
            overflow: hidden;
            background:
               linear-gradient(
                  45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  -45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  90deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  0deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               var(--card-2);
            box-shadow: inset 0 0 0 1px rgba(158, 43, 37, 0.2);

         .mizi > canvas {

/* ---------- atelier des traits ---------- */
.stroke-workspace {

}
.stroke-tabs {

}
.stroke-tabs [role="tab"]:focus-visible,
.stroke-panel:focus-visible,
.stroke-focus button:focus-visible {
   outline: 3px solid #237a5a;
   outline-offset: 3px;
}
.stroke-tab-panel {

}
.stroke-tab-panel[hidden] {

}
.stroke-tab-panel > input[type="range"] {

}

}
.stroke-gallery-toolbar {
   display: flex;
   align-items: flex-start;
   justify-content: space-between;
   gap: 14px;
   margin: 4px 0 12px;
   color: var(--ink-soft);
   font-size: 13px;
}
.stroke-gallery-settings {
   display: flex;
   flex-wrap: wrap;
   justify-content: flex-end;
   gap: 8px 14px;
}
.stroke-gallery-settings label {

   gap: 6px;
   min-height: 30px;
}
.stroke-gallery-settings input {
   width: 18px;
   height: 18px;
   accent-color: var(--seal);
}
.stroke-gallery {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
   gap: 12px;
}
.stroke-panel {
   position: relative;
   min-width: 0;
   padding: 0;
   overflow: hidden;
   border: 1px solid var(--line);
   border-radius: 11px;
   background: var(--card-2);
   color: var(--ink);
   cursor: zoom-in;
   text-align: left;
}
.stroke-panel:hover {
   border-color: var(--seal);
   box-shadow: 0 7px 18px rgba(23, 20, 15, 0.1);
}
.stroke-panel-number {
   position: absolute;
   z-index: 1;
   top: 8px;
   left: 10px;
   color: var(--seal);
   font: 700 20px var(--ui);
}
.stroke-panel-visual {
   display: block;
   width: 100%;
   aspect-ratio: 1;
}
.stroke-panel-svg {
   display: block;
   width: 100%;
   height: 100%;
}
.stroke-grid-lines > * {
   fill: none;
   stroke: #9f7b39;
   vector-effect: non-scaling-stroke;
}
.stroke-grid-center {
   stroke-width: 0.8;
   stroke-dasharray: 18 15;
   opacity: 0.25;
}
.stroke-grid-diagonal {
   stroke-width: 0.65;
   stroke-dasharray: 14 18;
   opacity: 0.13;
}
.stroke-grid-border {
   stroke-width: 1;
   stroke-dasharray: none;
   opacity: 0.34;
}
.stroke-path {
   stroke: none;
}
.stroke-complete {
   fill: #17140f;
}
.stroke-current {
   fill: #a62520;
}
.stroke-future {
   fill: #d8d5cf;
}
.stroke-ghost {
   fill: #ded8ca;
   opacity: 0.35;
}
.stroke-panel-label {
   display: block;
   padding: 9px 10px 10px;
   border-top: 1px solid var(--line-soft);
   font-size: 12.5px;
   font-weight: 600;
   text-align: center;
}
.stroke-gallery-position {
   display: none;
   padding-top: 9px;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
   text-align: center;
}
.stroke-gallery-error {
   grid-column: 1 / -1;
   padding: 18px;
   border: 1px dashed var(--line);
   border-radius: 10px;
   color: var(--ink-soft);
   text-align: center;
}
.stroke-focus-backdrop {
   position: fixed;
   inset: 0;
   z-index: 120;
   display: grid;
   place-items: center;
   padding: 18px;
   background: rgba(23, 20, 15, 0.68);
}
.stroke-focus {
   width: min(680px, 100%);
   max-height: calc(100dvh - 36px);
   overflow: auto;
   padding: 18px;
   border: 1px solid var(--line);
   border-radius: 18px;

   box-shadow: 0 22px 70px rgba(23, 20, 15, 0.35);
}

.stroke-focus footer {

}

   font-size: 21px;
}
.stroke-focus-close {
   width: 44px;
   height: 44px;
   border: 1px solid var(--line);
   border-radius: 50%;
   background: var(--card-2);
   color: var(--ink);
   font-size: 26px;
   cursor: pointer;
}
.stroke-focus-visual {
   width: min(520px, 100%);
   aspect-ratio: 1;
   margin: 12px auto;
   border-radius: 12px;
   overflow: hidden;
   background: var(--card-2);
}

   min-width: 64px;

}

         .qz-opts {

            flex-wrap: wrap;
            gap: 7px;
         }
         .qz-opts .chip.hz {
            font-family: var(--serif);
            font-size: 16px;
         }
         .qz-opts .chip.ok {
            background: var(--jade);
            border-color: var(--jade);
            color: #fff;
         }
         .qz-opts .chip.ko {
            background: var(--lacquer);
            border-color: var(--lacquer);
            color: #fff;
         }
         .qz-score {
            margin-top: 9px;
            font-size: 13px;
            color: var(--ink-soft);
            font-weight: 600;
         }

/* ---------- parcours ---------- */
.path-page {
   padding-top: 10px;
}

.path-header {
   display: flex;
   align-items: center;
   gap: 14px;
   margin: 6px 0 18px;
}

.path-header .v-t,
.path-level-header .v-t {
   margin: 0;
}

.path-mark {
   display: grid;
   flex: 0 0 54px;
   width: 54px;
   height: 54px;
   place-items: center;
   border-radius: 15px;
   background: var(--seal);
   color: var(--card-2);
   font: 30px var(--serif);
}

.path-continue h3 {
   font-family: var(--disp);
   font-size: 20px;
}

.path-continue p,
.path-level-note {
   color: var(--ink-soft);
}

.path-continue p {
   margin-top: 5px;
}

.path-levels {
   display: grid;
   gap: 10px;
}

.path-level {
   display: flex;
   width: 100%;
   min-height: 88px;
   align-items: center;
   justify-content: space-between;
   gap: 18px;
   padding: 17px 18px;
   text-align: left;
}

.path-level > span:first-child {
   display: flex;
   flex-direction: column;
   min-width: 0;
}

.path-level-title {
   flex: 0 0 auto;
   color: var(--seal);
   font: 600 24px var(--disp);
}

.path-level-order {
   color: var(--ink-faint);
   font-size: 11px;
   letter-spacing: 0.06em;
   text-transform: uppercase;
}

.path-level-note {
   max-width: 290px;
   font-size: 13.5px;
   line-height: 1.35;
   text-align: right;
}

.path-level-note b {
   display: block;
   color: var(--ink);
   font: 600 20px var(--disp);
}

.path-level-header {
   display: flex;
   align-items: center;
   gap: 12px;
   margin: 6px 0 18px;
}

.path-level-header .btn {
   min-height: 44px;
   padding-inline: 8px;
}

.path-loading {
   display: flex;
   min-height: 92px;
   align-items: center;
   justify-content: center;
   gap: 12px;
   color: var(--ink-soft);
}

.path-error {
   padding: 20px;
}

.path-scope-note {
   margin: -8px 0 14px;
   color: var(--ink-faint);
   font-size: 12px;
}

.path-vocabulary {
   overflow: hidden;
}

.path-level-tools {
   display: grid;
   grid-template-columns: minmax(0, 1fr) auto;
   gap: 5px 12px;
   align-items: end;
   padding: 16px;
   border-bottom: 1px solid var(--line-soft);
   background: color-mix(in srgb, var(--card-2) 68%, transparent);
}

.path-level-tools label {
   grid-column: 1 / -1;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
}

.path-filter-count {
   padding-bottom: 10px;
   color: var(--ink-faint);
   font-size: 12px;
   white-space: nowrap;
}

.path-word-list {
   display: grid;
}

.path-word {
   display: grid;
   grid-template-columns: minmax(76px, auto) minmax(0, 1fr) auto;
   gap: 12px;
   align-items: center;
   min-height: 78px;
   padding: 12px 15px;
   border-bottom: 1px solid var(--line-soft);
   text-align: left;
}

.path-word:hover,
.path-word:focus-visible {
   background: var(--card-2);
}

.path-word-hanzi {
   color: var(--ink);
   font: 500 25px var(--serif);
}

.path-word-main {
   display: flex;
   min-width: 0;
   flex-direction: column;
}

.path-word-pinyin {
   font-size: 14px;
}

.path-word-translation {
   overflow-wrap: anywhere;
   color: var(--ink-soft);
   font-size: 13px;
   line-height: 1.35;
}

.path-word-meta {
   margin-top: 3px;
   color: var(--ink-faint);
   font-size: 10.5px;
}

.path-word-badges {
   display: flex;
   max-width: 120px;
   flex-direction: column;
   align-items: flex-end;
   gap: 4px;
}

.hsk-badge,
.path-word-status {
   display: inline-flex;
   align-items: center;
   width: fit-content;
   border: 1px solid color-mix(in srgb, var(--seal) 48%, var(--line));
   border-radius: 999px;
   background: color-mix(in srgb, var(--seal) 9%, var(--card-2));
   color: var(--lacquer);
   font-family: var(--ui);
   font-size: 10.5px;
   font-style: normal;
   font-weight: 600;
   line-height: 1;
   padding: 5px 7px;
   white-space: nowrap;
}

.path-word-status {
   max-width: 120px;
   border-color: var(--line);
   background: var(--card-2);
   color: var(--ink-faint);
   font-size: 9px;
   line-height: 1.15;
   text-align: right;
   white-space: normal;
}

.path-word-status.status-source-only,
.hsk-source-status {
   border-color: color-mix(in srgb, var(--gold) 62%, var(--line));
   color: color-mix(in srgb, var(--gold) 72%, var(--ink));
}

.path-no-results {
   min-height: 180px;
   padding: 36px 20px;
   color: var(--ink-soft);
   text-align: center;
}

.path-more {
   padding: 14px;
   text-align: center;
}

@media (min-width: 700px) {
   .path-levels {
      grid-template-columns: repeat(2, minmax(0, 1fr));
   }
}

@media (max-width: 480px) {
   .path-header {
      align-items: flex-start;
   }

   .path-level {
      min-height: 82px;
      padding: 14px;
   }

   .path-level-title {
      font-size: 22px;
   }

   .path-level-note {
      max-width: 145px;
      font-size: 11.5px;
   }

   .path-level-header {
      align-items: flex-start;
   }

   .path-level-header .muted {
      line-height: 1.3;
   }

   .path-level-tools {
      grid-template-columns: 1fr;
   }

   .path-filter-count {
      padding-bottom: 0;
   }

   .path-word {
      grid-template-columns: minmax(68px, auto) minmax(0, 1fr);
      gap: 10px;
      padding-inline: 12px;
   }

   .path-word-badges {
      grid-column: 2;
      max-width: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
   }

   .path-word-status {
      max-width: none;
      text-align: left;
   }
}

/* ---------- sheet, toast, nav ---------- */
         #sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(23, 20, 15, 0.45);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
         }
         #sheet.open {
            opacity: 1;
            pointer-events: auto;
         }
         .sheet-card {
            width: 100%;
            max-width: 560px;
            max-height: 86dvh;
            overflow: auto;
            background: var(--paper-2);
            border-radius: 20px 20px 0 0;
            border: 1px solid var(--line);
            border-bottom: none;
            padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
            transform: translateY(30px);
            transition: transform 0.22s;
         }
         #sheet.open .sheet-card {
            transform: none;
         }
         .sh-t {
            font-family: var(--disp);
            font-size: 21px;
            margin-bottom: 8px;
         }
         .sh-p {
            font-size: 14.5px;
            color: var(--ink-soft);
         }
         .sh-note {
            font-size: 13px;
            color: var(--ink-faint);
            margin-top: 12px;
         }
         .sh-btns {
            display: flex;
            gap: 9px;
            margin-top: 16px;
            flex-wrap: wrap;
         }
         .sh-btns .btn {
            flex: 1;
         }
         .delay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
         }
         .delay-grid .btn {
            margin: 0;
         }
         .dl-custom {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .dl-custom .search {
            flex: 1;
         }
         .pk-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line-soft);
         }
         .pk-info b {
            display: block;
            font-size: 15px;
         }
         .pk-info span {
            font-size: 12.5px;
            color: var(--ink-faint);
         }
         .pk-btns {
            display: flex;
            gap: 6px;
         }
         .pk-new {
            display: flex;
            gap: 8px;
            margin-top: 14px;
         }
         .pk-new .search {
            flex: 1;
         }
         .cd-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
         }
         .cd-hz {
            font-family: var(--serif);
            font-size: 52px;
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
         }
         .cd-py {
            font-size: 19px;
            margin-top: 2px;
         }
         .cd-fr {
            font-family: var(--disp);
            font-size: 20px;
            margin-top: 4px;
         }
         .cd-cat {
            display: inline-block;
            margin-top: 8px;
            margin-right: 6px;
            font-size: 12.5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--ink-soft);
         }
         .cd-status {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);
         }
         pre.fmt {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 13px;
            font-size: 12.5px;
            overflow: auto;
            line-height: 1.5;
            margin: 10px 0 4px;
         }
         #toast {
            position: fixed;
            left: 50%;
            bottom: calc(96px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(16px);
            background: var(--ink);
            color: var(--card);
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            z-index: 60;
            max-width: 88vw;
            text-align: center;
         }
         #toast.show {
            opacity: 1;
            transform: translateX(-50%);
         }
         .nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            justify-content: space-around;
            background: color-mix(in srgb, var(--card) 92%, transparent);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
         }
         .nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 10px;
            border-radius: 11px;
            color: var(--ink-faint);
            min-width: 58px;
         }
         .nav .n-hz {
            font-family: var(--serif);
            font-size: 21px;
            line-height: 1.2;
         }
         .nav .n-lab {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
         }
         .nav button[aria-pressed="true"] {
            color: var(--lacquer);
         }

         /* ---------- vides, résumé, erreurs ---------- */
         .empty {
            text-align: center;
            padding: 34px 20px;
         }
         .empty-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--line);
            line-height: 1;
         }
         .empty-t {
            font-family: var(--disp);
            font-size: 22px;
            margin-top: 10px;
         }
         .empty-p {
            color: var(--ink-soft);
            font-size: 14.5px;
            max-width: 380px;
            margin: 8px auto 0;
         }
         .empty-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 18px;
            align-items: center;
         }
         .empty-btns .btn {
            width: min(300px, 100%);
         }
         .summary {
            text-align: center;
            padding: 32px 22px;
         }
         .sum-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--lacquer);
            line-height: 1;
         }
         .sum-t {
            font-family: var(--disp);
            font-size: 24px;
            margin: 10px 0 14px;
         }
         .sum-rows {
            max-width: 310px;
            margin: 0 auto 16px;
         }
         .sum-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 15px;
         }
         .sum-row b {
            font-family: var(--disp);
            font-size: 17px;
         }
         .err-list {
            text-align: left;
            max-width: 340px;
            margin: 6px auto 16px;
            max-height: 190px;
            overflow: auto;
            border: 1px solid var(--line-soft);
            border-radius: 11px;
            padding: 4px 12px;
            background: var(--card-2);
         }
         .err-row {
            display: flex;
            gap: 10px;
            padding: 7px 2px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13.5px;
            align-items: baseline;
         }
         .err-row:last-child {
            border-bottom: none;
         }
         .err-row b {
            font-family: var(--serif);
            font-size: 19px;
            font-weight: 600;
            flex: none;
         }
         .err-row span {
            color: var(--ink-soft);
         }
         .sum-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            align-items: center;
         }
         .sum-btns .btn {
            width: min(300px, 100%);
            margin: 0;
         }

/* ---------- animations & desktop ---------- */
         @keyframes inkIn {
            from {
               filter: blur(7px);
               opacity: 0;
               transform: scale(1.04);
            }
            to {
               filter: blur(0);
               opacity: 1;
               transform: none;
            }
         }
         .ink-in {
            animation: inkIn 0.45s ease-out both;
         }
         @media (prefers-reduced-motion: reduce) {
            * {
               animation: none !important;
               transition: none !important;
            }
         }
         @media (min-width: 900px) {
            #view {
               max-width: 820px;
            }
            .nav {
               left: 50%;
               right: auto;
               transform: translateX(-50%);
               width: 820px;
               max-width: 96vw;
               border: 1px solid var(--line);
               border-bottom: none;
               border-radius: 16px 16px 0 0;
            }
            #lib-list {
               display: grid;
               grid-template-columns: 1fr 1fr;
               gap: 0 26px;
               align-items: start;
            }
            .flash {
               min-height: 390px;
            }
            .opts {
               grid-template-columns: repeat(4, 1fr);
            }
            #sheet {
               align-items: center;
            }
            .sheet-card {
               border-radius: 20px;
               border-bottom: 1px solid var(--line);
               max-height: 82dvh;
            }
            .hero-hz {
               font-size: 66px;
            }
         }

   "i", "ia", "ian", "iang", "iao", "ie", "in", "ing", "iong", "iu",
   "u", "ua", "uai", "uan", "uang", "ui", "un", "uo",

      entries.length !== expected ||
      entries.some((entry) => entry.firstHskLevel !== numericLevel)
   ) {
      throw new Error(`Fragment HSK ${numericLevel} incohérent.`);
   }
   hskDataState.levels.set(numericLevel, entries);
   indexHskEntries(entries);
   return entries;
}

function hskMetadata(entry) {
   return {
      hskEntryId: entry.hskEntryId,
      level: entry.firstHskLevel,
      firstHskLevel: entry.firstHskLevel,
      sourceLevels: entry.sourceLevels,
      sourcePinyin: entry.pinyin,
      sourceTranslation: entry.sourceTranslation,
      partOfSpeech: entry.partOfSpeech,
      dictionaryLinkStatus: entry.dictionaryLinkStatus,
      baseDictionaryLinkStatus: entry.baseDictionaryLinkStatus,
      senseId: entry.senseId,
   };
}

function verifiedHskLevels(entry) {
   return Array.from(
      new Set(
         (Array.isArray(entry && entry.hskVerified) ? entry.hskVerified : [])
            .map((item) => Number(item.firstHskLevel ?? item.level))
            .filter((level) => Number.isInteger(level) && level >= 1 && level <= 6),
      ),
   ).sort((left, right) => left - right);
}

function hskLinkStatusLabel(status) {
   if (status === "source-only") return "Données HSK source";
   if (status === "ambiguous") return "Liaison dictionnaire ambiguë";
   if (status === "normalized-pinyin") return "Pinyin normalisé";
   if (status === "duplicate-sense") return "Sens HSK distinct";
   return "Liaison exacte";
}

function attachHskMetadata(dictionaryEntry, explicitEntries) {
   if (!dictionaryEntry) return dictionaryEntry;
   const linked = explicitEntries || hskDataState.entriesByDictionaryId.get(dictionaryEntry.id) || [];
   if (linked.length) dictionaryEntry.hskVerified = linked.map(hskMetadata);
   return dictionaryEntry;
}

function hskSourceAsDictionaryEntry(entry) {
   const marked = normalizeVisibleWhitespace(entry.pinyin);
   const isFrenchSource = entry.firstHskLevel === 1;
   return {
      id: entry.hskEntryId,
      simplified: entry.chinese,
      traditional: entry.chinese,
      entryType: Array.from(entry.chinese).length === 1 ? "character" : "word",
      pinyin: marked
         ? [
              {
                 marked,
                 numbered: entry.selectedDictionaryPronunciation?.numbered || "",
                 plain: normalizePinyinPlain(entry.pinyin),
              },
           ]
         : [],
      definitionsFr: isFrenchSource && entry.sourceTranslation ? [entry.sourceTranslation] : [],
      definitionsEn: !isFrenchSource && entry.sourceTranslation ? [entry.sourceTranslation] : [],
      sources: ["Liste HSK source"],
      sourceRefs: [],
      hskLegacy: [],
      hsk30: [],
      hskVerified: [hskMetadata(entry)],
      frequencyRank: null,
      characters: Array.from(entry.chinese).filter((character) => HAN_PATTERN.test(character)),
      dictionaryEntryId: entry.dictionaryEntryId,
      dictionaryLinkStatus: entry.dictionaryLinkStatus,
      hskSourceEntry: entry,
      __hskSource: true,
   };
}

function hskEntryMatchesQuery(entry, query) {
   if (!query || !query.valid) return false;
   if (query.type.startsWith("hanzi"))
      return entry.chinese.includes(query.hanzi);
   if (query.type.startsWith("pinyin")) {
      const plain = normalizePinyinPlain(entry.pinyin);
      return plain === query.plain || plain.startsWith(query.plain);
   }
   if (query.type === "translation") {
      const translation = normalizeTranslation(entry.sourceTranslation);
      return query.tokens.every((token) =>
         translation.split(" ").some((word) => word === token || word.startsWith(token)),
      );
   }
   return false;
}

function compareHskSourceMatches(left, right, query) {
   const leftExact = query.type.startsWith("hanzi") && left.chinese === query.hanzi;
   const rightExact = query.type.startsWith("hanzi") && right.chinese === query.hanzi;
   return (
      Number(rightExact) - Number(leftExact) ||
      left.firstHskLevel - right.firstHskLevel ||
      left.chinese.localeCompare(right.chinese, "zh") ||
      left.hskEntryId.localeCompare(right.hskEntryId)
   );
}

async function searchHskEntries(rawQuery, limit) {
   const entries = await loadHskSearchIndex();
   const query = classifySearchQuery(rawQuery);
   if (!query.valid) return [];
   return entries
      .filter((entry) => hskEntryMatchesQuery(entry, query))
      .sort((left, right) => compareHskSourceMatches(left, right, query))
      .slice(0, limit || HSK_RESULT_LIMIT);
}

async function mergeHskSearchResults(response, rawQuery) {
   if (!response || !response.query || !response.query.valid) return response;
   const matches = await searchHskEntries(rawQuery, HSK_RESULT_LIMIT);
   const results = response.results || [];
   const dictionaryResultsById = new Map();
   results.forEach((item) => {
      attachHskMetadata(item.entry);
      dictionaryResultsById.set(item.entry.id, item);
   });

   const addedHskIds = new Set();
   for (const hskEntry of matches) {
      const dictionaryResult = hskEntry.dictionaryEntryId
         ? dictionaryResultsById.get(hskEntry.dictionaryEntryId)
         : null;
      if (dictionaryResult) {
         attachHskMetadata(
            dictionaryResult.entry,
            hskDataState.entriesByDictionaryId.get(hskEntry.dictionaryEntryId),
         );
         continue;
      }
      if (addedHskIds.has(hskEntry.hskEntryId)) continue;
      addedHskIds.add(hskEntry.hskEntryId);
      const entry = hskSourceAsDictionaryEntry(hskEntry);
      results.push({
         entry,
         rank: rankDictionaryEntry(entry, response.query, {
            englishFallback: response.englishFallback || hskEntry.firstHskLevel > 1,
         }),
      });
   }

   results.forEach((item) => {
      item.rank = rankDictionaryEntry(item.entry, response.query, {
         englishFallback: response.englishFallback || !!item.entry.__hskSource,
      });
   });
   results.sort(compareRankedDictionaryEntries);
   response.results = results;
   response.hskMatches = matches.length;
   return response;
}

async function loadHskEntryById(hskEntryId) {
   if (hskDataState.entriesById.has(hskEntryId))
      return hskDataState.entriesById.get(hskEntryId);
   await loadHskSearchIndex();
   return hskDataState.entriesById.get(hskEntryId) || null;
}

async function loadHskSearchDetailEntry(entryId) {
   if (!String(entryId).startsWith("hsk:")) {
      const dictionaryEntry = await loadDictionaryEntryById(entryId);
      return attachHskMetadata(dictionaryEntry);
   }
   const hskEntry = await loadHskEntryById(entryId);
   return hskEntry ? hskSourceAsDictionaryEntry(hskEntry) : null;
}

async function openHskVocabularyEntry(entry) {
   if (entry.dictionaryEntryId) {
      try {
         const dictionaryEntry = await loadDictionaryEntryById(entry.dictionaryEntryId);
         if (dictionaryEntry) {
            openDictDetail(attachHskMetadata(dictionaryEntry, [entry]));
            return;
         }
      } catch (error) {
         /* La fiche HSK source reste disponible si le dictionnaire détaillé échoue. */
      }
   }
   openDictDetail(hskSourceAsDictionaryEntry(entry));
}

         // intervalles par niveau : 10 min, 1 j, 3 j, 7 j, 14 j, 30 j, 60 j, 120 j
         const INTERVALS = [
            600e3,
            86400e3,
            3 * 86400e3,
            7 * 86400e3,
            14 * 86400e3,
            30 * 86400e3,
            60 * 86400e3,
            120 * 86400e3,
         ];
         const MAXLVL = INTERVALS.length - 1;
         function fmtIv(ms) {
            if (ms < 3600e3) return Math.round(ms / 60e3) + " min";
            if (ms < 47 * 3600e3) return "1 j";
            return Math.round(ms / 86400e3) + " j";
         }
         function gradeIv(c) {
            // aperçu de l'intervalle pour chaque bouton, selon le niveau actuel de la carte
            const lvl = c.lvl || 0;
            return {
               again: INTERVALS[0],
               hard: INTERVALS[1],
               good: INTERVALS[Math.min(MAXLVL, Math.max(2, lvl + 1))],
               easy: INTERVALS[Math.min(MAXLVL, Math.max(3, lvl + 2))],
            };
         }
         function applyGrade(c, g) {
            const iv = gradeIv(c);
            if (g === "again") c.lvl = 0;
            else if (g === "hard") c.lvl = 1;
            else if (g === "good")
               c.lvl = Math.min(MAXLVL, Math.max(2, (c.lvl || 0) + 1));
            else c.lvl = Math.min(MAXLVL, Math.max(3, (c.lvl || 0) + 2));
            c.due = now() + iv[g];
            if (g === "again" || g === "hard") c.acquired = false;
            save();
         }

         function smartQueue() {
            const pool = db.cards.filter((c) => !c.acquired);
            const due = pool.filter(isDue).sort((a, b) => a.due - b.due);
            const fresh = pool.filter((c) => c.due == null).sort(unitSort);
            const size = db.settings.sessionSize; // 0 = tout
            const newTake = Math.min(db.settings.newPerSession, fresh.length);
            let dueTake = size > 0 ? Math.max(0, size - newTake) : due.length;
            dueTake = Math.min(dueTake, due.length);
            let q = due.slice(0, dueTake).concat(fresh.slice(0, newTake));
            if (size > 0) q = q.slice(0, size);
            const planned = pool
               .filter((c) => c.due != null && c.due > now())
               .sort((a, b) => a.due - b.due);
            return {
               q: shuffle(q),
               dueN: Math.min(due.length, dueTake),
               dueTotal: due.length,
               freshN: Math.min(
                  newTake,
                  Math.max(0, size > 0 ? size : Infinity),
               ),
               freshUnit: fresh.length ? fresh[0].unit : null,
               nextDue: planned.length ? planned[0].due : null,
            };

"use strict";

/* ================= parcours HSK (学) ================= */
const PATH_PAGE_SIZE = 80;
let openPathLevel = null;
let pathRenderToken = 0;
let pathLevelEntries = [];
let pathLevelFilter = "";
let pathLevelVisible = PATH_PAGE_SIZE;

function pathLevelCount(manifest, level) {
   return Number(manifest.countsByFirstHskLevel[level] || 0);
}

function pathLevelCardHtml(manifest, level) {
   const count = pathLevelCount(manifest, level);
   return (
      '<button class="card path-level" type="button" data-path-level="' +
      level +
      '" data-path-level-count="' +
      count +
      '"><span><span class="path-level-title">HSK ' +
      level +
      '</span><span class="path-level-order">Premier niveau HSK</span></span>' +
      '<span class="path-level-note"><b>' +
      count.toLocaleString("fr-FR") +
      "</b> entrées de vocabulaire</span></button>"
   );
}

function wirePathHome() {
   document.querySelectorAll("[data-path-level]").forEach((button) => {
      button.onclick = () => {
         openPathLevel = Number(button.dataset.pathLevel);
         pathLevelFilter = "";
         pathLevelVisible = PATH_PAGE_SIZE;
         renderPath();
         window.scrollTo(0, 0);
      };
   });
}

async function renderPathHome(token) {
   const root = $("view");
   root.innerHTML =
      '<section class="path-page" aria-labelledby="path-title">' +
      '<header class="path-header"><div class="path-mark">学</div><div><h2 class="v-t" id="path-title">学 · Parcours</h2>' +
      '<p class="muted">Vocabulaire officiel HSK 1 à 6, classé par premier niveau.</p></div></header>' +
      '<section class="card pad path-loading" role="status"><span class="ink-loader" aria-hidden="true"></span><span>Chargement des niveaux HSK…</span></section></section>';
   try {
      const manifest = await loadHskManifest();
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel != null) return;
      root.innerHTML =
         '<section class="path-page" aria-labelledby="path-title">' +
         '<header class="path-header"><div class="path-mark">学</div><div><h2 class="v-t" id="path-title">学 · Parcours</h2>' +
         '<p class="muted">Vocabulaire officiel HSK 1 à 6, classé par premier niveau.</p></div></header>' +
         '<section class="card pad path-continue" aria-labelledby="path-continue-title">' +
         '<h3 id="path-continue-title">Explorer le vocabulaire HSK</h3>' +
         '<p><b>' +
         manifest.totalEntries.toLocaleString("fr-FR") +
         " entrées</b> disponibles. Les leçons et exercices ne sont pas encore créés.</p></section>" +
         '<div class="path-levels" aria-label="Niveaux HSK">' +
         [1, 2, 3, 4, 5, 6].map((level) => pathLevelCardHtml(manifest, level)).join("") +
         "</div></section>";
      wirePathHome();
   } catch (error) {
      if (token !== pathRenderToken) return;
      root.innerHTML =
         '<section class="path-page"><header class="path-header"><div class="path-mark">学</div><div><h2 class="v-t" id="path-title">学 · Parcours</h2></div></header>' +
         '<section class="card pad path-error" role="alert"><b>Données HSK indisponibles.</b><p>' +
         esc(error.message) +
         '</p><button class="btn" id="path-retry" type="button">Réessayer</button></section></section>';
      $("path-retry").onclick = () => renderPath();
   }
}

function pathStatusBadge(entry) {
   const status = entry.dictionaryLinkStatus;
   if (!["ambiguous", "source-only", "duplicate-sense"].includes(status)) return "";
   return (
      '<span class="path-word-status status-' +
      esc(status) +
      '">' +
      esc(hskLinkStatusLabel(status)) +
      "</span>"
   );
}

function pathVocabularyRowHtml(entry, index) {
   const sourceLevels = Array.isArray(entry.sourceLevels) ? entry.sourceLevels : [];
   return (
      '<button class="path-word" type="button" data-path-word-index="' +
      index +
      '" data-hsk-entry-id="' +
      esc(entry.hskEntryId) +
      '"><span class="path-word-hanzi">' +
      esc(entry.chinese) +
      '</span><span class="path-word-main"><span class="path-word-pinyin">' +
      colorPinyin(entry.pinyin) +
      '</span><span class="path-word-translation">' +
      esc(entry.sourceTranslation) +
      "</span>" +
      (entry.partOfSpeech || sourceLevels.length > 1
         ? '<small class="path-word-meta">' +
           (entry.partOfSpeech ? esc(entry.partOfSpeech) : "") +
           (entry.partOfSpeech && sourceLevels.length > 1 ? " · " : "") +
           (sourceLevels.length > 1 ? "niveaux source " + sourceLevels.map(esc).join(", ") : "") +
           "</small>"
         : "") +
      '</span><span class="path-word-badges"><span class="hsk-badge hsk-level-' +
      entry.firstHskLevel +
      '" data-hsk-badge="' +
      entry.firstHskLevel +
      '">HSK ' +
      entry.firstHskLevel +
      "</span>" +
      pathStatusBadge(entry) +
      "</span></button>"
   );
}

function filteredPathEntries() {
   const visible = normalizeVisibleWhitespace(pathLevelFilter).toLowerCase();
   if (!visible) return pathLevelEntries;
   const plain = normalizePinyinPlain(visible);
   const translation = normalizeTranslation(visible);
   return pathLevelEntries.filter(
      (entry) =>
         entry.chinese.includes(visible) ||
         (plain && normalizePinyinPlain(entry.pinyin).includes(plain)) ||
         (translation && normalizeTranslation(entry.sourceTranslation).includes(translation)),
   );
}

function wirePathVocabulary(filtered) {
   const search = $("path-level-search");
   if (search) {
      search.oninput = () => {
         pathLevelFilter = search.value;
         pathLevelVisible = PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
   }
   document.querySelectorAll("[data-path-word-index]").forEach((button) => {
      button.onclick = async () => {
         const entry = filtered[Number(button.dataset.pathWordIndex)];
         if (!entry) return;
         openSheet(
            '<div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de la fiche…</b></div>',
         );
         await openHskVocabularyEntry(entry);
      };
   });
   if ($("path-show-more"))
      $("path-show-more").onclick = () => {
         pathLevelVisible += PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
}

function renderPathVocabulary() {
   const target = $("path-vocabulary");
   if (!target) return;
   const filtered = filteredPathEntries();
   const visible = filtered.slice(0, pathLevelVisible);
   target.innerHTML =
      '<div class="path-level-tools"><label for="path-level-search">Filtrer ce niveau</label>' +
      '<input class="search" id="path-level-search" type="search" placeholder="汉字, pinyin ou traduction…" value="' +
      esc(pathLevelFilter) +
      '"><span class="path-filter-count" aria-live="polite">' +
      filtered.length.toLocaleString("fr-FR") +
      (filtered.length > 1 ? " entrées" : " entrée") +
      "</span></div>" +
      (visible.length
         ? '<div class="path-word-list" data-path-word-list>' +
           visible.map(pathVocabularyRowHtml).join("") +
           "</div>"
         : '<div class="path-no-results"><p>Aucun mot dans ce niveau pour cette recherche.</p></div>') +
      (visible.length < filtered.length
         ? '<div class="path-more"><button class="btn ghost" id="path-show-more" type="button">Afficher ' +
           Math.min(PATH_PAGE_SIZE, filtered.length - visible.length).toLocaleString("fr-FR") +
           " entrées de plus</button></div>"
         : "");
   const search = $("path-level-search");
   if (search && pathLevelFilter) {
      search.focus({ preventScroll: true });
      search.setSelectionRange(search.value.length, search.value.length);
   }
   wirePathVocabulary(filtered);
}

function renderPathLevelFrame(level, count) {
   $("view").innerHTML =
      '<section class="path-page path-level-page" aria-labelledby="path-level-title">' +
      '<header class="path-level-header"><button class="btn ghost" id="path-level-back" type="button">← Retour</button>' +
      '<div><h2 class="v-t" id="path-level-title">HSK ' +
      level +
      '</h2><p class="muted"><span data-path-current-count>' +
      count.toLocaleString("fr-FR") +
      "</span> entrées classées par <code>firstHskLevel</code></p></div></header>" +
      '<p class="path-scope-note">Vocabulaire uniquement · aucune leçon ni aucun exercice.</p>' +
      '<section class="card path-vocabulary" id="path-vocabulary"><div class="path-loading" role="status"><span class="ink-loader"></span><span>Chargement du vocabulaire…</span></div></section></section>';
   $("path-level-back").onclick = () => {
      openPathLevel = null;
      pathLevelEntries = [];
      pathLevelFilter = "";
      renderPath();
      window.scrollTo(0, 0);
   };
}

async function renderPathLevel(level, token) {
   try {
      const manifest = await loadHskManifest();
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      renderPathLevelFrame(level, pathLevelCount(manifest, level));
      const entries = await loadHskLevel(level);
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      pathLevelEntries = entries;
      renderPathVocabulary();
   } catch (error) {
      if (token !== pathRenderToken) return;
      const target = $("path-vocabulary");
      if (target)
         target.innerHTML =
            '<div class="path-error" role="alert"><b>Vocabulaire indisponible.</b><p>' +
            esc(error.message) +
            '</p><button class="btn" id="path-level-retry">Réessayer</button></div>';
      if ($("path-level-retry")) $("path-level-retry").onclick = () => renderPath();
   }
}

function renderPath() {
   document.body.classList.remove("in-seq");
   const token = ++pathRenderToken;
   if (openPathLevel == null) renderPathHome(token);
   else renderPathLevel(openPathLevel, token);
}

         const currentCard = () => session.cards[session.index];

                  ok: null,
                  front: null,

         function frontOf(c, st) {
            // recto de la carte : zh ou fr, stable pendant toute la séance
            if (st.front) return st.front;
            const d = db.settings.direction;
            st.front =
               d === "mix"
                  ? Math.random() < 0.5
                     ? "zh"
                     : "fr"
                  : d === "fr2zh"
                    ? "fr"
                    : "zh";
            return st.front;

         function pickWriteTask(c) {
            // choisit une tâche écrite selon les réglages et le sens de révision
            const wm = db.settings.writeModes;
            const d = db.settings.direction;
            const zhSide = d === "zh2fr" || d === "mix";
            const frSide = d === "fr2zh" || d === "mix";
            const canTrace =
               Array.from(c.hz).some((ch) => /[\u4e00-\u9fff]/.test(ch)) &&
               c.hz.length <= 3;
            const opts = [];
            if (wm.fr && zhSide) opts.push("fr");
            if (wm.pinyin && zhSide && c.py) opts.push("py-read");
            if (wm.pinyin && frSide && c.py) opts.push("py-prod");
            if (wm.trace && frSide && canTrace) opts.push("trace");
            if (!opts.length) {
               if (wm.fr) opts.push("fr");
               if (wm.pinyin && c.py) opts.push("py-read");
               if (wm.trace && canTrace) opts.push("trace");
            }
            if (!opts.length) opts.push("fr");
            return opts[Math.floor(Math.random() * opts.length)];
         }

         function sessionFooterHtml(c, st) {
            const last = session.index >= session.cards.length - 1;
            if (session.mode === "discover") {
               return (
                  '<div class="s-foot">' +
                  '<button class="btn ghost" id="s-prev"' +
                  (session.index === 0 ? " disabled" : "") +

               return '<div class="s-foot"><button class="btn primary big" id="s-flip">Retourner</button></div>';

               return '<div class="s-foot"><button class="btn ghost" id="s-skip">Voir la réponse</button><button class="btn primary" id="s-check">Vérifier</button></div>';
            // verso (cartes) ou réponse vérifiée (écrit) : boutons de notation SRS

         function renderSession() {
            const c = currentCard();
            if (!c) {
               endSession();

            }

            if (session.mode === "written" && !st.task)
               st.task = pickWriteTask(c);

            const showPyBack = db.settings.pinyin !== "never";

               (session.mode === "cards" && front === "fr" && !st.revealed) ||
               (session.mode === "written" &&
                  !st.checked &&
                  st.task === "py-prod");

            let body = "";
            if (session.mode === "written" && !st.checked) {
               body = writtenPromptHtml(c, st);
            } else if (session.mode === "cards" && !st.revealed) {

                  front === "zh"
                     ? '<div class="hanzi ink-in" data-say="' +
                       esc(c.hz) +
                       '">' +
                       esc(c.hz) +

                          ? '<div class="pinyin">' +

                     '<div class="verdict ' +

                     '">' +

                     "</div>";

                  verdict +

                  esc(c.hz) +

                     ? '<div class="pinyin">' + colorPinyin(c.py) + "</div>"

                  "</div>" +

            const modeName = {

            $("view").innerHTML =

               (((session.index + 1) / session.cards.length) * 100).toFixed(1) +
               '%"></i></div>' +
               '<div class="flash card" id="flash">' +
               '<button class="seal fl-seal" data-say="' +
               esc(c.hz) +
               '"' +
               (hideSay ? ' style="visibility:hidden"' : "") +
               ' aria-label="Écouter">听</button>' +
