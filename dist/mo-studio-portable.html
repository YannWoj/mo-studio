<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover"
      />
      <meta name="theme-color" content="#DED2BA" />
      <title>墨室 · Mò Studio</title>
      <link
         rel="icon"
         href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%239E2B25'/%3E%3Ctext%20x='50'%20y='70'%20font-size='56'%20text-anchor='middle'%20fill='%23EFE7D3'%20font-family='serif'%3E墨%3C/text%3E%3C/svg%3E"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <style>
/* ============ Mò Studio v4 — encre, papier de riz, laque ============ */
         :root {
            --paper: #ded2ba;
            --paper-2: #e7ddc9;
            --card: #efe7d3;
            --card-2: #f4eddd;
            --ink: #17140f;
            --ink-soft: #4a4132;
            --ink-faint: #7a7061;
            --line: #c9bca0;
            --line-soft: #d8ccb0;
            --lacquer: #9e2b25;
            --seal: #c0392b;
            --gold: #a8873a;
            --jade: #2e6b57;
            --t1: #b0392f;
            --t2: #b5822a;
            --t3: #2e6b57;
            --t4: #2f5480;
            --t5: #7a7061;
            --r: 14px;
            --shadow: 0 10px 30px rgba(23, 20, 15, 0.13);
            --serif: "Noto Serif SC", "Songti SC", serif;
            --disp: "EB Garamond", Georgia, serif;
            --ui: "IBM Plex Sans", system-ui, sans-serif;
         }
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }
         body,
         body * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
         }
         body input,
         body textarea,
         body [contenteditable]:not([contenteditable="false"]),
         body [contenteditable]:not([contenteditable="false"]) *,
         body .cd-hz,
         body .cd-py,
         body .cd-py *,
         body .cd-fr,
         body .cd-fr *,
         body .dd-traditional,
         body .dd-definitions,
         body .dd-definitions p,
         body .dd-definitions ol,
         body .dd-definitions li,
         body .dd-definitions li *,
         body .dd-character-detail-hanzi,
         body .dd-character-detail-pinyin,
         body .dd-character-detail-pinyin *,
         body .dd-character-detail-translation,
         body .dd-related,
         body .dict-result-hanzi b,
         body .dict-result-main .row-py,
         body .dict-result-main .row-py *,
         body .dict-result-main .row-fr,
         body .dict-result-main .row-fr *,
         body .row-hz,
         body .row-py,
         body .row-py *,
         body .row-fr,
         body .row-fr *,
         body .hanzi,
         body .hanzi *,
         body .pinyin,
         body .pinyin *,
         body .fr,
         body .fr *,
         body .ex,
         body .ex *,
         body .note,
         body .note *,
         body .fmt,
         body .g-body,
         body .gx-hz,
         body .gx-hz *,
         body .gx-py,
         body .gx-py *,
         body .gx-fr,
         body .gx-fr *,
         body .qz-q,
         body .qz-q * {
            user-select: text;
            -webkit-user-select: text;
            -webkit-touch-callout: default;
         }
         body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--ui);
            font-size: 16px;
            line-height: 1.5;
            min-height: 100dvh;
            padding-bottom: calc(86px + env(safe-area-inset-bottom));
            overflow-x: hidden;
         }
         body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.55%200%200%200%200%200.48%200%200%200%200%200.36%200%200%200%200.05%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23n)'/%3E%3C/svg%3E");
         }
         button {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
         }
         button:focus-visible,
         a:focus-visible,
         input:focus-visible,
         select:focus-visible,
         textarea:focus-visible,
         summary:focus-visible,
         [tabindex]:focus-visible {
            outline: 3px solid var(--jade);
            outline-offset: 3px;
         }
         input,
         select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
         }
         h2,
         h3 {
            margin: 0;
            font-weight: 600;
         }
         p {
            margin: 0.4em 0;
         }
         [hidden] {
            display: none !important;
         }

         /* ---------- header & layout ---------- */
         .top {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 10px;
            background: linear-gradient(var(--paper) 75%, transparent);
         }
         .brand {
            display: flex;
            align-items: center;
            gap: 10px;
         }
         .brand-seal {
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--lacquer);
            color: var(--card);
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 10px rgba(158, 43, 37, 0.35);
         }
         .brand-name {
            font-family: var(--disp);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.02em;
         }
         .seal-btn {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            background: var(--card);
            border: 1.5px solid var(--lacquer);
            color: var(--lacquer);
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 600;
            transform: rotate(2deg);
            transition: transform 0.15s;
         }
         .seal-btn:active {
            transform: rotate(2deg) scale(0.93);
         }
         .seal-btn.add {
            transform: rotate(-2deg);
         }
         #view {
            max-width: 560px;
            margin: 0 auto;
            padding: 4px 16px 24px;
         }
         .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            position: relative;
         }
         .pad {
            padding: 20px 18px;
            margin-bottom: 16px;
         }
         .v-t {
            font-family: var(--disp);
            font-size: 24px;
            margin-bottom: 6px;
         }
         .eyebrow {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--ink-faint);
            margin: 16px 0 8px;
            font-weight: 600;
         }
         .muted {
            color: var(--ink-soft);
            font-size: 14.5px;
         }

         /* ---------- hero, CTA, stats ---------- */
         .hero {
            text-align: center;
            padding: 12px 0 4px;
         }
         .hero-hz {
            font-family: var(--serif);
            font-size: 58px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 0.08em;
         }
         .hero-sub {
            font-family: var(--disp);
            font-style: italic;
            color: var(--ink-soft);
            margin-top: 2px;
         }
         .cta {
            display: block;
            width: 100%;
            text-align: left;
            margin: 14px 0 10px;
            background: var(--lacquer);
            color: #f6efdd;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 8px 22px rgba(158, 43, 37, 0.32);
            transition:
               transform 0.12s,
               opacity 0.15s;
         }
         .cta:active {
            transform: scale(0.98);
         }
         .cta:disabled {
            opacity: 0.6;
            pointer-events: none;
         }
         .cta b {
            display: block;
            font-family: var(--disp);
            font-size: 21px;
            letter-spacing: 0.01em;
         }
         .cta span {
            display: block;
            font-size: 13.5px;
            opacity: 0.92;
            margin-top: 3px;
         }
         .cta .u-line {
            display: block;
            font-size: 12.5px;
            opacity: 0.78;
            margin-top: 7px;
            font-style: italic;
         }
         .resume {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--card);
            border: 1.5px dashed var(--gold);
            border-radius: 13px;
            padding: 11px 14px;
            margin: 12px 0 2px;
         }
         .resume span {
            font-size: 14px;
            color: var(--ink-soft);
         }
         .resume .btn {
            margin: 0;
         }
         .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 4px 8px;
            text-align: center;
            transition: transform 0.1s;
         }
         .stat b {
            display: block;
            font-family: var(--disp);
            font-size: 22px;
            line-height: 1.15;
         }
         .stat span {
            font-size: 11px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.08em;
         }
         .stat:active {
            transform: scale(0.97);
         }

         /* ---------- séance libre (repliée) ---------- */
         details.free {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            margin: 12px 0 16px;
         }
         details.free > summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            padding: 15px 16px;
         }
         details.free > summary::-webkit-details-marker {
            display: none;
         }
         details.free > summary::after {
            content: "＋";
            margin-left: auto;
            color: var(--gold);
            font-size: 18px;
         }
         details.free[open] > summary::after {
            content: "－";
         }
         .free-hz {
            font-family: var(--serif);
            font-size: 21px;
            color: var(--lacquer);
         }
         .free-body {
            padding: 0 16px 16px;
         }

         /* ---------- chips, boutons, inputs ---------- */
         .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
         }
         .chip {
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 14px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .chip[aria-pressed="true"] {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .hzchip {
            font-family: var(--serif);
            font-size: 19px;
            padding: 6px 11px;
         }
         .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            background: var(--card-2);
            border: 1px solid var(--line);
            color: var(--ink);
            transition: transform 0.1s;
         }
         .btn:active {
            transform: scale(0.97);
         }
         .btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--card);
         }
         .btn.danger {
            background: none;
            border-color: var(--lacquer);
            color: var(--lacquer);
         }
         .btn.ghost {
            background: none;
            border-color: transparent;
            color: var(--ink-soft);
         }
         .btn.sm {
            padding: 7px 12px;
            font-size: 13.5px;
            border-radius: 10px;
         }
         .btn.wide {
            width: 100%;
            margin-top: 8px;
         }
         .btn.big {
            padding: 14px 22px;
            font-size: 16px;
         }
         .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
         }
         .ck {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 0;
            font-size: 14.5px;
            color: var(--ink-soft);
            cursor: pointer;
         }
         .ck input {
            width: 17px;
            height: 17px;
            accent-color: var(--lacquer);
         }
         .search {
            width: 100%;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid var(--line);
            background: var(--card-2);
            outline: none;
            font-size: 15px;
         }
         .search:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(168, 135, 58, 0.18);
         }
         .f-lab {
            display: block;
            font-size: 13px;
            color: var(--ink-faint);
            margin: 10px 0;
         }
         .f-lab .search,
         .f-lab select,
         .f-lab input[type="range"] {
            margin-top: 4px;
         }
         input[type="range"] {
            width: 100%;
            accent-color: var(--lacquer);
         }
         .selects {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .selects .search {
            flex: 1;
            padding: 9px 10px;
            font-size: 14px;
         }
         .modes {
            display: grid;
            gap: 10px;
            margin-top: 6px;
         }
         .mode {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 13px 15px;
            transition:
               transform 0.1s,
               border-color 0.15s;
         }
         .mode:active {
            transform: scale(0.98);
         }
         .mode:not(:disabled):hover {
            border-color: var(--gold);
         }
         .mode .m-hz {
            font-family: var(--serif);
            font-size: 26px;
            color: var(--lacquer);
            width: 34px;
            text-align: center;
         }
         .mode b {
            display: block;
            font-size: 15.5px;
         }
         .mode span {
            font-size: 13px;
            color: var(--ink-faint);
         }

         /* ---------- tons ---------- */
         .tn.t1 {
            color: var(--t1);
         }
         .tn.t2 {
            color: var(--t2);
         }
         .tn.t3 {
            color: var(--t3);
         }
         .tn.t4 {
            color: var(--t4);
         }
         .tn.t5 {
            color: var(--t5);
         }

/* ---------- séance ---------- */
         body.in-session .nav,
         body.in-session .top,
         body.in-seq .nav,
         body.in-seq .top {
            display: none;
         }
         body.in-seq {
            padding-bottom: 28px;
         }
         /* En séance la barre de navigation et l'en-tête sont masqués : toute la
            hauteur du viewport revient à la colonne de séance, qui gère elle-même
            ses marges et les zones sûres iOS. */
         body.in-session {
            padding-bottom: 0;
         }
         body.in-session #view {
            max-width: none;
            padding: 0;
         }
         .dict-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0 4px;
         }
         .seq-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
         }
         .seq-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--line);
            transition: all 0.15s;
         }
         .seq-dots .dot.on {
            background: var(--lacquer);
            width: 20px;
            border-radius: 5px;
         }
         .seq-card {
            cursor: grab;
         }
         .speed-lab {
            font-size: 13px;
            color: var(--ink-faint);
         }
         /* colonne pleine hauteur : zones fixes en haut et en bas, carte extensible
            au milieu. 100dvh et non 100vh — la barre d'adresse mobile fausse vh. */
         .sess {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 560px;
            /* hauteur définie, sinon la colonne s'étire avec la carte et c'est la
               page qui défile au lieu du contenu de la carte. Si les zones fixes
               dépassaient malgré tout, le débordement reste visible et défilable. */
            height: 100dvh;
            margin: 0 auto;
            padding: calc(8px + env(safe-area-inset-top)) 16px
               calc(10px + env(safe-area-inset-bottom));
            touch-action: pan-y;
         }
         .s-top {
            display: flex;
            flex: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
         }
         .s-x {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-size: 15px;
            flex: none;
         }
         .s-scope {
            flex: 1;
            font-size: 13px;
            color: var(--ink-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
         }
         .s-count {
            font-family: var(--disp);
            font-size: 15px;
            color: var(--ink-soft);
         }
         .s-bar {
            flex: none;
            height: 4px;
            border-radius: 99px;
            background: var(--line-soft);
            overflow: hidden;
            margin-bottom: 12px;
         }
         .s-bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--lacquer), var(--seal));
            border-radius: 99px;
            transition: width 0.25s;
         }
         .flash {
            display: flex;
            flex: 1 1 auto;
            /* min-height: 0 laisse la carte se caler sur la place restante ; c'est
               son contenu qui défile, jamais la page. */
            min-height: 0;
            flex-direction: column;
            padding: 12px 18px 16px;
            text-align: center;
            max-width: 100%;
            touch-action: pan-y;
            transform: translateX(0);
            transition: transform 140ms ease, box-shadow 140ms ease;
            will-change: transform;
         }
         .fl-tools {
            display: flex;
            flex: none;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            /* le bouton garde sa cible de 44 px ; la rangée, elle, se rapproche
               du contenu — le caractère centré ne croise jamais le sceau. */
            margin-bottom: -8px;
         }
         .fl-body {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
            flex-direction: column;
            overflow-y: auto;
            overscroll-behavior-block: contain;
            scrollbar-width: thin;
         }
         /* marges automatiques plutôt que justify-content : le centrage tient sans
            rogner le haut du contenu quand le verso déplié dépasse. */
         .fl-inner {
            display: flex;
            width: 100%;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            margin-block: auto;
         }
         .flash.is-session-dragging {
            cursor: grabbing !important;
            user-select: none;
            -webkit-user-select: none;
            transform: translateX(calc(var(--session-drag-x, 0) * 1px)) rotate(calc(var(--session-drag-x, 0) * 0.025deg));
            transition: none;
            box-shadow: 0 14px 32px rgba(23, 20, 15, 0.16);
         }
         .flash.is-session-drag-left {
            box-shadow: -20px 0 30px -16px color-mix(in srgb, var(--lacquer) 60%, transparent);
         }
         .flash.is-session-drag-right {
            box-shadow: 20px 0 30px -16px color-mix(in srgb, var(--lacquer) 60%, transparent);
         }
         .fl-seal {
            margin-right: -2px;
         }
         /* crayon du recto : à portée de pouce, hors du flux qui défile */
         .fl-practice {
            position: absolute;
            z-index: 2;
            right: 12px;
            bottom: 12px;
         }
         .seal {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--seal);
            color: #f6efdd;
            font-family: var(--serif);
            font-size: 21px;
            font-weight: 600;
            transform: rotate(-2.5deg);
            box-shadow: 0 3px 9px rgba(192, 57, 43, 0.4);
            transition: transform 0.12s;
            flex: none;
         }
         .seal:active {
            transform: rotate(-2.5deg) scale(0.9);
         }
         .seal.lg {
            width: 56px;
            height: 56px;
            font-size: 26px;
            border-radius: 13px;
         }
         .hanzi {
            font-family: var(--serif);
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
            font-size: clamp(52px, 18vw, 88px);
            letter-spacing: 0.04em;
         }
         .pinyin {
            font-size: 21px;
            margin-top: 8px;
            letter-spacing: 0.03em;
         }
         .fr {
            font-family: var(--disp);
            font-size: 23px;
            margin-top: 4px;
         }
         .fr-big {
            font-family: var(--disp);
            font-size: 30px;
            line-height: 1.25;
            padding: 8px 4px;
         }
         .hint {
            margin-top: 22px;
            font-size: 12.5px;
            color: var(--ink-faint);
            text-transform: uppercase;
            letter-spacing: 0.12em;
         }
         .sep {
            width: 56px;
            height: 1.5px;
            background: var(--gold);
            opacity: 0.6;
            margin: 13px auto 9px;
         }
         .ex {
            margin-top: 14px;
            padding: 11px 14px;
            border-left: 3px solid var(--gold);
            background: var(--card-2);
            border-radius: 0 10px 10px 0;
            text-align: left;
            cursor: pointer;
            max-width: 100%;
         }
         .ex-hz {
            font-family: var(--serif);
            font-size: 19px;
         }
         .ex-py {
            font-size: 14px;
            margin-top: 2px;
         }
         .ex-fr {
            font-size: 14px;
            color: var(--ink-soft);
            font-style: italic;
            margin-top: 2px;
         }
         /* Section « Écriture du caractère » dépliée : l'en-tête du mot se resserre
            pour laisser la place à la grille, sans rien retirer du verso. */
         .flash:has(#review-strokes[open]) .hanzi {
            font-size: clamp(42px, 13vw, 64px);
         }
         .flash:has(#review-strokes[open]) .pinyin {
            margin-top: 4px;
            font-size: 18px;
         }
         .flash:has(#review-strokes[open]) .acts-compact {
            margin-top: 5px;
         }
         .flash:has(#review-strokes[open]) .sep {
            margin: 8px auto 6px;
         }
         .flash:has(#review-strokes[open]) .fr {
            font-size: 20px;
         }
         .flash:has(#review-strokes[open]) .ex {
            margin-top: 9px;
            padding: 9px 12px;
         }
         .note {
            margin-top: 12px;
            font-size: 13.5px;
            color: var(--ink-soft);
            background: var(--card-2);
            border: 1.5px dashed var(--gold);
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 100%;
            text-align: left;
         }
         .acts {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: center;
         }
         .act {
            min-height: 44px;
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card-2);
            font-size: 13.5px;
            color: var(--ink-soft);
            transition: all 0.15s;
         }
         .act.on {
            background: var(--lacquer);
            border-color: var(--lacquer);
            color: var(--card);
         }
         .act.on.jade {
            background: var(--jade);
            border-color: var(--jade);
         }
         /* actions secondaires de la séance : un trio d'icônes, pas une ligne pleine */
         .acts-compact {
            gap: 6px;
            margin-top: 6px;
            flex-wrap: nowrap;
         }
         .act-icon {
            display: inline-grid;
            width: 44px;
            height: 44px;
            flex: none;
            place-items: center;
            border: 1px solid transparent;
            border-radius: 12px;
            background: none;
            color: var(--ink-faint);
            transition: border-color 0.15s, background 0.15s, color 0.15s;
         }
         .act-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
         }
         .act-icon.fav {
            border-color: var(--line);
            background: var(--card-2);
            color: var(--ink-soft);
         }
         .act-icon:hover,
         .act-icon:focus-visible {
            border-color: var(--line);
            background: var(--card-2);
            color: var(--ink);
         }
         .act-icon:active {
            transform: scale(0.94);
         }
         .act-icon.on {
            border-color: var(--lacquer);
            background: var(--lacquer);
            color: var(--card);
         }
         .act-icon.fav.on svg {
            fill: currentColor;
         }
         .act-icon.jade.on {
            border-color: var(--jade);
            background: var(--jade);
         }
         .verdict {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 12px;
            padding: 8px 16px;
            border-radius: 999px;
         }
         .verdict.ok {
            background: rgba(46, 107, 87, 0.14);
            color: var(--jade);
         }
         .verdict.ko {
            background: rgba(158, 43, 37, 0.12);
            color: var(--lacquer);
         }
         .verdict span {
            font-weight: 400;
            font-size: 14px;
         }
         .s-foot {
            display: flex;
            flex: none;
            gap: 10px;
            margin-top: 12px;
         }
         .s-foot .btn {
            flex: 1;
         }
         .s-foot .btn.ghost {
            flex: 0 0 auto;
         }
         /* l'astuce de balayage flotte en bas de la carte : une fois estompée elle
            ne doit pas laisser un vide dans la colonne. */
         .session-swipe-hint {
            position: absolute;
            z-index: 3;
            right: 12px;
            /* au-dessus du crayon du recto, jamais par-dessus */
            bottom: 64px;
            left: 12px;
            margin: 0;
            padding: 8px 14px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--card-2) 92%, transparent);
            box-shadow: 0 6px 18px rgba(23, 20, 15, 0.12);
            color: var(--ink-faint);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            animation: session-swipe-hint-fade 4.2s ease forwards;
         }
         @keyframes session-swipe-hint-fade {
            0% {
               opacity: 0;
               transform: translateY(-4px);
            }
            12% {
               opacity: 1;
               transform: translateY(0);
            }
            75% {
               opacity: 1;
            }
            100% {
               opacity: 0;
            }
         }
         @keyframes session-swipe-hint-fade-only {
            0% {
               opacity: 0;
            }
            12% {
               opacity: 1;
            }
            75% {
               opacity: 1;
            }
            100% {
               opacity: 0;
            }
         }
         @media (prefers-reduced-motion: reduce) {
            .session-swipe-hint {
               animation-name: session-swipe-hint-fade-only;
            }
         }
         .grades {
            display: grid;
            flex: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-top: 7px;
         }
         /* rangée discrète : ni bordure de séparation, ni boutons pleine largeur */
         .session-nav {
            display: flex;
            flex: none;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 4px;
         }
         .session-nav-button {
            display: inline-flex;
            min-width: 0;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 11px;
            border: 1px solid transparent;
            border-radius: 11px;
            background: none;
            color: var(--ink-faint);
            font: 600 13.5px var(--disp);
            transition: border-color 120ms, color 120ms, background 120ms;
         }
         .session-nav-button.next {
            color: var(--lacquer);
         }
         .session-nav-button:hover:not(:disabled),
         .session-nav-button:focus-visible,
         .session-nav-button:active:not(:disabled) {
            border-color: color-mix(in srgb, var(--lacquer) 42%, var(--line));
            background: color-mix(in srgb, var(--lacquer) 6%, var(--card));
            color: var(--lacquer);
         }
         .session-nav-button:disabled {
            color: var(--ink-faint);
            cursor: default;
            opacity: .4;
            pointer-events: none;
         }
         /* en Découverte la rangée porte la seule action d'avancement de l'écran */
         .session-nav.solo {
            gap: 10px;
            margin-top: 12px;
         }
         .session-nav.solo .session-nav-button {
            min-height: 50px;
            flex: 1 1 0;
            border-color: var(--line);
            background: var(--card);
            color: var(--ink-soft);
            font-size: 15px;
         }
         .session-nav.solo .session-nav-button.next {
            border-color: var(--ink);
            background: var(--ink);
            color: var(--card);
         }
         .review-strokes {
            width: min(100%, 560px);
            margin-top: 9px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: color-mix(in srgb, var(--card-2) 72%, var(--card));
            overflow: hidden;
            text-align: left;
         }
         .review-strokes summary {
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            color: var(--ink);
            cursor: pointer;
            font: 600 14px var(--disp);
            list-style: none;
         }
         .review-strokes summary::-webkit-details-marker {
            display: none;
         }
         .review-strokes summary small {
            color: var(--lacquer);
            font-size: 11px;
            font-weight: 500;
         }
         .review-strokes[open] summary {
            border-bottom: 1px solid var(--line-soft);
         }
         .review-strokes[open] summary small {
            font-size: 0;
         }
         .review-strokes[open] summary small::after {
            content: "Masquer";
            font-size: 11px;
         }
         .review-stroke-content {
            padding: 7px 11px 9px;
         }
         .review-stroke-character-nav {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 44px auto;
            align-items: center;
            gap: 5px;
         }
         .review-stroke-chevron,
         .review-stroke-character {
            min-width: 44px;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--ink-soft);
         }
         .review-stroke-chevron {
            font-size: 24px;
         }
         .review-stroke-chevron:disabled {
            opacity: .35;
            pointer-events: none;
         }
         .review-stroke-characters {
            display: flex;
            min-width: 0;
            gap: 5px;
            overflow-x: auto;
            scrollbar-width: thin;
         }
         .review-stroke-character {
            flex: 0 0 44px;
            font: 21px var(--serif);
         }
         .review-stroke-character[aria-pressed="true"] {
            border-color: var(--lacquer);
            background: color-mix(in srgb, var(--lacquer) 9%, var(--card));
            box-shadow: inset 0 -2px var(--lacquer);
            color: var(--lacquer);
         }
         /* le compteur de caractères et le nombre de traits partagent le même coin :
            « 10 traits » n'occupe plus une ligne à lui seul. */
         .review-stroke-meta {
            display: flex;
            min-width: 36px;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: flex-end;
            gap: 2px 6px;
            color: var(--ink-faint);
            font-size: 12px;
            line-height: 1.25;
         }
         .review-stroke-count {
            font-variant-numeric: tabular-nums;
         }
         .review-stroke-strokes {
            color: var(--seal);
            font-size: 11px;
            white-space: nowrap;
         }
         /* mot d'un seul caractère : le nombre de traits tient seul sur sa ligne */
         .review-stroke-meta-solo {
            justify-content: center;
         }
         .review-stroke-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            padding: 2px;
            border: 1px solid var(--line-soft);
            border-radius: 10px;
            background: var(--card-2);
         }
         /* rejouer et s'entraîner tiennent sur la ligne des onglets, en icônes */
         .review-stroke-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: stretch;
            gap: 6px;
            margin-top: 6px;
         }
         .review-stroke-actions .stroke-icon-button {
            height: auto;
            min-height: 44px;
            border-radius: 10px;
            box-shadow: none;
         }
         .review-stroke-practice {
            border-color: color-mix(in srgb, var(--lacquer) 45%, var(--line));
            background: color-mix(in srgb, var(--lacquer) 8%, var(--card));
            color: var(--lacquer);
         }
         .review-stroke-practice:hover,
         .review-stroke-practice:focus-visible {
            border-color: var(--lacquer);
            background: color-mix(in srgb, var(--lacquer) 13%, var(--card));
         }
         .review-stroke-tabs button {
            min-height: 44px;
            border-radius: 8px;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 600;
         }
         .review-stroke-tabs button[aria-selected="true"] {
            background: var(--card);
            box-shadow: 0 2px 8px rgba(23, 20, 15, .08);
            color: var(--lacquer);
         }
         .review-stroke-panel {
            margin-top: 5px;
         }
         /* composition et origine conservées intégralement, espacements resserrés */
         .review-character-composition {
            width: 100%;
            min-height: 0;
            gap: 1px;
            margin: 6px 0 0;
            padding: 5px 8px;
         }
         .review-stroke-grid {
            display: grid;
            width: 164px;
            height: 164px;
            margin: 0 auto;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 10px;
            background-image:
               linear-gradient(45deg, transparent 49.7%, var(--line-soft) 50%, transparent 50.3%),
               linear-gradient(-45deg, transparent 49.7%, var(--line-soft) 50%, transparent 50.3%),
               linear-gradient(90deg, transparent 49.7%, var(--line-soft) 50%, transparent 50.3%),
               linear-gradient(0deg, transparent 49.7%, var(--line-soft) 50%, transparent 50.3%);
            background-color: var(--card);
         }
         .review-stroke-steps-list {
            display: flex;
            gap: 7px;
            max-width: 100%;
            padding: 1px 1px 7px;
            overflow-x: auto;
            overscroll-behavior-inline: contain;
            scroll-snap-type: inline proximity;
         }
         .review-stroke-step {
            position: relative;
            width: 88px;
            flex: 0 0 88px;
            border: 1px solid var(--line-soft);
            border-radius: 9px;
            background: var(--card);
            scroll-snap-align: start;
            overflow: hidden;
         }
         .review-stroke-step .stroke-panel-svg {
            display: block;
            width: 88px;
            height: 88px;
         }
         .review-stroke-step-number {
            position: absolute;
            z-index: 1;
            top: 4px;
            left: 5px;
            display: grid;
            width: 20px;
            height: 20px;
            place-items: center;
            border-radius: 50%;
            background: var(--card);
            color: var(--lacquer);
            font-size: 10px;
            box-shadow: 0 1px 5px rgba(23, 20, 15, .12);
         }
         .writing-practice-backdrop {
            position: fixed;
            inset: 0;
            z-index: 130;
            display: grid;
            place-items: center;
            padding: 8px;
            background: rgba(23, 20, 15, .68);
         }
         /* ouverte depuis une séance : la carte derrière ne doit plus être lisible */
         .writing-practice-backdrop-review {
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
         }
         .writing-practice-dialog {
            position: relative;
            width: min(480px, 100%);
            max-height: calc(100dvh - 16px);
            overflow: auto;
            padding: 16px 14px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--paper-2);
            box-shadow: 0 22px 70px rgba(23, 20, 15, .35);
         }
         .review-writing-head {
            min-height: 44px;
            padding-right: 48px;
         }
         .review-writing-head .eyebrow {
            margin-bottom: 2px;
         }
         .review-writing-head .sh-t {
            margin: 0;
         }
         .review-writing-head .sh-t span {
            color: var(--lacquer);
            font: 600 30px var(--serif);
         }
         /* en révision le titre porte le pinyin : même couleur, corps adapté au texte */
         .review-writing-head .sh-t span.writing-practice-title-pinyin {
            font: 600 25px var(--disp);
            letter-spacing: 0.01em;
         }
         .writing-practice-character-picker {
            gap: 6px;
            margin: 8px 0 6px;
            padding-bottom: 2px;
         }
         /* pastilles au pinyin (ou au rang) : plus larges qu'un carré de caractère */
         .writing-practice-character-picker .writing-practice-character-review {
            flex: 0 0 auto;
            min-width: 44px;
            padding: 0 11px;
            font: 600 14px var(--ui);
         }
         .review-writing-model-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            margin: 6px 0 10px;
            color: var(--ink-soft);
            font-size: 12px;
         }
         .review-writing-model-controls > label {
            display: grid;
            min-width: 0;
            flex: 1 1 180px;
            grid-template-columns: auto auto;
            align-items: center;
            justify-content: space-between;
            gap: 3px 8px;
         }
         .review-writing-model-controls output {
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
         }
         #review-writing-width,
         #review-writing-opacity {
            width: min(150px, 100%);
            grid-column: 1 / -1;
         }
         .writing-surface.review-writing-surface {
            width: min(100%, 270px);
            min-height: 0;
            aspect-ratio: 1;
            margin: 0 auto;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: inset 0 0 12px rgba(23, 20, 15, .05);
         }
         .review-writing-model {
            font-size: clamp(150px, 50vw, 220px);
         }
         .review-writing-grids {
            margin-top: 10px;
         }
         .review-writing-grid-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
         }
         .review-writing-grid-head h4 {
            font: 600 15px var(--disp);
         }
         .review-writing-grid-head small {
            color: var(--ink-faint);
            font-size: 10px;
         }
         .review-writing-grids .writing-grid-options {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
         }
         .review-writing-grids .writing-grid-option {
            min-height: 70px;
            grid-template-columns: 1fr;
            justify-items: center;
            gap: 4px;
            padding: 6px 3px;
            text-align: center;
         }
         .review-writing-grids .writing-grid-preview {
            width: 38px;
            height: 38px;
         }
         .review-writing-grids .writing-grid-name {
            font-size: 10px;
         }
         .review-writing-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-top: 12px;
         }
         .review-writing-buttons .btn {
            min-height: 44px;
         }
         .writing-practice-dialog button:focus-visible,
         .writing-practice-dialog input:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--lacquer) 36%, transparent);
            outline-offset: 2px;
         }
         .gr {
            min-height: 44px;
            border-radius: 12px;
            padding: 10px 4px 8px;
            color: #f6efdd;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s;
         }
         .gr:active {
            transform: scale(0.95);
         }
         .gr small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            opacity: 0.85;
            margin-top: 1px;
         }
         .gr.again {
            background: var(--lacquer);
         }
         .gr.hard {
            background: var(--gold);
         }
         .gr.good {
            background: var(--jade);
         }
         .gr.easy {
            background: var(--ink);
         }
         .g-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
         }
         @media (max-width: 430px) {

               padding-inline: 12px;

            .flash {
               padding: 8px 13px 11px;

            .grades {
               gap: 5px;
            }
            .session-nav {
               gap: 4px;
            }
            .session-nav-button {
               padding: 6px 8px;
               font-size: 13px;
            }

         .w-lab {

         .w-in {

            max-width: 340px;
            margin-top: 18px;
         }
         .w-in .search {
            text-align: center;
            font-size: 18px;
         }
         .w-note {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);

         .t-btns {

            margin-top: 12px;

         .review-overview {

         .review-mark {

            flex: 0 0 54px;
            width: 54px;
            height: 54px;

            color: var(--card-2);

         .review-queue {

            grid-template-columns: repeat(3, minmax(0, 1fr));
            overflow: hidden;
            border: 1px solid var(--line);

         .review-queue > div {

         .review-queue b,

         .review-queue b {

         .review-queue span {

            letter-spacing: 0.05em;

         .review-pack-label {

            margin-top: 10px;

         }
         @media (max-width: 430px) {
            .review-heading {
               align-items: flex-start;
            }
            .review-queue span {
               font-size: 9px;
               letter-spacing: 0.025em;
            }
         }

/* ---------- 米字格 ---------- */
         .mizi {
            position: relative;
            width: min(300px, 100%);
            aspect-ratio: 1;
            margin: 14px auto 4px;
            border: 2px solid var(--seal);
            border-radius: 8px;
            overflow: hidden;
            background:
               linear-gradient(
                  45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  -45deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  90deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               linear-gradient(
                  0deg,
                  transparent calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% - 0.6px),
                  rgba(168, 135, 58, 0.5) calc(50% + 0.6px),
                  transparent calc(50% + 0.6px)
               ),
               var(--card-2);
            box-shadow: inset 0 0 0 1px rgba(158, 43, 37, 0.2);
         }
         .mizi > div,
         .mizi > canvas {
            position: absolute;
            inset: 0;
            margin: auto;
         }
         .mizi > .ghost {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--serif);
            color: rgba(23, 20, 15, 0.15);
            user-select: none;
            pointer-events: none;
            line-height: 1;
         }
         .mizi canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
         }

/* ---------- atelier des traits ---------- */
.stroke-workspace {
   margin-top: 12px;
}
.stroke-tabs {
   display: grid;
   grid-template-columns: repeat(3, minmax(0, 1fr));
   gap: 4px;
   padding: 4px;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: rgba(205, 191, 161, 0.22);
   user-select: none;
   -webkit-user-select: none;
}
.stroke-tabs [role="tab"] {
   min-height: 44px;
   border: 0;
   border-radius: 9px;
   background: transparent;
   color: var(--ink-soft);
   font: 600 13px var(--ui);
   cursor: pointer;
}
.stroke-tabs [role="tab"][aria-selected="true"] {
   background: var(--card-2);
   color: var(--seal);
   box-shadow: 0 2px 8px rgba(23, 20, 15, 0.09);
}
.stroke-tabs [role="tab"]:focus-visible,
.stroke-panel:focus-visible,
.stroke-focus button:focus-visible {
   outline: 3px solid #237a5a;
   outline-offset: 3px;
}
.stroke-tab-panel {
   padding-top: 10px;
}
.stroke-tab-panel[hidden] {
   display: none;
}
.stroke-tab-panel > input[type="range"] {
   width: 100%;
   accent-color: var(--seal);
}
.stroke-tab-panel .w-note {
   min-height: 22px;
   text-align: center;
}
.stroke-gallery-toolbar {
   display: flex;
   align-items: flex-start;
   justify-content: space-between;
   gap: 14px;
   margin: 4px 0 12px;
   color: var(--ink-soft);
   font-size: 13px;
}
.stroke-gallery-settings {
   display: flex;
   flex-wrap: wrap;
   justify-content: flex-end;
   gap: 8px 14px;
}
.stroke-gallery-settings label {
   display: inline-flex;
   align-items: center;
   gap: 6px;
   min-height: 30px;
}
.stroke-gallery-settings input {
   width: 18px;
   height: 18px;
   accent-color: var(--seal);
}
.stroke-gallery-settings label.is-unavailable {
   color: var(--ink-faint);
   opacity: 0.55;
}
.stroke-radical-label-compact {
   display: none;
}
.stroke-gallery {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
   gap: 12px;
}
.stroke-gallery.is-loading {
   opacity: 0.48;
}

.character-swipe-zone {
   touch-action: pan-y;
   -webkit-user-drag: none;
}
.character-swipe-zone:not(:has(input:focus, textarea:focus, select:focus, [contenteditable="true"]:focus)) {
   cursor: grab;
}
.character-swipe-zone.is-pointer-swiping {
   cursor: grabbing;
}
.character-swipe-zone.is-practice-paging-locked {
   cursor: default;
}
.dd-character-interaction .dd-character-study-card,
.dd-character-interaction .stroke-character-stage-main,
#seq-flash > .hanzi,
#seq-flash .stroke-character-stage-main {
   transform: translateX(var(--character-swipe-offset, 0));
   transition: transform 150ms cubic-bezier(0.22, 0.72, 0.3, 1), opacity 120ms ease-out;
   will-change: transform;
}
.dd-character-interaction.is-pointer-swiping .dd-character-study-card,
.dd-character-interaction.is-pointer-swiping .stroke-character-stage-main,
#seq-flash.is-pointer-swiping > .hanzi,
#seq-flash.is-pointer-swiping .stroke-character-stage-main {
   transition: none;
}
.dd-character-interaction.is-swipe-committing .dd-character-study-card,
.dd-character-interaction.is-swipe-committing .stroke-character-stage-main,
#seq-flash.is-swipe-committing > .hanzi,
#seq-flash.is-swipe-committing .stroke-character-stage-main {
   opacity: 0.9;
}
.dd-character-study-card,
.dd-character-interaction .stroke-workspace,
.dd-character-interaction > .eyebrow,
.character-nav,
#dd-picker {
   user-select: none;
   -webkit-user-select: none;
}
.dd-character-detail-translation,
.dd-related {
   user-select: text;
   -webkit-user-select: text;
}
.character-swipe-zone *,
.character-nav *,
.seq-character-strip *,
#dd-picker * {
   -webkit-user-drag: none;
}
.character-nav,
.character-nav-button,
.stroke-tabs [role="tab"],
.seq-character-strip .hzchip,
#dd-picker .hzchip {
   user-select: none;
   -webkit-user-select: none;
}
.character-nav {
   display: grid;
   grid-template-columns: 48px minmax(92px, auto) 48px;
   align-items: center;
   justify-content: center;
   gap: 12px;
   width: fit-content;
   max-width: 100%;
   margin: 16px auto;
   padding: 6px 9px;
   border: 1px solid var(--line-soft);
   border-radius: 18px;
   background: color-mix(in srgb, var(--card-2) 88%, transparent);
   box-shadow: 0 5px 14px rgba(23, 20, 15, 0.07);
}
.character-nav-button {
   display: inline-grid;
   place-items: center;
   width: 48px;
   height: 48px;
   padding: 0;
   border: 1px solid var(--line);
   border-radius: 14px;
   background: var(--paper-2);
   color: var(--ink-soft);
   box-shadow: 0 3px 9px rgba(23, 20, 15, 0.08);
   cursor: pointer;
   transition: border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.character-nav-button svg {
   width: 22px;
   height: 22px;
   fill: none;
   stroke: currentColor;
   stroke-width: 2;
   stroke-linecap: round;
   stroke-linejoin: round;
}
.character-nav-button:hover,
.character-nav-button:focus-visible {
   border-color: var(--seal);
   color: var(--seal);
   box-shadow: 0 4px 12px rgba(158, 43, 37, 0.14);
}
.character-nav-button:focus-visible {
   outline: 3px solid rgba(35, 122, 90, 0.5);
   outline-offset: 2px;
}
.character-nav-button:active:not(:disabled) {
   color: var(--lacquer);
   transform: scale(0.96);
}
.character-nav-button:disabled {
   border-color: var(--line-soft);
   background: color-mix(in srgb, var(--card-2) 62%, transparent);
   color: var(--ink-faint);
   box-shadow: none;
   cursor: default;
   opacity: 0.42;
   pointer-events: none;
}
.character-nav-position {
   min-width: 92px;
   color: var(--ink);
   font: 600 15px var(--ui);
   text-align: center;
   white-space: nowrap;
}

.stroke-action-bar {
   display: grid;
   grid-template-columns: 44px minmax(0, 1fr) auto;
   align-items: center;
   gap: 10px;
   margin: 10px 0 12px;
   padding: 7px 9px;
   border: 1px solid var(--line-soft);
   border-radius: 14px;
   background: var(--card-2);
}
.stroke-action-bar .character-nav-position {
   min-width: 0;
   overflow: hidden;
   text-overflow: ellipsis;
}
.stroke-action-bar-spacer {
   min-width: 0;
}
.stroke-action-icons {
   display: flex;
   justify-self: end;
   gap: 6px;
}
.stroke-icon-button {
   display: inline-grid;
   flex: none;
   place-items: center;
   width: 44px;
   height: 44px;
   padding: 0;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: var(--paper-2);
   color: var(--ink-soft);
   box-shadow: 0 3px 9px rgba(23, 20, 15, 0.08);
   cursor: pointer;
   transition: border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
}
.stroke-icon-button svg {
   width: 22px;
   height: 22px;
   fill: none;
   stroke: currentColor;
   stroke-width: 2;
   stroke-linecap: round;
   stroke-linejoin: round;
}
.stroke-icon-button:hover,
.stroke-icon-button:focus-visible {
   border-color: var(--seal);
   color: var(--seal);
}
.stroke-icon-button:focus-visible {
   outline: 3px solid rgba(35, 122, 90, 0.5);
   outline-offset: 2px;
}
.stroke-icon-button:active {
   color: var(--lacquer);
   transform: scale(0.96);
}

.stroke-character-stage {
   --character-nav-size: 44px;
   position: relative;
   min-width: 0;
   width: 100%;
}
.stroke-character-stage-main {
   min-width: 0;
}
.stroke-character-stage:has(> .character-nav-button) .mizi {
   width: min(
      300px,
      calc(100% - var(--character-nav-size) - var(--character-nav-size))
   );
}
.stroke-character-stage:has(> .character-nav-button) .stroke-gallery {
   width: calc(100% - var(--character-nav-size) - var(--character-nav-size));
   margin-inline: auto;
}
.stroke-character-stage > .character-nav-button {
   position: absolute;
   z-index: 5;
   top: var(--nav-center-y);
   width: var(--character-nav-size);
   height: var(--character-nav-size);
   border-color: color-mix(in srgb, var(--seal) 34%, var(--line));
   border-radius: 50%;
   background: color-mix(in srgb, var(--paper-2) 88%, transparent);
   color: var(--seal);
   box-shadow: 0 4px 12px rgba(23, 20, 15, 0.12);
   backdrop-filter: blur(7px);
   visibility: hidden;
   transform: translateY(-50%);
}
.stroke-character-stage.is-navigation-positioned > .character-nav-button {
   visibility: visible;
}
.stroke-character-stage > .character-nav-previous {
   left: var(--nav-left);
}
.stroke-character-stage > .character-nav-next {
   right: var(--nav-right);
}
.stroke-character-stage > .character-nav-button:active:not(:disabled) {
   transform: translateY(-50%) scale(0.96);
}
.stroke-character-stage + * {
   margin-top: 14px;
}
#dd-character-nav {
   grid-template-columns: 48px minmax(92px, 1fr) 48px;
   width: 100%;
   margin: 8px 0 14px;
   padding: 2px 1px;
   border: 0;
   background: transparent;
   box-shadow: none;
}

#dd-character-nav .character-nav-button {
   width: 44px;
   height: 44px;
   border-color: color-mix(in srgb, var(--seal) 32%, var(--line));
   border-radius: 50%;
   background: color-mix(in srgb, var(--card-2) 86%, transparent);
   box-shadow: 0 4px 12px rgba(23, 20, 15, 0.1);
   backdrop-filter: blur(5px);
}

#dd-character-nav .character-nav-button:last-child {
   justify-self: end;
}

#dd-character-nav .character-nav-position {
   justify-self: center;
   padding: 7px 13px;
   border: 1px solid var(--line-soft);
   border-radius: 999px;
   background: color-mix(in srgb, var(--card-2) 82%, transparent);
}
.stroke-panel {
   position: relative;
   min-width: 0;
   padding: 0;
   overflow: hidden;
   border: 1px solid var(--line);
   border-radius: 11px;
   background: var(--card-2);
   color: var(--ink);
   cursor: zoom-in;
   text-align: left;
}
.stroke-panel:hover {
   border-color: var(--seal);
   box-shadow: 0 7px 18px rgba(23, 20, 15, 0.1);
}
.stroke-panel-number {
   position: absolute;
   z-index: 1;
   top: 8px;
   left: 10px;
   color: var(--seal);
   font: 700 20px var(--ui);
}
.stroke-panel-visual {
   display: block;
   width: 100%;
   aspect-ratio: 1;
}
.stroke-panel-svg {
   display: block;
   width: 100%;
   height: 100%;
}
.stroke-grid-lines > * {
   fill: none;
   stroke: #9f7b39;
   vector-effect: non-scaling-stroke;
}
.stroke-grid-center {
   stroke-width: 0.8;
   stroke-dasharray: 18 15;
   opacity: 0.25;
}
.stroke-grid-diagonal {
   stroke-width: 0.65;
   stroke-dasharray: 14 18;
   opacity: 0.13;
}
.stroke-grid-border {
   stroke-width: 1;
   stroke-dasharray: none;
   opacity: 0.34;
}
.stroke-path {
   stroke: none;
}
.stroke-complete {
   fill: #17140f;
}
.stroke-current {
   fill: #a62520;
}
.stroke-future {
   fill: #d8d5cf;
}
.stroke-complete.stroke-radical,
.stroke-current.stroke-radical {
   fill: #237a5a;
}
.stroke-future.stroke-radical {
   fill: #a8c9b8;
}

/* ---------- composition vérifiée ---------- */
.character-composition {
   display: grid;
   width: min(100%, 560px);
   min-height: 58px;
   gap: 3px;
   margin: 6px auto 2px;
   padding: 6px 9px;
   overflow: hidden;
   border: 1px solid var(--line-soft);
   border-radius: 10px;
   background: color-mix(in srgb, var(--card-2) 76%, transparent);
   color: var(--ink-soft);
   font-size: 11.5px;
}
.character-composition[hidden] {
   display: none;
}
.character-composition.is-loading {
   visibility: hidden;
}
.character-composition.is-hint-only {
   min-height: 0;
   gap: 0;
   padding-block: 5px;
}
.composition-primary,
.composition-secondary {
   display: flex;
   min-width: 0;
   min-height: 21px;
   align-items: center;
   gap: 7px;
   white-space: nowrap;
}
.composition-primary > .eyebrow {
   flex: 0 0 auto;
   margin: 0;
   color: var(--seal);
   font-size: 9px;
}
.composition-origin {
   display: flex;
   min-width: 0;
   align-items: baseline;
   gap: 6px;
   color: var(--ink-soft);
   line-height: 1.3;
}
.composition-origin > .eyebrow,
.composition-origin > .search-fallback {
   flex: 0 0 auto;
   margin: 0;
   font-size: 8px;
}
.composition-origin > .eyebrow {
   color: var(--seal);
}
.composition-origin-text {
   display: -webkit-box;
   min-width: 0;
   overflow: hidden;
   overflow-wrap: anywhere;
   white-space: normal;
   -webkit-box-orient: vertical;
   -webkit-line-clamp: 2;
   line-clamp: 2;
}
.composition-formula,
.composition-group,
.composition-roles,
.composition-role {
   display: inline-flex;
   min-width: 0;
   align-items: center;
}
.composition-formula,
.composition-roles {
   gap: 4px;
   overflow-x: auto;
   scrollbar-width: none;
}
.composition-formula::-webkit-scrollbar,
.composition-roles::-webkit-scrollbar {
   display: none;
}
.composition-group {
   gap: 3px;
}
.composition-component {
   display: inline-flex;
   min-width: 0;
   min-height: 22px;
   align-items: baseline;
   gap: 3px;
   padding: 1px 3px;
   border: 0;
   border-radius: 6px;
   background: transparent;
   color: var(--ink);
   cursor: pointer;
   white-space: nowrap;
}
.composition-component:hover,
.composition-component:focus-visible {
   background: color-mix(in srgb, var(--seal) 10%, transparent);
   color: var(--seal);
}
.composition-component:focus-visible {
   outline: 2px solid color-mix(in srgb, var(--jade) 60%, transparent);
   outline-offset: 1px;
}
.composition-component b,
.composition-role-text {
   font: 600 18px var(--serif);
}
.composition-component small,
.composition-role-hint {
   color: var(--ink-faint);
   font-size: 10px;
   font-weight: 500;
}
.composition-unknown {
   display: inline-grid;
   width: 18px;
   height: 22px;
   place-items: center;
   color: var(--ink-faint);
   font: 600 12px var(--sans);
   opacity: 0.72;
}
.composition-plus,
.composition-dot {
   color: var(--ink-faint);
}
.composition-secondary {
   justify-content: flex-end;
}
.composition-roles {
   flex: 1 1 auto;
}
.composition-role {
   flex: 0 0 auto;
   gap: 3px;
}
.composition-role .composition-component {
   padding-inline: 1px;
}
.composition-role em {
   color: var(--seal);
   font-style: normal;
   font-weight: 700;
}
.composition-radical {
   display: inline-flex;
   flex: 0 0 auto;
   align-items: center;
   gap: 2px;
   margin: 0;
   padding: 0 4px 0 7px;
   border-color: color-mix(in srgb, var(--jade) 35%, var(--line));
   color: var(--jade);
}
.composition-radical .composition-component {
   min-height: 20px;
   padding: 0 2px;
   color: inherit;
}
.composition-radical .composition-component b {
   font-size: 16px;
}
.composition-radical .composition-component small {
   display: none;
}
.composition-source {
   flex: 0 0 auto;
   border: 0;
   color: var(--ink-faint);
   font-size: 8px;
   letter-spacing: 0.06em;
   text-decoration: none;
   cursor: help;
}
.stroke-panel-label {
   display: block;
   padding: 9px 10px 10px;
   border-top: 1px solid var(--line-soft);
   font-size: 12.5px;
   font-weight: 600;
   text-align: center;
}
.stroke-gallery-error {
   grid-column: 1 / -1;
   padding: 18px;
   border: 1px dashed var(--line);
   border-radius: 10px;
   color: var(--ink-soft);
   text-align: center;
}
.stroke-focus-backdrop {
   position: fixed;
   inset: 0;
   z-index: 120;
   display: grid;
   place-items: center;
   padding: 18px;
   background: rgba(23, 20, 15, 0.68);
}
.stroke-focus {
   width: min(680px, 100%);
   max-height: calc(100dvh - 36px);
   overflow: auto;
   padding: 18px;
   border: 1px solid var(--line);
   border-radius: 18px;
   background: var(--paper-2);
   box-shadow: 0 22px 70px rgba(23, 20, 15, 0.35);
}
.stroke-focus header,
.stroke-focus footer {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 12px;
}
.stroke-focus-title {
   font-family: var(--disp);
   font-size: 21px;
}
.stroke-focus-close {
   width: 44px;
   height: 44px;
   border: 1px solid var(--line);
   border-radius: 50%;
   background: var(--card-2);
   color: var(--ink);
   font-size: 26px;
   cursor: pointer;
}
.stroke-focus-visual {
   width: min(520px, 100%);
   aspect-ratio: 1;
   margin: 12px auto;
   border-radius: 12px;
   overflow: hidden;
   background: var(--card-2);
}
.stroke-focus-position {
   min-width: 64px;
   text-align: center;
   font-weight: 600;
}

@media (max-width: 599px) {
   .stroke-tabs [role="tab"] {
      padding-inline: 5px;
      font-size: 12px;
   }
   .stroke-gallery-toolbar {
      align-items: center;
      gap: 6px;
      margin: 2px 0 8px;
      font-size: 11px;
      white-space: nowrap;
   }
   .stroke-gallery-toolbar > span {
      min-width: 0;
   }
   .stroke-gallery-settings {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: nowrap;
      gap: 8px;
      margin: 0;
   }
   .stroke-gallery-settings label {
      gap: 4px;
   }
   .stroke-radical-label-full {
      display: none;
   }
   .stroke-radical-label-compact {
      display: inline;
   }
   .character-composition {
      width: 100%;
      min-height: 54px;
      margin-top: 5px;
      padding: 5px 7px;
   }
   .composition-primary,
   .composition-secondary {
      gap: 5px;
   }
   .stroke-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-inline: 0;
      padding: 4px 0 8px;
      overflow: visible;
      touch-action: pan-y;
   }
   .stroke-character-stage:has(> .character-nav-button):has(#stroke-panel-steps:not([hidden])) .stroke-gallery {
      width: 100%;
      padding-top: 56px;
   }
   .stroke-focus-backdrop {
      padding: 8px;
   }
   .stroke-focus {
      padding: 12px;
   }
   .stroke-focus footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
   }
   .stroke-focus-position {
      grid-column: 1 / -1;
      grid-row: 1;
   }
}

@media (prefers-reduced-motion: reduce) {
   .stroke-gallery {
      scroll-behavior: auto;
   }
   .stroke-panel,
   .stroke-focus-backdrop {
      transition: none !important;
   }
   .dd-character-interaction .dd-character-study-card,
   .stroke-character-stage-main,
   #seq-flash > .hanzi {
      transition: none !important;
   }
}

.seq-character-strip {
   display: flex;
   gap: 8px;
   margin: 12px 0;
   padding: 4px 2px 8px;
   overflow-x: auto;
   scroll-snap-type: x proximity;
   user-select: none;
   -webkit-user-select: none;
}
.seq-character-strip .hzchip {
   flex: 0 0 46px;
   min-height: 46px;
   scroll-snap-align: center;
   font-size: 22px;
}
.seq-character-strip .hzchip[aria-current="true"] {
   border-color: var(--seal);
   background: var(--seal);
   color: var(--card-2);
}

@media (max-width: 430px) {
   .character-nav {
      grid-template-columns: 48px minmax(82px, auto) 48px;
      gap: 8px;
      padding-inline: 7px;
   }
   .character-nav-position {
      min-width: 82px;
      font-size: 14px;
   }
}

/* ---------- picker & bibliothèque ---------- */
         .picker {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 12px 0 6px;
            max-height: 170px;
            overflow: auto;
            padding: 2px;
         }
         .lib-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
         }

            margin-top: 4px;
         }

            display: flex;
            align-items: center;
            gap: 12px;

            text-align: left;
            padding: 11px 6px;

         .b.gold {

         }
         .b.jade {

         .b.u {
