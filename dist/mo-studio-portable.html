                  pack: "",
                  cat: "",
                  includeAcquired: false,
                  freeOpen: false,
               };
               session = { active: false };
               clearSavedSession();
               invalidateDictIndex();
               save();
               closeSheet();
               refreshActive();
               toast(
                  "Collection effacée (sauvegarde disponible dans les réglages).",
               );
            };
            $("st-close").onclick = () => {
               closeSheet();
               refreshActive();
            };
         }

"use strict";

/* ================= import / export ================= */
         function exportData() {
            const data = {
               app: "mo-studio",
               version: 3,
               exported: new Date().toISOString(),
               units: db.units,
               cards: db.cards,
               packs: db.packs,
               categories: db.categories,
               memberships: db.memberships,
               settings: db.settings,
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {
               type: "application/json",
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "mo-studio-export.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            toast("Export téléchargé.");
         }
         function openImportSheet(data) {
            if (
               data &&
               typeof data === "object" &&
               (data.pack || (Array.isArray(data.packs) && data.packs.some((pack) => Array.isArray(pack.categories))))
            ) {
               openSheet('<h3 class="sh-t">Analyse de la sauvegarde</h3><p class="sh-p">Préparation d’un aperçu non destructif…</p><div class="import-loading"></div>');
               buildPackImportPreview(data, "json")
                  .then(openPackImportPreview)
                  .catch((error) => toast(error.message));
               return;
            }
            const rawCards = Array.isArray(data)
               ? data
               : Array.isArray(data.cards)
                 ? data.cards
                 : [];
            const incoming = rawCards
               .map((c) => normalizeCard(c, false))
               .filter(Boolean);
            if (!incoming.length) {
               toast(
                  "Aucune carte valide dans ce fichier (hz et fr obligatoires).",
               );
               return;
            }
            const name =
               !Array.isArray(data) && typeof data.name === "string"
                  ? data.name.trim()
                  : "";
            const existing = new Set(db.cards.map(cardKey));
            const fresh = incoming.filter((c) => !existing.has(cardKey(c)));
            const dupN = incoming.length - fresh.length;
            openSheet(
               '<h3 class="sh-t">Importer ' +
                  incoming.length +
                  " carte" +
                  (incoming.length > 1 ? "s" : "") +
                  "</h3>" +
                  '<p class="sh-p">' +
                  fresh.length +
                  " nouvelle" +
                  (fresh.length > 1 ? "s" : "") +
                  " · " +
                  dupN +
                  " déjà présente" +
                  (dupN > 1 ? "s" : "") +
                  " (mêmes 汉字 + pinyin).</p>" +
                  (name
                     ? '<label class="ck"><input type="checkbox" id="im-pack" checked> Créer / compléter le pack « ' +
                       esc(name) +
                       " »</label>"
                     : "") +
                  '<div class="sh-btns">' +
                  '<button class="btn primary" id="im-merge">Fusionner</button>' +
                  '<button class="btn danger" id="im-replace">Remplacer tout</button>' +
                  '<button class="btn ghost" id="im-cancel">Annuler</button>' +
                  "</div>" +
                  '<p class="sh-note">« Fusionner » ajoute seulement les nouvelles cartes. « Remplacer tout » écrase cartes et packs (réglages conservés, sauvegarde automatique avant).</p>',
            );
            $("im-cancel").onclick = closeSheet;
            $("im-merge").onclick = () =>
               doImport(data, incoming, fresh, name, false);
            $("im-replace").onclick = () => {
               if (
                  confirm(
                     "Remplacer toute ta collection ? (une sauvegarde sera gardée)",
                  )
               )
                  doImport(data, incoming, fresh, name, true);
            };
         }
         function doImport(data, incoming, fresh, name, replace) {
            const wantPack = !!(name && $("im-pack") && $("im-pack").checked);
            session = { active: false };
            clearSavedSession();
            hub.pack = "";
            hub.cat = "";
            const inUnits =
               !Array.isArray(data) &&
               data.units &&
               typeof data.units === "object" &&
               !Array.isArray(data.units)
                  ? data.units
                  : null;
            if (replace) {
               makeBackup();
               const raw = Array.isArray(data)
                  ? incoming
                  : Array.isArray(data.cards)
                    ? data.cards
                    : incoming;
               let cards = raw
                  .map((c) => normalizeCard(c, true))
                  .filter(Boolean);
               const seen = new Set();
               cards = cards.filter((c) => {
                  const k = cardKey(c);
                  if (seen.has(k)) return false;
                  seen.add(k);
                  return true;
               });
               db.cards = cards;
               const ids = new Set(cards.map((c) => c.id));
               db.packs =
                  !Array.isArray(data) && Array.isArray(data.packs)
                     ? data.packs
                          .filter(
                             (p) => p && p.name && Array.isArray(p.cardIds),
                          )
                          .map((p) => ({
                             id: String(p.id || uid()),
                             name: String(p.name),
                             cardIds: p.cardIds.filter((i) => ids.has(i)),
                          }))
                     : [];
               db.categories =
                  !Array.isArray(data) && Array.isArray(data.categories)
                     ? data.categories.filter((category) => category && category.id && category.packId && category.name)
                     : [];
               db.memberships =
                  !Array.isArray(data) && Array.isArray(data.memberships)
                     ? data.memberships.filter((membership) => membership && membership.cardId && membership.categoryId)
                     : [];
               db.units = inUnits || {};
            } else {
               db.cards = db.cards.concat(fresh);
               if (inUnits) db.units = Object.assign({}, db.units, inUnits);
            }
            const added = replace ? db.cards.length : fresh.length;
            if (wantPack) {
               const byKey = new Map(db.cards.map((c) => [cardKey(c), c.id]));
               const idsForPack = incoming
                  .map((c) => byKey.get(cardKey(c)))
                  .filter(Boolean);
               upsertPack(name, idsForPack);
            }
            invalidateDictIndex();
            save();
            closeSheet();
            refreshActive();
            toast(
               replace
                  ? "Collection remplacée (" + added + " cartes)."
                  : added
                    ? added +
                      " carte" +
                      (added > 1 ? "s" : "") +
                      " ajoutée" +
                      (added > 1 ? "s" : "") +
                      "."
                    : "Rien à ajouter — tout existait déjà.",
            );
         }
         const FORMAT_CARD_EXAMPLE =
            '{\n  "chinese": "你好",\n  "pinyin": "nǐ hǎo",\n  "translation": "bonjour"\n}';
         const FORMAT_PACK_EXAMPLE = PACK_JSON_EXAMPLE;

         async function copyFormatExample() {
            try {
               if (!navigator.clipboard || !navigator.clipboard.writeText)
                  throw new Error("Clipboard unavailable");
               await navigator.clipboard.writeText(FORMAT_PACK_EXAMPLE);
               toast("Exemple copié.");
            } catch (error) {
               toast("Copie impossible ici — sélectionne le texte à la main.");
            }
         }

         function openFormatSheet() {
            openSheet(
               '<h3 class="sh-t">Format JSON des packs</h3>' +
                  '<p class="sh-p">Chaque mot demande uniquement <code>chinese</code>. <code>pinyin</code>, <code>translation</code>, <code>notes</code>, <code>favorite</code>, <code>difficult</code> et <code>tags</code> sont optionnels. Les données manquantes sont recherchées dans le dictionnaire sans jamais être inventées.</p>' +
                  '<div class="eyebrow">Exemple minimal valide</div>' +
                  '<pre class="fmt" id="fmt-card-example">' +
                  esc(FORMAT_CARD_EXAMPLE) +
                  "</pre>" +
                  '<p class="sh-p">Un pack contient des <code>categories</code>, chacune avec un tableau <code>words</code>. Le format historique reste accepté depuis Réglages → Données.</p>' +
                  '<div class="eyebrow">Exemple de pack</div>' +
                  '<pre class="fmt" id="fmt-pack-example">' +
                  esc(FORMAT_PACK_EXAMPLE) +
                  "</pre>" +
                  '<div class="sh-btns">' +
                  '<button class="btn" id="fmt-copy">Copier l\'exemple</button>' +
                  '<button class="btn ghost" id="fmt-close" data-sheet-close>Fermer</button>' +
                  "</div>",
            );
            $("fmt-copy").onclick = copyFormatExample;
            $("fmt-close").onclick = closeSheet;
         }

"use strict";

/* ================= sheet & toast ================= */
         let sheetReturnFocus = null;
         function openSheet(html) {
            if (typeof destroyStrokeWorkspace === "function") destroyStrokeWorkspace();
            const o = $("sheet");
            if (!o.classList.contains("open")) sheetReturnFocus = document.activeElement;
            o.querySelector(".sheet-card").innerHTML = html;
            o.classList.add("open");
            o.setAttribute("aria-hidden", "false");
            o.setAttribute("role", "dialog");
            o.setAttribute("aria-modal", "true");
            o.removeAttribute("aria-label");
            o.removeAttribute("aria-labelledby");
            const heading = o.querySelector("h1, h2, h3, .cd-hz, .dictionary-loading b");
            if (heading) {
               heading.id = heading.id || "mo-sheet-title";
               o.setAttribute("aria-labelledby", heading.id);
            } else {
               o.setAttribute("aria-label", "Dialogue Mò Studio");
            }
            document.querySelectorAll(".top, #view, .nav").forEach((element) => {
               element.inert = true;
            });
            document.body.style.overflow = "hidden";
            const focusSheet = () => {
               const focusTarget =
                  o.querySelector("[data-sheet-close]") ||
                  o.querySelector(
                     "button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])",
                  );
               if (focusTarget) focusTarget.focus({ preventScroll: true });
            };
            focusSheet();
            requestAnimationFrame(focusSheet);
         }
         function closeSheet() {
            if (typeof destroyStrokeWorkspace === "function") destroyStrokeWorkspace();
            const o = $("sheet");
            o.classList.remove("open");
            o.setAttribute("aria-hidden", "true");
            o.removeAttribute("role");
            o.removeAttribute("aria-modal");
            o.removeAttribute("aria-label");
            o.removeAttribute("aria-labelledby");
              document.querySelectorAll(".top, #view, .nav").forEach((element) => {
                 element.inert = false;
              });
              document.body.style.overflow = "";
              o.querySelector(".sheet-card").innerHTML = "";
              if (sheetReturnFocus && sheetReturnFocus.isConnected)
               sheetReturnFocus.focus({ preventScroll: true });
            sheetReturnFocus = null;
         }
         const sheetOpen = () => $("sheet").classList.contains("open");
         let toastTimer = null;
         function toast(msg) {
            const t = $("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
         }

"use strict";

/* ================= initialisation ================= */
         async function init() {
            await personalLibraryInit();
            refreshVoices();
            document
               .querySelectorAll(".nav button")
               .forEach((b) => (b.onclick = () => setView(b.dataset.view)));
            $("btn-settings").onclick = openSettings;
            $("sheet").addEventListener("click", (e) => {
               if (e.target.id !== "sheet") return;
               if (
                  activeView === "search" &&
                  history.state &&
                  history.state.moStudioSearch &&
                  history.state.mode === "detail"
               )
                  closeSearchDictionaryDetail();
               else closeSheet();
            });
            // audio : tout élément portant data-say est cliquable
            document.addEventListener("click", (e) => {
               const el = e.target.closest("[data-say]");
               if (el) speak(el.getAttribute("data-say"));
            });
            // import de fichier
            $("file-global").addEventListener("change", (e) => {
               const f = e.target.files[0];
               e.target.value = "";
               if (!f) return;
               const r = new FileReader();
               r.onload = () => {
                  try {
                     openImportSheet(JSON.parse(r.result));
                  } catch (err) {
                     toast("Fichier JSON invalide.");
                  }
               };
               r.onerror = () => toast("Impossible de lire le fichier.");
               r.readAsText(f);
            });
            // raccourcis clavier
            document.addEventListener("keydown", (e) => {
               if (sheetOpen()) {
                  if (e.key === "Escape") {
                     if (
                        activeView === "search" &&
                        history.state &&
                        history.state.moStudioSearch &&
                        history.state.mode === "detail"
                     )
                        closeSearchDictionaryDetail();
                     else closeSheet();
                     return;
                  }
                  const tag = (e.target.tagName || "").toLowerCase();
                  const editing =
                     tag === "input" || tag === "textarea" || tag === "select" ||
                     (e.target && e.target.isContentEditable);
                  if (e.defaultPrevented || editing) return;
                  const characterButton =
                     e.key === "ArrowLeft"
                        ? $("dd-character-prev")
                        : e.key === "ArrowRight"
                          ? $("dd-character-next")
                          : null;
                  if (
                     characterButton &&
                     typeof ddStrokeTab !== "undefined" &&
                     ddStrokeTab === "practice"
                  )
                     return;
                  if (characterButton && !characterButton.disabled) {
                     e.preventDefault();
                     characterButton.click();
                  }
                  return;
               }
               if (seq) {
                  if (
                     e.defaultPrevented ||
                     (e.target.closest && e.target.closest(".stroke-workspace, .stroke-focus"))
                  ) return;
                  const tag = (e.target.tagName || "").toLowerCase();
                  if (
                     tag === "input" || tag === "textarea" || tag === "select" ||
                     (e.target && e.target.isContentEditable)
                  ) return;
                  if (e.key === "ArrowRight" && $("seq-next"))
                     $("seq-next").click();
                  else if (
                     e.key === "ArrowLeft" &&
                     $("seq-prev") &&
                     !$("seq-prev").disabled
                  )
                     $("seq-prev").click();
                  else if (e.key === "Escape") closeSequence();
                  return;
               }
               if (!session.active || activeView !== "learn") return;
               const tag = (e.target.tagName || "").toLowerCase();
               if (tag === "input" || tag === "textarea" || tag === "select") {
                  if (e.key === "Enter" && $("s-check")) {
                     e.preventDefault();
                     checkWritten();
                  }
                  return;
               }
               const grades = { 1: "again", 2: "hard", 3: "good", 4: "easy" };
               if (grades[e.key]) {
                  const b = document.querySelector(
                     '[data-grade="' + grades[e.key] + '"]',
                  );
                  if (b) {
                     e.preventDefault();
                     b.click();
                     return;
                  }
               }
               if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  if ($("s-flip")) $("s-flip").click();
                  else if ($("s-next")) $("s-next").click();
               } else if (e.key === "ArrowRight" && $("s-next"))
                  $("s-next").click();
               else if (
                  e.key === "ArrowLeft" &&
                  $("s-prev") &&
                  !$("s-prev").disabled
               )
                  $("s-prev").click();
               else if (e.key === "Escape") endSession();
            });
            if (!history.state)
               history.replaceState({ moStudioView: "learn" }, "");
            if (history.state && history.state.moStudioSearch)
               restoreSearchHistory(history.state);
            else
               setView((history.state && history.state.moStudioView) || "learn", {
                  fromHistory: true,
               });
         }
         init();
   </script>
