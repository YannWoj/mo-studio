}

function filteredPathEntries() {
   const visible = normalizeVisibleWhitespace(pathLevelFilter).toLowerCase();
   if (!visible) return pathLevelEntries;
   const plain = normalizePinyinPlain(visible);
   const translation = normalizeTranslation(visible);
   return pathLevelEntries.filter(
      (entry) =>
         entry.chinese.includes(visible) ||
         (plain && normalizePinyinPlain(entry.pinyin).includes(plain)) ||
         (translation && normalizeTranslation(entry.sourceTranslation).includes(translation)),
   );
}

function wirePathVocabulary(filtered) {
   const search = $("path-level-search");
   if (search) {
      search.oninput = () => {
         pathLevelFilter = search.value;
         pathLevelVisible = PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
   }
   document.querySelectorAll("[data-path-word-index]").forEach((button) => {
      button.onclick = async () => {
         const entry = filtered[Number(button.dataset.pathWordIndex)];
         if (!entry) return;
         openSheet(
            '<div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de la fiche…</b></div>',
         );
         await openHskVocabularyEntry(entry);
      };
   });
   if ($("path-show-more"))
      $("path-show-more").onclick = () => {
         pathLevelVisible += PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
}

function renderPathVocabulary() {
   const target = $("path-vocabulary");
   if (!target) return;
   const filtered = filteredPathEntries();
   const visible = filtered.slice(0, pathLevelVisible);
   target.innerHTML =
      '<div class="path-level-tools"><label for="path-level-search">Filtrer ce niveau</label>' +
      '<input class="search" id="path-level-search" type="search" placeholder="汉字, pinyin ou traduction…" value="' +
      esc(pathLevelFilter) +
      '"><span class="path-filter-count" aria-live="polite">' +
      filtered.length.toLocaleString("fr-FR") +
      (filtered.length > 1 ? " entrées" : " entrée") +
      "</span></div>" +
      (visible.length
         ? '<div class="path-word-list" data-path-word-list>' +
           visible.map(pathVocabularyRowHtml).join("") +
           "</div>"
         : '<div class="path-no-results"><p>Aucun mot dans ce niveau pour cette recherche.</p></div>') +
      (visible.length < filtered.length
         ? '<div class="path-more"><button class="btn ghost" id="path-show-more" type="button">Afficher ' +
           Math.min(PATH_PAGE_SIZE, filtered.length - visible.length).toLocaleString("fr-FR") +
           " entrées de plus</button></div>"
         : "");
   const search = $("path-level-search");
   if (search && pathLevelFilter) {
      search.focus({ preventScroll: true });
      search.setSelectionRange(search.value.length, search.value.length);
   }
   wirePathVocabulary(filtered);
}

function renderPathLevelFrame(level, count) {
   $("view").innerHTML =
      '<section class="path-page path-level-page" aria-labelledby="path-level-title">' +
      '<header class="path-level-header"><button class="btn ghost" id="path-level-back" type="button">← Retour</button>' +
      '<div><h2 class="v-t" id="path-level-title">HSK ' +
      level +
      '</h2><p class="muted"><span data-path-current-count>' +
      count.toLocaleString("fr-FR") +
      "</span> entrées classées par <code>firstHskLevel</code></p></div></header>" +
      '<p class="path-scope-note">Vocabulaire uniquement · aucune leçon ni aucun exercice.</p>' +
      '<section class="card path-vocabulary" id="path-vocabulary"><div class="path-loading" role="status"><span class="ink-loader"></span><span>Chargement du vocabulaire…</span></div></section></section>';
   $("path-level-back").onclick = () => {
      openPathLevel = null;
      pathLevelEntries = [];
      pathLevelFilter = "";
      renderPath();
      window.scrollTo(0, 0);
   };
}

async function renderPathLevel(level, token) {
   try {
      const manifest = await loadHskManifest();
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      renderPathLevelFrame(level, pathLevelCount(manifest, level));
      const entries = await loadHskLevel(level);
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      pathLevelEntries = entries;
      renderPathVocabulary();
   } catch (error) {
      if (token !== pathRenderToken) return;
      const target = $("path-vocabulary");
      if (target)
         target.innerHTML =
            '<div class="path-error" role="alert"><b>Vocabulaire indisponible.</b><p>' +
            esc(error.message) +
            '</p><button class="btn" id="path-level-retry">Réessayer</button></div>';
      if ($("path-level-retry")) $("path-level-retry").onclick = () => renderPath();
   }
}

function renderPath() {
   document.body.classList.remove("in-seq", "in-lesson");
   const token = ++pathRenderToken;
   if (openPathLevel == null) renderPathHome(token);
   else renderPathLevel(openPathLevel, token);
}

"use strict";

/* ================= tableau d'écriture (写) ================= */
const WRITING_GRIDS = ["blank", "square", "tian", "mi"];
let writingCanvasController = null;
let writingSettingsOutsideController = null;
let writingState = {
   mode: "free",
   word: "",
   characters: [],
   index: 0,
   tool: "pen",
   free: { actions: [], redo: [] },
   practice: {},
};

function writingPreferences() {
   const prefs = db.settings.writingBoard || {};
   prefs.color = /^#[0-9a-f]{6}$/i.test(prefs.color || "")
      ? prefs.color
      : "#17140f";
   prefs.width = Math.max(1, Math.min(24, Number(prefs.width) || 5));
   prefs.grid = WRITING_GRIDS.includes(prefs.grid) ? prefs.grid : "tian";
   prefs.opacity = Math.max(0.04, Math.min(0.45, Number(prefs.opacity) || 0.18));
   prefs.modelVisible = prefs.modelVisible !== false;
   db.settings.writingBoard = prefs;
   return prefs;
}

function saveWritingPreferences() {
   writingPreferences();
   save();
}

function writingDrawingKey() {
   const character = writingState.characters[writingState.index] || "";
   return writingState.word + "§" + writingState.index + "§" + character;
}

function writingDrawingSlot() {
   if (writingState.mode === "free") return writingState.free;
   const key = writingDrawingKey();
   if (!writingState.practice[key])
      writingState.practice[key] = { actions: [], redo: [] };
   return writingState.practice[key];
}

function writingChevron(direction) {
   const path =
      direction === "left" ? "M14.5 6.5 9 12l5.5 5.5" : "M9.5 6.5 15 12l-5.5 5.5";

      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' +
      path +

}

      (writingState.mode === "practice" && character && prefs.modelVisible ? "" : " hidden") +
      ">" +
      esc(character) +
      '</div><canvas id="writing-canvas" aria-label="Zone de dessin" tabindex="0"></canvas>' +
      (writingState.mode === "practice"
         ? writingModelToggleButtonHtml(
              "writing-model-visible",
              Boolean(character && prefs.modelVisible),
              !character,
              "writing-surface-model-toggle",
           )
         : "") +
      "</div>" +
      writingGridSelectorHtml(prefs) +
      '<p class="writing-note">Le tracé reste sur cet appareil pendant cette visite. Aucune reconnaissance d’écriture n’est effectuée.</p></section></section>';
   wireWritingView();
}

function setWritingCharacters(value) {
   const visible = String(value || "").trim();
   const characters = Array.from(visible).filter((character) => HAN_PATTERN.test(character));
   if (!characters.length) {
      toast("Entre au moins un caractère chinois.");
      return false;
   }
   writingState.word = visible;
   writingState.characters = characters;
   writingState.index = 0;
   return true;
}

function openWritingWord(value) {
   if (!setWritingCharacters(value)) return;
   writingState.mode = "practice";
   closeSheet();
   setView("write");
}

function moveWritingCharacter(delta) {
   const next = writingState.index + delta;
   if (next < 0 || next >= writingState.characters.length) return;
   writingState.index = next;
   renderWriting();
}

function wireWritingSwipe() {
   const target = $("writing-character-nav");
   if (!target) return;
   let start = null;
   target.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      start = { x: event.clientX, y: event.clientY, id: event.pointerId };
   });
   target.addEventListener("pointerup", (event) => {
      if (!start || event.pointerId !== start.id) return;
      const dx = event.clientX - start.x;
      const dy = event.clientY - start.y;
      start = null;
      if (Math.abs(dx) < 34 || Math.abs(dx) <= Math.abs(dy)) return;
      moveWritingCharacter(dx < 0 ? 1 : -1);
   });
   target.addEventListener("pointercancel", () => (start = null));
}

function wireWritingView() {
   document.querySelectorAll("[data-writing-mode]").forEach((button) => {
      button.onclick = () => {
         writingState.mode = button.dataset.writingMode;
         renderWriting();
      };
   });
   if ($("writing-word-form"))
      $("writing-word-form").onsubmit = (event) => {
         event.preventDefault();
         if (setWritingCharacters($("writing-word").value)) renderWriting();
      };
   if ($("writing-prev")) $("writing-prev").onclick = () => moveWritingCharacter(-1);
   if ($("writing-next")) $("writing-next").onclick = () => moveWritingCharacter(1);
   wireWritingSwipe();

   $("writing-settings").onclick = () =>
      setWritingSettingsOpen(
         $("writing-settings").getAttribute("aria-expanded") !== "true",
      );
   writingSettingsOutsideController = new AbortController();
   document.addEventListener(
      "pointerdown",
      (event) => {
         if (
            !event.target.closest("#writing-slider-panel") &&
            !event.target.closest("#writing-settings")
         )
            setWritingSettingsOpen(false);
      },
      { signal: writingSettingsOutsideController.signal },
   );
   document.addEventListener(
      "keydown",
      (event) => {
         if (event.key === "Escape") setWritingSettingsOpen(false);
      },
      { signal: writingSettingsOutsideController.signal },
   );
   $("writing-color").oninput = (event) => {
      writingPreferences().color = event.target.value;
      writingState.tool = "pen";
      saveWritingPreferences();
      $("writing-color-button").style.setProperty("--writing-color", event.target.value);
      updateWritingToolState();
   };
   $("writing-width").oninput = (event) => {
      writingPreferences().width = Number(event.target.value);
      $("writing-width-value").textContent = event.target.value + " px";
      saveWritingPreferences();
   };
   document.querySelectorAll("[data-writing-grid]").forEach((button) => {
      button.onclick = () => {
         const prefs = writingPreferences();
         prefs.grid = button.dataset.writingGrid;
         saveWritingPreferences();
         $("writing-surface").dataset.grid = prefs.grid;
         document.querySelectorAll("[data-writing-grid]").forEach((item) =>
            item.setAttribute("aria-pressed", String(item === button)),
         );
      };
   });
   if ($("writing-model-visible"))
      $("writing-model-visible").onclick = (event) => {
         const visible = !writingPreferences().modelVisible;
         writingPreferences().modelVisible = visible;
         saveWritingPreferences();
         $("writing-model").hidden = !visible;
         updateWritingModelToggleButton(event.currentTarget, visible);
      };
   if ($("writing-opacity"))
      $("writing-opacity").oninput = (event) => {

         $("writing-model").style.opacity = opacity;

   $("writing-eraser").onclick = () => {

   $("writing-redo").onclick = redoWritingAction;
   $("writing-clear").onclick = clearWritingCanvas;
   $("writing-fullscreen").onclick = toggleWritingFullscreen;
   document.addEventListener("fullscreenchange", writingFullscreenChanged);
   wireWritingCanvas();
   updateWritingToolState();

}

function setWritingSettingsOpen(open) {
   const button = $("writing-settings");

function updateWritingToolState() {

   const eraser = $("writing-eraser");
   if (pen) pen.setAttribute("aria-pressed", String(writingState.tool === "pen"));
   if (eraser)
      eraser.setAttribute("aria-pressed", String(writingState.tool === "eraser"));
}

function updateWritingHistoryButtons() {
   const slot = writingDrawingSlot();
   if ($("writing-undo")) $("writing-undo").disabled = !slot.actions.length;
   if ($("writing-redo")) $("writing-redo").disabled = !slot.redo.length;
}

function undoWritingAction() {
   const slot = writingDrawingSlot();
   if (!slot.actions.length) return;
   slot.redo.push(slot.actions.pop());
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function redoWritingAction() {
   const slot = writingDrawingSlot();
   if (!slot.redo.length) return;
   slot.actions.push(slot.redo.pop());
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function clearWritingCanvas() {
   const slot = writingDrawingSlot();
   if (!slot.actions.length) return;
   slot.actions.push({ type: "clear" });
   slot.redo = [];
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function writingPoint(event, canvas) {
   const rect = canvas.getBoundingClientRect();
   return {
      x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
      y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)),
      pressure:
         event.pointerType === "pen" && event.pressure > 0
            ? Math.max(0.35, event.pressure)
            : 1,
   };
}

function createWritingCanvasController(options) {
   const canvas = options && options.canvas;
   const surface = options && options.surface;
   if (!canvas || !surface) return null;
   const listeners = new AbortController();
   let resizeObserver = null;
   let renderFrame = 0;
   let pointerId = null;
   let destroyed = false;
   const drawingSlot = options.drawingSlot;
   const preferences = options.preferences;
   const selectedTool = options.selectedTool;
   const render = () => {
      if (destroyed || !canvas.isConnected) return;
      const context = canvas.getContext("2d");
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
      drawingSlot().actions.forEach((action) => {
         if (action.type === "clear")
            context.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
         else if (action.type === "stroke") drawWritingStroke(context, canvas, action);
      });
   };
   const resize = () => {
      if (destroyed || !canvas.isConnected) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
         canvas.width = width;
         canvas.height = height;
         render();
      }
   };
   const scheduleRender = () => {
      if (renderFrame || destroyed) return;
      renderFrame = requestAnimationFrame(() => {
         renderFrame = 0;
         render();
      });
   };
   const finish = (event) => {
      if (event.pointerId !== pointerId) return;
      pointerId = null;
      try {
         canvas.releasePointerCapture(event.pointerId);
      } catch (error) {}
      if (options.onFinish) options.onFinish();
   };
   canvas.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      event.preventDefault();
      pointerId = event.pointerId;
      try {
         canvas.setPointerCapture(event.pointerId);
      } catch (error) {}
      const prefs = preferences();
      const slot = drawingSlot();
      slot.actions.push({
         type: "stroke",
         tool: selectedTool(),
         color: prefs.color,
         width: prefs.width,
         points: [writingPoint(event, canvas)],
      });
      slot.redo = [];
      scheduleRender();
   }, { signal: listeners.signal });
   canvas.addEventListener("pointermove", (event) => {
      if (event.pointerId !== pointerId) return;
      event.preventDefault();
      const slot = drawingSlot();
      const stroke = slot.actions[slot.actions.length - 1];
      if (!stroke || stroke.type !== "stroke") return;
      const coalesced = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
      const events = coalesced.length ? coalesced : [event];
      events.forEach((item) => stroke.points.push(writingPoint(item, canvas)));
      scheduleRender();
   }, { signal: listeners.signal });
   canvas.addEventListener("pointerup", finish, { signal: listeners.signal });
   canvas.addEventListener("pointercancel", finish, { signal: listeners.signal });
   resizeObserver = new ResizeObserver(resize);
   resizeObserver.observe(surface);
   const destroy = () => {
      if (destroyed) return;
      destroyed = true;
      listeners.abort();
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = null;
      if (renderFrame) cancelAnimationFrame(renderFrame);
      renderFrame = 0;
      pointerId = null;
   };
   if (options.signal) {
      if (options.signal.aborted) destroy();
      else options.signal.addEventListener("abort", destroy, { once: true });
   }
   resize();
   return { destroy, render, resize, scheduleRender };
}

function drawWritingStroke(context, canvas, stroke) {
   const points = stroke.points || [];
   if (!points.length) return;
   const ratio = Math.max(1, window.devicePixelRatio || 1);
   const cssWidth = canvas.width / ratio;
   const cssHeight = canvas.height / ratio;
   context.save();
   context.globalCompositeOperation =
      stroke.tool === "eraser" ? "destination-out" : "source-over";
   context.strokeStyle = stroke.tool === "eraser" ? "rgba(0,0,0,1)" : stroke.color;
   context.fillStyle = context.strokeStyle;
   context.lineCap = "round";
   context.lineJoin = "round";
   context.lineWidth = stroke.width * (stroke.tool === "eraser" ? 2.6 : 1);
   if (points.length === 1) {
      const point = points[0];
      context.beginPath();
      context.arc(
         point.x * cssWidth,
         point.y * cssHeight,
         Math.max(0.75, context.lineWidth * point.pressure * 0.5),
         0,
         Math.PI * 2,
      );
      context.fill();
   } else {
      context.beginPath();
      context.moveTo(points[0].x * cssWidth, points[0].y * cssHeight);
      for (let index = 1; index < points.length - 1; index += 1) {
         const point = points[index];
         const next = points[index + 1];
         context.quadraticCurveTo(
            point.x * cssWidth,
            point.y * cssHeight,
            ((point.x + next.x) / 2) * cssWidth,
            ((point.y + next.y) / 2) * cssHeight,
         );
      }
      const last = points[points.length - 1];
      context.lineTo(last.x * cssWidth, last.y * cssHeight);
      context.stroke();
   }
   context.restore();
}

function renderWritingCanvas() {
   if (writingCanvasController) writingCanvasController.render();
}

async function toggleWritingFullscreen() {
   const workspace = $("writing-workspace");
   if (!workspace) return;
   try {
      if (workspace.classList.contains("writing-fullscreen-fallback")) {
         workspace.classList.remove("writing-fullscreen-fallback");
         document.body.classList.remove("writing-fullscreen-open");
         writingFullscreenChanged();
      } else if (document.fullscreenElement) await document.exitFullscreen();
      else if (workspace.requestFullscreen) await workspace.requestFullscreen();
      else {
         workspace.classList.toggle("writing-fullscreen-fallback");
         document.body.classList.toggle(
            "writing-fullscreen-open",
            workspace.classList.contains("writing-fullscreen-fallback"),
         );
         writingFullscreenChanged();
      }
   } catch (error) {
      workspace.classList.add("writing-fullscreen-fallback");
      document.body.classList.add("writing-fullscreen-open");
      writingFullscreenChanged();
   }
}

function writingFullscreenChanged() {
   const button = $("writing-fullscreen");
   const workspace = $("writing-workspace");
   const active = Boolean(
      document.fullscreenElement ||
         (workspace && workspace.classList.contains("writing-fullscreen-fallback")),
   );
   if (button) {
      const label = active ? "Quitter le plein écran" : "Plein écran";
      button.setAttribute("aria-label", label);
      button.title = label;
      button.innerHTML = writingToolIcon(active ? "fullscreen-exit" : "fullscreen");
   }
   requestAnimationFrame(resizeWritingCanvas);
}

function destroyWritingBoard() {
   if (writingCanvasController) writingCanvasController.destroy();
   writingCanvasController = null;
   if (writingSettingsOutsideController) writingSettingsOutsideController.abort();
   writingSettingsOutsideController = null;
   document.removeEventListener("fullscreenchange", writingFullscreenChanged);
   document.body.classList.remove("writing-fullscreen-open");
}

"use strict";

let writingPracticeSheetState = null;

function writingPracticeCharacters(value) {
   return Array.from(String(value || "").trim()).filter((character) =>
      /^\p{Script=Han}$/u.test(character),
   );
}

// Pinyin aligné sur les caractères Han : une syllabe par caractère, sinon rien.
// En révision, mieux vaut n'afficher aucun pinyin que d'en deviner un — « yī diǎnr »
// compte deux syllabes pour les trois caractères de 一点儿.
function writingPracticePinyinSyllables(characters, pinyin) {
   const syllables = String(pinyin || "").trim().split(/\s+/).filter(Boolean);
   return syllables.length === characters.length ? syllables : [];
}

// Point unique où se décide ce que la modale montre et annonce d'un caractère.
// En mode « review », rien ici ne doit contenir le caractère lui-même : ni à
// l'écran, ni pour un lecteur d'écran. Le pinyin sert de consigne ; à défaut, le
// rang du caractère dans le mot.
function writingPracticeLabels(characters, pinyin, review) {
   const syllables = review ? writingPracticePinyinSyllables(characters, pinyin) : [];
   return characters.map((character, index) => {
      if (!review)
         return {
            title: character,
            pill: character,
            pick: "Tracer " + character,
            canvas: "Zone d’essai pour " + character,
         };
      const syllable = syllables[index] || "";
      const rank = "caractère " + (index + 1) + " sur " + characters.length;
      return {
         title: syllable,
         pill: syllable || String(index + 1),
         pick: syllable ? "Tracer " + syllable : "Tracer le " + rank,
         canvas: syllable ? "Zone d’essai pour " + syllable : "Zone d’essai",
      };
   });
}

function writingPracticeCharacterPickerHtml(characters, selectedIndex, labels, review) {
   if (characters.length <= 1) return "";
   return (
      '<div class="review-stroke-characters writing-practice-character-picker" aria-label="Caractères du mot">' +
      characters.map((character, index) =>
         '<button type="button" class="review-stroke-character' +
         (review ? " writing-practice-character-review" : "") +
         '" data-writing-practice-character="' +
         index + '" aria-pressed="' + String(index === selectedIndex) +
         '" aria-label="' + esc(labels[index].pick) + '">' + esc(labels[index].pill) + "</button>",
      ).join("") +
      "</div>"
   );
}

function closeWritingPracticeSheet() {
   if (!writingPracticeSheetState) return;
   const state = writingPracticeSheetState;
   writingPracticeSheetState = null;
   if (state.controller) state.controller.destroy();
   state.listeners.abort();
   state.root.remove();
   state.inertStates.forEach(({ element, inert }) => (element.inert = inert));
   document.body.style.overflow = state.previousBodyOverflow;
   if (state.opener && state.opener.isConnected)
      state.opener.focus({ preventScroll: true });
}

function openWritingPracticeSheet(word, options) {
   const visibleWord = String(word || "").trim();
   const characters = writingPracticeCharacters(visibleWord);
   if (!characters.length || typeof createWritingCanvasController !== "function") return;
   closeWritingPracticeSheet();

   const selectedIndex = Math.max(
      0,
      Math.min(Number(options && options.initialIndex) || 0, characters.length - 1),
   );
   // « review » : ouverte depuis une séance, la modale est un exercice de rappel.
   // « search » (défaut) : ouverte depuis l'atelier des traits, comportement inchangé.
   const review = (options && options.mode) === "review";
   const labels = writingPracticeLabels(characters, options && options.pinyin, review);
   const basePreferences = writingPreferences();
   // copie de travail : masquer le modèle en révision ne doit jamais toucher le
   // réglage persisté qu'utilise la page Écrire.
   const preferences = {
      color: basePreferences.color,
      width: basePreferences.width,
      grid: basePreferences.grid,
      opacity: basePreferences.opacity,
      modelVisible: review ? false : basePreferences.modelVisible,
   };
   const slot = { actions: [], redo: [] };
   const listeners = new AbortController();
   const opener = document.activeElement;
   const inertStates = [document.querySelector(".top"), $("view"), document.querySelector(".nav"), $("sheet")]
      .filter(Boolean)
      .map((element) => ({ element, inert: element.inert }));
   const root = document.createElement("div");
   root.className = "writing-practice-backdrop" + (review ? " writing-practice-backdrop-review" : "");
   root.innerHTML = writingPracticeSheetHtml(visibleWord, characters, selectedIndex, preferences, labels, review);
   document.body.appendChild(root);
   inertStates.forEach(({ element }) => (element.inert = true));
   const previousBodyOverflow = document.body.style.overflow;
   document.body.style.overflow = "hidden";

   const state = {
      root,
      opener,
      inertStates,
      previousBodyOverflow,
      listeners,
      controller: null,
      selectedIndex,
   };
   writingPracticeSheetState = state;
   const canvas = root.querySelector("#review-writing-canvas");
   const surface = root.querySelector("#review-writing-surface");
   const undo = root.querySelector("#review-writing-undo");
   const clear = root.querySelector("#review-writing-clear");
   const updateActionState = () => {
      undo.disabled = !slot.actions.length;
      clear.disabled = !slot.actions.length;
   };
   state.controller = createWritingCanvasController({
      canvas,
      surface,
      drawingSlot: () => slot,
      preferences: () => preferences,
      selectedTool: () => "pen",
      onFinish: updateActionState,
      signal: listeners.signal,
   });

   const selectCharacter = (index) => {
      state.selectedIndex = Math.max(0, Math.min(index, characters.length - 1));
      const character = characters[state.selectedIndex];
      slot.actions.length = 0;
      slot.redo.length = 0;
      const label = labels[state.selectedIndex];
      root.querySelector(".writing-practice-dialog").dataset.reviewWritingCharacter = character;
      root.querySelector("#writing-practice-title span").textContent = label.title;
      // le modèle porte toujours le vrai caractère : c'est lui que l'œil révèle
      root.querySelector("#review-writing-model").textContent = character;
      canvas.setAttribute("aria-label", label.canvas);
      root.querySelectorAll("[data-writing-practice-character]").forEach((button) =>
         button.setAttribute(
            "aria-pressed",
            String(Number(button.dataset.writingPracticeCharacter) === state.selectedIndex),
         ),
      );
      state.controller.render();
      updateActionState();
   };

   root.querySelectorAll(".writing-practice-close").forEach((button) =>
      button.addEventListener("click", closeWritingPracticeSheet, { signal: listeners.signal }),
   );
   root.querySelectorAll("[data-writing-practice-character]").forEach((button) =>
      button.addEventListener("click", () => selectCharacter(Number(button.dataset.writingPracticeCharacter)), {
         signal: listeners.signal,
      }),
   );
   root.querySelector("#review-writing-model-visible").addEventListener("click", (event) => {
      preferences.modelVisible = !preferences.modelVisible;
      root.querySelector("#review-writing-model").hidden = !preferences.modelVisible;
      updateWritingModelToggleButton(event.currentTarget, preferences.modelVisible);
   }, { signal: listeners.signal });
   root.querySelector("#review-writing-width").addEventListener("input", (event) => {
      preferences.width = Number(event.target.value);
      root.querySelector("#review-writing-width-value").textContent = event.target.value + " px";
   }, { signal: listeners.signal });
   root.querySelector("#review-writing-opacity").addEventListener("input", (event) => {
      preferences.opacity = Number(event.target.value) / 100;
      root.querySelector("#review-writing-opacity-value").textContent = event.target.value + "%";
      root.querySelector("#review-writing-model").style.opacity = preferences.opacity;
   }, { signal: listeners.signal });
   root.querySelectorAll("[data-writing-grid]").forEach((button) =>
      button.addEventListener("click", () => {
         preferences.grid = button.dataset.writingGrid;
         surface.dataset.grid = preferences.grid;
         root.querySelectorAll("[data-writing-grid]").forEach((item) =>
            item.setAttribute("aria-pressed", String(item === button)),
         );
      }, { signal: listeners.signal }),
   );
   undo.addEventListener("click", () => {
      if (!slot.actions.length) return;
      slot.redo.push(slot.actions.pop());
      state.controller.render();
      updateActionState();
   }, { signal: listeners.signal });
   clear.addEventListener("click", () => {
      slot.actions.length = 0;
      slot.redo.length = 0;
      state.controller.render();
      updateActionState();
   }, { signal: listeners.signal });
   root.addEventListener("click", (event) => {
      if (event.target === root) closeWritingPracticeSheet();
   }, { signal: listeners.signal });
   document.addEventListener("keydown", (event) => {
      if (!writingPracticeSheetState || writingPracticeSheetState.root !== root) return;
      if (event.key === "Escape") {
         event.preventDefault();
         event.stopImmediatePropagation();
         closeWritingPracticeSheet();
         return;
      }
      if (event.key !== "Tab") return;
      const focusable = Array.from(
         root.querySelectorAll("button:not(:disabled), input:not(:disabled), [tabindex]:not([tabindex='-1'])"),
      ).filter((element) => !element.hidden && element.getClientRects().length);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
         event.preventDefault();
         last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
         event.preventDefault();
         first.focus();
      }
   }, { capture: true, signal: listeners.signal });

   const closeButton = root.querySelector(".sheet-x");
   closeButton.focus({ preventScroll: true });
   requestAnimationFrame(() => {
      if (writingPracticeSheetState === state) {
         state.controller.resize();
         closeButton.focus({ preventScroll: true });
      }
   });
}

"use strict";

let reviewStrokeWriter = null;
let reviewStrokeWriterTarget = null;
let reviewStrokeWriterListeners = [];
let reviewStrokeLoadToken = 0;
let reviewStrokeData = null;
let reviewStrokeTab = "animation";
let reviewStrokeExpanded = false;

function reviewHanzi(value) {
   return Array.from(String(value || "")).filter((character) =>
      /^\p{Script=Han}$/u.test(character),
   );
}

function removeReviewStrokeWriterListeners() {
   reviewStrokeWriterListeners.forEach(({ type, listener, options }) =>
      document.removeEventListener(type, listener, options),
   );
   reviewStrokeWriterListeners = [];
}

function destroyReviewStrokeWriter() {
   if (reviewStrokeWriter && typeof reviewStrokeWriter.cancelAnimation === "function") {
      try { reviewStrokeWriter.cancelAnimation(); } catch (error) {}
   }
   if (reviewStrokeWriter && typeof reviewStrokeWriter.cancelQuiz === "function") {
      try { reviewStrokeWriter.cancelQuiz(); } catch (error) {}
   }
   if (reviewStrokeWriterTarget) reviewStrokeWriterTarget.innerHTML = "";
   removeReviewStrokeWriterListeners();
   reviewStrokeWriter = null;
   reviewStrokeWriterTarget = null;
}

function destroyReviewStrokeWorkspace() {
   reviewStrokeLoadToken++;
   destroyReviewStrokeWriter();
   reviewStrokeData = null;
}

function resetReviewStrokeSession() {
   destroyReviewStrokeWorkspace();
   reviewStrokeTab = "animation";
   reviewStrokeExpanded =
      typeof matchMedia === "function" && matchMedia("(min-width: 601px)").matches;
}

function managedReviewStrokeWriter(target, character, options) {
   const captured = [];
   const originalAddEventListener = document.addEventListener;
   document.addEventListener = function (type, listener, listenerOptions) {
      if (type === "mouseup" || type === "touchend")
         captured.push({ type, listener, options: listenerOptions });
      return originalAddEventListener.call(this, type, listener, listenerOptions);
   };
   try {
      const writer = HanziWriter.create(target, character, options);
      reviewStrokeWriterListeners = captured;
      return writer;
   } catch (error) {
      captured.forEach(({ type, listener, options: listenerOptions }) =>
         document.removeEventListener(type, listener, listenerOptions),
      );
      throw error;
   } finally {
      document.addEventListener = originalAddEventListener;
   }
}

function reviewStrokeBlockHtml(c, st) {
   const characters = reviewHanzi(c.hz);
   if (!characters.length) return "";
   const selected = Math.max(0, Math.min(Number(st.strokeCharacterIndex) || 0, characters.length - 1));
   st.strokeCharacterIndex = selected;
   const pills = characters.map((character, index) =>
      '<button type="button" class="review-stroke-character" data-review-stroke-character="' + index + '" aria-pressed="' + String(index === selected) + '" aria-label="Afficher ' + esc(character) + '">' + esc(character) + "</button>",
   ).join("");
   // Le nombre de traits et les deux actions (rejouer, s'entraîner) sont
   // regroupés avec le compteur de caractères et les onglets : sur mobile, la
   // section dépliée doit tenir sur un écran sans qu'aucune information ne
   // disparaisse. Sur un mot d'un seul caractère, la rangée de navigation ne
   // porterait que deux chevrons inertes et un « 1 / 1 » : seul le nombre de
   // traits est conservé, sur une ligne.
   const single = characters.length === 1;
   return (
      '<details class="review-strokes" id="review-strokes"' + (reviewStrokeExpanded ? " open" : "") + ' data-no-session-tap>' +
      '<summary><span>Écriture du caractère</span><small>Voir l’ordre des traits</small></summary>' +
      '<div class="review-stroke-content">' +
      (single
         ? '<span class="review-stroke-meta review-stroke-meta-solo" role="status" aria-live="polite">' +
           '<span class="review-stroke-strokes" id="review-stroke-status">Chargement…</span></span>'
         : '<div class="review-stroke-character-nav">' +
           '<button type="button" class="review-stroke-chevron" id="review-stroke-character-prev" aria-label="Caractère précédent"' + (selected === 0 ? " disabled" : "") + '>‹</button>' +
           '<div class="review-stroke-characters" aria-label="Caractères du mot">' + pills + "</div>" +
           '<button type="button" class="review-stroke-chevron" id="review-stroke-character-next" aria-label="Caractère suivant"' + (selected === characters.length - 1 ? " disabled" : "") + '>›</button>' +
           '<span class="review-stroke-meta" role="status" aria-live="polite">' +
           '<span class="review-stroke-count" id="review-stroke-count">' + (selected + 1) + " / " + characters.length + "</span>" +
           '<span class="review-stroke-strokes" id="review-stroke-status">Chargement…</span></span></div>') +
      '<div class="review-stroke-actions"><div class="review-stroke-tabs" role="tablist" aria-label="Affichage de l’ordre des traits">' +
      '<button type="button" role="tab" data-review-stroke-tab="animation" aria-selected="' + String(reviewStrokeTab === "animation") + '">Animation</button>' +
      '<button type="button" role="tab" data-review-stroke-tab="steps" aria-selected="' + String(reviewStrokeTab === "steps") + '">Étapes</button></div>' +
      '<button type="button" class="stroke-icon-button" id="review-stroke-replay" aria-label="Rejouer l’animation" title="Rejouer l’animation">' + strokeReplayIconHtml() + "</button>" +
      '<button type="button" class="stroke-icon-button review-stroke-practice" id="review-stroke-practice" aria-label="S’entraîner à écrire" title="S’entraîner à écrire">' + strokeWriteIconHtml() + "</button></div>" +
      '<div class="review-stroke-panel" id="review-stroke-animation"' + (reviewStrokeTab === "animation" ? "" : " hidden") + '><div class="review-stroke-grid"><div id="review-stroke-target"></div></div></div>' +
      '<div class="review-stroke-panel" id="review-stroke-steps"' + (reviewStrokeTab === "steps" ? "" : " hidden") + '><div class="review-stroke-steps-list" id="review-stroke-steps-list" aria-label="Étapes des traits"></div></div>' +
      characterCompositionShellHtml("review-character-composition") +
      "</div></details>"
   );
}

// Depuis une séance, l'entraînement est un exercice de rappel : modèle masqué,
// consigne en pinyin, arrière-plan flouté (voir js/writing-practice-sheet.js).
function openReviewWritingPractice(c, initialIndex) {
   if (!c || typeof openWritingPracticeSheet !== "function") return;
   openWritingPracticeSheet(c.hz, { mode: "review", pinyin: c.py, initialIndex });
}

function setReviewStrokeCountLabel(text) {
   // Le compteur de traits vit désormais hors du panneau Animation : il reste
   // donc visible sous l'onglet Étapes et doit être mis à jour dans les deux cas.
   const status = $("review-stroke-status");
   if (status) status.textContent = text;
}

function renderReviewStrokeSteps(data) {
   const target = $("review-stroke-steps-list");
   if (!target || !data || typeof strokePanelSvg !== "function") return;
   target.innerHTML = Array.from({ length: data.strokeCount }, (_, index) => {
      const labelId = "review-stroke-step-label-" + index;
      return '<div class="review-stroke-step"><span class="review-stroke-step-number">' + (index + 1) + '</span><span id="' + labelId + '" class="sr-only">Trait ' + (index + 1) + " sur " + data.strokeCount + '</span>' + strokePanelSvg(data, index, { showFuture: false, showGrid: true }, labelId) + "</div>";
   }).join("");
}

function createReviewStrokeAnimation(data, autoplay) {
   destroyReviewStrokeWriter();
   const target = $("review-stroke-target");
   const status = $("review-stroke-status");
   if (!target || typeof HanziWriter === "undefined") return;
   const size = Math.min(164, target.parentElement.clientWidth || 164);
   target.style.width = size + "px";
   target.style.height = size + "px";
   reviewStrokeWriterTarget = target;
   try {
      reviewStrokeWriter = managedReviewStrokeWriter(target, data.character, {
         width: size,
         height: size,
         padding: 10,
         showCharacter: true,
         showOutline: true,
         strokeColor: "#17140F",
         outlineColor: "#CDBFA1",
         charDataLoader: () => data,
         ...(typeof speedOpts === "function" ? speedOpts(db.settings.strokeSpeed) : {}),
      });
      if (status) status.textContent = data.strokeCount + " traits";
      const reduced = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (autoplay && !reduced) reviewStrokeWriter.animateCharacter();
   } catch (error) {
      destroyReviewStrokeWriter();
      const root = $("review-strokes");
      if (root) root.hidden = true;
   }
}

async function loadReviewStrokeCharacter(character, autoplay, characters) {
   const token = ++reviewStrokeLoadToken;
   destroyReviewStrokeWriter();
   reviewStrokeData = null;
   setReviewStrokeCountLabel("Chargement…");
   setCharacterCompositionLoading(character, ".review-character-composition");
   if (typeof loadCharacterCompositions === "function") {
      loadCharacterCompositions(characters || [character]).then((compositions) => {
         if (
            token !== reviewStrokeLoadToken ||
            !$("review-strokes")?.open ||
            !session.active
         ) return;
         renderCharacterComposition(
            compositions.get(character) || null,
            ".review-character-composition",
         );
      }).catch(() => {
         if (token === reviewStrokeLoadToken)
            renderCharacterComposition(null, ".review-character-composition");
      });
   } else renderCharacterComposition(null, ".review-character-composition");
   try {
      if (typeof loadStrokeCharacterData !== "function") throw new Error("stroke data unavailable");
      const data = await loadStrokeCharacterData(character);
      if (token !== reviewStrokeLoadToken || !$("review-strokes") || !session.active) return;
      reviewStrokeData = data;
      setReviewStrokeCountLabel(data.strokeCount + " traits");
      if (reviewStrokeTab === "steps") renderReviewStrokeSteps(data);
      else createReviewStrokeAnimation(data, autoplay);
   } catch (error) {
      if (token !== reviewStrokeLoadToken) return;
      const root = $("review-strokes");
      if (root) root.hidden = true;
   }
}

function activateReviewStrokeTab(tab) {
   if (!["animation", "steps"].includes(tab)) return;
   reviewStrokeTab = tab;
   document.querySelectorAll("[data-review-stroke-tab]").forEach((button) =>
      button.setAttribute("aria-selected", String(button.dataset.reviewStrokeTab === tab)),
   );
   const animation = $("review-stroke-animation");
   const steps = $("review-stroke-steps");
   if (animation) animation.hidden = tab !== "animation";
   if (steps) steps.hidden = tab !== "steps";
   if (!reviewStrokeData) return;
   if (tab === "steps") {
      destroyReviewStrokeWriter();
      renderReviewStrokeSteps(reviewStrokeData);
   } else createReviewStrokeAnimation(reviewStrokeData, false);
}

function wireReviewStrokeBlock(c, st) {
   const root = $("review-strokes");
   if (!root) return;
   const characters = reviewHanzi(c.hz);
   const selectCharacter = (nextIndex) => {
      if (!root.isConnected) return;
      const index = Math.max(0, Math.min(nextIndex, characters.length - 1));
      st.strokeCharacterIndex = index;
      root.querySelectorAll("[data-review-stroke-character]").forEach((button) =>
         button.setAttribute("aria-pressed", String(Number(button.dataset.reviewStrokeCharacter) === index)),
      );
      const previous = root.querySelector("#review-stroke-character-prev");
      const next = root.querySelector("#review-stroke-character-next");
      const count = root.querySelector("#review-stroke-count");
      if (previous) previous.disabled = index === 0;
      if (next) next.disabled = index === characters.length - 1;
      if (count) count.textContent = (index + 1) + " / " + characters.length;
      loadReviewStrokeCharacter(characters[index], true, characters);
      if (characters[index + 1] && typeof preloadStrokeCharacterData === "function")
         preloadStrokeCharacterData(characters[index + 1]);
   };
   root.ontoggle = () => {
      if (!root.isConnected) return;
      reviewStrokeExpanded = root.open;
      if (root.open) selectCharacter(st.strokeCharacterIndex || 0);
      else destroyReviewStrokeWorkspace();
   };
   root.querySelectorAll("[data-review-stroke-character]").forEach((button) =>
      button.onclick = () => selectCharacter(Number(button.dataset.reviewStrokeCharacter)),
   );
   // absents sur un mot d'un seul caractère
   const previousCharacter = $("review-stroke-character-prev");
   const nextCharacter = $("review-stroke-character-next");
   if (previousCharacter) previousCharacter.onclick = () => selectCharacter((st.strokeCharacterIndex || 0) - 1);
   if (nextCharacter) nextCharacter.onclick = () => selectCharacter((st.strokeCharacterIndex || 0) + 1);
   root.querySelectorAll("[data-review-stroke-tab]").forEach((button) =>
      button.onclick = () => activateReviewStrokeTab(button.dataset.reviewStrokeTab),
   );
   $("review-stroke-practice").onclick = () => {
      const index = Math.max(0, Math.min(Number(st.strokeCharacterIndex) || 0, characters.length - 1));
      openReviewWritingPractice(c, index);
   };
   $("review-stroke-replay").onclick = () => {
      if (!reviewStrokeData) return;
      // le bouton partage désormais la ligne des onglets : depuis « Étapes », il
      // ramène d'abord sur l'animation plutôt que de rejouer dans un panneau masqué
      if (reviewStrokeTab !== "animation") activateReviewStrokeTab("animation");
      createReviewStrokeAnimation(reviewStrokeData, true);
   };
   if (root.open) selectCharacter(st.strokeCharacterIndex || 0);
}

         // Deux filtres, deux conflits différents.

         // d'écriture se manipule — ni l'un ni l'autre ne doit retourner la carte.
         const SESSION_INTERACTIVE_SELECTOR =

         // GESTE (changer de carte) : seuls les contrôles réellement actionnables et

         // glissement : c'est là que le pouce se pose naturellement.
         const SESSION_SWIPE_BLOCKING_SELECTOR =
            "button, input, select, textarea, a, label, summary, canvas, .mizi, " +
            ".review-stroke-characters, .review-stroke-steps-list, .composition-formula, .composition-roles";
         const SWIPE_HINT_KEY = "mo-studio-session-swipe-hint-seen-v1";

            sessionSwipeHintSeen = true;

                  ok: null,
                  front: null,

               };

         function frontOf(c, st) {
            // recto de la carte : zh ou fr, stable pendant toute la séance
            if (st.front) return st.front;
            const d = db.settings.direction;
            st.front =
               d === "mix"

         function pickWriteTask(c, st) {
            // choisit une tâche écrite selon les réglages et le sens de révision
            const wm = db.settings.writeModes;
            const front = frontOf(c, st);
            const zhSide = front === "zh";
            const frSide = front === "fr";
            const canTrace =
               Array.from(c.hz).some((ch) => /[\u4e00-\u9fff]/.test(ch)) &&
               c.hz.length <= 3;
            const opts = [];
            if (wm.fr && zhSide) opts.push("fr");
            if (wm.pinyin && zhSide && c.py) opts.push("py-read");
            if (wm.pinyin && frSide && c.py) opts.push("py-prod");
            if (wm.trace && frSide && canTrace) opts.push("trace");
            // Garde une consigne cohérente avec le sens même lorsque les
            // préférences avancées excluent tous les exercices compatibles.
            if (!opts.length && zhSide)
               opts.push(c.fr ? "fr" : "py-read");
            if (!opts.length && frSide)
               opts.push(c.py ? "py-prod" : canTrace ? "trace" : "fr");

                  inputHtml("ni3 hao3 ou nǐ hǎo")
               );
            return (
               '<div class="w-lab">Trace en caractères chinois</div><div class="fr-big ink-in">' +
               esc(c.fr) +
               "</div>" +
               pyLine +
               '<div class="mizi"><div id="s-writer"></div><div id="s-ghost" class="ghost" hidden>' +
               esc(c.hz) +
               '</div><canvas id="s-canvas" hidden></canvas></div>' +
               '<div class="w-note" id="s-tracenote">Trace chaque caractère, trait par trait.</div>' +
               '<div class="t-btns" id="t-btns" hidden><button class="btn" id="t-no">Raté</button><button class="btn primary" id="t-ok">Réussi</button></div>'
            );
         }

         function gradesHtml(c, options) {
            const iv = gradeIv(c);
            const b = (g, lab) =>
               '<button class="gr ' +
               g +
               '" data-grade="' +
               g +
               '">' +
               lab +
               "<small>" +
               fmtIv(iv[g]) +
               "</small></button>";
            return (
               '<div class="grades">' +
               b("again", "Raté") +
               b("hard", "Difficile") +
               b("good", "Correct") +
               b("easy", "Facile") +
               "</div>" + sessionNavigationHtml(options)
            );
         }
         // Rangée discrète : le balayage horizontal fait déjà précédent/suivant, cette
         // barre sert la découvrabilité et le desktop. En Découverte elle porte la seule
         // action d'avancement de l'écran, elle reprend donc un gabarit plein format.
         function sessionNavigationHtml(options) {
            const { flip = false, solo = false } = options || {};
            const last = session.index >= session.cards.length - 1;
            return (
               '<nav class="session-nav' + (solo ? " solo" : "") + '" aria-label="Navigation dans la séance">' +
               '<button type="button" class="session-nav-button previous" id="s-prev"' +
               (session.index === 0 ? " disabled aria-disabled=\"true\"" : "") +
               '>‹ <span>Précédent</span></button>' +
               (flip
                  ? '<button type="button" class="session-nav-button flip" id="s-flip" aria-label="Revoir le recto" title="Revoir le recto">↺ <span>Recto</span></button>'
                  : "") +
               '<button type="button" class="session-nav-button next" id="s-next"><span>' +
               (last ? "Terminer" : "Suivant") +
               "</span> ›</button></nav>"
            );
         }
         function sessionFooterHtml(c, st) {
            if (session.mode === "discover") {
               return sessionNavigationHtml({ solo: true });
            }
            if (session.mode === "cards") {
               if (!st.revealed)
                  return '<div class="s-foot"><button class="btn primary big" id="s-flip" type="button">Retourner</button></div>';
               // le bouton de retournement reste disponible au verso, mais en retrait
               // par rapport à la notation SRS pour ne jamais se substituer à elle : il
               // rejoint la rangée de navigation, sous les quatre boutons de note.
               return gradesHtml(c, { flip: true });
            }
            if (session.mode === "written" && !st.checked)
               return '<div class="s-foot"><button class="btn ghost" id="s-skip">Voir la réponse</button><button class="btn primary" id="s-check">Vérifier</button></div>';
            // verso (cartes) ou réponse vérifiée (écrit) : boutons de notation SRS
            return gradesHtml(c);
         }
         // Crayon du recto : s'entraîner avant d'avoir vu la réponse. Il n'ouvre que la
         // modale — pas de retournement, pas de changement de st.revealed.
         function sessionPracticeButtonHtml() {
            return (
               '<button type="button" class="stroke-icon-button fl-practice" id="s-practice" ' +
               'aria-label="S’entraîner à écrire" title="S’entraîner à écrire">' +
               strokeWriteIconHtml() +
               "</button>"
            );
         }
         function sessionSwipeHintHtml() {
            return (
               '<div class="session-swipe-hint" role="status" aria-live="polite">' +
               "Glisse à gauche ou à droite pour changer de carte — ça ne note rien.</div>"
            );
         }

         function renderSession() {
            destroyReviewStrokeWorkspace();
            const c = currentCard();
            if (!c) {
               endSession();
               return;
            }
            document.body.classList.add("in-session");
            const st = getState(session.index);
            if (session.mode === "discover") st.revealed = true;
            if (session.mode === "written" && !st.task)
               st.task = pickWriteTask(c, st);
            const front = session.mode === "cards" ? frontOf(c, st) : "zh";
            // Les flashcards révèlent toujours le pinyin au verso, quel que
            // soit le sens choisi. Les autres modes conservent leur réglage.
            const showPyBack =
               session.mode === "cards" || db.settings.pinyin !== "never";
            const hideSay =
               (session.mode === "cards" && front === "fr" && !st.revealed) ||
               (session.mode === "written" && !st.checked && st.front === "fr");

            let body = "";
            if (session.mode === "written" && !st.checked) {
               body = writtenPromptHtml(c, st);
            } else if (session.mode === "cards" && !st.revealed) {
               body =
                  front === "zh"
                     ? '<div class="hanzi ink-in" data-say="' +
                       esc(c.hz) +
                       '">' +
                       esc(c.hz) +
                       "</div>" +
                       '<div class="hint">Appuie pour retourner</div>'
                     : '<div class="fr-big ink-in">' +
                       esc(c.fr) +
                       '</div><div class="hint">Appuie pour retourner</div>';
            } else {
               let verdict = "";
               if (session.mode === "written" && st.checked) {
                  const lab = st.ok
                     ? "Juste !"
                     : st.skipped
                       ? "Réponse affichée"
                       : "✗ Raté";
                  verdict =
                     '<div class="verdict ' +
                     (st.ok ? "ok" : "ko") +
                     '">' +
                     lab +
                     (st.note ? " <span>· " + esc(st.note) + "</span>" : "") +
                     "</div>";
               }
               // ordre du verso : le caractère et son pinyin, les actions secondaires
               // compactes, puis le sens, l'exemple, la note et l'écriture.
               body =
                  verdict +
                  '<div class="hanzi ink-in" data-say="' +
                  esc(c.hz) +
                  '">' +
                  esc(c.hz) +
                  "</div>" +
                  (showPyBack && c.py
                     ? '<div class="pinyin">' + colorPinyin(c.py) + "</div>"
                     : "") +
                  (session.mode === "discover" ? "" : actionsHtml(c)) +
                  (session.mode !== "cards" || front === "zh"
                     ? '<div class="sep"></div><div class="fr">' + esc(c.fr) + "</div>"
                     : "") +
                  (c.exHz ? exampleHtml(c) : "") +
                  noteHtml(c) +
                  (session.mode === "cards" ? reviewStrokeBlockHtml(c, st) : "");
            }

            const modeName = {
               cards: "Cartes",
               written: "Écrit",
               discover: "Découverte",
            }[session.mode];
            const showSwipeHint = session.index === 0 && !sessionSwipeHintSeen;
            if (showSwipeHint) markSwipeHintSeen();
            // le verso garde son propre accès dans « Écriture du caractère »
            const showPracticeButton =
               session.mode === "cards" && !st.revealed && reviewHanzi(c.hz).length > 0;
            $("view").innerHTML =
               '<section class="sess" id="sess">' +
               '<div class="s-top">' +
               '<button class="s-x" id="s-exit" aria-label="Quitter">×</button>' +
               '<div class="s-scope">' +
               esc(session.scopeLabel) +
               " · " +
               modeName +
               "</div>" +
               '<div class="s-count">' +
               (session.index + 1) +
               " / " +
               session.cards.length +
               "</div>" +
               "</div>" +
               '<div class="s-bar"><i style="width:' +
               (((session.index + 1) / session.cards.length) * 100).toFixed(1) +
               '%"></i></div>' +
               // la carte occupe toute la hauteur restante : une barre d'outils en
               // haut, puis une zone centrée qui défile d'elle-même si le verso
               // déplié dépasse — la page, elle, ne défile pas. L'astuce de balayage
               // flotte au-dessus du bas de la carte, sans rien pousser.
               '<div class="flash card" id="flash">' +
               '<div class="fl-tools">' +
               '<button class="seal fl-seal" data-say="' +
               esc(c.hz) +
               '"' +
               (hideSay ? ' style="visibility:hidden"' : "") +
               ' aria-label="Écouter">听</button>' +
               "</div>" +
               '<div class="fl-body"><div class="fl-inner">' +
               body +
               "</div></div>" +
               (showPracticeButton ? sessionPracticeButtonHtml() : "") +
               (showSwipeHint ? sessionSwipeHintHtml() : "") +
               "</div>" +
               sessionFooterHtml(c, st) +
               "</section>";
            wireSession(c, st);
            if (session.mode === "cards" && st.revealed)
               wireReviewStrokeBlock(c, st);
            persistSession();
         }

         function advance() {
            if (session.index >= session.cards.length - 1) endSession();
            else {
               session.index++;
               renderSession();
            }
         }
         function previousCard() {
            if (session.index <= 0) return;
            session.index--;
            renderSession();
         }
         // seuils calés sur un pouce : assez haut pour ne pas s'amorcer sur un appui
         // tremblotant, assez bas pour qu'un mouvement franc mais court suffise.
         const SESSION_SWIPE_START = 16;
         const SESSION_SWIPE_COMMIT = 44;
         function wireSessionSwipe(zone, card) {
            // le geste porte sur toute la zone de séance (hors contrôles
            // interactifs), mais le retour visuel reste localisé à la carte :
            // glisser ne note jamais rien, seuls les quatre boutons de
            // notation le font.
            if (!zone || !card || !("PointerEvent" in window)) return;
            let gesture = null;
            // La capture, indispensable pour suivre un balayage qui sort de la zone,
            // redirige le clic qui suit vers la zone — un ancêtre de la carte. On
            // rejoue donc l'appui sur l'élément réellement sous le doigt, pour que le
            // retournement comme la lecture audio (data-say) se déclenchent.
            // Rejoué seulement si le doigt n'a pas quitté l'élément pressé : un
            // relâchement au-dessus d'un bouton ne doit jamais l'actionner.
            const relayTap = (event, origin) => {
               const target = document.elementFromPoint(event.clientX, event.clientY);
               if (!target || !origin) return;
               if (target !== origin && !origin.contains(target)) return;
               target.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
            };
            const finish = (event, cancelled) => {
               if (!gesture || event.pointerId !== gesture.pointerId) return;
               const current = gesture;
               gesture = null;
               card.classList.remove("is-session-dragging", "is-session-drag-left", "is-session-drag-right");
               card.style.removeProperty("--session-drag-x");
               if (zone.hasPointerCapture && zone.hasPointerCapture(event.pointerId))
                  zone.releasePointerCapture(event.pointerId);
               if (cancelled) {
                  card._suppressSessionClickUntil = Date.now() + 500;
                  return;
               }
               if (!current.horizontal) {
                  if (current.captured) relayTap(event, current.target);
                  return;
               }
               const dx = event.clientX - current.x;
               const dy = event.clientY - current.y;
               if (Math.abs(dx) < SESSION_SWIPE_COMMIT || Math.abs(dx) <= Math.abs(dy) * 1.1) return;
               const selection = typeof getSelection === "function" ? getSelection() : null;
               if (selection && typeof selection.removeAllRanges === "function") selection.removeAllRanges();
               if (dx < 0) advance();
               else previousCard();
            };
            zone.onpointerdown = (event) => {
               if (event.button !== 0 || event.target.closest(SESSION_SWIPE_BLOCKING_SELECTOR)) return;
               gesture = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, horizontal: false, captured: false, target: event.target };
               if (zone.setPointerCapture) {
                  try {
                     zone.setPointerCapture(event.pointerId);
                     gesture.captured = true;
                  } catch (error) {}
               }
            };
            zone.onpointermove = (event) => {
               if (!gesture || event.pointerId !== gesture.pointerId) return;
               const dx = event.clientX - gesture.x;
               const dy = event.clientY - gesture.y;
               if (!gesture.horizontal) {
                  if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
                     finish(event, true);
                     return;
                  }
                  if (Math.abs(dx) < SESSION_SWIPE_START || Math.abs(dx) <= Math.abs(dy) * 1.2) return;
                  gesture.horizontal = true;
                  card.classList.add("is-session-dragging");
               }
               if (event.cancelable) event.preventDefault();
               const clamped = Math.max(-64, Math.min(64, dx));
               card.style.setProperty("--session-drag-x", String(clamped));
               card.classList.toggle("is-session-drag-left", clamped < -4);
               card.classList.toggle("is-session-drag-right", clamped > 4);
            };
            zone.onpointerup = (event) => finish(event, false);
            zone.onpointercancel = (event) => finish(event, true);
            zone.onlostpointercapture = (event) => {
               if (gesture && event.pointerId === gesture.pointerId) finish(event, true);
            };
         }
         function wireSession(c, st) {
            $("s-exit").onclick = endSession;
            const flip = () => {
               const revealing = !st.revealed;
               st.revealed = revealing;
               renderSession();
               if (revealing && !st.everRevealed) {
                  st.everRevealed = true;
                  if (frontOf(c, st) === "fr") speak(c.hz);
               }
            };
            if ($("s-flip")) $("s-flip").onclick = flip;
            const fl = $("flash");
            // toute la surface de la carte retourne, hors contrôles interactifs :
            // même règle que le clic soit natif ou relayé par le gestionnaire de geste.
            const tapCard = (target) => {
               if (session.mode !== "cards") return;
               if (Date.now() < (fl._suppressSessionClickUntil || 0)) return;
               if (!target || !fl.contains(target) || target.closest(SESSION_INTERACTIVE_SELECTOR)) return;
               flip();
            };
            wireSessionSwipe($("sess"), fl);
            if (session.mode === "cards") {
               fl.style.cursor = "pointer";
               fl.onclick = (e) => tapCard(e.target);
            }
            if ($("s-practice"))
               $("s-practice").onclick = () => openReviewWritingPractice(c, 0);
            if ($("s-next")) $("s-next").onclick = advance;
            if ($("s-prev"))
               $("s-prev").onclick = previousCard;
            if ($("s-check")) $("s-check").onclick = checkWritten;
            if ($("s-skip"))
               $("s-skip").onclick = () => {
                  st.checked = true;
                  st.ok = false;
                  st.skipped = true;
                  renderSession();
                  speak(c.hz);
               };
            document.querySelectorAll("[data-grade]").forEach(
               (b) =>
                  (b.onclick = () => {
                     const g = b.dataset.grade;
                     st.grade = g;
                     applyGrade(c, g);
                     if (typeof maybeShowConfusablePairTest === "function" && maybeShowConfusablePairTest(c, advance))
                        return;
                     advance();
                  }),
            );
            if ($("a-fav"))
               $("a-fav").onclick = () => {
                  c.fav = !c.fav;
                  save();
                  renderSession();
               };
            if ($("a-hard"))
               $("a-hard").onclick = () =>
                  openDelaySheet(c, (marked) => {
                     if (marked) session.live.marked++;
                     if (session.active) renderSession();
                  });
            if ($("a-acq"))
               $("a-acq").onclick = () => {
                  c.acquired = !c.acquired;
                  if (c.acquired) {
                     c.due = null;
                     session.live.acquired++;
                  }
                  save();
                  renderSession();
               };
            const wi = $("w-input");
            if (wi) {
               if (st.task !== "fr") {
                  wi.addEventListener("input", () => {
                     // conversion ni3 -> nǐ à la volée
                     const v = numToAccent(wi.value);
                     if (v !== wi.value) wi.value = v;
                  });
               }
               setTimeout(() => wi.focus(), 60);
            }
            if (
               session.mode === "written" &&
               !st.checked &&
               st.task === "trace"
            )
               setupSessionTrace(c, st);
         }

         /* -------- vérification du mode écrit -------- */
         function pyMatch(target, given) {
            const t = numToAccent(String(target || "")).toLowerCase();
            const g = numToAccent(String(given || "")).toLowerCase();
            const keep = (s) =>
               s
                  .normalize("NFC")
                  .replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "");
            if (keep(t) === keep(g) && keep(g)) return { ok: true, note: "" };
            if (flatten(t) === flatten(g) && flatten(g))
               return {
                  ok: false,
                  note: "Bonnes syllabes, mais vérifie les tons.",
               };
            return { ok: false, note: "" };
         }
         function normFr(s) {
            const base = String(s || "")
               .toLowerCase()
               .replace(/\(.*?\)/g, " ")
               .replace(/[’']/g, " ")
               .normalize("NFD")
               .replace(/[\u0300-\u036f]/g, "");
            const clean = (x) => x.replace(/[^a-z]+/g, "");
            // retire les articles, mais garde le mot si tout disparaît (ex : « un »)
            return (
               clean(
                  base.replace(
                     /\b(le|la|les|l|un|une|des|du|de|d|au|aux)\b/g,
                     " ",
                  ),
               ) || clean(base)
            );
         }
         function frMatch(target, given) {
            const g = normFr(given);
            if (!g) return false;
            const segs = String(target || "")
               .split(/[,;/·]/)
               .map(normFr)
               .filter(Boolean);
            if (segs.includes(g)) return true;
            return segs.some(
               (seg) =>
                  (g.length >= 4 && seg.includes(g)) ||
                  (seg.length >= 4 && g.includes(seg)),
            );
         }
         function checkWritten() {
            if (!session.active) return;
            const c = currentCard();
            const st = getState(session.index);
            if (!c || !st || st.checked || session.mode !== "written") return;
            let ok = false,
               note = "";
            if (st.task === "trace") {
               if (!st.traceOk && !st.traceReady) {
                  toast("Termine ton tracé d'abord (ou « Voir la réponse »).");
                  return;
               }
               ok = !!st.traceOk;
            } else {
               const given = ($("w-input") ? $("w-input").value : "").trim();
               if (!given) {
                  toast("Écris ta réponse d'abord.");
                  return;
               }
               if (st.task === "fr") ok = frMatch(c.fr, given);
               else {
                  const r = pyMatch(c.py, given);
                  ok = r.ok;
                  note = r.note;
               }
            }
            st.checked = true;
            st.ok = ok;
            st.note = note;
            renderSession();
            speak(c.hz);
         }

         /* -------- tracé pendant la séance -------- */
         function setupSessionTrace(c, st) {
            const target = $("s-writer");
            if (!target) return;
            const chars = Array.from(c.hz).filter((ch) =>
               /[\u4e00-\u9fff]/.test(ch),
            );
            if (!chars.length || typeof HanziWriter === "undefined") {
               fallbackTrace(c, st);
               return;
            }
            const size = Math.min(280, target.parentElement.clientWidth || 280);
            target.style.width = size + "px";
            target.style.height = size + "px";
            const note = $("s-tracenote");
            let i = 0;
            st.traceOk = false;
            st.traceReady = false;
            const runOne = () => {
               if (
                  !session.active ||
                  currentCard() !== c ||
                  getState(session.index).checked
               )
                  return;
               target.innerHTML = "";
               if (note)
                  note.textContent =
                     chars.length > 1
                        ? "Caractère " + (i + 1) + " / " + chars.length
                        : "Trace le caractère, trait par trait.";
               const writer = HanziWriter.create(target, chars[i], {
                  width: size,
                  height: size,
                  padding: 10,
                  showCharacter: false,
                  showOutline: true,
                  showHintAfterMisses: 2,
                  strokeColor: "#17140F",
                  outlineColor: "#CDBFA1",
                  drawingColor: "#9E2B25",
                  onLoadCharDataError: () => {
                     if (
                        session.active &&
                        currentCard() === c &&
                        !getState(session.index).checked
                     )
                        fallbackTrace(c, st);
                  },
               });
               writer.quiz({
                  onComplete: () => {
                     i++;
                     if (i < chars.length) setTimeout(runOne, 450);
                     else {
                        st.traceOk = true;
                        st.traceReady = true;
                        if (note)
                           note.textContent =
                              "Tracé terminé — appuie sur Vérifier.";
                     }
                  },
               });
            };
            runOne();
         }
         function fallbackTrace(c, st) {
            // repli si les données de traits ne chargent pas : tracé libre auto-évalué
            const target = $("s-writer"),
               ghost = $("s-ghost"),
               canvas = $("s-canvas"),
               btns = $("t-btns"),
               note = $("s-tracenote");
            if (!target || !ghost || !canvas) return;
            target.hidden = true;
            ghost.hidden = false;
            canvas.hidden = false;
            if (btns) btns.hidden = false;
            if (note)
               note.textContent =
                  "Tracé libre : recopie le modèle, puis évalue-toi.";
            const box = ghost.parentElement;
            const size = Math.min(280, box.clientWidth || 280);
            canvas.width = size;
            canvas.height = size;
            const len = Array.from(c.hz).length;
            ghost.style.fontSize =
               (len >= 3 ? 80 : len === 2 ? 125 : 200) + "px";
            paintPad(canvas);
            st.traceReady = true;
            if ($("t-ok"))
               $("t-ok").onclick = () => {
                  st.traceOk = true;
                  checkWritten();
               };
            if ($("t-no"))
               $("t-no").onclick = () => {
                  st.traceOk = false;
                  checkWritten();
               };
         }
         function paintPad(canvas) {
            const ctx = canvas.getContext("2d");
            ctx.lineWidth = 7;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "#17140F";
            let drawing = false;
            const pos = (e) => {
               const r = canvas.getBoundingClientRect();
               return [
                  ((e.clientX - r.left) * canvas.width) / r.width,
                  ((e.clientY - r.top) * canvas.height) / r.height,
               ];
            };
            canvas.onpointerdown = (e) => {
               drawing = true;
               canvas.setPointerCapture(e.pointerId);
               const p = pos(e);
               ctx.beginPath();
               ctx.moveTo(p[0], p[1]);
            };
            canvas.onpointermove = (e) => {
               if (!drawing) return;
               const p = pos(e);
               ctx.lineTo(p[0], p[1]);
               ctx.stroke();
            };
            canvas.onpointerup = canvas.onpointercancel = () => {
               drawing = false;
            };
         }

         /* -------- fin de séance -------- */
         function endSession() {
            destroyReviewStrokeWorkspace();
            const sts = session.states.filter(Boolean);
            const seen = sts.filter(
               (s) => s.everRevealed || s.checked || s.grade,
            ).length;
            const checkedN = sts.filter((s) => s.checked).length;
            const right = sts.filter((s) => s.checked && s.ok === true).length;
            const gCount = (g) => sts.filter((s) => s.grade === g).length;
            const errIds = [];
            session.states.forEach((s, i) => {
               if (!s) return;
               if (s.grade === "again" || (s.checked && s.ok === false)) {
                  const id = session.cards[i] && session.cards[i].id;
                  if (id && !errIds.includes(id)) errIds.push(id);
               }
            });
            session.summary = {
               total: session.cards.length,
               seen,
               right,
               checked: checkedN,
               again: gCount("again"),
               hard: gCount("hard"),
               good: gCount("good"),
               easy: gCount("easy"),
               marked: session.live.marked,
               acquired: session.live.acquired,
