<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <meta
         name="viewport"
         content="width=device-width, initial-scale=1, viewport-fit=cover"
      />
      <meta name="theme-color" content="#DED2BA" />
      <title>墨室 · Mò Studio</title>
      <link
         rel="icon"
         href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%239E2B25'/%3E%3Ctext%20x='50'%20y='70'%20font-size='56'%20text-anchor='middle'%20fill='%23EFE7D3'%20font-family='serif'%3E墨%3C/text%3E%3C/svg%3E"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <script data-mo-app src="vendor/hanzi-writer/3.7.3/hanzi-writer.min.js"></script>
      <link rel="stylesheet" href="css/main.css" />
      <link rel="stylesheet" href="css/review.css" />
      <link rel="stylesheet" href="css/stroke-order.css" />
      <link rel="stylesheet" href="css/search.css" />
      <link rel="stylesheet" href="css/listening.css" />
      <link rel="stylesheet" href="css/grammar.css" />
      <link rel="stylesheet" href="css/learning-path.css" />
      <link rel="stylesheet" href="css/learning-units.css" />
      <link rel="stylesheet" href="css/writing.css" />
      <link rel="stylesheet" href="css/overlays.css" />
      <link rel="stylesheet" href="css/personal-library.css" />
      <link rel="stylesheet" href="css/responsive.css" />
   </head>
   <body>
      <header class="top">
         <div class="brand">
            <span class="brand-seal">墨</span
            ><span class="brand-name">Mò Studio</span>
         </div>
         <button class="seal-btn" id="btn-settings" aria-label="Réglages">
            设
         </button>
      </header>
      <main id="view"></main>
      <nav class="nav" aria-label="Navigation">
         <button data-view="path" aria-pressed="false">
            <span class="n-hz">学</span><span class="n-lab">Parcours</span>
         </button>
         <button data-view="write" aria-pressed="false">
            <span class="n-hz">写</span><span class="n-lab">Écrire</span>
         </button>
         <button data-view="search" aria-pressed="false">
            <span class="n-hz">查</span><span class="n-lab">Rechercher</span>
         </button>
         <button data-view="lib" aria-pressed="false">
            <span class="n-hz">库</span><span class="n-lab">Mes mots</span>
         </button>
         <button data-view="learn" aria-pressed="true">
            <span class="n-hz">复</span><span class="n-lab">Réviser</span>
         </button>
      </nav>
      <div id="sheet" aria-hidden="true"><div class="sheet-card"></div></div>
      <div id="toast" role="status"></div>
      <input
         type="file"
         id="file-global"
         accept=".json,application/json"
         hidden
      />
      <script data-mo-app src="js/utils.js"></script>
      <script data-mo-app src="js/search/normalization.js"></script>
      <script data-mo-app src="js/hsk/hsk-loader.js"></script>
      <script data-mo-app src="js/audio.js"></script>
      <script data-mo-app src="js/state.js"></script>
      <script data-mo-app src="js/storage.js"></script>
      <script data-mo-app src="js/personal-library.js"></script>
      <script data-mo-app src="js/course-progress-storage.js"></script>
      <script data-mo-app src="js/history.js"></script>
      <script data-mo-app src="js/views/home.js"></script>
      <script data-mo-app src="js/views/path.js"></script>
      <script data-mo-app src="js/views/writing.js"></script>
      <script data-mo-app src="js/views/review.js"></script>
      <script data-mo-app src="js/views/library.js"></script>
      <script data-mo-app src="js/dictionary/dictionary-loader.js"></script>
      <script data-mo-app src="js/dictionary/source-attribution.js"></script>
      <script data-mo-app src="js/search/ranking.js"></script>
      <script data-mo-app src="js/search/search-engine.js"></script>
      <script data-mo-app src="js/search/search-view.js"></script>
      <script data-mo-app src="js/strokes/character-data-loader.js"></script>
      <script data-mo-app src="js/strokes/character-composition-loader.js"></script>
      <script data-mo-app src="js/strokes/character-composition.js"></script>
      <script data-mo-app src="js/strokes/stroke-gallery.js"></script>
      <script data-mo-app src="js/strokes/writer-controller.js"></script>
      <script data-mo-app src="js/dictionary/dictionary-detail.js"></script>
      <script data-mo-app src="js/strokes/sequence-viewer.js"></script>
      <script data-mo-app src="js/learning-units/learning-units-loader.js"></script>
      <script data-mo-app src="js/learning-units/hsk1-root-loader.js"></script>
      <script data-mo-app src="js/learning-units/learning-unit-lesson.js"></script>
      <script data-mo-app src="js/learning-units/learning-units-picker.js"></script>
      <script data-mo-app src="js/learning-units/learning-path-engine.js"></script>
      <script data-mo-app src="js/views/listening.js"></script>
      <script data-mo-app src="js/views/grammar.js"></script>
      <script data-mo-app src="js/views/settings.js"></script>
      <script data-mo-app src="js/storage-transfer.js"></script>
      <script data-mo-app src="js/ui.js"></script>
      <script data-mo-app src="js/app.js"></script>
   </body>
</html>
