<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DED2BA">
<title>墨室 · Mò Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%239E2B25'/%3E%3Ctext%20x='50'%20y='70'%20font-size='56'%20text-anchor='middle'%20fill='%23EFE7D3'%20font-family='serif'%3E墨%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<style>
/* ============ Mò Studio v4 — encre, papier de riz, laque ============ */
:root{
  --paper:#DED2BA; --paper-2:#E7DDC9; --card:#EFE7D3; --card-2:#F4EDDD;
  --ink:#17140F; --ink-soft:#4A4132; --ink-faint:#7A7061;
  --line:#C9BCA0; --line-soft:#D8CCB0;
  --lacquer:#9E2B25; --seal:#C0392B; --gold:#A8873A; --jade:#2E6B57;
  --t1:#B0392F; --t2:#B5822A; --t3:#2E6B57; --t4:#2F5480; --t5:#7A7061;
  --r:14px; --shadow:0 10px 30px rgba(23,20,15,.13);
  --serif:"Noto Serif SC","Songti SC",serif;
  --disp:"EB Garamond",Georgia,serif;
  --ui:"IBM Plex Sans",system-ui,sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.5;
  min-height:100dvh; padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; opacity:.5; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'/%3E%3CfeColorMatrix%20values='0%200%200%200%200.55%200%200%200%200%200.48%200%200%200%200%200.36%200%200%200%200.05%200'/%3E%3C/filter%3E%3Crect%20width='180'%20height='180'%20filter='url(%23n)'/%3E%3C/svg%3E");
}
button{ font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
input,select{ font-family:inherit; font-size:inherit; color:inherit; }
h2,h3{ margin:0; font-weight:600; }
p{ margin:.4em 0; }
[hidden]{ display:none !important; }

/* ---------- header & layout ---------- */
.top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 10px; background:linear-gradient(var(--paper) 75%, transparent);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-seal{
  display:grid; place-items:center; width:40px; height:40px; border-radius:9px;
  background:var(--lacquer); color:var(--card); font-family:var(--serif); font-size:24px; font-weight:600;
  transform:rotate(-2.5deg); box-shadow:0 3px 10px rgba(158,43,37,.35);
}
.brand-name{ font-family:var(--disp); font-size:22px; font-weight:600; letter-spacing:.02em; }
.seal-btn{
  width:40px; height:40px; border-radius:9px; background:var(--card);
  border:1.5px solid var(--lacquer); color:var(--lacquer);
  font-family:var(--serif); font-size:20px; font-weight:600; transform:rotate(2deg); transition:transform .15s;
}
.seal-btn:active{ transform:rotate(2deg) scale(.93); }
.seal-btn.add{ transform:rotate(-2deg); }
#view{ max-width:560px; margin:0 auto; padding:4px 16px 24px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); position:relative; }
.pad{ padding:20px 18px; margin-bottom:16px; }
.v-t{ font-family:var(--disp); font-size:24px; margin-bottom:6px; }
.eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-faint); margin:16px 0 8px; font-weight:600; }
.muted{ color:var(--ink-soft); font-size:14.5px; }

/* ---------- hero, CTA, stats ---------- */
.hero{ text-align:center; padding:12px 0 4px; }
.hero-hz{ font-family:var(--serif); font-size:58px; font-weight:600; line-height:1.1; letter-spacing:.08em; }
.hero-sub{ font-family:var(--disp); font-style:italic; color:var(--ink-soft); margin-top:2px; }
.cta{
  display:block; width:100%; text-align:left; margin:14px 0 10px;
  background:var(--lacquer); color:#F6EFDD; border-radius:16px; padding:18px 20px;
  box-shadow:0 8px 22px rgba(158,43,37,.32); transition:transform .12s, opacity .15s;
}
.cta:active{ transform:scale(.98); }
.cta:disabled{ opacity:.6; pointer-events:none; }
.cta b{ display:block; font-family:var(--disp); font-size:21px; letter-spacing:.01em; }
.cta span{ display:block; font-size:13.5px; opacity:.92; margin-top:3px; }
.cta .u-line{ display:block; font-size:12.5px; opacity:.78; margin-top:7px; font-style:italic; }
.resume{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--card); border:1.5px dashed var(--gold); border-radius:13px; padding:11px 14px; margin:12px 0 2px;
}
.resume span{ font-size:14px; color:var(--ink-soft); }
.resume .btn{ margin:0; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 4px; }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 4px 8px; text-align:center; transition:transform .1s; }
.stat b{ display:block; font-family:var(--disp); font-size:22px; line-height:1.15; }
.stat span{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; }
.stat:active{ transform:scale(.97); }

/* ---------- séance libre (repliée) ---------- */
details.free{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin:12px 0 16px; }
details.free > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:600; padding:15px 16px; }
details.free > summary::-webkit-details-marker{ display:none; }
details.free > summary::after{ content:"＋"; margin-left:auto; color:var(--gold); font-size:18px; }
details.free[open] > summary::after{ content:"－"; }
.free-hz{ font-family:var(--serif); font-size:21px; color:var(--lacquer); }
.free-body{ padding:0 16px 16px; }

/* ---------- chips, boutons, inputs ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card-2); font-size:14px; color:var(--ink-soft); transition:all .15s; }
.chip[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:var(--card); }
.hzchip{ font-family:var(--serif); font-size:19px; padding:6px 11px; }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:12px; font-weight:600; font-size:15px;
  background:var(--card-2); border:1px solid var(--line); color:var(--ink); transition:transform .1s;
}
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--card); }
.btn.danger{ background:none; border-color:var(--lacquer); color:var(--lacquer); }
.btn.ghost{ background:none; border-color:transparent; color:var(--ink-soft); }
.btn.sm{ padding:7px 12px; font-size:13.5px; border-radius:10px; }
.btn.wide{ width:100%; margin-top:8px; }
.btn.big{ padding:14px 22px; font-size:16px; }
.btn:disabled{ opacity:.45; pointer-events:none; }
.ck{ display:flex; align-items:center; gap:9px; padding:7px 0; font-size:14.5px; color:var(--ink-soft); cursor:pointer; }
.ck input{ width:17px; height:17px; accent-color:var(--lacquer); }
.search{ width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--card-2); outline:none; font-size:15px; }
.search:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(168,135,58,.18); }
.f-lab{ display:block; font-size:13px; color:var(--ink-faint); margin:10px 0; }
.f-lab .search, .f-lab select, .f-lab input[type=range]{ margin-top:4px; }
input[type=range]{ width:100%; accent-color:var(--lacquer); }
.selects{ display:flex; gap:8px; margin-top:10px; }
.selects .search{ flex:1; padding:9px 10px; font-size:14px; }
.modes{ display:grid; gap:10px; margin-top:6px; }
.mode{ display:flex; align-items:center; gap:14px; text-align:left; background:var(--card-2); border:1px solid var(--line); border-radius:13px; padding:13px 15px; transition:transform .1s, border-color .15s; }
.mode:active{ transform:scale(.98); }
.mode:not(:disabled):hover{ border-color:var(--gold); }
.mode .m-hz{ font-family:var(--serif); font-size:26px; color:var(--lacquer); width:34px; text-align:center; }
.mode b{ display:block; font-size:15.5px; }
.mode span{ font-size:13px; color:var(--ink-faint); }

/* ---------- tons ---------- */
.tn.t1{ color:var(--t1); } .tn.t2{ color:var(--t2); } .tn.t3{ color:var(--t3); }
.tn.t4{ color:var(--t4); } .tn.t5{ color:var(--t5); }

/* ---------- séance ---------- */
body.in-session .nav, body.in-session .top{ display:none; }
body.in-session{ padding-bottom:28px; }
.sess{ padding-top:10px; }
.s-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.s-x{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:15px; flex:none; }
.s-scope{ flex:1; font-size:13px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.s-count{ font-family:var(--disp); font-size:15px; color:var(--ink-soft); }
.s-bar{ height:4px; border-radius:99px; background:var(--line-soft); overflow:hidden; margin-bottom:14px; }
.s-bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--lacquer),var(--seal)); border-radius:99px; transition:width .25s; }
.flash{ padding:52px 20px 24px; text-align:center; min-height:330px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.fl-seal{ position:absolute; top:14px; right:14px; }
.seal{
  width:44px; height:44px; border-radius:10px; background:var(--seal); color:#F6EFDD;
  font-family:var(--serif); font-size:21px; font-weight:600; transform:rotate(-2.5deg);
  box-shadow:0 3px 9px rgba(192,57,43,.4); transition:transform .12s; flex:none;
}
.seal:active{ transform:rotate(-2.5deg) scale(.9); }
.seal.lg{ width:56px; height:56px; font-size:26px; border-radius:13px; }
.hanzi{ font-family:var(--serif); font-weight:600; line-height:1.15; cursor:pointer; font-size:clamp(52px, 18vw, 88px); letter-spacing:.04em; }
.pinyin{ font-size:21px; margin-top:8px; letter-spacing:.03em; }
.fr{ font-family:var(--disp); font-size:23px; margin-top:4px; }
.fr-big{ font-family:var(--disp); font-size:30px; line-height:1.25; padding:8px 4px; }
.hint{ margin-top:22px; font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.12em; }
.sep{ width:56px; height:1.5px; background:var(--gold); opacity:.6; margin:16px auto 10px; }
.ex{ margin-top:14px; padding:11px 14px; border-left:3px solid var(--gold); background:var(--card-2); border-radius:0 10px 10px 0; text-align:left; cursor:pointer; max-width:100%; }
.ex-hz{ font-family:var(--serif); font-size:19px; }
.ex-py{ font-size:14px; margin-top:2px; }
.ex-fr{ font-size:14px; color:var(--ink-soft); font-style:italic; margin-top:2px; }
.note{ margin-top:12px; font-size:13.5px; color:var(--ink-soft); background:var(--card-2); border:1.5px dashed var(--gold); border-radius:10px; padding:8px 12px; max-width:100%; text-align:left; }
.acts{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
.act{ padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card-2); font-size:13.5px; color:var(--ink-soft); transition:all .15s; }
.act.on{ background:var(--lacquer); border-color:var(--lacquer); color:var(--card); }
.act.on.jade{ background:var(--jade); border-color:var(--jade); }
.verdict{ font-weight:600; font-size:16px; margin-bottom:12px; padding:8px 16px; border-radius:999px; }
.verdict.ok{ background:rgba(46,107,87,.14); color:var(--jade); }
.verdict.ko{ background:rgba(158,43,37,.12); color:var(--lacquer); }
.verdict span{ font-weight:400; font-size:14px; }
.s-foot{ display:flex; gap:10px; margin-top:14px; }
.s-foot .btn{ flex:1; }
.s-foot .btn.ghost{ flex:0 0 auto; }
.grades{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
.gr{ border-radius:12px; padding:10px 4px 8px; color:#F6EFDD; font-weight:600; font-size:14px; transition:transform .1s; }
.gr:active{ transform:scale(.95); }
.gr small{ display:block; font-weight:400; font-size:11px; opacity:.85; margin-top:1px; }
.gr.again{ background:var(--lacquer); } .gr.hard{ background:var(--gold); }
.gr.good{ background:var(--jade); } .gr.easy{ background:var(--ink); }
.g-row{ display:flex; justify-content:space-between; margin-top:10px; }
.w-lab{ font-size:12.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--ink-faint); margin-bottom:10px; font-weight:600; }
.w-in{ width:100%; max-width:340px; margin-top:18px; }
.w-in .search{ text-align:center; font-size:18px; }
.w-note{ margin-top:10px; font-size:13.5px; color:var(--ink-soft); min-height:1.2em; }
.t-btns{ display:flex; gap:10px; margin-top:12px; }

/* ---------- 米字格 ---------- */
.mizi{
  position:relative; width:min(300px,100%); aspect-ratio:1; margin:14px auto 4px;
  border:2px solid var(--seal); border-radius:8px; overflow:hidden;
  background:
    linear-gradient(45deg, transparent calc(50% - .6px), rgba(168,135,58,.5) calc(50% - .6px), rgba(168,135,58,.5) calc(50% + .6px), transparent calc(50% + .6px)),
    linear-gradient(-45deg, transparent calc(50% - .6px), rgba(168,135,58,.5) calc(50% - .6px), rgba(168,135,58,.5) calc(50% + .6px), transparent calc(50% + .6px)),
    linear-gradient(90deg, transparent calc(50% - .6px), rgba(168,135,58,.5) calc(50% - .6px), rgba(168,135,58,.5) calc(50% + .6px), transparent calc(50% + .6px)),
    linear-gradient(0deg, transparent calc(50% - .6px), rgba(168,135,58,.5) calc(50% - .6px), rgba(168,135,58,.5) calc(50% + .6px), transparent calc(50% + .6px)),
    var(--card-2);
  box-shadow:inset 0 0 0 1px rgba(158,43,37,.2);
}
.mizi > div, .mizi > canvas{ position:absolute; inset:0; margin:auto; }
.ghost{ display:flex; align-items:center; justify-content:center; font-family:var(--serif); color:rgba(23,20,15,.15); user-select:none; pointer-events:none; line-height:1; }
.mizi canvas{ width:100%; height:100%; touch-action:none; cursor:crosshair; }

/* ---------- picker & bibliothèque ---------- */
.picker{ display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 6px; max-height:170px; overflow:auto; padding:2px; }
.lib-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
#lib-list{ margin-top:4px; }
.row{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 6px; border-bottom:1px solid var(--line-soft); transition:background .12s; }
.row:active{ background:var(--card-2); }
.row-hz{ font-family:var(--serif); font-size:26px; flex:none; min-width:58px; }
.row-mid{ flex:1; min-width:0; }
.row-py{ display:block; font-size:14px; }
.row-fr{ display:block; font-size:14px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-badges{ display:flex; gap:4px; flex:none; }
.b{ font-style:normal; font-size:13px; padding:2px 7px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); }
.b.red{ color:var(--lacquer); } .b.gold{ color:var(--gold); } .b.jade{ color:var(--jade); }
.b.u{ color:var(--ink-faint); font-size:11.5px; }
.lib-foot{ margin-top:14px; text-align:center; }

/* ---------- écoute ---------- */
.listen-center{ text-align:center; padding:8px 0 4px; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px; }
.opt{ padding:14px 8px; border-radius:12px; border:1px solid var(--line); background:var(--card-2); font-size:20px; transition:all .15s; }
.opt .o-hz{ display:block; font-family:var(--serif); font-size:26px; }
.opt .o-fr{ display:block; font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
.opt.ok{ background:rgba(46,107,87,.15); border-color:var(--jade); }
.opt.ko{ background:rgba(158,43,37,.12); border-color:var(--lacquer); }
.drill-foot{ display:flex; gap:9px; justify-content:center; margin-top:12px; }

/* ---------- grammaire ---------- */
.gcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:11px; overflow:hidden; }
.gcard summary{ display:flex; align-items:center; gap:12px; padding:15px 16px; cursor:pointer; font-weight:600; list-style:none; }
.gcard summary::-webkit-details-marker{ display:none; }
.gcard summary::after{ content:"＋"; margin-left:auto; color:var(--gold); font-size:18px; }
.gcard[open] summary::after{ content:"－"; }
.g-hz{ font-family:var(--serif); font-size:22px; color:var(--lacquer); flex:none; width:34px; text-align:center; }
.g-body{ padding:0 16px 15px; font-size:14.5px; color:var(--ink-soft); }
.gx{ display:block; width:100%; text-align:left; margin-top:9px; padding:9px 12px; border-left:3px solid var(--gold); background:var(--card-2); border-radius:0 9px 9px 0; }
.gx-hz{ display:block; font-family:var(--serif); font-size:18px; color:var(--ink); }
.gx-py{ display:block; font-size:13px; color:var(--ink-soft); }
.gx-fr{ display:block; font-size:13px; color:var(--ink-faint); font-style:italic; }
.qz{ margin-top:14px; border-top:1.5px dashed var(--line); padding-top:10px; }
.qz-t{ font-size:11.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--gold); font-weight:600; }
.qz-q{ margin:11px 0 7px; font-size:14.5px; color:var(--ink); }
.qz-q .qhz{ font-family:var(--serif); font-size:17px; }
.qz-opts{ display:flex; flex-wrap:wrap; gap:7px; }
.qz-opts .chip.hz{ font-family:var(--serif); font-size:16px; }
.qz-opts .chip.ok{ background:var(--jade); border-color:var(--jade); color:#fff; }
.qz-opts .chip.ko{ background:var(--lacquer); border-color:var(--lacquer); color:#fff; }
.qz-score{ margin-top:9px; font-size:13px; color:var(--ink-soft); font-weight:600; }

/* ---------- sheet, toast, nav ---------- */
#sheet{ position:fixed; inset:0; z-index:50; background:rgba(23,20,15,.45); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
#sheet.open{ opacity:1; pointer-events:auto; }
.sheet-card{
  width:100%; max-width:560px; max-height:86dvh; overflow:auto; background:var(--paper-2);
  border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(30px); transition:transform .22s;
}
#sheet.open .sheet-card{ transform:none; }
.sh-t{ font-family:var(--disp); font-size:21px; margin-bottom:8px; }
.sh-p{ font-size:14.5px; color:var(--ink-soft); }
.sh-note{ font-size:13px; color:var(--ink-faint); margin-top:12px; }
.sh-btns{ display:flex; gap:9px; margin-top:16px; flex-wrap:wrap; }
.sh-btns .btn{ flex:1; }
.delay-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.delay-grid .btn{ margin:0; }
.dl-custom{ display:flex; gap:8px; margin-top:10px; }
.dl-custom .search{ flex:1; }
.pk-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
.pk-info b{ display:block; font-size:15px; }
.pk-info span{ font-size:12.5px; color:var(--ink-faint); }
.pk-btns{ display:flex; gap:6px; }
.pk-new{ display:flex; gap:8px; margin-top:14px; }
.pk-new .search{ flex:1; }
.cd-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.cd-hz{ font-family:var(--serif); font-size:52px; font-weight:600; line-height:1.15; cursor:pointer; }

.sum-row b{ font-family:var(--disp); font-size:17px; }
.err-list{ text-align:left; max-width:340px; margin:6px auto 16px; max-height:190px; overflow:auto; border:1px solid var(--line-soft); border-radius:11px; padding:4px 12px; background:var(--card-2); }
.err-row{ display:flex; gap:10px; padding:7px 2px; border-bottom:1px solid var(--line-soft); font-size:13.5px; align-items:baseline; }
.err-row:last-child{ border-bottom:none; }

.sum-btns{ display:flex; flex-direction:column; gap:9px; align-items:center; }

/* ---------- animations & desktop ---------- */
@keyframes inkIn{ from{ filter:blur(7px); opacity:0; transform:scale(1.04);} to{ filter:blur(0); opacity:1; transform:none;} }
.ink-in{ animation:inkIn .45s ease-out both; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
@media (min-width:900px){
  #view{ max-width:820px; }
  .nav{ left:50%; right:auto; transform:translateX(-50%); width:820px; max-width:96vw; border:1px solid var(--line); border-bottom:none; border-radius:16px 16px 0 0; }
  #lib-list{ display:grid; grid-template-columns:1fr 1fr; gap:0 26px; align-items:start; }
  .flash{ min-height:390px; }
  .opts{ grid-template-columns:repeat(4,1fr); }
  #sheet{ align-items:center; }
  .sheet-card{ border-radius:20px; border-bottom:1px solid var(--line); max-height:82dvh; }
  .hero-hz{ font-size:66px; }
}
</style>

<body>
<header class="top">
  <div class="brand"><span class="brand-seal">墨</span><span class="brand-name">Mò Studio</span></div>
  <button class="seal-btn" id="btn-settings" aria-label="Réglages">设</button>
</header>
<main id="view"></main>
<nav class="nav" aria-label="Navigation">
  <button data-view="learn" aria-pressed="true"><span class="n-hz">学</span><span class="n-lab">Réviser</span></button>
  <button data-view="lib" aria-pressed="false"><span class="n-hz">库</span><span class="n-lab">Cartes</span></button>
  <button data-view="write" aria-pressed="false"><span class="n-hz">写</span><span class="n-lab">Écrire</span></button>
  <button data-view="listen" aria-pressed="false"><span class="n-hz">听</span><span class="n-lab">Écouter</span></button>
  <button data-view="grammar" aria-pressed="false"><span class="n-hz">法</span><span class="n-lab">Grammaire</span></button>
</nav>
<div id="sheet"><div class="sheet-card"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="file-global" accept=".json,application/json" hidden>
<script>
"use strict";
/* ================= utilitaires ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function shuffle(arr){
  // mélange de Fisher-Yates
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const flatten = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
const now = () => Date.now();
const isDue = c => c.due != null && c.due <= now();
const fmtDate = ts => new Date(ts).toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
const unitSort = (a, b) => ((a.unit ?? 999) - (b.unit ?? 999)) || ((a.order ?? 9999) - (b.order ?? 9999)) || (a.created - b.created);

/* ================= pinyin ================= */
const TONE_MAP = { a:"āáǎà", e:"ēéěè", i:"īíǐì", o:"ōóǒò", u:"ūúǔù", "ü":"ǖǘǚǜ" };
function numToAccent(str){
  // convertit "ni3 hao3" en "nǐ hǎo" (v = ü, 5 = ton neutre)
  return String(str || "").replace(/([a-zA-Züv]+)([1-5])/g, (m, syl, tone) => {
    tone = +tone;
    syl = syl.replace(/v/g, "ü").replace(/V/g, "Ü");
    if (tone === 5) return syl;
    const lower = syl.toLowerCase();
    let idx = -1;
    if (lower.includes("a")) idx = lower.indexOf("a");
    else if (lower.includes("e")) idx = lower.indexOf("e");
    else if (lower.includes("ou")) idx = lower.indexOf("o");
    else { for (let i = lower.length - 1; i >= 0; i--){ if ("iouü".includes(lower[i])){ idx = i; break; } } }
    if (idx < 0) return syl;
    const acc = (TONE_MAP[lower[idx]] || "")[tone - 1];
    return acc ? syl.slice(0, idx) + acc + syl.slice(idx + 1) : syl;
  });
}
const TONE_CHARS = ["āēīōūǖ", "áéíóúǘ", "ǎěǐǒǔǚ", "àèìòùǜ"];
function toneOf(syl){
  const n = String(syl).normalize("NFC");
  for (let t = 0; t < 4; t++){
    for (const ch of TONE_CHARS[t]) if (n.includes(ch)) return t + 1;
  }
  return 5;
}
function colorPinyin(py){
  if (!py) return "";
  if (!db.settings.toneColors) return esc(py);
  return String(py).split(/(\s+)/).map(part => {
    if (!/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(part)) return esc(part);
    return '<span class="tn t' + toneOf(part) + '">' + esc(part) + '</span>';
  }).join("");
}

/* ================= audio ================= */
let voices = [];
function refreshVoices(){
  if (!("speechSynthesis" in window)) return;
  voices = (speechSynthesis.getVoices() || []).filter(v => /^zh([-_]|$)/i.test(v.lang));
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = refreshVoices;
function speak(text){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = db.settings.rate || 0.85;
  const v = voices.find(v => v.voiceURI === db.settings.voice) || voices[0];
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================= répétition espacée (SRS) ================= */
// intervalles par niveau : 10 min, 1 j, 3 j, 7 j, 14 j, 30 j, 60 j, 120 j
const INTERVALS = [600e3, 86400e3, 3*86400e3, 7*86400e3, 14*86400e3, 30*86400e3, 60*86400e3, 120*86400e3];
const MAXLVL = INTERVALS.length - 1;
function fmtIv(ms){
  if (ms < 3600e3) return Math.round(ms / 60e3) + " min";
  if (ms < 47*3600e3) return "1 j";
  return Math.round(ms / 86400e3) + " j";
}
function gradeIv(c){
  // aperçu de l'intervalle pour chaque bouton, selon le niveau actuel de la carte
  const lvl = c.lvl || 0;
  return {
    again: INTERVALS[0],
    hard: INTERVALS[1],
    good: INTERVALS[Math.min(MAXLVL, Math.max(2, lvl + 1))],
    easy: INTERVALS[Math.min(MAXLVL, Math.max(3, lvl + 2))]
  };
}
function applyGrade(c, g){
  const iv = gradeIv(c);
  if (g === "again") c.lvl = 0;
  else if (g === "hard") c.lvl = 1;
  else if (g === "good") c.lvl = Math.min(MAXLVL, Math.max(2, (c.lvl || 0) + 1));
  else c.lvl = Math.min(MAXLVL, Math.max(3, (c.lvl || 0) + 2));
  c.due = now() + iv[g];
  if (g === "again" || g === "hard") c.acquired = false;
  save();
}

/* ================= données ================= */
const DB_KEY = "mo-studio-v1";
const SESSION_KEY = "mo-studio-session";
const BACKUP_KEY = "mo-studio-backup";
const defaultSettings = () => ({
  pinyin: "always",            // always | reveal | never
  toneColors: true,
  rate: 0.85,
  voice: "",
  direction: "zh2fr",          // zh2fr | fr2zh | mix
  writeModes: { pinyin: true, fr: true, trace: true },
  sessionSize: 20,             // taille max de « Continuer » (0 = tout)
  newPerSession: 5,            // nouvelles cartes par séance
  freeSize: 20,                // taille des séances libres (0 = tout)
  listenLevel: 1               // 1 = 汉字+FR, 2 = 汉字, 3 = FR
});
function normalizeCard(c, keepId){
  // nettoie une carte (import ou stockage) ; hz + fr obligatoires
  if (!c || typeof c !== "object") return null;
  const hz = String(c.hz || "").trim();
  const fr = String(c.fr || "").trim();
  if (!hz || !fr) return null;
  let py = String(c.py || "").trim();
  if (/[0-9]/.test(py)) py = numToAccent(py);
  let exPy = String(c.exPy || "").trim();
  if (/[0-9]/.test(exPy)) exPy = numToAccent(exPy);
  return {
    id: (keepId && c.id) ? String(c.id) : uid(),
    hz, py, fr,
    cat: String(c.cat || "").trim(),
    exHz: String(c.exHz || "").trim(),
    exPy,
    exFr: String(c.exFr || "").trim(),
    note: String(c.note || "").trim(),
    unit: Number.isFinite(+c.unit) && c.unit !== "" && c.unit != null ? +c.unit : null,
    order: Number.isFinite(+c.order) && c.order !== "" && c.order != null ? +c.order : null,
    lvl: Number.isFinite(+c.lvl) ? Math.max(0, Math.min(MAXLVL, +c.lvl)) : 0,
    fav: !!c.fav,
    acquired: !!c.acquired,
    due: (typeof c.due === "number") ? c.due : null,
    created: (typeof c.created === "number") ? c.created : Date.now()
  };
}
const cardKey = c => c.hz + "§" + String(c.py || "").toLowerCase().normalize("NFC").replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "");
function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(DB_KEY);
    if (raw){
      const d = JSON.parse(raw);
      const s = Object.assign(defaultSettings(), d.settings || {});
      s.writeModes = Object.assign({ pinyin:true, fr:true, trace:true }, (d.settings && d.settings.writeModes) || {});
      return {
        cards: Array.isArray(d.cards) ? d.cards.map(c => normalizeCard(c, true)).filter(Boolean) : [],
        packs: Array.isArray(d.packs) ? d.packs.filter(p => p && p.id && p.name && Array.isArray(p.cardIds)) : [],
        units: (d.units && typeof d.units === "object" && !Array.isArray(d.units)) ? d.units : {},
        settings: s
      };
    }
  }catch(e){
    // données corrompues : on les met de côté au lieu de les perdre
    try{ if (raw) localStorage.setItem(BACKUP_KEY + "-corrupt", raw); }catch(e2){}
  }
  return { cards: [], packs: [], units: {}, settings: defaultSettings() };
}
let db = load();
function save(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ toast("Impossible d'enregistrer (stockage plein ?)."); }
}
function makeBackup(){
  try{ localStorage.setItem(BACKUP_KEY, JSON.stringify({ ts: Date.now(), cards: db.cards, packs: db.packs, units: db.units })); }catch(e){}
}
function getBackup(){
  try{
    const b = JSON.parse(localStorage.getItem(BACKUP_KEY));
    if (b && Array.isArray(b.cards)) return b;
  }catch(e){}
  return null;
}
function unitName(u){
  if (u == null) return "";
  return db.units[String(u)] || ("Unité " + u);
}

/* -------- sauvegarde / reprise de séance -------- */
function persistSession(){
  try{
    if (!session.active){ localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      ts: Date.now(), mode: session.mode, ids: session.cards.map(c => c.id),
      index: session.index, states: session.states, live: session.live, scopeLabel: session.scopeLabel
    }));
  }catch(e){}
}
function clearSavedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function loadSavedSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (!s || !Array.isArray(s.ids) || Date.now() - s.ts > 24*3600e3) return null;
    const cards = s.ids.map(id => db.cards.find(c => c.id === id)).filter(Boolean);
    if (cards.length < 2) return null;
    return { snap: s, cards };
  }catch(e){ return null; }
}
function resumeSession(){
  const r = loadSavedSession();
  if (!r){ clearSavedSession(); renderLearn(); return; }
  const st = Array.isArray(r.snap.states) ? r.snap.states : [];
  session = {
    active: true, mode: r.snap.mode || "cards", cards: r.cards,
    index: Math.min(r.snap.index || 0, r.cards.length - 1),
    states: r.cards.map((c, i) => st[i] || null),
    live: r.snap.live || { marked: 0, acquired: 0 },
    scopeLabel: r.snap.scopeLabel || "Séance"
  };
  renderSession();
}

/* ================= navigation ================= */
let activeView = "learn";
let session = { active: false };
function setView(v){
  activeView = v;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  render();
  window.scrollTo(0, 0);
}
function render(){
  document.body.classList.toggle("in-session", activeView === "learn" && session.active);
  if (activeView === "learn") renderLearn();
  else if (activeView === "lib") renderLib();
  else if (activeView === "write") renderWrite();
  else if (activeView === "listen") renderListen();
  else renderGrammar();
}
function refreshActive(){ render(); }

/* ================= hub (Réviser) ================= */
let hub = { flt: "all", pack: "", cat: "", includeAcquired: false, freeOpen: false };

function scopeCards(){
  let list = db.cards.slice();
  if (hub.flt === "due") list = list.filter(isDue);
  else if (hub.flt === "fav") list = list.filter(c => c.fav);
  else if (hub.flt === "acq") list = list.filter(c => c.acquired);
  if (hub.pack){
    if (hub.pack.startsWith("unit:")){
      const u = +hub.pack.slice(5);
      list = list.filter(c => c.unit === u);
    } else {
      const p = db.packs.find(p => p.id === hub.pack);
      const set = new Set(p ? p.cardIds : []);
      list = list.filter(c => set.has(c.id));
    }
  }
  if (hub.cat) list = list.filter(c => c.cat === hub.cat);
  if (!hub.includeAcquired && hub.flt !== "acq") list = list.filter(c => !c.acquired);
  return list;
}
function scopeLabel(){
  const parts = [];
  if (hub.flt === "due") parts.push("À revoir");
  else if (hub.flt === "fav") parts.push("Favoris");
  else if (hub.flt === "acq") parts.push("Acquises");
  if (hub.pack){
    if (hub.pack.startsWith("unit:")) parts.push(unitName(+hub.pack.slice(5)));
    else { const p = db.packs.find(p => p.id === hub.pack); if (p) parts.push(p.name); }
  }
  if (hub.cat) parts.push(hub.cat);
  return parts.join(" · ") || "Tout";
}

/* -------- file intelligente pour « Continuer » -------- */
function smartQueue(){
  const pool = db.cards.filter(c => !c.acquired);
  const due = pool.filter(isDue).sort((a, b) => a.due - b.due);
  const fresh = pool.filter(c => c.due == null).sort(unitSort);
  const size = db.settings.sessionSize;       // 0 = tout
  const newTake = Math.min(db.settings.newPerSession, fresh.length);
  let dueTake = size > 0 ? Math.max(0, size - newTake) : due.length;
  dueTake = Math.min(dueTake, due.length);
  let q = due.slice(0, dueTake).concat(fresh.slice(0, newTake));
  if (size > 0) q = q.slice(0, size);
  const planned = pool.filter(c => c.due != null && c.due > now()).sort((a, b) => a.due - b.due);
  return {
    q: shuffle(q),
    dueN: Math.min(due.length, dueTake),
    dueTotal: due.length,
    freshN: Math.min(newTake, Math.max(0, (size > 0 ? size : Infinity))),
    freshUnit: fresh.length ? fresh[0].unit : null,
    nextDue: planned.length ? planned[0].due : null
  };
}
function startSmartSession(){
  const sq = smartQueue();
  if (!sq.q.length){ toast("Rien à réviser pour le moment."); return; }
  startCardsWith(sq.q, "Ma révision", "cards");
}
function startCardsWith(cards, label, mode){
  session = {
    active: true, mode: mode || "cards", cards, index: 0,
    states: new Array(cards.length).fill(null),
    live: { marked: 0, acquired: 0 },
    scopeLabel: label
  };
  document.body.classList.add("in-session");
  renderSession();
  window.scrollTo(0, 0);
}
function startFreeSession(mode){
  let cards = shuffle(scopeCards());
  if (!cards.length){ toast("Aucune carte dans cette sélection."); return; }
  const size = db.settings.freeSize;
  if (size > 0) cards = cards.slice(0, size);
  startCardsWith(cards, scopeLabel(), mode);
}

/* -------- écrans du hub -------- */
function emptyHtml(){
  return '<section class="card pad empty">' +
    '<div class="empty-hz">学</div>' +
    '<h2 class="empty-t">Ta collection est vide</h2>' +
    '<p class="empty-p">Importe un pack JSON (HSK 1, HSK 2…) ou crée ta première carte. Le format des fichiers est documenté juste en dessous.</p>' +
    '<div class="empty-btns">' +
      '<button class="btn primary" id="btn-e-import">Importer un pack JSON</button>' +
      '<button class="btn" id="btn-e-add">Créer une carte</button>' +
      '<button class="btn ghost" id="btn-e-format">Voir le format JSON</button>' +
    '</div></section>';
}
function wireEmpty(){
  if ($("btn-e-import")) $("btn-e-import").onclick = () => $("file-global").click();
  if ($("btn-e-add")) $("btn-e-add").onclick = () => openCardForm(null);
  if ($("btn-e-format")) $("btn-e-format").onclick = openFormatSheet;
}

function renderLearn(){
  document.body.classList.toggle("in-session", session.active);
  if (session.active){ renderSession(); return; }
  if (session.summary){ renderSummary(); return; }
  const root = $("view");
  const heroTop = '<section class="hero"><div class="hero-hz ink-in">墨室</div><div class="hero-sub">Mò Studio — ton atelier de chinois</div></section>';
  if (!db.cards.length){
    root.innerHTML = heroTop + emptyHtml();
    wireEmpty();
    return;
  }
  // garde-fous sur les filtres
  if (hub.pack && !hub.pack.startsWith("unit:") && !db.packs.some(p => p.id === hub.pack)) hub.pack = "";
  if (hub.cat && !db.cards.some(c => c.cat === hub.cat)) hub.cat = "";

  const total = db.cards.length;
  const dueN = db.cards.filter(isDue).length;
  const fav = db.cards.filter(c => c.fav).length;
  const acq = db.cards.filter(c => c.acquired).length;
  const sq = smartQueue();
  const mins = Math.max(1, Math.round(sq.q.length * 25 / 60));
  const resume = loadSavedSession();

  // bouton principal
  let cta;
  if (sq.q.length){
    const sub = sq.dueTotal + " à revoir · " + sq.freshN + " nouvelle" + (sq.freshN > 1 ? "s" : "");
    const uline = (sq.freshN > 0 && sq.freshUnit != null) ? '<span class="u-line">Unité ' + sq.freshUnit + ' · ' + esc(unitName(sq.freshUnit)) + '</span>' : "";
    cta = '<button class="cta ink-in" id="btn-continue"><b>Continuer ma révision</b><span>' + sq.q.length + ' carte' + (sq.q.length > 1 ? "s" : "") + ' · ~' + mins + ' min — ' + sub + '</span>' + uline + '</button>';
  } else {

/* ================= séance ================= */
const currentCard = () => session.cards[session.index];
function getState(i){
  if (!session.states[i]) session.states[i] = { revealed:false, checked:false, ok:null, front:null, task:null, traceOk:false, traceReady:false, skipped:false, note:"", grade:null };
  return session.states[i];
}
function frontOf(c, st){
  // recto de la carte : zh ou fr, stable pendant toute la séance
  if (st.front) return st.front;
  const d = db.settings.direction;
  st.front = d === "mix" ? (Math.random() < 0.5 ? "zh" : "fr") : (d === "fr2zh" ? "fr" : "zh");
  return st.front;
}
function pickWriteTask(c){
  // choisit une tâche écrite selon les réglages et le sens de révision
  const wm = db.settings.writeModes;
  const d = db.settings.direction;
  const zhSide = d === "zh2fr" || d === "mix";
  const frSide = d === "fr2zh" || d === "mix";
  const canTrace = Array.from(c.hz).some(ch => /[\u4e00-\u9fff]/.test(ch)) && c.hz.length <= 3;
  const opts = [];
  if (wm.fr && zhSide) opts.push("fr");
  if (wm.pinyin && zhSide && c.py) opts.push("py-read");
  if (wm.pinyin && frSide && c.py) opts.push("py-prod");
  if (wm.trace && frSide && canTrace) opts.push("trace");
  if (!opts.length){
    if (wm.fr) opts.push("fr");
    if (wm.pinyin && c.py) opts.push("py-read");
    if (wm.trace && canTrace) opts.push("trace");
  }
  if (!opts.length) opts.push("fr");
  return opts[Math.floor(Math.random() * opts.length)];
}

function exampleHtml(c){
  return '<div class="ex" data-say="' + esc(c.exHz) + '">' +

}
function noteHtml(c){

}
function actionsHtml(c){

const inputHtml = ph => '<div class="w-in"><input id="w-input" class="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + esc(ph) + '"></div>';

function writtenPromptHtml(c, st){

    return '<div class="w-lab">Écris le pinyin</div><div class="fr-big ink-in">' + esc(c.fr) + '</div>' + inputHtml("ni3 hao3 ou nǐ hǎo");

function gradesHtml(c){
  const iv = gradeIv(c);

function sessionFooterHtml(c, st){
  const last = session.index >= session.cards.length - 1;
  if (session.mode === "discover"){
    return '<div class="s-foot">' +
      '<button class="btn ghost" id="s-prev"' + (session.index === 0 ? " disabled" : "") + '>←</button>' +
      '<button class="btn primary" id="s-next">' + (last ? "Terminer 完" : "Suivante →") + '</button></div>';
  }

    return '<div class="s-foot"><button class="btn ghost" id="s-skip">Voir la réponse</button><button class="btn primary" id="s-check">Vérifier</button></div>';
  // verso (cartes) ou réponse vérifiée (écrit) : boutons de notation SRS
  return gradesHtml(c);
}

function renderSession(){
  const c = currentCard();
  if (!c){ endSession(); return; }
  document.body.classList.add("in-session");
  const st = getState(session.index);
  if (session.mode === "discover") st.revealed = true;
  if (session.mode === "written" && !st.task) st.task = pickWriteTask(c);
  const front = session.mode === "cards" ? frontOf(c, st) : "zh";
  const showPyBack = db.settings.pinyin !== "never";
  const hideSay =
    (session.mode === "cards" && front === "fr" && !st.revealed) ||
    (session.mode === "written" && !st.checked && st.task === "py-prod");

  let body = "";
  if (session.mode === "written" && !st.checked){
    body = writtenPromptHtml(c, st);
  } else if (session.mode === "cards" && !st.revealed){
    body = front === "zh"
      ? '<div class="hanzi ink-in" data-say="' + esc(c.hz) + '">' + esc(c.hz) + '</div>' +
        (db.settings.pinyin === "always" && c.py ? '<div class="pinyin">' + colorPinyin(c.py) + '</div>' : "") +
        '<div class="hint">Appuie pour retourner</div>'
      : '<div class="fr-big ink-in">' + esc(c.fr) + '</div><div class="hint">Appuie pour retourner</div>';
  } else {
    let verdict = "";
    if (session.mode === "written" && st.checked){
      const lab = st.ok ? "✓ Juste !" : (st.skipped ? "Réponse affichée" : "✗ Raté");
      verdict = '<div class="verdict ' + (st.ok ? "ok" : "ko") + '">' + lab + (st.note ? ' <span>· ' + esc(st.note) + '</span>' : "") + '</div>';
    }
    body = verdict +
      '<div class="hanzi ink-in" data-say="' + esc(c.hz) + '">' + esc(c.hz) + '</div>' +
      (showPyBack && c.py ? '<div class="pinyin">' + colorPinyin(c.py) + '</div>' : "") +
      '<div class="sep"></div><div class="fr">' + esc(c.fr) + '</div>' +
      (c.exHz ? exampleHtml(c) : "") + noteHtml(c) + actionsHtml(c);
  }

  const modeName = { cards:"Cartes", written:"Écrit", discover:"Découverte" }[session.mode];
  $("view").innerHTML =
    '<section class="sess">' +
      '<div class="s-top">' +
        '<button class="s-x" id="s-exit" aria-label="Quitter">✕</button>' +
        '<div class="s-scope">' + esc(session.scopeLabel) + ' · ' + modeName + '</div>' +
        '<div class="s-count">' + (session.index + 1) + ' / ' + session.cards.length + '</div>' +
      '</div>' +
      '<div class="s-bar"><i style="width:' + (((session.index + 1) / session.cards.length) * 100).toFixed(1) + '%"></i></div>' +
      '<div class="flash card" id="flash">' +
        '<button class="seal fl-seal" data-say="' + esc(c.hz) + '"' + (hideSay ? ' style="visibility:hidden"' : "") + ' aria-label="Écouter">听</button>' +
        body +
      '</div>' +
      sessionFooterHtml(c, st) +
    '</section>';
  wireSession(c, st);
  persistSession();
}

function advance(){
  if (session.index >= session.cards.length - 1) endSession();
  else { session.index++; renderSession(); }
}
function wireSession(c, st){
  $("s-exit").onclick = endSession;
  const flip = () => {
    st.revealed = true;
    renderSession();
    if (frontOf(c, st) === "fr") speak(c.hz);
  };
  if ($("s-flip")) $("s-flip").onclick = flip;
  const fl = $("flash");
  if (session.mode === "cards" && !st.revealed){
    fl.style.cursor = "pointer";
    fl.onclick = e => { if (e.target.closest("[data-say]") || e.target.closest("button")) return; flip(); };
  }
  if ($("s-next")) $("s-next").onclick = advance;
  if ($("s-prev")) $("s-prev").onclick = () => { if (session.index > 0){ session.index--; renderSession(); } };
  if ($("s-check")) $("s-check").onclick = checkWritten;
  if ($("s-skip")) $("s-skip").onclick = () => {
    st.checked = true; st.ok = false; st.skipped = true;
    renderSession(); speak(c.hz);
  };
  document.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => {
    const g = b.dataset.grade;
    st.grade = g;
    applyGrade(c, g);
    advance();
  });
  if ($("a-fav")) $("a-fav").onclick = () => { c.fav = !c.fav; save(); renderSession(); };
  if ($("a-hard")) $("a-hard").onclick = () => openDelaySheet(c, marked => { if (marked) session.live.marked++; if (session.active) renderSession(); });
  if ($("a-acq")) $("a-acq").onclick = () => {
    c.acquired = !c.acquired;
    if (c.acquired){ c.due = null; session.live.acquired++; }
    save(); renderSession();
  };
  const wi = $("w-input");
  if (wi){
    if (st.task !== "fr"){
      wi.addEventListener("input", () => {
        // conversion ni3 -> nǐ à la volée
        const v = numToAccent(wi.value);
        if (v !== wi.value) wi.value = v;
      });
    }
    setTimeout(() => wi.focus(), 60);
  }
  if (session.mode === "written" && !st.checked && st.task === "trace") setupSessionTrace(c, st);
}

/* -------- vérification du mode écrit -------- */
function pyMatch(target, given){
  const t = numToAccent(String(target || "")).toLowerCase();
  const g = numToAccent(String(given || "")).toLowerCase();
  const keep = s => s.normalize("NFC").replace(/[^a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, "");
  if (keep(t) === keep(g) && keep(g)) return { ok:true, note:"" };
  if (flatten(t) === flatten(g) && flatten(g)) return { ok:false, note:"Bonnes syllabes, mais vérifie les tons." };
  return { ok:false, note:"" };
}
function normFr(s){
  const base = String(s || "").toLowerCase()
    .replace(/\(.*?\)/g, " ")
    .replace(/[’']/g, " ")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const clean = x => x.replace(/[^a-z]+/g, "");
  // retire les articles, mais garde le mot si tout disparaît (ex : « un »)
  return clean(base.replace(/\b(le|la|les|l|un|une|des|du|de|d|au|aux)\b/g, " ")) || clean(base);
}
function frMatch(target, given){
  const g = normFr(given);
  if (!g) return false;
  const segs = String(target || "").split(/[,;/·]/).map(normFr).filter(Boolean);
  if (segs.includes(g)) return true;
  return segs.some(seg => (g.length >= 4 && seg.includes(g)) || (seg.length >= 4 && g.includes(seg)));
}
function checkWritten(){
  if (!session.active) return;
  const c = currentCard();
  const st = getState(session.index);
  if (!c || !st || st.checked || session.mode !== "written") return;
  let ok = false, note = "";
  if (st.task === "trace"){
    if (!st.traceOk && !st.traceReady){ toast("Termine ton tracé d'abord (ou « Voir la réponse »)."); return; }
    ok = !!st.traceOk;
  } else {
    const given = ($("w-input") ? $("w-input").value : "").trim();
    if (!given){ toast("Écris ta réponse d'abord."); return; }
    if (st.task === "fr") ok = frMatch(c.fr, given);
    else { const r = pyMatch(c.py, given); ok = r.ok; note = r.note; }
  }
  st.checked = true; st.ok = ok; st.note = note;
  renderSession();
  speak(c.hz);
}

/* -------- tracé pendant la séance -------- */
function setupSessionTrace(c, st){
  const target = $("s-writer");
  if (!target) return;
  const chars = Array.from(c.hz).filter(ch => /[\u4e00-\u9fff]/.test(ch));
  if (!chars.length || typeof HanziWriter === "undefined"){ fallbackTrace(c, st); return; }
  const size = Math.min(280, target.parentElement.clientWidth || 280);
  target.style.width = size + "px";
  target.style.height = size + "px";
  const note = $("s-tracenote");
  let i = 0;
  st.traceOk = false; st.traceReady = false;
  const runOne = () => {
    if (!session.active || currentCard() !== c || getState(session.index).checked) return;
    target.innerHTML = "";
    if (note) note.textContent = chars.length > 1 ? "Caractère " + (i + 1) + " / " + chars.length : "Trace le caractère, trait par trait.";
    const writer = HanziWriter.create(target, chars[i], {
      width: size, height: size, padding: 10,
      showCharacter: false, showOutline: true, showHintAfterMisses: 2,
      strokeColor: "#17140F", outlineColor: "#CDBFA1", drawingColor: "#9E2B25",
      onLoadCharDataError: () => { if (session.active && currentCard() === c && !getState(session.index).checked) fallbackTrace(c, st); }
    });
    writer.quiz({
      onComplete: () => {
        i++;
        if (i < chars.length) setTimeout(runOne, 450);
        else {
          st.traceOk = true; st.traceReady = true;
          if (note) note.textContent = "Tracé terminé — appuie sur Vérifier.";
        }
      }
    });
  };
  runOne();
}
function fallbackTrace(c, st){
  // repli si les données de traits ne chargent pas : tracé libre auto-évalué
  const target = $("s-writer"), ghost = $("s-ghost"), canvas = $("s-canvas"), btns = $("t-btns"), note = $("s-tracenote");
  if (!target || !ghost || !canvas) return;
  target.hidden = true; ghost.hidden = false; canvas.hidden = false;
  if (btns) btns.hidden = false;
  if (note) note.textContent = "Tracé libre : recopie le modèle, puis évalue-toi.";
  const box = ghost.parentElement;
  const size = Math.min(280, box.clientWidth || 280);
  canvas.width = size; canvas.height = size;
  const len = Array.from(c.hz).length;
  ghost.style.fontSize = (len >= 3 ? 80 : len === 2 ? 125 : 200) + "px";
  paintPad(canvas);
  st.traceReady = true;
  if ($("t-ok")) $("t-ok").onclick = () => { st.traceOk = true; checkWritten(); };
  if ($("t-no")) $("t-no").onclick = () => { st.traceOk = false; checkWritten(); };
}
function paintPad(canvas){
  const ctx = canvas.getContext("2d");
  ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#17140F";
  let drawing = false;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
  };
  canvas.onpointerdown = e => { drawing = true; canvas.setPointerCapture(e.pointerId); const p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); };
  canvas.onpointermove = e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); };
  canvas.onpointerup = canvas.onpointercancel = () => { drawing = false; };
}

/* -------- fin de séance -------- */
function endSession(){
  const sts = session.states.filter(Boolean);
  const seen = sts.filter(s => s.revealed || s.checked || s.grade).length;
  const checkedN = sts.filter(s => s.checked).length;
  const right = sts.filter(s => s.checked && s.ok === true).length;
  const gCount = g => sts.filter(s => s.grade === g).length;
  const errIds = [];
  session.states.forEach((s, i) => {
    if (!s) return;
    if (s.grade === "again" || (s.checked && s.ok === false)){
      const id = session.cards[i] && session.cards[i].id;
      if (id && !errIds.includes(id)) errIds.push(id);
    }
  });
  session.summary = {
    total: session.cards.length, seen, right, checked: checkedN,
    again: gCount("again"), hard: gCount("hard"), good: gCount("good"), easy: gCount("easy"),
    marked: session.live.marked, acquired: session.live.acquired,
    errIds, mode: session.mode
  };
  session.active = false;
  clearSavedSession();
  document.body.classList.remove("in-session");
  renderLearn();
}
function renderSummary(){
  const s = session.summary;
  const graded = s.again + s.hard + s.good + s.easy;
  const errCards = s.errIds.map(id => db.cards.find(c => c.id === id)).filter(Boolean);

        (s.mode === "written" ? '<div class="sum-row"><span>Réponses écrites justes</span><b>' + s.right + ' / ' + s.checked + '</b></div>' : "") +
        (s.again ? '<div class="sum-row"><span>Ratées (reviennent vite)</span><b>' + s.again + '</b></div>' : "") +
        (s.marked ? '<div class="sum-row"><span>Programmées à la main ⏱</span><b>' + s.marked + '</b></div>' : "") +
        (s.acquired ? '<div class="sum-row"><span>Passées en acquises ✓</span><b>' + s.acquired + '</b></div>' : "") +
      '</div>' +
      errList +
      '<div class="sum-btns">' +
        (errCards.length ? '<button class="btn primary big" id="btn-redo-err">Revoir mes ' + errCards.length + ' erreur' + (errCards.length > 1 ? "s" : "") + '</button>' : "") +
        '<button class="btn' + (errCards.length ? " ghost" : " primary big") + '" id="btn-back-hub">Retour à l\'atelier</button>' +

/* -------- programmation ⏱ manuelle -------- */
function delayTargets(){
  const t = now();
  const tonight = new Date(); tonight.setHours(20, 0, 0, 0);
  if (tonight.getTime() <= t) tonight.setDate(tonight.getDate() + 1);
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1); tomorrow.setHours(9, 0, 0, 0);
  return [
    ["10 minutes", t + 10 * 60e3],
    ["1 heure", t + 3600e3],
    ["3 heures", t + 3 * 3600e3],
    ["Ce soir · 20 h", tonight.getTime()],
    ["Demain · 9 h", tomorrow.getTime()],
    ["3 jours", t + 3 * 86400e3],
    ["1 semaine", t + 7 * 86400e3]
  ];
}
function openDelaySheet(c, after){
  const opts = delayTargets().map(o => '<button class="btn" data-d="' + o[1] + '">' + o[0] + '</button>').join("");
  openSheet(
    '<h3 class="sh-t">Revoir « ' + esc(c.hz) + ' » dans…</h3>' +
    (c.due != null ? '<p class="sh-p">Actuellement programmée : ' + fmtDate(c.due) + '</p>' : "") +
    '<div class="delay-grid">' + opts + '</div>' +
    '<div class="dl-custom"><input type="datetime-local" id="dl-dt" class="search"><button class="btn" id="dl-ok">OK</button></div>' +
    (c.due != null ? '<button class="btn ghost wide" id="dl-cancel">Annuler la programmation actuelle</button>' : "") +
    '<button class="btn ghost wide" id="dl-close">Fermer</button>'
  );
  const setDue = ts => {
    c.due = ts; c.acquired = false; save(); closeSheet();
    toast("« " + c.hz + " » reviendra le " + fmtDate(ts) + ".");
    if (after) after(true);
  };
  document.querySelectorAll("#sheet [data-d]").forEach(b => b.onclick = () => setDue(+b.dataset.d));
  $("dl-ok").onclick = () => {
    const v = $("dl-dt").value;
    if (!v){ toast("Choisis une date et une heure."); return; }
    const ts = new Date(v).getTime();
    if (!ts || ts <= now()){ toast("Choisis un moment dans le futur."); return; }
    setDue(ts);
  };
  if ($("dl-cancel")) $("dl-cancel").onclick = () => {
    c.due = null; save(); closeSheet();
    toast("Programmation annulée.");
    if (after) after(false);
  };
  $("dl-close").onclick = closeSheet;
}

/* ================= bibliothèque (库) ================= */
let lib = { q: "", flt: "all", cat: "", sort: "unit" };
function libFiltered(){
  let list = db.cards.slice();
  const q = lib.q.trim();
  if (q){
    const fq = flatten(q);
    list = list.filter(c =>
      c.hz.includes(q) ||
      (fq && (flatten(c.py).includes(fq) || flatten(c.fr).includes(fq) || flatten(c.cat).includes(fq)))
    );
  }
  if (lib.flt === "fav") list = list.filter(c => c.fav);
  else if (lib.flt === "due") list = list.filter(c => c.due != null);
  else if (lib.flt === "acq") list = list.filter(c => c.acquired);
  else if (lib.flt === "notacq") list = list.filter(c => !c.acquired);
  if (lib.cat) list = list.filter(c => c.cat === lib.cat);
  if (lib.sort === "unit") list.sort(unitSort);
  else if (lib.sort === "old") list.sort((a, b) => a.created - b.created);
  else if (lib.sort === "hz") list.sort((a, b) => a.hz.localeCompare(b.hz, "zh"));
  else if (lib.sort === "py") list.sort((a, b) => flatten(a.py).localeCompare(flatten(b.py)));
  else if (lib.sort === "fr") list.sort((a, b) => flatten(a.fr).localeCompare(flatten(b.fr)));
  else list.sort((a, b) => b.created - a.created);
  return list;
}

/* ================= atelier du trait (写) ================= */
let writeState = { char: null, filter: "", scope: "unit" };
let wWriter = null, wLoaded = null;
function currentUnit(){
  const pool = db.cards.filter(c => !c.acquired && c.unit != null);
  const fresh = pool.filter(c => c.due == null).sort(unitSort);
  if (fresh.length) return fresh[0].unit;
  const any = pool.sort(unitSort);
  return any.length ? any[0].unit : null;
}
function writeChars(){
  const f = writeState.filter.trim();
  const ff = flatten(f);
  let cards = db.cards;
  const u = currentUnit();
  if (writeState.scope === "unit" && u != null) cards = cards.filter(c => c.unit === u);
  if (f) cards = cards.filter(c => c.hz.includes(f) || (ff && (flatten(c.py).includes(ff) || flatten(c.fr).includes(ff))));
  const set = new Set();
  cards.forEach(c => Array.from(c.hz).forEach(ch => { if (/[\u4e00-\u9fff]/.test(ch)) set.add(ch); }));
  return Array.from(set);
}
function renderWrite(){
  const root = $("view");
  wWriter = null; wLoaded = null;
  if (!db.cards.length){
    root.innerHTML = '<section class="card pad"><h2 class="v-t">写 · L\'atelier du trait</h2><p class="sh-p">Ajoute ou importe des cartes pour t\'entraîner à tracer leurs caractères.</p></section>';
    return;
  }
  const u = currentUnit();
  const hasUnits = u != null;
  root.innerHTML =
    '<section class="card pad">' +
      '<h2 class="v-t">写 · L\'atelier du trait</h2>' +
      (hasUnits
        ? '<div class="chips" style="margin-bottom:10px">' +
            '<button class="chip" data-wscope="unit" aria-pressed="' + String(writeState.scope === "unit") + '">Unité en cours (U' + u + ')</button>' +
            '<button class="chip" data-wscope="all" aria-pressed="' + String(writeState.scope === "all") + '">Tous</button>' +
          '</div>'
        : "") +
      '<input class="search" id="w-filter" placeholder="Filtrer (mot, pinyin, français…)" value="' + esc(writeState.filter) + '" autocomplete="off">' +
      '<div class="picker" id="picker"></div>' +
      '<div class="w-lab" id="w-label" style="text-align:center"></div>' +
      '<div class="mizi"><div id="w-target"></div><div id="w-ghost" class="ghost" hidden></div><canvas id="w-canvas" hidden></canvas></div>' +
      '<div class="w-note" id="w-note" style="text-align:center"></div>' +
      '<div class="sh-btns">' +
        '<button class="btn" id="w-anim">Ordre des traits</button>' +
        '<button class="btn primary" id="w-quiz">Quiz</button>' +
        '<button class="btn ghost" id="w-clear" hidden>Effacer</button>' +
      '</div>' +
    '</section>';
  document.querySelectorAll("[data-wscope]").forEach(b => b.onclick = () => { writeState.scope = b.dataset.wscope; renderWrite(); });
  $("w-filter").oninput = e => { writeState.filter = e.target.value; renderPicker(); };
  $("w-anim").onclick = () => {
    if (!wWriter){ toast("Tracé animé indisponible pour ce caractère."); return; }
    wWriter.showCharacter(); wWriter.animateCharacter();
    $("w-note").textContent = "Observe l'ordre des traits.";
  };
  $("w-quiz").onclick = () => {
    if (!wWriter){ toast("Quiz indisponible pour ce caractère."); return; }
    wWriter.hideCharacter();
    $("w-note").textContent = "À toi : trace de mémoire, trait par trait.";
    wWriter.quiz({ onComplete: () => { $("w-note").textContent = "漂亮 ! Caractère réussi ✓"; } });
  };
  $("w-clear").onclick = () => {
    const cv = $("w-canvas");
    cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
  };
  renderPicker();
}
function renderPicker(){
  const p = $("picker");
  if (!p) return;
  const chars = writeChars();
  if (!chars.length){
    p.innerHTML = '<p class="sh-p">Aucun caractère ne correspond.</p>';
    $("w-label").innerHTML = ""; $("w-target").innerHTML = "";
    wWriter = null; wLoaded = null;
    return;
  }
  if (!writeState.char || !chars.includes(writeState.char)) writeState.char = chars[0];
  p.innerHTML = chars.map(ch =>
    '<button class="chip hzchip" data-ch="' + esc(ch) + '" aria-pressed="' + String(ch === writeState.char) + '">' + esc(ch) + '</button>'
  ).join("");
  p.querySelectorAll(".hzchip").forEach(b => b.onclick = () => loadWriteChar(b.dataset.ch));
  if (writeState.char !== wLoaded) loadWriteChar(writeState.char);
}
function loadWriteChar(ch){
  writeState.char = ch; wLoaded = ch; wWriter = null;
  document.querySelectorAll("#picker .hzchip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ch === ch)));
  const target = $("w-target"), ghost = $("w-ghost"), canvas = $("w-canvas");
  if (!target) return;
  const card = db.cards.find(c => c.hz.includes(ch));
  $("w-label").innerHTML = card
    ? '<span data-say="' + esc(card.hz) + '" style="cursor:pointer">' + esc(card.hz) + '</span> · ' + colorPinyin(card.py) + ' · ' + esc(card.fr)
    : "";
  target.hidden = false; ghost.hidden = true; canvas.hidden = true;
  $("w-clear").hidden = true;
  $("w-note").textContent = "";
  target.innerHTML = "";
  const size = Math.min(280, target.parentElement.clientWidth || 280);
  target.style.width = size + "px"; target.style.height = size + "px";
  if (typeof HanziWriter === "undefined"){ fallbackWriteChar(ch); return; }
  wWriter = HanziWriter.create(target, ch, {
    width: size, height: size, padding: 10,
    showCharacter: true, showOutline: true, showHintAfterMisses: 2,
    strokeColor: "#17140F", outlineColor: "#CDBFA1", drawingColor: "#9E2B25",
    delayBetweenStrokes: 120,
    onLoadCharDataError: () => { if (writeState.char === ch) fallbackWriteChar(ch); }
  });
}
function fallbackWriteChar(ch){
  // repli : modèle en filigrane + tracé libre au doigt/souris
  wWriter = null;
  const target = $("w-target"), ghost = $("w-ghost"), canvas = $("w-canvas");
  if (!target || !ghost || !canvas) return;
  target.hidden = true; ghost.hidden = false; canvas.hidden = false;
  $("w-clear").hidden = false;
  ghost.textContent = ch;
  ghost.style.fontSize = "200px";
  const size = Math.min(280, ghost.parentElement.clientWidth || 280);
  canvas.width = size; canvas.height = size;
  paintPad(canvas);
  $("w-note").textContent = "Tracé animé indisponible ici — entraînement libre sur le modèle.";
}

function newToneRound(play){
  const grid = $("tone-grid");
  if (!grid) return;
  const set = TONE_SETS[Math.floor(Math.random() * TONE_SETS.length)];
  const tone = 1 + Math.floor(Math.random() * 4);
  toneRound = { set, tone, target: set.items[tone - 1], done: false };
  grid.innerHTML = [1, 2, 3, 4].map(t =>
    '<button class="opt" data-t="' + t + '"><span class="tn t' + t + '">' + numToAccent(set.syl + t) + '</span></button>'
  ).join("");
  $("tone-note").textContent = "Appuie sur le sceau, puis choisis le ton entendu.";
  $("tone-go").hidden = true;
  grid.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (toneRound.done) return;
    toneRound.done = true;
    const t = +b.dataset.t;
    const okBtn = grid.querySelector('[data-t="' + toneRound.tone + '"]');
    if (okBtn) okBtn.classList.add("ok");
    const tg = toneRound.target;
    if (t === toneRound.tone) $("tone-note").textContent = "✓ Juste ! C'était " + tg[0] + " " + tg[1] + " — " + tg[2] + ".";
    else { b.classList.add("ko"); $("tone-note").textContent = "✗ C'était le ton " + toneRound.tone + " : " + tg[0] + " " + tg[1] + " — " + tg[2] + "."; }
    $("tone-go").hidden = false;
  });
  $("tone-go").onclick = () => newToneRound(true);
  if (play) speak(toneRound.target[0]);
}
function pickDistractors(target, pool){
  // pièges intelligents : syllabes proches, même initiale, même nombre de syllabes
  const sylCount = s => String(s || "").trim().split(/\s+/).filter(Boolean).length;
  const tN = sylCount(target.py);
  const tIni = (flatten(target.py) || "")[0] || "";
  const tSyls = new Set(String(target.py || "").toLowerCase().split(/\s+/).map(x => flatten(x)).filter(Boolean));
  return pool
    .filter(c => c.id !== target.id)
    .map(c => {
      let s = Math.random();
      if (sylCount(c.py) === tN) s += 2;
      if (((flatten(c.py) || "")[0] || "") === tIni) s += 2;
      if (String(c.py || "").toLowerCase().split(/\s+/).some(x => tSyls.has(flatten(x)))) s += 1.5;
      if (c.cat && c.cat === target.cat) s += 1;
      return [s, c];
    })
    .sort((a, b) => b[0] - a[0])
    .slice(0, 6)
    .map(x => x[1])
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);
}
function newWordRound(play){
  const grid = $("word-grid");
  if (!grid || db.cards.length < 4) return;
  const target = db.cards[Math.floor(Math.random() * db.cards.length)];
  const opts = shuffle([target].concat(pickDistractors(target, db.cards)));
  wordRound = { target, done: false };
  const lvl = db.settings.listenLevel;
  grid.innerHTML = opts.map(c =>
    '<button class="opt" data-id="' + c.id + '">' +
      (lvl !== 3 ? '<span class="o-hz">' + esc(c.hz) + '</span>' : '<span class="o-hz" style="font-size:16px;font-family:var(--ui)">' + esc(c.fr) + '</span>') +
      (lvl === 1 ? '<span class="o-fr">' + esc(c.fr) + '</span>' : "") +
    '</button>'
  ).join("");
  $("word-note").textContent = "Appuie sur le sceau, puis choisis le mot entendu.";
  $("word-go").hidden = true;
  grid.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (wordRound.done) return;
    wordRound.done = true;
    const okBtn = grid.querySelector('[data-id="' + wordRound.target.id + '"]');
    if (okBtn) okBtn.classList.add("ok");
    const tg = wordRound.target;
    if (b.dataset.id === tg.id) $("word-note").textContent = "✓ Juste ! " + tg.hz + " (" + tg.py + ") · " + tg.fr;
    else {
      b.classList.add("ko");
      const picked = db.cards.find(c => c.id === b.dataset.id);
      $("word-note").textContent = "✗ C'était " + tg.hz + " (" + tg.py + ") · " + tg.fr + (picked ? " — tu as choisi " + picked.hz + " (" + picked.py + ")." : ".");
    }
    $("word-go").hidden = false;
  });
  $("word-go").onclick = () => newWordRound(true);
  if (play) speak(target.hz);
}
