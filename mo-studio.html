      '<details class="gcard"' + (i === 0 ? " open" : "") + '><summary><span class="g-hz">' + g.hz + '</span>' + g.t + '</summary><div class="g-body">' + g.body + quizHtml(i) + '</div></details>'
    ).join("");
  document.querySelectorAll(".qz-opts").forEach(box => {
    const gi = +box.dataset.g;
    box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
      if (box.dataset.done) return;
      box.dataset.done = "1";
      const good = box.querySelector('[data-ok="true"]');
      if (good) good.classList.add("ok");
      if (b.dataset.ok !== "true") b.classList.add("ko");
      // score de la fiche
      const boxes = Array.from(document.querySelectorAll('.qz-opts[data-g="' + gi + '"]'));
      const done = boxes.filter(x => x.dataset.done).length;
      const right = boxes.filter(x => x.dataset.done && !x.querySelector(".chip.ko")).length;
      const sc = $("qz-score-" + gi);
      if (sc) sc.textContent = done === boxes.length ? "Score : " + right + " / " + boxes.length + (right === boxes.length ? " — 漂亮 !" : "") : "";
    });
  });
}

/* ================= réglages ================= */
function openSettings(){
  refreshVoices();
  const s = db.settings;
  const backup = getBackup();
  const vopts = '<option value="">Voix automatique</option>' + voices.map(v =>
    '<option value="' + esc(v.voiceURI) + '"' + (s.voice === v.voiceURI ? " selected" : "") + '>' + esc(v.name) + '</option>'
  ).join("");
  const pyChip = (v, l) => '<button class="chip" data-py="' + v + '" aria-pressed="' + String(s.pinyin === v) + '">' + l + '</button>';
  const selOpt = (arr, cur) => arr.map(o => '<option value="' + o[0] + '"' + (cur === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("");
  openSheet(
    '<h3 class="sh-t">设 · Réglages</h3>' +
    '<div class="eyebrow" style="margin-top:6px">Séance « Continuer »</div>' +
    '<label class="f-lab">Taille maximale<select class="search" id="st-size">' + selOpt([[10,"10 cartes"],[15,"15 cartes"],[20,"20 cartes"],[30,"30 cartes"],[0,"Tout ce qui est dû"]], s.sessionSize) + '</select></label>' +
    '<label class="f-lab">Nouvelles cartes par séance<select class="search" id="st-new">' + selOpt([[0,"0"],[3,"3"],[5,"5"],[10,"10"]], s.newPerSession) + '</select></label>' +
    '<div class="eyebrow">Pinyin</div>' +
    '<div class="chips" id="st-py">' + pyChip("always", "Toujours") + pyChip("reveal", "Au verso") + pyChip("never", "Jamais") + '</div>' +
    '<label class="ck" style="margin-top:8px"><input type="checkbox" id="st-col"' + (s.toneColors ? " checked" : "") + '> Colorer les tons</label>' +
    '<div class="eyebrow">Audio</div>' +
    '<label class="f-lab">Vitesse · <span id="rate-lab">' + s.rate.toFixed(2) + '×</span><input type="range" id="st-rate" min="0.5" max="1.2" step="0.05" value="' + s.rate + '"></label>' +
    '<label class="f-lab">Voix chinoise<select class="search" id="st-voice">' + vopts + '</select></label>' +
    (voices.length ? "" : '<p class="sh-note">Aucune voix chinoise détectée. Installe une voix « Chinois (Chine) » dans ton système pour activer l\'audio.</p>') +
    '<div class="eyebrow">Exercices écrits</div>' +
    '<label class="ck"><input type="checkbox" id="wm-py"' + (s.writeModes.pinyin ? " checked" : "") + '> Taper le pinyin</label>' +
    '<label class="ck"><input type="checkbox" id="wm-fr"' + (s.writeModes.fr ? " checked" : "") + '> Taper le français</label>' +
    '<label class="ck"><input type="checkbox" id="wm-tr"' + (s.writeModes.trace ? " checked" : "") + '> Tracer les caractères</label>' +
    '<div class="eyebrow">Données</div>' +
    '<div class="sh-btns">' +
      '<button class="btn" id="st-export">Exporter</button>' +
      '<button class="btn" id="st-import">Importer</button>' +
      '<button class="btn ghost" id="st-format">Format JSON</button>' +
    '</div>' +
    (backup ? '<button class="btn wide" id="st-restore">Restaurer la sauvegarde du ' + fmtDate(backup.ts) + '</button>' : "") +
    '<button class="btn danger wide" id="st-reset">Tout effacer</button>' +
    '<button class="btn ghost wide" id="st-close">Fermer</button>'
  );
  $("st-size").onchange = e => { s.sessionSize = +e.target.value; save(); };
  $("st-new").onchange = e => { s.newPerSession = +e.target.value; save(); };
  document.querySelectorAll("#st-py .chip").forEach(b => b.onclick = () => {
    s.pinyin = b.dataset.py; save();
    document.querySelectorAll("#st-py .chip").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.py === s.pinyin)));
  });
  $("st-col").onchange = e => { s.toneColors = e.target.checked; save(); };
  $("st-rate").oninput = e => { s.rate = +e.target.value; $("rate-lab").textContent = s.rate.toFixed(2) + "×"; save(); };
  $("st-voice").onchange = e => { s.voice = e.target.value; save(); speak("你好"); };
  ["wm-py", "wm-fr", "wm-tr"].forEach(id => {
    $(id).onchange = () => {
      const py = $("wm-py").checked, fr = $("wm-fr").checked, tr = $("wm-tr").checked;
      if (!py && !fr && !tr){
        $(id).checked = true;
        toast("Garde au moins un type d'exercice écrit.");
        return;
      }
      s.writeModes = { pinyin: py, fr: fr, trace: tr };
      save();
    };
  });
  $("st-export").onclick = exportData;
  $("st-import").onclick = () => $("file-global").click();
  $("st-format").onclick = openFormatSheet;
  if ($("st-restore")) $("st-restore").onclick = () => {
    const b = getBackup();
    if (!b){ toast("Aucune sauvegarde trouvée."); return; }
    if (!confirm("Restaurer la sauvegarde du " + fmtDate(b.ts) + " ? Ta collection actuelle sera remplacée.")) return;
    db.cards = b.cards.map(c => normalizeCard(c, true)).filter(Boolean);
    db.packs = Array.isArray(b.packs) ? b.packs : [];
    db.units = (b.units && typeof b.units === "object") ? b.units : {};
    session = { active:false };
    clearSavedSession();
    save(); closeSheet(); refreshActive(); toast("Sauvegarde restaurée.");
  };
  $("st-reset").onclick = () => {
    if (!confirm("Tout effacer ? Cartes, packs et progression seront supprimés (réglages conservés).\nUne sauvegarde sera gardée, restaurable depuis les réglages.")) return;
    makeBackup();
    db.cards = []; db.packs = []; db.units = {};
    hub = { flt:"all", pack:"", cat:"", includeAcquired:false, freeOpen:false };
    session = { active: false };
    clearSavedSession();
    save(); closeSheet(); refreshActive(); toast("Collection effacée (sauvegarde disponible dans les réglages).");
  };
  $("st-close").onclick = () => { closeSheet(); refreshActive(); };
}

/* ================= import / export ================= */
function exportData(){
  const data = { app:"mo-studio", version:2, exported:new Date().toISOString(), units:db.units, cards:db.cards, packs:db.packs, settings:db.settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mo-studio-export.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Export téléchargé.");
}
function openImportSheet(data){
  const rawCards = Array.isArray(data) ? data : (Array.isArray(data.cards) ? data.cards : []);
  const incoming = rawCards.map(c => normalizeCard(c, false)).filter(Boolean);
  if (!incoming.length){ toast("Aucune carte valide dans ce fichier (hz et fr obligatoires)."); return; }
  const name = (!Array.isArray(data) && typeof data.name === "string") ? data.name.trim() : "";
  const existing = new Set(db.cards.map(cardKey));
  const fresh = incoming.filter(c => !existing.has(cardKey(c)));
  const dupN = incoming.length - fresh.length;
  openSheet(
    '<h3 class="sh-t">Importer ' + incoming.length + ' carte' + (incoming.length > 1 ? "s" : "") + '</h3>' +
    '<p class="sh-p">' + fresh.length + ' nouvelle' + (fresh.length > 1 ? "s" : "") + ' · ' + dupN + ' déjà présente' + (dupN > 1 ? "s" : "") + ' (mêmes 汉字 + pinyin).</p>' +
    (name ? '<label class="ck"><input type="checkbox" id="im-pack" checked> Créer / compléter le pack « ' + esc(name) + ' »</label>' : "") +
    '<div class="sh-btns">' +
      '<button class="btn primary" id="im-merge">Fusionner</button>' +
      '<button class="btn danger" id="im-replace">Remplacer tout</button>' +
      '<button class="btn ghost" id="im-cancel">Annuler</button>' +
    '</div>' +
    '<p class="sh-note">« Fusionner » ajoute seulement les nouvelles cartes. « Remplacer tout » écrase cartes et packs (réglages conservés, sauvegarde automatique avant).</p>'
  );
  $("im-cancel").onclick = closeSheet;
  $("im-merge").onclick = () => doImport(data, incoming, fresh, name, false);
  $("im-replace").onclick = () => { if (confirm("Remplacer toute ta collection ? (une sauvegarde sera gardée)")) doImport(data, incoming, fresh, name, true); };
}
function doImport(data, incoming, fresh, name, replace){
  const wantPack = !!(name && $("im-pack") && $("im-pack").checked);
  session = { active: false };
  clearSavedSession();
  hub.pack = ""; hub.cat = "";
  const inUnits = (!Array.isArray(data) && data.units && typeof data.units === "object" && !Array.isArray(data.units)) ? data.units : null;
  if (replace){
    makeBackup();
    const raw = Array.isArray(data) ? incoming : (Array.isArray(data.cards) ? data.cards : incoming);
    let cards = raw.map(c => normalizeCard(c, true)).filter(Boolean);
    const seen = new Set();
    cards = cards.filter(c => { const k = cardKey(c); if (seen.has(k)) return false; seen.add(k); return true; });
    db.cards = cards;
    const ids = new Set(cards.map(c => c.id));
    db.packs = (!Array.isArray(data) && Array.isArray(data.packs))
      ? data.packs.filter(p => p && p.name && Array.isArray(p.cardIds)).map(p => ({ id:String(p.id || uid()), name:String(p.name), cardIds:p.cardIds.filter(i => ids.has(i)) }))
      : [];
    db.units = inUnits || {};
  } else {
    db.cards = db.cards.concat(fresh);
    if (inUnits) db.units = Object.assign({}, db.units, inUnits);
  }
  const added = replace ? db.cards.length : fresh.length;
  if (wantPack){
    const byKey = new Map(db.cards.map(c => [cardKey(c), c.id]));
    const idsForPack = incoming.map(c => byKey.get(cardKey(c))).filter(Boolean);
    upsertPack(name, idsForPack);
  }
  save(); closeSheet(); refreshActive();
  toast(replace
    ? "Collection remplacée (" + added + " cartes)."
    : (added ? added + " carte" + (added > 1 ? "s" : "") + " ajoutée" + (added > 1 ? "s" : "") + "." : "Rien à ajouter — tout existait déjà."));
}
const FORMAT_EXAMPLE = '{\n  "version": 2,\n  "name": "HSK 2",\n  "units": { "1": "Ma première unité" },\n  "cards": [\n    {\n      "hz": "唱歌",\n      "py": "chang4 ge1",\n      "fr": "chanter",\n      "cat": "Verbes",\n      "unit": 1,\n      "order": 1,\n      "exHz": "我喜欢唱歌。",\n      "exPy": "wo3 xi3 huan5 chang4 ge1.",\n      "exFr": "J\'aime chanter.",\n      "note": ""\n    }\n  ]\n}';
function openFormatSheet(){
  openSheet(
    '<h3 class="sh-t">Format JSON des packs</h3>' +
    '<p class="sh-p"><b>hz</b> et <b>fr</b> sont obligatoires. <b>py</b> accepte les tons en chiffres (ai4) ou en accents (ài). <b>cat</b>, <b>exHz</b>, <b>exPy</b>, <b>exFr</b>, <b>note</b> sont optionnels. <b>unit</b> + <b>order</b> définissent l\'ordre d\'apprentissage (les nouvelles cartes arrivent dans cet ordre), et <b>units</b> donne un nom à chaque unité. Le champ <b>name</b> crée le pack automatiquement à l\'import.</p>' +
    '<pre class="fmt" id="fmt-pre">' + esc(FORMAT_EXAMPLE) + '</pre>' +
    '<div class="sh-btns">' +
      '<button class="btn" id="fmt-copy">Copier l\'exemple</button>' +
      '<button class="btn ghost" id="fmt-close">Fermer</button>' +
    '</div>'
  );
  $("fmt-copy").onclick = () => {
    const done = () => toast("Exemple copié.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(FORMAT_EXAMPLE).then(done, () => toast("Copie impossible ici."));
    else toast("Copie impossible ici — sélectionne le texte à la main.");
  };
  $("fmt-close").onclick = closeSheet;
}

/* ================= sheet & toast ================= */
function openSheet(html){
  const o = $("sheet");
  o.querySelector(".sheet-card").innerHTML = html;
  o.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  $("sheet").classList.remove("open");
  document.body.style.overflow = "";
}
const sheetOpen = () => $("sheet").classList.contains("open");
let toastTimer = null;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= initialisation ================= */
function init(){
  refreshVoices();
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => setView(b.dataset.view));
  $("btn-settings").onclick = openSettings;
  $("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
  // audio : tout élément portant data-say est cliquable
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-say]");
    if (el) speak(el.getAttribute("data-say"));
  });
  // import de fichier
  $("file-global").addEventListener("change", e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{ openImportSheet(JSON.parse(r.result)); }
      catch(err){ toast("Fichier JSON invalide."); }
    };
    r.onerror = () => toast("Impossible de lire le fichier.");
    r.readAsText(f);
  });
  // raccourcis clavier
  document.addEventListener("keydown", e => {
    if (sheetOpen()){ if (e.key === "Escape") closeSheet(); return; }
    if (!session.active || activeView !== "learn") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select"){
      if (e.key === "Enter" && $("s-check")){ e.preventDefault(); checkWritten(); }
      return;
    }
    const grades = { "1":"again", "2":"hard", "3":"good", "4":"easy" };
    if (grades[e.key]){
      const b = document.querySelector('[data-grade="' + grades[e.key] + '"]');
      if (b){ e.preventDefault(); b.click(); return; }
    }
    if (e.key === "Enter" || e.key === " "){
      e.preventDefault();
      if ($("s-flip")) $("s-flip").click();
      else if ($("s-next")) $("s-next").click();
    } else if (e.key === "ArrowRight" && $("s-next")) $("s-next").click();
    else if (e.key === "ArrowLeft" && $("s-prev") && !$("s-prev").disabled) $("s-prev").click();
    else if (e.key === "Escape") endSession();
  });
  setView("learn");
}
init();
</script>
