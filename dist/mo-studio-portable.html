}

"use strict";

const HSK_RUNTIME_SCHEMA_VERSION = 1;
const HSK_RESULT_LIMIT = 48;
const HSK_RUNTIME_ROOT = (() => {
   const portable =
      typeof document !== "undefined" &&
      /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable ? "../data/generated/hsk/runtime/" : "data/generated/hsk/runtime/",
      typeof document === "undefined" ? "http://localhost/" : document.baseURI,
   ).href;
})();

const hskDataState = {
   manifest: null,
   searchEntries: null,
   entriesById: new Map(),
   entriesByDictionaryId: new Map(),
   levels: new Map(),
   error: null,
};

function hskRuntimeUrl(relativePath) {
   return new URL(relativePath, HSK_RUNTIME_ROOT).href;
}

async function fetchHskJson(relativePath) {
   const response = await fetch(hskRuntimeUrl(relativePath), { cache: "default" });
   if (!response.ok) throw new Error(relativePath + " · HTTP " + response.status);
   try {
      return await response.json();
   } catch (error) {
      throw new Error(relativePath + " · JSON HSK invalide");
   }
}

function validateHskPayload(payload, label) {
   if (
      !payload ||
      payload.schemaVersion !== HSK_RUNTIME_SCHEMA_VERSION ||
      !Array.isArray(payload.fields) ||
      !Array.isArray(payload.entries)
   ) {
      throw new Error(label + " · données HSK incompatibles");
   }
   return payload;
}

function decodeHskPayload(payload) {
   const indexes = Object.fromEntries(payload.fields.map((field, index) => [field, index]));
   const required = [
      "hskEntryId",
      "chinese",
      "pinyin",
      "hskLevel",
      "firstHskLevel",
      "sourceLevels",
      "sourceTranslation",
      "dictionaryEntryId",
      "dictionaryLinkStatus",
   ];
   if (required.some((field) => indexes[field] == null)) {
      throw new Error("Champs HSK requis absents.");
   }
   return payload.entries.map((row) => ({
      hskEntryId: row[indexes.hskEntryId],
      chinese: row[indexes.chinese],
      pinyin: row[indexes.pinyin],
      hskLevel: Number(row[indexes.hskLevel]),
      firstHskLevel: Number(row[indexes.firstHskLevel]),
      sourceLevels: row[indexes.sourceLevels] || [],
      partOfSpeech: row[indexes.partOfSpeech] ?? null,
      sourceTranslation: row[indexes.sourceTranslation] || "",
      dictionaryEntryId: row[indexes.dictionaryEntryId] || null,
      dictionaryLinkStatus: row[indexes.dictionaryLinkStatus],
      senseId: row[indexes.senseId] || null,
      baseDictionaryLinkStatus:
         row[indexes.baseDictionaryLinkStatus] || row[indexes.dictionaryLinkStatus],
      selectedDictionaryPronunciation:
         row[indexes.selectedPronunciationMarked] ||
         row[indexes.selectedPronunciationNumbered] ||
         row[indexes.selectedPronunciationPlain]
            ? {
                 marked: row[indexes.selectedPronunciationMarked] || "",
                 numbered: row[indexes.selectedPronunciationNumbered] || "",
                 plain: row[indexes.selectedPronunciationPlain] || "",
              }
            : null,
   }));
}

async function loadHskManifest() {
   if (hskDataState.manifest) return hskDataState.manifest;
   try {
      const manifest = await fetchHskJson("manifest.json");
      if (
         !manifest ||
         manifest.format !== "mo-studio-hsk-runtime" ||
         manifest.schemaVersion !== HSK_RUNTIME_SCHEMA_VERSION ||
         manifest.totalEntries !== 5399 ||
         !manifest.countsByFirstHskLevel ||
         !manifest.searchIndex ||
         !manifest.levelPathTemplate
      ) {
         throw new Error("Manifeste HSK absent, corrompu ou incompatible.");
      }
      hskDataState.manifest = manifest;
      return manifest;
   } catch (error) {
      hskDataState.error = error;
      throw error;
   }
}

function indexHskEntries(entries) {
   for (const entry of entries) {
      hskDataState.entriesById.set(entry.hskEntryId, entry);
      if (!entry.dictionaryEntryId) continue;
      if (!hskDataState.entriesByDictionaryId.has(entry.dictionaryEntryId))
         hskDataState.entriesByDictionaryId.set(entry.dictionaryEntryId, []);
      const linked = hskDataState.entriesByDictionaryId.get(entry.dictionaryEntryId);
      if (!linked.some((item) => item.hskEntryId === entry.hskEntryId)) linked.push(entry);
   }
}

async function loadHskSearchIndex() {
   if (hskDataState.searchEntries) return hskDataState.searchEntries;
   const manifest = await loadHskManifest();
   const payload = validateHskPayload(
      await fetchHskJson(manifest.searchIndex),
      manifest.searchIndex,
   );
   const entries = decodeHskPayload(payload);
   if (entries.length !== manifest.totalEntries)
      throw new Error("Index HSK incomplet.");
   hskDataState.searchEntries = entries;
   indexHskEntries(entries);
   return entries;
}

async function loadHskLevel(level) {
   const numericLevel = Number(level);
   if (!Number.isInteger(numericLevel) || numericLevel < 1 || numericLevel > 6)
      throw new Error("Niveau HSK invalide.");
   if (hskDataState.levels.has(numericLevel)) return hskDataState.levels.get(numericLevel);
   const manifest = await loadHskManifest();
   const relativePath = manifest.levelPathTemplate.replace("{level}", numericLevel);
   const payload = validateHskPayload(await fetchHskJson(relativePath), relativePath);
   const entries = decodeHskPayload(payload);
   const expected = Number(manifest.countsByFirstHskLevel[numericLevel]);
   if (
      payload.level !== numericLevel ||
      entries.length !== expected ||
      entries.some((entry) => entry.firstHskLevel !== numericLevel)
   ) {
      throw new Error(`Fragment HSK ${numericLevel} incohérent.`);
   }
   hskDataState.levels.set(numericLevel, entries);
   indexHskEntries(entries);
   return entries;
}

function hskMetadata(entry) {
   return {
      hskEntryId: entry.hskEntryId,
      level: entry.firstHskLevel,
      firstHskLevel: entry.firstHskLevel,
      sourceLevels: entry.sourceLevels,
      sourcePinyin: entry.pinyin,
      sourceTranslation: entry.sourceTranslation,
      partOfSpeech: entry.partOfSpeech,
      dictionaryLinkStatus: entry.dictionaryLinkStatus,
      baseDictionaryLinkStatus: entry.baseDictionaryLinkStatus,
      senseId: entry.senseId,
   };
}

function verifiedHskLevels(entry) {
   return Array.from(
      new Set(
         (Array.isArray(entry && entry.hskVerified) ? entry.hskVerified : [])
            .map((item) => Number(item.firstHskLevel ?? item.level))
            .filter((level) => Number.isInteger(level) && level >= 1 && level <= 6),
      ),
   ).sort((left, right) => left - right);
}

function hskLinkStatusLabel(status) {
   if (status === "source-only") return "Données HSK source";
   if (status === "ambiguous") return "Liaison dictionnaire ambiguë";
   if (status === "normalized-pinyin") return "Pinyin normalisé";
   if (status === "duplicate-sense") return "Sens HSK distinct";
   return "Liaison exacte";
}

function attachHskMetadata(dictionaryEntry, explicitEntries) {
   if (!dictionaryEntry) return dictionaryEntry;
   const linked = explicitEntries || hskDataState.entriesByDictionaryId.get(dictionaryEntry.id) || [];
   if (linked.length) dictionaryEntry.hskVerified = linked.map(hskMetadata);
   return dictionaryEntry;
}

function hskSourceAsDictionaryEntry(entry) {
   const marked = normalizeVisibleWhitespace(entry.pinyin);
   const isFrenchSource = entry.firstHskLevel === 1;
   return {
      id: entry.hskEntryId,
      simplified: entry.chinese,
      traditional: entry.chinese,
      entryType: Array.from(entry.chinese).length === 1 ? "character" : "word",
      pinyin: marked
         ? [
              {
                 marked,
                 numbered: entry.selectedDictionaryPronunciation?.numbered || "",
                 plain: normalizePinyinPlain(entry.pinyin),
              },
           ]
         : [],
      definitionsFr: isFrenchSource && entry.sourceTranslation ? [entry.sourceTranslation] : [],
      definitionsEn: !isFrenchSource && entry.sourceTranslation ? [entry.sourceTranslation] : [],
      sources: ["Liste HSK source"],
      sourceRefs: [],
      hskLegacy: [],
      hsk30: [],
      hskVerified: [hskMetadata(entry)],
      frequencyRank: null,
      characters: Array.from(entry.chinese).filter((character) => HAN_PATTERN.test(character)),
      dictionaryEntryId: entry.dictionaryEntryId,
      dictionaryLinkStatus: entry.dictionaryLinkStatus,
      hskSourceEntry: entry,
      __hskSource: true,
   };
}

function hskEntryMatchesQuery(entry, query) {
   if (!query || !query.valid) return false;
   if (query.type.startsWith("hanzi"))
      return entry.chinese.includes(query.hanzi);
   if (query.type.startsWith("pinyin")) {
      const plain = normalizePinyinPlain(entry.pinyin);
      return plain === query.plain || plain.startsWith(query.plain);
   }
   if (query.type === "translation") {
      const translation = normalizeTranslation(entry.sourceTranslation);
      return query.tokens.every((token) =>
         translation.split(" ").some((word) => word === token || word.startsWith(token)),
      );
   }
   return false;
}

function compareHskSourceMatches(left, right, query) {
   const leftExact = query.type.startsWith("hanzi") && left.chinese === query.hanzi;
   const rightExact = query.type.startsWith("hanzi") && right.chinese === query.hanzi;
   return (
      Number(rightExact) - Number(leftExact) ||
      left.firstHskLevel - right.firstHskLevel ||
      left.chinese.localeCompare(right.chinese, "zh") ||
      left.hskEntryId.localeCompare(right.hskEntryId)
   );
}

async function searchHskEntries(rawQuery, limit) {
   const entries = await loadHskSearchIndex();
   const query = classifySearchQuery(rawQuery);
   if (!query.valid) return [];
   return entries
      .filter((entry) => hskEntryMatchesQuery(entry, query))
      .sort((left, right) => compareHskSourceMatches(left, right, query))
      .slice(0, limit || HSK_RESULT_LIMIT);
}

async function mergeHskSearchResults(response, rawQuery) {
   if (!response || !response.query || !response.query.valid) return response;
   const matches = await searchHskEntries(rawQuery, HSK_RESULT_LIMIT);
   const results = response.results || [];
   const dictionaryResultsById = new Map();
   results.forEach((item) => {
      attachHskMetadata(item.entry);
      dictionaryResultsById.set(item.entry.id, item);
   });

   const addedHskIds = new Set();
   for (const hskEntry of matches) {
      const dictionaryResult = hskEntry.dictionaryEntryId
         ? dictionaryResultsById.get(hskEntry.dictionaryEntryId)
         : null;
      if (dictionaryResult) {
         attachHskMetadata(
            dictionaryResult.entry,
            hskDataState.entriesByDictionaryId.get(hskEntry.dictionaryEntryId),
         );
         continue;
      }
      if (addedHskIds.has(hskEntry.hskEntryId)) continue;
      addedHskIds.add(hskEntry.hskEntryId);
      const entry = hskSourceAsDictionaryEntry(hskEntry);
      results.push({
         entry,
         rank: rankDictionaryEntry(entry, response.query, {
            englishFallback: response.englishFallback || hskEntry.firstHskLevel > 1,
         }),
      });
   }

   results.forEach((item) => {
      item.rank = rankDictionaryEntry(item.entry, response.query, {
         englishFallback: response.englishFallback || !!item.entry.__hskSource,
      });
   });
   results.sort(compareRankedDictionaryEntries);
   response.results = results;
   response.hskMatches = matches.length;
   return response;
}

async function loadHskEntryById(hskEntryId) {
   if (hskDataState.entriesById.has(hskEntryId))
      return hskDataState.entriesById.get(hskEntryId);
   await loadHskSearchIndex();
   return hskDataState.entriesById.get(hskEntryId) || null;
}

async function loadHskSearchDetailEntry(entryId) {
   if (!String(entryId).startsWith("hsk:")) {
      const dictionaryEntry = await loadDictionaryEntryById(entryId);
      return attachHskMetadata(dictionaryEntry);
   }
   const hskEntry = await loadHskEntryById(entryId);
   return hskEntry ? hskSourceAsDictionaryEntry(hskEntry) : null;
}

async function openHskVocabularyEntry(entry) {
   if (entry.dictionaryEntryId) {
      try {
         const dictionaryEntry = await loadDictionaryEntryById(entry.dictionaryEntryId);
         if (dictionaryEntry) {
            openDictDetail(attachHskMetadata(dictionaryEntry, [entry]));
            return;
         }
      } catch (error) {
         /* La fiche HSK source reste disponible si le dictionnaire détaillé échoue. */
      }
   }
   openDictDetail(hskSourceAsDictionaryEntry(entry));
}

/* ================= répétition espacée (SRS) ================= */
         // intervalles par niveau : 10 min, 1 j, 3 j, 7 j, 14 j, 30 j, 60 j, 120 j
         const INTERVALS = [
            600e3,
            86400e3,
            3 * 86400e3,
            7 * 86400e3,
            14 * 86400e3,
            30 * 86400e3,
            60 * 86400e3,
            120 * 86400e3,
         ];
         const MAXLVL = INTERVALS.length - 1;
         function fmtIv(ms) {
            if (ms < 3600e3) return Math.round(ms / 60e3) + " min";
            if (ms < 47 * 3600e3) return "1 j";
            return Math.round(ms / 86400e3) + " j";
         }
         function gradeIv(c) {
            // aperçu de l'intervalle pour chaque bouton, selon le niveau actuel de la carte
            const lvl = c.lvl || 0;
            return {
               again: INTERVALS[0],
               hard: INTERVALS[1],
               good: INTERVALS[Math.min(MAXLVL, Math.max(2, lvl + 1))],
               easy: INTERVALS[Math.min(MAXLVL, Math.max(3, lvl + 2))],
            };
         }
         function applyGrade(c, g) {
            const iv = gradeIv(c);
            if (g === "again") c.lvl = 0;
            else if (g === "hard") c.lvl = 1;
            else if (g === "good")
               c.lvl = Math.min(MAXLVL, Math.max(2, (c.lvl || 0) + 1));
            else c.lvl = Math.min(MAXLVL, Math.max(3, (c.lvl || 0) + 2));
            c.due = now() + iv[g];
            if (g === "again" || g === "hard") c.acquired = false;
            c.lastReviewed = now();
            if (!Array.isArray(c.reviewHistory)) c.reviewHistory = [];
            c.reviewHistory.push({ at: c.lastReviewed, grade: g, level: c.lvl, due: c.due });
            if (c.reviewHistory.length > 500)
               c.reviewHistory = c.reviewHistory.slice(-500);
            c.updated = now();
            save();
         }

                     personalLibraryUpdated:
                        typeof d.personalLibraryUpdated === "number"
                           ? d.personalLibraryUpdated
                           : 0,
                     units:
                        d.units &&
                        typeof d.units === "object" &&
                        !Array.isArray(d.units)
                           ? d.units
                           : {},
                     settings: s,
                  };
               }
            } catch (e) {
               // données corrompues : on les met de côté au lieu de les perdre
               try {
                  if (raw) localStorage.setItem(BACKUP_KEY + "-corrupt", raw);
               } catch (e2) {}
            }
            return {
               cards: [],
               packs: [],
               categories: [],
               memberships: [],
               personalLibraryUpdated: 0,
               units: {},
               settings: defaultSettings(),
            };
         }
         let db = load();
         function save() {
            if (typeof ensurePersonalLibraryShape === "function")
               ensurePersonalLibraryShape();

               if (b && Array.isArray(b.cards)) return b;
            } catch (e) {}
            return null;
         }
         function unitName(u) {
            if (u == null) return "";
            return db.units[String(u)] || "Unité " + u;

         /* -------- sauvegarde / reprise de séance -------- */
         function persistSession() {
            try {
               if (!session.active) {
                  localStorage.removeItem(SESSION_KEY);
                  return;
               }
               localStorage.setItem(
                  SESSION_KEY,
                  JSON.stringify({
                     ts: Date.now(),
                     mode: session.mode,
                     ids: session.cards.map((c) => c.id),
                     index: session.index,
                     states: session.states,
                     live: session.live,

         function loadSavedSession() {
            try {
               const s = JSON.parse(localStorage.getItem(SESSION_KEY));

                  Date.now() - s.ts > 24 * 3600e3
               )
                  return null;
               const cards = s.ids
                  .map((id) => db.cards.find((c) => c.id === id))
                  .filter(Boolean);

"use strict";

/* ================= bibliothèque personnelle IndexedDB ================= */
const PERSONAL_DB_NAME = "mo-studio-personal-library";
const PERSONAL_DB_VERSION = 1;
const PERSONAL_SCHEMA_VERSION = 3;
let personalDbHandle = null;
let personalPersistTimer = 0;
let personalPersistChain = Promise.resolve();

function uniqueStrings(values) {
   return Array.from(new Set((values || []).map(String).filter(Boolean)));
}

function normalizePinyinIdentity(value) {
   let normalized = String(value || "").replace(/u:/gi, "ü");
   if (/[0-9]/.test(normalized)) normalized = numToAccent(normalized);
   return flatten(normalized);
}

function normalizeMeaningIdentity(value) {
   return flatten(String(value || ""));
}

function personalCardKey(card) {
   return [
      String(card.hz || card.chinese || "").trim(),
      normalizePinyinIdentity(card.py || card.pinyin),
      String(normalizeMeaningIdentity(card.fr || card.translation) || card.senseId || "").trim(),
   ].join("§");
}

function categoryById(id) {
   return db.categories.find((category) => category.id === id) || null;
}

function categoriesForPack(packId) {
   return db.categories.filter((category) => category.packId === packId);
}

function categoryCardIds(categoryId) {
   return uniqueStrings(
      db.memberships
         .filter((membership) => membership.categoryId === categoryId)
         .map((membership) => membership.cardId),
   );
}

function cardsForCategory(categoryId) {
   const ids = new Set(categoryCardIds(categoryId));
   return db.cards.filter((card) => ids.has(card.id));
}

function packCardIds(packId) {
   const categoryIds = new Set(categoriesForPack(packId).map((category) => category.id));
   return uniqueStrings(
      db.memberships
         .filter((membership) => categoryIds.has(membership.categoryId))
         .map((membership) => membership.cardId),
   );
}

function cardsForPack(packId) {
   const ids = new Set(packCardIds(packId));
   return db.cards.filter((card) => ids.has(card.id));
}

function categoriesForCard(cardId) {
   const ids = new Set(
      db.memberships
         .filter((membership) => membership.cardId === cardId)
         .map((membership) => membership.categoryId),
   );
   return db.categories.filter((category) => ids.has(category.id));
}

function syncLegacyPackCardIds() {
   db.packs.forEach((pack) => {
      pack.cardIds = packCardIds(pack.id);
   });
}

function ensurePersonalLibraryShape() {
   if (!Array.isArray(db.categories)) db.categories = [];
   if (!Array.isArray(db.memberships)) db.memberships = [];
   if (!Array.isArray(db.packs)) db.packs = [];
   if (!Array.isArray(db.cards)) db.cards = [];

   const cardIds = new Set(db.cards.map((card) => String(card.id)));
   const validPacks = new Set(db.packs.map((pack) => String(pack.id)));
   db.categories = db.categories
      .filter((category) => category && category.id && validPacks.has(String(category.packId)))
      .map((category) => ({
         id: String(category.id),
         packId: String(category.packId),
         name: String(category.name || "Sans titre").trim() || "Sans titre",
         created: typeof category.created === "number" ? category.created : Date.now(),
         updated: typeof category.updated === "number" ? category.updated : Date.now(),
      }));

   // Migration idempotente des anciens packs plats. Une catégorie historique
   // n'est créée que lorsqu'une appartenance n'existe pas encore.
   db.packs.forEach((pack) => {
      pack.id = String(pack.id);
      pack.name = String(pack.name || "Pack sans titre").trim() || "Pack sans titre";
      pack.description = String(pack.description || "");
      const legacyIds = uniqueStrings(pack.cardIds).filter((id) => cardIds.has(id));
      legacyIds.forEach((cardId) => {
         const alreadyLinked = db.memberships.some((membership) => {
            const category = categoryById(membership.categoryId);
            return membership.cardId === cardId && category && category.packId === pack.id;
         });
         if (alreadyLinked) return;
         const card = db.cards.find((item) => item.id === cardId);
         const name = (card && card.cat) || "Tous les mots";
         let category = db.categories.find(
            (item) => item.packId === pack.id && item.name.toLocaleLowerCase("fr") === name.toLocaleLowerCase("fr"),
         );
         if (!category) {
            category = { id: uid(), packId: pack.id, name, created: Date.now(), updated: Date.now() };
            db.categories.push(category);
         }
         db.memberships.push({ id: category.id + "§" + cardId, categoryId: category.id, cardId });
      });
   });

   const categoryIds = new Set(db.categories.map((category) => category.id));
   const seenMemberships = new Set();
   db.memberships = db.memberships.filter((membership) => {
      if (!membership || !cardIds.has(String(membership.cardId)) || !categoryIds.has(String(membership.categoryId)))
         return false;
      membership.cardId = String(membership.cardId);
      membership.categoryId = String(membership.categoryId);
      membership.id = membership.categoryId + "§" + membership.cardId;
      if (seenMemberships.has(membership.id)) return false;
      seenMemberships.add(membership.id);
      return true;
   });
   syncLegacyPackCardIds();
   return db;
}

function openPersonalDatabase() {
   if (!globalThis.indexedDB) return Promise.resolve(null);
   return new Promise((resolve, reject) => {
      const request = indexedDB.open(PERSONAL_DB_NAME, PERSONAL_DB_VERSION);
      request.onupgradeneeded = () => {
         const database = request.result;
         ["cards", "packs", "categories", "memberships", "meta"].forEach((name) => {
            if (!database.objectStoreNames.contains(name)) database.createObjectStore(name, { keyPath: "id" });
         });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("IndexedDB indisponible."));
      request.onblocked = () => reject(new Error("La bibliothèque est ouverte dans un autre onglet."));
   });
}

function idbRequest(request) {
   return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
   });
}

function idbTransactionDone(transaction) {
   return new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onabort = transaction.onerror = () => reject(transaction.error || new Error("Transaction IndexedDB annulée."));
   });
}

async function readPersonalDatabase() {
   if (!personalDbHandle) return null;
   const transaction = personalDbHandle.transaction(
      ["cards", "packs", "categories", "memberships", "meta"],
      "readonly",
   );
   const [cards, packs, categories, memberships, meta] = await Promise.all([
      idbRequest(transaction.objectStore("cards").getAll()),
      idbRequest(transaction.objectStore("packs").getAll()),
      idbRequest(transaction.objectStore("categories").getAll()),
      idbRequest(transaction.objectStore("memberships").getAll()),
      idbRequest(transaction.objectStore("meta").get("library")),
   ]);
   return { cards, packs, categories, memberships, meta };
}

async function persistPersonalLibraryNow() {
   if (!personalDbHandle) return;
   ensurePersonalLibraryShape();
   const snapshot = {
      cards: structuredClone(db.cards),
      packs: structuredClone(db.packs),
      categories: structuredClone(db.categories),
      memberships: structuredClone(db.memberships),
   };
   const transaction = personalDbHandle.transaction(
      ["cards", "packs", "categories", "memberships", "meta"],
      "readwrite",
   );
   ["cards", "packs", "categories", "memberships"].forEach((name) => {
      const store = transaction.objectStore(name);
      store.clear();
      snapshot[name].forEach((item) => store.put(item));
   });
   transaction.objectStore("meta").put({
      id: "library",
      schemaVersion: PERSONAL_SCHEMA_VERSION,
      migratedFrom: DB_KEY,
      updated: db.personalLibraryUpdated || Date.now(),
   });
   await idbTransactionDone(transaction);
}

function schedulePersonalLibraryPersist() {
   if (!personalDbHandle) return;
   clearTimeout(personalPersistTimer);
   personalPersistTimer = setTimeout(() => {
      personalPersistChain = personalPersistChain
         .then(persistPersonalLibraryNow)
         .catch((error) => console.error("Échec de sauvegarde IndexedDB", error));
   }, 40);
}

async function flushPersonalLibrary() {
   clearTimeout(personalPersistTimer);
   personalPersistChain = personalPersistChain.then(persistPersonalLibraryNow);
   return personalPersistChain;
}

async function personalLibraryInit() {
   ensurePersonalLibraryShape();
   try {
      personalDbHandle = await openPersonalDatabase();
      if (!personalDbHandle) return;
      const stored = await readPersonalDatabase();
      const hasStoredData = stored && stored.meta && stored.meta.schemaVersion >= PERSONAL_SCHEMA_VERSION;
      const localIsNewer = hasStoredData &&
         Number(db.personalLibraryUpdated || 0) > Number(stored.meta.updated || 0);
      if (hasStoredData && !localIsNewer) {
         // IndexedDB est autoritaire pour les données personnelles. Les réglages
         // et unités restent issus du contrat historique localStorage.
         db.cards = stored.cards.map((card) => normalizeCard(card, true)).filter(Boolean);
         db.packs = stored.packs;
         db.categories = stored.categories;
         db.memberships = stored.memberships;
         ensurePersonalLibraryShape();
         localStorage.setItem(DB_KEY, JSON.stringify(db));
      } else {
         // La transaction n'efface jamais la source locale. En cas d'échec,
         // l'application continue avec les anciennes données intactes.
         await persistPersonalLibraryNow();
      }
   } catch (error) {
      personalDbHandle = null;
      console.error("Migration IndexedDB non destructive échouée", error);
   }
}

function createPersonalPack(name, description) {

      id: uid(),

      created: Date.now(),

   if (!pack.name) return null;
   db.packs.push(pack);

   return pack;

function createPersonalCategory(packId, name) {
   if (!db.packs.some((pack) => pack.id === packId)) return null;
   const category = {
      id: uid(), packId, name: String(name || "").trim(), created: Date.now(), updated: Date.now(),

// Compatibilité avec l’ancien import plat : il devient un pack doté d’une
// sous-catégorie « Tous les mots », sans dupliquer les cartes.
function upsertPack(name, cardIds) {
   const cleanName = String(name || "").trim();
   if (!cleanName) return null;
   let pack = db.packs.find((item) => item.name.toLocaleLowerCase("fr") === cleanName.toLocaleLowerCase("fr"));
   if (!pack) pack = createPersonalPack(cleanName);
   let category = categoriesForPack(pack.id).find((item) => item.name === "Tous les mots");
   if (!category) category = createPersonalCategory(pack.id, "Tous les mots");
   uniqueStrings(cardIds).forEach((cardId) => addCardMembership(cardId, category.id));
   syncLegacyPackCardIds();
   save();
   return pack;
}

function addCardMembership(cardId, categoryId) {
   if (!db.cards.some((card) => card.id === cardId) || !categoryById(categoryId)) return false;
   const id = categoryId + "§" + cardId;
   if (db.memberships.some((membership) => membership.id === id)) return false;
   db.memberships.push({ id, categoryId, cardId });
   syncLegacyPackCardIds();
   return true;
}

function removeCardsFromLibrary(cardIds) {
   const ids = new Set(cardIds);
   db.cards = db.cards.filter((card) => !ids.has(card.id));
   db.memberships = db.memberships.filter((membership) => !ids.has(membership.cardId));
   syncLegacyPackCardIds();
   invalidateDictIndex();

function deletePersonalCategory(categoryId) {
   db.categories = db.categories.filter((category) => category.id !== categoryId);
   db.memberships = db.memberships.filter((membership) => membership.categoryId !== categoryId);
   syncLegacyPackCardIds();

function deletePersonalPack(packId) {
   const categoryIds = new Set(categoriesForPack(packId).map((category) => category.id));
   db.packs = db.packs.filter((pack) => pack.id !== packId);
   db.categories = db.categories.filter((category) => category.packId !== packId);
   db.memberships = db.memberships.filter((membership) => !categoryIds.has(membership.categoryId));
   syncLegacyPackCardIds();
   save();
}

function jsonErrorWithLocation(error, source) {
   const match = /position\s+(\d+)/i.exec(error.message || "");
   if (!match) return "JSON invalide : " + error.message;
   const position = Number(match[1]);
   const before = source.slice(0, position);
   const line = before.split(/\r?\n/).length;
   const column = position - Math.max(before.lastIndexOf("\n"), before.lastIndexOf("\r"));
   return "JSON invalide à la ligne " + line + ", colonne " + column + " : " + error.message;
}

function parsePackJson(source) {
   let payload;
   try {
      payload = typeof source === "string" ? JSON.parse(source) : source;
   } catch (error) {
      throw new Error(jsonErrorWithLocation(error, String(source || "")));
   }
   return payload;
}

function parseCsvRows(source) {
   const rows = [];
   let row = [], field = "", quoted = false;
   const text = String(source || "").replace(/^\uFEFF/, "");
   for (let index = 0; index < text.length; index++) {
      const char = text[index];
      if (quoted) {
         if (char === '"' && text[index + 1] === '"') { field += '"'; index++; }
         else if (char === '"') quoted = false;
         else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field.replace(/\r$/, "")); rows.push(row); row = []; field = ""; }
      else field += char;
   }
   if (quoted) throw new Error("CSV invalide : guillemet non fermé.");
   if (field || row.length) { row.push(field.replace(/\r$/, "")); rows.push(row); }
   return rows.filter((item) => item.some((value) => String(value).trim()));
}

function csvToPackPayload(source) {
   const rows = parseCsvRows(source);
   if (!rows.length) throw new Error("Le fichier CSV est vide.");
   const supported = ["pack", "category", "chinese", "pinyin", "translation", "notes", "tags"];
   const first = rows[0].map((value) => value.trim().toLowerCase());
   const hasHeader = first.includes("chinese");
   const headers = hasHeader ? first : supported;
   const dataRows = hasHeader ? rows.slice(1) : rows;
   if (!headers.includes("chinese")) throw new Error("CSV invalide : colonne chinese manquante.");
   const packs = new Map();
   dataRows.forEach((row, rowIndex) => {
      const record = Object.fromEntries(headers.map((header, index) => [header, String(row[index] || "").trim()]));
      if (!record.chinese) throw new Error("CSV invalide : chinese manquant à la ligne " + (rowIndex + (hasHeader ? 2 : 1)) + ".");
      const packName = record.pack || "Pack importé";
      const categoryName = record.category || "Sans catégorie";
      if (!packs.has(packName)) packs.set(packName, new Map());
      const categories = packs.get(packName);
      if (!categories.has(categoryName)) categories.set(categoryName, []);
      categories.get(categoryName).push({
         chinese: record.chinese,
         pinyin: record.pinyin,
         translation: record.translation,
         notes: record.notes,
         tags: record.tags ? record.tags.split(/[;|]/).map((tag) => tag.trim()).filter(Boolean) : [],
      });
   });
   return {
      version: 1,
      packs: Array.from(packs, ([name, categories]) => ({
         name,
         categories: Array.from(categories, ([categoryName, words]) => ({ name: categoryName, words })),
      })),
      sourceType: "csv",
   };
}

function validatePackPayload(payload) {
   const errors = [];
   if (!payload || typeof payload !== "object" || Array.isArray(payload))
      return { errors: ["La racine doit être un objet JSON."], packs: [] };
   let packs = [];
   if (payload.pack) packs = [payload.pack];
   else if (Array.isArray(payload.packs)) packs = payload.packs;
   else errors.push("Champ obligatoire manquant : pack (ou packs pour une sauvegarde). ");
   if (Array.isArray(payload.unclassifiedWords) && payload.unclassifiedWords.length) {
      packs = packs.concat([{
         name: "Cartes non classées",
         description: "Cartes conservées hors pack dans la sauvegarde",
         __unclassified: true,
         categories: [{ name: "Sans catégorie", words: payload.unclassifiedWords }],
      }]);
   }
   packs.forEach((pack, packIndex) => {
      if (!pack || typeof pack !== "object") { errors.push("pack[" + packIndex + "] doit être un objet."); return; }
      if (!String(pack.name || "").trim()) errors.push("pack[" + packIndex + "].name est obligatoire.");
      if (!Array.isArray(pack.categories)) { errors.push("pack[" + packIndex + "].categories doit être un tableau."); return; }
      pack.categories.forEach((category, categoryIndex) => {
         const path = "pack[" + packIndex + "].categories[" + categoryIndex + "]";
         if (!category || typeof category !== "object") { errors.push(path + " doit être un objet."); return; }
         if (!String(category.name || "").trim()) errors.push(path + ".name est obligatoire.");
         if (!Array.isArray(category.words)) { errors.push(path + ".words doit être un tableau."); return; }
         category.words.forEach((word, wordIndex) => {
            if (!word || typeof word !== "object") errors.push(path + ".words[" + wordIndex + "] doit être un objet.");
            else if (!String(word.chinese || word.hz || "").trim()) errors.push(path + ".words[" + wordIndex + "].chinese est obligatoire.");
         });
      });
   });
   return { errors, packs };
}

async function dictionaryCompletion(chinese) {
   try {
      const index = await loadDictionaryIndex("exactHanzi", false);
      const references = index[chinese] || [];
      if (!references.length) return null;
      const entries = await loadDictionaryPreviewsByReferences(references.slice(0, 8));
      const exact = entries.filter((entry) => entry.simplified === chinese || entry.traditional === chinese);
      if (!exact.length) return null;
      const entry = exact[0];
      return {
         pinyin: entry.pinyin && entry.pinyin[0] ? entry.pinyin[0].marked : "",
         translation: entry.definitionsFr && entry.definitionsFr[0] ? entry.definitionsFr[0] : "",
         dictionaryId: entry.id,
      };
   } catch (error) {
      console.error("Complétion dictionnaire impossible", error);
      return null;
   }
}

async function dictionaryCompletions(chineseValues) {
   try {
      const index = await loadDictionaryIndex("exactHanzi", false);
      const wanted = uniqueStrings(chineseValues);
      const refs = uniqueStrings(wanted.flatMap((chinese) => (index[chinese] || []).slice(0, 8))).map(Number);
      const entries = await loadDictionaryPreviewsByReferences(refs);
      const output = new Map();
      wanted.forEach((chinese) => {
         const entry = entries.find((item) => item.simplified === chinese || item.traditional === chinese);
         if (!entry) return;
         output.set(chinese, {
            pinyin: entry.pinyin && entry.pinyin[0] ? entry.pinyin[0].marked : "",
            translation: entry.definitionsFr && entry.definitionsFr[0] ? entry.definitionsFr[0] : "",
            dictionaryId: entry.id,
         });
      });
      return output;
   } catch (error) {
      console.error("Complétion groupée du dictionnaire impossible", error);
      return new Map();
   }
}

async function buildPackImportPreview(payload, sourceType) {
   const validation = validatePackPayload(payload);
   const preview = {
      payload,
      sourceType: sourceType || payload.sourceType || "json",
      errors: validation.errors,
      packs: [],
      categoryCount: 0,
      wordCount: 0,
      duplicates: 0,
      existing: 0,
      missingDictionary: 0,
      incomplete: 0,
   };
   if (preview.errors.length) return preview;
   const chineseValues = validation.packs.flatMap((rawPack) =>
      rawPack.categories.flatMap((rawCategory) =>
         rawCategory.words.map((rawWord) => String(rawWord.chinese || rawWord.hz || "").trim()),
      ),
   );
   const dictionaryMatches = await dictionaryCompletions(chineseValues);
   const seenIncoming = new Map();
   const existingCards = db.cards.slice();
   for (const rawPack of validation.packs) {
      const pack = { name: String(rawPack.name).trim(), description: String(rawPack.description || "").trim(), unclassified: !!rawPack.__unclassified, categories: [] };
      for (const rawCategory of rawPack.categories) {
         const category = { name: String(rawCategory.name).trim(), words: [] };
         for (const rawWord of rawCategory.words) {
            const chinese = String(rawWord.chinese || rawWord.hz || "").trim();
            let pinyin = String(rawWord.pinyin || rawWord.py || "").trim();
            let translation = String(rawWord.translation || rawWord.fr || "").trim();
            const dictionary = dictionaryMatches.get(chinese) || null;
            if (!dictionary) preview.missingDictionary++;
            if (!pinyin && dictionary) pinyin = dictionary.pinyin;
            if (!translation && dictionary) translation = dictionary.translation;
            const word = {
               chinese, pinyin, translation,
               notes: String(rawWord.notes || rawWord.note || "").trim(),
               favorite: !!(rawWord.favorite || rawWord.fav),
               difficult: !!rawWord.difficult,
               tags: Array.isArray(rawWord.tags) ? rawWord.tags : typeof rawWord.tags === "string" ? rawWord.tags.split(/[;,]/) : [],
               senseId: rawWord.senseId ? String(rawWord.senseId) : "",
               incomplete: !pinyin || !translation,
               dictionaryId: dictionary ? dictionary.dictionaryId : "",
               sourceId: rawWord.id ? String(rawWord.id) : "",
               srs: rawWord.srs && typeof rawWord.srs === "object" ? rawWord.srs : null,
            };
            if (word.incomplete) preview.incomplete++;
            const key = personalCardKey({ hz: chinese, py: pinyin, fr: translation, senseId: word.senseId });
            const exactExisting = existingCards.find((card) => personalCardKey(card) === key);
            word.existingCardId = exactExisting ? exactExisting.id : "";
            if (exactExisting) preview.existing++;
            if (seenIncoming.has(key)) { preview.duplicates++; word.duplicateOf = seenIncoming.get(key); }
            else seenIncoming.set(key, word);
            category.words.push(word);
            preview.wordCount++;
         }
         pack.categories.push(category);
         preview.categoryCount++;
      }
      preview.packs.push(pack);
   }
   return preview;
}

function findReusableCard(word) {
   if (word.sourceId) {
      const byId = db.cards.find((card) => card.id === word.sourceId);
      if (byId) return byId;
   }
   const key = personalCardKey({ hz: word.chinese, py: word.pinyin, fr: word.translation, senseId: word.senseId });
   return db.cards.find((card) => personalCardKey(card) === key) || null;
}

function createCardFromImportedWord(word) {
   const sameHanziAndPinyin = db.cards.filter(
      (card) => card.hz === word.chinese && normalizePinyinIdentity(card.py) === normalizePinyinIdentity(word.pinyin),
   );
   const differentSense = sameHanziAndPinyin.some(
      (card) => normalizeMeaningIdentity(card.fr) !== normalizeMeaningIdentity(word.translation),
   );
   const card = normalizeCard({
      id: word.sourceId || undefined,
      hz: word.chinese,
      py: word.pinyin,
      fr: word.translation,
      note: word.notes,
      fav: word.favorite,
      difficult: word.difficult,
      tags: word.tags,
      incomplete: word.incomplete,
      senseId: word.senseId || (differentSense ? "sense-" + normalizeMeaningIdentity(word.translation || uid()) : ""),
      lvl: word.srs ? word.srs.level : 0,
      acquired: word.srs ? word.srs.acquired : false,
      due: word.srs ? word.srs.due : null,
      created: word.srs ? word.srs.created : Date.now(),
      updated: word.srs ? word.srs.updated : Date.now(),
      lastReviewed: word.srs ? word.srs.lastReviewed : null,
      reviewHistory: word.srs ? word.srs.reviewHistory : [],
   }, !!word.sourceId);
   db.cards.push(card);
   return card;
}

function applyPackImport(preview, options) {
   if (!preview || preview.errors.length) throw new Error("L'aperçu contient des erreurs.");
   const settings = Object.assign({ mode: "new", targetPackId: "", skipDuplicates: true, replaceStructure: false, importMissing: true }, options || {});
   makeBackup();
   const results = { added: 0, reused: 0, memberships: 0, packs: 0, categories: 0, skipped: 0 };
   const importWord = (word, category) => {
      if (word.incomplete && !settings.importMissing) { results.skipped++; return; }
      let card = findReusableCard(word);
      if (card) {
         results.reused++;
         card.fav = card.fav || word.favorite;
         card.difficult = card.difficult || word.difficult;
         card.tags = uniqueStrings([...(card.tags || []), ...(word.tags || [])]);
         if (!card.note && word.notes) card.note = word.notes;
      } else {
         card = createCardFromImportedWord(word);
         results.added++;
      }
      if (category && addCardMembership(card.id, category.id)) results.memberships++;
   };
   preview.packs.forEach((incomingPack, packIndex) => {
      if (incomingPack.unclassified) {
         incomingPack.categories.forEach((category) =>
            category.words.forEach((word) => importWord(word, null)),
         );
         return;
      }
      let pack = null;
      if (settings.mode === "merge" && settings.targetPackId)
         pack = db.packs.find((item) => item.id === settings.targetPackId) || null;
      if (!pack) pack = db.packs.find((item) => item.name.toLocaleLowerCase("fr") === incomingPack.name.toLocaleLowerCase("fr")) || null;
      if (!pack || settings.mode === "new") {
         pack = createPersonalPack(incomingPack.name, incomingPack.description);
         results.packs++;
      } else if (incomingPack.description && !pack.description) pack.description = incomingPack.description;

      if (settings.replaceStructure) {
         const oldCategoryIds = new Set(categoriesForPack(pack.id).map((category) => category.id));
         db.categories = db.categories.filter((category) => category.packId !== pack.id);
         db.memberships = db.memberships.filter((membership) => !oldCategoryIds.has(membership.categoryId));
      }

      incomingPack.categories.forEach((incomingCategory) => {
         let category = db.categories.find(
            (item) => item.packId === pack.id && item.name.toLocaleLowerCase("fr") === incomingCategory.name.toLocaleLowerCase("fr"),
         );
         if (!category) {
            category = { id: uid(), packId: pack.id, name: incomingCategory.name, created: Date.now(), updated: Date.now() };
            db.categories.push(category);
            results.categories++;
         }
         incomingCategory.words.forEach((word) => {
            importWord(word, category);
         });
      });
   });
   syncLegacyPackCardIds();
   invalidateDictIndex();
   save();
   return results;
}

function packExportObject(pack) {
   return {
      id: pack.id,
      name: pack.name,
      description: pack.description || "",
      created: pack.created,
      updated: pack.updated,
      categories: categoriesForPack(pack.id).map((category) => ({
         id: category.id,
         name: category.name,
         created: category.created,
         updated: category.updated,
         words: cardsForCategory(category.id).map((card) => ({
            id: card.id,
            chinese: card.hz,
            pinyin: card.py,
            translation: card.fr,
            notes: card.note,
            favorite: card.fav,
            difficult: card.difficult,
            tags: card.tags || [],
            incomplete: card.incomplete,
            senseId: card.senseId || "",
            srs: {
               level: card.lvl,
               acquired: card.acquired,
               due: card.due,
               created: card.created,
               updated: card.updated,
               lastReviewed: card.lastReviewed,
               reviewHistory: card.reviewHistory || [],
            },
         })),
      })),
   };
}

function buildLibraryExport(packIds) {
   const wanted = packIds ? new Set(packIds) : null;
   const packs = db.packs.filter((pack) => !wanted || wanted.has(pack.id));
   const includedCardIds = new Set(packs.flatMap((pack) => packCardIds(pack.id)));
   if (!wanted) db.cards.forEach((card) => includedCardIds.add(card.id));
   return {
      app: "mo-studio",
      type: wanted && wanted.size === 1 ? "pack" : "personal-library-backup",
      version: 3,
      exported: new Date().toISOString(),
      packs: packs.map(packExportObject),
      unclassifiedWords: db.cards.filter((card) => includedCardIds.has(card.id) && !categoriesForCard(card.id).length).map((card) => ({
         id: card.id, chinese: card.hz, pinyin: card.py, translation: card.fr, notes: card.note,
         favorite: card.fav, difficult: card.difficult, tags: card.tags || [], senseId: card.senseId || "",
         srs: { level: card.lvl, acquired: card.acquired, due: card.due, created: card.created, updated: card.updated, lastReviewed: card.lastReviewed, reviewHistory: card.reviewHistory || [] },
      })),
      settings: db.settings,
      units: db.units,
   };
}

function downloadJson(data, filename) {
   const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
   const link = document.createElement("a");
   link.href = URL.createObjectURL(blob);
   link.download = filename;
   document.body.appendChild(link);
   link.click();
   link.remove();
   setTimeout(() => URL.revokeObjectURL(link.href), 5000);
}

let reviewSelectionMode = "due";

function reviewSelectedCards() {
   let cards = db.cards.slice();
   if (reviewSelectionMode === "due") cards = cards.filter(isDue);
   else if (reviewSelectionMode === "all") cards = cards;
   else if (reviewSelectionMode === "pack") cards = cardsForPack(reviewPackId);
   else if (reviewSelectionMode === "categories") {
      const ids = new Set(Array.from(reviewCategoryIds).flatMap(categoryCardIds));
      cards = cards.filter((card) => ids.has(card.id));
   } else if (reviewSelectionMode === "manual") cards = cards.filter((card) => manualReviewIds.has(card.id));
   else if (reviewSelectionMode === "fav") cards = cards.filter((card) => card.fav);
   else if (reviewSelectionMode === "difficult") cards = cards.filter((card) => card.difficult);
   else if (reviewSelectionMode === "new") cards = cards.filter((card) => card.due == null && !card.acquired);
   else if (reviewSelectionMode === "learned") cards = cards.filter((card) => card.acquired || card.due != null || (card.lvl || 0) > 0);
   return cards;
}

function scopeCards() {
   return reviewSelectedCards();
}

function scopeLabel() {
   if (reviewSelectionMode === "pack") {
      const pack = db.packs.find((item) => item.id === reviewPackId);
      return pack ? "Pack · " + pack.name : "Pack";
   }
   if (reviewSelectionMode === "categories") return reviewCategoryIds.size + " sous-catégorie(s)";
   if (reviewSelectionMode === "manual") return reviewScopeLabel || "Sélection manuelle";

function smartQueue() {
   const cards = reviewSelectedCards();
   const due = cards.filter(isDue);
   const fresh = cards.filter((card) => card.due == null && !card.acquired);
   return {
      q: cards,
      dueN: due.length,
      dueTotal: due.length,
      freshN: fresh.length,
      freshTotal: fresh.length,
      freshUnit: fresh.length ? fresh[0].unit : null,
      nextDue: db.cards.filter((card) => card.due > now()).sort((a, b) => a.due - b.due)[0]?.due || null,
   };
}

      if (token !== pathRenderToken || activeView !== "path" || openPathLevel != null) return;
      root.innerHTML =
         '<section class="path-page" aria-labelledby="path-title">' +
         '<header class="path-header"><div class="path-mark">学</div><div><h2 class="v-t" id="path-title">学 · Parcours</h2>' +
         '<p class="muted">Vocabulaire officiel HSK 1 à 6, classé par premier niveau.</p></div></header>' +
         '<section class="card pad path-continue" aria-labelledby="path-continue-title">' +
         '<h3 id="path-continue-title">Explorer le vocabulaire HSK</h3>' +
         '<p><b>' +
         manifest.totalEntries.toLocaleString("fr-FR") +
         " entrées</b> disponibles. Les leçons et exercices ne sont pas encore créés.</p></section>" +
         pathGrammarCardHtml() +
         '<div class="path-levels" aria-label="Niveaux HSK">' +
         [1, 2, 3, 4, 5, 6].map((level) => pathLevelCardHtml(manifest, level)).join("") +
         "</div></section>";
      wirePathHome();
   } catch (error) {
      if (token !== pathRenderToken) return;
      root.innerHTML =
         '<section class="path-page"><header class="path-header"><div class="path-mark">学</div><div><h2 class="v-t" id="path-title">学 · Parcours</h2></div></header>' +
         '<section class="card pad path-error" role="alert"><b>Données HSK indisponibles.</b><p>' +
         esc(error.message) +
         '</p><button class="btn" id="path-retry" type="button">Réessayer</button></section></section>';
      $("path-retry").onclick = () => renderPath();
   }
}

function pathStatusBadge(entry) {
   const status = entry.dictionaryLinkStatus;
   if (!["ambiguous", "source-only", "duplicate-sense"].includes(status)) return "";
   return (
      '<span class="path-word-status status-' +
      esc(status) +
      '">' +
      esc(hskLinkStatusLabel(status)) +
      "</span>"
   );
}

function pathVocabularyRowHtml(entry, index) {
   const sourceLevels = Array.isArray(entry.sourceLevels) ? entry.sourceLevels : [];
   return (
      '<button class="path-word" type="button" data-path-word-index="' +
      index +
      '" data-hsk-entry-id="' +
      esc(entry.hskEntryId) +
      '"><span class="path-word-hanzi">' +
      esc(entry.chinese) +

      colorPinyin(entry.pinyin) +
      '</span><span class="path-word-translation">' +
      esc(entry.sourceTranslation) +
      "</span>" +
      (entry.partOfSpeech || sourceLevels.length > 1
         ? '<small class="path-word-meta">' +
           (entry.partOfSpeech ? esc(entry.partOfSpeech) : "") +
           (entry.partOfSpeech && sourceLevels.length > 1 ? " · " : "") +
           (sourceLevels.length > 1 ? "niveaux source " + sourceLevels.map(esc).join(", ") : "") +
           "</small>"
         : "") +
      '</span><span class="path-word-badges"><span class="hsk-badge hsk-level-' +
      entry.firstHskLevel +
      '" data-hsk-badge="' +
      entry.firstHskLevel +
      '">HSK ' +
      entry.firstHskLevel +
      "</span>" +
      pathStatusBadge(entry) +
      "</span></button>"
   );

function filteredPathEntries() {
   const visible = normalizeVisibleWhitespace(pathLevelFilter).toLowerCase();
   if (!visible) return pathLevelEntries;
   const plain = normalizePinyinPlain(visible);
   const translation = normalizeTranslation(visible);
   return pathLevelEntries.filter(
      (entry) =>
         entry.chinese.includes(visible) ||
         (plain && normalizePinyinPlain(entry.pinyin).includes(plain)) ||
         (translation && normalizeTranslation(entry.sourceTranslation).includes(translation)),
   );
}

function wirePathVocabulary(filtered) {
   const search = $("path-level-search");
   if (search) {
      search.oninput = () => {
         pathLevelFilter = search.value;
         pathLevelVisible = PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
   }
   document.querySelectorAll("[data-path-word-index]").forEach((button) => {
      button.onclick = async () => {
         const entry = filtered[Number(button.dataset.pathWordIndex)];
         if (!entry) return;
         openSheet(
            '<div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de la fiche…</b></div>',
         );
         await openHskVocabularyEntry(entry);
      };
   });
   if ($("path-show-more"))
      $("path-show-more").onclick = () => {
         pathLevelVisible += PATH_PAGE_SIZE;
         renderPathVocabulary();
      };
}

function renderPathVocabulary() {
   const target = $("path-vocabulary");
   if (!target) return;
   const filtered = filteredPathEntries();
   const visible = filtered.slice(0, pathLevelVisible);
   target.innerHTML =
      '<div class="path-level-tools"><label for="path-level-search">Filtrer ce niveau</label>' +
      '<input class="search" id="path-level-search" type="search" placeholder="汉字, pinyin ou traduction…" value="' +
      esc(pathLevelFilter) +
      '"><span class="path-filter-count" aria-live="polite">' +
      filtered.length.toLocaleString("fr-FR") +
      (filtered.length > 1 ? " entrées" : " entrée") +
      "</span></div>" +
      (visible.length
         ? '<div class="path-word-list" data-path-word-list>' +
           visible.map(pathVocabularyRowHtml).join("") +
           "</div>"
         : '<div class="path-no-results"><p>Aucun mot dans ce niveau pour cette recherche.</p></div>') +
      (visible.length < filtered.length
         ? '<div class="path-more"><button class="btn ghost" id="path-show-more" type="button">Afficher ' +
           Math.min(PATH_PAGE_SIZE, filtered.length - visible.length).toLocaleString("fr-FR") +
           " entrées de plus</button></div>"
         : "");
   const search = $("path-level-search");
   if (search && pathLevelFilter) {
      search.focus({ preventScroll: true });
      search.setSelectionRange(search.value.length, search.value.length);
   }
   wirePathVocabulary(filtered);
}

function renderPathLevelFrame(level, count) {
   $("view").innerHTML =
      '<section class="path-page path-level-page" aria-labelledby="path-level-title">' +
      '<header class="path-level-header"><button class="btn ghost" id="path-level-back" type="button">← Retour</button>' +
      '<div><h2 class="v-t" id="path-level-title">HSK ' +
      level +
      '</h2><p class="muted"><span data-path-current-count>' +
      count.toLocaleString("fr-FR") +
      "</span> entrées classées par <code>firstHskLevel</code></p></div></header>" +
      '<p class="path-scope-note">Vocabulaire uniquement · aucune leçon ni aucun exercice.</p>' +
      '<section class="card path-vocabulary" id="path-vocabulary"><div class="path-loading" role="status"><span class="ink-loader"></span><span>Chargement du vocabulaire…</span></div></section></section>';
   $("path-level-back").onclick = () => {
      openPathLevel = null;
      pathLevelEntries = [];
      pathLevelFilter = "";
      renderPath();
      window.scrollTo(0, 0);
   };
}

async function renderPathLevel(level, token) {
   try {
      const manifest = await loadHskManifest();
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      renderPathLevelFrame(level, pathLevelCount(manifest, level));
      const entries = await loadHskLevel(level);
      if (token !== pathRenderToken || activeView !== "path" || openPathLevel !== level) return;
      pathLevelEntries = entries;
      renderPathVocabulary();
   } catch (error) {
      if (token !== pathRenderToken) return;
      const target = $("path-vocabulary");
      if (target)
         target.innerHTML =
            '<div class="path-error" role="alert"><b>Vocabulaire indisponible.</b><p>' +
            esc(error.message) +
            '</p><button class="btn" id="path-level-retry">Réessayer</button></div>';
      if ($("path-level-retry")) $("path-level-retry").onclick = () => renderPath();
   }
}

function renderPath() {
   document.body.classList.remove("in-seq");
   const token = ++pathRenderToken;
   if (openPathLevel == null) renderPathHome(token);
   else renderPathLevel(openPathLevel, token);
}

"use strict";

/* ================= tableau d'écriture (写) ================= */
const WRITING_GRIDS = ["blank", "square", "tian", "mi"];
const WRITING_COLORS = ["#17140f", "#9e2b25", "#2e6b57", "#2f5480"];
let writingResizeObserver = null;
let writingRenderFrame = 0;
let writingPointerId = null;
let writingState = {
   mode: "free",
   word: "",
   characters: [],
   index: 0,
   tool: "pen",
   free: { actions: [], redo: [] },
   practice: {},
};

function writingPreferences() {
   const prefs = db.settings.writingBoard || {};
   prefs.color = /^#[0-9a-f]{6}$/i.test(prefs.color || "")
      ? prefs.color
      : "#17140f";
   prefs.width = Math.max(1, Math.min(24, Number(prefs.width) || 5));
   prefs.grid = WRITING_GRIDS.includes(prefs.grid) ? prefs.grid : "tian";
   prefs.opacity = Math.max(0.04, Math.min(0.45, Number(prefs.opacity) || 0.18));
   prefs.modelVisible = prefs.modelVisible !== false;
   db.settings.writingBoard = prefs;
   return prefs;
}

function saveWritingPreferences() {
   writingPreferences();
   save();
}

function writingDrawingKey() {
   const character = writingState.characters[writingState.index] || "";
   return writingState.word + "§" + writingState.index + "§" + character;
}

function writingDrawingSlot() {
   if (writingState.mode === "free") return writingState.free;
   const key = writingDrawingKey();
   if (!writingState.practice[key])
      writingState.practice[key] = { actions: [], redo: [] };
   return writingState.practice[key];
}

function writingChevron(direction) {
   const path =
      direction === "left" ? "M14.5 6.5 9 12l5.5 5.5" : "M9.5 6.5 15 12l-5.5 5.5";
   return (
      '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' +
      path +
      '"></path></svg>'
   );
}

function writingModeHtml() {
   return (
      '<div class="writing-modes" role="group" aria-label="Mode du tableau">' +
      '<button class="writing-mode" type="button" data-writing-mode="free" aria-pressed="' +
      String(writingState.mode === "free") +
      '"><span>白</span><b>Tableau libre</b></button>' +
      '<button class="writing-mode" type="button" data-writing-mode="practice" aria-pressed="' +
      String(writingState.mode === "practice") +
      '"><span>习</span><b>Entraînement</b></button></div>'
   );
}

function writingPracticeHtml(prefs) {
   if (writingState.mode !== "practice") return "";
   const hasCharacters = writingState.characters.length > 0;
   const character = hasCharacters ? writingState.characters[writingState.index] : "";
   return (
      '<section class="writing-practice-controls" aria-label="Mot à écrire">' +
      '<form class="writing-word-form" id="writing-word-form"><label for="writing-word">Caractère ou mot</label>' +
      '<div><input class="search" id="writing-word" value="' +
      esc(writingState.word) +
      '" placeholder="Ex. 你好" autocomplete="off" inputmode="text">' +

      (hasCharacters
         ? '<div class="writing-character-nav" id="writing-character-nav" aria-label="Glisser ou utiliser les chevrons pour changer de caractère">' +
           '<button class="character-nav-button" id="writing-prev" type="button" aria-label="Caractère précédent"' +
           (writingState.index <= 0 ? " disabled" : "") +
           ">" + writingChevron("left") + "</button>" +
           '<strong id="writing-position" role="status" aria-live="polite">' +
           esc(character) +
           " · " +
           (writingState.index + 1) +

           writingState.characters.length +
           "</strong>" +
           '<button class="character-nav-button" id="writing-next" type="button" aria-label="Caractère suivant"' +
           (writingState.index >= writingState.characters.length - 1 ? " disabled" : "") +

           Math.round(prefs.opacity * 100) +

function writingGridButtonsHtml(prefs) {

function writingToolbarHtml(prefs) {

      '">Gomme</button><button class="btn sm" id="writing-undo" type="button">Annuler</button>' +

   );

function renderWriting() {
   document.body.classList.remove("in-seq");
   destroyWritingBoard();
   const prefs = writingPreferences();
   const character = writingState.characters[writingState.index] || "";
   $("view").innerHTML =
      '<section class="writing-page" aria-labelledby="writing-title"><header class="writing-header"><div class="writing-mark">写</div><div><h2 class="v-t" id="writing-title">写 · Écrire</h2><p class="muted">Un papier d\'entraînement toujours prêt, à la souris, au toucher ou au stylet.</p></div></header>' +
      writingModeHtml() +
      writingPracticeHtml(prefs) +
      '<section class="card writing-workspace" id="writing-workspace">' +
      writingToolbarHtml(prefs) +
      '<div class="writing-surface" id="writing-surface" data-grid="' +
      prefs.grid +
      '"><div class="writing-model" id="writing-model" aria-hidden="true" style="opacity:' +
      prefs.opacity +
      '"' +
      (writingState.mode === "practice" && character && prefs.modelVisible ? "" : " hidden") +
      ">" +
      esc(character) +
      '</div><canvas id="writing-canvas" aria-label="Zone de dessin" tabindex="0"></canvas></div>' +
      writingGridSelectorHtml(prefs) +
      '<p class="writing-note">Le tracé reste sur cet appareil pendant cette visite. Aucune reconnaissance d’écriture n’est effectuée.</p></section></section>';
   wireWritingView();
}

function setWritingCharacters(value) {
   const visible = String(value || "").trim();
   const characters = Array.from(visible).filter((character) => HAN_PATTERN.test(character));
   if (!characters.length) {
      toast("Entre au moins un caractère chinois.");
      return false;
   }
   writingState.word = visible;
   writingState.characters = characters;
   writingState.index = 0;
   return true;
}

function openWritingWord(value) {
   if (!setWritingCharacters(value)) return;
   writingState.mode = "practice";
   closeSheet();
   setView("write");
}

function moveWritingCharacter(delta) {
   const next = writingState.index + delta;
   if (next < 0 || next >= writingState.characters.length) return;
   writingState.index = next;
   renderWriting();
}

function wireWritingSwipe() {
   const target = $("writing-character-nav");
   if (!target) return;
   let start = null;
   target.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      start = { x: event.clientX, y: event.clientY, id: event.pointerId };
   });
   target.addEventListener("pointerup", (event) => {
      if (!start || event.pointerId !== start.id) return;
      const dx = event.clientX - start.x;
      const dy = event.clientY - start.y;
      start = null;
      if (Math.abs(dx) < 34 || Math.abs(dx) <= Math.abs(dy)) return;
      moveWritingCharacter(dx < 0 ? 1 : -1);
   });
   target.addEventListener("pointercancel", () => (start = null));
}

function wireWritingView() {
   document.querySelectorAll("[data-writing-mode]").forEach((button) => {
      button.onclick = () => {
         writingState.mode = button.dataset.writingMode;
         renderWriting();
      };
   });
   if ($("writing-word-form"))
      $("writing-word-form").onsubmit = (event) => {
         event.preventDefault();
         if (setWritingCharacters($("writing-word").value)) renderWriting();
      };
   if ($("writing-prev")) $("writing-prev").onclick = () => moveWritingCharacter(-1);
   if ($("writing-next")) $("writing-next").onclick = () => moveWritingCharacter(1);
   wireWritingSwipe();

   document.querySelectorAll("[data-writing-color]").forEach((button) => {
      button.onclick = () => {
         const prefs = writingPreferences();
         prefs.color = button.dataset.writingColor;
         writingState.tool = "pen";
         saveWritingPreferences();
         renderWriting();
      };
   });
   $("writing-color").oninput = (event) => {
      writingPreferences().color = event.target.value;
      writingState.tool = "pen";
      saveWritingPreferences();
      document.querySelectorAll("[data-writing-color]").forEach((button) =>
         button.setAttribute("aria-pressed", "false"),
      );
      updateWritingToolState();
   };
   $("writing-width").oninput = (event) => {
      writingPreferences().width = Number(event.target.value);
      $("writing-width-value").textContent = event.target.value + " px";
      saveWritingPreferences();
   };
   document.querySelectorAll("[data-writing-grid]").forEach((button) => {
      button.onclick = () => {
         const prefs = writingPreferences();
         prefs.grid = button.dataset.writingGrid;
         saveWritingPreferences();
         $("writing-surface").dataset.grid = prefs.grid;
         document.querySelectorAll("[data-writing-grid]").forEach((item) =>
            item.setAttribute("aria-pressed", String(item === button)),
         );
      };
   });
   if ($("writing-model-visible"))
      $("writing-model-visible").onchange = (event) => {
         writingPreferences().modelVisible = event.target.checked;
         saveWritingPreferences();
         $("writing-model").hidden = !event.target.checked;
      };
   if ($("writing-opacity"))
      $("writing-opacity").oninput = (event) => {
         const opacity = Number(event.target.value) / 100;
         writingPreferences().opacity = opacity;
         $("writing-opacity-value").textContent = event.target.value + "%";
         $("writing-model").style.opacity = opacity;
         saveWritingPreferences();
      };

   $("writing-pen").onclick = () => {
      writingState.tool = "pen";
      updateWritingToolState();
   };
   $("writing-eraser").onclick = () => {
      writingState.tool = "eraser";
      updateWritingToolState();
   };
   $("writing-undo").onclick = undoWritingAction;
   $("writing-redo").onclick = redoWritingAction;
   $("writing-clear").onclick = clearWritingCanvas;
   $("writing-fullscreen").onclick = toggleWritingFullscreen;
   document.addEventListener("fullscreenchange", writingFullscreenChanged);
   wireWritingCanvas();
   updateWritingToolState();
   updateWritingHistoryButtons();
}

function updateWritingToolState() {
   const pen = $("writing-pen");
   const eraser = $("writing-eraser");
   if (pen) pen.setAttribute("aria-pressed", String(writingState.tool === "pen"));
   if (eraser)
      eraser.setAttribute("aria-pressed", String(writingState.tool === "eraser"));
}

function updateWritingHistoryButtons() {
   const slot = writingDrawingSlot();
   if ($("writing-undo")) $("writing-undo").disabled = !slot.actions.length;
   if ($("writing-redo")) $("writing-redo").disabled = !slot.redo.length;
}

function undoWritingAction() {
   const slot = writingDrawingSlot();
   if (!slot.actions.length) return;
   slot.redo.push(slot.actions.pop());
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function redoWritingAction() {
   const slot = writingDrawingSlot();
   if (!slot.redo.length) return;
   slot.actions.push(slot.redo.pop());
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function clearWritingCanvas() {
   const slot = writingDrawingSlot();
   if (!slot.actions.length) return;
   slot.actions.push({ type: "clear" });
   slot.redo = [];
   renderWritingCanvas();
   updateWritingHistoryButtons();
}

function writingPoint(event, canvas) {
   const rect = canvas.getBoundingClientRect();
   return {
      x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
      y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height)),
      pressure:
         event.pointerType === "pen" && event.pressure > 0
            ? Math.max(0.35, event.pressure)
            : 1,
   };
}

function wireWritingCanvas() {
   const canvas = $("writing-canvas");
   const surface = $("writing-surface");
   if (!canvas || !surface) return;
   const finish = (event) => {
      if (event.pointerId !== writingPointerId) return;
      writingPointerId = null;
      try {
         canvas.releasePointerCapture(event.pointerId);
      } catch (error) {}
      updateWritingHistoryButtons();
   };
   canvas.addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      event.preventDefault();
      writingPointerId = event.pointerId;
      try {
         canvas.setPointerCapture(event.pointerId);
      } catch (error) {}
      const prefs = writingPreferences();
      const slot = writingDrawingSlot();
      slot.actions.push({
         type: "stroke",
         tool: writingState.tool,
         color: prefs.color,
         width: prefs.width,
         points: [writingPoint(event, canvas)],
      });
      slot.redo = [];
      scheduleWritingCanvasRender();
   });
   canvas.addEventListener("pointermove", (event) => {
      if (event.pointerId !== writingPointerId) return;
      event.preventDefault();
      const slot = writingDrawingSlot();
      const stroke = slot.actions[slot.actions.length - 1];
      if (!stroke || stroke.type !== "stroke") return;
      const coalesced = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
      const events = coalesced.length ? coalesced : [event];
      events.forEach((item) => stroke.points.push(writingPoint(item, canvas)));
      scheduleWritingCanvasRender();
   });
   canvas.addEventListener("pointerup", finish);
   canvas.addEventListener("pointercancel", finish);
   writingResizeObserver = new ResizeObserver(resizeWritingCanvas);
   writingResizeObserver.observe(surface);
   resizeWritingCanvas();
}

function resizeWritingCanvas() {
   const canvas = $("writing-canvas");
   if (!canvas) return;
   const rect = canvas.getBoundingClientRect();
   const ratio = Math.max(1, window.devicePixelRatio || 1);
   const width = Math.max(1, Math.round(rect.width * ratio));
   const height = Math.max(1, Math.round(rect.height * ratio));
   if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
      renderWritingCanvas();
   }
}

function scheduleWritingCanvasRender() {
   if (writingRenderFrame) return;
   writingRenderFrame = requestAnimationFrame(() => {
      writingRenderFrame = 0;
      renderWritingCanvas();
   });
}

function drawWritingStroke(context, canvas, stroke) {
   const points = stroke.points || [];
   if (!points.length) return;
   const ratio = Math.max(1, window.devicePixelRatio || 1);
   const cssWidth = canvas.width / ratio;
   const cssHeight = canvas.height / ratio;
   context.save();
   context.globalCompositeOperation =
      stroke.tool === "eraser" ? "destination-out" : "source-over";
   context.strokeStyle = stroke.tool === "eraser" ? "rgba(0,0,0,1)" : stroke.color;
   context.fillStyle = context.strokeStyle;
   context.lineCap = "round";
   context.lineJoin = "round";
   context.lineWidth = stroke.width * (stroke.tool === "eraser" ? 2.6 : 1);
   if (points.length === 1) {
      const point = points[0];
      context.beginPath();
      context.arc(
         point.x * cssWidth,
         point.y * cssHeight,
         Math.max(0.75, context.lineWidth * point.pressure * 0.5),
         0,
         Math.PI * 2,
      );
      context.fill();
   } else {
      context.beginPath();
      context.moveTo(points[0].x * cssWidth, points[0].y * cssHeight);
      for (let index = 1; index < points.length - 1; index += 1) {
         const point = points[index];
         const next = points[index + 1];
         context.quadraticCurveTo(
            point.x * cssWidth,
            point.y * cssHeight,
            ((point.x + next.x) / 2) * cssWidth,
            ((point.y + next.y) / 2) * cssHeight,
         );
      }
      const last = points[points.length - 1];
      context.lineTo(last.x * cssWidth, last.y * cssHeight);
      context.stroke();
   }
   context.restore();
}

function renderWritingCanvas() {
   const canvas = $("writing-canvas");
   if (!canvas) return;
   const context = canvas.getContext("2d");
   const ratio = Math.max(1, window.devicePixelRatio || 1);
   context.setTransform(ratio, 0, 0, ratio, 0, 0);
   context.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
   writingDrawingSlot().actions.forEach((action) => {
      if (action.type === "clear")
         context.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
      else if (action.type === "stroke") drawWritingStroke(context, canvas, action);
   });
}

async function toggleWritingFullscreen() {
   const workspace = $("writing-workspace");
   if (!workspace) return;
   try {
      if (workspace.classList.contains("writing-fullscreen-fallback")) {
         workspace.classList.remove("writing-fullscreen-fallback");
         document.body.classList.remove("writing-fullscreen-open");
         writingFullscreenChanged();
      } else if (document.fullscreenElement) await document.exitFullscreen();
      else if (workspace.requestFullscreen) await workspace.requestFullscreen();
      else {
         workspace.classList.toggle("writing-fullscreen-fallback");
         document.body.classList.toggle(
            "writing-fullscreen-open",
            workspace.classList.contains("writing-fullscreen-fallback"),
         );
         writingFullscreenChanged();
      }
   } catch (error) {
      workspace.classList.add("writing-fullscreen-fallback");
      document.body.classList.add("writing-fullscreen-open");
      writingFullscreenChanged();
   }
}

function writingFullscreenChanged() {
   const button = $("writing-fullscreen");
   const workspace = $("writing-workspace");
   if (button)
      button.textContent =
         document.fullscreenElement ||
         (workspace && workspace.classList.contains("writing-fullscreen-fallback"))
            ? "Quitter le plein écran"
            : "Plein écran";
   requestAnimationFrame(resizeWritingCanvas);
}

function destroyWritingBoard() {
   if (writingResizeObserver) writingResizeObserver.disconnect();
   writingResizeObserver = null;
   if (writingRenderFrame) cancelAnimationFrame(writingRenderFrame);
   writingRenderFrame = 0;
   writingPointerId = null;
   document.removeEventListener("fullscreenchange", writingFullscreenChanged);
   document.body.classList.remove("writing-fullscreen-open");
}
