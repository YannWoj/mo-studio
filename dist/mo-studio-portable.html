         '<div class="search-empty"><p>Aucune correspondance vérifiée.</p></div>') +
      (srch.visible < response.results.length
         ? '<div class="search-more"><button class="btn ghost" id="dshow-more">Afficher plus</button></div>'
         : "");
   box.querySelectorAll("[data-result-index]").forEach((button) => {
      button.onclick = () => {
         const entry = response.results[Number(button.dataset.resultIndex)].entry;
         const displayHanzi = dictionaryResultDisplayHanzi(entry);
         if (displayHanzi !== entry.simplified) entry.__selectedHanzi = displayHanzi;
         openSearchDictionaryDetail(entry, true);
      };
   });
   box.querySelectorAll("[data-result-variant]").forEach((button) => {
      button.onclick = () => {
         const [resultIndex, variantIndex] = button.dataset.resultVariant.split(":").map(Number);
         const variant = response.results[resultIndex]?.entry.visualVariants?.[variantIndex];
         if (!variant) return;
         openSearchDictionaryDetail({
            ...variant,
            __selectedHanzi: variant.traditional || variant.simplified,
         }, true);
      };
   });
   if ($("dshow-more"))
      $("dshow-more").onclick = () => {
         srch.visible += SEARCH_PAGE_SIZE;
         renderDictionaryResults();
      };
   if ($("btn-seq")) $("btn-seq").onclick = () => openSequence(response.query.characters);
}

function searchSuggestionConfig(options) {
   const settings = options || {};
   const resolveElement = (value, fallbackId) =>
      value && value.nodeType === 1 ? value : $(value || fallbackId);
   return {
      target: resolveElement(settings.target, "dsearch-suggestions"),
      input: resolveElement(settings.input, "dq"),
      state: settings.state || srch,
      idPrefix: settings.idPrefix || "dsearch-option",
      limit: Number.isFinite(settings.limit) ? settings.limit : 6,
      onSelect: settings.onSelect,
      isAlreadyPersonal: settings.isAlreadyPersonal,
      emptyHtml: settings.emptyHtml || "",
   };
}

function renderSearchSuggestions(response, options) {
   const config = searchSuggestionConfig(options);
   const { target, input, state } = config;
   if (!target) return;
   const items = response && response.results ? response.results.slice(0, config.limit) : [];
   state.suggestionSearch = response;
   state.suggestionIndex = -1;
   if (!items.length) {
      target.hidden = !config.emptyHtml;
      target.innerHTML = config.emptyHtml;
      if (input) input.setAttribute("aria-expanded", String(!!config.emptyHtml));
      return items;
   }
   target.innerHTML = items
      .map((item, index) => {
         const definition = dictionaryResultDefinition(item.entry);
         const alreadyPersonal = config.isAlreadyPersonal
            ? config.isAlreadyPersonal(item.entry)
            : !!item.entry.personalCard;
         return (
            '<button id="' + esc(config.idPrefix) + "-" + index + '" role="option" aria-selected="false" data-suggestion-index="' + index + '"><b>' +
            esc(item.entry.simplified) + '</b><span>' + colorPinyin(dictionaryEntryPinyinText(item.entry)) +
            '</span><small>' + (item.entry.entryType === "character" ? "caractère" : "mot") +
            " · " + (definition.english ? "EN · " : "") + esc(definition.text) +
            (alreadyPersonal ? '<em class="dictionary-suggestion-personal">Déjà dans Mes mots</em>' : "") +
            "</small></button>"
         );
      })
      .join("");
   target.hidden = false;
   if (input) input.setAttribute("aria-expanded", "true");
   target.querySelectorAll("[data-suggestion-index]").forEach((button) => {
      button.onclick = () => {
         const entry = items[Number(button.dataset.suggestionIndex)].entry;
         if (config.onSelect) config.onSelect(entry);
         else launchDictionarySearch(entry.simplified);
      };
   });
   return items;
}

function moveSearchSuggestion(direction, options) {
   const config = searchSuggestionConfig(options);
   const { target, input, state } = config;
   const optionElements = target ? Array.from(target.querySelectorAll("[data-suggestion-index]")) : [];
   if (!optionElements.length) return false;
   state.suggestionIndex = (state.suggestionIndex + direction + optionElements.length) % optionElements.length;
   optionElements.forEach((option, index) => option.setAttribute("aria-selected", String(index === state.suggestionIndex)));
   if (input) input.setAttribute("aria-activedescendant", optionElements[state.suggestionIndex].id);
   optionElements[state.suggestionIndex].scrollIntoView({ block: "nearest" });
   return true;
}

function closeSearchSuggestions(options) {
   const config = searchSuggestionConfig(options);
   const { target, input, state } = config;
   if (target) target.hidden = true;
   if (input) {
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
   }
   state.suggestionIndex = -1;
}

function cleanupSearchView() {
   clearTimeout(dsearchTimer);
   dsearchTimer = null;
   if (searchOutsideHandler) {
      document.removeEventListener("pointerdown", searchOutsideHandler);
      searchOutsideHandler = null;
   }
}

async function updateSearchSuggestions() {
   const input = $("dq");
   if (!input) return;
   srch.q = input.value;
   $("dq-clear").hidden = !input.value;
   const query = classifySearchQuery(input.value);
   if (!query.valid) return closeSearchSuggestions();
   const expected = input.value;
   $("dsearch-state").textContent = "Préparation du dictionnaire…";
   try {
      const response = await searchDictionary(expected, { limit: 6, candidateLimit: 18 });
      if (!$("dq") || $("dq").value !== expected) return;
      renderSearchSuggestions(response);
      $("dsearch-state").textContent = "";
   } catch (error) {
      if (error instanceof StaleDictionarySearchError) return;
      if ($("dsearch-state")) $("dsearch-state").textContent = "Dictionnaire indisponible.";
   }
}

function searchHistoryPayload(mode, entryId) {
   return {
      moStudioSearch: true,
      mode,
      q: srch.q,
      entryId: entryId || null,
      scrollY: mode === "detail" ? window.scrollY : srch.scrollY || 0,
   };
}

function writeSearchHistory(mode, entryId, replace) {
   const payload = searchHistoryPayload(mode, entryId);
   if (replace) history.replaceState(payload, "");
   else history.pushState(payload, "");
}

async function launchDictionarySearch(value, options) {
   const settings = options || {};
   clearTimeout(dsearchTimer);
   dsearchTimer = null;
   const input = $("dq");
   srch.q = value != null ? String(value) : input ? input.value : srch.q;
   srch.mode = "results";
   srch.visible = SEARCH_PAGE_SIZE;
   srch.search = null;
   closeSearchSuggestions();
   if (input) input.value = srch.q;
   if (!settings.fromHistory) writeSearchHistory("results", null, false);
   const box = $("dresults");
   if (box)
      box.innerHTML = '<div class="dictionary-loading" role="status" aria-live="polite"><span class="ink-loader" aria-hidden="true"></span><b>Préparation du dictionnaire…</b><span id="dictionary-loading-detail">Chargement de l’index nécessaire.</span></div>';
   const statusTarget = () => $("dictionary-loading-detail");
   try {
      const response = await searchDictionary(srch.q, {
         limit: SEARCH_RESULT_LIMIT,
         onStatus: (message) => {
            const target = statusTarget();
            if (target) target.textContent = message;
         },
      });
      try {
         await mergeHskSearchResults(response, srch.q);
      } catch (hskError) {
         response.hskError = hskError.message;
      }
      mergeDictionaryVisualResults(response);
      srch.search = response;
      srch.mode = "results";
      if (response.query.valid) rememberRecentSearch(srch.q);
      renderDictionaryResults();
      requestAnimationFrame(() => window.scrollTo(0, settings.scrollY || 0));
      if (srch.pendingDetailId) {
         const entryId = srch.pendingDetailId;
         srch.pendingDetailId = null;
          const entry = await loadHskSearchDetailEntry(entryId);
         if (entry) openSearchDictionaryDetail(entry, false);
      }
   } catch (error) {
      if (error instanceof StaleDictionarySearchError) return;
      if (box)
         box.innerHTML =
            '<div class="search-empty error" role="alert"><b>Le dictionnaire n’a pas pu être chargé.</b><p>' +
            esc(error.message) + '</p><button class="btn" id="dsearch-retry">Réessayer</button></div>';
      if ($("dsearch-retry")) $("dsearch-retry").onclick = () => launchDictionarySearch(srch.q, { fromHistory: true });
   }
}

async function openSearchDictionaryDetail(entry, pushHistory) {
   srch.scrollY = window.scrollY;
   if (pushHistory) {
      writeSearchHistory("results", null, true);
      writeSearchHistory("detail", entry.id, false);
   }
   srch.mode = "detail";
   const selectedHanzi = entry.__selectedHanzi || "";
   const visualGroup = Array.isArray(entry.visualGroup) ? entry.visualGroup.slice() : [];
   if (entry.__preview) {
      openSheet(
         '<div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de la fiche complète…</b></div>',
      );
      try {
         entry = (await loadHskSearchDetailEntry(entry.id)) || entry;
         if (selectedHanzi) entry.__selectedHanzi = selectedHanzi;
         if (visualGroup.length > 1) {
            const grouped = (await Promise.all(
               visualGroup.filter((id) => id !== entry.id).map((id) => loadHskSearchDetailEntry(id)),
            )).filter(Boolean);
            const primaryMeanings = new Set(
               [...(entry.definitionsFr || []), ...(entry.definitionsEn || [])].map(normalizeTranslation),
            );
            if (!(entry.definitionsFr || []).length) {
               entry.definitionsFr = grouped
                  .flatMap((item) => item.definitionsFr || [])
                  .filter((definition) => primaryMeanings.has(normalizeTranslation(definition)));
            }
            entry.sources = Array.from(new Set([...(entry.sources || []), ...grouped.flatMap((item) => item.sources || [])]));
            entry.sourceRefs = [...(entry.sourceRefs || []), ...grouped.flatMap((item) => item.sourceRefs || [])];
            entry.visualGroup = visualGroup;
            entry.visualEntryTypes = Array.from(new Set([entry.entryType, ...grouped.map((item) => item.entryType)]));
         }
      } catch (error) {
         closeSheet();
         toast("Fiche détaillée indisponible hors ligne.");
         return;
      }
   }
   try {
      entry = await dictionaryEntryWithFrenchSibling(entry);
   } catch (error) {
      /* La fiche conserve son repli anglais si la résolution sœur échoue hors ligne. */
   }
   openDictDetail(attachHskMetadata(entry), { fromSearch: true });
}

function closeSearchDictionaryDetail() {
   if (history.state && history.state.moStudioSearch && history.state.mode === "detail")
      history.back();
   else {
      closeSheet();
      srch.mode = "results";
      requestAnimationFrame(() => window.scrollTo(0, srch.scrollY || 0));
   }
}

function restoreSearchHistory(state) {
   cancelDictionarySearches();
   closeSheet();
   activeView = "search";
   srch.q = state.q || "";
   srch.mode = state.mode || (srch.q ? "results" : "landing");
   srch.scrollY = Number(state.scrollY) || 0;
   srch.pendingDetailId = state.mode === "detail" ? state.entryId : null;
   document.querySelectorAll(".nav button").forEach((button) =>
      button.setAttribute("aria-pressed", String(button.dataset.view === "search")),
   );
   if (state.mode === "sequence") {
      openSequence(Array.from(state.characters || ""), {
         fromHistory: true,
         index: state.sequenceIndex,
         strokeTab: state.strokeTab,
      });
      return;
   }
   if (state.mode === "radical") {
      srch.mode = srch.q ? "results" : "landing";
      renderSearch();
      if (state.radical) selectRadical(state.radical, { fromHistory: true });
      else openRadicalMode({ fromHistory: true });
      return;
   }
   renderSearch();
   if (srch.mode === "landing") return;
   if (srch.search && srch.search.query.display === normalizeVisibleWhitespace(srch.q)) {
      renderDictionaryResults();
      requestAnimationFrame(() => window.scrollTo(0, srch.scrollY));
      if (srch.pendingDetailId)
         loadHskSearchDetailEntry(srch.pendingDetailId).then((entry) => {
            srch.pendingDetailId = null;
            if (entry) openSearchDictionaryDetail(entry, false);
         });
   } else launchDictionarySearch(srch.q, { fromHistory: true, scrollY: srch.scrollY });
}

function renderSearch() {
   document.body.classList.remove("in-seq");
   radicalBrowser.active = false;
   radicalBrowser.radical = null;
   const root = $("view");
   root.innerHTML =
      '<section class="card pad search-page"><header class="search-hero"><h2 class="v-t">查 · Rechercher</h2>' +
      '<p class="muted">Trouve un caractère, un mot, un pinyin ou une traduction.</p>' +
      '<div class="search-mode-bar"><button type="button" class="chip search-mode-toggle" id="search-mode-toggle" aria-pressed="false">' +
      '<b lang="zh-Hans">部</b> Clés</button></div></header>' +
      '<div id="dsearch-normal">' +
      '<form class="dictionary-search-form" id="dsearch-form"><div class="dictionary-search-input">' +
      '<input class="search" id="dq" placeholder="汉字, pinyin ou français…" value="' + esc(srch.q) +
      '" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="dsearch-suggestions" aria-expanded="false">' +
      '<button type="button" class="search-clear" id="dq-clear" aria-label="Effacer"' + (srch.q ? "" : " hidden") + '>×</button>' +
      '<div class="dictionary-suggestions" id="dsearch-suggestions" role="listbox" hidden></div></div>' +
      '<button class="btn primary search-submit" type="submit">Rechercher</button></form>' +
      '<div class="search-live-state" id="dsearch-state" role="status" aria-live="polite"></div>' +
      '<div id="dresults"></div></div>' +
      '<div id="dradical-panel" hidden></div></section>';

   $("search-mode-toggle").onclick = () => {
      if (radicalBrowser.active) exitRadicalMode();
      else openRadicalMode();
   };

   const input = $("dq");
   $("dsearch-form").onsubmit = (event) => {
      event.preventDefault();
      if (srch.suggestionIndex >= 0 && srch.suggestionSearch) {
         const item = srch.suggestionSearch.results[srch.suggestionIndex];
         if (item) return launchDictionarySearch(item.entry.simplified);
      }
      launchDictionarySearch(input.value);
   };
   input.oninput = () => {
      srch.q = input.value;
      clearTimeout(dsearchTimer);
      dsearchTimer = setTimeout(updateSearchSuggestions, SEARCH_DEBOUNCE_MS);
      $("dq-clear").hidden = !input.value;
   };
   input.onkeydown = (event) => {
      if (event.key === "ArrowDown" && moveSearchSuggestion(1)) event.preventDefault();
      else if (event.key === "ArrowUp" && moveSearchSuggestion(-1)) event.preventDefault();
      else if (event.key === "Escape") closeSearchSuggestions();
   };
   input.onfocus = () => {
      if (srch.suggestionSearch && srch.suggestionSearch.results.length) {
         $("dsearch-suggestions").hidden = false;
         input.setAttribute("aria-expanded", "true");
      }
   };
   $("dq-clear").onclick = () => {
      cancelDictionarySearches();
      input.value = "";
      srch.q = "";
      srch.mode = "landing";
      srch.search = null;
      $("dq-clear").hidden = true;
      closeSearchSuggestions();
      renderDictionaryResults();
      input.focus();
   };
   if (searchOutsideHandler) document.removeEventListener("pointerdown", searchOutsideHandler);
   searchOutsideHandler = (event) => {
      if (!event.target.closest(".dictionary-search-input")) closeSearchSuggestions();
   };
   document.addEventListener("pointerdown", searchOutsideHandler);

   if (["results", "detail"].includes(srch.mode) && srch.search) renderDictionaryResults();
   else if (["results", "detail"].includes(srch.mode) && srch.q)
      launchDictionarySearch(srch.q, { fromHistory: true, scrollY: srch.scrollY });
   else {
      srch.mode = "landing";
      srch.search = null;
      renderDictionaryResults();
   }
}

"use strict";

const STROKE_DATA_VERSION = "2.0.1";
const STROKE_DATA_CACHE_NAME = "mo-studio-strokes-v1";
const STROKE_DATA_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable ? "../data/generated/hanzi-writer/2.0.1/" : "data/generated/hanzi-writer/2.0.1/",
      document.baseURI,
   ).href;
})();
const strokeCharacterCache = new Map();
const strokeCharacterPending = new Map();

class StrokeCharacterDataError extends Error {
   constructor(character, message, cause) {
      super(`${character} · ${message}`);
      this.name = "StrokeCharacterDataError";
      this.character = character;
      this.cause = cause;
   }
}

function validateStrokeCharacter(character) {
   const value = String(character || "").normalize("NFC");
   if (Array.from(value).length !== 1 || !/^\p{Script=Han}$/u.test(value)) {
      throw new StrokeCharacterDataError(value || "?", "caractère Han invalide");
   }
   return value;
}

function normalizeStrokeCharacterData(character, raw) {
   if (!raw || !Array.isArray(raw.strokes) || !raw.strokes.length) {
      throw new StrokeCharacterDataError(character, "aucun tracé réel disponible");
   }
   if (raw.strokes.some((path) => typeof path !== "string" || !path.trim())) {
      throw new StrokeCharacterDataError(character, "tracé SVG invalide");
   }
   const medians = Array.isArray(raw.medians) ? raw.medians : [];
   if (medians.length && medians.length !== raw.strokes.length) {
      throw new StrokeCharacterDataError(character, "nombre de médianes incohérent");
   }
   return Object.freeze({
      character,
      strokes: Object.freeze(raw.strokes.slice()),
      medians: Object.freeze(medians.map((median) => Object.freeze(median.slice()))),
      strokeCount: raw.strokes.length,
      radicalStrokeIndexes: Object.freeze(
         Array.isArray(raw.radStrokes) ? raw.radStrokes.slice() : [],
      ),
      sourcePackage: "hanzi-writer-data",
      sourceVersion: STROKE_DATA_VERSION,
   });
}

function strokeCharacterDataUrl(character) {
   return new URL(`${encodeURIComponent(character)}.json`, STROKE_DATA_ROOT).href;
}

async function fetchStrokeCharacterData(character, reload) {
   const url = strokeCharacterDataUrl(character);
   const cache = "caches" in globalThis
      ? await caches.open(STROKE_DATA_CACHE_NAME)
      : null;
   let response = !reload && cache ? await cache.match(url) : null;
   let fromCache = !!response;
   if (!response) {
      response = await fetch(url, { cache: reload ? "reload" : "default" });
      fromCache = false;
   }
   if (!response.ok) {
      throw new StrokeCharacterDataError(
         character,
         response.status === 404 ? "données de traits indisponibles" : `HTTP ${response.status}`,
      );
   }
   let raw;
   try {
      raw = await response.clone().json();
   } catch (error) {
      if (fromCache && cache) {
         await cache.delete(url);
         return fetchStrokeCharacterData(character, true);
      }
      throw new StrokeCharacterDataError(character, "JSON de traits corrompu", error);
   }
   let normalized;
   try {
      normalized = normalizeStrokeCharacterData(character, raw);
   } catch (error) {
      if (fromCache && cache) {
         await cache.delete(url);
         return fetchStrokeCharacterData(character, true);
      }
      throw error;
   }
   if (cache && !fromCache) await cache.put(url, response.clone());
   return normalized;
}

function loadStrokeCharacterData(character, options) {
   const value = validateStrokeCharacter(character);
   const reload = !!(options && options.reload);
   if (!reload && strokeCharacterCache.has(value)) {
      return Promise.resolve(strokeCharacterCache.get(value));
   }
   if (!reload && strokeCharacterPending.has(value)) {
      return strokeCharacterPending.get(value);
   }
   const request = fetchStrokeCharacterData(value, reload)
      .then((data) => {
         strokeCharacterCache.set(value, data);
         return data;
      })
      .catch((error) => {
         if (error instanceof StrokeCharacterDataError) throw error;
         throw new StrokeCharacterDataError(value, "chargement impossible", error);
      })
      .finally(() => strokeCharacterPending.delete(value));
   strokeCharacterPending.set(value, request);
   return request;
}

function preloadStrokeCharacterData(character) {
   return loadStrokeCharacterData(character).catch(() => null);
}

async function invalidateStrokeCharacterData(character) {
   const cache = "caches" in globalThis
      ? await caches.open(STROKE_DATA_CACHE_NAME)
      : null;
   if (character) {
      const value = validateStrokeCharacter(character);
      strokeCharacterCache.delete(value);
      strokeCharacterPending.delete(value);
      if (cache) await cache.delete(strokeCharacterDataUrl(value));
      return;
   }
   strokeCharacterCache.clear();
   strokeCharacterPending.clear();
   if ("caches" in globalThis) await caches.delete(STROKE_DATA_CACHE_NAME);
}

"use strict";

const CHARACTER_COMPOSITION_CHUNK_MODULO = 64;
const CHARACTER_COMPOSITION_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable
         ? "../data/generated/character-composition/"
         : "data/generated/character-composition/",
      document.baseURI,
   ).href;
})();
const characterCompositionCache = new Map();
const characterCompositionChunkCache = new Map();
const characterCompositionChunkPending = new Map();
let characterCompositionManifestPending = null;
let characterCompositionUnavailable = false;

function compositionChunkKey(character) {
   return ((character.codePointAt(0) || 0) % CHARACTER_COMPOSITION_CHUNK_MODULO)
      .toString(16)
      .padStart(2, "0");
}

function compositionCharacters(values) {
   return Array.from(
      new Set(
         (Array.isArray(values) ? values : [values])
            .flatMap((value) => Array.from(String(value || "").normalize("NFC")))
            .filter((character) => /^\p{Script=Han}$/u.test(character)),
      ),
   );
}

async function loadCharacterCompositionManifest() {
   if (characterCompositionUnavailable) return null;
   if (characterCompositionManifestPending) return characterCompositionManifestPending;
   characterCompositionManifestPending = fetch(
      new URL("manifest.json", CHARACTER_COMPOSITION_ROOT).href,
      { cache: "default" },
   )
      .then(async (response) => {
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const manifest = await response.json();
         if (
            manifest?.format !== "mo-studio-character-composition" ||
            manifest.schemaVersion !== 1 ||
            manifest.chunkModulo !== CHARACTER_COMPOSITION_CHUNK_MODULO
         ) throw new Error("Manifest de composition incompatible");
         return Object.freeze(manifest);
      })
      .catch(() => {
         characterCompositionUnavailable = true;
         return null;
      });
   return characterCompositionManifestPending;
}

function normalizeCompositionRecord(character, raw) {
   if (!raw || raw.character !== character || !raw.radical) return null;
   const hasIdentifiedComponent = (node) => {
      if (!node || node.u === true) return false;
      if (typeof node.c === "string") return node.c !== "？";
      return Array.isArray(node.c) && node.c.some(hasIdentifiedComponent);
   };
   const hasUsableComposition = hasIdentifiedComponent(raw.tree);
   const etymology = raw.etymology && typeof raw.etymology === "object"
      ? raw.etymology
      : null;
   const hasOriginHint = typeof etymology?.hint === "string" && etymology.hint.trim();
   if (!hasUsableComposition && !hasOriginHint) return null;
   if (
      hasUsableComposition &&
      (!raw.decomposition || raw.decomposition === "？")
   ) return null;
   return Object.freeze({
      character,
      decomposition: raw.decomposition,
      tree: hasUsableComposition ? raw.tree : null,
      radical: raw.radical,
      components: raw.components && typeof raw.components === "object" ? raw.components : {},
      etymology,
      sourceLine: Number.isInteger(raw.sourceLine) ? raw.sourceLine : null,
   });
}

async function loadCharacterCompositionChunk(key, manifest) {
   if (characterCompositionChunkCache.has(key)) return characterCompositionChunkCache.get(key);
   if (characterCompositionChunkPending.has(key)) return characterCompositionChunkPending.get(key);
   const declared = manifest.chunks.find((chunk) => chunk.key === key);
   if (!declared) return {};
   const request = fetch(new URL(declared.path, CHARACTER_COMPOSITION_ROOT).href, {
      cache: "default",
   })
      .then(async (response) => {
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const chunk = await response.json();
         if (!chunk || typeof chunk !== "object" || Array.isArray(chunk))
            throw new Error("Chunk de composition invalide");
         characterCompositionChunkCache.set(key, chunk);
         return chunk;
      })
      .catch(() => ({}))
      .finally(() => characterCompositionChunkPending.delete(key));
   characterCompositionChunkPending.set(key, request);
   return request;
}

async function loadCharacterCompositions(values) {
   const characters = compositionCharacters(values);
   const result = new Map();
   const unresolved = characters.filter((character) => {
      if (!characterCompositionCache.has(character)) return true;
      result.set(character, characterCompositionCache.get(character));
      return false;
   });
   if (!unresolved.length) return result;
   const manifest = await loadCharacterCompositionManifest();
   if (!manifest) {
      unresolved.forEach((character) => {
         characterCompositionCache.set(character, null);
         result.set(character, null);
      });
      return result;
   }

   const charactersByChunk = new Map();
   unresolved.forEach((character) => {
      const key = compositionChunkKey(character);
      if (!charactersByChunk.has(key)) charactersByChunk.set(key, []);
      charactersByChunk.get(key).push(character);
   });
   await Promise.all(
      Array.from(charactersByChunk, async ([key, chunkCharacters]) => {
         const chunk = await loadCharacterCompositionChunk(key, manifest);
         chunkCharacters.forEach((character) => {
            const record = normalizeCompositionRecord(character, chunk[character]);
            characterCompositionCache.set(character, record);
            result.set(character, record);
         });
      }),
   );
   return result;
}

function preloadCharacterCompositions(values) {
   return loadCharacterCompositions(values).catch(() => new Map());
}

"use strict";

const CHARACTER_RADICALS_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable ? "../data/generated/character-radicals/" : "data/generated/character-radicals/",
      document.baseURI,
   ).href;
})();

const radicalChunkCache = new Map();
const radicalChunkPending = new Map();
let radicalsManifestPending = null;
let radicalsUnavailable = false;

async function loadRadicalsManifest() {
   if (radicalsUnavailable) return null;
   if (radicalsManifestPending) return radicalsManifestPending;
   radicalsManifestPending = fetch(new URL("manifest.json", CHARACTER_RADICALS_ROOT).href, {
      cache: "default",
   })
      .then(async (response) => {
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const manifest = await response.json();
         if (
            manifest?.format !== "mo-studio-character-radicals" ||
            manifest.schemaVersion !== 1 ||
            !Array.isArray(manifest.radicals)
         ) throw new Error("Manifeste des clés incompatible");
         return Object.freeze(manifest);
      })
      .catch(() => {
         radicalsUnavailable = true;
         return null;
      });
   return radicalsManifestPending;
}

async function loadRadicalCatalog() {
   const manifest = await loadRadicalsManifest();
   return manifest ? manifest.radicals : [];
}

async function loadRadicalCharacters(radical) {
   if (radicalChunkCache.has(radical)) return radicalChunkCache.get(radical);
   if (radicalChunkPending.has(radical)) return radicalChunkPending.get(radical);
   const request = (async () => {
      const manifest = await loadRadicalsManifest();
      const declared = manifest && manifest.radicals.find((row) => row.radical === radical);
      if (!declared) return { radical, characters: [] };
      try {
         const response = await fetch(new URL(declared.path, CHARACTER_RADICALS_ROOT).href, {
            cache: "default",
         });
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const chunk = await response.json();
         if (!chunk || chunk.radical !== radical || !Array.isArray(chunk.characters))
            throw new Error("Chunk de clé invalide");
         const frozen = Object.freeze({ radical, characters: Object.freeze(chunk.characters) });
         radicalChunkCache.set(radical, frozen);
         return frozen;
      } catch (error) {
         return { radical, characters: [] };
      }
   })().finally(() => radicalChunkPending.delete(radical));
   radicalChunkPending.set(radical, request);
   return request;
}

"use strict";

const CHARACTER_COMPOSITION_REVISION = "bddc96d41bef78427ed0e034e9f7e31d71fd1b92";

// Le nom français écrit à la main (data/source/character-components-fr.json,
// fusionné au build) prime sur la définition anglaise de Make Me a Hanzi. La clé
// n'est pas toujours une feuille de l'arbre : elle porte son propre nom.
function compositionComponentFr(character, record) {
   return (
      record.components?.[character]?.definitionFr ||
      (record.radical === character ? record.radicalFr : "") ||
      ""
   );
}

function compositionComponentHtml(character, record, extraClass, definitionOverride) {
   const component = record.components?.[character] || {};
   const definition = definitionOverride === undefined
      ? compositionComponentFr(character, record) || component.definition || ""
      : definitionOverride || "";
   const pinyin = Array.isArray(component.pinyin) ? component.pinyin.filter(Boolean).join(", ") : "";
   const title = [character, pinyin, definition].filter(Boolean).join(" · ");
   return (
      '<button type="button" class="composition-component' +
      (extraClass ? " " + extraClass : "") +
      '" data-composition-character="' + esc(character) + '"' +
      (title ? ' title="' + esc(title) + '"' : "") + ">" +
      '<b lang="zh-Hans">' + esc(character) + "</b>" +
      (definition ? "<small>" + esc(definition) + "</small>" : "") +
      "</button>"
   );
}

function compositionTreeHtml(node, record, nested) {
   if (node?.u === true)
      return '<span class="composition-unknown" aria-label="Composant non identifié"><span aria-hidden="true">?</span></span>';
   if (node?.c && typeof node.c === "string")
      return compositionComponentHtml(node.c, record, "");
   if (!node || !Array.isArray(node.c) || !node.c.length) return "";
   const children = node.c.map((child) => compositionTreeHtml(child, record, true));
   const content = children.join('<span class="composition-plus" aria-hidden="true">+</span>');
   return nested
      ? '<span class="composition-group"><span aria-hidden="true">(</span>' + content + '<span aria-hidden="true">)</span></span>'
      : content;
}

function compositionRoleHtml(character, role, record, useDefinition) {
   if (!character || character === "？") return "";
   const roleDefinition = useDefinition
      ? compositionComponentFr(character, record) || record.components?.[character]?.definition || ""
      : "";
   const value = Array.from(character).length === 1 && /^\p{Script=Han}$/u.test(character)
      ? compositionComponentHtml(
           character,
           record,
           "composition-role-component",
           roleDefinition,
        )
      : '<b class="composition-role-text">' + esc(character) + "</b>";
   return '<span class="composition-role">' + value + '<span aria-hidden="true">→</span><em>' + role + "</em></span>";
}

function compositionOriginHtml(record) {
   const english = record.etymology?.hint || "";
   if (!english) return "";
   const french = record.etymology?.hintFr || "";
   const value = french || english;
   return (
      '<div class="composition-origin"><span class="eyebrow">Origine du dessin</span>' +
      (french ? "" : '<span class="search-fallback">anglais</span>') +
      '<span class="composition-origin-text" lang="' + (french ? "fr" : "en") +
      '" title="' + esc(value) + '">' + esc(value) + "</span></div>"
   );
}

function characterCompositionShellHtml(extraClass) {
   return (
      '<section class="character-composition is-loading' +
      (extraClass ? " " + extraClass : "") +
      '" aria-label="Composition et origine du caractère" aria-busy="true">' +
      '<span class="sr-only">Chargement de la composition</span></section>'
   );
}

function characterCompositionHtml(record) {
   if (!record) return "";
   const hasComposition = Boolean(record.tree);
   const pictophonetic = record.etymology?.type === "pictophonetic";
   const roles = hasComposition && pictophonetic
      ? [
           compositionRoleHtml(record.etymology.semantic, "sens", record, true),
           compositionRoleHtml(record.etymology.phonetic, "son", record, false),
        ].filter(Boolean)
      : [];
   const sourceTitle =
      "Source : Make Me a Hanzi dictionary.txt · LGPL v3+ · révision " +
      CHARACTER_COMPOSITION_REVISION +
      (record.sourceLine ? " · ligne " + record.sourceLine : "");
   return (
      (hasComposition
         ? '<div class="composition-primary"><span class="eyebrow">Composition</span>' +
           '<span class="composition-formula">' + compositionTreeHtml(record.tree, record, false) + "</span></div>"
         : "") +
      compositionOriginHtml(record) +
      (hasComposition
         ? '<div class="composition-secondary">' +
           (roles.length ? '<span class="composition-roles">' + roles.join('<span class="composition-dot" aria-hidden="true">·</span>') + "</span>" : "") +
           '<span class="cd-cat composition-radical"><span>Clé</span>' +
           compositionComponentHtml(record.radical, record, "composition-radical-character") +
           "</span>" +
           '<abbr class="composition-source" title="' + esc(sourceTitle) + '">MMH</abbr></div>'
         : "")
   );
}

function setCharacterCompositionLoading(character, selector) {
   document.querySelectorAll(selector || ".character-composition").forEach((target) => {
      target.hidden = false;
      target.classList.add("is-loading");
      target.classList.remove("is-hint-only");
      target.setAttribute("aria-busy", "true");
      target.dataset.character = character;
      target.innerHTML = '<span class="sr-only">Chargement de la composition de ' + esc(character) + "</span>";
   });
}

function renderCharacterComposition(record, selector) {
   document.querySelectorAll(selector || ".character-composition").forEach((target) => {
      target.classList.remove("is-loading");
      target.setAttribute("aria-busy", "false");
      if (!record) {
         target.hidden = true;
         target.classList.remove("is-hint-only");
         target.innerHTML = "";
         return;
      }
      target.hidden = false;
      target.classList.toggle("is-hint-only", !record.tree);
      target.dataset.character = record.character;
      target.innerHTML = characterCompositionHtml(record);
      target.querySelectorAll("[data-composition-character]").forEach((button) => {
         button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            openCompositionCharacter(button.dataset.compositionCharacter);
         };
      });
   });
}

async function openCompositionCharacter(character) {
   if (!character || !/^\p{Script=Han}$/u.test(character)) return;
   let entry = null;
   try {
      if (typeof findDictionaryEntryByHanzi === "function")
         entry = await findDictionaryEntryByHanzi(character);
   } catch (error) {
      entry = null;
   }
   entry ||= typeof normalizeDetailEntry === "function"
      ? normalizeDetailEntry({ hz: character })
      : null;
   if (!entry) return;
   if (
      typeof openSearchDictionaryDetail === "function" &&
      typeof activeView !== "undefined" &&
      activeView === "search"
   ) openSearchDictionaryDetail(entry, true);
   else if (typeof openDictDetail === "function") openDictDetail(entry);
}

"use strict";

const CONFUSABLE_PAIRS_CHUNK_MODULO = 64;
const CONFUSABLE_PAIRS_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable
         ? "../data/generated/confusable-pairs/"
         : "data/generated/confusable-pairs/",
      document.baseURI,
   ).href;
})();
const confusablePairsCache = new Map();
const confusablePairsChunkCache = new Map();
const confusablePairsChunkPending = new Map();
let confusablePairsManifestPending = null;
let confusablePairsUnavailable = false;

function confusablePairsChunkKey(character) {
   return ((character.codePointAt(0) || 0) % CONFUSABLE_PAIRS_CHUNK_MODULO)
      .toString(16)
      .padStart(2, "0");
}

function confusablePairsCharacters(values) {
   return Array.from(
      new Set(
         (Array.isArray(values) ? values : [values])
            .flatMap((value) => Array.from(String(value || "").normalize("NFC")))
            .filter((character) => /^\p{Script=Han}$/u.test(character)),
      ),
   );
}

async function loadConfusablePairsManifest() {
   if (confusablePairsUnavailable) return null;
   if (confusablePairsManifestPending) return confusablePairsManifestPending;
   confusablePairsManifestPending = fetch(
      new URL("manifest.json", CONFUSABLE_PAIRS_ROOT).href,
      { cache: "default" },
   )
      .then(async (response) => {
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const manifest = await response.json();
         if (
            manifest?.format !== "mo-studio-confusable-pairs" ||
            manifest.schemaVersion !== 1 ||
            manifest.chunkModulo !== CONFUSABLE_PAIRS_CHUNK_MODULO
         ) throw new Error("Manifest de paires confusables incompatible");
         return Object.freeze(manifest);
      })
      .catch(() => {
         confusablePairsUnavailable = true;
         return null;
      });
   return confusablePairsManifestPending;
}

function normalizeConfusablePairsRecord(character, rawPartners) {
   if (!Array.isArray(rawPartners) || !rawPartners.length) return null;
   const partners = rawPartners
      .filter((partner) => partner && typeof partner.character === "string")
      .map((partner) =>
         Object.freeze({
            character: partner.character,
            structural: partner.structural === true,
            geometricScore: typeof partner.geometricScore === "number" ? partner.geometricScore : null,
            activeTier: partner.activeTier === true,
            diffStrokeIndex: Number.isInteger(partner.diffStrokeIndex) ? partner.diffStrokeIndex : null,
         }),
      );
   if (!partners.length) return null;
   return Object.freeze({ character, partners: Object.freeze(partners) });
}

async function loadConfusablePairsChunk(key, manifest) {
   if (confusablePairsChunkCache.has(key)) return confusablePairsChunkCache.get(key);
   if (confusablePairsChunkPending.has(key)) return confusablePairsChunkPending.get(key);
   const declared = manifest.chunks.find((chunk) => chunk.key === key);
   if (!declared) return {};
   const request = fetch(new URL(declared.path, CONFUSABLE_PAIRS_ROOT).href, {
      cache: "default",
   })
      .then(async (response) => {
         if (!response.ok) throw new Error(`HTTP ${response.status}`);
         const chunk = await response.json();
         if (!chunk || typeof chunk !== "object" || Array.isArray(chunk))
            throw new Error("Chunk de paires confusables invalide");
         confusablePairsChunkCache.set(key, chunk);
         return chunk;
      })
      .catch(() => ({}))
      .finally(() => confusablePairsChunkPending.delete(key));
   confusablePairsChunkPending.set(key, request);
   return request;
}

async function loadConfusablePairs(values) {
   const characters = confusablePairsCharacters(values);
   const result = new Map();
   const unresolved = characters.filter((character) => {
      if (!confusablePairsCache.has(character)) return true;
      result.set(character, confusablePairsCache.get(character));
      return false;
   });
   if (!unresolved.length) return result;
   const manifest = await loadConfusablePairsManifest();
   if (!manifest) {
      unresolved.forEach((character) => {
         confusablePairsCache.set(character, null);
         result.set(character, null);
      });
      return result;
   }

   const charactersByChunk = new Map();
   unresolved.forEach((character) => {
      const key = confusablePairsChunkKey(character);
      if (!charactersByChunk.has(key)) charactersByChunk.set(key, []);
      charactersByChunk.get(key).push(character);
   });
   await Promise.all(
      Array.from(charactersByChunk, async ([key, chunkCharacters]) => {
         const chunk = await loadConfusablePairsChunk(key, manifest);
         chunkCharacters.forEach((character) => {
            const record = normalizeConfusablePairsRecord(character, chunk[character]);
            confusablePairsCache.set(character, record);
            result.set(character, record);
         });
      }),
   );
   return result;
}

function preloadConfusablePairs(values) {
   return loadConfusablePairs(values).catch(() => new Map());
}

// Lecture synchrone du cache déjà chargé (préchargé par preloadConfusablePairs),
// pour les points d'appel qui ne peuvent pas attendre une promesse — notamment le
// gestionnaire de notation en révision. undefined = pas encore chargé (à traiter
// comme non éligible, jamais comme "pas de partenaire") ; null = confirmé sans
// partenaire ; sinon l'enregistrement.
function confusablePairsCached(character) {
   return confusablePairsCache.has(character) ? confusablePairsCache.get(character) : undefined;
}

const CONFUSABLE_PAIRS_DISPLAY_LIMIT = 2; // jamais plus de 2 partenaires affichés, quel que soit le nombre réel dans l'index
const CONFUSABLE_PAIR_MINI_SETTINGS = { showGrid: false, showFuture: true, highlightRadical: false };

function confusablePairsShellHtml() {

function confusablePairMiniSvg(strokeCharacterData, diffIndex, labelledBy) {

   return strokePanelSvg(strokeCharacterData, diffIndex, CONFUSABLE_PAIR_MINI_SETTINGS, labelledBy);

function confusablePairItemHtml(character, item, strokeData, index) {
   const partnerCharacter = item.partner.character;
   const labelId = "confusable-pair-label-" + index;
   const selfSvg = confusablePairMiniSvg(strokeData.get(character), item.selfDiffIndex, labelId);
   const partnerSvg = confusablePairMiniSvg(strokeData.get(partnerCharacter), item.partnerDiffIndex, labelId);
   const hasDiagram = Boolean(selfSvg && partnerSvg);
   return (
      '<div class="confusable-pair-item">' +

         ? '<span class="confusable-pair-mini" aria-hidden="true">' + selfSvg + "</span>" +
           '<span class="confusable-pair-versus" aria-hidden="true">≠</span>'
         : "") +
      '<button type="button" class="chip hzchip confusable-pair-chip" data-confusable-character="' +

      (hasDiagram ? '<span class="confusable-pair-mini" aria-hidden="true">' + partnerSvg + "</span>" : "") +

function confusablePairsHtml(character, items, strokeData) {
   if (!items.length) return "";
   return (
      '<div class="eyebrow">À ne pas confondre</div>' +
      '<div class="confusable-pairs-list">' +
      items.map((item, index) => confusablePairItemHtml(character, item, strokeData, index)).join("") +
      "</div>"
   );
}

async function renderConfusablePairs(character, selector) {
   const targets = Array.from(document.querySelectorAll(selector || "#dd-confusable-pairs"));
   if (!targets.length) return;
   let record = null;
   try {
      const ownMap = await loadConfusablePairs(character);
      record = ownMap.get(character);
   } catch (error) {
      record = null;
   }
   if (!record || !record.partners.length) {
      targets.forEach((target) => {
         target.hidden = true;
         target.innerHTML = "";
      });
      return;
   }

   const shown = record.partners.slice(0, CONFUSABLE_PAIRS_DISPLAY_LIMIT);
   let partnerRecords = new Map();
   try {
      partnerRecords = await loadConfusablePairs(shown.map((partner) => partner.character));
   } catch (error) {
      partnerRecords = new Map();
   }
   const strokeCharacters = [character, ...shown.map((partner) => partner.character)];
   const strokeData = new Map();
   await Promise.all(
      strokeCharacters.map(async (value) => {
         try {
            strokeData.set(value, await loadStrokeCharacterData(value));
         } catch (error) {
            strokeData.set(value, null);
         }
      }),
   );

   const items = shown.map((partner) => {
      const partnerRecord = partnerRecords.get(partner.character);
      const partnerOwnEntry = partnerRecord?.partners.find((entry) => entry.character === character);
      return {
         partner,
         selfDiffIndex: partner.diffStrokeIndex,
         partnerDiffIndex: partnerOwnEntry ? partnerOwnEntry.diffStrokeIndex : null,
      };
   });

   targets.forEach((target) => {
      target.hidden = false;
      target.innerHTML = confusablePairsHtml(character, items, strokeData);
      target.querySelectorAll("[data-confusable-character]").forEach((button) => {
         button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            openCompositionCharacter(button.dataset.confusableCharacter);
         };
      });
   });
}

"use strict";

const STROKE_SVG_VIEWBOX = "0 0 1024 1024";
let strokeGalleryObserver = null;
let strokeFocusState = null;

function strokeGallerySettings() {
   if (!db.settings.strokeGallery || typeof db.settings.strokeGallery !== "object")
      db.settings.strokeGallery = {};
   const settings = db.settings.strokeGallery;
   delete settings.showGhost;
   if (typeof settings.showFuture !== "boolean") settings.showFuture = true;
   if (typeof settings.showGrid !== "boolean") settings.showGrid = true;
   if (typeof settings.highlightRadical !== "boolean") settings.highlightRadical = false;
   return settings;
}

function strokeGridSvg() {
   return (
      '<g class="stroke-grid-lines" aria-hidden="true">' +
      '<rect class="stroke-grid-border" x="16" y="16" width="992" height="992" rx="24"></rect>' +
      '<path class="stroke-grid-center" d="M16 512H1008 M512 16V1008"></path>' +
      '<path class="stroke-grid-diagonal" d="M16 16L1008 1008 M1008 16L16 1008"></path>' +
      "</g>"
   );
}

function strokePathsSvg(data, activeIndex, settings) {
   const parts = [];
   const radicalIndexes = new Set(data.radicalStrokeIndexes || []);
   data.strokes.forEach((path, index) => {
      const radical = settings.highlightRadical && radicalIndexes.has(index);
      const radicalClass = radical ? " stroke-radical" : "";
      const radicalAttribute = radical ? ' data-radical-stroke="true"' : "";
      if (index < activeIndex) {
         parts.push('<path class="stroke-path stroke-complete' + radicalClass + '" data-path-index="' + index + '"' + radicalAttribute + ' d="' + esc(path) + '"></path>');
      } else if (index === activeIndex) {
         parts.push('<path class="stroke-path stroke-current' + radicalClass + '" data-path-index="' + index + '"' + radicalAttribute + ' d="' + esc(path) + '"></path>');
      } else if (settings.showFuture) {
         parts.push('<path class="stroke-path stroke-future' + radicalClass + '" data-path-index="' + index + '"' + radicalAttribute + ' d="' + esc(path) + '"></path>');
      }
   });
   return '<g transform="translate(0 900) scale(1 -1)">' + parts.join("") + "</g>";
}

function strokePanelSvg(data, activeIndex, settings, labelledBy) {
   return (
      '<svg class="stroke-panel-svg" viewBox="' + STROKE_SVG_VIEWBOX + '" role="img" aria-labelledby="' +
      esc(labelledBy) + '">' +
      (settings.showGrid ? strokeGridSvg() : "") +
      strokePathsSvg(data, activeIndex, settings) +
      "</svg>"
   );
}

function materializeStrokePanel(panel, data, settings) {
   if (!panel || panel.dataset.rendered === "true") return;
   const index = Number(panel.dataset.strokeIndex);
   const labelId = panel.querySelector(".stroke-panel-label").id;
   panel.querySelector(".stroke-panel-visual").innerHTML = strokePanelSvg(
      data,
      index,
      settings,
      labelId,
   );
   panel.dataset.rendered = "true";
}

function closeStrokeFocus() {
   if (!strokeFocusState) return;
   const { root, opener, sheetWasInert } = strokeFocusState;
   strokeFocusState = null;
   root.remove();
   $("sheet").inert = sheetWasInert;
   document.body.style.overflow = sheetOpen() || seq ? "hidden" : "";
   if (opener && opener.isConnected) opener.focus();
}

function updateStrokeFocus(index) {
   if (!strokeFocusState) return;
   const state = strokeFocusState;
   state.index = Math.max(0, Math.min(index, state.data.strokeCount - 1));
   const number = state.index + 1;
   const label = `Trait ${number} sur ${state.data.strokeCount}`;
   state.root.querySelector(".stroke-focus-title").textContent =
      `${state.data.character} · ${label}`;
   state.root.querySelector(".stroke-focus-visual").innerHTML = strokePanelSvg(
      state.data,
      state.index,
      state.settings,
      "stroke-focus-title",
   );
   state.root.querySelector(".stroke-focus-position").textContent =
      `${number} / ${state.data.strokeCount}`;
   state.root.querySelector(".stroke-focus-prev").disabled = state.index === 0;
   state.root.querySelector(".stroke-focus-next").disabled =
      state.index === state.data.strokeCount - 1;
}

function openStrokeFocus(data, index, settings, opener) {
   closeStrokeFocus();
   const sheetWasInert = $("sheet").inert;
   $("sheet").inert = true;
   const root = document.createElement("div");
   root.className = "stroke-focus-backdrop";
   root.innerHTML =
      '<section class="stroke-focus" role="dialog" aria-modal="true" aria-labelledby="stroke-focus-title">' +
      '<header><h3 class="stroke-focus-title" id="stroke-focus-title"></h3>' +
      '<button class="stroke-focus-close" type="button" aria-label="Fermer la vue agrandie">×</button></header>' +
      '<div class="stroke-focus-visual"></div>' +
      '<footer><button class="btn ghost stroke-focus-prev" type="button">← Trait précédent</button>' +
      '<span class="stroke-focus-position" aria-live="polite"></span>' +
      '<button class="btn primary stroke-focus-next" type="button">Trait suivant →</button></footer></section>';
   document.body.appendChild(root);
   document.body.style.overflow = "hidden";
   strokeFocusState = { root, data, index, settings, opener, sheetWasInert };
   root.querySelector(".stroke-focus-close").onclick = closeStrokeFocus;
   root.querySelector(".stroke-focus-prev").onclick = () =>
      updateStrokeFocus(strokeFocusState.index - 1);
   root.querySelector(".stroke-focus-next").onclick = () =>
      updateStrokeFocus(strokeFocusState.index + 1);
   root.onclick = (event) => {
      if (event.target === root) closeStrokeFocus();
   };
   updateStrokeFocus(index);
   root.querySelector(".stroke-focus-close").focus();
}

function renderStrokeGallery(data) {
   const gallery = $("dd-gallery");
   const status = $("dd-gallery-status");
   if (!gallery || !status) return;
   if (strokeGalleryObserver) strokeGalleryObserver.disconnect();
   strokeGalleryObserver = null;
   const settings = strokeGallerySettings();
   const radicalToggle = $("dd-highlight-radical");
   if (radicalToggle) {
      const available = Array.isArray(data.radicalStrokeIndexes) && data.radicalStrokeIndexes.length > 0;
      radicalToggle.disabled = !available;
      radicalToggle.checked = available && settings.highlightRadical;
      const label = radicalToggle.closest("label");
      if (label) {
         label.classList.toggle("is-unavailable", !available);
         label.title = available
            ? "Mettre les traits de la clé en évidence"
            : "Aucun trait de clé indiqué par Hanzi Writer";
      }
   }
   gallery.classList.remove("is-loading");
   gallery.setAttribute("aria-busy", "false");
   gallery.onscroll = null;
   status.textContent = `${data.character} · ${data.strokeCount} traits réels`;
   gallery.innerHTML = Array.from({ length: data.strokeCount }, (_, index) => {
      const number = index + 1;
      const labelId = `stroke-panel-label-${number}`;
      return (
         '<button class="stroke-panel" type="button" data-stroke-index="' + index +
         '" data-rendered="false" aria-label="Agrandir : Trait ' + number + " sur " + data.strokeCount + '">' +
         '<span class="stroke-panel-number" aria-hidden="true">' + number + "</span>" +
         '<span class="stroke-panel-visual" aria-hidden="true"></span>' +
         '<span class="stroke-panel-label" id="' + labelId + '">Trait ' + number + " sur " + data.strokeCount + "</span>" +
         "</button>"
      );
   }).join("");

   const panels = Array.from(gallery.querySelectorAll(".stroke-panel"));
   panels.forEach((panel, index) => {
      panel.onclick = () => openStrokeFocus(data, index, settings, panel);
      if (index < 8 || !("IntersectionObserver" in window)) {
         materializeStrokePanel(panel, data, settings);
      }
   });
   if ("IntersectionObserver" in window && panels.length > 8) {
      strokeGalleryObserver = new IntersectionObserver(
         (entries) => entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            materializeStrokePanel(entry.target, data, settings);
            strokeGalleryObserver.unobserve(entry.target);
         }),
         { root: null, rootMargin: "240px" },
      );
      panels.slice(8).forEach((panel) => strokeGalleryObserver.observe(panel));
   }
}

function renderStrokeGalleryError(character, error) {
   const gallery = $("dd-gallery");
   const status = $("dd-gallery-status");
   if (status) status.textContent = `${character} · données de traits indisponibles`;
   if (gallery) {
      gallery.classList.remove("is-loading");
      gallery.setAttribute("aria-busy", "false");
      gallery.innerHTML =
         '<div class="stroke-gallery-error" role="alert">Aucune galerie inventée : ' +
         esc(error && error.message ? error.message : "données réelles introuvables") +
         ".</div>";
   }
}

document.addEventListener(
   "keydown",
   (event) => {
      if (!strokeFocusState) return;
      if (event.key === "Escape") {
         event.preventDefault();
         event.stopImmediatePropagation();
         closeStrokeFocus();
      } else if (event.key === "ArrowLeft") {
         event.preventDefault();
         event.stopImmediatePropagation();
         updateStrokeFocus(strokeFocusState.index - 1);
      } else if (event.key === "ArrowRight") {
         event.preventDefault();
         event.stopImmediatePropagation();
         updateStrokeFocus(strokeFocusState.index + 1);
      }
   },
   true,
);

"use strict";

let ddWriter = null;
let ddWriterTarget = null;
let ddChar = null;
let ddCharacterData = null;
let ddStrokeTab = "animation";
let ddWriterToken = 0;
let ddCharacterLoadToken = 0;
let ddWorkspaceCharacters = [];
let ddWorkspaceCharacterIndex = -1;
let ddWriterDocumentListeners = [];
let ddAutoplaySelectionKey = null;
let ddAutoplayPending = false;
let ddAutoplayLoadToken = 0;
const strokeCharacterNavigationStates = new Map();
let strokeCharacterNavigationResizeTimer = 0;

function strokeCharacterNavigationVisual(stage) {
   const activePanel = stage && stage.querySelector(".stroke-tab-panel:not([hidden])");
   return activePanel &&
      (activePanel.querySelector(".mizi") || activePanel.querySelector(".stroke-gallery"));
}

function destroyStrokeCharacterNavigation(prefix) {
   const state = strokeCharacterNavigationStates.get(prefix);
   if (state) {
      if (state.frame) cancelAnimationFrame(state.frame);
      if (state.observer) state.observer.disconnect();
      strokeCharacterNavigationStates.delete(prefix);
   }
   const stage = $(prefix + "-stage");
   if (!stage) return;
   stage.classList.remove("is-navigation-positioned");
   ["--nav-center-y", "--nav-left", "--nav-right"].forEach((property) =>
      stage.style.removeProperty(property),
   );
}

function measureStrokeCharacterNavigation(prefix) {
   const navigationGap = 8;
   const state = strokeCharacterNavigationStates.get(prefix);
   const stage = $(prefix + "-stage");
   const previous = $(prefix + "-prev");
   const next = $(prefix + "-next");
   const visual = strokeCharacterNavigationVisual(stage);
   if (!state || !stage || !previous || !next || !visual) {
      destroyStrokeCharacterNavigation(prefix);
      return false;
   }

   if (state.visual !== visual) {
      if (state.observer) state.observer.disconnect();
      state.visual = visual;
      if (typeof ResizeObserver === "function") {
         state.observer = new ResizeObserver(() => scheduleStrokeCharacterNavigation(prefix));
         state.observer.observe(stage);
         state.observer.observe(visual);
      }
   }

   const stageRect = stage.getBoundingClientRect();
   const visualRect = visual.getBoundingClientRect();
   const previousRect = previous.getBoundingClientRect();
   const nextRect = next.getBoundingClientRect();
   const compactGalleryNavigation = visual.matches(".stroke-gallery") &&
      window.matchMedia("(max-width: 599px)").matches;
   stage.style.setProperty(
      "--nav-center-y",
      visualRect.top - stageRect.top + (compactGalleryNavigation
         ? Math.max(previousRect.height, nextRect.height) / 2 + 4
         : visualRect.height / 2) + "px",
   );
   stage.style.setProperty(
      "--nav-left",
      (compactGalleryNavigation
         ? visualRect.left - stageRect.left + 4
         : visualRect.left - stageRect.left - previousRect.width - navigationGap) + "px",
   );
   stage.style.setProperty(
      "--nav-right",
      (compactGalleryNavigation
         ? stageRect.right - visualRect.right + 4
         : stageRect.right - visualRect.right - nextRect.width - navigationGap) + "px",
   );
   stage.classList.add("is-navigation-positioned");
   return true;
}

function scheduleStrokeCharacterNavigation(prefix) {
   const state = strokeCharacterNavigationStates.get(prefix);
   if (!state) return;
   if (state.frame) cancelAnimationFrame(state.frame);
   state.frame = requestAnimationFrame(() => {
      state.frame = 0;
      measureStrokeCharacterNavigation(prefix);
   });
}

function setupStrokeCharacterNavigation(prefix) {
   destroyStrokeCharacterNavigation(prefix);
   const stage = $(prefix + "-stage");
   if (!stage || !$(prefix + "-prev") || !$(prefix + "-next")) return;
   strokeCharacterNavigationStates.set(prefix, {
      frame: 0,
      observer: null,
      visual: null,
   });
   scheduleStrokeCharacterNavigation(prefix);
   if (document.fonts && document.fonts.ready)
      document.fonts.ready.then(() => scheduleStrokeCharacterNavigation(prefix));
}

function setupRenderedStrokeCharacterNavigation() {
   document.querySelectorAll(".stroke-character-stage[id$='-stage']").forEach((stage) => {
      setupStrokeCharacterNavigation(stage.id.slice(0, -6));
   });
}

function destroyRenderedStrokeCharacterNavigation() {
   Array.from(strokeCharacterNavigationStates.keys()).forEach((prefix) =>
      destroyStrokeCharacterNavigation(prefix),
   );
}

window.addEventListener("resize", () => {
   clearTimeout(strokeCharacterNavigationResizeTimer);
   strokeCharacterNavigationResizeTimer = setTimeout(() => {
      strokeCharacterNavigationStates.forEach((state, prefix) =>
         scheduleStrokeCharacterNavigation(prefix),
      );
   }, 80);
});

function resetStrokeAutoplaySelection() {
   ddAutoplaySelectionKey = null;
   ddAutoplayPending = false;
   ddAutoplayLoadToken = 0;
}

function removeDDWriterDocumentListeners() {
   ddWriterDocumentListeners.forEach(({ type, listener, options }) =>
      document.removeEventListener(type, listener, options),
   );
   ddWriterDocumentListeners = [];
}

function createManagedDDWriter(target, character, options) {
   const captured = [];
   const originalAddEventListener = document.addEventListener;
   document.addEventListener = function (type, listener, listenerOptions) {
      if (type === "mouseup" || type === "touchend") {
         captured.push({ type, listener, options: listenerOptions });
      }
      return originalAddEventListener.call(this, type, listener, listenerOptions);
   };
   try {
      const writer = HanziWriter.create(target, character, options);
      ddWriterDocumentListeners = captured;
      return writer;
   } catch (error) {
      captured.forEach(({ type, listener, options: listenerOptions }) =>
         document.removeEventListener(type, listener, listenerOptions),
      );
      throw error;
   } finally {
      document.addEventListener = originalAddEventListener;
   }
}

function normalizedStrokeSpeed(value) {
   const speed = Number(value) || 1;
   return Math.max(0.25, Math.min(2, speed));
}

function speedOpts(speed) {
   const value = normalizedStrokeSpeed(speed);
   return {
      strokeAnimationSpeed: value,
      delayBetweenStrokes: Math.max(60, Math.round(200 / value)),
   };
}

      ).join("") +
      "</div>" +
      '<section class="stroke-tab-panel" role="tabpanel" id="stroke-panel-animation" aria-labelledby="stroke-tab-animation"' +
      (active === "animation" ? "" : " hidden") + '>' +
      '<div class="mizi"><div id="dd-target"></div></div>' +

      '<div class="w-note" id="dd-note" role="status" aria-live="polite"></div>' +

      "</section>" +

      (active === "steps" ? "" : " hidden") + '>' +
      '<div class="stroke-gallery-toolbar"><span id="dd-gallery-status" role="status" aria-live="polite">Chargement des traits réels…</span>' +
      '<div class="stroke-gallery-settings">' +
      '<label><input type="checkbox" id="dd-show-future"' + (gallery.showFuture ? " checked" : "") + '> Traits futurs</label>' +
      '<label><input type="checkbox" id="dd-show-grid"' + (gallery.showGrid ? " checked" : "") + '> Grille</label>' +
      '<label class="stroke-radical-setting"><input type="checkbox" id="dd-highlight-radical"' + (gallery.highlightRadical ? " checked" : "") + ' disabled aria-label="Mettre la clé en évidence"><span class="stroke-radical-label-full">Mettre la clé en évidence</span><span class="stroke-radical-label-compact" aria-hidden="true">Clé</span></label>' +
      "</div></div>" +
      '<div class="stroke-gallery" id="dd-gallery" aria-label="Étapes cumulatives des traits"></div>' +
      characterCompositionShellHtml() +
      "</section>" +
      '<section class="stroke-tab-panel" role="tabpanel" id="stroke-panel-practice" aria-labelledby="stroke-tab-practice"' +
      (active === "practice" ? "" : " hidden") + '>' +
      '<div class="mizi"><div id="dd-practice-target"></div><canvas id="dd-canvas" hidden></canvas></div>' +
      characterCompositionShellHtml() +
      '<div class="w-note" id="dd-practice-note" role="status" aria-live="polite">Trace le caractère dans le carré.</div>' +
      '<div class="sh-btns"><button class="btn primary" id="dd-quiz" type="button">Commencer</button>' +
      '<button class="btn ghost" id="dd-clear" type="button">Effacer / recommencer</button></div>' +
      "</section></section>"
   );
}

function destroyDDWriter() {
   ddWriterToken++;
   if (ddWriter && typeof ddWriter.cancelAnimation === "function") {
      try { ddWriter.cancelAnimation(); } catch (error) {}
   }
   if (ddWriter && typeof ddWriter.cancelQuiz === "function") {
      try { ddWriter.cancelQuiz(); } catch (error) {}
   }
   if (ddWriterTarget) ddWriterTarget.innerHTML = "";
   removeDDWriterDocumentListeners();
   ddWriter = null;
   ddWriterTarget = null;
}

function destroyStrokeWorkspace() {
   ddCharacterLoadToken++;
   destroyRenderedStrokeCharacterNavigation();
   destroyDDWriter();
   ddChar = null;
   ddCharacterData = null;
   ddWorkspaceCharacters = [];
   ddWorkspaceCharacterIndex = -1;
   if (strokeGalleryObserver) strokeGalleryObserver.disconnect();
   strokeGalleryObserver = null;
   closeStrokeFocus();
}

function setStrokeWorkspaceMessage(id, message) {
   const target = $(id);
   if (target) target.textContent = message;
}

function setupFreehandPractice(message) {
   destroyDDWriter();
   const canvas = $("dd-canvas");
   const target = $("dd-practice-target");
   if (!canvas || !target) return;
   target.hidden = true;
   canvas.hidden = false;
   const size = Math.min(300, canvas.parentElement.clientWidth || 300);
   canvas.width = size;
   canvas.height = size;
   paintPad(canvas);
   setStrokeWorkspaceMessage(
      "dd-practice-note",
      message || "Données réelles indisponibles · entraînement libre sans modèle inventé.",
   );
}

function createDDWriter(mode) {
   if (!ddChar || !ddCharacterData) return;
   destroyDDWriter();
   const target = mode === "practice" ? $("dd-practice-target") : $("dd-target");
   const canvas = $("dd-canvas");
   if (!target) return;
   if (canvas) canvas.hidden = true;
   target.hidden = false;
   target.innerHTML = "";
   const size = Math.min(300, target.parentElement.clientWidth || 300);
   target.style.width = size + "px";
   target.style.height = size + "px";
   if (typeof HanziWriter === "undefined") {
      if (mode === "practice") setupFreehandPractice("Bibliothèque d’écriture indisponible · entraînement libre.");
      else setStrokeWorkspaceMessage("dd-note", "Animation indisponible.");
      return;
   }
   const token = ++ddWriterToken;
   ddWriterTarget = target;
   try {
      ddWriter = createManagedDDWriter(target, ddChar, {
         width: size,
         height: size,
         padding: 12,
         showCharacter: mode === "animation",
         showOutline: true,
         showHintAfterMisses: 2,
         strokeColor: "#17140F",
         outlineColor: "#CDBFA1",
         drawingColor: "#9E2B25",
         charDataLoader: () => ddCharacterData,
         onLoadCharDataError: () => {
            if (token !== ddWriterToken) return;
            if (mode === "practice") setupFreehandPractice();
            else setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
         },
         ...speedOpts(db.settings.strokeSpeed),
      });
   } catch (error) {
      ddWriter = null;
      ddWriterTarget = null;
      if (mode === "practice")
         setupFreehandPractice("Bibliothèque d’écriture indisponible · entraînement libre.");
      else setStrokeWorkspaceMessage("dd-note", "Animation indisponible.");
      return;
   }
   if (mode === "practice") {
      setStrokeWorkspaceMessage("dd-practice-note", "Appuie sur Commencer, puis trace trait par trait.");
   } else {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const shouldAutoplay =
         ddAutoplayPending && ddAutoplayLoadToken === ddCharacterLoadToken;
      if (shouldAutoplay) ddAutoplayPending = false;
      setStrokeWorkspaceMessage(
         "dd-note",
         reduced
            ? "Mouvement réduit activé · aucune lecture automatique."
            : shouldAutoplay
              ? "Lecture automatique des traits dans l’ordre réel."
              : `${ddCharacterData.strokeCount} traits réels.`,
      );
      if (shouldAutoplay && !reduced) {
         const writer = ddWriter;
         const token = ddWriterToken;
         try {
            const animation = writer.animateCharacter();
            if (animation && typeof animation.catch === "function") {
               animation.catch(() => {
                  if (token === ddWriterToken && writer === ddWriter)
                     setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
               });
            }
         } catch (error) {
            if (token === ddWriterToken && writer === ddWriter)
               setStrokeWorkspaceMessage("dd-note", "Animation indisponible pour ce caractère.");
         }
      }
   }
}

function renderActiveStrokeTab() {
   if (!ddCharacterData) return;
   if (ddStrokeTab === "steps") renderStrokeGallery(ddCharacterData);
   else createDDWriter(ddStrokeTab);
}

function activateStrokeTab(tab, focus) {
   if (!["animation", "steps", "practice"].includes(tab)) return;
   ddStrokeTab = tab;
   document.querySelectorAll("[data-stroke-tab]").forEach((button) => {
      const selected = button.dataset.strokeTab === tab;
      button.setAttribute("aria-selected", String(selected));
      button.tabIndex = selected ? 0 : -1;
      if (selected && focus) button.focus();
   });
   document.querySelectorAll(".stroke-tab-panel").forEach((panel) => {
      panel.hidden = panel.id !== `stroke-panel-${tab}`;
   });
   destroyDDWriter();
   renderActiveStrokeTab();
   setupRenderedStrokeCharacterNavigation();
   if (typeof updateDictionaryPagingMode === "function")
      updateDictionaryPagingMode();
}

function wireDDWritingPracticeAction() {
   const button = $("dd-write");
   if (!button) return;
   button.onclick = () => {
      if (!ddChar || typeof openWritingPracticeSheet !== "function") return;
      const characters = ddWorkspaceCharacters.length
         ? ddWorkspaceCharacters.slice()
         : [ddChar];
      const initialIndex = ddWorkspaceCharacterIndex >= 0 && ddWorkspaceCharacterIndex < characters.length
         ? ddWorkspaceCharacterIndex
         : Math.max(0, characters.indexOf(ddChar));
      openWritingPracticeSheet(characters.join(""), { initialIndex });
   };
}

function wireStrokeWorkspace() {
   const tabs = Array.from(document.querySelectorAll("[data-stroke-tab]"));
   tabs.forEach((button, index) => {
      button.onclick = () => activateStrokeTab(button.dataset.strokeTab, false);
      button.onkeydown = (event) => {
         let next = null;
         if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
         else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
         else if (event.key === "Home") next = 0;
         else if (event.key === "End") next = tabs.length - 1;
         if (next == null) return;
         event.preventDefault();
         activateStrokeTab(tabs[next].dataset.strokeTab, true);
      };
   });
   if ($("dd-speed")) {
      $("dd-speed").oninput = (event) => {
         db.settings.strokeSpeed = normalizedStrokeSpeed(event.target.value);
         $("dd-speed-lab").textContent = db.settings.strokeSpeed.toFixed(2) + "×";
         save();
      };
      $("dd-speed").onchange = () => {
         if (ddStrokeTab === "animation") createDDWriter("animation");
      };
   }
   if ($("dd-anim")) $("dd-anim").onclick = () => {
      if (ddStrokeTab !== "animation") activateStrokeTab("animation", false);
      if (!ddWriter) return toast("Animation indisponible pour ce caractère.");
      ddWriter.showCharacter({ duration: 0 });
      ddWriter.animateCharacter();
      setStrokeWorkspaceMessage("dd-note", "Lecture des traits dans l’ordre réel.");
   };
   wireDDWritingPracticeAction();
   if ($("dd-quiz")) $("dd-quiz").onclick = () => {
      if (!ddWriter) return toast("Quiz indisponible pour ce caractère.");
      if (typeof ddWriter.cancelQuiz === "function") ddWriter.cancelQuiz();
      ddWriter.hideCharacter({ duration: 0 });
      setStrokeWorkspaceMessage("dd-practice-note", "À toi : trace de mémoire, trait par trait.");
      ddWriter.quiz({
         onMistake: (strokeData) => setStrokeWorkspaceMessage(
            "dd-practice-note",
            `Essaie encore · trait ${strokeData.strokeNum + 1} sur ${ddCharacterData.strokeCount}.`,
         ),
         onCorrectStroke: (strokeData) => setStrokeWorkspaceMessage(
            "dd-practice-note",
            `Trait ${strokeData.strokeNum + 1} sur ${ddCharacterData.strokeCount} réussi.`,
         ),
         onComplete: () => setStrokeWorkspaceMessage("dd-practice-note", "Caractère réussi"),
      });
   };
   if ($("dd-clear")) $("dd-clear").onclick = () => {
      if (ddCharacterData && typeof HanziWriter !== "undefined") createDDWriter("practice");
      else {
         const canvas = $("dd-canvas");
         if (canvas) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
      }
   };
   const gallerySettings = strokeGallerySettings();
   [
      ["dd-show-future", "showFuture"],
      ["dd-show-grid", "showGrid"],
      ["dd-highlight-radical", "highlightRadical"],
   ].forEach(([id, key]) => {
      if (!$(id)) return;
      $(id).onchange = (event) => {
         gallerySettings[key] = !!event.target.checked;
         save();
         if (ddCharacterData) renderStrokeGallery(ddCharacterData);
      };
   });
   setupRenderedStrokeCharacterNavigation();
}

async function loadDDChar(character, characters, options) {
   const settings = options || {};
   const selectionKey = String(
      settings.selectionKey == null ? character : settings.selectionKey,
   );
   destroyDDWriter();
   const token = ++ddCharacterLoadToken;
   if (selectionKey !== ddAutoplaySelectionKey) {
      ddAutoplaySelectionKey = selectionKey;
      ddAutoplayPending = true;
   }
   ddAutoplayLoadToken = token;
   ddChar = character;
   ddCharacterData = null;
   ddWorkspaceCharacters = Array.isArray(characters) ? characters.slice() : [character];
   const workspaceIndex = Number.isInteger(settings.selectionIndex)
      ? settings.selectionIndex
      : ddWorkspaceCharacters.indexOf(character);
   ddWorkspaceCharacterIndex = workspaceIndex;
   setCharacterCompositionLoading(character);
   if (typeof loadCharacterCompositions === "function") {
      loadCharacterCompositions(ddWorkspaceCharacters).then((compositions) => {
         if (
            token !== ddCharacterLoadToken ||
            ddChar !== character ||
            !document.querySelector(".stroke-workspace")
         ) return;
         renderCharacterComposition(compositions.get(character) || null);
      }).catch(() => {
         if (token === ddCharacterLoadToken && ddChar === character)
            renderCharacterComposition(null);
      });
   } else renderCharacterComposition(null);
   const stripSelectionIndex = Number.isInteger(settings.stripSelectionIndex)
      ? settings.stripSelectionIndex
      : workspaceIndex;
   document.querySelectorAll("#dd-picker .hzchip, #seq-character-strip .hzchip").forEach((button) => {
      const buttonIndex = Number(button.dataset.i);
      const selected = button.closest("#seq-character-strip")
         ? buttonIndex === stripSelectionIndex
         : buttonIndex === workspaceIndex;
      button.setAttribute("aria-pressed", String(selected));
      button.setAttribute("aria-current", selected ? "true" : "false");
   });
   setStrokeWorkspaceMessage("dd-note", `Chargement des traits réels de ${character}…`);
   setStrokeWorkspaceMessage("dd-practice-note", `Chargement des traits réels de ${character}…`);
   setStrokeWorkspaceMessage("dd-gallery-status", `Chargement des traits réels de ${character}…`);
   if ($("dd-gallery")) {
      $("dd-gallery").classList.add("is-loading");
      $("dd-gallery").setAttribute("aria-busy", "true");
      if (!$("dd-gallery").children.length)
         $("dd-gallery").innerHTML = '<div class="dictionary-loading"><span class="ink-loader"></span></div>';
   }
   try {
      const data = await loadStrokeCharacterData(character);
      if (

function dictionaryCharacterPinyinHints(entry, characters) {
   const hints = new Map();
   const ambiguous = new Set();
   const pronunciation = (entry.pinyin || [])
      .map((variant) => variant.marked || variant.numbered || "")
      .find((value) => value);
   if (!pronunciation) return hints;
   const parts = normalizePinyinSeparators(pronunciation).split(" ").filter(Boolean);
   if (parts.length !== characters.length) return hints;
   characters.forEach((character, index) => {
      if (ambiguous.has(character)) return;
      if (!hints.has(character)) {
         hints.set(character, parts[index]);
         return;
      }
      if (normalizePinyinIdentity(hints.get(character)) !== normalizePinyinIdentity(parts[index])) {
         hints.delete(character);
         ambiguous.add(character);
      }
   });
   return hints;
}

const DICTIONARY_PLACEMENT_KEY = "mo-studio-dictionary-placement-v1";

function readDictionaryPlacementMemory() {
   try {
      const memory = JSON.parse(localStorage.getItem(DICTIONARY_PLACEMENT_KEY) || "{}");
      return {
         lastPackId: typeof memory.lastPackId === "string" ? memory.lastPackId : "",
         categoryByPack: memory.categoryByPack && typeof memory.categoryByPack === "object" ? memory.categoryByPack : {},
         recentPackIds: Array.isArray(memory.recentPackIds) ? memory.recentPackIds.map(String).slice(0, 8) : [],
      };
   } catch (error) {
      return { lastPackId: "", categoryByPack: {}, recentPackIds: [] };
   }
}

function rememberDictionaryPlacement(packIds, categoryIds) {
   if (!packIds.length) return;
   const previous = readDictionaryPlacementMemory();
   const categoryByPack = { ...previous.categoryByPack };
   packIds.forEach((packId) => {
      const category = categoryIds
         .map(categoryById)
         .find((item) => item && item.packId === packId);
      if (category) categoryByPack[packId] = category.id;
   });
   const recentPackIds = uniqueStrings([...packIds.slice().reverse(), ...previous.recentPackIds]).slice(0, 8);
   try {
      localStorage.setItem(
         DICTIONARY_PLACEMENT_KEY,
         JSON.stringify({ lastPackId: packIds[packIds.length - 1], categoryByPack, recentPackIds }),
      );
   } catch (error) {
      /* La validation finale reste possible si la préférence locale est indisponible. */
   }
}

      "</section>"

}

function initialDictionaryPlacementState(entry, existing) {
