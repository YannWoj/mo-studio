         }

/* ---------- dictionnaire hors ligne ---------- */
.search-page {
   max-width: 920px;
   margin-inline: auto;
}
.search-hero {
   margin-bottom: 20px;
}
.search-hero .v-t {
   margin-bottom: 4px;
}
.search-mode-bar {
   display: flex;
   justify-content: flex-end;
   margin-top: 10px;
}
.search-mode-toggle {
   display: inline-flex;
   align-items: center;
   gap: 6px;
}
.search-mode-toggle b {
   font-family: var(--serif);
   font-size: 15px;
}
.dictionary-search-form {
   display: grid;
   grid-template-columns: minmax(0, 1fr) auto;
   gap: 10px;
   align-items: start;
   position: relative;
   z-index: 4;
}
.dictionary-search-input {
   position: relative;
}
.dictionary-search-input > .search {
   width: 100%;
   min-height: 52px;
   padding-right: 46px;
   font-size: 17px;
   scroll-margin-top: 72px;
}
.search-submit {
   min-height: 52px;
   padding-inline: 22px;
}
.search-clear {
   position: absolute;
   top: 4px;
   right: 4px;
   width: 44px;
   height: 44px;
   border-radius: 50%;
   color: var(--ink-soft);
   font-size: 25px;
   line-height: 1;
}
.dictionary-suggestions {
   position: absolute;
   top: calc(100% + 5px);
   inset-inline: 0;
   max-height: min(420px, 55vh);
   overflow-y: auto;
   background: var(--card);
   border: 1px solid var(--line);
   border-radius: 10px;
   box-shadow: 0 14px 32px rgba(23, 20, 15, 0.16);
   z-index: 20;
}
.dictionary-suggestions button {
   display: grid;
   grid-template-columns: minmax(48px, auto) minmax(72px, 0.7fr) minmax(0, 1.4fr);
   gap: 10px;
   align-items: center;
   width: 100%;
   padding: 11px 13px;
   text-align: left;
   border-bottom: 1px solid var(--line-soft);
}
.dictionary-suggestions button:last-child {
   border-bottom: 0;
}
.dictionary-suggestions button[aria-selected="true"],
.dictionary-suggestions button:hover {
   background: var(--card-2);
}
.dictionary-suggestions b {
   font-family: var(--serif);
   font-size: 23px;
}
.dictionary-suggestions small {
   overflow: hidden;
   color: var(--ink-soft);
   text-overflow: ellipsis;
   white-space: nowrap;
}
.search-live-state {
   min-height: 20px;
   padding: 5px 2px;
   color: var(--ink-faint);
   font-size: 12px;
}
.search-examples,
.search-card-strip,
.dd-related-list {
   display: flex;
   flex-wrap: wrap;
   gap: 8px;
}
.search-examples {
   margin: 10px 0 25px;
}
.search-landing-section {
   margin: 22px 0;
}
.search-card-chip {
   display: flex;
   min-width: 125px;
   max-width: 220px;
   padding: 10px 12px;
   flex-direction: column;
   align-items: flex-start;
   border: 1px solid var(--line-soft);
   border-radius: 9px;
   background: var(--card-2);
   text-align: left;
}
.search-card-chip b {
   font-family: var(--serif);
   font-size: 23px;
}
.search-card-chip span {
   overflow: hidden;
   max-width: 100%;
   color: var(--ink-soft);
   font-size: 12px;
   text-overflow: ellipsis;
   white-space: nowrap;
}
.dictionary-loading,
.search-empty {
   display: grid;
   justify-items: center;
   gap: 8px;
   padding: 42px 18px;
   color: var(--ink-soft);
   text-align: center;
}
.ink-loader {
   width: 28px;
   height: 28px;
   border: 2px solid var(--line);
   border-top-color: var(--lacquer);
   border-radius: 50%;
   animation: dictionary-spin 0.8s linear infinite;
}
@keyframes dictionary-spin {
   to { transform: rotate(360deg); }
}
.search-result-summary {
   display: flex;
   justify-content: space-between;
   align-items: center;
   margin: 12px 0 3px;
   color: var(--ink-faint);
   font-size: 12px;
}
.search-fallback {
   display: inline-block;
   color: var(--gold);
   font-size: 11px;
   font-weight: 600;
   text-transform: uppercase;
   letter-spacing: 0.04em;
}
.dict-result {
   width: 100%;
   padding: 13px 7px;
   border-bottom: 1px solid var(--line-soft);
   text-align: left;
}
.dict-result:has(.dict-result-primary:hover),
.dict-result:has(.dict-result-primary:focus-visible) {
   background: var(--card-2);
}
.dict-result-primary {
   display: grid;
   grid-template-columns: minmax(72px, auto) minmax(0, 1fr);
   gap: 14px;
   align-items: center;
   width: 100%;
   min-width: 0;
   padding: 0;
   color: inherit;
   text-align: left;
}
.dict-result-hanzi {
   display: flex;
   flex-direction: column;
}
.dict-result-hanzi b {
   font-family: var(--serif);
   font-size: 28px;
   font-weight: 500;
}
.dict-result-hanzi small,
.dict-match {
   color: var(--ink-faint);
   font-size: 11px;
}
.dict-result-main {
   display: grid;
   gap: 2px;
   min-width: 0;
}
.dict-result-main .row-fr {
   display: -webkit-box;
   overflow: hidden;
   overflow-wrap: anywhere;
   white-space: normal;
   -webkit-box-orient: vertical;
   -webkit-line-clamp: 2;
   line-clamp: 2;
}
.dict-result-main .row-fr.english {
   color: var(--ink-faint);
   font-style: italic;
}
.dict-english-reference {
   display: block;
   margin-top: 3px;
   color: var(--gold);
   overflow-wrap: anywhere;
}
.dict-match {
   display: block;
   margin-top: 3px;
}
.dict-result-meta {
   display: flex;
   flex-wrap: wrap;
   gap: 4px;
   align-items: center;
   margin-top: 5px;
}
.dict-result-variants {
   margin: 8px 0 0 clamp(82px, 13vw, 108px);
   color: var(--ink-soft);
}
.dict-result-variants summary {
   display: inline-flex;
   align-items: center;
   min-height: 44px;
   cursor: pointer;
   color: var(--lacquer);
   font-size: 13px;
   font-weight: 650;
}
.dict-result-variant-list {
   display: grid;
   gap: 4px;
   padding: 3px 0 4px;
}
.dict-result-variant {
   display: flex;
   align-items: center;
   min-height: 44px;
   width: 100%;
   padding: 7px 10px;
   border: 1px solid var(--line-soft);
   border-radius: 10px;
   background: color-mix(in srgb, var(--card-2) 75%, transparent);
   color: var(--ink-soft);
   text-align: left;
}
.dict-result-variant b {
   margin-right: 7px;
   color: var(--ink);
   font: 600 21px var(--serif);
}
.search-more {
   padding: 18px;
   text-align: center;
}
.radical-toolbar {
   margin: 4px 0 10px;
}
.radical-filter-input {
   width: 100%;
   min-height: 48px;
   padding: 0 14px;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: var(--card);
   color: var(--ink);
   font-size: 15px;
}
.radical-filter-input:focus-visible {
   outline: 2px solid color-mix(in srgb, var(--seal) 58%, transparent);
   outline-offset: 2px;
}
.radical-group {
   margin: 16px 0;
}
.radical-group-heading {
   margin-bottom: 8px;
}
.radical-grid {
   display: grid;
   grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
   gap: 8px;
}
.radical-chip {
   display: flex;
   min-height: 44px;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   gap: 2px;
   padding: 10px 8px;
   border: 1px solid var(--line-soft);
   border-radius: 12px;
   background: var(--card-2);
   text-align: center;
}
.radical-chip:active {
   background: var(--card);
}
.radical-chip b {
   font-family: var(--serif);
   font-size: 24px;
   line-height: 1;
}
/* Beaucoup de clés sont des formes liées dont le nom précise la forme d'origine
   (« couteau (forme liée de 刀) ») : deux lignes plutôt qu'une troncature à un mot. */
.radical-chip span {
   display: -webkit-box;
   overflow: hidden;
   max-width: 100%;
   color: var(--ink-soft);
   font-size: 12px;
   line-height: 1.25;
   overflow-wrap: anywhere;
   -webkit-box-orient: vertical;
   -webkit-line-clamp: 2;
   line-clamp: 2;
}
.radical-chip small {
   color: var(--ink-faint);
   font-size: 11px;
}
.radical-back {
   margin-bottom: 6px;
}
.dd-entry .cd-head {
   align-items: flex-start;
}
.dd-top-actions {
   display: flex;
   align-items: center;
   gap: 8px;
   flex: none;
}
.dd-top-close {
   width: 44px;
   height: 44px;
   border: 1px solid var(--line);
   border-radius: 50%;
   background: var(--card-2);
   color: var(--ink-soft);
   font-size: 26px;
   line-height: 1;
}
.dd-traditional,
.dd-numbered {
   color: var(--ink-faint);
   font-size: 13px;
}
.dd-numbered {
   margin: -3px 0 12px;
   font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
.dd-meta {
   display: flex;
   flex-wrap: wrap;
   gap: 6px;
   margin: 18px 0 10px;
   padding-top: 12px;
   border-top: 1px solid var(--line-soft);
}
.dd-definitions {
   margin: 16px 0;
}
.dd-french-compact {
   margin: 5px 0 10px;
   color: var(--ink-soft);
   font-family: var(--disp);
   font-size: 20px;
   line-height: 1.35;
}
.dd-french-preview {
   margin: 0;
}
.dd-french-short .dd-french-preview {
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
}
.dd-french-disclosure .dd-french-preview {
   display: -webkit-box;
   overflow: hidden;
   -webkit-box-orient: vertical;
   -webkit-line-clamp: 2;
}
.dd-french-expanded {
   font-family: var(--sans);
   font-size: 15px;
   line-height: 1.45;
}
.dd-french-expanded .eyebrow {
   margin-bottom: 5px;
}
.dd-french-toggle {
   min-height: 30px;
   margin-top: 2px;
   padding: 2px 0;
   border: 0;
   background: transparent;
   color: var(--seal);
   font: 650 12.5px/1.2 var(--sans);
   text-decoration: underline;
   text-decoration-color: color-mix(in srgb, var(--seal) 36%, transparent);
   text-underline-offset: 3px;
}
.dd-french-toggle:hover {
   text-decoration-color: currentColor;
}
.dd-french-toggle:focus-visible {
   outline: 2px solid color-mix(in srgb, var(--seal) 58%, transparent);
   outline-offset: 2px;
}
.dd-definitions ul {
   margin: 6px 0 0;
   padding-left: 20px;
}
.dd-sense-list {
   margin: 8px 0 0;
   padding-left: 24px;
}
.dd-sense-list li {
   padding-left: 4px;
}
.dd-sense-list li + li {
   margin-top: 7px;
}
.dd-definitions li + li {
   margin-top: 5px;
}
.dd-definitions.english {
   padding: 0 13px;
   border: 1px solid var(--line-soft);
   border-radius: 11px;
   color: var(--ink-soft);
}
.dd-definitions.english[open] {
   padding-bottom: 11px;
}
.dd-definitions.english summary {
   min-height: 44px;
   display: flex;
   align-items: center;
   cursor: pointer;
   color: var(--gold);
   font-weight: 650;
}
.dd-french-unavailable {
   padding: 12px 14px;
   border-left: 3px solid var(--gold);
   background: var(--card-2);
}
.dd-french-unavailable p,
.dd-variant-note p {
   margin: 5px 0 0;
}
.dd-variant-note {
   margin: 12px 0;
   padding: 11px 13px;
   border: 1px solid var(--line-soft);
   border-radius: 11px;
   background: var(--card-2);
}
.dd-hsk-source {
   display: grid;
   gap: 8px;
   margin: 16px 0;
   padding: 12px 14px;
   border: 1px solid color-mix(in srgb, var(--seal) 30%, var(--line));
   border-radius: 11px;
   background: color-mix(in srgb, var(--seal) 5%, var(--card-2));
}
.dd-hsk-source .eyebrow {
   margin: 0 0 2px;
}
.dd-hsk-source-item + .dd-hsk-source-item {
   padding-top: 8px;
   border-top: 1px solid var(--line-soft);
}
.dd-hsk-translation {
   margin: 2px 0;
   overflow-wrap: anywhere;
   color: var(--ink-soft);
}
.dd-hsk-source-item small {
   color: var(--ink-faint);
}
.dd-card-actions {
   display: grid;
   gap: 10px;
   margin: 18px 0;
   padding: 14px;
   border: 1px solid var(--line-soft);
   border-radius: 11px;
   background: color-mix(in srgb, var(--card-2) 74%, transparent);
}
.dd-card-actions .acts {
   justify-content: flex-start;
}
.dd-already-state {
   display: grid;
   gap: 2px;
}
.dd-already-state b {
   color: var(--jade);
}
.dd-already-state span {
   color: var(--ink-faint);
   font-size: 13px;
}
.dd-sources {
   margin: 15px 0;
   padding: 10px 12px;
   border-left: 2px solid var(--gold);
   background: var(--card-2);
   color: var(--ink-soft);
   font-size: 12px;
}
.dd-sources summary {
   color: var(--ink-soft);
   cursor: pointer;
   font-weight: 600;
}
.dd-sources > span {
   display: block;
   margin-top: 8px;
}
.dd-related {
   min-height: 46px;
   margin: 18px 0;
}
.dd-character-interaction {
   margin-top: 10px;
   padding: 14px;
   border: 1px solid var(--line);
   border-radius: 16px;
   background: color-mix(in srgb, var(--card-2) 68%, transparent);
}
.dd-character-study-card {
   display: flex;
   align-items: center;
   justify-content: flex-end;
   min-height: 30px;
   margin: 10px 0 2px;
}
.dd-character-study-card[aria-busy="true"] {
   opacity: 0.72;
}
.dd-character-study-card .btn {
   min-height: 44px;
   padding-inline: 14px;
}
.dictionary-suggestion-personal {
   display: inline-block;
   margin-left: 7px;
   padding: 2px 6px;
   border-radius: 999px;
   background: color-mix(in srgb, var(--jade) 12%, var(--card-2));
   color: var(--jade);
   font-style: normal;
   font-weight: 700;
}
.dd-character-details {
   margin: 12px 0 8px;
   padding: 10px 13px;
   border: 1px solid var(--line-soft);
   border-radius: 12px;
   background: color-mix(in srgb, var(--card-2) 72%, transparent);
}
.dd-character-details > .eyebrow {
   margin: 0 0 4px;
}
.dd-character-detail-row {
   display: grid;
   grid-template-columns: 34px minmax(72px, auto) minmax(0, 1fr);
   gap: 9px;
   align-items: baseline;
   padding: 7px 0;
   border-top: 1px solid var(--line-soft);
}
.dd-character-detail-row:first-child {
   border-top: 0;
}
.dd-character-detail-hanzi {
   font-family: var(--serif);
   font-size: 24px;
   line-height: 1;
}
.dd-character-detail-pinyin {
   font-size: 14px;
   white-space: nowrap;
}
.dd-character-detail-translation {
   color: var(--ink-soft);
   font-size: 13px;
   line-height: 1.4;
   overflow-wrap: anywhere;
}
#dd-picker .hzchip[aria-current="true"] {
   border-color: var(--seal);
   background: color-mix(in srgb, var(--seal) 10%, var(--card-2));
   color: var(--ink);
   box-shadow: inset 0 -2px var(--seal), 0 0 0 2px color-mix(in srgb, var(--seal) 12%, transparent);
}
#dd-picker .hzchip[aria-current="true"] .dd-character-chip-hanzi {
   color: var(--seal);
}
#dd-picker .hzchip[aria-current="true"] .dd-character-chip-pinyin,
#dd-picker .hzchip[aria-current="true"] .dd-character-chip-definition {
   color: var(--ink-soft);
}
.dd-character-picker-rail {
   position: relative;
   min-width: 0;
   margin: 12px 0 6px;
}
.dd-character-picker-rail::after {
   position: absolute;
   z-index: 2;
   top: 2px;
   right: 0;
   bottom: 5px;
   width: 30px;
   background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card-2) 94%, transparent) 72%);
   content: "";
   opacity: 0;
   pointer-events: none;
   transition: opacity 0.15s;
}
.dd-character-picker-rail.is-overflowing:not(.is-at-end)::after {
   opacity: 1;
}
#dd-picker.dd-character-picker {
   flex-wrap: nowrap;
   max-height: none;
   margin: 0;
   overflow-x: auto;
   overflow-y: hidden;
   align-items: stretch;
   padding: 2px 2px 5px;
   scrollbar-width: thin;
}
#dd-picker .dd-character-chip {
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: flex-start;
   flex: 1 1 0;
   min-width: 0;
   min-height: 86px;
   height: auto;
   max-height: 116px;
   padding: 8px 9px 7px;
   border-radius: 15px;
   gap: 3px;
   overflow: hidden;
   text-align: center;
}
#dd-picker.dd-character-picker-many .dd-character-chip {
   flex: 1 0 96px;
   max-width: 150px;
}
.dd-character-chip-hanzi {
   font-family: var(--serif);
   font-size: 27px;
   line-height: 1;
}
.dd-character-chip-pinyin {
   min-height: 17px;
   color: var(--ink-soft);
   font-size: 13px;
   line-height: 1.2;
   white-space: nowrap;
}
.dd-character-chip-pinyin::before {
   content: attr(data-character-pinyin-value);
}
.dd-character-chip-definition {
   display: block;
   min-width: 0;
   max-width: 100%;
   color: var(--ink-soft);
   font-family: var(--sans);
   font-size: 11px;
   line-height: 1.25;
   hyphens: auto;
   overflow-wrap: normal;
   word-break: normal;
}
.dd-character-chip-definition::before {
   content: attr(data-character-definition-value);
}
#dd-picker .hzchip:disabled {
   cursor: default;
   opacity: 0.58;
}
#dd-character-interaction .character-nav-button:focus-visible,
#dd-picker .hzchip:focus-visible {
   outline: 2px solid color-mix(in srgb, var(--seal) 62%, transparent);
   outline-offset: 2px;
}
#dd-picker .hzchip:active:not(:disabled) {
   box-shadow: inset 0 -2px var(--seal), 0 0 0 2px color-mix(in srgb, var(--seal) 18%, transparent);
}

@media (max-width: 620px) {
   .sheet-card:has(.dd-entry) {
      padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
   }
   .dd-entry .cd-hz {
      font-size: 40px;
      line-height: 1;
   }
   .dd-entry .cd-py {
      margin-top: 0;
      font-size: 18px;
   }
   .dd-entry .dd-traditional {
      margin-top: 2px;
   }
   .dd-french-compact {
      margin: 3px 0 7px;

.path-page {
   padding-top: 10px;
}

.path-header {
   display: flex;
   align-items: center;
   gap: 14px;
   margin: 6px 0 18px;
}

.path-header .v-t,
.path-level-header .v-t {
   margin: 0;
}

.path-mark {
   display: grid;
   flex: 0 0 54px;
   width: 54px;
   height: 54px;
   place-items: center;
   border-radius: 15px;
   background: var(--seal);
   color: var(--card-2);
   font: 30px var(--serif);
}

.path-continue h3 {
   font-family: var(--disp);
   font-size: 20px;
}

.path-continue p,
.path-level-note {
   color: var(--ink-soft);
}

.path-continue p {
   margin-top: 5px;
}

.path-levels {
   display: grid;
   gap: 10px;
}

.path-grammar {
   display: grid;
   grid-template-columns: auto minmax(0, 1fr) auto;
   align-items: center;
   gap: 16px;
   width: 100%;
   margin: 0 0 16px;
   padding: 20px;
   text-align: left;
   border-color: color-mix(in srgb, var(--lacquer) 44%, var(--line));
   background: linear-gradient(135deg, var(--card-2), var(--card));
}

.path-grammar-mark {
   display: grid;
   width: 58px;
   height: 58px;
   place-items: center;
   border-radius: 14px;
   background: var(--lacquer);
   color: var(--card-2);
   font: 600 31px var(--serif);
   box-shadow: 0 5px 14px rgba(158, 43, 37, 0.22);
}

.path-grammar-copy {
   display: flex;
   min-width: 0;
   flex-direction: column;
   gap: 3px;
}

.path-grammar-copy strong {
   font: 600 23px var(--disp);
}

.path-grammar-copy span {
   color: var(--ink-soft);
   font-size: 13.5px;
   line-height: 1.4;
}

.path-grammar-arrow {
   color: var(--lacquer);
   font-size: 24px;
}

.path-level {
   display: flex;
   width: 100%;
   min-height: 88px;
   align-items: center;
   justify-content: space-between;
   gap: 18px;
   padding: 17px 18px;
   text-align: left;
}

.path-level > span:first-child {
   display: flex;
   flex-direction: column;
   min-width: 0;
}

.path-level-title {
   flex: 0 0 auto;
   color: var(--seal);
   font: 600 24px var(--disp);
}

.path-level-order {
   color: var(--ink-faint);
   font-size: 11px;
   letter-spacing: 0.06em;
   text-transform: uppercase;
}

.path-level-note {
   max-width: 290px;
   font-size: 13.5px;
   line-height: 1.35;
   text-align: right;
}

.path-level-note b {
   display: block;
   color: var(--ink);
   font: 600 20px var(--disp);
}

.path-level-header {
   display: flex;
   align-items: center;
   gap: 12px;
   margin: 6px 0 18px;
}

.path-level-header .btn {
   min-height: 44px;
   padding-inline: 8px;
}

.path-loading {
   display: flex;
   min-height: 92px;
   align-items: center;
   justify-content: center;
   gap: 12px;
   color: var(--ink-soft);
}

.path-error {
   padding: 20px;
}

.path-scope-note {
   margin: -8px 0 14px;
   color: var(--ink-faint);
   font-size: 12px;
}

.path-vocabulary {
   overflow: hidden;
}

.path-level-tools {
   display: grid;
   grid-template-columns: minmax(0, 1fr) auto;
   gap: 5px 12px;
   align-items: end;
   padding: 16px;
   border-bottom: 1px solid var(--line-soft);
   background: color-mix(in srgb, var(--card-2) 68%, transparent);
}

.path-level-tools label {
   grid-column: 1 / -1;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
}

.path-filter-count {
   padding-bottom: 10px;
   color: var(--ink-faint);
   font-size: 12px;
   white-space: nowrap;
}

.path-word-list {
   display: grid;
}

.path-word {
   display: grid;
   grid-template-columns: minmax(76px, auto) minmax(0, 1fr) auto;
   gap: 12px;
   align-items: center;
   min-height: 78px;
   padding: 12px 15px;
   border-bottom: 1px solid var(--line-soft);
   text-align: left;
}

.path-word:hover,
.path-word:focus-visible {
   background: var(--card-2);
}

.path-word-hanzi {
   color: var(--ink);
   font: 500 25px var(--serif);
}

.path-word-main {
   display: flex;
   min-width: 0;
   flex-direction: column;
}

.path-word-pinyin {
   font-size: 14px;
}

.path-word-translation {
   overflow-wrap: anywhere;
   color: var(--ink-soft);
   font-size: 13px;
   line-height: 1.35;
}

.path-word-meta {
   margin-top: 3px;
   color: var(--ink-faint);
   font-size: 10.5px;
}

.path-word-badges {
   display: flex;
   max-width: 120px;
   flex-direction: column;
   align-items: flex-end;
   gap: 4px;
}

.hsk-badge,
.path-word-status {
   display: inline-flex;
   align-items: center;
   width: fit-content;
   border: 1px solid color-mix(in srgb, var(--seal) 48%, var(--line));
   border-radius: 999px;
   background: color-mix(in srgb, var(--seal) 9%, var(--card-2));
   color: var(--lacquer);
   font-family: var(--ui);
   font-size: 10.5px;
   font-style: normal;
   font-weight: 600;
   line-height: 1;
   padding: 5px 7px;
   white-space: nowrap;
}

.path-word-status {
   max-width: 120px;
   border-color: var(--line);
   background: var(--card-2);
   color: var(--ink-faint);
   font-size: 9px;
   line-height: 1.15;
   text-align: right;
   white-space: normal;
}

.path-word-status.status-source-only,
.hsk-source-status {
   border-color: color-mix(in srgb, var(--gold) 62%, var(--line));
   color: color-mix(in srgb, var(--gold) 72%, var(--ink));
}

.path-no-results {
   min-height: 180px;
   padding: 36px 20px;
   color: var(--ink-soft);
   text-align: center;
}

.path-more {
   padding: 14px;
   text-align: center;
}

@media (min-width: 700px) {
   .path-levels {
      grid-template-columns: repeat(2, minmax(0, 1fr));
   }
}

@media (max-width: 480px) {
   .path-header {
      align-items: flex-start;
   }

   .path-level {
      min-height: 82px;
      padding: 14px;
   }

   .path-grammar {
      gap: 12px;
      padding: 15px 13px;
   }

   .path-grammar-mark {
      width: 50px;
      height: 50px;
      font-size: 27px;
   }

   .path-grammar-copy strong {
      font-size: 20px;
   }

   .path-grammar-copy span {
      font-size: 12px;
   }

   .path-level-title {
      font-size: 22px;
   }

   .path-level-note {
      max-width: 145px;
      font-size: 11.5px;
   }

   .path-level-header {
      align-items: flex-start;
   }

   .path-level-header .muted {
      line-height: 1.3;
   }

   .path-level-tools {
      grid-template-columns: 1fr;
   }

   .path-filter-count {
      padding-bottom: 0;
   }

   .path-word {
      grid-template-columns: minmax(68px, auto) minmax(0, 1fr);
      gap: 10px;
      padding-inline: 12px;
   }

   .path-word-badges {
      grid-column: 2;
      max-width: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
   }

   .path-word-status {
      max-width: none;
      text-align: left;
   }
}

/* ---------- parcours : périmètre, prochaine leçon, progression, carte ---------- */
.path-scope-segments {
   display: grid;
   grid-template-columns: repeat(3, minmax(0, 1fr));
   gap: 6px;
   margin-top: 8px;
}

.path-scope-segment {
   min-width: 0;
   min-height: 44px;
   padding: 6px 6px;
   border: 1px solid var(--line);
   border-radius: 10px;
   background: var(--card-2);
   color: var(--ink-soft);
   font-size: 12.5px;
   font-weight: 600;
   line-height: 1.2;
}

.path-scope-segment[aria-pressed="true"] {
   border-color: var(--lacquer);
   background: color-mix(in srgb, var(--lacquer) 10%, var(--card));
   color: var(--lacquer);
   box-shadow: inset 0 -2px var(--lacquer);
}

.path-scope-hsk-levels {
   display: grid;
   grid-template-columns: repeat(6, minmax(0, 1fr));
   gap: 5px;
   margin-top: 8px;
}

.path-scope-hsk-level {
   min-height: 38px;
   border: 1px solid var(--line);
   border-radius: 8px;
   background: var(--card-2);
   color: var(--ink-soft);
   font: 600 13px var(--disp);
}

.path-scope-hsk-level[aria-pressed="true"] {
   border-color: var(--lacquer);
   background: var(--lacquer);
   color: var(--card);
}

.path-primary {
   display: block;
}

.path-next-head {
   display: flex;
   align-items: center;
   gap: 12px;
   margin-top: 4px;
}

.path-next-hz {
   flex: none;
   color: var(--ink);
   font: 500 44px var(--serif);
}

.path-next-main {
   display: flex;
   min-width: 0;
   flex-direction: column;
   gap: 2px;
}

.path-next-gloss {
   color: var(--ink-soft);
   font-size: 14px;
}

.path-next-chars {
   display: flex;
   flex-wrap: wrap;
   gap: 6px;
   margin: 14px 0;
}

.path-next-more {
   display: inline-flex;
   align-items: center;
   padding: 6px 11px;
   color: var(--ink-faint);
   font-size: 13px;
}

.path-progress {
   margin-top: 10px;
}

.path-progress-count {
   font: 600 20px var(--disp);
   color: var(--ink);
}

.path-progress-note {
   margin-top: 6px;
   color: var(--ink-soft);
   font-size: 13px;
}

.path-scope-note-card p {
   color: var(--ink-soft);
   font-size: 14px;
}

.path-scope-note-card p + p {
   margin-top: 6px;
}

.path-map {
   margin-top: 16px;
}

.path-map-bucket {
   margin-bottom: 18px;
}

.path-map-bucket-title {
   display: flex;
   align-items: center;
   gap: 8px;
   margin: 0 0 8px;
   color: var(--ink);
   font: 600 15px var(--disp);
}

.path-map-bucket-count {
   display: inline-flex;
   align-items: center;
   justify-content: center;
   min-width: 22px;
   padding: 2px 6px;
   border-radius: 999px;
   background: var(--card-2);
   color: var(--ink-faint);
   font-size: 11px;
}

.path-map-bucket-empty {
   color: var(--ink-faint);
   font-size: 13px;
}

.path-map-rows {
   display: grid;
   gap: 6px;
}

.path-map-row {
   border-left: 3px solid transparent;
}

.path-map-row-acquis {
   border-left-color: var(--jade);
}

.path-map-row-disponible {
   border-left-color: var(--lacquer);
}

.path-map-row-bientot {
   border-left-color: var(--gold);
}

.path-map-row-verrouillee {
   border-left-color: var(--line);
   opacity: 0.72;
}

.path-map-remaining {
   flex: none;
   color: var(--lacquer);
   font-size: 12px;
   font-weight: 600;
}

.unit-family-tag.path-map-gap {
   border: 1px solid color-mix(in srgb, var(--lacquer) 45%, var(--line));
   background: color-mix(in srgb, var(--lacquer) 10%, var(--card-2));
   color: var(--lacquer);
}

.path-explore {
   margin-top: 22px;
   padding-top: 6px;
   border-top: 1.5px dashed var(--line);
}

.path-explore > .btn {
   margin-bottom: 14px;
}

@media (max-width: 480px) {
   .path-next-hz {
      font-size: 38px;
   }

   .path-scope-hsk-levels {
      grid-template-columns: repeat(3, minmax(0, 1fr));
   }
}

/* ---------- leçons (parcours) ---------- */
body.in-lesson .nav,
body.in-lesson .top {
   display: none;
}

body.in-lesson {
   padding-bottom: 28px;
}

.lesson-component-intro {
   margin-bottom: 18px;
}

.lesson-family-intro {
   margin: 0 0 12px;
   color: var(--ink-soft);
   font-size: 14px;
}

.unit-family-grid {
   display: grid;
   gap: 8px;
}

.unit-family-row {
   border: 1px solid var(--line);
   border-radius: var(--r);
   background: var(--card);
   overflow: hidden;
}

.unit-family-row[open] > .unit-family-head {
   border-bottom: 1px solid var(--line-soft);
}

.unit-family-row-skeleton {
   display: flex;
   min-height: 60px;
   align-items: center;
   justify-content: center;
   background: var(--card-2);
}

.unit-family-head {
   display: flex;
   align-items: center;
   gap: 10px;
   min-height: 60px;
   padding: 10px 12px;
   cursor: pointer;
   list-style: none;
}

.unit-family-head::-webkit-details-marker {
   display: none;
}

.unit-family-hz {
   flex: none;
   color: var(--ink);
   font: 500 26px var(--serif);
}

.unit-family-main {
   display: flex;
   min-width: 0;
   flex: 1 1 auto;
   flex-direction: column;
   gap: 1px;
}

.unit-family-pinyin {
   font-size: 13.5px;
}

.unit-family-gloss {
   overflow: hidden;
   color: var(--ink-soft);
   font-size: 12.5px;
   text-overflow: ellipsis;
   white-space: nowrap;
}

.unit-family-badges {
   display: flex;
   flex: none;
   flex-wrap: wrap;
   justify-content: flex-end;
   gap: 4px;
   max-width: 130px;
}

.unit-family-tag {
   display: inline-flex;
   align-items: center;
   border-radius: 999px;
   padding: 4px 8px;
   font-size: 10px;
   font-weight: 600;
   white-space: nowrap;
}

.unit-family-tag.son {
   border: 1px solid color-mix(in srgb, var(--lacquer) 45%, var(--line));
   background: color-mix(in srgb, var(--lacquer) 10%, var(--card-2));
   color: var(--lacquer);
}

.unit-family-tag.sens {
   border: 1px solid color-mix(in srgb, var(--jade) 45%, var(--line));
   background: color-mix(in srgb, var(--jade) 10%, var(--card-2));
   color: var(--jade);
}

.unit-family-tag.key {
   border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
   background: color-mix(in srgb, var(--gold) 10%, var(--card-2));
   color: color-mix(in srgb, var(--gold) 72%, var(--ink));
}

.unit-family-chevron {
   flex: none;
   color: var(--ink-faint);
   font-size: 14px;
   transition: transform 0.15s;
}

.unit-family-row[open] .unit-family-chevron {
   transform: rotate(180deg);
}

.unit-family-row .character-composition {
   padding: 4px 12px 14px;
}

.unit-word-list {
   display: grid;
   gap: 8px;
}

.unit-word-row {
   display: flex;
   align-items: center;
   gap: 10px;
   min-height: 60px;
   padding: 10px 12px;
   border: 1px solid var(--line);
   border-radius: var(--r);
   background: var(--card);
}

.unit-word-hz {
   flex: none;
   color: var(--ink);
   font: 500 22px var(--serif);
}

.unit-word-main {
   display: flex;
   min-width: 0;
   flex: 1 1 auto;
   flex-direction: column;
   gap: 1px;
}

.unit-word-pinyin {
   font-size: 13.5px;
}

.unit-word-gloss {
   color: var(--ink-soft);
   font-size: 13px;
}

.unit-word-empty {
   padding: 24px 4px;
   color: var(--ink-soft);
   text-align: center;
}

.lesson-recap-list {
   display: grid;
   gap: 8px;
   margin-bottom: 14px;
}

.lesson-recap-row {
   display: flex;
   align-items: baseline;
   gap: 10px;
   padding: 10px 4px;
   border-bottom: 1px solid var(--line-soft);
   font-size: 13.5px;
}

.lesson-recap-row b {
   flex: none;
   color: var(--ink);
   font: 500 19px var(--serif);
}

.lesson-recap-row > span:not(.lesson-recap-state) {
   min-width: 0;
   flex: 1 1 auto;
   overflow: hidden;
   color: var(--ink-soft);
   text-overflow: ellipsis;
   white-space: nowrap;
}

.lesson-recap-state {
   flex: none;
   color: var(--ink-faint);
   font-size: 11px;
}

.lesson-recap-total {
   margin: 0 0 14px;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
}

.lesson-recap-actions .btn {
   width: 100%;
}

/* ---------- liste des leçons ---------- */
.lu-list {
   display: grid;
}

.lu-row {
   display: grid;
   grid-template-columns: minmax(60px, auto) minmax(0, 1fr) auto;
   gap: 12px;
   align-items: center;
   min-height: 78px;
   padding: 12px 15px;
   border-bottom: 1px solid var(--line-soft);
   text-align: left;
}

.lu-row:hover,
.lu-row:focus-visible {
   background: var(--card-2);
}

.lu-row-component {
   color: var(--ink);
   font: 500 26px var(--serif);
}

.lu-row-main {
   display: flex;
   min-width: 0;
   flex-direction: column;
}

.lu-row-pinyin {
   font-size: 14px;
}

.lu-row-gloss {
   overflow: hidden;
   color: var(--ink-soft);
   font-size: 13px;
   text-overflow: ellipsis;
   white-space: nowrap;
}

.lu-row-meta {
   display: flex;
   flex-direction: column;
   align-items: flex-end;
   gap: 4px;
}

.lu-row-badge {
   border-radius: 999px;
   padding: 4px 9px;
   font-size: 10px;
   font-weight: 600;
   white-space: nowrap;
}

.lu-row-badge-phonetic {
   border: 1px solid color-mix(in srgb, var(--lacquer) 45%, var(--line));
   background: color-mix(in srgb, var(--lacquer) 10%, var(--card-2));
   color: var(--lacquer);
}

.lu-row-badge-semantic {
   border: 1px solid color-mix(in srgb, var(--jade) 45%, var(--line));
   background: color-mix(in srgb, var(--jade) 10%, var(--card-2));
   color: var(--jade);
}

.lu-row-count,
.lu-row-part {
   color: var(--ink-faint);
   font-size: 10.5px;
}

@media (max-width: 480px) {
   .unit-family-badges {
      max-width: 96px;
   }

   .lu-row {
      grid-template-columns: minmax(50px, auto) minmax(0, 1fr);
      gap: 10px;
      padding-inline: 12px;
   }

   .lu-row-meta {
      grid-column: 2;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
   }
}

/* ================= fiche : ligne « à ne pas confondre » ================= */
.confusable-pairs {
   margin-top: 14px;
   padding-top: 12px;
   border-top: 1px solid var(--line-soft);
}
.confusable-pairs[hidden] {
   display: none;
}
.confusable-pairs-list {
   display: flex;
   flex-wrap: wrap;
   gap: 10px;
   margin-top: 6px;
}
.confusable-pair-item {
   display: flex;
   align-items: center;
   gap: 4px;
}
.confusable-pair-mini {
   display: inline-block;
   width: 30px;
   height: 30px;
   flex: none;
}
/* strokePathsSvg (js/strokes/stroke-gallery.js) colore les traits après l'indice
   actif en gris clair "à venir", pensé pour l'animation progressive. Ici, rien
   n'est "à venir" : on ne met en évidence qu'un seul trait qui diffère, le reste
   du caractère doit rester net. */
.confusable-pair-mini .stroke-future {
   fill: #17140f;
}
.confusable-pair-versus {
   color: var(--ink-faint);
   font-size: 13px;
}
.confusable-pair-chip {
   display: inline-flex;
   align-items: center;
   gap: 6px;
   padding: 5px 12px 5px 8px;
}
.confusable-pair-chip .confusable-pair-mini {
   border-radius: 6px;
   background: var(--card);
}
.confusable-pair-chip-hanzi {
   font-size: 17px;
}

/* ================= révision : test de discrimination ================= */
.confusable-test {
   text-align: center;
}
.confusable-test-prompt {
   margin: 4px 0 18px;
   color: var(--ink-soft);
   font-size: 15px;
}
.confusable-test-choices {
   display: flex;
   gap: 12px;
   justify-content: center;
}
.confusable-test-choice {
   flex: 1;
   max-width: 150px;
   padding: 22px 8px;
   border: 1px solid var(--line);
   border-radius: 14px;
   background: var(--card-2);
   font: 700 44px var(--serif);
   color: var(--ink);
   transition: all 0.15s;
}
.confusable-test-choice:active {
   transform: scale(0.97);
}
.confusable-test-choice.ok {
   border-color: var(--jade);
   background: color-mix(in srgb, var(--jade) 14%, var(--card-2));
   color: var(--jade);
}
.confusable-test-choice.ko {
   border-color: var(--lacquer);
   background: color-mix(in srgb, var(--lacquer) 14%, var(--card-2));
   color: var(--lacquer);
}
.confusable-test-verdict {
   margin-top: 16px;
   font-size: 14.5px;
   color: var(--ink-soft);
}
.confusable-test-verdict.ok {
   color: var(--jade);
}
.confusable-test-verdict.ko {
   color: var(--lacquer);
}

@media (max-width: 430px) {
   .confusable-test-choice {
      padding: 18px 6px;
      font-size: 38px;
   }
}

/* ---------- tableau d'écriture ---------- */
.writing-page {
   padding-top: 10px;
}

.writing-header {
   display: flex;
   align-items: center;
   gap: 14px;
   margin: 6px 0 16px;
}

.writing-header .v-t {
   margin: 0;
}

.writing-mark {
   display: grid;
   flex: 0 0 54px;
   width: 54px;
   height: 54px;
   place-items: center;
   border-radius: 15px;
   background: var(--ink);
   color: var(--card-2);
   font: 30px var(--serif);
}

.writing-modes {
   display: grid;
   grid-template-columns: repeat(2, minmax(0, 1fr));
   gap: 9px;
   margin-bottom: 12px;
}

.writing-mode {
   display: flex;
   min-height: 54px;
   align-items: center;
   gap: 10px;
   padding: 10px 13px;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: var(--card);
   text-align: left;
}

.writing-mode span {
   color: var(--lacquer);
   font: 23px var(--serif);
}

.writing-mode b {
   font-size: 14px;
}

.writing-mode[aria-pressed="true"] {
   border-color: var(--ink);
   background: var(--ink);
   color: var(--card-2);
}

.writing-mode[aria-pressed="true"] span {
   color: var(--card-2);
}

.writing-practice-controls {
   margin-bottom: 12px;
   padding: 14px;
   border: 1px solid var(--line);
   border-radius: var(--r);
   background: color-mix(in srgb, var(--card) 82%, transparent);
}

.writing-word-form > label {
   display: block;
   margin-bottom: 5px;
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
}

.writing-word-form > div {
   display: flex;
   gap: 8px;
}

.writing-word-form .search {
   min-width: 0;
}

.writing-character-nav {
   display: grid;
   grid-template-columns: 48px minmax(0, 1fr) 48px;
   align-items: center;
   gap: 8px;
   margin-top: 12px;
   padding: 7px;
   border: 1px solid var(--line-soft);
   border-radius: 12px;
   background: var(--card-2);
   touch-action: pan-y;
   user-select: none;
}

.writing-character-nav strong {
   text-align: center;
   font: 600 21px var(--serif);
}

.writing-character-nav .character-nav-button {
   width: 44px;
   height: 44px;
}

.writing-character-nav .character-nav-button svg {
   width: 22px;
   fill: none;
   stroke: currentColor;
   stroke-linecap: round;
   stroke-linejoin: round;
   stroke-width: 1.8;
}

.writing-practice-empty {
   margin-top: 12px;
   color: var(--ink-faint);
   font-size: 13px;
}

.writing-workspace {
   overflow: hidden;
   box-shadow: var(--shadow);
}

.writing-tools {
   position: relative;
   z-index: 2;
   padding: 13px;
   border-bottom: 1px solid var(--line);
   background: var(--card);
}

.writing-icon-tools {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 6px;
}

.writing-icon-button,
.writing-color-control {
   display: grid;
   flex: 0 0 40px;
   width: 40px;
   height: 40px;
   place-items: center;
   border: 1px solid var(--line);
   background: var(--card-2);
   transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.1s;
}

.writing-icon-button {
   border-radius: 10px;
}

.writing-icon-button:hover,
.writing-icon-button:focus-visible {
   border-color: var(--ink);
}

.writing-icon-button:active,
.writing-color-control:active {
   transform: scale(0.94);
}

.writing-icon-button:disabled {
   cursor: default;
   opacity: 0.38;
}

.writing-icon-button svg {
   width: 22px;
   height: 22px;
   fill: none;
   stroke: currentColor;
   stroke-linecap: round;
   stroke-linejoin: round;
   stroke-width: 1.7;
}

.writing-clear-button {
   color: var(--lacquer);
}

.writing-tool[aria-pressed="true"] {
   border-color: var(--ink);
   background: var(--ink);
   color: var(--card-2);
}

.writing-settings-button[aria-expanded="true"] {
   border-color: var(--ink);
   background: color-mix(in srgb, var(--ink) 8%, var(--card-2));
}

.writing-color-control {
   position: relative;
   cursor: pointer;
   border: 0;
   border-radius: 50%;
   background: transparent;
}

.writing-color-current {
   width: 100%;
   height: 100%;
   overflow: hidden;
   border: 3px solid var(--card-2);
   border-radius: 50%;
   background: var(--writing-color);
   box-shadow: 0 0 0 1px var(--line);
   pointer-events: none;
}

.writing-color-control:hover .writing-color-current,
.writing-color-control:focus-within .writing-color-current {
   box-shadow: 0 0 0 2px var(--ink);
}

.writing-color-input {
   position: absolute;
   inset: 0;
   width: 100%;
   height: 100%;
   margin: 0;
   padding: 0;
   border: 0;
   opacity: 0;
   cursor: pointer;
}

.writing-slider-panel {
   display: grid;
   grid-template-rows: 0fr;
   opacity: 0;
   transform: translateY(-3px);
   pointer-events: none;
   transition:
      grid-template-rows 0.18s ease,
      opacity 0.15s ease,
      transform 0.18s ease;
}

.writing-slider-panel.is-open {
   grid-template-rows: 1fr;
   opacity: 1;
   transform: translateY(0);
   pointer-events: auto;
}

.writing-slider-tools {
   display: grid;
   min-height: 0;
   overflow: hidden;
   grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
   align-items: center;
   gap: 8px 12px;
   padding: 0 2px;
   transition: padding 0.18s ease;
}

.writing-slider-panel.is-open .writing-slider-tools {
   padding-top: 8px;
}

.writing-slider {
   display: grid;
   min-width: 0;
   grid-template-columns: minmax(0, 1fr) auto;
   gap: 0 6px;
   color: var(--ink-soft);
   font-size: 11.5px;
   line-height: 1.2;
}

.writing-slider:only-child {
   grid-column: 1 / -1;
}

.writing-slider output {
   color: var(--ink-faint);
   font-variant-numeric: tabular-nums;
}

.writing-slider input {
   width: 100%;
   grid-column: 1 / -1;
   margin: 2px 0 0;
}

.writing-surface {
   --writing-grid-size: 96px;
   position: relative;
   min-height: clamp(390px, 61vh, 590px);
   overflow: hidden;
   background-color: #f5eedf;
   background-position: -1px -1px;
}

.writing-grid-selector {
   padding: 13px;
   border-top: 1px solid var(--line);
   background: linear-gradient(135deg, var(--card), var(--card-2));
}

.writing-grid-selector-head {
   display: flex;
   align-items: baseline;
   justify-content: space-between;
   gap: 10px;
   margin-bottom: 9px;
}

.writing-grid-selector-head h3 {
   font: 600 18px var(--disp);
}

.writing-grid-selector-head span {
   color: var(--ink-faint);
   font-size: 11px;
}

.writing-grid-options {
   display: grid;
   grid-template-columns: repeat(4, minmax(0, 1fr));
   gap: 8px;
}

.writing-grid-option {
   display: grid;
   min-width: 0;
   min-height: 76px;
   grid-template-columns: 48px minmax(0, 1fr);
   align-items: center;
   gap: 8px;
   padding: 8px;
   border: 1px solid var(--line);
   border-radius: 11px;
   background: color-mix(in srgb, var(--card-2) 78%, transparent);
   text-align: left;
   transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.writing-grid-option:hover,
.writing-grid-option:focus-visible,
.writing-grid-option[aria-pressed="true"] {
   border-color: var(--seal);
   box-shadow: 0 3px 11px rgba(158, 43, 37, 0.12);
}

.writing-grid-option:active {
   transform: scale(0.98);
}

.writing-grid-option[aria-pressed="true"] {
   background: color-mix(in srgb, var(--seal) 7%, var(--card-2));
}

.writing-grid-preview {
   display: block;
   width: 48px;
   height: 48px;
   border: 1px solid color-mix(in srgb, var(--seal) 34%, var(--line));
   border-radius: 8px;
   background-color: #f5eedf;
   background-position: -1px -1px;
   box-shadow: inset 0 0 8px rgba(23, 20, 15, 0.04);
}

.writing-grid-preview[data-grid-preview="square"] {
   background-image:
      linear-gradient(to right, rgba(74, 65, 50, 0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74, 65, 50, 0.18) 1px, transparent 1px);
   background-size: 16px 16px;
}

.writing-grid-preview[data-grid-preview="tian"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to right, transparent 49%, rgba(158, 43, 37, 0.16) 49%, rgba(158, 43, 37, 0.16) 51%, transparent 51%),
      linear-gradient(to bottom, transparent 49%, rgba(158, 43, 37, 0.16) 49%, rgba(158, 43, 37, 0.16) 51%, transparent 51%);
   background-size: 48px 48px;
}

.writing-grid-preview[data-grid-preview="mi"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.24) 1px, transparent 1px),
      linear-gradient(45deg, transparent 49%, rgba(158, 43, 37, 0.15) 49%, rgba(158, 43, 37, 0.15) 51%, transparent 51%),
      linear-gradient(-45deg, transparent 49%, rgba(158, 43, 37, 0.15) 49%, rgba(158, 43, 37, 0.15) 51%, transparent 51%);
   background-size: 48px 48px;
}

.writing-grid-name {
   min-width: 0;
   color: var(--ink-soft);
   font-size: 12px;
   font-weight: 600;
   line-height: 1.2;
   overflow-wrap: anywhere;
}

.writing-surface[data-grid="blank"] {
   background-image: none;
}

.writing-surface[data-grid="square"] {
   --writing-grid-size: 48px;
   background-image:
      linear-gradient(to right, rgba(74, 65, 50, 0.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74, 65, 50, 0.16) 1px, transparent 1px);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-surface[data-grid="tian"],
.writing-surface[data-grid="mi"] {
   background-image:
      linear-gradient(to right, rgba(158, 43, 37, 0.2) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(158, 43, 37, 0.2) 1px, transparent 1px),
      linear-gradient(to right, transparent 49.5%, rgba(158, 43, 37, 0.12) 49.5%, rgba(158, 43, 37, 0.12) 50.5%, transparent 50.5%),
      linear-gradient(to bottom, transparent 49.5%, rgba(158, 43, 37, 0.12) 49.5%, rgba(158, 43, 37, 0.12) 50.5%, transparent 50.5%);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-surface[data-grid="mi"]::before {
   content: "";
   position: absolute;
   inset: 0;
   z-index: 0;
   pointer-events: none;
   opacity: 0.5;
   background-image:
      linear-gradient(45deg, transparent 49.5%, rgba(158, 43, 37, 0.14) 49.5%, rgba(158, 43, 37, 0.14) 50.5%, transparent 50.5%),
      linear-gradient(-45deg, transparent 49.5%, rgba(158, 43, 37, 0.14) 49.5%, rgba(158, 43, 37, 0.14) 50.5%, transparent 50.5%);
   background-size: var(--writing-grid-size) var(--writing-grid-size);
}

.writing-model {
   position: absolute;
   inset: 0;
   z-index: 0;
   display: grid;
   place-items: center;
   color: var(--ink);
   font: 500 clamp(220px, 52vw, 430px) / 1 var(--serif);
   pointer-events: none;
   user-select: none;
}

.writing-model-toggle {
   display: grid;
   width: 44px;
   height: 44px;
   place-items: center;
   padding: 0;
   border: 1px solid color-mix(in srgb, var(--ink) 18%, var(--line));
   border-radius: 50%;
   background: color-mix(in srgb, var(--card-2) 90%, transparent);
   color: var(--ink);
   box-shadow: 0 4px 14px rgba(23, 20, 15, 0.15);
   backdrop-filter: blur(5px);
   -webkit-backdrop-filter: blur(5px);
}

.writing-model-toggle:hover,
.writing-model-toggle:focus-visible,
.writing-model-toggle[aria-pressed="true"] {
   border-color: var(--lacquer);
   color: var(--lacquer);
}

.writing-model-toggle:disabled {
   opacity: 0.45;
}

.writing-model-toggle svg {
   width: 23px;
   height: 23px;
   fill: none;
   stroke: currentColor;
   stroke-linecap: round;
   stroke-linejoin: round;
   stroke-width: 1.7;
}

.writing-model-toggle .writing-eye-slash {
   stroke-width: 2;
}

.writing-surface-model-toggle {
   position: absolute;
   top: 10px;
   right: 10px;
   z-index: 3;
}

#writing-canvas,
.writing-canvas {
   position: absolute;
   inset: 0;
   z-index: 1;
   display: block;
   width: 100%;
   height: 100%;
   cursor: crosshair;
   touch-action: none;
}

.writing-note {
   margin: 0;
   padding: 9px 13px 11px;
   border-top: 1px solid var(--line-soft);
   background: var(--card);
   color: var(--ink-faint);
   font-size: 11.5px;
}

.writing-workspace:fullscreen,
.writing-workspace.writing-fullscreen-fallback {
   display: flex;
   width: 100vw;
   height: 100dvh;
   max-width: none;
   flex-direction: column;
   border: 0;
   border-radius: 0;
   background: var(--paper);
}

.writing-workspace:fullscreen .writing-surface,
.writing-workspace.writing-fullscreen-fallback .writing-surface {
   min-height: 0;
   flex: 1;
}

.writing-workspace.writing-fullscreen-fallback {
   position: fixed;
   inset: 0;
   z-index: 80;
}

body.writing-fullscreen-open {
   overflow: hidden;
}

@media (max-width: 520px) {
   .writing-page {
      padding-top: 2px;
   }

   .writing-header {
      gap: 10px;
      margin: 2px 0 8px;
   }

   .writing-header .muted {
      display: none;
   }

   .writing-mark {
      flex-basis: 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 25px;
   }

   .writing-modes {
      gap: 7px;
      margin-bottom: 8px;
   }

   .writing-mode {
      min-height: 46px;
      gap: 7px;
      padding: 7px 10px;
   }

   .writing-mode b {
      font-size: 12.5px;
   }

   .writing-practice-controls {
      margin-bottom: 8px;
      padding: 9px;
   }

   .writing-word-form > label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
   }

   .writing-character-nav {
      margin-top: 7px;
      padding: 3px;
   }

   .writing-practice-empty {
      margin: 7px 2px 1px;
   }

   .writing-tools {
      padding: 7px;
   }

   .writing-icon-tools {
      gap: 2px;
   }

   .writing-slider-tools {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 5px 8px;
   }

   .writing-grid-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
   }

   .writing-grid-option {
      min-height: 68px;
   }

   .writing-grid-selector {
      padding: 9px;
   }

   .writing-grid-selector-head {
      margin-bottom: 6px;
   }

   .writing-grid-selector-head h3 {
      font-size: 16px;
   }

   .writing-surface {
      min-height: 410px;
   }

}

@media (prefers-reduced-motion: reduce) {
   .writing-slider-panel,
   .writing-slider-tools {
      transition: none;
   }
}

@media (min-width: 900px) {
   .writing-surface {
      min-height: 600px;
   }
}

/* ---------- sheet, toast, nav ---------- */
         #sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(23, 20, 15, 0.45);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
         }
         #sheet.open {
            opacity: 1;
            pointer-events: auto;
         }
         .sheet-card {
            position: relative;
            width: 100%;
            max-width: none;
            max-height: min(92dvh, calc(100dvh - env(safe-area-inset-top)));
            min-width: 0;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            background: var(--paper-2);
            border-radius: 20px 20px 0 0;
            border: 1px solid var(--line);
            border-bottom: none;
            padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
            transform: translateY(30px);
            transition: transform 0.22s;
         }
         .sheet-card > * {
            min-width: 0;
            max-width: 100%;
         }
         .sheet-x {
            position: absolute;
            z-index: 2;
            top: 8px;
            right: 8px;
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border-radius: 50%;
            color: var(--ink-soft);
            font-size: 22px;
            line-height: 1;
         }
         .sheet-x:hover {
            background: var(--card);
            color: var(--lacquer);
         }
         #sheet.open .sheet-card {
            transform: none;
         }
         .sh-t {
            font-family: var(--disp);
            font-size: 21px;
            margin-bottom: 8px;
         }
         .sh-p {
            font-size: 14.5px;
            color: var(--ink-soft);
         }
         .sh-note {
            font-size: 13px;
            color: var(--ink-faint);
            margin-top: 12px;
         }
         .sh-btns {
            display: flex;
            gap: 9px;
            margin-top: 16px;
            flex-wrap: wrap;
         }
         .sh-btns .btn {
            flex: 1;
         }
         .settings-group {
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line-soft);
         }
         .settings-group > .eyebrow:first-child {
            margin: 16px 0 0;
         }
         .settings-group-help {
            margin: 4px 0 12px;
            line-height: 1.45;
         }
         .settings-field-title {
            margin: 12px 0 7px;
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 600;
         }
         .settings-tone-colors {
            margin-top: 4px;
         }
         .settings-data-actions {
            margin-top: 10px;
         }
         .settings-data-actions .btn {
            flex: 1 1 calc(50% - 9px);
         }
         .settings-danger-zone {
            margin-top: 16px;
            padding: 0 12px 12px;
            border: 1px solid rgba(158, 43, 37, 0.28);
            border-radius: 12px;
            background: rgba(158, 43, 37, 0.035);
         }
         .settings-danger-zone > .eyebrow:first-child {
            color: var(--lacquer);
         }
         .settings-close {
            margin-top: 12px;
         }
         .delay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
         }
         .delay-grid .btn {
            margin: 0;
         }
         .dl-custom {
            display: flex;
            gap: 8px;
            margin-top: 10px;
         }
         .dl-custom .search {
            flex: 1;
         }
         .pk-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line-soft);
         }
         .pk-info b {
            display: block;
            font-size: 15px;
         }
         .pk-info span {
            font-size: 12.5px;
            color: var(--ink-faint);
         }
         .pk-btns {
            display: flex;
            gap: 6px;
         }
         .pk-new {
            display: flex;
            gap: 8px;
            margin-top: 14px;
         }
         .pk-new .search {
            flex: 1;
         }
         .cd-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
         }
         .cd-hz {
            font-family: var(--serif);
            font-size: 52px;
            font-weight: 600;
            line-height: 1.15;
            cursor: pointer;
         }
         .cd-py {
            font-size: 19px;
            margin-top: 2px;
         }
         .cd-fr {
            font-family: var(--disp);
            font-size: 20px;
            margin-top: 4px;
         }
         .cd-cat {
            display: inline-block;
            margin-top: 8px;
            margin-right: 6px;
            font-size: 12.5px;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--ink-soft);
         }
         .cd-cat.jade {
            color: var(--jade);
         }
         .cd-status {
            margin-top: 10px;
            font-size: 13.5px;
            color: var(--ink-soft);
         }
         pre.fmt {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 13px;
            font-size: 12.5px;
            overflow: auto;
            line-height: 1.5;
            margin: 10px 0 4px;
         }
         #toast {
            position: fixed;
            left: 50%;
            bottom: calc(96px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(16px);
            background: var(--ink);
            color: var(--card);
            padding: 11px 18px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            z-index: 60;
            max-width: 88vw;
            text-align: center;
         }
         #toast.show {
            opacity: 1;
            transform: translateX(-50%);
         }
         .nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            justify-content: space-around;
            background: color-mix(in srgb, var(--card) 92%, transparent);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
         }
         .nav button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            width: 20%;
            min-width: 0;
            padding: 4px 2px;
            border-radius: 11px;
            color: var(--ink-faint);
         }
         .nav .n-hz {
            font-family: var(--serif);
            font-size: 21px;
            line-height: 1.2;
         }
         .nav .n-lab {
            max-width: 100%;
            overflow: hidden;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.035em;
            text-overflow: ellipsis;
            white-space: nowrap;
         }
         .nav button[aria-pressed="true"] {
            color: var(--lacquer);
         }

         /* ---------- vides, résumé, erreurs ---------- */
         .empty {
            text-align: center;
            padding: 34px 20px;
         }
         .empty-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--line);
            line-height: 1;
         }
         .empty-t {
            font-family: var(--disp);
            font-size: 22px;
            margin-top: 10px;
         }
         .empty-p {
            color: var(--ink-soft);
            font-size: 14.5px;
            max-width: 380px;
            margin: 8px auto 0;
         }
         .empty-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 18px;
            align-items: center;
         }
         .empty-btns .btn {
            width: min(300px, 100%);
         }
         .summary {
            text-align: center;
            padding: 32px 22px;
         }
         .sum-hz {
            font-family: var(--serif);
            font-size: 74px;
            color: var(--lacquer);
            line-height: 1;
         }
         .sum-t {
            font-family: var(--disp);
            font-size: 24px;
            margin: 10px 0 14px;
         }
         .sum-rows {
            max-width: 310px;
            margin: 0 auto 16px;
         }
         .sum-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 15px;
         }
         .sum-row b {
            font-family: var(--disp);
            font-size: 17px;
         }
         .err-list {
            text-align: left;
            max-width: 340px;
            margin: 6px auto 16px;
            max-height: 190px;
            overflow: auto;
            border: 1px solid var(--line-soft);
            border-radius: 11px;
            padding: 4px 12px;
            background: var(--card-2);
         }
         .err-row {
            display: flex;
            gap: 10px;
            padding: 7px 2px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 13.5px;
            align-items: baseline;
         }
         .err-row:last-child {
            border-bottom: none;
         }
         .err-row b {
            font-family: var(--serif);
            font-size: 19px;
            font-weight: 600;
            flex: none;
         }
         .err-row span {
            color: var(--ink-soft);
         }
         .sum-btns {
            display: flex;
            flex-direction: column;
            gap: 9px;
            align-items: center;
         }
         .sum-btns .btn {
            width: min(300px, 100%);
            margin: 0;
         }

/* Packs, sous-catégories et sélection de révision */
.library-page,
.review-page {
   display: grid;
   gap: 16px;
}

.library-page button,
.review-page button {
   min-height: 44px;
}

.library-head,
.pack-detail-title,
.word-list-title,
.review-section-title,
.review-launch {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 16px;
}

.library-head .v-t,
.pack-detail-title h3,
.word-list-title h3,
.review-scope h3,
.review-categories h3 {
   margin: 0;
}

.library-head .eyebrow,
.review-heading .eyebrow {
   margin: 0 0 4px;
}

.lib-import-main {
   min-width: 178px;
}

.library-toolbar,
.tile-actions,
.selection-tools {
   display: flex;
   flex-wrap: wrap;
   gap: 8px;
}

.lib-breadcrumb {
   display: flex;
   min-height: 44px;
   align-items: center;
   gap: 8px;
   overflow: hidden;
   color: var(--ink-soft);
   font-size: 14px;
}

.lib-breadcrumb strong,
.lib-crumb {
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
}

.lib-crumb {
   min-height: 44px;
   color: var(--lacquer);
   text-decoration: underline;
   text-underline-offset: 3px;
}

.pack-grid {
   display: grid;
   gap: 14px;
}

.pack-tile,
.category-tile,
.word-tools,
.review-scope,
.review-categories,
.review-launch {
   border: 1px solid var(--line);
   border-radius: 15px;
   background: var(--card);
   box-shadow: 0 6px 20px rgba(23, 20, 15, 0.06);
}

.pack-tile,
.category-tile {
   padding: 14px;
}

.pack-open,
.category-open {
   display: flex;
   width: 100%;
   min-height: 58px;
   align-items: center;
   gap: 13px;
   text-align: left;
}

.pack-copy,
.category-open > span:first-child {
   display: grid;
   min-width: 0;
   flex: 1;
   gap: 3px;
}

.pack-copy strong,
.category-open strong {
   overflow: hidden;
   font: 600 19px var(--disp);
   text-overflow: ellipsis;
   white-space: nowrap;
}

.pack-copy span,
.category-open small {
   color: var(--ink-faint);
   font-size: 13px;
}

.pack-mark {
   display: grid;
   width: 46px;
   height: 46px;
   flex: 0 0 46px;
   place-items: center;
   border-radius: 12px;
   background: var(--lacquer);
   color: var(--card-2);
   font: 25px var(--serif);
}

.pack-mark.large {
   width: 64px;
   height: 64px;
   margin: 0 auto;
   font-size: 34px;
}

.due-pill {
   flex: none;
   padding: 6px 10px;
   border: 1px solid var(--gold);
   border-radius: 999px;
   color: var(--ink-soft);
   font-size: 12px;
}

.tile-actions {
   justify-content: flex-end;
   margin-top: 10px;
   padding-top: 10px;
   border-top: 1px solid var(--line-soft);
}

.category-list {
   display: grid;
   gap: 10px;
}

.lib-empty {
   padding: 34px 20px;
   text-align: center;
}

.lib-empty h3 {
   margin: 12px 0 5px;
   font-family: var(--disp);
}

.lib-empty p,
.review-section-title p {
   margin: 0;
   color: var(--ink-soft);
   font-size: 14px;
}

.word-tools {
   display: grid;
   gap: 11px;
   padding: 14px;
}

.word-list {
   display: grid;
   gap: 8px;
}

.word-select-row {
   display: grid;
   grid-template-columns: 48px minmax(0, 1fr);
   overflow: hidden;
   border: 1px solid var(--line-soft);
   border-radius: 13px;
   background: var(--card);
}

.word-check {
   display: grid;
   min-width: 48px;
   min-height: 64px;
   place-items: center;
   border-right: 1px solid var(--line-soft);
}

.word-check input,
.review-choice input,
.ck input {
   width: 20px;
   height: 20px;
   accent-color: var(--lacquer);
}

.word-open {
   display: grid;
   min-width: 0;
   min-height: 64px;
   grid-template-columns: minmax(58px, auto) minmax(0, 1fr) auto;
   align-items: center;
   gap: 12px;
   padding: 9px 12px;
   text-align: left;
}

.word-open .row-mid,
.word-open .row-py,
.word-open .row-fr {
   display: block;
   min-width: 0;
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
}

   border: 1px solid var(--line);
   border-radius: 10px;
   background: var(--card-2);
   color: var(--ink-soft);
   font-size: 13px;
   font-weight: 600;
   line-height: 1.2;
}

.review-segment > span,
.review-segment > small {
   display: block;
}

.review-segment > small {
   margin-top: 3px;
   color: var(--ink-faint);
   font-size: 10px;
   font-weight: 400;
   line-height: 1.2;
}

.review-segment[aria-pressed="true"] > small {
   color: var(--ink-soft);
}

.review-segment[aria-pressed="true"] {
   border-color: var(--lacquer);
   background: color-mix(in srgb, var(--lacquer) 10%, var(--card));
   color: var(--lacquer);
   box-shadow: inset 0 -2px var(--lacquer);
}

.review-segment.direction {
   font-size: 12px;
}

.review-mode-segment {
   font-size: 12.5px;
   white-space: nowrap;
}

#review-conditional:empty {
   display: none;
}

.review-conditional-label {
   display: grid;
   min-width: 0;
   gap: 5px;
   color: var(--ink-soft);
   font-size: 12px;
   font-weight: 600;
}

.review-conditional-label .search {
   min-width: 0;
}

.review-conditional-grid {
   display: grid;
   grid-template-columns: 1fr 1fr;
   gap: 8px;
}

.review-manual-note {
   margin: 0;
   padding: 9px 11px;
   border-left: 2px solid var(--gold);
   background: var(--card-2);
   color: var(--ink-soft);
   font-size: 13px;
}

.review-more {
   border-top: 1px solid var(--line-soft);
}

.review-more summary {
   display: flex;
   min-height: 44px;
   align-items: center;
   color: var(--ink-soft);
   cursor: pointer;
   font-size: 13px;
   font-weight: 600;
}

.review-advanced {
   padding: 0 12px;
   border: 1px solid var(--line);
   border-radius: 12px;
   background: var(--card);
   box-shadow: 0 4px 15px rgba(23, 20, 15, .045);
}

.review-advanced summary {
   display: flex;
   min-height: 44px;
   align-items: center;
   color: var(--ink-soft);
   cursor: pointer;
   font-size: 13px;
   font-weight: 600;
}

.review-advanced .review-filter-grid {
   padding-bottom: 12px;
}

.review-writing-options {
   display: grid;
   grid-column: 1 / -1;
   grid-template-columns: repeat(3, minmax(0, 1fr));
   gap: 6px;
   padding-top: 7px;
   border-top: 1px solid var(--line-soft);
}

.review-writing-options > p {
   grid-column: 1 / -1;
   margin: 0;
   color: var(--ink-soft);
   font-size: 12px;
   font-weight: 600;
}

.review-filter-grid {
   display: grid;
   grid-template-columns: repeat(2, minmax(0, 1fr));
   gap: 6px;
   padding-bottom: 3px;
}

.review-filter {
   display: flex;
   min-height: 44px;
   align-items: center;
   gap: 9px;
   padding: 7px 9px;
   border: 1px solid var(--line-soft);
   border-radius: 9px;
   background: var(--card-2);
   font-size: 13px;
}

.review-filter input {
   width: 20px;
   height: 20px;
   flex: 0 0 20px;
   accent-color: var(--lacquer);
}

.review-start-block {
   align-items: center;
   grid-template-columns: auto minmax(0, 1fr) minmax(180px, auto);
}

.review-compact-summary {
   margin: 0;
   color: var(--ink-soft);
   font-size: 15px;
}

.review-compact-summary strong {
   color: var(--ink);
   font: 600 18px var(--disp);
}

.review-empty-message {
   grid-column: 1 / -1;
   margin: 0;
   color: var(--lacquer);
   font-size: 13px;
}

.review-start {
   min-height: 48px;
   padding-inline: 20px;
}

.review-resume {
   grid-column: 1 / -1;
   margin: 0;
}

@media (max-width: 600px) {
   .review-page-simple {
      gap: 7px;
   }
   .review-simple-heading .eyebrow {
      display: none;
   }
   .review-simple-heading .v-t {
      font-size: 21px;
   }
   .review-block {
      gap: 6px;
      padding: 8px 9px;
   }
   .review-block-title h3 {
      font-size: 15px;
   }
   .review-scope-segments {
      grid-template-columns: repeat(2, minmax(0, 1fr));
   }
   .review-segment {
      padding-inline: 4px;
      font-size: 11.5px;
   }
   .review-segment.direction {
      font-size: 10.5px;
   }
   .review-conditional-grid,
   .review-filter-grid {
      grid-template-columns: 1fr;
   }
   .review-visual-list,
   .review-category-options,
   .review-writing-options {
      grid-template-columns: 1fr;
   }
   .review-choice-row {
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 4px 6px;
   }
   .review-choice-label {
      gap: 4px;
   }
   .review-choice-label h3 {
      font-size: 12px;
   }
   .review-mode-description {
      font-size: 10px;
   }
   .review-category-list-head {
      align-items: flex-start;
      flex-direction: column;
      gap: 0;
   }
   .review-category-list-head > div {
      width: 100%;
   }
   .review-category-list-head .review-text-action {
      flex: 1;
   }
   .review-start-block {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: stretch;
   }
   .review-start {
      width: 100%;
      grid-column: 1 / -1;
   }
}

/* ---------- animations & desktop ---------- */
         @keyframes inkIn {
            from {
               filter: blur(7px);
               opacity: 0;
               transform: scale(1.04);
            }
            to {
               filter: blur(0);
               opacity: 1;
               transform: none;
            }
         }
         .ink-in {
            animation: inkIn 0.45s ease-out both;
         }
         @media (prefers-reduced-motion: reduce) {
            * {
               animation: none !important;
               transition: none !important;
            }
         }
         @media (min-width: 768px) {
            #sheet {
               align-items: center;
               padding: 24px;
            }
            .sheet-card {
               width: min(680px, calc(100vw - 48px));
               max-height: calc(100dvh - 48px);
               border-radius: 20px;
               border-bottom: 1px solid var(--line);
            }
         }
         @media (min-width: 900px) {
            #view {
               max-width: 820px;
            }
            .nav {
               left: 50%;
               right: auto;
               transform: translateX(-50%);
               width: 820px;
               max-width: 96vw;
               border: 1px solid var(--line);
               border-bottom: none;
               border-radius: 16px 16px 0 0;
            }
            #lib-list {
               display: grid;
               grid-template-columns: 1fr 1fr;
               gap: 0 26px;
               align-items: start;
            }
            .opts {
               grid-template-columns: repeat(4, 1fr);
            }
            .hero-hz {
               font-size: 66px;
            }
         }

/* Normalisation commune à l'import historique et au dictionnaire hors ligne. */
const PINYIN_TONE_TABLE = {
   a: "āáǎà",
   e: "ēéěè",
   i: "īíǐì",
   o: "ōóǒò",
   u: "ūúǔù",
   ü: "ǖǘǚǜ",
};

const PINYIN_MARK_TO_NUMBER = (() => {
   const output = {};
   Object.entries(PINYIN_TONE_TABLE).forEach(([plain, marked]) => {
      Array.from(marked).forEach((character, index) => {
         output[character] = { plain, tone: index + 1 };
      });
   });
   return output;
})();

const PINYIN_MARK_PATTERN = /[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/i;
const HAN_PATTERN = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/u;
const HAN_ONLY_PATTERN = /^[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]+$/u;

/* Les syllabes non tonées ci-dessous sont ambiguës avec des mots français. */
const AMBIGUOUS_FRENCH_PINYIN = new Set([
   "ce",
   "de",
   "le",
   "ma",
   "me",
   "ne",
   "si",
   "te",
   "tu",
]);

const PINYIN_INITIALS = [
   "",
   "b",
   "p",
   "m",
   "f",
   "d",
   "t",
   "n",
   "l",
   "g",
   "k",
   "h",
   "j",
   "q",
   "x",
   "zh",
   "ch",
   "sh",
   "r",
   "z",
   "c",
   "s",
   "y",
   "w",
];

const PINYIN_FINALS = [
   "a", "ai", "an", "ang", "ao", "e", "ei", "en", "eng", "er", "o", "ou",
   "i", "ia", "ian", "iang", "iao", "ie", "in", "ing", "iong", "iu",
   "u", "ua", "uai", "uan", "uang", "ui", "un", "uo",
   "ü", "üe", "üan", "ün",
];

const PINYIN_SYLLABLES = (() => {
   const values = new Set();
   PINYIN_INITIALS.forEach((initial) =>
      PINYIN_FINALS.forEach((final) => values.add(initial + final)),
   );

function normalizeUnicode(value) {

}

function normalizeApostrophes(value) {
