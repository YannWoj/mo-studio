   const selectedCategoryIds = new Set(currentCategories.map((category) => category.id));
   const selectedPackIds = new Set(currentCategories.map((category) => category.packId));
   if (!existing && db.packs.some((pack) => pack.id === memory.lastPackId)) {
      selectedPackIds.add(memory.lastPackId);
      const rememberedCategory = categoryById(memory.categoryByPack[memory.lastPackId]);
      if (rememberedCategory && rememberedCategory.packId === memory.lastPackId)
         selectedCategoryIds.add(rememberedCategory.id);
   }
   return {
      french: (entry.definitionsFr || []).join(" ; "),
      selectedPackIds,
      selectedCategoryIds,
      withoutCategoryPackIds: new Set(),
      openPackIds: new Set(selectedPackIds),
      filter: "",
      error: "",
   };
}

function dictionaryPlacementPackOrder(state) {
   const memory = readDictionaryPlacementMemory();
   const recentIndex = new Map(memory.recentPackIds.map((id, index) => [id, index]));
   return db.packs.slice().sort((left, right) => {
      const leftUsed = state.selectedPackIds.has(left.id) ? -2 : recentIndex.has(left.id) ? recentIndex.get(left.id) : 99;
      const rightUsed = state.selectedPackIds.has(right.id) ? -2 : recentIndex.has(right.id) ? recentIndex.get(right.id) : 99;
      return leftUsed - rightUsed || left.name.localeCompare(right.name, "fr");
   });
}

function openDictionaryAddToWords(entry, options, suppliedState) {
   const existing = findPersonalCardForEntry(entry);
   const state = suppliedState || initialDictionaryPlacementState(entry, existing);
   const query = state.filter.trim().toLocaleLowerCase("fr");
   const packs = dictionaryPlacementPackOrder(state).filter((pack) => !query || pack.name.toLocaleLowerCase("fr").includes(query));
   const frenchBlock = existing
      ? '<section class="dd-personal-definition"><div class="eyebrow">Définition française personnelle</div><p>' + (esc(existing.fr) || '<span class="muted">Non renseignée</span>') + "</p></section>"
      : '<label class="f-lab">Définition française *<input class="search" id="dd-add-fr" value="' + esc(state.french) + '" autocomplete="off"></label>' +
        (!(entry.definitionsFr || []).length ? '<p class="dd-language-notice">Traduction française indisponible dans les sources. Saisis uniquement une définition que tu as vérifiée.</p>' : "");
   const selectedHanzi = dictionaryDetailDisplayHanzi(entry);
   const identity = entry.traditional && entry.traditional !== entry.simplified
      ? (dictionaryVariantStatus(entry) !== "modern"
         ? 'Variante traditionnelle · simplifié <b>' + esc(entry.simplified) + "</b>"
         : 'Traditionnel · <b>' + esc(entry.traditional) + "</b>")
      : "";
   openSheet(
      '<section class="dd-add-words" aria-labelledby="dd-add-title"><button class="sheet-x" id="dd-add-cancel-top" type="button" aria-label="Fermer">×</button><h3 class="sh-t" id="dd-add-title">' +
         (existing ? "Déjà dans Mes mots" : "Ajouter à Mes mots") +
         '</h3><div class="dd-add-word"><b>' + esc(selectedHanzi) + '</b><span class="dd-add-word-main"><span>' +
         colorPinyin(dictionaryEntryPinyinText(entry)) + "</span>" +
         (identity ? "<small>" + identity + "</small>" : "") + "</span></div>" +
         (existing ? '<p class="dd-unique-card-note">La carte personnelle et toute sa progression SRS seront conservées.</p>' + dictionaryPlacementLocationsHtml(existing) : "") +
         frenchBlock +
         '<div class="dd-placement-head"><div><div class="eyebrow">Packs et sous-catégories</div><p>Tu peux choisir plusieurs emplacements.</p></div><button class="btn ghost" id="dd-collapse-packs" type="button">Tout replier</button></div>' +
         (db.packs.length > 5 ? '<label class="dd-pack-search"><span class="sr-only">Rechercher un pack</span><input class="search" id="dd-pack-search" value="' + esc(state.filter) + '" placeholder="Rechercher un pack…"></label>' : "") +
         '<div class="dd-add-packs" id="dd-add-packs">' +
         (packs.length ? packs.map((pack) => dictionaryPlacementPackHtml(pack, state)).join("") : '<p class="sh-note">Aucun pack correspondant.</p>') +
         '</div><details class="dd-quick-create"><summary>+ Créer rapidement un pack</summary><div class="dd-pack-create"><input class="search" id="dd-add-pack-name" placeholder="Nom du nouveau pack"><button class="btn" id="dd-add-pack-create" type="button">Créer le pack</button></div></details>' +
         (!db.packs.length ? '<p class="sh-note">Tu peux aussi ajouter le mot à Mes mots sans le ranger dans un pack.</p>' : "") +
         (state.error ? '<p class="dd-placement-error" id="dd-placement-error" role="alert">' + esc(state.error) + "</p>" : '<p class="dd-placement-error" id="dd-placement-error" role="alert" hidden></p>') +
         '<div class="dd-placement-actions"><button class="btn ghost" id="dd-add-cancel" type="button">Annuler</button><button class="btn primary" id="dd-add-confirm" type="button">' +
         (existing ? "Enregistrer les emplacements" : "Ajouter à Mes mots") +
         "</button></div></section>",
   );

   const preserveFrench = () => {
      if (!existing && $("dd-add-fr")) state.french = $("dd-add-fr").value;
   };
   document.querySelectorAll("[data-dd-pack-block]").forEach((details) => {
      details.ontoggle = () => {
         if (details.open) state.openPackIds.add(details.dataset.ddPackBlock);
         else state.openPackIds.delete(details.dataset.ddPackBlock);
      };
   });
   document.querySelectorAll("[data-dd-add-pack]").forEach((input) => {
      input.onchange = (event) => {
         event.stopPropagation();
         const packId = input.dataset.ddAddPack;
         if (input.checked) {
            state.selectedPackIds.add(packId);
            state.openPackIds.add(packId);
         } else {
            state.selectedPackIds.delete(packId);
            state.withoutCategoryPackIds.delete(packId);
            categoriesForPack(packId).forEach((category) => state.selectedCategoryIds.delete(category.id));
         }
         preserveFrench();
         openDictionaryAddToWords(entry, options, state);
      };
   });
   document.querySelectorAll("[data-dd-add-category]").forEach((input) => {
      input.onchange = () => {
         const category = categoryById(input.dataset.ddAddCategory);
         if (!category) return;
         if (input.checked) {
            state.selectedCategoryIds.add(category.id);
            state.selectedPackIds.add(category.packId);
            state.withoutCategoryPackIds.delete(category.packId);
            state.openPackIds.add(category.packId);
         } else state.selectedCategoryIds.delete(category.id);
         preserveFrench();
         openDictionaryAddToWords(entry, options, state);
      };
   });
   document.querySelectorAll("[data-dd-without-category]").forEach((input) => {
      input.onchange = () => {
         const packId = input.dataset.ddWithoutCategory;
         if (input.checked) {
            state.withoutCategoryPackIds.add(packId);
            state.selectedPackIds.add(packId);
            categoriesForPack(packId).forEach((category) => state.selectedCategoryIds.delete(category.id));
         } else state.withoutCategoryPackIds.delete(packId);
         preserveFrench();
         openDictionaryAddToWords(entry, options, state);
      };
   });
   document.querySelectorAll("[data-dd-category-create]").forEach((button) => {
      button.onclick = () => {
         if (button.disabled) return;
         const packId = button.dataset.ddCategoryCreate;
         const input = document.querySelector('[data-dd-category-name="' + CSS.escape(packId) + '"]');
         const name = input ? input.value.trim() : "";
         if (!name) return toast("Donne un nom à la sous-catégorie.");
         if (categoriesForPack(packId).some((category) => category.name.localeCompare(name, "fr", { sensitivity: "accent" }) === 0))
            return toast("Cette sous-catégorie existe déjà dans ce pack.");
         button.disabled = true;
         const category = createPersonalCategory(packId, name);
         if (!category) { button.disabled = false; return toast("Sous-catégorie non créée."); }
         state.selectedPackIds.add(packId);
         state.selectedCategoryIds.add(category.id);
         state.withoutCategoryPackIds.delete(packId);
         state.openPackIds.add(packId);
         preserveFrench();
         openDictionaryAddToWords(entry, options, state);
         toast("Sous-catégorie créée et sélectionnée.");
      };
   });
   $("dd-add-pack-create").onclick = () => {
      const button = $("dd-add-pack-create");
      if (button.disabled) return;
      const name = $("dd-add-pack-name").value.trim();
      if (!name) return toast("Donne un nom au pack.");
      if (db.packs.some((pack) => pack.name.localeCompare(name, "fr", { sensitivity: "accent" }) === 0))
         return toast("Ce pack existe déjà.");
      button.disabled = true;
      const pack = createPersonalPack(name);
      if (!pack) { button.disabled = false; return toast("Pack non créé."); }
      state.selectedPackIds.add(pack.id);
      state.openPackIds.add(pack.id);
      preserveFrench();
      openDictionaryAddToWords(entry, options, state);
      toast("Pack créé et sélectionné.");
   };
   if ($("dd-pack-search")) $("dd-pack-search").oninput = () => {
      state.filter = $("dd-pack-search").value;
      preserveFrench();
      openDictionaryAddToWords(entry, options, state);
      if ($("dd-pack-search")) {
         $("dd-pack-search").focus({ preventScroll: true });
         $("dd-pack-search").setSelectionRange(state.filter.length, state.filter.length);
      }
   };
   $("dd-collapse-packs").onclick = () => {
      state.openPackIds.clear();
      preserveFrench();
      openDictionaryAddToWords(entry, options, state);
   };
   const cancel = () => returnFromDictionaryAdd(entry, options);
   $("dd-add-cancel").onclick = cancel;
   $("dd-add-cancel-top").onclick = cancel;
   $("dd-add-confirm").onclick = () => {
      if ($("dd-add-confirm").disabled) return;
      preserveFrench();
      const undecided = Array.from(state.selectedPackIds).filter((packId) => {
         const hasCategory = categoriesForPack(packId).some((category) => state.selectedCategoryIds.has(category.id));
         return !hasCategory && !state.withoutCategoryPackIds.has(packId);
      });
      if (undecided.length) {
         const names = undecided.map((id) => db.packs.find((pack) => pack.id === id)?.name).filter(Boolean);
         state.error = "Choisis une sous-catégorie ou « Ajouter sans sous-catégorie » pour : " + names.join(", ") + ".";
         undecided.forEach((id) => state.openPackIds.add(id));
         openDictionaryAddToWords(entry, options, state);
         return;
      }
      let card = findPersonalCardForEntry(entry);
      const wasExisting = !!card;
      if (!card && !state.french.trim()) return toast("La définition française est obligatoire pour créer ta carte.");
      $("dd-add-confirm").disabled = true;
      makeBackup();
      state.withoutCategoryPackIds.forEach((packId) => {
         let category = categoriesForPack(packId).find((item) => item.name === "Tous les mots");
         if (!category) category = createPersonalCategory(packId, "Tous les mots");
         if (category) state.selectedCategoryIds.add(category.id);
      });
      if (!card) {
         card = normalizeCard({
            hz: entry.simplified,
            py: detailPinyin(entry, "marked").join(" / "),
            fr: state.french.trim(),
            cat: "",
            traditional: entry.traditional || "",
            dictionaryEntryId: entry.dictionaryEntryId || entry.id || "",
         }, false);
         if (!card) return;
         db.cards.push(card);
         invalidateDictIndex();
      }
      setCardMemberships(card.id, Array.from(state.selectedCategoryIds));
      entry.personalCard = card;
      save();
      rememberDictionaryPlacement(Array.from(state.selectedPackIds), Array.from(state.selectedCategoryIds));
      toast(wasExisting ? "Emplacements mis à jour, progression conservée." : "« " + entry.simplified + " » ajouté à Mes mots.");
      returnFromDictionaryAdd(entry, options);
   };
}

function dictionaryRelatedWordIsVulgar(word) {
   const english = (word.definitionsEn || []).join(" ");
   if (/\b(?:vulgar|coarse)\b/i.test(english)) return true;
   const hanzi = String(word.simplified || "");
   // Certains aperçus de variantes ne répètent pas le marqueur anglais et ne
   // contiennent qu'un renvoi. Ce repli ciblé ne s'applique qu'aux suggestions.
   return /妈卖(?:批|屄)|媽賣(?:批|屄)|(?:操|肏|屄|屌).{0,4}你|你.{0,4}(?:操|肏|屄|屌|老母)|(?:干|幹|日)你(?:妈|媽|老母)/u.test(
      hanzi,
   );
}

async function renderDictionaryRelatedWords(character, token) {
   const target = $("dd-related");
   if (!target) return;
   target.setAttribute("aria-busy", "true");
   target.innerHTML = '<span class="muted">Chargement des mots liés à ' + esc(character) + "…</span>";
   try {
      const related = await loadDictionaryCharacterLinks(character, 240);
      try { await loadHskSearchIndex(); } catch (error) { /* Le dictionnaire reste utilisable sans index HSK. */ }
      if (token !== dictionaryDetailToken || ddChar !== character || !$("dd-related")) return;
      target.setAttribute("aria-busy", "false");
      const words = related.words
         .filter(
            (word) =>
               word.simplified !== character &&
               Array.from(word.simplified).length > 1 &&
               !dictionaryRelatedWordIsVulgar(word),
         )
         .map(attachHskMetadata);
      const usefulHskLevel = (word) => {
         const exactLevel = verifiedHskLevel(word);
         if (exactLevel != null) return exactLevel;
         const withoutErhua = (value) => String(value || "").replace(/儿$/u, "");
         const normalizedWord = withoutErhua(word.simplified);
         const linkedForm = (hskDataState.searchEntries || []).find(
            (item) => withoutErhua(item.chinese) === normalizedWord,
         );
         return linkedForm ? linkedForm.firstHskLevel : null;
      };
      const compareUseful = (left, right) => {
         const leftLevel = usefulHskLevel(left) ?? 99;
         const rightLevel = usefulHskLevel(right) ?? 99;
         return leftLevel - rightLevel ||
            Number(!(left.definitionsFr || []).length) - Number(!(right.definitionsFr || []).length) ||
            Array.from(left.simplified).length - Array.from(right.simplified).length ||
            left.simplified.localeCompare(right.simplified, "zh");
      };
      const groups = [
         { label: "Commencent par " + character, words: words.filter((word) => word.simplified.startsWith(character)).sort(compareUseful).slice(0, 12) },
         { label: "Contiennent " + character, words: words.filter((word) => !word.simplified.startsWith(character)).sort(compareUseful).slice(0, 12) },
      ].filter((group) => group.words.length);
      const visibleWords = groups.flatMap((group) => group.words);
      if (!visibleWords.length) {
         target.innerHTML = '<span class="muted">Aucun mot lié classé par les sources.</span>';
         return;
      }
      target.innerHTML =
         '<div class="eyebrow">Mots associés utiles · présents dans les données</div>' +
         groups.map((group) => '<div class="dd-related-group"><small>' + esc(group.label) + '</small><div class="dd-related-list">' +
            group.words.map((word) => '<button class="chip hzchip" data-related-id="' + esc(word.id) + '">' + esc(word.simplified) + "</button>").join("") +
            "</div></div>").join("");
      target.querySelectorAll("[data-related-id]").forEach((button) => {
         button.onclick = () => {
            const word = visibleWords.find((item) => item.id === button.dataset.relatedId);
            if (!word) return;
            if (typeof openSearchDictionaryDetail === "function" && activeView === "search")
               openSearchDictionaryDetail(word, true);
            else openDictDetail(word);
         };
      });
   } catch (error) {
      if (token === dictionaryDetailToken && ddChar === character && $("dd-related")) {
         target.setAttribute("aria-busy", "false");
         target.innerHTML = '<span class="muted">Mots liés indisponibles.</span>';
      }
   }
}

function updateDictionaryPagingMode() {
   const locked = ddStrokeTab === "practice";
   const interaction = $("dd-character-interaction");
   if (interaction)
      interaction.classList.toggle("is-practice-paging-locked", locked);
   document.querySelectorAll("#dd-picker .hzchip, #seq-character-strip .hzchip").forEach((button) => {
      button.disabled = locked;
      button.setAttribute("aria-disabled", String(locked));
   });
}

function wireDictDetail(entry, characters, card, token, options) {
   wireDictionaryFrenchDefinitions();
   wireDictionaryPickerOverflowCue();
   if (characters.length) wireStrokeWorkspace();
   const completionState = options && options.characterCompletionState;
   let selectedCharacterIndex = 0;
   const selectCharacter = (index) => {
      const nextIndex = Math.max(0, Math.min(Number(index) || 0, characters.length - 1));
      const character = characters[nextIndex];
      selectedCharacterIndex = nextIndex;
      if (completionState) completionState.selectedIndex = nextIndex;
      updateCharacterNavigation(
         "dd-character",
         characters,
         nextIndex,
         "#dd-picker .hzchip",
      );
      const selectionKey =
         options && typeof options.strokeSelectionKey === "function"
            ? options.strokeSelectionKey(character, nextIndex)
            : characters.length > 1
              ? `${entry.id}:${nextIndex}:${character}`
              : character;
      const workspaceCharacters = options && Array.isArray(options.workspaceCharacters) && options.workspaceCharacters.length
         ? options.workspaceCharacters
         : characters;
      const workspaceIndex = options && Number.isInteger(options.sequenceIndex)
         ? options.sequenceIndex
         : nextIndex;
      loadDDChar(character, workspaceCharacters, {
         selectionKey,
         selectionIndex: workspaceIndex,
         stripSelectionIndex:
            options && Number.isInteger(options.sequenceIndex)
               ? options.sequenceIndex
               : nextIndex,
      });
      renderDictionaryRelatedWords(character, token);
      renderConfusablePairs(character);
      if (characters.length > 1 && (!completionState || completionState.ready))
         renderDictionaryCharacterStudyCard(character, token, completionState);
   };
   const moveCharacter = (delta) => {
      const nextIndex = selectedCharacterIndex + delta;
      if (nextIndex < 0 || nextIndex >= characters.length) return false;
      selectCharacter(nextIndex);
      return true;
   };
   if (characters.length) {
      selectCharacter(0);
      document.querySelectorAll("#dd-picker .hzchip").forEach((button) => {
         button.onclick = () => {
            if (ddStrokeTab === "practice") return;
            selectCharacter(Number(button.dataset.i));
         };
      });
      if ($("dd-character-prev")) $("dd-character-prev").onclick = () => moveCharacter(-1);
      if ($("dd-character-next")) $("dd-character-next").onclick = () => moveCharacter(1);
      setupSwipe(
         $("dd-character-interaction"),
         () => moveCharacter(1),
         () => moveCharacter(-1),
         {
            disabled: () => ddStrokeTab === "practice",
            canNavigate: (direction) =>
               direction === "left"
                  ? selectedCharacterIndex < characters.length - 1
                  : selectedCharacterIndex > 0,
         },
      );
      updateDictionaryPagingMode();
      if (characters.length === 1)
         renderDictionaryCharacterStudyCard(characters[0], token, {
            ready: true,
            map: new Map([[characters[0], { entry }]]),
         });
   }
   if (card) {
      if ($("dd-fav"))
         $("dd-fav").onclick = () => {
            card.fav = !card.fav;
            save();
            if (options && typeof options.onCardStateChange === "function")
               options.onCardStateChange();
            else openDictDetail(entry, options);
         };
      if ($("dd-acq"))
         $("dd-acq").onclick = () => {
            card.acquired = !card.acquired;
            if (card.acquired) card.due = null;
            save();
            if (options && typeof options.onCardStateChange === "function") {
               options.onCardStateChange();
            } else {
               openDictDetail(entry, options);
               refreshActive();
            }
         };
      if ($("dd-manage")) $("dd-manage").onclick = () => openDictionaryAddToWords(entry, options);
      if ($("dd-edit-personal")) $("dd-edit-personal").onclick = () => openCardDetail(card.id);
   }
   if ($("dd-addcard"))
      $("dd-addcard").onclick = () => openDictionaryAddToWords(entry, options);
   const closeDetail = () => {
         if (options && options.fromSearch && typeof closeSearchDictionaryDetail === "function")
            closeSearchDictionaryDetail();
         else closeSheet();
   };
   if ($("dd-close")) $("dd-close").onclick = closeDetail;
   if ($("dd-close-top")) $("dd-close-top").onclick = closeDetail;
   setTimeout(() => {
      const closeButton = $("dd-close-top");
      if (closeButton && sheetOpen()) closeButton.focus({ preventScroll: true });
   }, 0);
}

function strokeActionBarHtml(prefix, character, index, total, hasNavigation, positionClass) {
   return (
      '<div class="stroke-action-bar">' +
      '<button class="seal stroke-action-audio" id="' + prefix + '-audio" type="button" data-say="' + esc(character) +
      '" aria-label="Écouter ' + esc(character) + '">听</button>' +
      (hasNavigation
         ? '<strong class="character-nav-position' + positionClass + '" id="' + prefix +
           '-position" role="status" aria-live="polite" aria-atomic="true">' +
           esc(character) + " · " + (index + 1) + " / " + total + "</strong>"
         : '<span class="stroke-action-bar-spacer" aria-hidden="true"></span>') +
      '<div class="stroke-action-icons">' +
      '<button class="stroke-icon-button" id="dd-anim" type="button" aria-label="Rejouer l’animation" title="Rejouer l’animation">' +

      '<button class="stroke-icon-button" id="dd-write" type="button" aria-label="S’entraîner à écrire" title="S’entraîner à écrire">' +
      strokeWriteIconHtml() + "</button>" +
      "</div></div>"
   );
}

function strokeCharacterStageHtml(prefix, character, index, total, forceNavigation) {
   const previousDisabled = index <= 0 ? " disabled" : "";
   const nextDisabled = index >= total - 1 ? " disabled" : "";
   const positionClass = prefix === "seq" ? " s-count" : "";
   const hasNavigation = total > 1 || forceNavigation;
   return (
      strokeActionBarHtml(prefix, character, index, total, hasNavigation, positionClass) +
      '<div class="stroke-character-stage" id="' + prefix + '-stage">' +
      (hasNavigation ? '<button class="character-nav-button character-nav-previous" id="' + prefix +
         '-prev" type="button" aria-label="Caractère précédent"' + previousDisabled + ">" +
         characterChevronHtml("left") + "</button>" : "") +
      '<div class="stroke-character-stage-main">' + strokeBoxHtml() + "</div>" +
      (hasNavigation ? '<button class="character-nav-button character-nav-next" id="' + prefix +
         '-next" type="button" aria-label="Caractère suivant"' + nextDisabled + ">" +
         characterChevronHtml("right") + "</button>" : "") +
      "</div>"
   );
}

function updateCharacterNavigation(prefix, characters, index, stripSelector) {
   const previous = $(prefix + "-prev");
   const next = $(prefix + "-next");
   const position = $(prefix + "-position");
   const audio = $(prefix + "-audio");
   if (previous) previous.disabled = index <= 0;
   if (next) next.disabled = index >= characters.length - 1;
   if (position)
      position.textContent = `${characters[index]} · ${index + 1} / ${characters.length}`;
   if (audio) {
      audio.setAttribute("data-say", characters[index]);
      audio.setAttribute("aria-label", "Écouter " + characters[index]);
   }
   if (!stripSelector) return;
   document.querySelectorAll(stripSelector).forEach((button) => {
      const selected = Number(button.dataset.i) === index;
      button.setAttribute("aria-pressed", String(selected));
      button.setAttribute("aria-current", selected ? "true" : "false");
   });
}

function sequenceHistoryPayload() {
   return {
      moStudioSearch: true,
      mode: "sequence",
      q: srch.q,
      characters: seq ? seq.chars.join("") : "",
      sequenceIndex: seq ? seq.index : 0,
      strokeTab: ddStrokeTab,
   };
}

function openSequence(characters, options) {
   const settings = options || {};
   const list = Array.from(characters || []).filter((character) => /^\p{Script=Han}$/u.test(character));
   if (list.length < 2) return toast("La séquence demande au moins deux caractères Han réels.");
   resetStrokeAutoplaySelection();
   destroyStrokeWorkspace();
   seq = {
      chars: list,
      index: Math.max(0, Math.min(Number(settings.index) || 0, list.length - 1)),
      renderToken: 0,
   };
   if (settings.strokeTab && ["animation", "steps", "practice"].includes(settings.strokeTab)) {
      ddStrokeTab = settings.strokeTab;
   }
   closeSheet();
   document.body.classList.add("in-seq");
   document.body.style.overflow = "";
   if (!settings.fromHistory) history.pushState(sequenceHistoryPayload(), "");
   renderSequence();
   window.scrollTo(0, 0);
}

function teardownSequence() {
   destroyStrokeWorkspace();
   seq = null;
   document.body.classList.remove("in-seq");
   document.body.style.overflow = "";
}

function closeSequence(options) {
   const settings = options || {};
   if (!settings.fromHistory && history.state && history.state.mode === "sequence") {
      history.back();
      return;
   }
   teardownSequence();
   renderSearch();
}

function setSequenceIndex(index, focusStrip) {
   if (!seq) return;
   const next = Math.max(0, Math.min(index, seq.chars.length - 1));
   if (next === seq.index && $("seq-flash")) return;
   seq.index = next;
   history.replaceState(sequenceHistoryPayload(), "");
   renderSequence().then(() => {
      if (focusStrip) {
         const selected = document.querySelector('#seq-character-strip [aria-current="true"]');
         if (selected) selected.focus({ preventScroll: true });
      }
   });
}

function moveSequence(delta) {
   if (!seq) return;
   setSequenceIndex(seq.index + delta);
}

function setupSwipe(element, onLeft, onRight, options) {
   if (!element) return;
   const settings = options || {};
   const ignoredTarget =
      "button, input, textarea, select, a, label, [contenteditable='true'], [role='tab'], [role='slider'], .stroke-focus";
   const profiles = {
      touch: { recognition: 8, navigation: 34, dominance: 1.18, fastMinimum: 25, velocity: 0.5, maximumOffset: 34 },
      pen: { recognition: 9, navigation: 39, dominance: 1.22, fastMinimum: 29, velocity: 0.55, maximumOffset: 31 },
      mouse: { recognition: 12, navigation: 50, dominance: 1.35, fastMinimum: 42, velocity: 0.7, maximumOffset: 28 },
   };
   let pointerId = null;
   let pointerType = "mouse";
   let startX = 0;
   let startY = 0;
   let startTime = 0;
   let currentX = 0;
   let currentY = 0;
   let horizontalGesture = false;
   let verticalGesture = false;
   let transitioning = false;
   let suppressClickUntil = 0;
   const disabled = () =>
      typeof settings.disabled === "function" && settings.disabled();
   const setOffset = (value) =>
      element.style.setProperty("--character-swipe-offset", value + "px");
   const clearSelection = () => {
      const selection = window.getSelection && window.getSelection();
      if (selection && selection.rangeCount) selection.removeAllRanges();
   };
   const finish = (event, navigate) => {
      if (pointerId == null || (event && event.pointerId !== pointerId)) return;
      const deltaX = currentX - startX;
      const deltaY = currentY - startY;
      const profile = profiles[pointerType] || profiles.mouse;
      const duration = Math.max(1, (event?.timeStamp || performance.now()) - startTime);
      const speed = Math.abs(deltaX) / duration;
      const qualifies =
         horizontalGesture && Math.abs(deltaX) > Math.abs(deltaY) * profile.dominance &&
         (Math.abs(deltaX) >= profile.navigation ||
            (Math.abs(deltaX) >= profile.fastMinimum && speed >= profile.velocity));
      if (horizontalGesture || Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4)
         clearSelection();
      const finishedPointerId = pointerId;
      pointerId = null;
      horizontalGesture = false;
      verticalGesture = false;
      try {
         if (element.hasPointerCapture(finishedPointerId)) element.releasePointerCapture(finishedPointerId);
      } catch (error) {}
      const direction = deltaX < 0 ? "left" : "right";
      const canNavigate =
         qualifies && navigate && !disabled() &&
         (!settings.canNavigate || settings.canNavigate(direction));
      if (canNavigate) {
         suppressClickUntil = performance.now() + 160;
         transitioning = true;
         element.classList.remove("is-pointer-swiping");
         element.classList.add("is-swipe-committing");
         setOffset(direction === "left" ? -28 : 28);
         setTimeout(() => {
            if (direction === "left") onLeft();
            else onRight();
            element.classList.remove("is-swipe-committing");
            element.classList.add("is-swipe-resetting");
            setOffset(0);
            transitioning = false;
            setTimeout(() => {
               element.classList.remove("is-swipe-resetting");
            }, 130);
         }, 80);
      } else {
         element.classList.remove("is-pointer-swiping");
         element.classList.add("is-swipe-resetting");
         setOffset(0);
         setTimeout(() => element.classList.remove("is-swipe-resetting"), 130);
      }
   };
   element.addEventListener("pointerdown", (event) => {
      if (pointerId != null || transitioning || !event.isPrimary || disabled()) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const blocked = event.target.closest(ignoredTarget);
      if (blocked && !event.target.closest(".stroke-panel")) return;
      pointerId = event.pointerId;
      pointerType = profiles[event.pointerType] ? event.pointerType : "mouse";
      startX = currentX = event.clientX;
      startY = currentY = event.clientY;
      startTime = event.timeStamp || performance.now();
      horizontalGesture = false;
      verticalGesture = false;
      try { element.setPointerCapture(pointerId); } catch (error) {}
   });
   element.addEventListener("pointermove", (event) => {
      if (pointerId == null || event.pointerId !== pointerId) return;
      currentX = event.clientX;
      currentY = event.clientY;
      const deltaX = currentX - startX;
      const deltaY = currentY - startY;
      const profile = profiles[pointerType] || profiles.mouse;
      if (!horizontalGesture && !verticalGesture && Math.abs(deltaY) >= profile.recognition && Math.abs(deltaY) > Math.abs(deltaX) * 1.1)
         verticalGesture = true;
      if (!horizontalGesture && !verticalGesture && Math.abs(deltaX) >= profile.recognition && Math.abs(deltaX) > Math.abs(deltaY) * profile.dominance) {
         horizontalGesture = true;
         element.classList.add("is-pointer-swiping");
         clearSelection();
         try { element.setPointerCapture(pointerId); } catch (error) {}
      }
      if (horizontalGesture) {
         const direction = deltaX < 0 ? "left" : "right";
         const atLimit = settings.canNavigate && !settings.canNavigate(direction);
         const distance = deltaX * (atLimit ? 0.12 : 0.38);
         setOffset(Math.max(-profile.maximumOffset, Math.min(profile.maximumOffset, distance)));
         clearSelection();
         event.preventDefault();
      }
   });
   element.addEventListener("pointerup", (event) => {
      if (pointerId == null || event.pointerId !== pointerId) return;
      currentX = event.clientX;
      currentY = event.clientY;
      if (horizontalGesture) event.preventDefault();
      finish(event, true);
   });
   element.addEventListener("pointercancel", (event) => finish(event, false));
   element.addEventListener("lostpointercapture", (event) => finish(event, false));
   element.addEventListener("dragstart", (event) => event.preventDefault());
   element.addEventListener("click", (event) => {
      if (performance.now() > suppressClickUntil) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      suppressClickUntil = 0;
   }, true);
}

async function renderSequence() {
   if (!seq) return;
   const preserveScroll = !!$("seq-flash");
   const previousScrollY = window.scrollY;
   destroyStrokeWorkspace();
   const current = seq;
   const token = ++current.renderToken;
   const index = current.index;
   const character = current.chars[index];
   if (!preserveScroll)
      $("view").innerHTML =
         '<section class="sess"><div class="dictionary-loading"><span class="ink-loader"></span><b>Chargement de ' +
         esc(character) + "…</b></div></section>";
   const entry = await seqEntry(character).catch(() => normalizeDetailEntry({ hz: character }));
   if (!seq || seq !== current || token !== current.renderToken) return;
   const card = findPersonalCardForEntry(entry);
   const pinyin = dictionaryEntryPinyinText(entry);
   const definition = dictionaryResultDefinition(entry);
   $("view").innerHTML =
      '<section class="sess"><div class="s-top"><button class="s-x" id="seq-exit" aria-label="Quitter la séquence">×</button>' +
      '<div class="s-scope">Séquence · ' + esc(current.chars.join("")) + "</div></div>" +
      '<div class="s-bar"><i style="width:' + (((index + 1) / current.chars.length) * 100).toFixed(1) + '%"></i></div>' +
      '<nav class="seq-character-strip" id="seq-character-strip" aria-label="Caractères de la séquence">' +
      current.chars.map((item, index) =>
         '<button class="chip hzchip" type="button" data-i="' + index + '" data-character="' + esc(item) +
         '" aria-current="' + String(index === current.index) + '" aria-label="Afficher ' + esc(item) +
         ', position ' + (index + 1) + " sur " + current.chars.length + '">' + esc(item) + "</button>",
      ).join("") + "</nav>" +
      '<div class="flash card seq-card character-swipe-zone" id="seq-flash"><button class="seal fl-seal" data-say="' +
      esc(character) + '" aria-label="Écouter ' + esc(character) + '">听</button><div class="hanzi ink-in" data-say="' + esc(character) + '">' +
      esc(character) + "</div>" +
      (pinyin ? '<div class="pinyin">' + colorPinyin(pinyin) + "</div>" : "") +
      '<div class="fr">' +
      (definition.english ? '<small class="search-fallback">Traduction française indisponible</small>' : "") +
      (definition.englishText ? '<span>Sens anglais de référence · ' + esc(definition.englishText) + "</span>" : esc(definition.text)) + "</div>" +
       '<div class="eyebrow">Ordre des traits</div>' + strokeCharacterStageHtml("seq", character, index, current.chars.length) +
       '<div class="seq-meta">' + verifiedHskBadges(entry) + "</div>" +
       (card
          ? cardActionsHtml(card)
          : '<div class="sh-btns"><button class="btn primary wide" id="dd-addcard">+ Ajouter à Mes mots</button></div>') +
      "</div></section>";
   wireDictDetail(entry, [character], card, ++dictionaryDetailToken, {
      strokeSelectionKey: () => `sequence:${index}:${character}`,
      sequenceIndex: index,
      workspaceCharacters: current.chars,
      onCardStateChange: () => renderSequence(),
   });
   $("seq-exit").onclick = () => closeSequence();
   $("seq-prev").onclick = () => moveSequence(-1);
   $("seq-next").onclick = () => moveSequence(1);
   document.querySelectorAll("#seq-character-strip [data-i]").forEach((button) => {
      button.disabled = ddStrokeTab === "practice";
      button.setAttribute("aria-disabled", String(ddStrokeTab === "practice"));
      button.onclick = () => {
         if (ddStrokeTab === "practice") return;
         setSequenceIndex(Number(button.dataset.i), true);
      };
   }, { passive: false });
   setupSwipe(
      $("seq-flash"),
      () => moveSequence(1),
      () => moveSequence(-1),
      {
         disabled: () => ddStrokeTab === "practice",
         canNavigate: (direction) => direction === "left"
            ? current.index < current.chars.length - 1
            : current.index > 0,
      },
   );
   if (preserveScroll)
      requestAnimationFrame(() => {
         const maximum = Math.max(0, document.documentElement.scrollHeight - innerHeight);
         window.scrollTo(0, Math.min(previousScrollY, maximum));
      });
   const nextCharacter = current.chars[index + 1];
   if (nextCharacter) {
      preloadStrokeCharacterData(nextCharacter);
      seqEntry(nextCharacter).catch(() => null);
   }
}

"use strict";

const LEARNING_UNITS_ROOT = (() => {
   const portable = /\/dist\/[^/]+\.html$/u.test(new URL(document.baseURI).pathname);
   return new URL(
      portable ? "../data/generated/learning-units/" : "data/generated/learning-units/",
      document.baseURI,
   ).href;
})();

const learningUnitsState = {
   manifest: null,
   manifestPending: null,
   index: null,
   indexById: null,
   indexPending: null,
   chunkCache: new Map(),
   chunkPending: new Map(),
   unitCache: new Map(),
   graph: null,
   graphPending: null,
};

async function loadLearningUnitsManifest() {
   if (learningUnitsState.manifest) return learningUnitsState.manifest;
   if (learningUnitsState.manifestPending) return learningUnitsState.manifestPending;
   learningUnitsState.manifestPending = fetch(
      new URL("manifest.json", LEARNING_UNITS_ROOT).href,
      { cache: "default" },
   )
      .then(async (response) => {
         if (!response.ok) throw new Error("HTTP " + response.status);
         const manifest = await response.json();
         if (manifest?.format !== "mo-studio-learning-units" || manifest.schemaVersion !== 1)
            throw new Error("Manifeste des unités d'apprentissage incompatible.");
         learningUnitsState.manifest = manifest;
         return manifest;
      })
      .finally(() => {
         learningUnitsState.manifestPending = null;
      });
   return learningUnitsState.manifestPending;
}

async function loadLearningUnitsIndex() {
   if (learningUnitsState.index) return learningUnitsState.index;
   if (learningUnitsState.indexPending) return learningUnitsState.indexPending;
   learningUnitsState.indexPending = (async () => {
      const manifest = await loadLearningUnitsManifest();
      const response = await fetch(
         new URL(manifest.files.unitsIndex.path, LEARNING_UNITS_ROOT).href,
         { cache: "default" },
      );
      if (!response.ok) throw new Error("HTTP " + response.status);
      const index = await response.json();
      if (!Array.isArray(index) || index.length !== manifest.files.unitsIndex.count)
         throw new Error("Index des unités d'apprentissage incohérent.");
      learningUnitsState.index = index;
      learningUnitsState.indexById = new Map(index.map((row, position) => [row.id, position]));
      return index;
   })().finally(() => {
      learningUnitsState.indexPending = null;
   });
   return learningUnitsState.indexPending;
}

async function loadLearningUnitsGraph() {
   if (learningUnitsState.graph) return learningUnitsState.graph;
   if (learningUnitsState.graphPending) return learningUnitsState.graphPending;
   learningUnitsState.graphPending = (async () => {
      const manifest = await loadLearningUnitsManifest();
      const response = await fetch(new URL(manifest.files.graph.path, LEARNING_UNITS_ROOT).href, { cache: "default" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const graph = await response.json();
      if (graph?.format !== "mo-studio-learning-units-graph" || graph.schemaVersion !== 1 || !graph.prerequisites)
         throw new Error("Graphe des unités d'apprentissage incompatible.");
      learningUnitsState.graph = graph;
      return graph;
   })().finally(() => {
      learningUnitsState.graphPending = null;
   });
   return learningUnitsState.graphPending;
}

async function loadLearningUnitsChunk(key) {
   if (learningUnitsState.chunkCache.has(key)) return learningUnitsState.chunkCache.get(key);
   if (learningUnitsState.chunkPending.has(key)) return learningUnitsState.chunkPending.get(key);
   const request = (async () => {
      try {
         const manifest = await loadLearningUnitsManifest();
         const relativePath = manifest.files.units.chunked
            ? manifest.files.units.chunkPathTemplate.replace("{key}", key)
            : manifest.files.units.path;
         const response = await fetch(new URL(relativePath, LEARNING_UNITS_ROOT).href, { cache: "default" });
         if (!response.ok) throw new Error("HTTP " + response.status);
         const chunk = await response.json();
         if (!Array.isArray(chunk)) throw new Error("Fragment d'unités d'apprentissage invalide.");
         learningUnitsState.chunkCache.set(key, chunk);
         return chunk;
      } catch (error) {
         return [];
      }
   })().finally(() => {
      learningUnitsState.chunkPending.delete(key);
   });
   learningUnitsState.chunkPending.set(key, request);
   return request;
}

async function scanAllLearningUnitsChunksForUnit(unitId, manifest) {
   const keys = manifest.files.units.chunked
      ? manifest.files.units.chunks.map((chunk) => chunk.key)
      : ["__single__"];
   for (const key of keys) {
      const chunk = await loadLearningUnitsChunk(key);
      const found = chunk.find((row) => row.id === unitId);
      if (found) return found;
   }
   return null;
}

async function loadLearningUnit(unitId) {
   if (learningUnitsState.unitCache.has(unitId)) return learningUnitsState.unitCache.get(unitId);
   const manifest = await loadLearningUnitsManifest();
   await loadLearningUnitsIndex();
   const position = learningUnitsState.indexById.get(unitId);
   let unit = null;
   if (position != null) {
      const key = manifest.files.units.chunked
         ? String(Math.floor(position / (manifest.files.units.chunks[0]?.count || 30))).padStart(3, "0")
         : "__single__";
      const chunk = await loadLearningUnitsChunk(key);
      unit = chunk.find((row) => row.id === unitId) || null;
   }
   if (!unit) unit = await scanAllLearningUnitsChunksForUnit(unitId, manifest);
   learningUnitsState.unitCache.set(unitId, unit);
   return unit;
}

"use strict";

let hsk1RootHanziSet = null;
let hsk1RootPending = null;

function hsk1RootUrl() {

async function loadHsk1RootHanziSet() {
   if (hsk1RootHanziSet) return hsk1RootHanziSet;
   if (hsk1RootPending) return hsk1RootPending;
   hsk1RootPending = fetch(hsk1RootUrl(), { cache: "default" })
      .then((response) => {
         if (!response.ok) throw new Error("HTTP " + response.status);
         return response.json();
      })
      .then((data) => {
         const cards = Array.isArray(data?.cards) ? data.cards : [];

         return hsk1RootHanziSet;

         hsk1RootHanziSet = new Set();
         return hsk1RootHanziSet;
      })
      .finally(() => {
         hsk1RootPending = null;
      });
   return hsk1RootPending;
}

"use strict";

/* ================= état de la leçon ================= */
let lesson = null;
let lessonRenderTokenSeq = 0;
let lessonFamilyRenderToken = 0;
let lessonWordsRenderToken = 0;

function lessonHistoryPayload() {
   return {
      moStudioUnits: true,
      mode: "lesson",
      unitId: lesson?.unit?.id || null,
      step: lesson?.step,
      historyDepth: lesson?.historyDepth || 1,
      moStudioView: lesson?.openedFromView || "units",
   };
}

/* ================= filtrage des membres : variantes traditionnelles ================= */
async function dictionaryWordEntriesForCharacter(character) {
   try {
      const index = await loadDictionaryIndex("exactHanzi", false);
      const references = index[character] || [];
      if (!references.length) return [];
      const entries = await loadDictionaryEntriesByReferences(references);
      return entries.filter((entry) => entry.entryType === "word" && entry.simplified === character);
   } catch (error) {
      return [];
   }
}

function simplifiedTraditionalPairFor(character, entries) {
   const wordSelf = entries.find((entry) => entry.traditional && entry.traditional !== character);
   return wordSelf ? wordSelf.traditional : null;
}

async function prepareLessonMembers(unit) {
   const characters = unit.members.map((member) => member.character);
   const pairs = await Promise.all(
      characters.map(async (character) => {
         const entries = await dictionaryWordEntriesForCharacter(character);
         return simplifiedTraditionalPairFor(character, entries);
      }),
   );
   const excluded = new Set();
   characters.forEach((character, i) => {
      if (pairs[i] && characters.includes(pairs[i])) excluded.add(pairs[i]);
   });
   return unit.members.filter((member) => !excluded.has(member.character));
}

/* ================= composant autonome (portail de création de carte) ================= */
function meaningfulDictionarySenses(values) {
   return (values || [])
      .flatMap((definition) => String(definition || "").split(/\s*;\s*/u))
      .map((sense) => sense.trim())
      .filter(
         (sense) =>
            sense &&
            !/radical/i.test(sense) &&
            !/^see also\b/i.test(sense) &&
            !/^also pr\./i.test(sense) &&
            !/^also (written|spelled)\b/i.test(sense) &&
            !/^(old|archaic|variant) (form|writing) of\b/i.test(sense) &&
            !/^abbr\. for\b/i.test(sense),
      );
}

async function hasIndependentDictionaryMeaning(character) {
   try {
      const index = await loadDictionaryIndex("exactHanzi", false);
      const references = index[character] || [];
      if (!references.length) return false;
      const entries = (await loadDictionaryEntriesByReferences(references)).filter(
         (entry) => entry.simplified === character,
      );
      return entries.some(
         (entry) =>
            meaningfulDictionarySenses(entry.definitionsFr).length ||
            meaningfulDictionarySenses(entry.definitionsEn).length,
      );
   } catch (error) {
      return false;
   }
}

   );
}

async function openLesson(unitId, options) {
   const settings = options || {};
   destroyStrokeWorkspace();
   lesson = {
      unit: null,
      step: 1,
      historyDepth: 1,
      openedFromView: activeView,
      membersPromise: null,
      members: null,
      compositions: null,
      selectedWords: null,
      quizQuestions: null,
      preview: null,
      renderToken: ++lessonRenderTokenSeq,
   };
   document.body.classList.add("in-lesson");
   if (!settings.fromHistory) history.pushState(lessonHistoryPayload(), "");
   $("view").innerHTML = lessonLoadingShellHtml();
   const token = lesson.renderToken;
   const unit = await loadLearningUnit(unitId);
   if (!lesson || lesson.renderToken !== token) return;
   if (!unit) {
      $("view").innerHTML = lessonErrorShellHtml();
      if ($("lesson-error-back")) $("lesson-error-back").onclick = () => closeLesson();
      return;
   }
   lesson.unit = unit;
   if (!settings.fromHistory) history.replaceState(lessonHistoryPayload(), "");
   lesson.membersPromise = prepareLessonMembers(unit)
      .catch(() => unit.members)
      .then((members) => {
         if (!lesson || lesson.renderToken !== token) return;
         lesson.members = members;
         if (lesson.step !== 1) renderLesson();
      });
   renderLesson();
   window.scrollTo(0, 0);
}

function goToLessonStep(step) {
   if (!lesson) return;
   lesson.step = step;
   lesson.historyDepth++;
   history.pushState(lessonHistoryPayload(), "");
   renderLesson();
   window.scrollTo(0, 0);
}

function teardownLesson() {
   destroyStrokeWorkspace();
   lesson = null;
   document.body.classList.remove("in-lesson");
}

function closeLesson(options) {
   const settings = options || {};
   if (!settings.fromHistory && lesson && history.state && history.state.mode === "lesson") {
      history.go(-lesson.historyDepth);
      return;
   }
   teardownLesson();
   render();
   window.scrollTo(0, 0);
}

function renderLesson() {
   if (!lesson || !lesson.unit) return;
   if (lesson.step === 1) renderLessonStepComponent();
   else if (lesson.step === 2) renderLessonStepFamily();
   else if (lesson.step === 3) renderLessonStepWords();
   else if (lesson.step === 4) renderLessonStepQuiz();
   else renderLessonRecap();
}

/* ================= étape 3/4 — mots réels ================= */
function resolveLessonWords(members, hsk1Set) {
   const byHanzi = new Map();
   members.forEach((member) => {
      (member.exampleWords || []).forEach((word) => {
         if (!word || !word.hanzi || !word.pinyin || !word.gloss) return;
         if (word.hanzi === member.character || byHanzi.has(word.hanzi)) return;
         byHanzi.set(word.hanzi, {
            hanzi: word.hanzi,
            pinyin: word.pinyin,
            gloss: word.gloss,
            sourceUtility: member.utilityScore,
         });
      });
   });
   const tierOf = (word) =>
      findReusableCard({ chinese: word.hanzi, pinyin: word.pinyin, translation: word.gloss })
         ? 0
         : hsk1Set.has(word.hanzi)
           ? 1
           : 2;
   return Array.from(byHanzi.values())
      .map((word) => ({ ...word, tier: tierOf(word) }))
      .sort(
         (a, b) =>
            a.tier - b.tier ||
            b.sourceUtility - a.sourceUtility ||
            Array.from(a.hanzi).length - Array.from(b.hanzi).length ||
            a.hanzi.localeCompare(b.hanzi, "zh"),
      )
      .slice(0, 5);
}

async function ensureLessonWordSelection() {
   if (lesson.selectedWords) return lesson.selectedWords;
   const hsk1Set = await loadHsk1RootHanziSet();
   lesson.selectedWords = resolveLessonWords(lesson.members, hsk1Set);
   return lesson.selectedWords;
}

function lessonCategoryName(unit) {
   const type = unit.type === "phonetic" ? "phonétique" : "sémantique";
   const part = unit.partCount > 1 ? " " + unit.partIndex + "/" + unit.partCount : "";
   return unit.component + (unit.componentPinyin ? " · " + unit.componentPinyin : "") + " (" + type + part + ")";
}

async function buildLessonImportPayload(unit, members) {
   const byHanzi = new Map();
   const add = (chinese, pinyin, translation) => {
      if (!chinese || !pinyin || !translation || byHanzi.has(chinese)) return;
      byHanzi.set(chinese, { chinese, pinyin, translation, tags: ["parcours"] });
   };
   if (await hasIndependentDictionaryMeaning(unit.component)) add(unit.component, unit.componentPinyin, unit.componentGloss);
   members.forEach((member) => add(member.character, member.pinyin, member.gloss));
   (await ensureLessonWordSelection()).forEach((word) => add(word.hanzi, word.pinyin, word.gloss));
   return {
      pack: {
         name: "Parcours",
         description: "Cartes créées depuis les leçons du Parcours.",
         categories: [{ name: lessonCategoryName(unit), words: Array.from(byHanzi.values()) }],
      },
   };
}

function lessonRecapBodyHtml(preview) {
   const words = preview.packs[0]?.categories[0]?.words || [];
   if (!words.length) {
      return (
         '<div class="card pad lesson-recap">' +
         "<p>Aucun mot ni caractère de cette leçon ne peut être ajouté à Mes mots pour l’instant.</p>" +
         '<div class="lesson-recap-actions"><button class="btn primary wide" id="lesson-finish">Terminer</button></div></div>'
      );
   }
   const newCount = words.filter((word) => !word.existingCardId).length;
   const reuseCount = words.length - newCount;
   return (
      '<div class="card pad lesson-recap"><div class="lesson-recap-list">' +
      words.map(lessonRecapRowHtml).join("") +
      '</div><p class="lesson-recap-total">' +

      (words.length > 1 ? " cartes" : " carte") +

      words.length +
      (words.length > 1 ? " mots" : " mot") +

   );
}

function wireLessonRecap() {
   if ($("lesson-exit")) $("lesson-exit").onclick = () => closeLesson();
   if ($("lesson-finish")) $("lesson-finish").onclick = () => commitLesson();
}

async function renderLessonRecap() {
   const unit = lesson.unit;
   $("view").innerHTML = lessonRecapShellHtml(
      unit,
      '<div class="dictionary-loading"><span class="ink-loader"></span><b>Préparation du récapitulatif…</b></div>',
   );
   if ($("lesson-exit")) $("lesson-exit").onclick = () => closeLesson();
   const token = lesson.renderToken;
   const payload = await buildLessonImportPayload(unit, lesson.members);
   const preview = await buildPackImportPreview(payload, "json");
   if (!lesson || lesson.renderToken !== token || lesson.step !== "recap") return;
   lesson.preview = preview;
   $("view").innerHTML = lessonRecapShellHtml(unit, lessonRecapBodyHtml(preview));
   wireLessonRecap();
}

function commitLesson() {
   const preview = lesson && lesson.preview;
   const unit = lesson && lesson.unit;
   const words = preview && preview.packs[0]?.categories[0]?.words;
   if (!words || !words.length) {
      if (unit) recordLessonCompletion(unit.id);
      closeLesson();
      return;
   }
   const result = applyPackImport(preview, { mode: "merge", importMissing: true });
   if (unit) recordLessonCompletion(unit.id);
   toast(
      result.added +
         " nouvelle" +
         (result.added > 1 ? "s" : "") +
         " carte" +
         (result.added > 1 ? "s" : "") +
         ", " +
         result.reused +
         " déjà présente" +
         (result.reused > 1 ? "s" : "") +
         " — ajoutées à « Parcours ».",
   );
   closeLesson();
}

const UNITS_PAGE_SIZE = 60;

let unitsPickerRenderToken = 0;

}

function unitsPickerRowHtml(row, index) {
   const part =
      row.partCount > 1

         : "";

   return (
      '<button class="lu-row" type="button" data-lu-index="' +
      index +

      esc(row.component) +

function filteredLearningUnits(rows) {
   const visible = normalizeVisibleWhitespace(unitsPickerFilter).toLowerCase();
   if (!visible) return rows;
   const plain = normalizePinyinPlain(visible);
   const translation = normalizeTranslation(visible);
   return rows.filter(
      (row) =>
         row.component.includes(visible) ||
         (plain && normalizePinyinPlain(row.componentPinyin || "").includes(plain)) ||
         (translation && normalizeTranslation(row.componentGloss || "").includes(translation)),
   );
}

function wireLearningUnitsPicker(filtered) {
   const search = $("units-filter");
   if (search) {
      search.oninput = () => {
         unitsPickerFilter = search.value;
         unitsPickerVisible = UNITS_PAGE_SIZE;
         renderLearningUnitsList();
      };
   }
   document.querySelectorAll("[data-lu-index]").forEach((button) => {
      button.onclick = () => {
         const row = filtered[Number(button.dataset.luIndex)];
         if (row) openLesson(row.id);
      };
   });
   if ($("units-show-more"))
      $("units-show-more").onclick = () => {
         unitsPickerVisible += UNITS_PAGE_SIZE;
         renderLearningUnitsList();
      };
}

function renderLearningUnitsList() {
   const target = $("units-list");
   if (!target) return;
   const rows = learningUnitsState.index || [];
   const filtered = filteredLearningUnits(rows);
   const visible = filtered.slice(0, unitsPickerVisible);
   target.innerHTML =
      '<div class="path-level-tools"><label for="units-filter">Filtrer</label>' +
      '<input class="search" id="units-filter" type="search" placeholder="composant, pinyin ou sens…" value="' +

"use strict";

/* ================= « connu » : monotone, dérivé du réel ================= */
function learningPathSufficientProgress(card) {
   // acquired : bouton "Maîtrisé" (js/views/library.js). lvl>=2 : au moins une note
   // correct/facile (js/state.js applyGrade). reviewHistory : plus haut niveau jamais atteint —
   // indispensable car applyGrade fait retomber lvl sur une note "difficile"/"raté" sans tenir
   // compte du niveau précédent ; un composant acquis ne doit jamais se reperdre.
   return (
      card.acquired === true ||
      (card.lvl || 0) >= 2 ||
      (card.reviewHistory || []).some((entry) => (entry.level || 0) >= 2)
   );
}

function learningPathKnownComponents(cards, completedLessons, unitsIndex, graph) {
   const known = new Map(); // composant -> "lesson" | "card"
   const unitById = new Map(unitsIndex.map((unit) => [unit.id, unit]));
   Object.keys(completedLessons).forEach((unitId) => {
      const unit = unitById.get(unitId);
      if (unit) known.set(unit.component, "lesson");
   });
   cards.forEach((card) => {
      if (!learningPathSufficientProgress(card)) return;
      Array.from(String(card.hz || ""))
         .filter((character) => HAN_PATTERN.test(character))
         .forEach((character) => {
            if (!known.has(character)) known.set(character, "card");
            (graph.prerequisites[character] || []).forEach((component) => {
               if (!known.has(component)) known.set(component, "card");
            });
         });
   });
   return known;
}

/* ================= périmètre ================= */
function learningPathScopeCharacters(scope, { cards, unitsIndex, hskChars }) {
   if (scope.mode === "all") {
      const all = new Set();
      unitsIndex.forEach((unit) => unit.memberCharacters.forEach((character) => all.add(character)));
      return all;
   }
   if (scope.mode === "hsk") return hskChars || new Set();
   const characters = new Set(); // "personal" (défaut)
   cards.forEach((card) =>
      Array.from(String(card.hz || ""))
         .filter((character) => HAN_PATTERN.test(character))
         .forEach((character) => characters.add(character)),
   );
   return characters;
}

/* ================= annotation des unités ================= */
function learningPathAnnotateUnits(unitsInScope, known, completedLessons) {
   return unitsInScope.map((unit) => {
      const completed = Object.prototype.hasOwnProperty.call(completedLessons, unit.id);
      const missing = completed ? [] : unit.prerequisites.filter((component) => !known.has(component));
      return { unit, completed, missing, available: !completed && missing.length === 0 };
   });
}

function learningPathPickRecommended(annotated) {
   const candidates = annotated.filter((entry) => entry.available);
   if (!candidates.length) return null;
   return candidates
      .slice()
      .sort(
         (a, b) =>
            b.unit.utilityScore - a.unit.utilityScore ||
            a.unit.component.localeCompare(b.unit.component, "zh") ||
            a.unit.id.localeCompare(b.unit.id),
      )[0].unit;
}

/* ================= la carte : regroupée par composant, jamais par unité brute ================= */
function learningPathBuckets(annotated, known) {
   const byComponent = new Map();
   annotated.forEach((entry) => {
      if (!byComponent.has(entry.unit.component)) byComponent.set(entry.unit.component, []);
      byComponent.get(entry.unit.component).push(entry);
   });
   const acquis = [];
   const disponibles = [];
   const bientot = [];
   const verrouillees = [];
   byComponent.forEach((entries, component) => {
      const remaining = entries.filter((entry) => !entry.completed);
      if (known.has(component)) {
         const bestUnit = remaining.length
            ? remaining.slice().sort((a, b) => b.unit.utilityScore - a.unit.utilityScore)[0].unit
            : null;
         acquis.push({ component, remainingCount: remaining.length, bestUnit });
         return;
      }
      if (!remaining.length) return; // ne se produit jamais : terminer une unité rend son composant connu
      const missing = remaining[0].missing; // identique pour toutes les parts d'un même composant (vérifié)
      const bestUnit = remaining.slice().sort((a, b) => b.unit.utilityScore - a.unit.utilityScore)[0].unit;
      const charactersWaiting = new Set(remaining.flatMap((entry) => entry.unit.memberCharacters)).size;
      const row = { component, missing, bestUnit, charactersWaiting };
      if (missing.length === 0) disponibles.push(row);
      else if (missing.length === 1) bientot.push(row);
      else verrouillees.push(row);
   });
   const byComponentLocale = (a, b) => a.component.localeCompare(b.component, "zh");
   acquis.sort(byComponentLocale);
   disponibles.sort((a, b) => b.bestUnit.utilityScore - a.bestUnit.utilityScore || byComponentLocale(a, b));
   bientot.sort(
      (a, b) =>
         b.charactersWaiting - a.charactersWaiting ||
         b.bestUnit.utilityScore - a.bestUnit.utilityScore ||
         byComponentLocale(a, b),
   );
   verrouillees.sort(
      (a, b) => a.missing.length - b.missing.length || b.bestUnit.utilityScore - a.bestUnit.utilityScore || byComponentLocale(a, b),
   );
   return { acquis, disponibles, bientot, verrouillees };
}

/* ================= point d'entrée ================= */
async function computeLearningPath(scopeOverride) {
   const scope = scopeOverride || getCourseScope();
   const [unitsIndex, graph, hskChars] = await Promise.all([
      loadLearningUnitsIndex(),
      loadLearningUnitsGraph(),
      scope.mode === "hsk" ? loadHskCumulativeCharacters(scope.hskLevel) : Promise.resolve(null),
   ]);
   const known = learningPathKnownComponents(db.cards, courseProgress.completedLessons, unitsIndex, graph);
   const scopeCharacters = learningPathScopeCharacters(scope, { cards: db.cards, unitsIndex, hskChars });
   const unitsInScope = unitsIndex.filter((unit) => unit.memberCharacters.some((character) => scopeCharacters.has(character)));
   const annotated = learningPathAnnotateUnits(unitsInScope, known, courseProgress.completedLessons);
   return {
      scope,
      scopeCharacterCount: scopeCharacters.size,
      recommended: learningPathPickRecommended(annotated),
      buckets: learningPathBuckets(annotated, known),
      progress: {
         completed: annotated.filter((entry) => entry.completed).length,
         total: annotated.length,
      },
   };
}

"use strict";

const RADICAL_PAGE_SIZE = 32;

let radicalBrowser = {
   active: false,
   radical: null,
   catalog: null,
   filter: "",
   visible: RADICAL_PAGE_SIZE,
   members: null,
};
const radicalMembersCache = new Map();

function radicalHistoryPayload(radical) {
   return {
      moStudioSearch: true,
      mode: "radical",
      q: srch.q,
      radical: radical || null,
      scrollY: window.scrollY,
   };
}

function setRadicalPanelVisible(active) {
   radicalBrowser.active = active;
   const normal = $("dsearch-normal");
   const panel = $("dradical-panel");
   if (normal) normal.hidden = active;
   if (panel) panel.hidden = !active;
   const toggle = $("search-mode-toggle");
   if (toggle) toggle.setAttribute("aria-pressed", String(active));
}

function radicalLoadingHtml(label) {
   return (
      '<div class="dictionary-loading" role="status" aria-live="polite"><span class="ink-loader" aria-hidden="true"></span><b>' +
      esc(label || "Chargement des clés…") + "</b></div>"
   );
}

async function openRadicalMode(options) {
   const settings = options || {};
   setRadicalPanelVisible(true);
   if (!settings.fromHistory) history.pushState(radicalHistoryPayload(null), "");
   radicalBrowser.radical = null;
   radicalBrowser.filter = "";
   const panel = $("dradical-panel");
   if (panel) panel.innerHTML = radicalLoadingHtml();
   try {
      radicalBrowser.catalog = await loadRadicalCatalog();
   } catch (error) {
      radicalBrowser.catalog = [];
   }
   if (radicalBrowser.active && !radicalBrowser.radical) renderRadicalTable();
}

function radicalGroupHeading(strokeCount) {
   if (strokeCount == null) return "Nombre de traits inconnu";
   return strokeCount + " trait" + (strokeCount > 1 ? "s" : "");
}

function radicalMatchesFilter(row, filter) {
   if (!filter) return true;
   const needle = filter.trim().toLowerCase();
   if (!needle) return true;
   if (row.radical.includes(filter.trim())) return true;
   if (row.sens && row.sens.toLowerCase().includes(needle)) return true;
   if (row.strokeCount != null && String(row.strokeCount) === needle) return true;
   return false;
}

function radicalChipHtml(row) {
   return (
      '<button type="button" class="radical-chip" data-radical="' + esc(row.radical) + '" aria-label="Clé ' +
      esc(row.radical) + (row.sens ? " · " + esc(row.sens) : "") + " · " + row.memberCount +
      ' caractère' + (row.memberCount > 1 ? "s" : "") + '">' +
      '<b lang="zh-Hans">' + esc(row.radical) + "</b>" +
      (row.sens ? "<span>" + esc(row.sens) + "</span>" : "") +
      "<small>" + row.memberCount + " caractère" + (row.memberCount > 1 ? "s" : "") + "</small>" +
      "</button>"
   );
}

function renderRadicalGroups() {
   const container = $("radical-groups");
   if (!container) return;
   const catalog = Array.isArray(radicalBrowser.catalog) ? radicalBrowser.catalog : [];
   const filtered = catalog.filter((row) => radicalMatchesFilter(row, radicalBrowser.filter));
   if (!filtered.length) {
      container.innerHTML = '<div class="search-empty"><p>Aucune clé ne correspond.</p></div>';
      return;
   }
   const groups = new Map();
   filtered.forEach((row) => {
      const key = row.strokeCount == null ? "unknown" : row.strokeCount;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
   });
   const orderedKeys = Array.from(groups.keys()).sort((left, right) => {
      if (left === "unknown") return 1;
      if (right === "unknown") return -1;
      return left - right;
   });
   container.innerHTML = orderedKeys
      .map((key) => {
         const rows = groups.get(key);
         return (
            '<section class="radical-group"><h3 class="eyebrow radical-group-heading">' +
            esc(radicalGroupHeading(key === "unknown" ? null : key)) + "</h3>" +
            '<div class="radical-grid">' + rows.map(radicalChipHtml).join("") + "</div></section>"
         );
      })
      .join("");
   container.querySelectorAll("[data-radical]").forEach((button) => {
      button.onclick = () => selectRadical(button.dataset.radical);
   });
}

function renderRadicalTable() {
   const panel = $("dradical-panel");
   if (!panel) return;
   const catalog = Array.isArray(radicalBrowser.catalog) ? radicalBrowser.catalog : [];
   if (!catalog.length) {
      panel.innerHTML =
         '<div class="search-empty error" role="alert"><b>Les clés n’ont pas pu être chargées.</b>' +
         '<button class="btn" id="radical-retry">Réessayer</button></div>';
      if ($("radical-retry")) $("radical-retry").onclick = () => openRadicalMode({ fromHistory: true });
      return;
   }
   const totalCharacters = catalog.reduce((total, row) => total + row.memberCount, 0);
   panel.innerHTML =
      '<div class="radical-toolbar"><input class="radical-filter-input" id="radical-filter" type="search" ' +
      'placeholder="Filtrer les clés (forme, sens, traits)…" value="' + esc(radicalBrowser.filter) +
      '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
      '<div class="radical-summary search-result-summary"><span>' + catalog.length + " clés · " +
      totalCharacters + " caractères</span></div>" +
      '<div class="radical-groups" id="radical-groups"></div>';
   const input = $("radical-filter");
   input.oninput = () => {
      radicalBrowser.filter = input.value;
      renderRadicalGroups();
   };
   renderRadicalGroups();
}

async function resolveRadicalMembers(radical) {
   if (radicalMembersCache.has(radical)) return radicalMembersCache.get(radical);
   const chunk = await loadRadicalCharacters(radical);
   const strokeByHanzi = new Map();
   const wanted = [];
   (chunk.characters || []).forEach((item) => {
      strokeByHanzi.set(item.hanzi, item.strokeCount == null ? null : item.strokeCount);
      wanted.push(item.hanzi);
   });
   const characterIndex = await loadDictionaryIndex("characters");
   const references = [];
   wanted.forEach((hanzi) => {
      const indexed = characterIndex[hanzi];
      if (indexed) references.push(indexed.entryRef);
   });
   const previews = await loadDictionaryPreviewsByReferences(references);
   const entries = previews.map((entry) =>
      Object.assign({}, entry, { __strokeCount: strokeByHanzi.has(entry.simplified) ? strokeByHanzi.get(entry.simplified) : null }),
   );
   radicalMembersCache.set(radical, entries);
   return entries;
}

async function selectRadical(radical, options) {
   const settings = options || {};
   setRadicalPanelVisible(true);
   if (!settings.fromHistory) history.pushState(radicalHistoryPayload(radical), "");
   radicalBrowser.radical = radical;
   radicalBrowser.visible = RADICAL_PAGE_SIZE;
   const panel = $("dradical-panel");
   if (panel) panel.innerHTML = radicalLoadingHtml("Chargement des caractères…");
   try {
      radicalBrowser.members = await resolveRadicalMembers(radical);
      if (radicalBrowser.active && radicalBrowser.radical === radical) renderRadicalMembers();
   } catch (error) {
      if (panel)
         panel.innerHTML =
            '<div class="search-empty error" role="alert"><b>Les caractères n’ont pas pu être chargés.</b>' +
            '<button class="btn" id="radical-retry">Réessayer</button></div>';
      if ($("radical-retry")) $("radical-retry").onclick = () => selectRadical(radical, { fromHistory: true });
   }
}

function openRadicalCharacterDetail(entry) {
   history.replaceState(radicalHistoryPayload(radicalBrowser.radical), "");
   history.pushState(searchHistoryPayload("detail", entry.id), "");
   openSearchDictionaryDetail(entry, false);
}

function renderRadicalMembers() {
   const panel = $("dradical-panel");
   if (!panel) return;
   const entries = Array.isArray(radicalBrowser.members) ? radicalBrowser.members : [];
   const visible = entries.slice(0, radicalBrowser.visible);
   const items = visible.map((entry) => ({
      entry,
      rank: {
         explanation:
            entry.__strokeCount != null
               ? entry.__strokeCount + " trait" + (entry.__strokeCount > 1 ? "s" : "")
               : "",
      },
   }));
   panel.innerHTML =
      '<button type="button" class="btn ghost radical-back" id="radical-back">← Retour aux clés</button>' +
      '<div class="radical-summary search-result-summary"><span>' + entries.length + " caractère" +
      (entries.length > 1 ? "s" : "") + " pour la clé " + esc(radicalBrowser.radical) + "</span></div>" +
      (items.map((item, index) => dictionaryResultHtml(item, index)).join("") ||
         '<div class="search-empty"><p>Aucun caractère.</p></div>') +
      (radicalBrowser.visible < entries.length
         ? '<div class="search-more"><button class="btn ghost" id="radical-show-more">Afficher plus</button></div>'
         : "");
   $("radical-back").onclick = () => backToRadicalTable();
   panel.querySelectorAll("[data-result-index]").forEach((button) => {
      button.onclick = () => {
         const entry = visible[Number(button.dataset.resultIndex)];
         const displayHanzi = dictionaryResultDisplayHanzi(entry);
         if (displayHanzi !== entry.simplified) entry.__selectedHanzi = displayHanzi;
         openRadicalCharacterDetail(entry);
      };
   });
   if ($("radical-show-more"))
      $("radical-show-more").onclick = () => {
         radicalBrowser.visible += RADICAL_PAGE_SIZE;
         renderRadicalMembers();
      };
}

function backToRadicalTable(options) {
   const settings = options || {};
   if (
      !settings.fromHistory &&
      history.state &&
      history.state.moStudioSearch &&
      history.state.mode === "radical" &&
      history.state.radical
   ) {
      history.back();
   } else {
      radicalBrowser.radical = null;
      renderRadicalTable();
   }
}

function exitRadicalMode(options) {
   const settings = options || {};
   if (!settings.fromHistory) writeSearchHistory(srch.q ? "results" : "landing", null, false);
   setRadicalPanelVisible(false);
}

                        $("tone-note").textContent =
                           "Juste ! C'était " +
                           tg[0] +
                           " " +
                           tg[1] +
                           " — " +
                           tg[2] +
                           ".";
                     else {
                        b.classList.add("ko");
                        $("tone-note").textContent =
                           "✗ C'était le ton " +
                           toneRound.tone +
                           " : " +
                           tg[0] +
                           " " +
                           tg[1] +
                           " — " +
                           tg[2] +
                           ".";
                     }
                     $("tone-go").hidden = false;
                  }),
            );
            $("tone-go").onclick = () => newToneRound(true);
            if (play) speak(toneRound.target[0]);
         }
         function pickDistractors(target, pool) {
            // pièges intelligents : syllabes proches, même initiale, même nombre de syllabes
            const sylCount = (s) =>
               String(s || "")
                  .trim()
                  .split(/\s+/)
                  .filter(Boolean).length;
            const tN = sylCount(target.py);
            const tIni = (flatten(target.py) || "")[0] || "";
            const tSyls = new Set(
               String(target.py || "")
                  .toLowerCase()
                  .split(/\s+/)
                  .map((x) => flatten(x))
                  .filter(Boolean),
            );
            return pool
               .filter((c) => c.id !== target.id)
               .map((c) => {
                  let s = Math.random();
                  if (sylCount(c.py) === tN) s += 2;
                  if (((flatten(c.py) || "")[0] || "") === tIni) s += 2;
                  if (
                     String(c.py || "")
                        .toLowerCase()
                        .split(/\s+/)
                        .some((x) => tSyls.has(flatten(x)))
                  )
                     s += 1.5;
                  if (c.cat && c.cat === target.cat) s += 1;
                  return [s, c];
               })
               .sort((a, b) => b[0] - a[0])
               .slice(0, 6)
               .map((x) => x[1])
               .sort(() => Math.random() - 0.5)
               .slice(0, 3);
         }
         function newWordRound(play) {
            const grid = $("word-grid");
            if (!grid || db.cards.length < 4) return;
            const target =
               db.cards[Math.floor(Math.random() * db.cards.length)];
            const opts = shuffle(
               [target].concat(pickDistractors(target, db.cards)),
            );
            wordRound = { target, done: false };
            const lvl = db.settings.listenLevel;
            grid.innerHTML = opts
               .map(
                  (c) =>
                     '<button class="opt" data-id="' +
                     c.id +
                     '">' +
                     (lvl !== 3
                        ? '<span class="o-hz">' + esc(c.hz) + "</span>"
                        : '<span class="o-hz" style="font-size:16px;font-family:var(--ui)">' +
                          esc(c.fr) +
                          "</span>") +
                     (lvl === 1
                        ? '<span class="o-fr">' + esc(c.fr) + "</span>"
                        : "") +
                     "</button>",
               )
               .join("");
            $("word-note").textContent =
               "Appuie sur le sceau, puis choisis le mot entendu.";
            $("word-go").hidden = true;
            grid.querySelectorAll(".opt").forEach(
               (b) =>
                  (b.onclick = () => {
                     if (wordRound.done) return;
                     wordRound.done = true;
                     const okBtn = grid.querySelector(
                        '[data-id="' + wordRound.target.id + '"]',
                     );
                     if (okBtn) okBtn.classList.add("ok");
                     const tg = wordRound.target;
                     if (b.dataset.id === tg.id)
                        $("word-note").textContent =
                           "Juste ! " + tg.hz + " (" + tg.py + ") · " + tg.fr;
                     else {
                        b.classList.add("ko");
                        const picked = db.cards.find(
                           (c) => c.id === b.dataset.id,
                        );
                        $("word-note").textContent =
                           "✗ C'était " +
                           tg.hz +
                           " (" +
                           tg.py +
                           ") · " +
                           tg.fr +
                           (picked
                              ? " — tu as choisi " +
                                picked.hz +
                                " (" +
                                picked.py +
                                ")."
                              : ".");
                     }
                     $("word-go").hidden = false;
                  }),
            );
            $("word-go").onclick = () => newWordRound(true);
            if (play) speak(target.hz);
         }
